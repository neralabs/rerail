 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc" d="M0 0L10 5L0 10z"/></marker><marker id="smcommandapersonruns-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hn" d="M0 0L10 5L0 10z"/></marker><pattern id="smcommandapersonruns-hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hxb"/><line x1="0" y1="0" x2="0" y2="6" class="hxl"/></pattern></defs><rect class="bx" x="14.0" y="4" width="146.3" height="42" rx="7"/><text class="b" x="87.1" y="22.0" text-anchor="middle" style="font-size:11.5px">started</text><rect class="bx" x="168.3" y="4" width="146.3" height="42" rx="7"/><text class="b" x="241.4" y="22.0" text-anchor="middle" style="font-size:11.5px">waiting on a lock</text><rect class="bx" x="322.6" y="4" width="146.3" height="42" rx="7"/><text class="b" x="395.7" y="22.0" text-anchor="middle" style="font-size:11.5px">waiting on a child</text><rect class="bx" x="476.9" y="4" width="146.3" height="42" rx="7"/><text class="b" x="550.0" y="22.0" text-anchor="middle" style="font-size:11.5px">waiting on the</text><text class="b" x="550.0" y="36.0" text-anchor="middle" style="font-size:11.5px">daemon</text><rect class="bx" x="631.1" y="4" width="146.3" height="42" rx="7"/><text class="b" x="704.3" y="22.0" text-anchor="middle" style="font-size:11.5px">retrying a held file</text><rect class="bx" x="785.4" y="4" width="146.3" height="42" rx="7"/><text class="b" x="858.6" y="22.0" text-anchor="middle" style="font-size:11.5px">done</text><rect class="bx" x="939.7" y="4" width="146.3" height="42" rx="7"/><text class="b" x="1012.9" y="22.0" text-anchor="middle" style="font-size:11.5px">failed</text><line class="life" x1="87.1" y1="46" x2="87.1" y2="307.0"/><line class="life" x1="241.4" y1="46" x2="241.4" y2="307.0"/><line class="life" x1="395.7" y1="46" x2="395.7" y2="307.0"/><line class="life" x1="550.0" y1="46" x2="550.0" y2="307.0"/><line class="life" x1="704.3" y1="46" x2="704.3" y2="307.0"/><line class="life" x1="858.6" y1="46" x2="858.6" y2="307.0"/><line class="life" x1="1012.9" y1="46" x2="1012.9" y2="307.0"/><g><title>CM1, started to waiting on a lock, fired by a clock: the packs lock (5 min), the start lock (15 s), polled Timers: B009 D70. Fact that could fire it: A blocking OS lock wait; the holder named at once. It a fact, one bound left.</title><line class="aclk" x1="91.1" y1="90" x2="235.4" y2="90" marker-end="url(#smcommandapersonruns-ac)"/><circle class="ck" cx="101.1" cy="90.0" r="5"/><path class="ck" d="M101.1 86.8V90.0H103.9"/><rect class="lbg" x="96.1" y="61.0" width="267.2" height="14" rx="3"/><text class="b" x="99.1" y="72.0" style="font-size:11.5px">CM1  5 min, 15 s</text><rect class="bg-p" x="214.4" y="61.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="220.4" y="72.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="96.1" y="96.0" width="60.5" height="13" rx="3"/><text class="t2" x="99.1" y="106.0" style="font-size:11px">B009 D70</text></g><g><title>CM2, started to waiting on a child, fired by a clock: npm, the registry, PowerShell, the registered hooks, the Orca CLI, scutil: each with its limit and a kill grace Timers: A114 A620 A621 A622 A623 B020 B023 B024 B030 B031 B223 D56 D57. Fact that could fire it: The child&#x27;s exit already ends each wait; the limits bound a child that hangs. It stays.</title><line class="aclk" x1="91.1" y1="137" x2="389.7" y2="137" marker-end="url(#smcommandapersonruns-ac)"/><circle class="ck" cx="101.1" cy="137.0" r="5"/><path class="ck" d="M101.1 133.8V137.0H103.9"/><rect class="lbg" x="96.1" y="108.0" width="94.8" height="14" rx="3"/><text class="b" x="99.1" y="119.0" style="font-size:11.5px">CM2  </text><rect class="bg-s" x="143.0" y="108.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="149.0" y="119.0" style="font-size:11px">stays</text><rect class="lbg" x="96.1" y="143.0" width="406.7" height="13" rx="3"/><text class="t2" x="99.1" y="153.0" style="font-size:11px">A114 A620 A621 A622 A623 B020 B023 B024 B030 B031 B223 D56 D57</text></g><g><title>CM3, started to waiting on the daemon, fired by a clock: status, session, scan --wait and support-bundle read the daemon with 2 to 10 s limits; scan --wait polls every 250 ms Timers: A106 B002 B032 B033 B034 B035 B626 D60. Fact that could fire it: A held request answered when the scan ends; one read where two were made. It a fact, one bound left.</title><line class="aclk" x1="91.1" y1="184" x2="544.0" y2="184" marker-end="url(#smcommandapersonruns-ac)"/><circle class="ck" cx="101.1" cy="184.0" r="5"/><path class="ck" d="M101.1 180.8V184.0H103.9"/><rect class="lbg" x="96.1" y="155.0" width="307.4" height="14" rx="3"/><text class="b" x="99.1" y="166.0" style="font-size:11.5px">CM3  2 to 10 s, 250 ms</text><rect class="bg-p" x="254.5" y="155.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="260.5" y="166.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="96.1" y="190.0" width="252.7" height="13" rx="3"/><text class="t2" x="99.1" y="200.0" style="font-size:11px">A106 B002 B032 B033 B034 B035 B626 D60</text></g><g><title>CM4, started to retrying a held file, fired by a clock: on Windows a rename or removal of a file another program holds is retried 50 ms to 1 s apart, 2 to 10 s in all Timers: B013 B014 B015 B016 B017 B043 B045 D48 D49 D50 D51. Fact that could fire it: POSIX-semantics rename and delete where the holder shares delete access; none for a holder that does not (to settle by a Windows run). It needs a run.</title><line class="aclk" x1="91.1" y1="231" x2="698.3" y2="231" marker-end="url(#smcommandapersonruns-ac)"/><circle class="ck" cx="101.1" cy="231.0" r="5"/><path class="ck" d="M101.1 227.8V231.0H103.9"/><rect class="lbg" x="96.1" y="202.0" width="265.9" height="14" rx="3"/><text class="b" x="99.1" y="213.0" style="font-size:11.5px">CM4  50 ms, 1 s, 2 to 10 s</text><rect class="bg-r" x="273.7" y="202.0" width="85.3" height="15" rx="7.5"/><text class="tb-r b" x="279.7" y="213.0" style="font-size:11px">needs a run</text><rect class="lbg" x="96.1" y="237.0" width="330.6" height="13" rx="3"/><text class="t2" x="99.1" y="247.0" style="font-size:11px">B013 B014 B015 B016 B017 B043 B045 D48 D49 D50 D51</text></g><g><title>CM5, started to started, fired by a clock: progress lines: a tick each second on a terminal, a warning when npm or the registry is silent for 30 s to 3 min Timers: A409 A410 B019 B021 B022. Fact that could fire it: The time itself is what is shown. It stays.</title><path class="aclk" d="M90.1 270C133.1 270 133.1 286 92.1 286" marker-end="url(#smcommandapersonruns-ac)"/><circle class="ck" cx="101.1" cy="278.0" r="5"/><path class="ck" d="M101.1 274.8V278.0H103.9"/><rect class="lbg" x="136.1" y="249.0" width="166.2" height="14" rx="3"/><text class="b" x="139.1" y="260.0" style="font-size:11.5px">CM5  30 s, 3 min</text><rect class="bg-s" x="254.4" y="249.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="260.4" y="260.0" style="font-size:11px">stays</text><rect class="lbg" x="136.1" y="284.0" width="162.6" height="13" rx="3"/><text class="t2" x="139.1" y="294.0" style="font-size:11px">A409 A410 B019 B021 B022</text></g></svg>
