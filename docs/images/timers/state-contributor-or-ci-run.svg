 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc" d="M0 0L10 5L0 10z"/></marker><marker id="smcontributororcirun-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hn" d="M0 0L10 5L0 10z"/></marker><pattern id="smcontributororcirun-hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hxb"/><line x1="0" y1="0" x2="0" y2="6" class="hxl"/></pattern></defs><rect class="bx" x="14.0" y="4" width="172.0" height="42" rx="7"/><text class="b" x="100.0" y="22.0" text-anchor="middle" style="font-size:11.5px">started</text><rect class="bx" x="194.0" y="4" width="172.0" height="42" rx="7"/><text class="b" x="280.0" y="22.0" text-anchor="middle" style="font-size:11.5px">waiting on a registry</text><rect class="bx" x="374.0" y="4" width="172.0" height="42" rx="7"/><text class="b" x="460.0" y="22.0" text-anchor="middle" style="font-size:11.5px">step running</text><rect class="bx" x="554.0" y="4" width="172.0" height="42" rx="7"/><text class="b" x="640.0" y="22.0" text-anchor="middle" style="font-size:11.5px">waiting on a cloud</text><text class="b" x="640.0" y="36.0" text-anchor="middle" style="font-size:11.5px">machine</text><rect class="bx" x="734.0" y="4" width="172.0" height="42" rx="7"/><text class="b" x="820.0" y="22.0" text-anchor="middle" style="font-size:11.5px">retrying the network</text><rect class="bx" x="914.0" y="4" width="172.0" height="42" rx="7"/><text class="b" x="1000.0" y="22.0" text-anchor="middle" style="font-size:11.5px">done</text><line class="life" x1="100.0" y1="46" x2="100.0" y2="401.0"/><line class="life" x1="280.0" y1="46" x2="280.0" y2="401.0"/><line class="life" x1="460.0" y1="46" x2="460.0" y2="401.0"/><line class="life" x1="640.0" y1="46" x2="640.0" y2="401.0"/><line class="life" x1="820.0" y1="46" x2="820.0" y2="401.0"/><line class="life" x1="1000.0" y1="46" x2="1000.0" y2="401.0"/><g><title>CI1, started to waiting on a registry, fired by a clock: the local registry (Verdaccio) is pinged every 1 s up to 120 to 180 s Timers: A815 A828 B614 B615. Fact that could fire it: Its process&#x27;s end or its listening line. It becomes a fact.</title><line class="aclk" x1="104.0" y1="90" x2="274.0" y2="90" marker-end="url(#smcontributororcirun-ac)"/><circle class="ck" cx="114.0" cy="90.0" r="5"/><path class="ck" d="M114.0 86.8V90.0H116.8"/><rect class="lbg" x="109.0" y="61.0" width="256.2" height="14" rx="3"/><text class="b" x="112.0" y="72.0" style="font-size:11.5px">CI1  1 s, 120 to 180 s</text><rect class="bg-f" x="256.2" y="61.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="262.2" y="72.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="109.0" y="96.0" width="130.6" height="13" rx="3"/><text class="t2" x="112.0" y="106.0" style="font-size:11px">A815 A828 B614 B615</text></g><g><title>CI2, step running to done, fired by a clock: each step, hook, stop and agent run is bounded (60 s to 15 min) with a kill grace Timers: A816 A817 A818 A819 A820 A822 A824 A825 A826 A827 A830 A831 A832 A833 A834 A835 A836 A837 A838 A839 D77. Fact that could fire it: The exit already ends each; the limits bound a stalled provider or a hang the step looks for. It stays.</title><line class="aclk" x1="464.0" y1="137" x2="994.0" y2="137" marker-end="url(#smcontributororcirun-ac)"/><circle class="ck" cx="474.0" cy="137.0" r="5"/><path class="ck" d="M474.0 133.8V137.0H476.8"/><rect class="lbg" x="428.3" y="108.0" width="167.0" height="14" rx="3"/><text class="b" x="431.3" y="119.0" style="font-size:11.5px">CI2  60 s, 15 min</text><rect class="bg-s" x="547.4" y="108.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="553.4" y="119.0" style="font-size:11px">stays</text><rect class="lbg" x="428.3" y="143.0" width="668.7" height="13" rx="3"/><text class="t2" x="431.3" y="153.0" style="font-size:11px">A816 A817 A818 A819 A820 A822 A824 A825 A826 A827 A830 A831 A832 A833 A834 A835 A836 A837 A838 A839 D77</text></g><g><title>CI3, waiting on a cloud machine to done, fired by a clock: a Windows guest&#x27;s test run is found ended by a 60 min deadline and 20 s polls of Azure Timers: A823 A841 A842 A843 A844 A845. Fact that could fire it: The scheduled task&#x27;s own end, read by a second run command. It a fact, one bound left.</title><line class="aclk" x1="644.0" y1="184" x2="994.0" y2="184" marker-end="url(#smcontributororcirun-ac)"/><circle class="ck" cx="654.0" cy="184.0" r="5"/><path class="ck" d="M654.0 180.8V184.0H656.8"/><rect class="lbg" x="649.0" y="155.0" width="268.1" height="14" rx="3"/><text class="b" x="652.0" y="166.0" style="font-size:11.5px">CI3  60 min, 20 s</text><rect class="bg-p" x="768.1" y="155.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="774.1" y="166.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="649.0" y="190.0" width="194.6" height="13" rx="3"/><text class="t2" x="652.0" y="200.0" style="font-size:11px">A823 A841 A842 A843 A844 A845</text></g><g><title>CI4, retrying the network to step running, fired by a clock: a network call that failed is tried again after a pause Timers: A810 A812 A813 A814 A821 B607 B608 B618 B619 B620 B621 B622 B623 B624 B625. Fact that could fire it: None: a remote server&#x27;s passing fault has no event. It stays.</title><line class="aclk" x1="816.0" y1="231" x2="466.0" y2="231" marker-end="url(#smcontributororcirun-ac)"/><circle class="ck" cx="806.0" cy="231.0" r="5"/><path class="ck" d="M806.0 227.8V231.0H808.8"/><rect class="lbg" x="469.0" y="202.0" width="87.7" height="14" rx="3"/><text class="b" x="472.0" y="213.0" style="font-size:11.5px">CI4  </text><rect class="bg-s" x="508.7" y="202.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="514.7" y="213.0" style="font-size:11px">stays</text><rect class="lbg" x="469.0" y="237.0" width="482.9" height="13" rx="3"/><text class="t2" x="472.0" y="247.0" style="font-size:11px">A810 A812 A813 A814 A821 B607 B608 B618 B619 B620 B621 B622 B623 B624 B625</text></g><g><title>CI5, done to done, fired by a clock: cloud results and machines kept for a window, then removed Timers: A811 A829 A840 A846 A847. Fact that could fire it: None: a retention window answers a person&#x27;s question. It stays.</title><path class="aclk" d="M1003.0 270C1046.0 270 1046.0 286 1005.0 286" marker-end="url(#smcontributororcirun-ac)"/><circle class="ck" cx="1014.0" cy="278.0" r="5"/><path class="ck" d="M1014.0 274.8V278.0H1016.8"/><rect class="lbg" x="832.4" y="249.0" width="87.7" height="14" rx="3"/><text class="b" x="835.4" y="260.0" style="font-size:11.5px">CI5  </text><rect class="bg-s" x="872.2" y="249.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="878.2" y="260.0" style="font-size:11px">stays</text><rect class="lbg" x="832.4" y="284.0" width="162.6" height="13" rx="3"/><text class="t2" x="835.4" y="294.0" style="font-size:11px">A811 A829 A840 A846 A847</text></g><g><title>CI6, started to done, fired by a clock: a dev daemon is started, probed and stopped by polls, graces and probe limits Timers: B600 B601 B602 B603 B604 B605 B606 B609 B610 B611 B612 B613 D62. Fact that could fire it: `rerail daemon start` already waits for readiness; `rerail daemon stop` already waits for the exit. It a fact, one bound left.</title><line class="aclk" x1="104.0" y1="325" x2="994.0" y2="325" marker-end="url(#smcontributororcirun-ac)"/><circle class="ck" cx="114.0" cy="325.0" r="5"/><path class="ck" d="M114.0 321.8V325.0H116.8"/><rect class="lbg" x="109.0" y="296.0" width="188.7" height="14" rx="3"/><text class="b" x="112.0" y="307.0" style="font-size:11.5px">CI6  </text><rect class="bg-p" x="148.7" y="296.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="154.7" y="307.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="109.0" y="331.0" width="412.8" height="13" rx="3"/><text class="t2" x="112.0" y="341.0" style="font-size:11px">B600 B601 B602 B603 B604 B605 B606 B609 B610 B611 B612 B613 D62</text></g><g><title>CI7, started to done, fired by a clock: the docs site&#x27;s copy label and the guidance review&#x27;s save Timers: B616 B617. Fact that could fire it: pointerleave and blur; change and pagehide. It becomes a fact.</title><line class="aclk" x1="104.0" y1="372" x2="994.0" y2="372" marker-end="url(#smcontributororcirun-ac)"/><circle class="ck" cx="114.0" cy="372.0" r="5"/><path class="ck" d="M114.0 368.8V372.0H116.8"/><rect class="lbg" x="109.0" y="343.0" width="148.7" height="14" rx="3"/><text class="b" x="112.0" y="354.0" style="font-size:11.5px">CI7  </text><rect class="bg-f" x="148.7" y="343.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="154.7" y="354.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="109.0" y="378.0" width="66.6" height="13" rx="3"/><text class="t2" x="112.0" y="388.0" style="font-size:11px">B616 B617</text></g></svg>
