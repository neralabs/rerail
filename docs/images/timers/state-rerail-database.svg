<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="327" viewBox="-16 -16 1132 327" role="img" aria-label="The Rerail database: 5 states and 5 changes, 5 fired by a clock and 0 by a fact. Each change is an arrow; its table follows."><title>The Rerail database: 5 states and 5 changes, 5 fired by a clock and 0 by a fact. Each change is an arrow; its table follows.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#0b0b0b}.t2{fill:#52514e}.b{font-weight:650}.tf{fill:#2a78d6;font-weight:650}.tb-f{fill:#fff}.tb-p,.tb-s,.tb-r{fill:#0b0b0b}.bx{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:1.25}.ct{fill:none;stroke:#52514e;stroke-dasharray:2 3}.chip{fill:#fcfcfb;stroke:#c3c2b7}.ln{fill:none;stroke:#52514e;stroke-width:1.3}.hn{fill:#52514e}.hf{fill:#2a78d6}.hc{fill:#eb6834}.afct{fill:none;stroke:#2a78d6;stroke-width:2}.aclk{fill:none;stroke:#eb6834;stroke-width:2;stroke-dasharray:6 4}.ck{fill:#fcfcfb;stroke:#eb6834;stroke-width:1.4}.life{stroke:#e1e0d9;stroke-width:1.5}.lbg{fill:#fcfcfb;opacity:.92}.grid{stroke:#e1e0d9}.bg-f{fill:#2a78d6}.bg-p{fill:#fcfcfb;stroke:#2a78d6;stroke-width:1.5}.bg-s{fill:#b4b2aa}.bg-r{fill:#fcfcfb;stroke:#7d7b74;stroke-dasharray:3 2}.s-go,.s-fact{fill:#2a78d6}.s-go2{fill:#2a78d6;fill-opacity:.42}.s-clk{fill:#eb6834}.s-clk.o{fill-opacity:.35;stroke:#eb6834;stroke-dasharray:4 3;stroke-width:1.3}.s-clk2{fill:#eb6834;fill-opacity:.42}.s-stay{fill:#7d7b74}.s-stay2{fill:#b4b2aa}.s-neu{fill:#b4b2aa}.s-al-hx,.s-run-hx{stroke:#7d7b74;stroke-width:1}.hxb{fill:#fcfcfb}.hxl{stroke:#7d7b74;stroke-width:2}.s-al-hx{stroke:#2a78d6}</style><rect x="-15.5" y="-15.5" width="1131" height="326" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/><defs><marker id="smreraildatabase-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hf" d="M0 0L10 5L0 10z"/></marker><marker id="smreraildatabase-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc" d="M0 0L10 5L0 10z"/></marker><marker id="smreraildatabase-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hn" d="M0 0L10 5L0 10z"/></marker><pattern id="smreraildatabase-hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hxb"/><line x1="0" y1="0" x2="0" y2="6" class="hxl"/></pattern></defs><rect class="bx" x="14.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="118.0" y="22.0" text-anchor="middle" style="font-size:11.5px">closed</text><rect class="bx" x="230.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="334.0" y="22.0" text-anchor="middle" style="font-size:11.5px">open</text><rect class="bx" x="446.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="550.0" y="22.0" text-anchor="middle" style="font-size:11.5px">written by the daemon</text><rect class="bx" x="662.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="766.0" y="22.0" text-anchor="middle" style="font-size:11.5px">held by another process</text><rect class="bx" x="878.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="982.0" y="22.0" text-anchor="middle" style="font-size:11.5px">moving audits</text><line class="life" x1="118.0" y1="32" x2="118.0" y2="293.0"/><line class="life" x1="334.0" y1="32" x2="334.0" y2="293.0"/><line class="life" x1="550.0" y1="32" x2="550.0" y2="293.0"/><line class="life" x1="766.0" y1="32" x2="766.0" y2="293.0"/><line class="life" x1="982.0" y1="32" x2="982.0" y2="293.0"/><g><title>DB1, closed to open, fired by a clock: the first writable open switches the file to WAL, retried up to 100 times (10 ms plus 5 ms per try) when two openers race Timers: B213. Fact that could fire it: None across processes; once per file. It stays.</title><line class="aclk" x1="122.0" y1="76" x2="328.0" y2="76" marker-end="url(#smreraildatabase-ac)"/><circle class="ck" cx="132.0" cy="76.0" r="5"/><path class="ck" d="M132.0 72.8V76.0H134.8"/><rect class="lbg" x="127.0" y="47.0" width="171.3" height="14" rx="3"/><text class="b" x="130.0" y="58.0" style="font-size:11.5px">DB1  10 ms, 5 ms</text><rect class="bg-s" x="250.4" y="47.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="256.4" y="58.0" style="font-size:11px">stays</text><rect class="lbg" x="127.0" y="82.0" width="34.5" height="13" rx="3"/><text class="t2" x="130.0" y="92.0" style="font-size:11px">B213</text></g><g><title>DB2, held by another process to written by the daemon, fired by a clock: rerail reset, scrub, uninstall or an upgrade&#x27;s migration holds the lock; commands and the daemon wait 5 to 10 s each Timers: B029 B036 B037 B038 B039 D38. Fact that could fire it: With every long write going through the daemon, one process owns the writes; scrub waits for a ledger line by an append lock. It a fact, one bound left.</title><line class="aclk" x1="762.0" y1="123" x2="556.0" y2="123" marker-end="url(#smreraildatabase-ac)"/><circle class="ck" cx="752.0" cy="123.0" r="5"/><path class="ck" d="M752.0 119.8V123.0H754.8"/><rect class="lbg" x="559.0" y="94.0" width="250.6" height="14" rx="3"/><text class="b" x="562.0" y="105.0" style="font-size:11.5px">DB2  5 to 10 s</text><rect class="bg-p" x="660.6" y="94.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="666.6" y="105.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="559.0" y="129.0" width="188.6" height="13" rx="3"/><text class="t2" x="562.0" y="139.0" style="font-size:11px">B029 B036 B037 B038 B039 D38</text></g><g><title>DB3, open to moving audits, fired by a clock: after an upgrade the daemon&#x27;s worker moves audit rule provenance in paced batches, after a 7-day window Timers: B214 B215 B216 B217 B218 B219. Fact that could fire it: The pacing is what lets other writers in; the WAL truncate retry can go to journal_size_limit. It a fact, one bound left.</title><line class="aclk" x1="338.0" y1="170" x2="976.0" y2="170" marker-end="url(#smreraildatabase-ac)"/><circle class="ck" cx="348.0" cy="170.0" r="5"/><path class="ck" d="M348.0 166.8V170.0H350.8"/><rect class="lbg" x="343.0" y="141.0" width="194.3" height="14" rx="3"/><text class="b" x="346.0" y="152.0" style="font-size:11.5px">DB3  </text><rect class="bg-p" x="388.3" y="141.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="394.3" y="152.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="343.0" y="176.0" width="194.7" height="13" rx="3"/><text class="t2" x="346.0" y="186.0" style="font-size:11px">B214 B215 B216 B217 B218 B219</text></g><g><title>DB4, open to open, fired by a clock: the remote sink (an experiment) syncs every 10 s, backs off up to 5 min, holds a 2 min lock lease Timers: A613 A614 A615 A616 A617 A618 A619 D27 D28. Fact that could fire it: Events and audits the daemon records could start a sync (to settle by a run). It needs a run.</title><path class="aclk" d="M337.0 209C380.0 209 380.0 225 339.0 225" marker-end="url(#smreraildatabase-ac)"/><circle class="ck" cx="348.0" cy="217.0" r="5"/><path class="ck" d="M348.0 213.8V217.0H350.8"/><rect class="lbg" x="383.0" y="188.0" width="249.5" height="14" rx="3"/><text class="b" x="386.0" y="199.0" style="font-size:11.5px">DB4  10 s, 5 min, 2 min</text><rect class="bg-r" x="544.2" y="188.0" width="85.3" height="15" rx="7.5"/><text class="tb-r b" x="550.2" y="199.0" style="font-size:11px">needs a run</text><rect class="lbg" x="383.0" y="223.0" width="278.5" height="13" rx="3"/><text class="t2" x="386.0" y="233.0" style="font-size:11px">A613 A614 A615 A616 A617 A618 A619 D27 D28</text></g><g><title>DB5, open to open, fired by a clock: the set-up stores (status line and settings entries) wait 100 ms on a read and 5 s on a write Timers: B025 B026 B027 B028. Fact that could fire it: None across processes; the waits are below notice or rare. It stays.</title><path class="aclk" d="M337.0 256C380.0 256 380.0 272 339.0 272" marker-end="url(#smreraildatabase-ac)"/><circle class="ck" cx="348.0" cy="264.0" r="5"/><path class="ck" d="M348.0 260.8V264.0H350.8"/><rect class="lbg" x="383.0" y="235.0" width="167.3" height="14" rx="3"/><text class="b" x="386.0" y="246.0" style="font-size:11.5px">DB5  100 ms, 5 s</text><rect class="bg-s" x="502.4" y="235.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="508.4" y="246.0" style="font-size:11px">stays</text><rect class="lbg" x="383.0" y="270.0" width="130.6" height="13" rx="3"/><text class="t2" x="386.0" y="280.0" style="font-size:11px">B025 B026 B027 B028</text></g></svg>
