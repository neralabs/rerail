<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="275" viewBox="-16 -16 1132 275" role="img" aria-label="A checkout: 3 states and 5 changes, 1 fired by a clock and 4 by a fact. Each change is an arrow; its table follows."><title>A checkout: 3 states and 5 changes, 1 fired by a clock and 4 by a fact. Each change is an arrow; its table follows.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#0b0b0b}.t2{fill:#52514e}.b{font-weight:650}.tf{fill:#2a78d6;font-weight:650}.tb-f{fill:#fff}.tb-p,.tb-s,.tb-r{fill:#0b0b0b}.bx{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:1.25}.ct{fill:none;stroke:#52514e;stroke-dasharray:2 3}.chip{fill:#fcfcfb;stroke:#c3c2b7}.ln{fill:none;stroke:#52514e;stroke-width:1.3}.hn{fill:#52514e}.hf{fill:#2a78d6}.hc{fill:#eb6834}.afct{fill:none;stroke:#2a78d6;stroke-width:2}.aclk{fill:none;stroke:#eb6834;stroke-width:2;stroke-dasharray:6 4}.ck{fill:#fcfcfb;stroke:#eb6834;stroke-width:1.4}.life{stroke:#e1e0d9;stroke-width:1.5}.lbg{fill:#fcfcfb;opacity:.92}.grid{stroke:#e1e0d9}.bg-f{fill:#2a78d6}.bg-p{fill:#fcfcfb;stroke:#2a78d6;stroke-width:1.5}.bg-s{fill:#b4b2aa}.bg-r{fill:#fcfcfb;stroke:#7d7b74;stroke-dasharray:3 2}.s-go,.s-fact{fill:#2a78d6}.s-go2{fill:#2a78d6;fill-opacity:.42}.s-clk{fill:#eb6834}.s-clk.o{fill-opacity:.35;stroke:#eb6834;stroke-dasharray:4 3;stroke-width:1.3}.s-clk2{fill:#eb6834;fill-opacity:.42}.s-stay{fill:#7d7b74}.s-stay2{fill:#b4b2aa}.s-neu{fill:#b4b2aa}.s-al-hx,.s-run-hx{stroke:#7d7b74;stroke-width:1}.hxb{fill:#fcfcfb}.hxl{stroke:#7d7b74;stroke-width:2}.s-al-hx{stroke:#2a78d6}</style><rect x="-15.5" y="-15.5" width="1131" height="274" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/><defs><marker id="smcheckout-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hf" d="M0 0L10 5L0 10z"/></marker><marker id="smcheckout-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc" d="M0 0L10 5L0 10z"/></marker><marker id="smcheckout-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hn" d="M0 0L10 5L0 10z"/></marker><pattern id="smcheckout-hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hxb"/><line x1="0" y1="0" x2="0" y2="6" class="hxl"/></pattern></defs><rect class="bx" x="14.0" y="4" width="352.0" height="28" rx="7"/><text class="b" x="190.0" y="22.0" text-anchor="middle" style="font-size:11.5px">never set up</text><rect class="bx" x="374.0" y="4" width="352.0" height="28" rx="7"/><text class="b" x="550.0" y="22.0" text-anchor="middle" style="font-size:11.5px">stopped</text><rect class="bx" x="734.0" y="4" width="352.0" height="28" rx="7"/><text class="b" x="910.0" y="22.0" text-anchor="middle" style="font-size:11.5px">started</text><line class="life" x1="190.0" y1="32" x2="190.0" y2="241.0"/><line class="life" x1="550.0" y1="32" x2="550.0" y2="241.0"/><line class="life" x1="910.0" y1="32" x2="910.0" y2="241.0"/><g><title>CK1, never set up to started, fired by a fact: `rerail start` or `rerail setup` in the checkout writes its start rows</title><line class="afct" x1="194.0" y1="76" x2="904.0" y2="76" marker-end="url(#smcheckout-af)"/><rect class="lbg" x="199.0" y="47.0" width="130.6" height="14" rx="3"/><text class="b" x="202.0" y="58.0" style="font-size:11.5px">CK1  fired by a fact</text></g><g><title>CK2, started to stopped, fired by a fact: `rerail stop` writes started = false for the checkout or the whole repository</title><line class="afct" x1="906.0" y1="110" x2="556.0" y2="110" marker-end="url(#smcheckout-af)"/><rect class="lbg" x="559.0" y="81.0" width="130.6" height="14" rx="3"/><text class="b" x="562.0" y="92.0" style="font-size:11.5px">CK2  fired by a fact</text></g><g><title>CK3, stopped to started, fired by a fact: `rerail start` writes started = true</title><line class="afct" x1="554.0" y1="144" x2="904.0" y2="144" marker-end="url(#smcheckout-af)"/><rect class="lbg" x="559.0" y="115.0" width="130.6" height="14" rx="3"/><text class="b" x="562.0" y="126.0" style="font-size:11.5px">CK3  fired by a fact</text></g><g><title>CK4, started to stopped, fired by a fact: the daemon&#x27;s sessions learn a stop: each event reads the start rows before it records anything</title><line class="afct" x1="906.0" y1="178" x2="556.0" y2="178" marker-end="url(#smcheckout-af)"/><rect class="lbg" x="559.0" y="149.0" width="130.6" height="14" rx="3"/><text class="b" x="562.0" y="160.0" style="font-size:11.5px">CK4  fired by a fact</text></g><g><title>CK5, started to started, fired by a clock: a scan request or a setting written through the daemon&#x27;s API reaches the session at the runtime&#x27;s next 250 ms poll Timers: A408 D24 D25 D26. Fact that could fire it: The API handler that wrote it runs in the same process: it can tell the session at once. It becomes a fact.</title><path class="aclk" d="M913.0 204C956.0 204 956.0 220 915.0 220" marker-end="url(#smcheckout-ac)"/><circle class="ck" cx="924.0" cy="212.0" r="5"/><path class="ck" d="M924.0 208.8V212.0H926.8"/><rect class="lbg" x="704.8" y="183.0" width="200.2" height="14" rx="3"/><text class="b" x="707.8" y="194.0" style="font-size:11.5px">CK5  250 ms</text><rect class="bg-f" x="796.0" y="183.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="802.0" y="194.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="704.8" y="218.0" width="112.4" height="13" rx="3"/><text class="t2" x="707.8" y="228.0" style="font-size:11px">A408 D24 D25 D26</text></g></svg>
