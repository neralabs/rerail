<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="704" viewBox="-16 -16 1132 704" role="img" aria-label="The content store: 8 states and 13 changes, 8 fired by a clock and 5 by a fact. Each change is an arrow; its table follows."><title>The content store: 8 states and 13 changes, 8 fired by a clock and 5 by a fact. Each change is an arrow; its table follows.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#0b0b0b}.t2{fill:#52514e}.b{font-weight:650}.tf{fill:#2a78d6;font-weight:650}.tb-f{fill:#fff}.tb-p,.tb-s,.tb-r{fill:#0b0b0b}.bx{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:1.25}.ct{fill:none;stroke:#52514e;stroke-dasharray:2 3}.chip{fill:#fcfcfb;stroke:#c3c2b7}.ln{fill:none;stroke:#52514e;stroke-width:1.3}.hn{fill:#52514e}.hf{fill:#2a78d6}.hc{fill:#eb6834}.afct{fill:none;stroke:#2a78d6;stroke-width:2}.aclk{fill:none;stroke:#eb6834;stroke-width:2;stroke-dasharray:6 4}.ck{fill:#fcfcfb;stroke:#eb6834;stroke-width:1.4}.life{stroke:#e1e0d9;stroke-width:1.5}.lbg{fill:#fcfcfb;opacity:.92}.grid{stroke:#e1e0d9}.bg-f{fill:#2a78d6}.bg-p{fill:#fcfcfb;stroke:#2a78d6;stroke-width:1.5}.bg-s{fill:#b4b2aa}.bg-r{fill:#fcfcfb;stroke:#7d7b74;stroke-dasharray:3 2}.s-go,.s-fact{fill:#2a78d6}.s-go2{fill:#2a78d6;fill-opacity:.42}.s-clk{fill:#eb6834}.s-clk.o{fill-opacity:.35;stroke:#eb6834;stroke-dasharray:4 3;stroke-width:1.3}.s-clk2{fill:#eb6834;fill-opacity:.42}.s-stay{fill:#7d7b74}.s-stay2{fill:#b4b2aa}.s-neu{fill:#b4b2aa}.s-al-hx,.s-run-hx{stroke:#7d7b74;stroke-width:1}.hxb{fill:#fcfcfb}.hxl{stroke:#7d7b74;stroke-width:2}.s-al-hx{stroke:#2a78d6}</style><rect x="-15.5" y="-15.5" width="1131" height="703" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/><defs><marker id="smcontentstore-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hf" d="M0 0L10 5L0 10z"/></marker><marker id="smcontentstore-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc" d="M0 0L10 5L0 10z"/></marker><marker id="smcontentstore-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hn" d="M0 0L10 5L0 10z"/></marker><pattern id="smcontentstore-hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hxb"/><line x1="0" y1="0" x2="0" y2="6" class="hxl"/></pattern></defs><rect class="bx" x="14.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="77.5" y="22.0" text-anchor="middle" style="font-size:11.5px">closed</text><rect class="bx" x="149.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="212.5" y="22.0" text-anchor="middle" style="font-size:11.5px">open</text><rect class="bx" x="284.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="347.5" y="22.0" text-anchor="middle" style="font-size:11.5px">being written</text><rect class="bx" x="419.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="482.5" y="22.0" text-anchor="middle" style="font-size:11.5px">waiting for the</text><text class="b" x="482.5" y="36.0" text-anchor="middle" style="font-size:11.5px">write lock</text><rect class="bx" x="554.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="617.5" y="22.0" text-anchor="middle" style="font-size:11.5px">reuse paused</text><rect class="bx" x="689.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="752.5" y="22.0" text-anchor="middle" style="font-size:11.5px">maintenance</text><text class="b" x="752.5" y="36.0" text-anchor="middle" style="font-size:11.5px">wake</text><rect class="bx" x="824.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="887.5" y="22.0" text-anchor="middle" style="font-size:11.5px">being collected</text><rect class="bx" x="959.0" y="4" width="127.0" height="42" rx="7"/><text class="b" x="1022.5" y="22.0" text-anchor="middle" style="font-size:11.5px">rebuilt</text><line class="life" x1="77.5" y1="46" x2="77.5" y2="618.0"/><line class="life" x1="212.5" y1="46" x2="212.5" y2="618.0"/><line class="life" x1="347.5" y1="46" x2="347.5" y2="618.0"/><line class="life" x1="482.5" y1="46" x2="482.5" y2="618.0"/><line class="life" x1="617.5" y1="46" x2="617.5" y2="618.0"/><line class="life" x1="752.5" y1="46" x2="752.5" y2="618.0"/><line class="life" x1="887.5" y1="46" x2="887.5" y2="618.0"/><line class="life" x1="1022.5" y1="46" x2="1022.5" y2="618.0"/><rect class="bx" x="14.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="77.5" y="640.0" text-anchor="middle" style="font-size:11.5px">closed</text><rect class="bx" x="149.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="212.5" y="640.0" text-anchor="middle" style="font-size:11.5px">open</text><rect class="bx" x="284.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="347.5" y="640.0" text-anchor="middle" style="font-size:11.5px">being written</text><rect class="bx" x="419.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="482.5" y="640.0" text-anchor="middle" style="font-size:11.5px">waiting for the</text><text class="b" x="482.5" y="654.0" text-anchor="middle" style="font-size:11.5px">write lock</text><rect class="bx" x="554.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="617.5" y="640.0" text-anchor="middle" style="font-size:11.5px">reuse paused</text><rect class="bx" x="689.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="752.5" y="640.0" text-anchor="middle" style="font-size:11.5px">maintenance</text><text class="b" x="752.5" y="654.0" text-anchor="middle" style="font-size:11.5px">wake</text><rect class="bx" x="824.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="887.5" y="640.0" text-anchor="middle" style="font-size:11.5px">being collected</text><rect class="bx" x="959.0" y="622" width="127.0" height="42" rx="7"/><text class="b" x="1022.5" y="640.0" text-anchor="middle" style="font-size:11.5px">rebuilt</text><g><title>ST1, closed to open, fired by a fact: the first workspace attach opens the store and starts its maintenance thread</title><line class="afct" x1="81.5" y1="90" x2="206.5" y2="90" marker-end="url(#smcontentstore-af)"/><rect class="lbg" x="86.5" y="61.0" width="129.4" height="14" rx="3"/><text class="b" x="89.5" y="72.0" style="font-size:11.5px">ST1  fired by a fact</text></g><g><title>ST2, open to being written, fired by a fact: a writer takes the write lock (an apply&#x27;s publication, an attach&#x27;s batch, a renewal, a collection)</title><line class="afct" x1="216.5" y1="124" x2="341.5" y2="124" marker-end="url(#smcontentstore-af)"/><rect class="lbg" x="221.5" y="95.0" width="129.4" height="14" rx="3"/><text class="b" x="224.5" y="106.0" style="font-size:11.5px">ST2  fired by a fact</text></g><g><title>ST3, being written to open, fired by a fact: the writer commits</title><line class="afct" x1="343.5" y1="158" x2="218.5" y2="158" marker-end="url(#smcontentstore-af)"/><rect class="lbg" x="221.5" y="129.0" width="129.4" height="14" rx="3"/><text class="b" x="224.5" y="140.0" style="font-size:11.5px">ST3  fired by a fact</text></g><g><title>ST4, open to waiting for the write lock, fired by a clock: a writer finds the lock held: polls SQLite 1 to 100 ms apart, 250 ms per attempt, backs off 2 to 200 ms, up to 10 s in all Timers: C01 C02 C03 C04 C28 C40 C42 C43 C45 C46. Fact that could fire it: The holder&#x27;s commit, in the same process: a first-come gate per store file hands the lock to the next writer. It becomes a fact.</title><line class="aclk" x1="216.5" y1="192" x2="476.5" y2="192" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="226.5" cy="192.0" r="5"/><path class="ck" d="M226.5 188.8V192.0H229.2"/><rect class="lbg" x="221.5" y="163.0" width="385.3" height="14" rx="3"/><text class="b" x="224.5" y="174.0" style="font-size:11.5px">ST4  1 to 100 ms, 250 ms, 2 to 200 ms ...</text><rect class="bg-f" x="497.8" y="163.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="503.8" y="174.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="221.5" y="198.0" width="254.2" height="13" rx="3"/><text class="t2" x="224.5" y="208.0" style="font-size:11px">C01 C02 C03 C04 C28 C40 C42 C43 C45 C46</text></g><g><title>ST5, waiting for the write lock to reuse paused, fired by a clock: 10 s passed: the apply answers without publishing and every apply skips the store for 30 s Timers: C05. Fact that could fire it: With writes queued first-come, no write waits out a deadline and no pause is needed. It becomes a fact.</title><line class="aclk" x1="486.5" y1="239" x2="611.5" y2="239" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="496.5" cy="239.0" r="5"/><path class="ck" d="M496.5 235.8V239.0H499.2"/><rect class="lbg" x="491.5" y="210.0" width="214.2" height="14" rx="3"/><text class="b" x="494.5" y="221.0" style="font-size:11.5px">ST5  10 s, 30 s</text><rect class="bg-f" x="596.7" y="210.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="602.7" y="221.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="491.5" y="245.0" width="27.7" height="13" rx="3"/><text class="t2" x="494.5" y="255.0" style="font-size:11px">C05</text></g><g><title>ST6, reuse paused to open, fired by a clock: the 30 s window passed; the next apply tries the store again Timers: C05. Fact that could fire it: As ST5. It becomes a fact.</title><line class="aclk" x1="613.5" y1="286" x2="218.5" y2="286" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="603.5" cy="286.0" r="5"/><path class="ck" d="M603.5 282.8V286.0H606.2"/><rect class="lbg" x="221.5" y="257.0" width="178.9" height="14" rx="3"/><text class="b" x="224.5" y="268.0" style="font-size:11.5px">ST6  30 s</text><rect class="bg-f" x="291.5" y="257.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="297.5" y="268.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="221.5" y="292.0" width="27.7" height="13" rx="3"/><text class="t2" x="224.5" y="302.0" style="font-size:11px">C05</text></g><g><title>ST7, open to maintenance wake, fired by a clock: the maintenance thread wakes every 30 s, idle or not Timers: C14. Fact that could fire it: Wake it (unpark) from the writes that create work. It becomes a fact.</title><line class="aclk" x1="216.5" y1="333" x2="746.5" y2="333" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="226.5" cy="333.0" r="5"/><path class="ck" d="M226.5 329.8V333.0H229.2"/><rect class="lbg" x="221.5" y="304.0" width="178.9" height="14" rx="3"/><text class="b" x="224.5" y="315.0" style="font-size:11.5px">ST7  30 s</text><rect class="bg-f" x="291.5" y="304.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="297.5" y="315.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="221.5" y="339.0" width="27.7" height="13" rx="3"/><text class="t2" x="224.5" y="349.0" style="font-size:11px">C14</text></g><g><title>ST8, maintenance wake to open, fired by a clock: it renews every workspace&#x27;s 120 s lease (one attempt), as every publishing apply also does Timers: C06 C07 C08 C09 C10 C41. Fact that could fire it: The owner&#x27;s end: only the process holding the main-instance lock opens the store, so at open every other row is dead; a shared store gets one OS lock file per owner. It becomes a fact.</title><line class="aclk" x1="748.5" y1="380" x2="218.5" y2="380" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="738.5" cy="380.0" r="5"/><path class="ck" d="M738.5 376.8V380.0H741.2"/><rect class="lbg" x="221.5" y="351.0" width="186.9" height="14" rx="3"/><text class="b" x="224.5" y="362.0" style="font-size:11.5px">ST8  120 s</text><rect class="bg-f" x="299.5" y="351.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="305.5" y="362.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="221.5" y="386.0" width="153.5" height="13" rx="3"/><text class="t2" x="224.5" y="396.0" style="font-size:11px">C06 C07 C08 C09 C10 C41</text></g><g><title>ST9, maintenance wake to being collected, fired by a clock: when capacity is not Normal it collects; workspaces whose lease expired are marked dead and their rows deleted Timers: C11 C12 C13. Fact that could fire it: A write that moves capacity out of Normal wakes the collection; dead owners by their lock. It becomes a fact.</title><line class="aclk" x1="756.5" y1="427" x2="881.5" y2="427" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="766.5" cy="427.0" r="5"/><path class="ck" d="M766.5 423.8V427.0H769.2"/><rect class="lbg" x="761.5" y="398.0" width="152.1" height="14" rx="3"/><text class="b" x="764.5" y="409.0" style="font-size:11.5px">ST9  </text><rect class="bg-f" x="804.6" y="398.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="810.6" y="409.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="761.5" y="433.0" width="78.0" height="13" rx="3"/><text class="t2" x="764.5" y="443.0" style="font-size:11px">C11 C12 C13</text></g><g><title>ST10, maintenance wake to open, fired by a clock: it builds missing search indexes for at most 1 s Timers: C15. Fact that could fire it: The publication that stored tapes without an index wakes the thread, which works until its backlog is empty. It becomes a fact.</title><line class="aclk" x1="748.5" y1="474" x2="218.5" y2="474" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="738.5" cy="474.0" r="5"/><path class="ck" d="M738.5 470.8V474.0H741.2"/><rect class="lbg" x="221.5" y="445.0" width="178.9" height="14" rx="3"/><text class="b" x="224.5" y="456.0" style="font-size:11.5px">ST10  1 s</text><rect class="bg-f" x="291.5" y="445.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="297.5" y="456.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="221.5" y="480.0" width="27.7" height="13" rx="3"/><text class="t2" x="224.5" y="490.0" style="font-size:11px">C15</text></g><g><title>ST11, open to open, fired by a clock: a decompressed cache entry is dropped after 30 s Timers: C16 C58. Fact that could fire it: The byte cap and the workspace&#x27;s eviction and close already free it. It becomes a fact.</title><path class="aclk" d="M215.5 513C258.5 513 258.5 529 217.5 529" marker-end="url(#smcontentstore-ac)"/><circle class="ck" cx="226.5" cy="521.0" r="5"/><path class="ck" d="M226.5 517.8V521.0H229.2"/><rect class="lbg" x="261.5" y="492.0" width="186.9" height="14" rx="3"/><text class="b" x="264.5" y="503.0" style="font-size:11.5px">ST11  30 s</text><rect class="bg-f" x="339.5" y="492.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="345.5" y="503.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="261.5" y="527.0" width="52.8" height="13" rx="3"/><text class="t2" x="264.5" y="537.0" style="font-size:11px">C16 C58</text></g><g><title>ST12, open to closed, fired by a fact: the last holder lets go (the daemon stops, the last workspace closes)</title><line class="afct" x1="208.5" y1="568" x2="83.5" y2="568" marker-end="url(#smcontentstore-af)"/><rect class="lbg" x="86.5" y="539.0" width="137.4" height="14" rx="3"/><text class="b" x="89.5" y="550.0" style="font-size:11.5px">ST12  fired by a fact</text></g><g><title>ST13, closed to rebuilt, fired by a fact: a release raises the schema floor: the store gets a new file name and is filled again from sources</title><line class="afct" x1="81.5" y1="602" x2="1016.5" y2="602" marker-end="url(#smcontentstore-af)"/><rect class="lbg" x="86.5" y="573.0" width="137.4" height="14" rx="3"/><text class="b" x="89.5" y="584.0" style="font-size:11.5px">ST13  fired by a fact</text></g></svg>
