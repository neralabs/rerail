<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="798" viewBox="-16 -16 1132 798" role="img" aria-label="A session: 7 states and 15 changes, 11 fired by a clock and 4 by a fact. Each change is an arrow; its table follows."><title>A session: 7 states and 15 changes, 11 fired by a clock and 4 by a fact. Each change is an arrow; its table follows.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#0b0b0b}.t2{fill:#52514e}.b{font-weight:650}.tf{fill:#2a78d6;font-weight:650}.tb-f{fill:#fff}.tb-p,.tb-s,.tb-r{fill:#0b0b0b}.bx{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:1.25}.ct{fill:none;stroke:#52514e;stroke-dasharray:2 3}.chip{fill:#fcfcfb;stroke:#c3c2b7}.ln{fill:none;stroke:#52514e;stroke-width:1.3}.hn{fill:#52514e}.hf{fill:#2a78d6}.hc{fill:#eb6834}.afct{fill:none;stroke:#2a78d6;stroke-width:2}.aclk{fill:none;stroke:#eb6834;stroke-width:2;stroke-dasharray:6 4}.ck{fill:#fcfcfb;stroke:#eb6834;stroke-width:1.4}.life{stroke:#e1e0d9;stroke-width:1.5}.lbg{fill:#fcfcfb;opacity:.92}.grid{stroke:#e1e0d9}.bg-f{fill:#2a78d6}.bg-p{fill:#fcfcfb;stroke:#2a78d6;stroke-width:1.5}.bg-s{fill:#b4b2aa}.bg-r{fill:#fcfcfb;stroke:#7d7b74;stroke-dasharray:3 2}.s-go,.s-fact{fill:#2a78d6}.s-go2{fill:#2a78d6;fill-opacity:.42}.s-clk{fill:#eb6834}.s-clk.o{fill-opacity:.35;stroke:#eb6834;stroke-dasharray:4 3;stroke-width:1.3}.s-clk2{fill:#eb6834;fill-opacity:.42}.s-stay{fill:#7d7b74}.s-stay2{fill:#b4b2aa}.s-neu{fill:#b4b2aa}.s-al-hx,.s-run-hx{stroke:#7d7b74;stroke-width:1}.hxb{fill:#fcfcfb}.hxl{stroke:#7d7b74;stroke-width:2}.s-al-hx{stroke:#2a78d6}</style><rect x="-15.5" y="-15.5" width="1131" height="797" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/><defs><marker id="smsession-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hf" d="M0 0L10 5L0 10z"/></marker><marker id="smsession-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc" d="M0 0L10 5L0 10z"/></marker><marker id="smsession-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hn" d="M0 0L10 5L0 10z"/></marker><pattern id="smsession-hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hxb"/><line x1="0" y1="0" x2="0" y2="6" class="hxl"/></pattern></defs><rect class="bx" x="14.0" y="4" width="146.3" height="42" rx="7"/><text class="b" x="87.1" y="22.0" text-anchor="middle" style="font-size:11.5px">none</text><rect class="bx" x="168.3" y="4" width="146.3" height="42" rx="7"/><text class="b" x="241.4" y="22.0" text-anchor="middle" style="font-size:11.5px">opened</text><rect class="bx" x="322.6" y="4" width="146.3" height="42" rx="7"/><text class="b" x="395.7" y="22.0" text-anchor="middle" style="font-size:11.5px">at work</text><rect class="bx" x="476.9" y="4" width="146.3" height="42" rx="7"/><text class="b" x="550.0" y="22.0" text-anchor="middle" style="font-size:11.5px">quiet</text><rect class="bx" x="631.1" y="4" width="146.3" height="42" rx="7"/><text class="b" x="704.3" y="22.0" text-anchor="middle" style="font-size:11.5px">closed</text><rect class="bx" x="785.4" y="4" width="146.3" height="42" rx="7"/><text class="b" x="858.6" y="22.0" text-anchor="middle" style="font-size:11.5px">opened again</text><rect class="bx" x="939.7" y="4" width="146.3" height="42" rx="7"/><text class="b" x="1012.9" y="22.0" text-anchor="middle" style="font-size:11.5px">checkout runtime</text><text class="b" x="1012.9" y="36.0" text-anchor="middle" style="font-size:11.5px">retired</text><line class="life" x1="87.1" y1="46" x2="87.1" y2="712.0"/><line class="life" x1="241.4" y1="46" x2="241.4" y2="712.0"/><line class="life" x1="395.7" y1="46" x2="395.7" y2="712.0"/><line class="life" x1="550.0" y1="46" x2="550.0" y2="712.0"/><line class="life" x1="704.3" y1="46" x2="704.3" y2="712.0"/><line class="life" x1="858.6" y1="46" x2="858.6" y2="712.0"/><line class="life" x1="1012.9" y1="46" x2="1012.9" y2="712.0"/><rect class="bx" x="14.0" y="716" width="146.3" height="42" rx="7"/><text class="b" x="87.1" y="734.0" text-anchor="middle" style="font-size:11.5px">none</text><rect class="bx" x="168.3" y="716" width="146.3" height="42" rx="7"/><text class="b" x="241.4" y="734.0" text-anchor="middle" style="font-size:11.5px">opened</text><rect class="bx" x="322.6" y="716" width="146.3" height="42" rx="7"/><text class="b" x="395.7" y="734.0" text-anchor="middle" style="font-size:11.5px">at work</text><rect class="bx" x="476.9" y="716" width="146.3" height="42" rx="7"/><text class="b" x="550.0" y="734.0" text-anchor="middle" style="font-size:11.5px">quiet</text><rect class="bx" x="631.1" y="716" width="146.3" height="42" rx="7"/><text class="b" x="704.3" y="734.0" text-anchor="middle" style="font-size:11.5px">closed</text><rect class="bx" x="785.4" y="716" width="146.3" height="42" rx="7"/><text class="b" x="858.6" y="734.0" text-anchor="middle" style="font-size:11.5px">opened again</text><rect class="bx" x="939.7" y="716" width="146.3" height="42" rx="7"/><text class="b" x="1012.9" y="734.0" text-anchor="middle" style="font-size:11.5px">checkout runtime</text><text class="b" x="1012.9" y="748.0" text-anchor="middle" style="font-size:11.5px">retired</text><g><title>SE1, none to opened, fired by a fact: a session-start event: the runtime records the session and starts opening its code rules</title><line class="afct" x1="91.1" y1="90" x2="235.4" y2="90" marker-end="url(#smsession-af)"/><rect class="lbg" x="96.1" y="61.0" width="129.4" height="14" rx="3"/><text class="b" x="99.1" y="72.0" style="font-size:11.5px">SE1  fired by a fact</text></g><g><title>SE2, opened to at work, fired by a fact: the session&#x27;s rules have opened; before that its boundaries go on without code rules</title><line class="afct" x1="245.4" y1="124" x2="389.7" y2="124" marker-end="url(#smsession-af)"/><rect class="lbg" x="250.4" y="95.0" width="129.4" height="14" rx="3"/><text class="b" x="253.4" y="106.0" style="font-size:11.5px">SE2  fired by a fact</text></g><g><title>SE3, at work to quiet, fired by a clock: no event arrives; the session&#x27;s quiet time is counted from its last event (a clock read, no code fires) Timers: . Fact that could fire it: The agent&#x27;s process end tells a session that is over from one that is paused. It becomes a fact.</title><line class="aclk" x1="399.7" y1="158" x2="544.0" y2="158" marker-end="url(#smsession-ac)"/><circle class="ck" cx="409.7" cy="158.0" r="5"/><path class="ck" d="M409.7 154.8V158.0H412.5"/><rect class="lbg" x="404.7" y="129.0" width="152.1" height="14" rx="3"/><text class="b" x="407.7" y="140.0" style="font-size:11.5px">SE3  </text><rect class="bg-f" x="447.9" y="129.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="453.9" y="140.0" style="font-size:11px">becomes a fact</text></g><g><title>SE4, quiet to closed, fired by a clock: a sweep every 60 s closes a session quiet 30 min (24 h when it still owes its agent something) Timers: A118. Fact that could fire it: The agent&#x27;s process end, or its session-end event; a session paused by a person stays open. It becomes a fact.</title><line class="aclk" x1="554.0" y1="192" x2="698.3" y2="192" marker-end="url(#smsession-ac)"/><circle class="ck" cx="564.0" cy="192.0" r="5"/><path class="ck" d="M564.0 188.8V192.0H566.8"/><rect class="lbg" x="559.0" y="163.0" width="268.0" height="14" rx="3"/><text class="b" x="562.0" y="174.0" style="font-size:11.5px">SE4  60 s, 30 min, 24 h</text><rect class="bg-f" x="718.1" y="163.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="724.1" y="174.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="559.0" y="198.0" width="34.5" height="13" rx="3"/><text class="t2" x="562.0" y="208.0" style="font-size:11px">A118</text></g><g><title>SE5, at work to closed, fired by a fact: a session-end event</title><line class="afct" x1="399.7" y1="239" x2="698.3" y2="239" marker-end="url(#smsession-af)"/><rect class="lbg" x="404.7" y="210.0" width="129.4" height="14" rx="3"/><text class="b" x="407.7" y="221.0" style="font-size:11.5px">SE5  fired by a fact</text></g><g><title>SE6, closed to opened again, fired by a fact: the next event of a closed session opens it again from its ledger</title><line class="afct" x1="708.3" y1="273" x2="852.6" y2="273" marker-end="url(#smsession-af)"/><rect class="lbg" x="713.3" y="244.0" width="129.4" height="14" rx="3"/><text class="b" x="716.3" y="255.0" style="font-size:11.5px">SE6  fired by a fact</text></g><g><title>SE7, opened again to at work, fired by a clock: each code-rule boundary of a reopened session waits for its rules to open, up to 20 s, and every later one waits again while they stay closed Timers: A401. Fact that could fire it: The rules&#x27; open itself, waited for only by a call that can write, and only once. It becomes a fact.</title><line class="aclk" x1="854.6" y1="307" x2="401.7" y2="307" marker-end="url(#smsession-ac)"/><circle class="ck" cx="844.6" cy="307.0" r="5"/><path class="ck" d="M844.6 303.8V307.0H847.3"/><rect class="lbg" x="404.7" y="278.0" width="178.9" height="14" rx="3"/><text class="b" x="407.7" y="289.0" style="font-size:11.5px">SE7  20 s</text><rect class="bg-f" x="474.7" y="278.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="480.7" y="289.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="404.7" y="313.0" width="34.5" height="13" rx="3"/><text class="t2" x="407.7" y="323.0" style="font-size:11px">A401</text></g><g><title>SE8, closed to checkout runtime retired, fired by a clock: a checkout&#x27;s runtime is disposed 15 min after its last session left Timers: A119. Fact that could fire it: Memory, not time: retire when the daemon needs the room. It becomes a fact.</title><line class="aclk" x1="708.3" y1="354" x2="1006.9" y2="354" marker-end="url(#smsession-ac)"/><circle class="ck" cx="718.3" cy="354.0" r="5"/><path class="ck" d="M718.3 350.8V354.0H721.0"/><rect class="lbg" x="713.3" y="325.0" width="196.2" height="14" rx="3"/><text class="b" x="716.3" y="336.0" style="font-size:11.5px">SE8  15 min</text><rect class="bg-f" x="800.6" y="325.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="806.6" y="336.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="713.3" y="360.0" width="34.5" height="13" rx="3"/><text class="t2" x="716.3" y="370.0" style="font-size:11px">A119</text></g><g><title>SE9, at work to closed, fired by a clock: an OMP or Pi session whose host sent nothing for 60 s is closed by a sweep every 5 s Timers: A210 A211 A212 A213 A214 A215 A216 A217 A218 A219 A220 A221. Fact that could fire it: No event tells the daemon a host died today; a held poll (answered when a steer is ready) would be a connection whose close is the host&#x27;s end. It a fact, one bound left.</title><line class="aclk" x1="399.7" y1="401" x2="698.3" y2="401" marker-end="url(#smsession-ac)"/><circle class="ck" cx="409.7" cy="401.0" r="5"/><path class="ck" d="M409.7 397.8V401.0H412.5"/><rect class="lbg" x="404.7" y="372.0" width="246.2" height="14" rx="3"/><text class="b" x="407.7" y="383.0" style="font-size:11.5px">SE9  60 s, 5 s</text><rect class="bg-p" x="501.9" y="372.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="507.9" y="383.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="404.7" y="407.0" width="386.6" height="13" rx="3"/><text class="t2" x="407.7" y="417.0" style="font-size:11px">A210 A211 A212 A213 A214 A215 A216 A217 A218 A219 A220 A221</text></g><g><title>SE10, none to opened, fired by a clock: OMP and Pi attach a session through a `rerail state` child (15 s) and retry an attach 1 s to 30 s apart; a tool call is held up to 25 s Timers: A801 A802 A803 A804 A805 A806 A807 A808. Fact that could fire it: The child&#x27;s exit and the host&#x27;s own events already end each wait; the limits bound a child or daemon that hangs. It stays.</title><line class="aclk" x1="91.1" y1="448" x2="235.4" y2="448" marker-end="url(#smsession-ac)"/><circle class="ck" cx="101.1" cy="448.0" r="5"/><path class="ck" d="M101.1 444.8V448.0H103.9"/><rect class="lbg" x="96.1" y="419.0" width="205.5" height="14" rx="3"/><text class="b" x="99.1" y="430.0" style="font-size:11.5px">SE10  15 s, 1 s, 30 s ...</text><rect class="bg-s" x="253.7" y="419.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="259.7" y="430.0" style="font-size:11px">stays</text><rect class="lbg" x="96.1" y="454.0" width="258.6" height="13" rx="3"/><text class="t2" x="99.1" y="464.0" style="font-size:11px">A801 A802 A803 A804 A805 A806 A807 A808</text></g><g><title>SE11, at work to at work, fired by a clock: other worktrees&#x27; changes reach the session: notices taken by a 250 ms poll, walks 5 s apart, a full walk every 10 min, a refused watch retried after 10 min; the Windows watch reopens 200 ms after a rename Timers: B041 B201 B202 B203 B204 B205 B206 C20 C21 C22 C23 C25 C50 D44 D45 D46 D47. Fact that could fire it: The watch thread can call the daemon when a notice arrives (a napi thread-safe function); a refused watch can retry on the cause that refused it; Windows completions already arrive on the port. It a fact, one bound left.</title><path class="aclk" d="M398.7 487C441.7 487 441.7 503 400.7 503" marker-end="url(#smsession-ac)"/><circle class="ck" cx="409.7" cy="495.0" r="5"/><path class="ck" d="M409.7 491.8V495.0H412.5"/><rect class="lbg" x="444.7" y="466.0" width="343.8" height="14" rx="3"/><text class="b" x="447.7" y="477.0" style="font-size:11.5px">SE11  250 ms, 5 s, 10 min ...</text><rect class="bg-p" x="639.5" y="466.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="645.5" y="477.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="444.7" y="501.0" width="481.6" height="13" rx="3"/><text class="t2" x="447.7" y="511.0" style="font-size:11px">B041 B201 B202 B203 B204 B205 B206 C20 C21 C22 C23 C25 C50 D44 D45 D46 D47</text></g><g><title>SE12, at work to at work, fired by a clock: Merge Assist&#x27;s conflict check for an edit: run, skipped inside 30 s of the last, or late; gh&#x27;s readiness read again after 5 min Timers: A226 A601 A602 A603 A604 A606 A607 A608 A610 A611 A612 B224 B225. Fact that could fire it: Status reads show gh&#x27;s sign-in as last read; the end of the running pass could start the skipped one (to settle by a run). It a fact, one bound left.</title><path class="aclk" d="M398.7 534C441.7 534 441.7 550 400.7 550" marker-end="url(#smsession-ac)"/><circle class="ck" cx="409.7" cy="542.0" r="5"/><path class="ck" d="M409.7 538.8V542.0H412.5"/><rect class="lbg" x="444.7" y="513.0" width="271.5" height="14" rx="3"/><text class="b" x="447.7" y="524.0" style="font-size:11.5px">SE12  30 s, 5 min</text><rect class="bg-p" x="567.2" y="513.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="573.2" y="524.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="444.7" y="548.0" width="418.7" height="13" rx="3"/><text class="t2" x="447.7" y="558.0" style="font-size:11px">A226 A601 A602 A603 A604 A606 A607 A608 A610 A611 A612 B224 B225</text></g><g><title>SE13, at work to at work, fired by a clock: a repository scan (the session start&#x27;s audit, or a scan request) runs in chunks and is cut at 5 min Timers: B210 B211. Fact that could fire it: The scan&#x27;s own file and byte budgets (100,000 files, 512 MiB) already bound it; whether the 5 min cut adds anything needs a timing run. It needs a run.</title><path class="aclk" d="M398.7 581C441.7 581 441.7 597 400.7 597" marker-end="url(#smsession-ac)"/><circle class="ck" cx="409.7" cy="589.0" r="5"/><path class="ck" d="M409.7 585.8V589.0H412.5"/><rect class="lbg" x="444.7" y="560.0" width="175.6" height="14" rx="3"/><text class="b" x="447.7" y="571.0" style="font-size:11.5px">SE13  5 min</text><rect class="bg-r" x="532.0" y="560.0" width="85.3" height="15" rx="7.5"/><text class="tb-r b" x="538.0" y="571.0" style="font-size:11px">needs a run</text><rect class="lbg" x="444.7" y="595.0" width="66.6" height="13" rx="3"/><text class="t2" x="447.7" y="605.0" style="font-size:11px">B210 B211</text></g><g><title>SE14, at work to at work, fired by a clock: an evaluation finds the engine busy with another one: refused with WORKSPACE_BUSY and retried 2 to 25 ms apart; an idle wait polls every 2 ms Timers: B207 B208 B209 C17 C18 C19 C47. Fact that could fire it: A first-come queue in the engine: the holder&#x27;s release hands the turn to the next task. It becomes a fact.</title><path class="aclk" d="M398.7 628C441.7 628 441.7 644 400.7 644" marker-end="url(#smsession-ac)"/><circle class="ck" cx="409.7" cy="636.0" r="5"/><path class="ck" d="M409.7 632.8V636.0H412.5"/><rect class="lbg" x="444.7" y="607.0" width="267.5" height="14" rx="3"/><text class="b" x="447.7" y="618.0" style="font-size:11.5px">SE14  2 to 25 ms, 2 ms</text><rect class="bg-f" x="603.3" y="607.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="609.3" y="618.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="444.7" y="642.0" width="199.3" height="13" rx="3"/><text class="t2" x="447.7" y="652.0" style="font-size:11px">B207 B208 B209 C17 C18 C19 C47</text></g><g><title>SE15, at work to at work, fired by a clock: the demo of /rerail-show-me: the agent reads the demo file twice and expects the rule loaded by then Timers: A809. Fact that could fire it: The rule&#x27;s load and the indexing&#x27;s end, both known to the daemon (to settle by a run). It needs a run.</title><path class="aclk" d="M398.7 675C441.7 675 441.7 691 400.7 691" marker-end="url(#smsession-ac)"/><circle class="ck" cx="409.7" cy="683.0" r="5"/><path class="ck" d="M409.7 679.8V683.0H412.5"/><rect class="lbg" x="444.7" y="654.0" width="139.5" height="14" rx="3"/><text class="b" x="447.7" y="665.0" style="font-size:11.5px">SE15  </text><rect class="bg-r" x="495.9" y="654.0" width="85.3" height="15" rx="7.5"/><text class="tb-r b" x="501.9" y="665.0" style="font-size:11px">needs a run</text><rect class="lbg" x="444.7" y="689.0" width="34.5" height="13" rx="3"/><text class="t2" x="447.7" y="699.0" style="font-size:11px">A809</text></g></svg>
