<svg xmlns="http://www.w3.org/2000/svg" width="1132" height="647" viewBox="-16 -16 1132 647" role="img" aria-label="The dashboard and the status displays: 5 states and 11 changes, 10 fired by a clock and 1 by a fact. Each change is an arrow; its table follows."><title>The dashboard and the status displays: 5 states and 11 changes, 10 fired by a clock and 1 by a fact. Each change is an arrow; its table follows.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:12.5px;fill:#0b0b0b}.t2{fill:#52514e}.b{font-weight:650}.tf{fill:#2a78d6;font-weight:650}.tb-f{fill:#fff}.tb-p,.tb-s,.tb-r{fill:#0b0b0b}.bx{fill:#fcfcfb;stroke:#c3c2b7;stroke-width:1.25}.ct{fill:none;stroke:#52514e;stroke-dasharray:2 3}.chip{fill:#fcfcfb;stroke:#c3c2b7}.ln{fill:none;stroke:#52514e;stroke-width:1.3}.hn{fill:#52514e}.hf{fill:#2a78d6}.hc{fill:#eb6834}.afct{fill:none;stroke:#2a78d6;stroke-width:2}.aclk{fill:none;stroke:#eb6834;stroke-width:2;stroke-dasharray:6 4}.ck{fill:#fcfcfb;stroke:#eb6834;stroke-width:1.4}.life{stroke:#e1e0d9;stroke-width:1.5}.lbg{fill:#fcfcfb;opacity:.92}.grid{stroke:#e1e0d9}.bg-f{fill:#2a78d6}.bg-p{fill:#fcfcfb;stroke:#2a78d6;stroke-width:1.5}.bg-s{fill:#b4b2aa}.bg-r{fill:#fcfcfb;stroke:#7d7b74;stroke-dasharray:3 2}.s-go,.s-fact{fill:#2a78d6}.s-go2{fill:#2a78d6;fill-opacity:.42}.s-clk{fill:#eb6834}.s-clk.o{fill-opacity:.35;stroke:#eb6834;stroke-dasharray:4 3;stroke-width:1.3}.s-clk2{fill:#eb6834;fill-opacity:.42}.s-stay{fill:#7d7b74}.s-stay2{fill:#b4b2aa}.s-neu{fill:#b4b2aa}.s-al-hx,.s-run-hx{stroke:#7d7b74;stroke-width:1}.hxb{fill:#fcfcfb}.hxl{stroke:#7d7b74;stroke-width:2}.s-al-hx{stroke:#2a78d6}</style><rect x="-15.5" y="-15.5" width="1131" height="646" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/><defs><marker id="smdashboardandthestatusdisplays-af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hf" d="M0 0L10 5L0 10z"/></marker><marker id="smdashboardandthestatusdisplays-ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hc" d="M0 0L10 5L0 10z"/></marker><marker id="smdashboardandthestatusdisplays-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="hn" d="M0 0L10 5L0 10z"/></marker><pattern id="smdashboardandthestatusdisplays-hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hxb"/><line x1="0" y1="0" x2="0" y2="6" class="hxl"/></pattern></defs><rect class="bx" x="14.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="118.0" y="22.0" text-anchor="middle" style="font-size:11.5px">page opened</text><rect class="bx" x="230.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="334.0" y="22.0" text-anchor="middle" style="font-size:11.5px">live</text><rect class="bx" x="446.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="550.0" y="22.0" text-anchor="middle" style="font-size:11.5px">not responding</text><rect class="bx" x="662.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="766.0" y="22.0" text-anchor="middle" style="font-size:11.5px">down</text><rect class="bx" x="878.0" y="4" width="208.0" height="28" rx="7"/><text class="b" x="982.0" y="22.0" text-anchor="middle" style="font-size:11.5px">toast shown</text><line class="life" x1="118.0" y1="32" x2="118.0" y2="575.0"/><line class="life" x1="334.0" y1="32" x2="334.0" y2="575.0"/><line class="life" x1="550.0" y1="32" x2="550.0" y2="575.0"/><line class="life" x1="766.0" y1="32" x2="766.0" y2="575.0"/><line class="life" x1="982.0" y1="32" x2="982.0" y2="575.0"/><rect class="bx" x="14.0" y="579" width="208.0" height="28" rx="7"/><text class="b" x="118.0" y="597.0" text-anchor="middle" style="font-size:11.5px">page opened</text><rect class="bx" x="230.0" y="579" width="208.0" height="28" rx="7"/><text class="b" x="334.0" y="597.0" text-anchor="middle" style="font-size:11.5px">live</text><rect class="bx" x="446.0" y="579" width="208.0" height="28" rx="7"/><text class="b" x="550.0" y="597.0" text-anchor="middle" style="font-size:11.5px">not responding</text><rect class="bx" x="662.0" y="579" width="208.0" height="28" rx="7"/><text class="b" x="766.0" y="597.0" text-anchor="middle" style="font-size:11.5px">down</text><rect class="bx" x="878.0" y="579" width="208.0" height="28" rx="7"/><text class="b" x="982.0" y="597.0" text-anchor="middle" style="font-size:11.5px">toast shown</text><g><title>DA1, page opened to live, fired by a fact: the first poll answers</title><line class="afct" x1="122.0" y1="76" x2="328.0" y2="76" marker-end="url(#smdashboardandthestatusdisplays-af)"/><rect class="lbg" x="127.0" y="47.0" width="131.7" height="14" rx="3"/><text class="b" x="130.0" y="58.0" style="font-size:11.5px">DA1  fired by a fact</text><rect class="lbg" x="127.0" y="82.0" width="34.5" height="13" rx="3"/><text class="t2" x="130.0" y="92.0" style="font-size:11px">B404</text></g><g><title>DA2, live to live, fired by a clock: a change shows at the next 5 s poll on every view Timers: B400 B401 B402 B417. Fact that could fire it: A change stream from the daemon, held while the tab shows. It becomes a fact.</title><path class="aclk" d="M337.0 115C380.0 115 380.0 131 339.0 131" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="123.0" r="5"/><path class="ck" d="M348.0 119.8V123.0H350.8"/><rect class="lbg" x="383.0" y="94.0" width="173.3" height="14" rx="3"/><text class="b" x="386.0" y="105.0" style="font-size:11.5px">DA2  5 s</text><rect class="bg-f" x="447.3" y="94.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="453.3" y="105.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="383.0" y="129.0" width="130.6" height="13" rx="3"/><text class="t2" x="386.0" y="139.0" style="font-size:11px">B400 B401 B402 B417</text></g><g><title>DA3, live to not responding, fired by a clock: no answer for 12 s, read by a 5 s status tick Timers: B407 B408. Fact that could fire it: The stream&#x27;s state and the failure&#x27;s kind. It becomes a fact.</title><line class="aclk" x1="338.0" y1="170" x2="544.0" y2="170" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="170.0" r="5"/><path class="ck" d="M348.0 166.8V170.0H350.8"/><rect class="lbg" x="343.0" y="141.0" width="208.5" height="14" rx="3"/><text class="b" x="346.0" y="152.0" style="font-size:11.5px">DA3  12 s, 5 s</text><rect class="bg-f" x="442.5" y="141.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="448.5" y="152.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="343.0" y="176.0" width="66.6" height="13" rx="3"/><text class="t2" x="346.0" y="186.0" style="font-size:11px">B407 B408</text></g><g><title>DA4, live to down, fired by a clock: 30 s after the last answer (35 s with the tick); a conflict count kept 30 s Timers: B403 B409. Fact that could fire it: A refused connection says down at once; a closed stream says the daemon stopped. It becomes a fact.</title><line class="aclk" x1="338.0" y1="217" x2="760.0" y2="217" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="217.0" r="5"/><path class="ck" d="M348.0 213.8V217.0H350.8"/><rect class="lbg" x="343.0" y="188.0" width="216.5" height="14" rx="3"/><text class="b" x="346.0" y="199.0" style="font-size:11.5px">DA4  30 s, 35 s</text><rect class="bg-f" x="450.5" y="188.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="456.5" y="199.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="343.0" y="223.0" width="66.6" height="13" rx="3"/><text class="t2" x="346.0" y="233.0" style="font-size:11px">B403 B409</text></g><g><title>DA5, down to live, fired by a clock: retried 10 s doubling to 30 s, then every 5 s Timers: B405 B406. Fact that could fire it: None while the daemon is down; the steady pace keeps the wait short. It a fact, one bound left.</title><line class="aclk" x1="762.0" y1="264" x2="340.0" y2="264" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="752.0" cy="264.0" r="5"/><path class="ck" d="M752.0 260.8V264.0H754.8"/><rect class="lbg" x="343.0" y="235.0" width="283.8" height="14" rx="3"/><text class="b" x="346.0" y="246.0" style="font-size:11.5px">DA5  10 s, 30 s, 5 s</text><rect class="bg-p" x="477.8" y="235.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="483.8" y="246.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="343.0" y="270.0" width="66.6" height="13" rx="3"/><text class="t2" x="346.0" y="280.0" style="font-size:11px">B405 B406</text></g><g><title>DA6, live to live, fired by a clock: a setting write waits up to 30 s for the daemon&#x27;s answer Timers: B410. Fact that could fire it: The answer; the limit bounds a daemon that accepted and never answered. It stays.</title><path class="aclk" d="M337.0 303C380.0 303 380.0 319 339.0 319" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="311.0" r="5"/><path class="ck" d="M348.0 307.8V311.0H350.8"/><rect class="lbg" x="383.0" y="282.0" width="120.3" height="14" rx="3"/><text class="b" x="386.0" y="293.0" style="font-size:11.5px">DA6  30 s</text><rect class="bg-s" x="455.3" y="282.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="461.3" y="293.0" style="font-size:11px">stays</text><rect class="lbg" x="383.0" y="317.0" width="34.5" height="13" rx="3"/><text class="t2" x="386.0" y="327.0" style="font-size:11px">B410</text></g><g><title>DA7, toast shown to live, fired by a clock: a toast goes after 6 s (10 s for Undo) Timers: B411 B412. Fact that could fire it: The person&#x27;s next action ends an action toast. It a fact, one bound left.</title><line class="aclk" x1="978.0" y1="358" x2="340.0" y2="358" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="968.0" cy="358.0" r="5"/><path class="ck" d="M968.0 354.8V358.0H970.8"/><rect class="lbg" x="343.0" y="329.0" width="248.5" height="14" rx="3"/><text class="b" x="346.0" y="340.0" style="font-size:11.5px">DA7  6 s, 10 s</text><rect class="bg-p" x="442.5" y="329.0" width="146.0" height="15" rx="7.5"/><text class="tb-p b" x="448.5" y="340.0" style="font-size:11px">a fact, one bound left</text><rect class="lbg" x="343.0" y="364.0" width="66.6" height="13" rx="3"/><text class="t2" x="346.0" y="374.0" style="font-size:11px">B411 B412</text></g><g><title>DA8, live to live, fired by a clock: a session with no event for 30 min shows as ended; ranges step every 10 min; pack recommendations cached 60 s; the conflict hook limit form Timers: B226 B413 B414 B415 B416. Fact that could fire it: None today for an agent that quit without its end event. It stays.</title><path class="aclk" d="M337.0 397C380.0 397 380.0 413 339.0 413" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="405.0" r="5"/><path class="ck" d="M348.0 401.8V405.0H350.8"/><rect class="lbg" x="383.0" y="376.0" width="225.2" height="14" rx="3"/><text class="b" x="386.0" y="387.0" style="font-size:11.5px">DA8  30 min, 10 min, 60 s</text><rect class="bg-s" x="560.3" y="376.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="566.3" y="387.0" style="font-size:11px">stays</text><rect class="lbg" x="383.0" y="411.0" width="162.7" height="13" rx="3"/><text class="t2" x="386.0" y="421.0" style="font-size:11px">B226 B413 B414 B415 B416</text></g><g><title>DA9, live to live, fired by a clock: the daemon&#x27;s HTTP server and engine socket cut a client that never finishes its request (10 s headers, 60 s body, 30 s engine) and idle keep-alive connections after 5 s Timers: A116 A201 A202 A203. Fact that could fire it: None: these bound a client that never sends. It stays.</title><path class="aclk" d="M337.0 444C380.0 444 380.0 460 339.0 460" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="452.0" r="5"/><path class="ck" d="M348.0 448.8V452.0H350.8"/><rect class="lbg" x="383.0" y="423.0" width="207.8" height="14" rx="3"/><text class="b" x="386.0" y="434.0" style="font-size:11.5px">DA9  10 s, 60 s, 30 s ...</text><rect class="bg-s" x="542.9" y="423.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="548.9" y="434.0" style="font-size:11px">stays</text><rect class="lbg" x="383.0" y="458.0" width="130.5" height="13" rx="3"/><text class="t2" x="386.0" y="468.0" style="font-size:11px">A116 A201 A202 A203</text></g><g><title>DA10, live to live, fired by a clock: the status line reads the daemon (2 s) or the database; the command itself and its input are bounded at 2 s Timers: A128 A129 A130 B003 D66. Fact that could fire it: None: no presentation file or push channel exists to read instead. It stays.</title><path class="aclk" d="M337.0 491C380.0 491 380.0 507 339.0 507" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="499.0" r="5"/><path class="ck" d="M348.0 495.8V499.0H350.8"/><rect class="lbg" x="383.0" y="470.0" width="120.3" height="14" rx="3"/><text class="b" x="386.0" y="481.0" style="font-size:11.5px">DA10  2 s</text><rect class="bg-s" x="455.3" y="470.0" width="44.9" height="15" rx="7.5"/><text class="tb-s b" x="461.3" y="481.0" style="font-size:11px">stays</text><rect class="lbg" x="383.0" y="505.0" width="156.5" height="13" rx="3"/><text class="t2" x="386.0" y="515.0" style="font-size:11px">A128 A129 A130 B003 D66</text></g><g><title>DA11, live to live, fired by a clock: the OMP and Pi footer refreshes every 5 s Timers: B004. Fact that could fire it: The footer refreshes after each event&#x27;s answer. It becomes a fact.</title><path class="aclk" d="M337.0 538C380.0 538 380.0 554 339.0 554" marker-end="url(#smdashboardandthestatusdisplays-ac)"/><circle class="ck" cx="348.0" cy="546.0" r="5"/><path class="ck" d="M348.0 542.8V546.0H350.8"/><rect class="lbg" x="383.0" y="517.0" width="181.3" height="14" rx="3"/><text class="b" x="386.0" y="528.0" style="font-size:11.5px">DA11  5 s</text><rect class="bg-f" x="455.3" y="517.0" width="106.0" height="15" rx="7.5"/><text class="tb-f b" x="461.3" y="528.0" style="font-size:11px">becomes a fact</text><rect class="lbg" x="383.0" y="552.0" width="34.5" height="13" rx="3"/><text class="t2" x="386.0" y="562.0" style="font-size:11px">B004</text></g></svg>
