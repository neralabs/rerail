[package]
name = "m2exec"
version = "0.1.0"
edition = "2021"

[dependencies]
tree-sitter = "=0.27.1"
tree-sitter-language = "=0.1.9"
regex = "1"
fancy-regex = "0.14"
serde_json = "1"
globset = "0.4"
rayon = "1"
libc = "0.2"

[build-dependencies]
cc = "=1.8.0"
tree-sitter-generate = { version = "=0.27.1", default-features = false }

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
