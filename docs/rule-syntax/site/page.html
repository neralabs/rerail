<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rerail Logic Rule Syntax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a fixed top bar; each view is a reading column (syntax) or a list + code workbench (library, packs, data-layer). */
:root {
  --bg: #f2f3f5;
  --surface: #ffffff;
  --ink: #161b22;
  --muted: #5c6470;
  --line: #dde1e6;
  --accent: #8c2a3c;
  --accent-2: #1c5d8a;
  --tint: #f7f0f1;
  --code-bg: #fbfbfc;
  --t-var: #6a4aa5;
  --t-str: #2c6b38;
  --t-builtin: #a3561a;
  --t-kw: #1c5d8a;
  --t-num: #9b3c6a;
  --t-rel: #161b22;
  --t-pat-bg: #f1ecf8;
  --t-atom-bg: #fdf3e3;
  --flash: #fff1b8;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1115; --surface: #151a20; --ink: #e5e8ec; --muted: #98a1ad; --line: #283039;
    --accent: #e8899a; --accent-2: #74b6e8; --tint: #241a1d; --code-bg: #12161b;
    --t-var: #bba4f2; --t-str: #93d3a2; --t-builtin: #f0aa6c; --t-kw: #74b6e8; --t-num: #ee9cc2; --t-rel: #e5e8ec;
    --t-pat-bg: #231e30; --t-atom-bg: #2b2416; --flash: #4a4116;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1115; --surface: #151a20; --ink: #e5e8ec; --muted: #98a1ad; --line: #283039;
  --accent: #e8899a; --accent-2: #74b6e8; --tint: #241a1d; --code-bg: #12161b;
  --t-var: #bba4f2; --t-str: #93d3a2; --t-builtin: #f0aa6c; --t-kw: #74b6e8; --t-num: #ee9cc2; --t-rel: #e5e8ec;
  --t-pat-bg: #231e30; --t-atom-bg: #2b2416; --flash: #4a4116;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); display: flex; flex-direction: column; }
a { color: var(--accent-2); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
header.top { display: flex; align-items: center; gap: 28px; padding: 0 20px; height: 52px; flex: none;
  background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font: 600 18px/1 var(--font-display); letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand .ext { font: 500 12px var(--font-mono); color: var(--accent); }
nav.views { display: flex; gap: 4px; overflow-x: auto; }
nav.views a { text-decoration: none; color: var(--muted); font-weight: 500; padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
nav.views a[aria-current="page"] { color: var(--ink); background: var(--tint); box-shadow: inset 0 -2px 0 var(--accent); border-radius: 6px 6px 0 0; }
nav.views a:hover { color: var(--ink); }
main { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.on { display: flex; }

/* ---- reading column ---- */
.read { overflow-y: auto; flex: 1; }
.read .col { max-width: 1500px; margin: 0 auto; padding: 32px 20px 80px; display: grid; gap: 40px; }
.read h1 { font: 600 32px/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.read h2 { font: 600 22px/1.2 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
.read h3 { font: 600 16px/1.3 var(--font-display); margin: 0; }
.snips .code .cv { max-height: 360px; overflow: auto; }
.read > .col > h2 { margin-top: 18px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pair .cv { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-height: 640px; overflow: auto; }
@media (max-width: 860px) { .pair { grid-template-columns: 1fr; } }
.read p { margin: 0; max-width: 68ch; }
.lede { color: var(--muted); font-size: 16px; max-width: 70ch; }
.read p.perf { font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--accent-2); padding: 2px 0 2px 10px; }
.read p.perf b { color: var(--ink); }
.stats { display: flex; flex-wrap: wrap; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; min-width: 150px; }
.stat b { display: block; font: 600 22px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.sect { display: grid; grid-template-columns: minmax(240px, 0.75fr) minmax(0, 2fr); gap: 24px; align-items: start; }
.sect > .txt { display: grid; gap: 10px; }
.sect > .code { min-width: 0; }
@media (max-width: 860px) { .sect { grid-template-columns: 1fr; } }
table.map { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
table.map th, table.map td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.map th { font: 600 12px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; background: var(--code-bg); }
table.map td code, .txt code, p code, li code { font: 13px var(--font-mono); }
table.map td:first-child { white-space: nowrap; }
.tablewrap { overflow-x: auto; }
ul.tight { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 68ch; }

/* ---- workbench ---- */
.bench { flex: 1; display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side .head { padding: 14px 14px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.side h3 { margin: 0; font: 600 15px var(--font-display); letter-spacing: .02em; }
.side .list { overflow-y: auto; flex: 1; padding: 6px 0; }
.item { display: grid; gap: 2px; padding: 7px 14px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--code-bg); }
.item[aria-selected="true"] { background: var(--tint); border-left-color: var(--accent); }
.item .id { font: 13px var(--font-mono); word-break: break-all; }
.item .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pill { font: 500 11px/1 var(--font-body); padding: 3px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.native { color: var(--t-builtin); border-color: currentColor; }
.pill.datalog { color: var(--accent-2); border-color: currentColor; }
.pill.atom { color: var(--t-builtin); border-color: currentColor; }
.pill.hand { color: var(--accent-2); border-color: currentColor; font-weight: 600; }
.pill.gen { color: var(--muted); border-style: dashed; }
.pill.mode-block { color: var(--accent); border-color: currentColor; }
.pill.mode-steer { color: var(--accent-2); border-color: currentColor; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12.5px var(--font-body); padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
input[type="search"] { width: 100%; font: 14px var(--font-body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.work { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.work .bar { padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--surface); display: grid; gap: 6px; }
.work .bar h2 { margin: 0; font: 600 19px/1.25 var(--font-display); word-break: break-all; }
.work .bar p { margin: 0; color: var(--muted); max-width: 90ch; font-size: 14px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { font: 500 13px var(--font-body); padding: 5px 10px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--bg); }
.panes { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.pane:last-child { border-right: 0; }
.pane .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 14px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--code-bg); }
.pane .ph b { color: var(--ink); font-weight: 600; }
.pane .scroll { overflow: auto; flex: 1; background: var(--code-bg); }
@media (max-width: 900px) {
  .bench { grid-template-columns: 1fr; grid-template-rows: 38vh minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .panes { grid-auto-flow: row; grid-auto-rows: minmax(300px, 1fr); }
}

/* ---- code ---- */
pre.code { margin: 0; padding: 10px 0; font: 12.8px/1.6 var(--font-mono); counter-reset: ln; tab-size: 4; }
/* Long lines wrap. A wrapped line continues 4 columns right of where the line's own text starts (--ind is its
   leading whitespace, set per line), so it reads as one line and only adds height where it is actually too long. */
pre.code .l { display: block; position: relative; min-height: 1.6em; white-space: pre-wrap; overflow-wrap: anywhere;
  padding: 0 16px 0 calc(56px + var(--ind, 0ch) + 4ch); text-indent: calc(-1 * (var(--ind, 0ch) + 4ch)); }
pre.code .l::before { text-indent: 0; counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 42px; text-align: right; color: var(--muted); opacity: .55; }
pre.code .l.flash { background: var(--flash); transition: background 1.2s; }
.wrap pre.code .l { white-space: pre-wrap; word-break: break-word; }
.show-all { margin: 8px 16px 16px 56px; font: 500 13px var(--font-body); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.c-com { color: var(--muted); font-style: italic; }
/* A code box that scrolls gets a map of the whole file on its right, with the visible part outlined, and a bar
   at the bottom counting the lines below. Click or drag the map to move. */
.cv { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
.cv > pre.code { grid-column: 1; grid-row: 1; min-width: 0; }
.cv .mm { display: none; grid-column: 2; grid-row: 1 / span 2; position: sticky; top: 0; width: 72px; cursor: pointer;
  border-left: 1px solid var(--line); background: var(--code-bg); touch-action: none; }
.cv .more { display: none; grid-column: 1; grid-row: 2; position: sticky; bottom: 0; padding: 5px 16px 5px 56px;
  font: 500 12px var(--font-body); color: var(--muted); background: var(--surface);
  border-top: 1px solid var(--line); }
.cv.scrolls .mm, .cv.scrolls .more.on { display: block; }
.d-add { background: color-mix(in srgb, var(--t-str) 14%, transparent); display: block; }
.d-del { background: color-mix(in srgb, var(--accent, #8c2a3c) 12%, transparent); display: block; }
.c-mark { color: var(--accent, #8c2a3c); font-weight: 600; font-style: normal; }
.sect > .code > * + * { margin-top: 12px; }
.cap { font: 600 11px/1.2 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.c-str { color: var(--t-str); }
.c-var { color: var(--t-var); }
.c-bi { color: var(--t-builtin); }
.c-kw { color: var(--t-kw); font-weight: 500; }
.c-num { color: var(--t-num); }
.c-dir { color: var(--accent); font-weight: 600; }
.c-op { color: var(--muted); }
.c-rel { color: var(--t-rel); }
.c-pat { background: var(--t-pat-bg); border-radius: 3px; }
.c-atom { background: var(--t-atom-bg); border-radius: 3px; color: var(--t-builtin); font-weight: 500; }
.c-key { color: var(--accent-2); }
.c-lit { color: var(--t-num); }
a.rel { color: inherit; text-decoration: underline dotted var(--accent-2); text-underline-offset: 3px; cursor: pointer; }
a.rel:hover { color: var(--accent-2); text-decoration-style: solid; }
a.rel.lib { color: var(--accent-2); }
a.rel.nat { color: var(--t-builtin); text-decoration-color: var(--t-builtin); }
.sect .code .cv, .snip .cv { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.snip pre.code .l { padding-left: calc(16px + var(--ind, 0ch) + 4ch); }
.snip pre.code .l::before { display: none; }

/* ---- definition drawer ---- */
.drawer { position: fixed; top: 52px; right: 0; bottom: 0; width: min(680px, 100vw); background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0,0,0,.12); display: flex; flex-direction: column; transform: translateX(105%); transition: transform .18s ease; z-index: 20; }
.drawer.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } pre.code .l.flash { transition: none; } }
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer .dh h3 { margin: 0; font: 600 16px var(--font-mono); flex: 1; word-break: break-all; }
.drawer .dh button, .btn { font: 500 13px var(--font-body); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.drawer .dsub { padding: 8px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.drawer .dbody { overflow: auto; flex: 1; background: var(--code-bg); }
.drawer .dbody .grp { padding: 8px 16px 0; font-size: 12px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); padding: 10px 16px; }
.empty { padding: 40px 20px; color: var(--muted); }
kbd { font: 12px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Rerail logic <span class="ext">.rr</span></div>
  <nav class="views" aria-label="Views">
    <a href="#intro" data-view="intro">Intro</a>
    <a href="#syntax" data-view="syntax">Syntax</a>
    <a href="#library" data-view="library">Library</a>
    <a href="#packs" data-view="packs">Pack rules</a>
    <a href="#data-layer" data-view="data-layer">Data-layer rules</a>
    <a href="explorer.html">Explorer</a>
  </nav>
</header>
<main>
  <section class="view read" id="v-intro" aria-label="Intro"></section>
  <section class="view read" id="v-syntax" aria-label="Syntax"></section>

  <section class="view" id="v-library" aria-label="Library">
    <div class="bench">
      <aside class="side"><div class="head"><h3>Modules</h3></div><div class="list" id="lib-list" role="listbox" aria-label="Modules"></div></aside>
      <div class="work"><div class="bar" id="lib-bar"></div><div class="panes" id="lib-panes"></div></div>
    </div>
  </section>

  <section class="view" id="v-packs" aria-label="Pack rules">
    <div class="bench">
      <aside class="side">
        <div class="head">
          <h3>Packs</h3>
          <div class="chips" id="pack-chips"></div>
          <label for="pack-q" class="note" style="padding:0">Filter by rule id or description</label>
          <input type="search" id="pack-q" placeholder="e.g. exec, children, sql injection" autocomplete="off">
        </div>
        <div class="list" id="pack-list" role="listbox" aria-label="Rules"></div>
      </aside>
      <div class="work"><div class="bar" id="pack-bar"></div><div class="panes" id="pack-panes"></div></div>
    </div>
  </section>

  <section class="view" id="v-data-layer" aria-label="Data-layer rules">
    <div class="bench">
      <aside class="side"><div class="head"><h3>Hand-written rules</h3></div><div class="list" id="dl-list" role="listbox" aria-label="Rules"></div></aside>
      <div class="work"><div class="bar" id="dl-bar"></div><div class="panes" id="dl-panes"></div></div>
    </div>
  </section>
</main>

<aside class="drawer" id="drawer" aria-label="Definition" aria-hidden="true">
  <div class="dh"><button id="d-back" type="button" title="Back">←</button><h3 id="d-title"></h3><button id="d-close" type="button">Close</button></div>
  <div class="dsub" id="d-sub"></div>
  <div class="dbody" id="d-body"></div>
</aside>

<script id="data-libs" type="application/json">__LIBS__</script>
<script id="data-hand" type="application/json">__HAND__</script>
<script id="data-packs" type="application/json">__PACKS__</script>
<script id="data-stats" type="application/json">__STATS__</script>
<script id="data-intro" type="text/html">__INTRO__</script>
<script id="data-syntax" type="text/html">__SYNTAX__</script>
<script>
"use strict";
const LIBS = JSON.parse(document.getElementById("data-libs").textContent);
const HAND = JSON.parse(document.getElementById("data-hand").textContent);
const PACKS = JSON.parse(document.getElementById("data-packs").textContent);
const STATS = JSON.parse(document.getElementById("data-stats").textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const MAX_LINES = 2500;

// ---------- statements and definitions ----------
const DIRECTIVE_WORDS = new Set(["must", "may", "count", "min", "max", "sum", "mean", "code", "anchor", "suppress", "fix", "options", "each", "revision", "by", "at", "safe", "join", "sep", "ordered", "from", "floor", "drop", "report", "tag", "inputs", "lattice", "pragma"]);
const TYPE_WORDS = new Set(["node", "span", "loc", "symbol", "number", "relation"]);
const BUILTIN_FNS = new Set(["match", "match_all", "cat", "strlen", "substr", "to_number", "to_string", "contains", "ord"]);
const isDecl = s => s.kind === "decl" || s.kind === "native" || s.kind === "edit" || s.kind === "functor";
function statements(src) {
  const lines = src.split("\n"); const out = []; let cur = null;
  lines.forEach((ln, i) => {
    const t = ln.replace(/\/\/.*$/, "").trimEnd();
    if (cur === null) {
      if (!t.trim() || /^\s/.test(ln)) return;
      const m = t.match(/^(?:\.(decl|native|violation|edit|functor)\s+)?(?:(?:must|may|edit)\s+)?([A-Za-z_]\w*)\s*\(/);
      cur = { start: i, end: i, kind: m ? (m[1] || "rule") : "other", name: m ? m[2] : null };
      if ((t.startsWith(".") || t.startsWith("#")) && !(m && m[1])) { cur.kind = "directive"; cur.name = null; }
    }
    if (cur) {
      cur.end = i;
      const next = lines[i + 1];
      const contin = next !== undefined && /^\s+\S/.test(next) && !/^\s*\/\//.test(next);
      if (cur.kind === "rule" ? /\.\s*$/.test(t) && !contin : !contin) { out.push(cur); cur = null; }
    }
  });
  if (cur) out.push(cur);
  return out;
}
function defsOf(src) {
  const map = new Map();
  for (const st of statements(src)) {
    if (!st.name) continue;
    if (!map.has(st.name)) map.set(st.name, []);
    map.get(st.name).push(st);
  }
  return map;
}
const LIBDEFS = {};
const DEFINERS = new Map();
for (const [mod, lib] of Object.entries(LIBS)) {
  LIBDEFS[mod] = defsOf(lib.src);
  for (const [name, sts] of LIBDEFS[mod]) {
    if (!sts.some(s => isDecl(s))) continue;
    if (!DEFINERS.has(name)) DEFINERS.set(name, []);
    DEFINERS.get(name).push(mod);
  }
}
function usesOf(src) {
  const set = new Set(["core"]);
  const add = m => { if (set.has(m) || !LIBS[m]) return; set.add(m); for (const u of usesOf(LIBS[m].src)) set.add(u); };
  for (const m of src.matchAll(/^#include\s+"([\w/]+)\.rr"/gm)) add(m[1]);
  return set;
}
function resolveLib(name, uses, lang) {
  const mods = DEFINERS.get(name);
  if (!mods) return null;
  const pref = mods.find(m => uses.has(m));
  if (pref) return pref;
  const fam = lang === "python" ? "python/" : /typescript|javascript|tsx/.test(lang || "") ? "tsx/" : null;
  return (fam && mods.find(m => m.startsWith(fam))) || mods[0];
}

// ---------- highlighting ----------
// Soufflé form: a bare name in an atom is a variable (c-var); a name before `(` is a relation, a stop-set argument
// that names a known relation links to it too. `$X` appears only inside backtick patterns and templates.

  $("#d-sub").innerHTML = `<span class="pill ${nat ? "native" : "datalog"}">${nat ? "native, in the binary" : lib.kind === "program" ? "a typing program, run before the rules" : "Datalog, shipped as a library"}</span>

    el.innerHTML = `<span class="id">${esc(h.title)}</span><span class="meta">${h.tags.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</span>`;
    el.addEventListener("click", () => showHand(i));
    el.addEventListener("keydown", e => { if (e.key === "Enter") showHand(i); });
    list.appendChild(el);
  });
}
async function showHand(i, variant) {
  const h = HAND[i];
  $("#dl-list").querySelectorAll(".item").forEach(x => x.setAttribute("aria-selected", x.dataset.i == i));
  $("#dl-bar").innerHTML = `<h2>${esc(h.title)}</h2><p>${esc(h.summary)}</p><div class="tabs" role="tablist"></div>`;
  $("#dl-panes").innerHTML = `<div class="note">Loading…</div>`;
  let data;
  try { data = (await loadHand())[h.key]; } catch (e) { $("#dl-panes").innerHTML = `<div class="note">Could not load the rule texts (${esc(e.message)}). Reload the page to try again.</div>`; return; }
  const tabs = $("#dl-bar .tabs");
  h.views.forEach((v, k) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.setAttribute("role", "tab");
    b.textContent = v.label; b.setAttribute("aria-selected", k === (variant || 0));
    b.addEventListener("click", () => showHand(i, k));
    tabs.appendChild(b);
  });
  const v = h.views[variant || 0];
  panes($("#dl-panes"), v.panes.map(p => {
    let text = data[p.src];
    if (p.lang === "json") text = pretty(text);
    return { title: p.title, meta: `${lineCount(text).toLocaleString()} lines · ${kb(text.length)}`, text, lang: p.lang };
  }));
}

// ---------- syntax view ----------
function buildRead(view) {
  const root = $("#v-" + view);
  root.innerHTML = document.getElementById("data-" + view).textContent.replace(/\{\{(\w+)\}\}/g, (_, k) => STATS[k] ?? "");
  root.querySelectorAll("[data-rr]").forEach(el => renderCode(el, el.textContent.replace(/^\n/, ""), "rr", { all: true }));
  root.querySelectorAll("[data-json]").forEach(el => renderCode(el, el.textContent.replace(/^\n/, ""), "json", { all: true }));
  root.querySelectorAll("[data-src]").forEach(el => renderCode(el, el.textContent.replace(/^\n/, ""), "src", { all: true }));
  root.querySelectorAll("[data-diff]").forEach(el => renderCode(el, el.textContent.replace(/^\n/, ""), "diff", { all: true }));
}

// ---------- routing ----------
const VIEWS = ["intro", "syntax", "library", "packs", "data-layer"];
let started = {};
function route() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "intro";
  VIEWS.forEach(n => $("#v-" + n).classList.toggle("on", n === v));
  document.querySelectorAll("nav.views a").forEach(a => { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (v === "library" && !started.library) { started.library = 1; showLib("python/names"); }
  if (v === "packs" && !started.packs) { started.packs = 1; selectPack("python", "bandit-b102-exec-used"); }
  if (v === "data-layer" && !started.dl) { started.dl = 1; showHand(0); }
}
buildRead("intro"); buildRead("syntax"); buildLib(); buildPacks(); buildHand();
window.addEventListener("hashchange", route);
route();
</script>
