[package]
name = "rrlab"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lab tool: tree-sitter facts for core.rr's tape relations, for lowering .rr rules to Soufflé"

# Its own workspace: not part of the engine's.
[workspace]

[[bin]]
name = "rrlab-facts"
path = "src/main.rs"

[dependencies]
tree-sitter = "=0.27.1"
tree-sitter-language = "=0.1.9"
tree-sitter-rust = "=0.24.2"
tree-sitter-php = "=0.24.2"
serde_json = "1.0"

[build-dependencies]
cc = "=1.10.0"
tree-sitter-generate = { version = "=0.27.1", default-features = false }
flate2 = "=1.1.10"

# The build script generates the vendored grammars' parsers; tree-sitter-generate is several times faster optimised.
[profile.dev.build-override]
opt-level = 3
