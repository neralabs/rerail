# The Bitlex reference evaluator (docs/parser-generators/03-bitlex.md). Detached from the main
# workspace, so the engine build does not see it.
[workspace]

[package]
name = "bitlex"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# The differential binary's tree-sitter. The library has no dependencies, so the engine can use
# its parser and evaluator without linking a second copy of the grammars.
default = ["oracle"]
oracle = ["dep:tree-sitter", "dep:tree-sitter-python", "dep:tree-sitter-json"]

[dependencies]
tree-sitter = { version = "=0.27.1", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }

[[bin]]
name = "bitlex"
required-features = ["oracle"]

[profile.release]
debug = false
