[package]
name = "rerail-reachability-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Isolate experimental SQLite features from the engine's dependency graph.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "=0.40.2", features = ["loadable_extension", "functions", "vtab", "modern_sqlite"] }
serde_json = "1.0"
fallible-iterator = "0.3"
regex = "=1.13.1"

[profile.release]
debug = 1
