[package]
name = "rerail-reachability-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Keep loadable-extension linking out of the engine's optional profiling build.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension"]
extension = ["rusqlite/loadable_extension"]

[dependencies]
rusqlite = { version = "=0.40.2", features = ["functions", "vtab", "modern_sqlite"] }
serde_json = "1.0"
fallible-iterator = "0.3"
regex = "=1.13.1"

[dev-dependencies]
libc = "0.2"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }

[profile.release]
debug = 1
