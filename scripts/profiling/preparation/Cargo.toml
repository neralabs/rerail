[package]
name = "rerail-sql-preparation-lab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["code-rule-profile"]
code-rule-profile = []

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "limits", "functions", "hooks", "vtab", "series", "modern_sqlite"] }
regex = "=1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = { version = "0.12", features = ["arc_lock"] }
foldhash = "=0.2.0"
tempfile = "=3.27.0"
libc = "0.2.189"

[profile.release]
codegen-units = 256
lto = false

[profile.release.package.rerail-sql-preparation-lab]
opt-level = 1
