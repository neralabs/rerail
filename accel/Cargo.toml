[package]
name = "rerail-accel"
version = "0.1.0"
edition = "2024"
publish = false
description = "Relational kernels on every compute lane (CPU, SME, GPU, Neural Engine) and the executor that batches their launches (decision 0098)."

[features]
# Each lane can be built alone (`--no-default-features --features gpu`), so work on one lane never waits on another.
default = ["sme", "gpu", "ane"]
sme = []
gpu = []
ane = []
# The tests' shared object for reads outside a run (decision 0442; `rerail_context::TESTS`).
test-hooks = ["rerail-context/test-hooks"]

[dependencies]
rerail-context = { path = "../native/crates/context" }
rayon = "=1.12.0"
parking_lot = "0.12"
sha2 = "0.10"
libc = "0.2.189"
rerail-forest = { path = "../forest" }
# The join model's name tables (`join_model`): a short name's lookup is 150 ns under std's SipHash.
rustc-hash = "=2.1.3"
# The one block policy (`blocks`, decision 0342) on every target: host blocks everywhere, blocks leased from the
# GPU pool on macOS (`gpu::shared::lease_block_within`, decision 0266 §12).
rerail-blocks = { path = "../native/crates/blocks" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2.7"
block = "0.1.6"
core-foundation-sys = "0.8.7"
# A kernel that takes UKL's library (the reads written once in CLIF) preprocessed before the Metal front end
# (`gpu::kernels::msl`, decision 0440 §3.3).
rerail-ukl = { path = "../native/crates/ukl" }
# The pool's buffers and the blocks' wraps: the device layer's (decision 0440 step B).
rerail-device = { path = "../gpu/device" }
# Kernels on a device other than Metal, compiled from UKL by the device layer (`gpu::kernels::function`, 0440 step C).
rerail-gpu = { path = "../gpu" }

[build-dependencies]
cc = "=1.11.1"

[lints.rust]
# objc 0.2's `msg_send!` tests a `cargo-clippy` feature in the calling crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
rerail-context = { path = "../native/crates/context", features = ["test-hooks"] }
