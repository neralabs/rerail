[package]
name = "rerail-accel-gpu"
version = "0.1.0"
edition = "2024"
publish = false
description = "The accelerator's device side: the learned models rerail-forest trains on the device, registered as the engine boots."

[features]
# The test hooks of the crates below.
test-hooks = ["rerail-accel/test-hooks"]

[dependencies]
rerail-accel = { path = ".." }
# The forests, trained and walked on the device (decision 0100 §14, 0354).
rerail-forest = { path = "../../forest" }
# The process's device, and Metal's awaited GPU seconds.
rerail-device = { path = "../../gpu/device" }
rustc-hash = "=2.1.3"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-accel-gpu = { path = ".", features = ["test-hooks"] }
