[package]
name = "rerail-facts"
version = "0.0.0"
edition = "2024"
publish = false
description = "Facts engine (Phase 2): rule IR, SQL and pattern front ends, per-file/repository classifier."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
globset = "=0.4.20"
regex = "=1.13.1"
blake3 = "1"
