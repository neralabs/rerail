[package]
name = "rerail-forest"
version = "0.1.0"
edition = "2024"
publish = false
description = "MLDB's random forests trained and predicted on the GPU (Metal), and the learned cost model built on them."

[dependencies]
rayon = "=1.12.0"
sha2 = "0.10"
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2.7"
block = "0.1.6"

[build-dependencies]
cc = "=1.8.0"
