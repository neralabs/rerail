[workspace]
members = ["native", "accel", "accel/gpu", "forest", "gpu", "gpu/device", "native/crates/error", "native/crates/compiler", "native/crates/rir", "native/crates/bitlex", "native/crates/cpu_block", "native/crates/cpu_pp", "native/crates/cpu_stream", "native/crates/json_aot", "native/crates/rr_syntax", "native/crates/tape_format", "native/crates/parser_tests", "native/crates/prof", "native/crates/metal", "native/crates/metal_programs", "native/crates/rr_parser", "native/crates/store_base", "native/crates/atoms", "native/crates/observe", "native/crates/store", "native/crates/device_metal", "native/crates/ygraph", "native/crates/facts_base", "native/crates/facts", "native/crates/sql_profile", "native/crates/overlay", "native/crates/slabs", "native/crates/lang", "native/crates/lang_ecma", "native/crates/lang_json", "native/crates/forte", "native/crates/lang_php", "native/crates/cpython", "native/crates/lang_python", "native/crates/lang_rust", "native/crates/lang_sql", "native/crates/costs", "native/crates/logic_core", "native/crates/run", "native/crates/setfix", "native/crates/plan_base", "native/crates/plan_search", "native/crates/planner", "native/crates/typing", "native/crates/corpus_memo", "native/crates/corpus_prep", "native/crates/json_rules", "native/crates/rr_root", "native/crates/logic", "native/crates/rr", "native/crates/program_image", "native/crates/sessions_base", "native/crates/sessions", "native/crates/node_space", "native/crates/transducer_base", "native/crates/transducer_cpu", "native/crates/transducer", "native/crates/adapters", "native/crates/matcher", "native/crates/rules_base", "native/crates/p_anchors", "native/crates/d_relational", "native/crates/d_anchors", "native/crates/rules", "native/crates/workspace", "native/crates/rr_aot", "native/crates/simdjson", "native/crates/simdjson_native", "native/crates/python_lean", "native/crates/simd8", "native/crates/tree_watch", "native/crates/ecma_lean", "native/crates/rust_lean", "native/crates/java_lean", "native/crates/csharp_lean", "native/crates/php_lean", "native/crates/html_lean", "native/crates/css_lean", "native/crates/markdown_lean", "native/crates/markdown_inline_lean", "native/crates/sql_lean", "native/crates/vue_lean", "native/crates/kotlin_lean", "native/crates/swift_lean", "native/crates/scala_lean", "native/crates/blocks", "native/crates/go_lean", "native/crates/c_lean", "native/crates/clif", "native/crates/json_lean", "native/crates/kotlin_parser", "native/crates/c_directives", "native/crates/context", "native/crates/ukl", "native/crates/ukl_aot", "native/crates/kotlin_aot", "native/crates/registry", "native/crates/prefilter", "native/crates/boot", "native/crates/demand_catalog", "native/crates/tests_demand", "native/crates/tests_conformance", "native/crates/tests_cpu", "native/crates/tests_admission", "native/crates/tests_transducer", "native/crates/tests_corpus", "native/crates/tests_rr", "native/crates/tests_sql", "native/crates/tests_logic", "native/crates/tests_resolve", "native/crates/tests_scope", "native/crates/tests_value", "native/crates/tests_calls", "native/crates/tests_compile", "native/crates/tests_anchors", "native/crates/tests_workspace", "native/crates/tests_findings", "native/crates/tests_matcher", "native/crates/tests_tape", "native/crates/tests_lang", "native/crates/ukl_vec"]
# The Bitlex evaluator keeps its own workspace (its tree-sitter oracle); the engine uses its library.
exclude = ["scripts/profiling/reachability", "scripts/profiling/preparation", "tools/bitlex"]
resolver = "2"

[patch.crates-io]
block = { path = "native/vendor/block-0.1.6" }
# Language is Send and Sync on wasm too (native/vendor/tree-sitter-0.27.1/PATCHES.md).
tree-sitter = { path = "native/vendor/tree-sitter-0.27.1" }
# Patterns end their children where a tape leaves out implied tokens (native/vendor/ast-grep-core-0.51.0/PATCHES.md).
ast-grep-core = { path = "native/vendor/ast-grep-core-0.51.0" }
# Cranelift with `clmul`, a carry-less multiply (native/vendor/cranelift-codegen-0.125.4/PATCHES.md).
cranelift-codegen = { path = "native/vendor/cranelift-codegen-0.125.4" }
cranelift-codegen-meta = { path = "native/vendor/cranelift-codegen-meta-0.125.4" }
cranelift-assembler-x64-meta = { path = "native/vendor/cranelift-assembler-x64-meta-0.125.4" }
cranelift-native = { path = "native/vendor/cranelift-native-0.125.4" }
# A job carries its maker's run to the thread that steals it (native/vendor/rayon-core-1.13.0/PATCHES.md).
rayon-core = { path = "native/vendor/rayon-core-1.13.0" }

# Dependencies (SQLite's C, tree-sitter, regex, cranelift, ast-grep) are optimized in dev and test
# builds: they compile once and stay cached. The workspace's own crates are at opt-level 1 (`[profile.dev]`).
[profile.dev.package."*"]
opt-level = 3

# The kernels' Rust as rerail-ukl-vec writes it (`rerail-ukl-aot`, decision 0567): register-resident NEON, every
# function `#[inline(always)]`. Unoptimized, each inlined call's temporaries are one frame's, which overflows a test
# thread's stack, and it is not the code under test.
[profile.dev.package.rerail-ukl-aot]
opt-level = 3

# simdjson's tree (`rerail-simdjson`) runs a step per token of every JSON file: optimized as a dependency's code.
[profile.dev.package.rerail-simdjson]
opt-level = 3

[profile.dev.package.rerail-simdjson-native]
opt-level = 3

# simdjson translated (`rerail-json-lean`), a reference read against simdjson's machine code: compiled
# as simdjson is, optimized and without checks.
[profile.dev.package.rerail-json-lean]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The lean Python parser (`rerail-python-lean`) runs a step per token of every Python file, as simdjson's does.
[profile.dev.package.rerail-python-lean]
opt-level = 3

# The lean ECMAScript parser (`rerail-ecma-lean`), the same: a step per token of every JavaScript,
# TypeScript and TSX file.
[profile.dev.package.rerail-ecma-lean]
opt-level = 3

# The lean Rust parser (`rerail-rust-lean`), the same: a step per token of every Rust file.
[profile.dev.package.rerail-rust-lean]
opt-level = 3

# The lean Java parser (`rerail-java-lean`), the same: a step per token of every Java file.
[profile.dev.package.rerail-java-lean]
opt-level = 3

# The lean C# parser (`rerail-csharp-lean`), the same: a step per token of every C# file.
[profile.dev.package.rerail-csharp-lean]
opt-level = 3

# The lean Kotlin, Swift and Scala parsers, the same: a step per token of every file.
[profile.dev.package.rerail-kotlin-lean]
opt-level = 3

[profile.dev.package.rerail-swift-lean]
opt-level = 3

[profile.dev.package.rerail-scala-lean]
opt-level = 3

# The lean Go parser (`rerail-go-lean`), the same: a step per token of every Go file.
[profile.dev.package.rerail-go-lean]
opt-level = 3

# The UKL interpreter (`rerail-ukl-vec`, decision 0567): a step per node of a kernel per thread of every launch on
# the CPU's interpreted path, optimized as the lean parsers are, so the library's tests run in seconds.
[profile.dev.package.rerail-ukl-vec]
opt-level = 3

# The lean C and C++ parser (`rerail-c-lean`), the same: a step per token of every C and C++ file.
[profile.dev.package.rerail-c-lean]
opt-level = 3

# The lean PHP parser (`rerail-php-lean`), the same: a step per token of every PHP file.
[profile.dev.package.rerail-php-lean]
opt-level = 3

# The lean HTML parser (`rerail-html-lean`), the same: a step per tag of every HTML file.
[profile.dev.package.rerail-html-lean]
opt-level = 3

# The lean CSS parser (`rerail-css-lean`), the same: a step per token of every CSS file.
[profile.dev.package.rerail-css-lean]
opt-level = 3

# The lean Markdown parser (`rerail-markdown-lean`), the same: a step per token of every Markdown file.
[profile.dev.package.rerail-markdown-lean]
opt-level = 3

# The lean parser of Markdown's inline grammar (`rerail-markdown-inline-lean`), the same: a step per
# token of every inline text.
[profile.dev.package.rerail-markdown-inline-lean]
opt-level = 3

# The lean `.rerail` parser (`rerail-rr-syntax`), the same: a step per token of every rule file a run reads (its libraries'
# too) and of every program text read back (decision 0275). Its crate is small (the parser, its tape, the statements).
[profile.dev.package.rerail-rr-syntax]
opt-level = 3

# The lean Vue parser (`rerail-vue-lean`), the same: a step per tag of every Vue file.
[profile.dev.package.rerail-vue-lean]
opt-level = 3

# The grammar compiler (`rerail-compiler`: Bitlex's lowering, its prover `bitlex_prove`, tier 2's
# lowering) proves hundreds of mask questions for each grammar a test compiles (C's token grammar:
# minutes unoptimized, work queue Q131).
[profile.dev.package.rerail-compiler]
opt-level = 3

# The crates split from it hold the same code, so they are built as it is: Bitlex's
# lowering and its prover (`rerail-bitlex`), and the lowerings to Cranelift (`rerail-rir`, `rerail-cpu-block`,
# `rerail-cpu-stream`, `rerail-cpu-pp`). Unoptimized, Kotlin's tier 1 alone takes minutes to write.
[profile.dev.package.rerail-bitlex]
opt-level = 3

[profile.dev.package.rerail-rir]
opt-level = 3

[profile.dev.package.rerail-cpu-block]
opt-level = 3

[profile.dev.package.rerail-cpu-stream]
opt-level = 3

[profile.dev.package.rerail-cpu-pp]
opt-level = 3

# simdjson's operations (`rerail-simd8`) are each a few instructions, inlined into the kernels that use them.
[profile.dev.package.rerail-simd8]
opt-level = 3

# The tape writer (`rerail-tape-format`) runs a step per node of every parser that writes the tape
# directly (the lean Python parser, `.rerail`'s): its non-generic code (`block`, `put`) unoptimized was
# most of the lean parser's time in dev builds.
[profile.dev.package.rerail-tape-format]
opt-level = 3

# Dev and test builds keep file and line numbers (panics, backtraces) but not full debug info: the
# test binary was ~300 MB, mostly DWARF, and linking it dominated each rebuild. For a debugger,
# build with full debug info: `cargo test --profile debugging` (or `cargo build --profile debugging`).
#
# The workspace's crates at opt-level 1 (the user, 2026-11-22). Measured on a Linux Spark, the corpus tests
# (rerail-tests-corpus, 203, six test threads): 121 s at opt-level 0, 47 s at 1 (612 -> 145 s of user CPU);
# opt-level 2 ran no faster. A first build takes 92 s longer (112 -> 204 s); a one-line edit's rebuild is
# unchanged (24-26 s either way).
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.debugging]
inherits = "dev"
debug = true
opt-level = 0

[profile.debugging.package."*"]
opt-level = 3

# Timings (`cargo test --profile profiling`): this crate optimized too, built incrementally and in
# parallel rather than as a release (no LTO), so a measurement is of optimized code without a
# release's link time. Unoptimized test builds run host code many times slower than shipped.
[profile.profiling]
inherits = "dev"
opt-level = 3
debug-assertions = false
overflow-checks = false
incremental = true
codegen-units = 256

# The parsers' generated code (`rerail-rr-aot`, written from the grammar): no debug info, as
# its earlier lowering of the IR, whose nesting overflowed LLVM's debug info walk, needed; its
# code is the same without.
[profile.profiling.package.rerail-rr-aot]
debug = false

# Kotlin's parser's generated code (`rerail-kotlin-aot`), as `rerail-rr-aot`'s.
[profile.profiling.package.rerail-kotlin-aot]
debug = false

# JSON's parser's generated code (`rerail-json-aot`), as Kotlin's.
[profile.profiling.package.rerail-json-aot]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
# Never strip through rustc: on Xcode 27 the linker-side strip rewrites LINKEDIT so
# dyld rejects the cdylib ("mis-aligned LINKEDIT string pool"). Unstripped costs ~1 MB.
strip = "none"

# The two units a cold release build waits on alone, split so the runner's cores share them (cold Linux x64 on 4
# cores: 943 s to 566 s). Every other crate, the matcher, tape, store and lean parsers among them, keeps one unit.
# - `rerail-logic`, the Datalog engine, no part of the product's audit path: at one unit its LLVM pass was 425 of the
#   build's 960 s, 380 of them with nothing else running.
# - `rerail-engine`, the addon's own crate: its one unit and the link took 170 s on about one core. Its override
#   repeats `strip`: without it cargo strips the crate's debug info through rustc, which overrides the release
#   script's `-s` (the Linux engine kept its symbol tables, 17 MB) and would hit the Xcode bug above.
[profile.release.package.rerail-logic]
codegen-units = 16

[profile.release.package.rerail-engine]
codegen-units = 16
strip = "none"

# The build script generates the vendored grammars' parsers (native/build.rs): tree-sitter-generate runs several times
# faster optimised (TypeScript's parser in 1 s rather than 7 s), and regenerating SQL's committed parser takes 7 to 10
# minutes rather than half an hour.
[profile.release.build-override]
opt-level = 3

# A debug build generates the same parsers; unoptimised generation can exceed the bounded profiling deadline.
[profile.dev.package.tree-sitter-generate]
opt-level = 3

# Anchor-selection lab (`matcher/anchors/sql/lab.rs`): the crate stays incremental, dependencies
# (SQLite above all) run optimised, so an iteration takes seconds instead of a release build.
[profile.lab]
inherits = "dev"

[profile.lab.package."*"]
opt-level = 3

# The browser build (native/wasm): optimised for size, built in parallel and without LTO, so an iteration takes
# minutes rather than release's single-unit thin LTO (10 minutes for wasm32 on a loaded machine).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 16

# Experiment (build-and-test-loop-time): the engine's crates at opt-level 1 for test runs.
[profile.test-o1]
inherits = "dev"
opt-level = 1

[profile.test-o1.package."*"]
opt-level = 3

[profile.test-o1.package.rerail-rr-aot]
debug = false
