# Written first by tools/cratify/apply.py (the crate split) and kept by hand since: its sources are where they were,
# mounted in place (src/lib.rs).
[package]
name = "rerail-facts"
version = "0.1.0"
edition = "2024"
publish = false
description = "The engine's facts: the syntax table and the families' store reads, over the facts' base."

[features]
default = ["all-languages", "dump-cli", "python-syntax-error", "tape-cache", "rerail-lang/default", "rerail-clif/default", "rerail-facts-base/default"]
all-languages = ["lang-blade", "lang-c", "lang-cpp", "lang-csharp", "lang-css", "lang-go", "lang-html", "lang-java", "lang-javascript", "lang-json", "lang-kotlin", "lang-markdown", "lang-php", "lang-python", "lang-rr", "lang-rust", "lang-scala", "lang-sql", "lang-swift", "lang-typescript", "lang-vue", "rerail-lang/all-languages", "rerail-facts-base/all-languages"]
lang-blade = ["rerail-lang/lang-blade", "rerail-facts-base/lang-blade"]
lang-csharp = ["ast-grep-language/tree-sitter-c-sharp", "rerail-lang/lang-csharp", "rerail-facts-base/lang-csharp"]
lang-css = ["ast-grep-language/tree-sitter-css", "rerail-lang/lang-css", "rerail-facts-base/lang-css"]
lang-html = ["ast-grep-language/tree-sitter-html", "rerail-lang/lang-html", "rerail-facts-base/lang-html"]
lang-java = ["ast-grep-language/tree-sitter-java", "rerail-lang/lang-java", "rerail-facts-base/lang-java"]
lang-go = ["ast-grep-language/tree-sitter-go", "rerail-lang/lang-go", "rerail-facts-base/lang-go"]
lang-c = ["ast-grep-language/tree-sitter-c", "rerail-lang/lang-c", "rerail-facts-base/lang-c"]
lang-cpp = ["ast-grep-language/tree-sitter-cpp", "rerail-lang/lang-cpp", "rerail-facts-base/lang-cpp"]
lang-javascript = ["rerail-lang/lang-javascript", "rerail-facts-base/lang-javascript"]
lang-json = ["ast-grep-language/tree-sitter-json", "rerail-lang/lang-json", "rerail-facts-base/lang-json"]
lang-kotlin = ["ast-grep-language/tree-sitter-kotlin", "rerail-lang/lang-kotlin", "rerail-facts-base/lang-kotlin"]
lang-markdown = ["rerail-lang/lang-markdown", "rerail-facts-base/lang-markdown"]
lang-php = ["ast-grep-language/tree-sitter-php", "rerail-lang/lang-php", "rerail-facts-base/lang-php"]
lang-python = ["rerail-lang/lang-python", "rerail-facts-base/lang-python"]
lang-rr = ["rerail-lang/lang-rr", "rerail-facts-base/lang-rr"]
lang-rust = ["ast-grep-language/tree-sitter-rust", "rerail-lang/lang-rust", "rerail-facts-base/lang-rust"]
lang-scala = ["ast-grep-language/tree-sitter-scala", "rerail-lang/lang-scala", "rerail-facts-base/lang-scala"]
lang-sql = ["rerail-lang/lang-sql", "rerail-facts-base/lang-sql"]
lang-swift = ["ast-grep-language/tree-sitter-swift", "rerail-lang/lang-swift", "rerail-facts-base/lang-swift"]
lang-typescript = ["rerail-lang/lang-typescript", "rerail-facts-base/lang-typescript"]
lang-vue = ["rerail-lang/lang-vue", "rerail-facts-base/lang-vue"]
headless = ["napi-derive/noop", "rerail-lang/headless", "rerail-facts-base/headless"]
dump-cli = ["rerail-lang/dump-cli", "rerail-facts-base/dump-cli"]
python-syntax-error = ["rerail-lang/python-syntax-error", "rerail-facts-base/python-syntax-error"]
tape-cache = ["rerail-lang/tape-cache", "rerail-facts-base/tape-cache"]
tape-reads = ["rerail-lang/tape-reads", "rerail-facts-base/tape-reads"]
system-allocator = ["rerail-lang/system-allocator", "rerail-facts-base/system-allocator"]
code-rule-profile = ["rerail-lang/code-rule-profile", "rerail-facts-base/code-rule-profile"]
p-anchor-corpus = ["rerail-lang/p-anchor-corpus", "rerail-facts-base/p-anchor-corpus"]
metal-tests = ["rerail-lang/metal-tests", "rerail-facts-base/metal-tests"]
test-hooks = ["rerail-tape-format/test-hooks", "rerail-clif/test-hooks", "rerail-blocks/test-hooks", "rerail-lang/test-hooks", "dep:tempfile", "rerail-prof/test-hooks", "rerail-rr-syntax/test-hooks", "rerail-observe/test-hooks", "rerail-facts-base/test-hooks"]

[dependencies]
# A chunk's admitted values' parts, read without a lock by every probe of a layered source (`values::Values`).
arc-swap = "=1.9.3"
# Blocks (decision 0266): a batch's chunk block (decision 0289), the automata's block (0478 step 2c), and the
# block `Vector`s every platform holds rows in.
rerail-blocks = { path = "../blocks" }
rerail-section = { path = "../section" }
# `\\?\` free canonical paths on Windows (std's are verbatim, which `/`-joined text and text comparisons break).
dunce = "=1.0.5"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false }
cranelift-codegen = "=0.125.4"
cranelift-frontend = "=0.125.4"
cranelift-module = "=0.125.4"
foldhash = "=0.2.0"
hashbrown = { version = "=0.16.1", default-features = false }
gix = { version = "=0.90.0", default-features = false, features = ["status", "parallel", "sha1", "sha256", "revision"] }
globset = "=0.4.21"
aho-corasick = "=1.1.5"
model2vec-rs = { version = "0.4.0", default-features = false, features = ["fancy-regex", "local-only"] }
napi = { version = "3.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.0"
indexmap = "=2.14.2"
memchr = "=2.8.3"
num-bigint = "=0.5.1"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rayon = "=1.12.0"
serde = { version = "1.0", features = ["derive"] }
fancy-regex = "=0.17.0"
regex = "=1.13.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
rusqlite = { version = "=0.41.1", features = ["bundled", "column_decltype", "functions", "hooks", "limits", "modern_sqlite", "series", "vtab"] }
fallible-iterator = "0.3"
ruff_python_parser = "=0.0.10"
ruff_python_ast = "=0.0.10"
ruff_text_size = "=0.0.10"
rustc-hash = "=2.1.3"
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
sha1 = "0.11"
sha2 = "0.11"
tree-sitter-language = "=0.1.9"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tree-sitter = "=0.27.1"
bitlex = { path = "../../../tools/bitlex", default-features = false }
unicode-normalization = "=0.1.26"
zstd = "=0.14.3"
tempfile = { version = "=3.27.0", optional = true }
rerail-lang = { path = "../lang", default-features = false }
rerail-tape-format = { path = "../tape_format" }
# A projection's numbering's descriptor and its reads (`rerail_clif::ids`).
rerail-clif = { path = "../clif", default-features = false }
rerail-prof = { path = "../prof" }
rerail-rr-syntax = { path = "../rr_syntax" }
# The store's interface and records (`content_store::FactStore`).
rerail-observe = { path = "../observe" }
rerail-accel = { path = "../../../accel" }
# The device layer's buffers, as a view read in place names them for the stages (`vtab::ViewInPlace`).
rerail-device = { path = "../../../gpu/device" }
# The facts' base, which this crate mounts its modules over (`code_rule_dsl::facts`).
rerail-facts-base = { path = "../facts_base", default-features = false }
# The device's chunk axis' slot (`device_chunk::CHUNK_AXIS`).
rerail-registry = { path = "../registry" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-jit = { version = "=0.125.4", features = ["selinux-fix"] }

[target.'cfg(target_family = "wasm")'.dependencies]
cranelift-jit-wasm = { path = "../../wasm/cranelift-jit" }
libc = "0.2.189"

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
libc = "0.2.189"

[target.'cfg(not(any(windows, target_family = "wasm")))'.dependencies]
tikv-jemallocator = { version = "=0.7.0", features = ["disable_initial_exec_tls"] }
tikv-jemalloc-ctl = { version = "=0.7.0", features = ["stats"] }
tikv-jemalloc-sys = { version = "=0.7.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
metal = "0.33.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-facts = { path = ".", features = ["test-hooks"] }
# The tests open stores (the library holds one through `FactStore`).
rerail-store = { path = "../store", features = ["test-hooks"] }
ast-grep-language = { version = "=0.51.0", default-features = false, features = ["tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-c-sharp", "tree-sitter-css", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-json", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-php", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-swift"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "limits", "hooks", "array"] }
