[package]
name = "rerail-c-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean C and C++ parser for the tape alone: tree-sitter-c's and tree-sitter-cpp's tapes, written as the parse goes, its lexer in 64-byte blocks."

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }
# Names past ASCII (`XID_Start`, `XID_Continue`), as tree-sitter-c's and tree-sitter-cpp's identifiers read them.
unicode-ident = "=1.0.27"

[dependencies.rerail-simd8]
path = "../simd8"
