[package]
name = "rerail-ecma-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean JavaScript, TypeScript and TSX parser for the tape alone: tree-sitter-javascript's, -typescript's and -tsx's tape, written as the parse goes, its lexer in 64-byte blocks."

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }

[dependencies.rerail-simd8]
path = "../simd8"
