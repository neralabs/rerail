[package]
name = "rerail-blocks"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike for decision 0266: blocks holding nested, self-relative structures; base + delta; freeze; read and written on CPU and GPU."

[features]
# The tests' shared object for reads outside a run (decision 0442).
test-hooks = ["rerail-context/test-hooks"]

[dependencies]
rerail-context = { path = "../context" }
# Plain values, rooms and the vector, below the tape format (decision 0628 §3); this crate's blocks are their room.
rerail-vector = { path = "../vector" }
# The block formats with no allocator under them (decision 0686): the words, the reference table, the shape's words and
# the δ runs block, re-exported from `gens` and `layer`.
rerail-delta-core = { path = "../delta_core" }
libc = "0.2.189"
rayon = "=1.12.0"
# A structure in a block (`maps::Vector`) is written and read as a sequence, as the `Vec` it replaces was.
serde = "1.0"
# A `DICT` column's distinct values, counted at seal (`col::choose_for_reads`).
rustc-hash = "=2.1.3"
# A blob's name, its bytes' sha256 (`blob::BlobId`, P§12 item 1).
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
# Windows' memory calls for blocks and scratch regions (`windows`); `CreateFileMappingW` takes its security attributes from `Win32_Security`;
# a block's file is made sparse with `DeviceIoControl` (`Win32_System_IO`, `Win32_System_Ioctl`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Memory"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
# A block's device buffer (`Block::device_buffer`, `Backing::buffer`): the device layer's, on every backend
# (decision 0440 step B).
rerail-device = { path = "../../../gpu/device" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The deallocator of a no-copy Metal buffer (examples/deferrable).
block = "0.1.6"
metal = "0.33.0"

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dev-dependencies]
# The kernels' launcher (the join of examples/paces, the reads' test): the device layer's programs, which preprocess
# a source with the relation's reads (`<ukl/reads/relation.h>`; decision 0440 §3.3). Above this crate, so a
# dev-dependency: the crate itself never compiles or launches a kernel.
rerail-gpu = { path = "../../../gpu" }

[dev-dependencies]
rerail-blocks = { path = ".", features = ["test-hooks"] }
rerail-context = { path = "../context", features = ["test-hooks"] }
