[package]
name = "rerail-blocks"
version = "0.1.0"
edition = "2024"
publish = false
description = "Spike for decision 0266: blocks holding nested, self-relative structures; base + delta; freeze; read and written on CPU and GPU."

[dependencies]
libc = "0.2.189"
rayon = "=1.12.0"

[target.'cfg(windows)'.dependencies]
# Windows' memory calls for blocks and scratch regions (`windows`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
