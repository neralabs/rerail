[package]
name = "rerail-rr-aot"
version = "0.1.0"
edition = "2024"
publish = false
description = "The .rerail parser as Rust, written by the Bitlex compiler from the grammar (rr_parser/rr.bitlex): tier 1 from its lexer statements (`bitlex_lex_rust`), tier 2 from its tree rules (`bitlex_rust`); rerail-rr-parser's tests check it against the JIT."

[features]
# The test-only items of the crates below, for the tests above them (native/Cargo.toml, `test-hooks`).
test-hooks = ["rerail-tape-format/test-hooks", "rerail-rr-syntax?/test-hooks"]
# The speed tool (`rr-aot-speed`): it writes each tape through the `.rerail` parser's own sink (`lean::Sink16`).
speed = ["dep:rerail-rr-syntax"]

[dependencies]
# Stage 1 of tier 1 on simdjson's backends, as the lean lexer's (`bitlex_lex_rust`).
rerail-simd8 = { path = "../simd8" }
rerail-tape-format = { path = "../tape_format" }
rerail-rr-syntax = { path = "../rr_syntax", optional = true }

[[bin]]
name = "rr-aot-speed"
required-features = ["speed"]

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-rr-aot = { path = ".", features = ["test-hooks"] }
