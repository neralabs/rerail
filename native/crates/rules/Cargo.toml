# Written by the crate split (step 6c) and kept by hand: its sources are where they were, mounted in place (src/lib.rs).
[package]
name = "rerail-rules"
version = "0.1.0"
edition = "2024"
publish = false
description = "The relational admission: P's relational clauses compiled and evaluated over SQLite sessions, over the code rules (rerail-rules-base)."

[features]
default = ["rerail-matcher/default", "rerail-adapters/default", "rerail-facts/default", "rerail-lang/default", "rerail-rules-base/default", "rerail-p-anchors/default", "rerail-d-relational/default", "rerail-d-anchors/default"]
headless = ["napi-derive/noop", "rerail-matcher/headless", "rerail-adapters/headless", "rerail-facts/headless", "rerail-lang/headless", "rerail-rules-base/headless", "rerail-p-anchors/headless", "rerail-d-relational/headless", "rerail-d-anchors/headless"]
code-rule-profile = ["rerail-matcher/code-rule-profile", "rerail-facts/code-rule-profile", "rerail-lang/code-rule-profile", "rerail-rules-base/code-rule-profile", "rerail-p-anchors/code-rule-profile", "rerail-d-relational/code-rule-profile", "rerail-d-anchors/code-rule-profile"]
p-anchor-corpus = ["rerail-facts/p-anchor-corpus", "rerail-lang/p-anchor-corpus", "rerail-rules-base/p-anchor-corpus", "rerail-p-anchors/p-anchor-corpus", "rerail-d-relational/p-anchor-corpus", "rerail-d-anchors/p-anchor-corpus"]
test-hooks = ["rerail-matcher/test-hooks", "rerail-adapters/test-hooks", "rerail-facts/test-hooks", "rerail-lang/test-hooks", "rerail-prof/test-hooks", "rerail-rr-syntax/test-hooks", "rerail-store/test-hooks", "rerail-blocks/test-hooks", "dep:tempfile", "rerail-rules-base/test-hooks", "rerail-p-anchors/test-hooks", "rerail-d-relational/test-hooks", "rerail-d-anchors/test-hooks"]

[dependencies]
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false }
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
fallible-iterator = "0.3"
foldhash = "=0.2.0"
globset = "=0.4.21"
indexmap = "=2.14.2"
napi = { version = "3.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.0"
parking_lot = { version = "0.12", features = ["arc_lock"] }
regex = "=1.13.1"
regex-syntax = "=0.8.11"
rusqlite = { version = "=0.41.1", features = ["bundled", "column_decltype", "functions", "hooks", "limits", "modern_sqlite", "series", "vtab"] }
rustc-hash = "=2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
sha2 = "0.11"
tree-sitter = "=0.27.1"
tempfile = { version = "=3.27.0", optional = true }
rerail-adapters = { path = "../adapters", default-features = false }
rerail-blocks = { path = "../blocks" }
rerail-facts = { path = "../facts", default-features = false }
rerail-lang = { path = "../lang", default-features = false }
rerail-matcher = { path = "../matcher", default-features = false }
rerail-prof = { path = "../prof" }
rerail-rr-syntax = { path = "../rr_syntax" }
rerail-rules-base = { path = "../rules_base", default-features = false }
rerail-p-anchors = { path = "../p_anchors", default-features = false }
rerail-d-relational = { path = "../d_relational", default-features = false }
rerail-d-anchors = { path = "../d_anchors", default-features = false }
rerail-store = { path = "../store" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-rules = { path = ".", features = ["test-hooks"] }
