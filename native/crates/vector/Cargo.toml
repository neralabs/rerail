[package]
name = "rerail-vector"
version = "0.1.0"
edition = "2024"
publish = false
description = "Plain values (`Pod`), the rooms structures take their regions from, and the growable array over them (`Vector`): below the tape format, so every crate's arrays lie in blocks (decision 0628 §3)."


[dependencies]
# The run's room, registered once by the blocks crate (`install_default_room`).
rerail-registry = { path = "../registry" }
rayon = "=1.12.0"
# A vector is written and read as a sequence, as the `Vec` it replaces was.
serde = "1.0"
