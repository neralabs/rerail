[package]
name = "rerail-rr-parser"
version = "0.1.0"
edition = "2024"
publish = false
description = "The .rerail parser: its Bitlex grammar compiled to tier 1 and tier 2, the engine's tape, on the CPU and on Metal."

[features]
# The test-only items of the crates below, for the tests above them (native/Cargo.toml, `test-hooks`).
test-hooks = ["rerail-compiler/test-hooks", "rerail-metal/test-hooks", "rerail-rr-syntax/test-hooks"]

[dependencies]
rerail-compiler = { path = "../compiler" }
rerail-rr-syntax = { path = "../rr_syntax" }
rerail-tape-format = { path = "../tape_format" }
bitlex = { path = "../../../tools/bitlex", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rerail-metal = { path = "../metal" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rerail-metal = { path = "../metal", features = ["test-hooks"] }

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-rr-parser = { path = ".", features = ["test-hooks"] }
rerail-compiler = { path = "../compiler", features = ["test-hooks"] }
# The measurements' CPU clocks (`tests`), on every platform.
rerail-prof = { path = "../prof" }
# The files' digests a benchmark gives the Metal run, as the engine would (`rr_throughput`).
sha2 = "0.10"
# Cranelift's own pass timings, for tier 2's compile (`rr_state_clusters`).
cranelift-codegen = "=0.125.4"
