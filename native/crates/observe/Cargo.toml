[package]
name = "rerail-observe"
version = "0.1.0"
edition = "2024"
publish = false
description = "What the content store observes: the observer of the files a run reads (`observe`), and every git read (`git_access`, `git_workspace` and its snapshot), over the store's base."

# Written by the crate split (step 7b); its sources are in its own `src/` (step 9).

[features]
# The store's test hooks (busy-wait overrides, write counters, test-only writers), for the engine's tests. The
# engine turns it on always, not only for its tests: a feature that differed between its test and bin builds
# would rebuild the engine at each switch. The hooks do nothing unless a test sets them.
test-hooks = ["rerail-store-base/test-hooks", "rerail-blocks/test-hooks", "rerail-prof/test-hooks", "rerail-clif/test-hooks", "rerail-tape-format/test-hooks"]

[dependencies]
rerail-store-base = { path = "../store_base" }
# `\\?\` free canonical paths on Windows (std's are verbatim, which `/`-joined text and text comparisons break).
dunce = "=1.0.5"
rerail-prof = { path = "../prof" }
rerail-accel = { path = "../../../accel" }
# The memo's segments are journal blocks of deferrable leases (decision 0295 §4).
rerail-blocks = { path = "../blocks" }
# The rolling cache's shape (`view::cache`) for the text tests' verdicts (decision 0478 step 2d); the view alone.
rerail-clif = { path = "../clif", default-features = false }
# A read's bytes go to the home its placer makes (`rerail_tape_format::home::Home`, decision 0353 step 7).
rerail-tape-format = { path = "../tape_format" }
clru = "=0.6.3"
foldhash = "=0.2.0"
gix = { version = "=0.90.0", default-features = false, features = ["status", "parallel", "sha1", "sha256", "revision"] }
hashbrown = { version = "=0.16.1", default-features = false }
libc = "0.2.189"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rayon = "=1.12.0"
regex = "=1.13.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
rusqlite = { version = "=0.41.1", features = ["bundled", "column_decltype", "functions", "hooks", "limits", "modern_sqlite", "series", "vtab", "array"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zstd = "=0.14.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
same-file = "1.0.6"
tempfile = "=3.27.0"

[target.'cfg(not(any(windows, target_family = "wasm")))'.dependencies]
tikv-jemalloc-sys = { version = "=0.7.1", default-features = false }

[target.'cfg(windows)'.dependencies]
onig = { version = "=6.5.3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
# Exercise the Windows matcher on Unix in the same test suite.
onig = { version = "=6.5.3", default-features = false }

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-observe = { path = ".", features = ["test-hooks"] }
# The store its tests keep the observer's answers in (t33 K2), registered as the test binary loads
# (`observer_store::base::STORE`): above this crate, a test's dependency only. Named apart, as this crate's sources
# name its base `rerail_store` (`lib.rs`).
rerail-store-above = { package = "rerail-store", path = "../store", features = ["test-hooks"] }
tempfile = "=3.27.0"
