[package]
name = "rerail-markdown-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean Markdown parser for the tape alone: tree-sitter-md's block tape, written as the parse goes."

[features]
# The tests' shared object for reads outside a run (decision 0442).
test-hooks = ["rerail-tape-format/test-hooks"]

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }

[dependencies.rerail-simd8]
path = "../simd8"

[dev-dependencies]
rerail-markdown-lean = { path = ".", features = ["test-hooks"] }
