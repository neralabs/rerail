[package]
name = "rerail-css-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean CSS parser for the tape alone: tree-sitter-css's tape, written as the parse goes, its scans in 64-byte blocks."

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }

[dependencies.rerail-simd8]
path = "../simd8"
