[package]
name = "rerail-ukl"
version = "0.1.0"
edition = "2024"
publish = false
description = "UKL, the kernel language every GPU backend shares (decision 0440): its shims carried in the binary, and a kernel preprocessed for a backend by rerail-c-pp, in-process."

[features]
# The test-only items of the crates below, for the tests above them (native/Cargo.toml, `test-hooks`).
test-hooks = ["rerail-c-pp/test-hooks", "rerail-c-lean/test-hooks"]

[dependencies]
# The preprocessor that applies a backend's shim (decision 0327, mode (b)).
rerail-c-pp = { path = "../c_pp" }
# Its lexer's options (the C++ dialect UKL is written in).
rerail-c-lean = { path = "../c_lean" }

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-ukl = { path = ".", features = ["test-hooks"] }
