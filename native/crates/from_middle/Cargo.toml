[package]
name = "rerail-from-middle"
version = "0.1.0"
edition = "2024"
publish = false
description = "Tier 1 from the middle of a file: a chunk's possible starts, ruled out by the grammar's refusals, joined by a check (the design page \"Lexing From the Middle\"), on the CPU."

[features]
# The compiler's test hooks, for a build with `--features test-hooks` (scripts/check/check_dev_features.py).
test-hooks = ["rerail-compiler/test-hooks", "rerail-blocks/test-hooks", "rerail-bitlex/test-hooks"]

[dependencies]
rerail-compiler = { path = "../compiler" }
rerail-blocks = { path = "../blocks" }
# The compiler's prover: a fill proved within a run bounds its carry (`solve::bounds`).
rerail-bitlex = { path = "../bitlex" }

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-from-middle = { path = ".", features = ["test-hooks"] }
# The grammars measured: rr's and Kotlin's compiled parsers, JSON's through the ladder.
rerail-rr-parser = { path = "../rr_parser", features = ["test-hooks"] }
rerail-kotlin-parser = { path = "../kotlin_parser", features = ["test-hooks"] }
rerail-cpu-stream = { path = "../cpu_stream", features = ["test-hooks"] }
