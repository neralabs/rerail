[package]
name = "rerail-java-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean Java parser for the tape alone: tree-sitter-java's tape, written as the parse goes, its lexer in 64-byte blocks."

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }
# Names past ASCII (`XID_Start`, `XID_Continue`), as tree-sitter-java's identifier reads them.
unicode-ident = "=1.0.27"

[dependencies.rerail-simd8]
path = "../simd8"
