[package]
name = "rerail-compiler"
version = "0.1.0"
edition = "2024"
publish = false
description = "The transducer's parser compiler's front end: the programs and their analyses, which every backend reads."

[features]
# The relocations' recording (`native_cpu_codegen::relocations`), for the engine's tests.
test-hooks = ["rerail-blocks/test-hooks", "rerail-tape-format/test-hooks", "rerail-clif/test-hooks", "rerail-context/test-hooks", ]

[dependencies]
rerail-context = { path = "../context" }
# Its error, which the device's runtime returns too.
rerail-error = { path = "../error" }
# The block structures a run's outputs live in (decision 0353): the GPU and CPU read the same data.
rerail-blocks = { path = "../blocks" }
# The engine's tape, which tier 2 writes (decision 0140).
rerail-tape-format = { path = "../tape_format" }
# Bitlex's parser, for the grammar's state machine (`grammar`). No dependencies of its own.
bitlex = { path = "../../../tools/bitlex", default-features = false }
# The tape's reads written once, and the inlining pass every JIT function goes through (decision 0310).
rerail-clif = { path = "../clif" }
cranelift-codegen = "=0.125.4"
cranelift-frontend = "=0.125.4"
cranelift-module = "=0.125.4"
# The host's ISA and its flags, for tier 2's own ISA (`Cut::unsigned`).
cranelift-native = "=0.125.4"
libc = "0.2.189"
# The one pool the engine runs on (tier 2 clusters compiled in parallel).
rayon = "=1.12.0"
# The grammar compiler's maps (`grammar`): a
# fixed hasher, so a compile is the same each run (the questions asked, and so the program, follow
# the maps' order), and a cheap one for its small integer keys.
rustc-hash = "=2.1.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-jit = { version = "=0.125.4", features = ["selinux-fix"] }

# The browser build: a page has no executable memory (the engine's `wasm/README.md`).
[target.'cfg(target_family = "wasm")'.dependencies]
cranelift-jit-wasm = { path = "../../wasm/cranelift-jit" }

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-compiler = { path = ".", features = ["test-hooks"] }
