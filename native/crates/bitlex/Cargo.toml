[package]
name = "rerail-bitlex"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Bitlex compiler: a grammar's masks and tokens to tier 1's block program, proved, and its tree section to tier 2."
# The vendored Cranelift's cfgs (`cranelift_clmul`, `cranelift_preserve_most`), set as for the compiler's front end.
build = "../compiler/build.rs"

[features]
# The ladder's and the tests' hooks, as the front end's.
test-hooks = ["rerail-blocks/test-hooks", "rerail-compiler/test-hooks"]

[dependencies]
# The provers' tables in blocks (decision 0353), as the compiler's sources it mounts hold them.
rerail-blocks = { path = "../blocks" }
rerail-compiler = { path = "../compiler" }
# Bitlex's parser. No dependencies of its own.
bitlex = { path = "../../../tools/bitlex", default-features = false }
# A fixed hasher, so a compile is the same each run (the questions asked, and so the program, follow the maps' order).
rustc-hash = "=2.1.3"
# The provers' answers keyed by their questions' digests (`bitlex_prove::Key`, decision 0414).
sha2 = "0.11"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-bitlex = { path = ".", features = ["test-hooks"] }
