# Written by hand for the crate split (step 7c): its sources are where they were, mounted in place (src/lib.rs).
[package]
name = "rerail-ygraph"
version = "0.1.0"
edition = "2024"
publish = false
description = "M's Y1 reference graph as copied (facts::ygraph), under the facts."

[features]
test-hooks = ["rerail-prof/test-hooks"]

[dependencies]
foldhash = "=0.2.0"
hashbrown = { version = "=0.16.1", default-features = false }
memchr = "=2.8.3"
rayon = "=1.12.0"
regex = "=1.13.1"
rustc-hash = "=2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rerail-prof = { path = "../prof" }
rerail-accel = { path = "../../../accel" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-ygraph = { path = ".", features = ["test-hooks"] }
