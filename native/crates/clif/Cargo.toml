[package]
name = "rerail-clif"
version = "0.1.0"
edition = "2024"
publish = false
description = "Code written once in Cranelift's IR for several backends (decision 0310): the tape's reads, the JIT's inlining pass over them; and the view they read a tape by (no dependency)."

[features]
# The tests' shared object for reads outside a run (decision 0442).
test-hooks = ["rerail-blocks?/test-hooks"]
default = ["ir"]
# The reads and the pass, in Cranelift's IR, and a JIT of every read (tests run it against a hand-written reader).
# Without it, the view alone (the tape crate's). The JIT is no feature of its own: the compiler links cranelift-jit
# into every engine anyway, and a second variant of this crate for tests would compile it twice (AGENTS.md).
ir = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-jit-wasm", "dep:rerail-blocks"]

[dependencies]
cranelift-codegen = { version = "=0.125.4", optional = true }
cranelift-frontend = { version = "=0.125.4", optional = true }
cranelift-module = { version = "=0.125.4", optional = true }
# The layout a relation's reads follow (`relation`, decision 0325).
rerail-blocks = { path = "../blocks", optional = true }

# The JIT, as the compiler's: Cranelift's natively, the tree's stand-in on WASM (`wasm/cranelift-jit`, which no
# JIT runs on), by one name (`lib.rs`).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-jit = { version = "=0.125.4", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
cranelift-jit-wasm = { path = "../../wasm/cranelift-jit", optional = true }
[dev-dependencies]
rerail-clif = { path = ".", features = ["test-hooks"] }
