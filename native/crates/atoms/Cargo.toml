[package]
name = "rerail-atoms"
version = "0.1.0"
edition = "2024"
publish = false
description = "The atoms: the interner that numbers the engine's texts, its blocks and chain, its id map and virtual table."

[features]
# The test hooks: blocks that start small (`set_small_blocks`), the columns' lists and a read the store's tests use.
test-hooks = ["rerail-store-base/test-hooks", "rerail-blocks/test-hooks", "rerail-prof/test-hooks", "rerail-clif/test-hooks"]

[dependencies]
rerail-store-base = { path = "../store_base" }
rerail-prof = { path = "../prof" }
rerail-accel = { path = "../../../accel" }
rerail-blocks = { path = "../blocks" }
rerail-clif = { path = "../clif", default-features = false }
dunce = "=1.0.5"
foldhash = "=0.2.0"
libc = "0.2.189"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "column_decltype", "functions", "hooks", "limits", "modern_sqlite", "series", "vtab", "array"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-atoms = { path = ".", features = ["test-hooks"] }
