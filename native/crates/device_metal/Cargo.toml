# Generated by tools/cratify/apply.py (the crate split): its sources are where they were, mounted in place
# (src/lib.rs).
[package]
name = "rerail-device-metal"
version = "0.1.0"
edition = "2024"
publish = false
description = "Metal, as the logic's and the transducer's device (macOS only; registered by the engine)."

[features]
default = ["all-languages", "dump-cli", "python-syntax-error", "tape-cache"]
all-languages = ["lang-blade", "lang-javascript", "lang-json", "lang-php", "lang-python", "lang-rr", "lang-rust", "lang-sql", "lang-typescript", "lang-vue", "rerail-facts/all-languages", "rerail-lang/all-languages", "rerail-logic/all-languages", "rerail-rr/all-languages", "rerail-transducer/all-languages", "rerail-w/all-languages"]
lang-blade = ["rerail-facts/lang-blade", "rerail-lang/lang-blade", "rerail-logic/lang-blade", "rerail-rr/lang-blade", "rerail-transducer/lang-blade", "rerail-w/lang-blade"]
lang-javascript = ["rerail-facts/lang-javascript", "rerail-lang/lang-javascript", "rerail-logic/lang-javascript", "rerail-rr/lang-javascript", "rerail-transducer/lang-javascript", "rerail-w/lang-javascript"]
lang-json = ["ast-grep-language/tree-sitter-json", "rerail-facts/lang-json", "rerail-lang/lang-json", "rerail-logic/lang-json", "rerail-rr/lang-json", "rerail-transducer/lang-json", "rerail-w/lang-json"]
lang-php = ["ast-grep-language/tree-sitter-php", "rerail-facts/lang-php", "rerail-lang/lang-php", "rerail-logic/lang-php", "rerail-rr/lang-php", "rerail-transducer/lang-php", "rerail-w/lang-php"]
lang-python = ["rerail-facts/lang-python", "rerail-lang/lang-python", "rerail-logic/lang-python", "rerail-rr/lang-python", "rerail-transducer/lang-python", "rerail-w/lang-python"]
lang-rr = ["rerail-facts/lang-rr", "rerail-lang/lang-rr", "rerail-logic/lang-rr", "rerail-rr/lang-rr", "rerail-transducer/lang-rr", "rerail-w/lang-rr"]
lang-rust = ["ast-grep-language/tree-sitter-rust", "rerail-facts/lang-rust", "rerail-lang/lang-rust", "rerail-logic/lang-rust", "rerail-rr/lang-rust", "rerail-transducer/lang-rust", "rerail-w/lang-rust"]
lang-sql = ["rerail-facts/lang-sql", "rerail-lang/lang-sql", "rerail-logic/lang-sql", "rerail-rr/lang-sql", "rerail-transducer/lang-sql", "rerail-w/lang-sql"]
lang-typescript = ["rerail-facts/lang-typescript", "rerail-lang/lang-typescript", "rerail-logic/lang-typescript", "rerail-rr/lang-typescript", "rerail-transducer/lang-typescript", "rerail-w/lang-typescript"]
lang-vue = ["rerail-facts/lang-vue", "rerail-lang/lang-vue", "rerail-logic/lang-vue", "rerail-rr/lang-vue", "rerail-transducer/lang-vue", "rerail-w/lang-vue"]
headless = ["napi-derive/noop", "rerail-facts/headless", "rerail-lang/headless", "rerail-logic/headless", "rerail-rr/headless", "rerail-transducer/headless", "rerail-w/headless"]
dump-cli = ["rerail-facts/dump-cli", "rerail-lang/dump-cli", "rerail-logic/dump-cli", "rerail-rr/dump-cli", "rerail-transducer/dump-cli", "rerail-w/dump-cli"]
python-syntax-error = ["rerail-facts/python-syntax-error", "rerail-lang/python-syntax-error", "rerail-logic/python-syntax-error", "rerail-rr/python-syntax-error", "rerail-transducer/python-syntax-error", "rerail-w/python-syntax-error"]
tape-cache = ["rerail-facts/tape-cache", "rerail-lang/tape-cache", "rerail-logic/tape-cache", "rerail-rr/tape-cache", "rerail-transducer/tape-cache", "rerail-w/tape-cache"]
system-allocator = ["rerail-facts/system-allocator", "rerail-lang/system-allocator", "rerail-logic/system-allocator", "rerail-rr/system-allocator", "rerail-transducer/system-allocator", "rerail-w/system-allocator"]
code-rule-profile = ["rerail-facts/code-rule-profile", "rerail-lang/code-rule-profile", "rerail-logic/code-rule-profile", "rerail-rr/code-rule-profile", "rerail-transducer/code-rule-profile", "rerail-w/code-rule-profile"]
p-anchor-corpus = ["rerail-facts/p-anchor-corpus", "rerail-lang/p-anchor-corpus", "rerail-logic/p-anchor-corpus", "rerail-rr/p-anchor-corpus", "rerail-transducer/p-anchor-corpus", "rerail-w/p-anchor-corpus"]
metal-tests = ["rerail-facts/metal-tests", "rerail-lang/metal-tests", "rerail-logic/metal-tests", "rerail-rr/metal-tests", "rerail-transducer/metal-tests", "rerail-w/metal-tests"]
test-hooks = ["rerail-facts/test-hooks", "rerail-lang/test-hooks", "rerail-logic/test-hooks", "rerail-rr/test-hooks", "rerail-transducer/test-hooks", "rerail-compiler/test-hooks", "rerail-store/test-hooks", "rerail-w/test-hooks", "dep:tempfile"]

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false }
cranelift-codegen = "=0.125.4"
cranelift-frontend = "=0.125.4"
cranelift-module = "=0.125.4"
foldhash = "=0.2.0"
hashbrown = { version = "=0.16.1", default-features = false }
gix = { version = "=0.90.0", default-features = false, features = ["status", "parallel", "sha1", "sha256", "revision"] }
globset = "=0.4.21"
aho-corasick = "=1.1.5"
model2vec-rs = { version = "0.4.0", default-features = false, features = ["fancy-regex", "local-only"] }
napi = { version = "3.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.0"
indexmap = "=2.14.2"
memchr = "=2.8.3"
num-bigint = "=0.5.1"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rayon = "=1.12.0"
serde = { version = "1.0", features = ["derive"] }
fancy-regex = "=0.17.0"
regex = "=1.13.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
rusqlite = { version = "=0.41.1", features = ["bundled", "column_decltype", "functions", "hooks", "limits", "modern_sqlite", "series", "vtab"] }
fallible-iterator = "0.3"
ruff_python_parser = "=0.0.10"
ruff_python_ast = "=0.0.10"
ruff_text_size = "=0.0.10"
rustc-hash = "=2.1.3"
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
sha1 = "0.10"
sha2 = "0.11"
tree-sitter-language = "=0.1.9"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tree-sitter = "=0.27.1"
bitlex = { path = "../../../tools/bitlex", default-features = false }
unicode-normalization = "=0.1.26"
zstd = "=0.14.3"
tempfile = { version = "=3.27.0", optional = true }
rerail-facts = { path = "../facts", default-features = false }
rerail-lang = { path = "../lang", default-features = false }
rerail-logic = { path = "../logic", default-features = false }
rerail-prof = { path = "../prof" }
rerail-rr = { path = "../rr", default-features = false }
rerail-rr-syntax = { path = "../rr_syntax" }
rerail-store = { path = "../store" }
rerail-transducer = { path = "../transducer", default-features = false }
rerail-w = { path = "../w", default-features = false }
rerail-accel = { path = "../../../accel" }
rerail-compiler = { path = "../compiler" }
rerail-rr-parser = { path = "../rr_parser" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-jit = { version = "=0.125.4", features = ["selinux-fix"] }

[target.'cfg(target_family = "wasm")'.dependencies]
cranelift-jit-wasm = { path = "../../wasm/cranelift-jit" }
libc = "0.2.189"

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
libc = "0.2.189"

[target.'cfg(not(any(windows, target_family = "wasm")))'.dependencies]
tikv-jemallocator = { version = "=0.7.0", features = ["disable_initial_exec_tls"] }
tikv-jemalloc-ctl = { version = "=0.7.0", features = ["stats"] }
tikv-jemalloc-sys = { version = "=0.7.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
metal = "0.33.0"
rerail-metal = { path = "../metal" }

[target.'cfg(target_os = "macos")'.dev-dependencies]

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-device-metal = { path = ".", features = ["test-hooks"] }
ast-grep-language = { version = "=0.51.0", default-features = false, features = ["tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-c-sharp", "tree-sitter-css", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-json", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-php", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-swift"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "limits", "hooks", "array"] }
