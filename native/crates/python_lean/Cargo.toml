[package]
name = "rerail-python-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean Python parser for the tape alone: tree-sitter-python's tape, written as the parse goes, its lexer in 64-byte blocks."

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }
# Which non-ASCII characters an identifier may hold (XID), as tree-sitter-python's `identifier` reads them.
unicode-ident = "=1.0.27"
