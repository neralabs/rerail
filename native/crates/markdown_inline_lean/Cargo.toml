[package]
name = "rerail-markdown-inline-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean parser for Markdown's inline grammar, for the tape alone: tree-sitter-md-inline's tape, or a refusal."

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }

[dependencies.rerail-simd8]
path = "../simd8"
