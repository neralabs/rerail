[package]
name = "rerail-context"
version = "0.1.0"
edition = "2024"
publish = false
description = "The run under way, and what its caller shares by design (decisions 0441, 0442): below every crate that holds run, shared or machine state."

[features]
test-hooks = []

[dependencies]
parking_lot = { version = "0.12", features = ["arc_lock"] }
rustc-hash = "=2.1.3"

[dev-dependencies]
rerail-context = { path = ".", features = ["test-hooks"] }
