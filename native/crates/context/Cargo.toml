[package]
name = "rerail-context"
version = "0.1.0"
edition = "2024"
publish = false
description = "The run under way, and what its caller shares by design (decisions 0441, 0442): below every crate that holds run, shared or machine state."

[features]
test-hooks = []

[dependencies]
parking_lot = { version = "0.12", features = ["arc_lock"] }
rayon = "=1.12.0"
# The patched one (the workspace's `[patch.crates-io]`): a job carries its maker's run (`set_job_carrier`).
rayon-core = "=1.13.0"
rustc-hash = "=2.1.3"

[dev-dependencies]
rerail-context = { path = ".", features = ["test-hooks"] }
