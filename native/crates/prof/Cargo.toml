[package]
name = "rerail-prof"
version = "0.1.0"
edition = "2024"
publish = false
description = "CPU time and counts by stage (RERAIL_PROF), shared by the engine and its crates."

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
