# Written by the crate split (step 6a) and kept by hand: its sources are where they were, mounted in place (src/lib.rs).
[package]
name = "rerail-adapters"
version = "0.1.0"
edition = "2024"
publish = false
description = "The adapter frameworks (scopes, values, literals, calls, suppressions) and the language adapter traits the packs implement."

[features]
default = ["rerail-facts/default", "rerail-lang/default"]
headless = ["napi-derive/noop", "rerail-facts/headless", "rerail-lang/headless"]
test-hooks = ["rerail-facts/test-hooks", "rerail-lang/test-hooks", "rerail-prof/test-hooks", "rerail-rr-syntax/test-hooks", "rerail-store/test-hooks"]

[dependencies]
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false }
foldhash = "=0.2.0"
napi = { version = "3.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.0"
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rayon = "=1.12.0"
regex = "=1.13.1"
rustc-hash = "=2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tree-sitter = "=0.27.1"
unicode-normalization = "=0.1.26"
rerail-facts = { path = "../facts", default-features = false }
rerail-lang = { path = "../lang", default-features = false }
rerail-prof = { path = "../prof" }
rerail-rr-syntax = { path = "../rr_syntax" }
rerail-store = { path = "../store" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-adapters = { path = ".", features = ["test-hooks"] }
