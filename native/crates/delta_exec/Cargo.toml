[package]
name = "rerail-delta-exec"
version = "0.1.0"
edition = "2024"
publish = false
description = "A delta executor that loads itself from one tape (decision 0686): K-form programs run by the four delta operators, bootstrapped from bootstrap-l0.rerail."

[features]
default = []
test-hooks = ["rerail-blocks/test-hooks", "rerail-delta-twins/test-hooks", "rerail-rr-syntax/test-hooks"]

[dependencies]
# Relations, bistates and their change operations (decision 0678): every fact this executor keeps lies in them.
rerail-blocks = { path = "../blocks" }
# The operations' Rust twins: each one's reference version, in phases over blocks (std inside, no state of their own).
rerail-delta-twins = { path = "../delta_twins" }
# The rr parser: a `.rerail` file's tape, the only reader of its text; the tape's reads in place (format 16) come
# through it (`rerail_rr_syntax::tape_format`), so this crate depends on blocks and the rr parser alone (B§7).
rerail-rr-syntax = { path = "../rr_syntax" }

[dev-dependencies]
rerail-delta-exec = { path = ".", features = ["test-hooks"] }
