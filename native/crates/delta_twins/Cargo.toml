[package]
name = "rerail-delta-twins"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Rust twins of the delta executor's operations (decision 0686, Operations §3): each operation's reference version: phases over tiles of independent items, reading its pinned slots, the blocks they reach and its params alone."

[features]
default = []
test-hooks = ["rerail-blocks/test-hooks", "rerail-rr-syntax/test-hooks"]

[dependencies]
# The blocks a twin reads and writes in place, and their formats (references, descriptor tables, layers): one
# definition, there.
rerail-blocks = { path = "../blocks" }
# A `.rerail` tape's reads in place (format 16's, with the rr language's table): what `intern` and `k0_pass` read in
# their tape slot (decision 0686, B5, B6). The executor's crate depends on the same two (B§7).
rerail-rr-syntax = { path = "../rr_syntax" }

[dev-dependencies]
rerail-delta-twins = { path = ".", features = ["test-hooks"] }
