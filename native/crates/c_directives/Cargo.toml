[package]
name = "rerail-c-directives"
version = "0.1.0"
edition = "2024"
publish = false
description = "C's and C++'s directives as a Bitlex grammar (decision 0327, mode (a) compiled): the directive tape, held to the lean scan's rows."

[features]
# The compiler's and Metal's test hooks, for a build with `--features test-hooks` (scripts/check/check-dev-features.py).
test-hooks = ["rerail-compiler/test-hooks", "rerail-metal/test-hooks"]
# The words' compiled code as Rust (`rerail-pp-aot`), compiled by rustc: the preprocessor's CPU
# path (decision 0348, t44). On by default; without it the path is the JIT's code of the same IR.
default = ["generated"]
generated = ["rerail-pp-aot/generated"]

[dependencies]
rerail-pp-aot = { path = "../pp_aot" }
rerail-compiler = { path = "../compiler" }
rerail-tape-format = { path = "../tape_format" }
bitlex = { path = "../../../tools/bitlex", default-features = false }
# The lean scan: the reference and the fall-back (`Facts::lean`).
rerail-c-pp = { path = "../c_pp" }
# The lean lexer: the token tape's reference and fall-back (`tokens::lean`).
rerail-c-lean = { path = "../c_lean" }
rerail-simd8 = { path = "../simd8" }

[target.'cfg(target_os = "macos")'.dependencies]
rerail-metal = { path = "../metal" }
# A placed document's digest (`eval::rounds::place`).
sha2 = "0.10"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-c-directives = { path = ".", features = ["test-hooks"] }
