[package]
name = "rerail-tape-format"
version = "0.1.0"
edition = "2024"
publish = false
description = "The engine's tape as bytes: format 15 (v9np), its constants and a writer a parser writes it with; format 16 and its fixed blocks; one API over them, read in place (0293)."

[features]
# The tests' shared object for reads outside a run (decision 0442).
test-hooks = ["rerail-clif/test-hooks"]
# The hand-written reference writer of format 16 (`f16::reference`), which the writer's ops are checked against: the
# tests', and the lab's (decision 0426 §6, R16). No build of the engine turns it on.
reference = []

[dependencies]
# As the engine's: sha2 0.11 runs SHA-256 on the CPU's SHA instructions by itself (0.10 needed `asm`, whose
# `sha2-asm` builds neither with MSVC nor with every aarch64 cross C toolchain).
sha2 = "0.11"
# The view a tape's reads are told where it lies by (decision 0310), without the reads' IR.
rerail-clif = { path = "../clif", default-features = false }
# Format 16 in fixed blocks (16z), at the version the lab measured it with.
lz4-sys = "=1.11.1"
# The newlines of a document, a chunk at a time, for its newline index (0156 §1.6).
memchr = "=2.8.3"
# simdjson's nibble lookups: a format 16 part's code bytes tested against a set 64 at a time (`match_groups`).
rerail-simd8 = { path = "../simd8" }

[dev-dependencies]
rerail-tape-format = { path = ".", features = ["test-hooks"] }
# The reads in Cranelift's IR, JIT-compiled and run against this crate's readers (decision 0310).
rerail-clif = { path = "../clif" }
# The reads as UKL, run on the process's GPU (Metal, CUDA) against this crate's readers (decision 0440 step 6).
rerail-gpu = { path = "../../../gpu" }
