[package]
name = "rerail-tape-format"
version = "0.1.0"
edition = "2024"
publish = false
description = "The engine's tape (v9np, format 15) as bytes: its constants, and a writer a parser writes the tape with as it parses."

[dependencies]
sha2 = "0.10"

# SHA-256 on the CPU's SHA instructions, as the engine has it (its Cargo.toml says why).
[target.'cfg(all(target_arch = "aarch64", not(windows)))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
