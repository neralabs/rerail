[package]
name = "rerail-vue-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean Vue single-file component parser for the tape alone: tree-sitter-vue's tape, written as the parse goes, its scans in 64-byte blocks."

[features]
# The tests' shared object for reads outside a run (decision 0442).
test-hooks = ["rerail-html-lean/test-hooks", "rerail-tape-format/test-hooks"]

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }
# Tag names and their rules: tree-sitter-vue's scanner reads them by tree-sitter-html's `tag.h`.
rerail-html-lean = { path = "../html_lean" }

[dependencies.rerail-simd8]
path = "../simd8"

[dev-dependencies]
rerail-vue-lean = { path = ".", features = ["test-hooks"] }
