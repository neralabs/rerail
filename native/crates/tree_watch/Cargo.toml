[package]
name = "rerail-tree-watch"
version = "0.1.0"
edition = "2024"
publish = false
description = "The tree watch: what the OS reports changed under each watched checkout (FSEvents, inotify, ReadDirectoryChangesW), kept until the host takes it."

# Its own crate so its tests build without the engine: CI's macOS job runs only them, and on Windows they need none of
# the engine's dependencies. The engine re-exports it (`rerail_engine::tree_watch`), and its `TreeWatcher` reaches the
# addon from there, as rerail-classic's `GitIgnoreMatcher` does.

[features]
# The engine's `headless` build (no addon): napi-derive generates no bindings.
headless = ["napi-derive/noop"]

[dependencies]
napi = { version = "3.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.0"
indexmap = "=2.14.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# The completion port, the reads and the oplock (`tree_watch/windows.rs`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading"] }

[dev-dependencies]
# The tests name scratch folders canonically, as the watcher names its paths (Windows: not verbatim).
dunce = "=1.0.5"
