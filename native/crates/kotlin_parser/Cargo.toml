[package]
name = "rerail-kotlin-parser"
version = "0.1.0"
edition = "2024"
publish = false
description = "Kotlin's Bitlex grammar, compiled to tier 1 and tier 2: tree-sitter-kotlin's tape, as the lean parser writes it."

[dependencies]
rerail-compiler = { path = "../compiler" }
rerail-tape-format = { path = "../tape_format" }
# The kinds and fields the grammar names, and the reference its tapes are checked against.
rerail-kotlin-lean = { path = "../kotlin_lean" }
bitlex = { path = "../../../tools/bitlex", default-features = false }
