[package]
name = "rerail-program-image"
version = "0.1.0"
edition = "2024"
publish = false
description = "The program image's core (decision 0377): a program's rules and header as one image, its versions and their builder, under the lowering, which writes through it."

[features]
default = []
test-hooks = ["rerail-blocks/test-hooks", "rerail-prof/test-hooks", "rerail-rr-syntax/test-hooks"]

[dependencies]
# Its structures lie in blocks (`rerail_blocks::vector::Vector`, `maps`), as the engine\'s do.
rerail-blocks = { path = "../blocks" }
rerail-section = { path = "../section" }
foldhash = "=0.2.0"
rerail-prof = { path = "../prof" }
rerail-rr-syntax = { path = "../rr_syntax" }
rustc-hash = "=2.1.3"
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-program-image = { path = ".", features = ["test-hooks"] }
