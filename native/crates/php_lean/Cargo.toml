[package]
name = "rerail-php-lean"
version = "0.1.0"
edition = "2024"
publish = false
description = "A lean PHP parser for the tape alone: tree-sitter-php's tape, written as the parse goes, its lexer in 64-byte blocks."

[dependencies]
# The engine's tape, which the parser writes.
rerail-tape-format = { path = "../tape_format" }
# (no other dependency)

[dependencies.rerail-simd8]
path = "../simd8"
