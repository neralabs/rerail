# Written by hand for the crate split (step 7h): its sources are where they were, mounted in place (src/lib.rs).
[package]
name = "rerail-prefilter"
version = "0.1.0"
edition = "2024"
publish = false
description = "The prefilter (prefilter): candidate sets of a tape's terms, their plans, gates and readers, under boot."

[features]
default = ["all-languages", "dump-cli", "python-syntax-error", "tape-cache", "rerail-workspace/default", "rerail-transducer/default", "rerail-run/default"]
all-languages = ["lang-blade", "lang-c", "lang-cpp", "lang-csharp", "lang-css", "lang-go", "lang-html", "lang-java", "lang-javascript", "lang-json", "lang-kotlin", "lang-markdown", "lang-php", "lang-python", "lang-rr", "lang-rust", "lang-scala", "lang-sql", "lang-swift", "lang-typescript", "lang-vue", "rerail-workspace/all-languages", "rerail-transducer/all-languages", "rerail-run/all-languages"]
lang-blade = ["rerail-workspace/lang-blade", "rerail-transducer/lang-blade", "rerail-run/lang-blade"]
lang-csharp = ["rerail-workspace/lang-csharp", "rerail-transducer/lang-csharp", "rerail-run/lang-csharp"]
lang-css = ["rerail-workspace/lang-css", "rerail-transducer/lang-css", "rerail-run/lang-css"]
lang-html = ["rerail-workspace/lang-html", "rerail-transducer/lang-html", "rerail-run/lang-html"]
lang-java = ["rerail-workspace/lang-java", "rerail-transducer/lang-java", "rerail-run/lang-java"]
lang-go = ["rerail-workspace/lang-go", "rerail-transducer/lang-go", "rerail-run/lang-go"]
lang-c = ["rerail-workspace/lang-c", "rerail-transducer/lang-c", "rerail-run/lang-c"]
lang-cpp = ["rerail-workspace/lang-cpp", "rerail-transducer/lang-cpp", "rerail-run/lang-cpp"]
lang-javascript = ["rerail-workspace/lang-javascript", "rerail-transducer/lang-javascript", "rerail-run/lang-javascript"]
lang-json = ["rerail-workspace/lang-json", "rerail-transducer/lang-json", "rerail-run/lang-json"]
lang-kotlin = ["rerail-workspace/lang-kotlin", "rerail-transducer/lang-kotlin", "rerail-run/lang-kotlin"]
lang-markdown = ["rerail-workspace/lang-markdown", "rerail-transducer/lang-markdown", "rerail-run/lang-markdown"]
lang-php = ["rerail-workspace/lang-php", "rerail-transducer/lang-php", "rerail-run/lang-php"]
lang-python = ["rerail-workspace/lang-python", "rerail-transducer/lang-python", "rerail-run/lang-python"]
lang-rr = ["rerail-workspace/lang-rr", "rerail-transducer/lang-rr", "rerail-run/lang-rr"]
lang-rust = ["rerail-workspace/lang-rust", "rerail-transducer/lang-rust", "rerail-run/lang-rust"]
lang-scala = ["rerail-workspace/lang-scala", "rerail-transducer/lang-scala", "rerail-run/lang-scala"]
lang-sql = ["rerail-workspace/lang-sql", "rerail-transducer/lang-sql", "rerail-run/lang-sql"]
lang-swift = ["rerail-workspace/lang-swift", "rerail-transducer/lang-swift", "rerail-run/lang-swift"]
lang-typescript = ["rerail-workspace/lang-typescript", "rerail-transducer/lang-typescript", "rerail-run/lang-typescript"]
lang-vue = ["rerail-workspace/lang-vue", "rerail-transducer/lang-vue", "rerail-run/lang-vue"]
headless = ["rerail-workspace/headless", "rerail-transducer/headless", "rerail-run/headless"]
dump-cli = ["rerail-workspace/dump-cli", "rerail-transducer/dump-cli", "rerail-run/dump-cli"]
python-syntax-error = ["rerail-workspace/python-syntax-error", "rerail-transducer/python-syntax-error", "rerail-run/python-syntax-error"]
tape-cache = ["rerail-workspace/tape-cache", "rerail-transducer/tape-cache", "rerail-run/tape-cache"]
system-allocator = ["rerail-workspace/system-allocator", "rerail-transducer/system-allocator", "rerail-run/system-allocator"]
code-rule-profile = ["rerail-workspace/code-rule-profile", "rerail-transducer/code-rule-profile", "rerail-run/code-rule-profile"]
p-anchor-corpus = ["rerail-workspace/p-anchor-corpus", "rerail-transducer/p-anchor-corpus", "rerail-run/p-anchor-corpus"]
metal-tests = ["rerail-workspace/metal-tests", "rerail-transducer/metal-tests", "rerail-run/metal-tests"]
test-hooks = ["dep:tempfile", "rerail-workspace/test-hooks", "rerail-transducer/test-hooks", "rerail-prof/test-hooks", "rerail-run/test-hooks", "rerail-blocks/test-hooks", "rerail-tape-format/test-hooks"]

[dependencies]
# A 16z tape read through its own cache (`f16::ZCache`, decision 0628 §6).
rerail-tape-format = { path = "../tape_format" }
rerail-blocks = { path = "../blocks" }
# The panic boundary (`panic_boundary`), mounted by the tree watch's crate, which needs nothing else of W's.
# `\\?\` free canonical paths on Windows (std's are verbatim, which `/`-joined text and text comparisons break).
dunce = "=1.0.5"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false }
cranelift-codegen = "=0.125.4"
cranelift-frontend = "=0.125.4"
cranelift-module = "=0.125.4"
foldhash = "=0.2.0"
hashbrown = { version = "=0.16.1", default-features = false }
gix = { version = "=0.90.0", default-features = false, features = ["status", "parallel", "sha1", "sha256", "revision"] }
globset = "=0.4.21"
aho-corasick = "=1.1.5"
model2vec-rs = { version = "0.4.0", default-features = false, features = ["fancy-regex", "local-only"] }
napi = { version = "3.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.0"
indexmap = "=2.14.2"
memchr = "=2.8.3"
num-bigint = "=0.5.1"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rayon = "=1.12.0"
serde = { version = "1.0", features = ["derive"] }
fancy-regex = "=0.17.0"
regex = "=1.13.1"
regex-automata = "=0.4.18"
regex-syntax = "=0.8.11"
rusqlite = { version = "=0.41.1", features = ["bundled", "column_decltype", "functions", "hooks", "limits", "modern_sqlite", "series", "vtab"] }
fallible-iterator = "0.3"
ruff_python_parser = "=0.0.10"
ruff_python_ast = "=0.0.10"
ruff_text_size = "=0.0.10"
rustc-hash = "=2.1.3"
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
sha1 = "0.11"
sha2 = "0.11"
tree-sitter-language = "=0.1.9"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tree-sitter = "=0.27.1"
bitlex = { path = "../../../tools/bitlex", default-features = false }
unicode-normalization = "=0.1.26"
zstd = "=0.14.3"
tempfile = { version = "=3.27.0", optional = true }
rerail-prof = { path = "../prof" }
rerail-accel = { path = "../../../accel" }
# What the prefilter reads: the rule API and the stats (rerail-workspace), the label sets and `space` (rerail-transducer).
rerail-workspace = { path = "../workspace", default-features = false }
rerail-transducer = { path = "../transducer", default-features = false }
# The lanes (`logic::lanes`) the gates run on.
rerail-run = { path = "../run", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cranelift-jit = { version = "=0.125.4", features = ["selinux-fix"] }

[target.'cfg(target_family = "wasm")'.dependencies]
cranelift-jit-wasm = { path = "../../wasm/cranelift-jit" }
libc = "0.2.189"

[target.'cfg(unix)'.dependencies]
mimalloc = { version = "=0.1.52", default-features = false }
libc = "0.2.189"

[target.'cfg(not(any(windows, target_family = "wasm")))'.dependencies]
tikv-jemallocator = { version = "=0.7.0", features = ["disable_initial_exec_tls"] }
tikv-jemalloc-ctl = { version = "=0.7.0", features = ["stats"] }
tikv-jemalloc-sys = { version = "=0.7.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
metal = "0.33.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-prefilter = { path = ".", features = ["test-hooks"] }
ast-grep-language = { version = "=0.51.0", default-features = false, features = ["tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-c-sharp", "tree-sitter-css", "tree-sitter-go", "tree-sitter-html", "tree-sitter-java", "tree-sitter-json", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-php", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-swift"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "limits", "hooks", "array"] }
