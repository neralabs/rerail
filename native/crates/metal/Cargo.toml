[package]
name = "rerail-metal"
version = "0.1.0"
edition = "2024"
publish = false
description = "The engine's Metal runtime: device, buffer budget, mapped buffers, pipelines, launches."

[features]
# Per-thread buffer ledgers and buffer observations, for tests (the engine's and this crate's).
test-hooks = ["rerail-compiler/test-hooks", "rerail-prof/test-hooks"]

[dependencies]
rerail-accel = { path = "../../../accel" }
rerail-blocks = { path = "../blocks" }
# The view the tape's reads take (`TapeView`, decision 0310): `ChunkTape` has its layout. The view alone, no IR.
rerail-clif = { path = "../clif", default-features = false }
rerail-compiler = { path = "../compiler" }
rerail-prof = { path = "../prof" }
libc = "0.2.189"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
metal = "0.33.0"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-metal = { path = ".", features = ["test-hooks"] }
