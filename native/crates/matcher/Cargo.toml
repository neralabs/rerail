# Written by the crate split (step 6b) and kept by hand: its sources are where they were, mounted in place (src/lib.rs).
[package]
name = "rerail-matcher"
version = "0.1.0"
edition = "2024"
publish = false
description = "The matcher (W's): ast rules over a document's tape, their anchors, values, relations and memo, with the syntax errors' soundness and the code-rule profile."

[features]
default = ["rerail-adapters/default", "rerail-facts/default", "rerail-lang/default"]
headless = ["rerail-adapters/headless", "rerail-facts/headless", "rerail-lang/headless"]
code-rule-profile = ["rerail-facts/code-rule-profile", "rerail-lang/code-rule-profile"]
test-hooks = ["rerail-adapters/test-hooks", "rerail-facts/test-hooks", "rerail-lang/test-hooks", "rerail-prof/test-hooks", "rerail-store/test-hooks", "rerail-blocks/test-hooks", "rerail-rr-syntax/test-hooks", "dep:tempfile"]

[dependencies]
ast-grep-core = "=0.51.0"
ast-grep-language = { version = "=0.51.0", default-features = false }
foldhash = "=0.2.0"
memchr = "=2.8.3"
napi = { version = "3.0", default-features = false, features = ["napi8", "dyn-symbols"] }
num-traits = "=0.2.19"
parking_lot = { version = "0.12", features = ["arc_lock"] }
regex = "=1.13.1"
regex-syntax = "=0.8.11"
rusqlite = { version = "=0.41.1", features = ["bundled", "column_decltype", "functions", "hooks", "limits", "modern_sqlite", "series", "vtab"] }
rustc-hash = "=2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "=0.27.1"
tempfile = { version = "=3.27.0", optional = true }
rerail-adapters = { path = "../adapters", default-features = false }
rerail-blocks = { path = "../blocks" }
rerail-facts = { path = "../facts", default-features = false }
rerail-lang = { path = "../lang", default-features = false }
rerail-prof = { path = "../prof" }
rerail-rr-syntax = { path = "../rr_syntax" }
rerail-store = { path = "../store" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# This crate's own test build turns on its test hooks, as the engine's does (`test-hooks`).
rerail-matcher = { path = ".", features = ["test-hooks"] }
