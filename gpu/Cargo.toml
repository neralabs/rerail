[package]
name = "rerail-gpu"
version = "0.1.0"
edition = "2024"
publish = false
description = "The GPU device layer (decision 0400): one interface over Metal (macOS) and CUDA (Linux), kernels written once in UKL and launched through MLDB's grid runtime, and the UKL libraries' tests on each device."

[dependencies]
libc = "0.2.189"
# Kernels preprocessed in-process from UKL, with the UKL libraries carried in the binary (decision 0400 §4, §5).
rerail-ukl = { path = "../native/crates/ukl" }

[dev-dependencies]
# The LZ4 block compressor the tapes' 16z pieces are made with: the library's decoder is tested on its blocks.
lz4-sys = "=1.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2.7"
block = "0.1.6"

[lints.rust]
# objc 0.2's `msg_send!` tests a `cargo-clippy` feature in the calling crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
