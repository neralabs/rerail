[package]
name = "rerail-gpu"
version = "0.1.0"
edition = "2024"
publish = false
description = "The GPU device layer (decision 0440): one interface over Metal (macOS) and CUDA (Linux), kernels written once in UKL and launched through MLDB's grid runtime, and the UKL libraries' tests on each device."

[dependencies]
libc = "0.2.189"
# The device layer, below the preprocessor (re-exported).
rerail-device = { path = "device" }
# Kernels preprocessed in-process from UKL, with the UKL libraries carried in the binary (decision 0440 §4, §5).
rerail-ukl = { path = "../native/crates/ukl" }
# The CPU's kernels interpreted from their kernel tape, with `RERAIL_CPU_EXEC=vec` (decision 0567).
rerail-ukl-vec = { path = "../native/crates/ukl_vec" }

[dev-dependencies]
# The auxiliary index's builder is held to the crate's (`aux_index::build`), over its sample document (decision 0656).
rerail-tape-format = { path = "../native/crates/tape_format", features = ["test-hooks"] }
# A block's device buffer read and written in place by a kernel, on each backend (decision 0440 step B).
rerail-blocks = { path = "../native/crates/blocks" }
# The LZ4 block compressor the tapes' 16z pieces are made with: the library's decoder is tested on its blocks.
lz4-sys = "=1.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
objc = "0.2.7"
block = "0.1.6"

[lints.rust]
# objc 0.2's `msg_send!` tests a `cargo-clippy` feature in the calling crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
