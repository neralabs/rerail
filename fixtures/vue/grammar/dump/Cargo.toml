[package]
name = "rerail-vue-grammar-dump"
version = "0.0.0"
edition = "2021"
publish = false
description = "Offline T1 helper: parses files with a tree-sitter grammar loaded from a shared library and prints each tree as JSON lines."

[workspace]

[dependencies]
libloading = "=0.9.0"
serde_json = "1"
tree-sitter = "=0.27.0"
tree-sitter-language = "=0.1.8"

[profile.release]
opt-level = 3
