# T1 grammar measurement for the Rust pack: tree-sitter-rust (as ast-grep-language 0.45.3 ships it) against
# rust-analyzer's parser (ra_ap_syntax) and syn, with rustc 1.99.0's own parser as the acceptance oracle
# (`generate.py` runs it). Offline maintainer tool, never built by CI or the product.
[package]
name = "rerail-rust-grammar-t1"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-rust = "=0.24.2"
ra_ap_syntax = "=0.0.357"
syn = { version = "=2.0.117", default-features = false, features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
