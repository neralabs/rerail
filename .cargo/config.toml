# Cargo reads this when it runs under rerail/ (npm scripts, the release workflow, rerail-dev).
# A clean Windows install has no Visual C++ runtime, and a kernel linked against
# VCRUNTIME140.dll fails to load there with "The specified module could not be found".
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# SQLite's memory statistics take one process-wide mutex on every allocation and free, which
# serializes the content store connections that evaluation workers read through. Nothing reads
# them; SQLite recommends this setting.
[env]
# The bundled ENABLE_MEMORY_MANAGEMENT option also forces every page cache into one
# process-global LRU group. Incremental BLOB reads then contend on its mutex across workers.
# Use SQLite's per-cache groups. Store eviction closes idle connections and releases their pages.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0 -USQLITE_ENABLE_MEMORY_MANAGEMENT"
# SQLite 3.54.0 and 3.54.1 (libsqlite3-sys 0.39.x) refuse a statement whose CTE expansion opens
# SQLITE_LIMIT_EXPR_DEPTH (1000 by default) cursors or more: "VIEWs and/or subqueries nested too
# deep" (check-in e68aa6e1, bug 2026-10-04T05:35:14Z; forum "Regression in Version 3.54",
# https://sqlite.org/forum/forumpost/4e693a9fb5efd68d). The relational and catalog statements
# open tens of thousands; the widest the tests build needs 42,031. 3.54.2 backs the check-in out
# and 3.55 replaces it with SQLITE_LIMIT_CTES, 50,000 by default, the bound used here. The limit
# also bounds expression depth, so deep expressions recurse further on the stack before failing.
# Drop this once libsqlite3-sys bundles SQLite >= 3.54.2.
SQLITE_MAX_EXPR_DEPTH = "50000"
# The conformance fixtures every crate's tests read (`fixtures_dir!`, `native/src/code_rule_dsl/fixtures.rs`). The
# engine's build script sets it too, from `RERAIL_ORACLES_DIR` when that is set (`native/build.rs`).
RERAIL_FIXTURES_DIR = { value = "fixtures", relative = true }
