s\",\"**/*.cjs\"],exclude:[\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.config.js\",\"**/*.config.mjs\",\"**/*.config.cjs\",\"**/.*rc.js\",\"**/.*rc.cjs\"]},clauses:[{id:\"null\",violation:{message:\"Use undefined instead of null.\"}}]}},{id:\"unicorn-prefer-node-protocol\",kind:\"code\",title:\"eslint-plugin-unicorn prefer-node-protocol: Prefer using the `node:` protocol when importing Node.js builtin modules.\",group:\"eslint-plugin-unicorn\",on:true,mode:\"steer\",doc:{revision:2,description:\"Import Node.js built-in modules with the node: prefix; it makes clear they are built-ins, not npm packages.\",scope:{include:[\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.config.js\",\"**/*.config.mjs\",\"**/*.config.cjs\",\"**/.*rc.js\",\"**/.*rc.cjs\"]},clauses:[{id:\"import\",violation:{message:\"Prefer `node:` when importing a Node.js built-in module.\"}}]}}]},{id:\"next\",name:\"Next.js\",category:\"framework\",covers:\"Linter-equivalent to @next/eslint-plugin-next 16.3.8, for pages, images, fonts and scripts.\",reason:\"matches Next.js\",version:\"0.1.8\",packageName:\"@neralabs/rerail-pack-next\",honourSuppressionComments:true,rules:[{id:\"next-no-img-element\",kind:\"code\",title:\"No img element\",group:\"Next.js\",on:true,mode:\"log\",examples:{caught:{path:\"app/page.tsx\",text:'export default function Page() {\\n  return \u003cimg src=\"/hero.png\" alt=\"Hero\" />;\\n}\\n'},passes:{path:\"app/opengraph-image.tsx\",text:'import { ImageResponse } from \"next/og\";\\n\\nexport default function OpengraphImage() {\\n  return new ImageResponse(\u003cimg src=\"https://example.com/hero.png\" alt=\"Hero\" />);\\n}\\n'}},doc:{revision:4,description:\"Use the next/image Image component instead of img elements (picture children and metadata image routes aside); it optimizes images for faster loads and less bandwidth.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Replace this img with Image from next/image, giving it width and height or fill unless src is a static import.\"}}]}},{id:\"next-no-head-element\",kind:\"code\",title:\"No head element\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:1,description:\"Use the Head component from next/head instead of a raw head element outside the app directory; Next.js manages the page head itself.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Do not use `\u003chead>` element. Use `\u003cHead />` from `next/head` instead. See: https://nextjs.org/docs/messages/no-head-element\"}}]}},{id:\"next-no-sync-scripts\",kind:\"code\",title:\"No sync scripts\",group:\"Next.js\",on:true,mode:\"log\",examples:{caught:{path:\"pages/index.tsx\",text:'export default function Home() {\\n  return \u003cscript src=\"https://example.com/widget.js\" />;\\n}\\n'},passes:{path:\"pages/index.tsx\",text:'export default function Home() {\\n  return \u003cscript src=\"https://example.com/widget.js\" async />;\\n}\\n'}},doc:{revision:3,description:\"Add async or defer to script tags that load an external src; synchronous scripts block page rendering.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Add async or defer to this external script tag so it stops blocking page rendering.\"}}]}},{id:\"next-no-css-tags\",kind:\"code\",title:\"No css tags\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:2,description:\"Import local stylesheets instead of adding them with link tags, so Next.js can bundle and optimize the CSS; links to external stylesheet URLs are allowed.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Import this local stylesheet from the component (import './styles.css') instead of adding it with a link tag.\"}}]}},{id:\"next-google-font-display\",kind:\"code\",title:\"Google font display\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:1,description:\"Add a display value of swap or optional to Google Fonts stylesheet links; a missing, auto, block or fallback value can hide or shift text while the font loads.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Add display=swap or display=optional to this Google Fonts URL so text stays visible while the font loads.\"}}]}},{id:\"next-google-font-preconnect\",kind:\"code\",title:\"Google font preconnect\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:3,description:\"Mark links to Google's font file host (fonts.gstatic.com) as preconnect; it opens the connection early so fonts load sooner.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:'`rel=\"preconnect\"` is missing from Google Font. See: https://nextjs.org/docs/messages/google-font-preconnect'}}]}},{id:\"next-next-script-for-ga\",kind:\"code\",title:\"Next script for ga\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:2,description:\"Use the Google helpers from @next/third-parties instead of raw script tags for Google Analytics or Tag Manager; they load the tags without slowing the page.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Replace this inline Google Analytics or Tag Manager script with GoogleAnalytics or GoogleTagManager from @next/third-parties/google.\"}}]}},{id:\"next-no-unwanted-polyfillio\",kind:\"code\",title:\"No unwanted polyfillio\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:3,description:\"Don't load polyfills from polyfill.io for features Next.js already polyfills; they duplicate code and add page weight.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"No duplicate polyfills from Polyfill.io are allowed. See: https://nextjs.org/docs/messages/no-unwanted-polyfillio\"}}]}},{id:\"next-no-assign-module-variable\",kind:\"code\",title:\"No assign module variable\",group:\"Next.js\",on:true,mode:\"steer\",examples:{caught:{path:\"pages/index.tsx\",text:'let module = { title: \"Home\" };\\n\\nexport default function Home() {\\n  return \u003ch1>{module.title}\u003c/h1>;\\n}\\n'},passes:{path:\"pages/index.tsx\",text:'const page = { title: \"Home\" };\\n\\nexport default function Home() {\\n  return \u003ch1>{page.title}\u003c/h1>;\\n}\\n'}},doc:{revision:3,description:\"Don't declare a variable named module in Next.js code; it shadows the module object Node.js and the bundler rely on.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Do not assign to the variable `module`. See: https://nextjs.org/docs/messages/no-assign-module-variable\"}}]}},{id:\"next-no-document-import-in-page\",kind:\"code\",title:\"No document import in page\",group:\"Next.js\",on:true,mode:\"steer\",doc:{revision:3,description:\"Import next/document only in pages/_document; the custom Document API does not work in regular pages or components.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Move this next/document import into pages/_document; the custom Document API does not work in pages or components.\"}}]}},{id:\"next-no-head-import-in-document\",kind:\"code\",title:\"No head import in document\",group:\"Next.js\",on:true,mode:\"steer\",doc:{revision:3,description:\"Use Head from next/document, not next/head, in pages/_document; next/head is meant for individual pages.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Import Head from next/document instead of next/head in this custom Document.\"}}]}},{id:\"next-no-styled-jsx-in-document\",kind:\"code\",title:\"No styled jsx in document\",group:\"Next.js\",on:true,mode:\"log\",examples:{caught:{path:\"pages/_document.tsx\",text:'import { Html, Head, Main, NextScript } from \"next/document\";\\n\\nexport default function Document() {\\n  return (\\n    \u003cHtml>\\n      \u003cHead />\\n      \u003cbody>\\n        \u003cstyle jsx>{\"body { margin: 0; }\"}\u003c/style>\\n        \u003cMain />\\n        \u003cNextScript />\\n      \u003c/body>\\n    \u003c/Html>\\n  );\\n}\\n'},passes:{path:\"pages/_document.tsx\",text:'import { Html, Head, Main, NextScript } from \"next/document\";\\n\\nexport default function Document() {\\n  return (\\n    \u003cHtml>\\n      \u003cHead />\\n      \u003cbody>\\n        \u003cstyle>{\"body { margin: 0; }\"}\u003c/style>\\n        \u003cMain />\\n        \u003cNextScript />\\n      \u003c/body>\\n    \u003c/Html>\\n  );\\n}\\n'}},doc:{revision:2,description:\"Don't use styled-jsx style tags in pages/_document; the custom Document does not support them.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Move these styled-jsx styles out of pages/_document into a global stylesheet imported in pages/_app.\"}}]}},{id:\"next-no-title-in-document-head\",kind:\"code\",title:\"No title in document head\",group:\"Next.js\",on:true,mode:\"log\",examples:{caught:{path:\"pages/_document.tsx\",text:'import { Html, Head, Main, NextScript } from \"next/document\";\\n\\nexport default function Document() {\\n  return (\\n    \u003cHtml>\\n      \u003cHead>\\n        \u003ctitle>My site\u003c/title>\\n      \u003c/Head>\\n      \u003cbody>\\n        \u003cMain />\\n        \u003cNextScript />\\n      \u003c/body>\\n    \u003c/Html>\\n  );\\n}\\n'},passes:{path:\"pages/index.tsx\",text:'import Head from \"next/head\";\\n\\nexport default function Home() {\\n  return (\\n    \u003cHead>\\n      \u003ctitle>My site\u003c/title>\\n    \u003c/Head>\\n  );\\n}\\n'}},doc:{revision:2,description:\"Set page titles with Head from next/head on each page, not with a title inside the custom Document's Head from next/document.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Move this title out of the Document's Head into each page's Head from next/head.\"}}]}},{id:\"next-no-script-component-in-head\",kind:\"code\",title:\"No script component in head\",group:\"Next.js\",on:true,mode:\"steer\",examples:{caught:{path:\"pages/index.tsx\",text:'import Head from \"next/head\";\\nimport Script from \"next/script\";\\n\\nexport default function Home() {\\n  return (\\n    \u003cHead>\\n      \u003cScript src=\"https://example.com/analytics.js\" />\\n    \u003c/Head>\\n  );\\n}\\n'},passes:{path:\"pages/index.tsx\",text:'import Head from \"next/head\";\\nimport Script from \"next/script\";\\n\\nexport default function Home() {\\n  return (\\n    \u003c>\\n      \u003cHead>\\n        \u003ctitle>Home\u003c/title>\\n      \u003c/Head>\\n      \u003cScript src=\"https://example.com/analytics.js\" />\\n    \u003c/>\\n  );\\n}\\n'}},doc:{revision:2,description:\"Place next/script Script components outside Head from next/head; scripts inside Head are not loaded as intended.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Move this Script component outside the Head from next/head; Script places the tag itself.\"}}]}},{id:\"next-inline-script-id\",kind:\"code\",title:\"Inline script id\",group:\"Next.js\",on:true,mode:\"steer\",doc:{revision:3,description:\"Give every next/script component with inline content an id; Next.js needs it to track and optimize the script.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"`next/script` components with inline content must specify an `id` attribute. See: https://nextjs.org/docs/messages/inline-script-id\"}}]}},{id:\"next-no-async-client-component\",kind:\"code\",title:\"No async client component\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:3,description:`Don't make the default-exported component of a \"use client\" file an async function; Client Components cannot be async.`,scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"export-default-function\",violation:{message:\"Remove async from this Client Component and load its data in a parent Server Component or an effect instead.\"}}]}},{id:\"next-no-before-interactive-script-outside-document\",kind:\"code\",title:\"No before interactive script outside document\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:3,description:\"Use the beforeInteractive strategy of next/script only in pages/_document or the app directory; elsewhere it cannot run before hydration.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Move this beforeInteractive Script into pages/_document or the app directory, or switch it to afterInteractive.\"}}]}},{id:\"next-no-duplicate-head\",kind:\"code\",title:\"No duplicate head\",group:\"Next.js\",on:true,mode:\"steer\",doc:{revision:2,description:\"Keep a single Head element in a custom Next.js Document's render output; duplicate heads produce unexpected markup.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Do not include multiple instances of `\u003cHead/>`. See: https://nextjs.org/docs/messages/no-duplicate-head\"}}]}},{id:\"next-no-typos\",kind:\"code\",title:\"No typos\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:2,description:\"Spell getStaticProps, getStaticPaths and getServerSideProps exactly in page files; an export one letter off is silently ignored by Next.js.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"A data-fetching export may be a typo of getStaticProps, getStaticPaths or getServerSideProps.\"}}]}},{id:\"next-no-page-custom-font\",kind:\"code\",title:\"No page custom font\",group:\"Next.js\",on:true,mode:\"log\",doc:{revision:1,description:\"Add Google Fonts stylesheet links only inside the default-exported custom Document in pages/_document; fonts linked elsewhere load for one page and skip font optimization.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/* es that exist: each require() target must resolve, as Node.js resolves it, to an installed package or a file in the repository.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"This module cannot be resolved: no installed package or file in the repository provides it.\"}}]}},{id:\"n-no-unpublished-import\",kind:\"code\",title:\"eslint-plugin-n no-unpublished-import: disallow `import` declarations which import private modules\",group:\"eslint-plugin-n\",on:true,mode:\"steer\",doc:{revision:1,description:\"In a file npm publishes, do not import files npm leaves out of the package or packages listed only in devDependencies; the published package cannot load them.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"n-no-unpublished-require\",kind:\"code\",title:\"eslint-plugin-n no-unpublished-require: disallow `require()` expressions which import private modules\",group:\"eslint-plugin-n\",on:true,mode:\"steer\",doc:{revision:1,description:\"In a file npm publishes, do not require files npm leaves out of the package or packages listed only in devDependencies; the published package cannot load them.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}}]},{id:\"php\",name:\"PHP\",category:\"language\",covers:\"Linter-equivalent to PHP_CodeSniffer 4.0.4, PHPStan 2.2.16 and Psalm 6.19.1, for correct, consistent PHP.\",reason:\"matches PHP\",version:\"0.1.7\",packageName:\"@neralabs/rerail-pack-php\",honourSuppressionComments:true,rules:[{id:\"phpcs-generic-code-analysis-empty-statement\",kind:\"code\",title:\"PHP_CodeSniffer Generic.CodeAnalysis.EmptyStatement: Empty statement\",group:\"PHP_CodeSniffer\",on:false,mode:\"steer\",doc:{revision:2,description:\"Remove empty PHP control structure bodies, such as an if, loop, switch, try, catch or match block holding only comments; they hide unfinished or swallowed logic.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Put the missing logic in this empty block or remove the block; an empty branch or catch silently drops the case.\"}}]}},{id:\"phpcs-generic-php-backtick-operator\",kind:\"code\",title:\"PHP_CodeSniffer Generic.PHP.BacktickOperator: Backtick operator\",group:\"PHP_CodeSniffer\",on:false,mode:\"steer\",doc:{revision:2,description:\"Avoid the backtick shell operator in PHP; it runs shell commands implicitly and invites command injection.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"opening\",violation:{message:\"Replace this backtick shell command with proc_open() given the command as an array, so no shell parses the arguments.\"}}]}},{id:\"phpcs-generic-php-deprecated-functions\",kind:\"code\",title:\"PHP_CodeSniffer Generic.PHP.DeprecatedFunctions: Deprecated functions\",group:\"PHP_CodeSniffer\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace calls to deprecated built-in PHP functions, such as strftime(), utf8_encode() and curl_close(); they raise deprecation notices and will be removed.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Replace this deprecated function with its current equivalent, or delete the call if it is now a no-op like curl_close().\"}}]}},{id:\"phpcs-generic-php-forbidden-functions\",kind:\"code\",title:\"PHP_CodeSniffer Generic.PHP.ForbiddenFunctions: Forbidden functions\",group:\"PHP_CodeSniffer\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use count() instead of its alias sizeof(), and don't call delete(); stick to the canonical PHP functions.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Replace sizeof() with count(), or replace delete() with unset() or unlink(), whichever was meant.\"}}]}},{id:\"phpcs-generic-php-lower-case-constant\",kind:\"code\",title:\"PHP_CodeSniffer Generic.PHP.LowerCaseConstant: Lower-case constant\",group:\"PHP_CodeSniffer\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write true, false and null in lowercase in PHP, including their fully qualified forms.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"TRUE, FALSE and NULL must be lowercase\"}}]}},{id:\"phpcs-generic-php-no-silenced-errors\",kind:\"code\",title:\"PHP_CodeSniffer Generic.PHP.NoSilencedErrors: No silenced errors\",group:\"PHP_CodeSniffer\",on:false,mode:\"steer\",doc:{revision:2,description:\"Avoid the @ error-control operator in PHP outside race-safe directory checks and deprecation notices; it hides every warning, so handle failures explicitly.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Remove the @ and handle the failure explicitly, by checking the return value or converting warnings with set_error_handler().\"}}]}},{id:\"phpcs-squiz-php-disallow-size-functions-in-loops\",kind:\"code\",title:\"PHP_CodeSniffer Squiz.PHP.DisallowSizeFunctionsInLoops: Size functions in loops\",group:\"PHP_CodeSniffer\",on:false,mode:\"steer\",examples:{caught:{path:\"app/print.php\",text:\"\u003c?php\\n\\nfunction printAll(array $items): void\\n{\\n    for ($i = 0; $i \u003c count($items); $i++) {\\n        echo $items[$i];\\n    }\\n}\\n\"},passes:{path:\"app/drain.php\",text:\"\u003c?php\\n\\nfunction drain(array $queue): void\\n{\\n    while (count($queue) > 0) {\\n        run(array_shift($queue));\\n    }\\n}\\n\"}},doc:{revision:2,description:\"Hoist count(), sizeof() and strlen() out of PHP loop conditions unless the loop changes what they measure; they are recomputed on every pass.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Assign the size of $V to a variable before the loop and use that in the condition; as written it is recomputed on every pass.\"}}]}},{id:\"phpcs-squiz-php-eval\",kind:\"code\",title:\"PHP_CodeSniffer Squiz.PHP.Eval: Eval\",group:\"PHP_CodeSniffer\",on:false,mode:\"steer\",examples:{caught:{path:\"app/render.php\",text:\"\u003c?php\\n\\nfunction render(string $template): void\\n{\\n    eval($template);\\n}\\n\"},passes:{path:\"app/render.php\",text:\"\u003c?php\\n\\nfunction render(string $template): void\\n{\\n    echo htmlspecialchars($template);\\n}\\n\"}},doc:{revision:1,description:\"Avoid eval() in PHP; running strings as code is a security risk and hard to debug.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Replace this eval() with direct PHP code, such as a callable or a lookup array; evaluating strings invites code injection.\"}}]}},{id:\"phpstan-argument-sprintf\",kind:\"code\",title:\"PHPStan argument.sprintf: sprintf() argument count\",group:\"PHPStan\",on:true,mode:\"steer\",examples:{caught:{path:\"app/greet.php\",text:\"\u003c?php\\n\\nfunction greet(string $name): string\\n{\\n    return sprintf('Hello %s, you have %d messages', $name);\\n}\\n\"},passes:{path:\"app/greet.php\",text:\"\u003c?php\\n\\nfunction greet(string $name, int $count): string\\n{\\n    return sprintf('Hello %s, you have %d messages', $name, $count);\\n}\\n\"}},doc:{revision:1,description:\"Pass sprintf() exactly as many values as its format string's placeholders, and keep the format valid; too few values throw and extra ones are silently ignored.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"missing\",violation:{message:\"Call to sprintf contains more placeholders than values given.\"}}]}},{id:\"phpstan-argument-sscanf\",kind:\"code\",title:\"PHPStan argument.sscanf: sscanf() argument count\",group:\"PHPStan\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass sscanf() exactly as many output variables as its format string assigns, and keep the format valid.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"missing\",violation:{message:\"Pass sscanf() one output variable for each placeholder in its format, or remove the extra placeholders.\"}}]}},{id:\"phpstan-array-duplicate-key\",kind:\"code\",title:\"PHPStan array.duplicateKey: Duplicate array key\",group:\"PHPStan\",on:true,mode:\"steer\",doc:{revision:2,description:\"Remove duplicate keys from PHP array literals, including keys PHP coerces to the same value such as 1 and '1'; the later entry silently overwrites the earlier one.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Array has duplicate keys with this value.\"}}]}},{id:\"phpstan-if-always-false\",kind:\"code\",title:\"PHPStan if.alwaysFalse: If condition always false\",group:\"PHPStan\",on:false,mode:\"steer\",doc:{revision:2,description:\"Remove PHP if statements whose condition is always false, except declaration stubs kept for autoloaders and IDEs; the block is dead code.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"If condition is always false.\"}}]}},{id:\"phpstan-missing-function-return-type\",kind:\"code\",title:\"PHPStan missingType.return: Missing function return type\",group:\"PHPStan\",on:false,mode:\"steer\",doc:{revision:1,description:\"Declare a return type on PHP functions, natively or with a @return doc tag; methods and closures are not checked.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Function has no return type specified.\"}}]}},{id:\"phpstan-random-int-parameters\",kind:\"code\",title:\"PHPStan argument.type: random_int() parameters\",group:\"PHPStan\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass random_int() a minimum no greater than its maximum; otherwise it throws at runtime.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Parameter #1 $min of function random_int expects lower number than parameter #2 $max.\"}}]}},{id:\"psalm-forbidden-code\",kind:\"code\",title:\"Psalm ForbiddenCode: Forbidden code\",group:\"Psalm\",on:true,mode:\"steer\",doc:{revision:3,description:\"Remove var_dump(), shell_exec() and backtick shell commands from PHP code; they leak debug output or open the door to command injection.\",scope:{include:[\"**/*.php\"],exclude:[\"**/*.blade.php\"]},clauses:[{id:\"upstream\",violation:{message:\"Remove this var_dump() or shell command; log debug output instead, and run commands with proc_open() given an argument array.\"}}]}}]},{id:\"python\",name:\"Python\",category:\"language\",covers:\"Linter-equivalent to Ruff 0.16.9 and Bandit 1.9.4, for correct, clean and secure Python.\",reason:\"matches Python\",version:\"0.1.10\",packageName:\"@neralabs/rerail-pack-python\",honourSuppressionComments:true,rules:[{id:\"ruff-async100-cancel-scope-no-checkpoint\",kind:\"code\",title:\"Ruff ASYNC100: Cancel scope no checkpoint\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Add an await inside asyncio, anyio or trio timeout and cancel-scope blocks; without a checkpoint the timeout can never fire.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"cancel-scope-no-checkpoint\",violation:{message:\"Add an await inside this `with $CALLEE(...):` block; without a checkpoint the timeout can never fire.\"}}]}},{id:\"ruff-async105-trio-sync-call\",kind:\"code\",title:\"Ruff ASYNC105: Trio sync call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Await calls to trio's async functions such as trio.sleep; without await the call only creates a coroutine that never runs.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"trio-sync-call\",violation:{message:\"Call to `$CALLEE` is not immediately awaited\"}}]}},{id:\"ruff-async115-async-zero-sleep\",kind:\"code\",title:\"Ruff ASYNC115: Async zero sleep\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use lowlevel.checkpoint() instead of sleep(0) in trio and anyio code; it states the intent of yielding to the scheduler.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-async116-long-sleep-not-forever\",kind:\"code\",title:\"Ruff ASYNC116: Long sleep not forever\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use sleep_forever() instead of trio or anyio sleep calls longer than 24 hours; a sleep that long is almost always meant to never end.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-async210-blocking-http-call-in-async-function\",kind:\"code\",title:\"Ruff ASYNC210: Blocking http call in async function\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't make blocking HTTP calls with requests, httpx, urllib or urllib3 inside async functions; they stall the event loop.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"blocking-http-call\",violation:{message:\"Use an existing async client, or `await asyncio.to_thread(helper, ...)` for the request and response handling; preserve the API and options.\"}}]}},{id:\"ruff-async221-run-process-in-async-function\",kind:\"code\",title:\"Ruff ASYNC221: Run process in async function\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't run processes with subprocess.run, os.system or other blocking process calls inside async functions; they block the event loop until the process exits.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"run-process\",violation:{message:\"Async functions should not run processes with blocking methods\"}}]}},{id:\"ruff-async222-wait-for-process-in-async-function\",kind:\"code\",title:\"Ruff ASYNC222: Wait for process in async function\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't call os.wait, os.waitpid or the other blocking os.wait functions inside async functions; they block the event loop.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"wait-for-process\",violation:{message:\"Offload the wait with `await asyncio.to_thread(wait_fn, ...)`; preserve arguments and status. Await `proc.wait()` only for an async process.\"}}]}},{id:\"ruff-async230-blocking-open-call-in-async-function\",kind:\"code\",title:\"Ruff ASYNC230: Blocking open call in async function\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't open files with open(), io.open or Path.open() inside async functions; use an async file API so file I/O doesn't block the event loop.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"blocking-open\",violation:{message:\"Open this file with an async file API, such as `anyio.open_file()`, `trio.open_file()` or `aiofiles.open()`.\"}}]}},{id:\"ruff-async250-blocking-input-in-async-function\",kind:\"code\",title:\"Ruff ASYNC250: Blocking input in async function\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Don't call input() inside async functions; it blocks the event loop while waiting for the user.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"blocking-input\",violation:{message:\"Read input in a worker thread, such as `await asyncio.to_thread(input)`, instead of calling `input()` directly.\"}}]}},{id:\"ruff-async251-blocking-sleep-in-async-function\",kind:\"code\",title:\"Ruff ASYNC251: Blocking sleep in async function\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't call time.sleep() inside async functions; await the async library's sleep so other tasks keep running.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"blocking-sleep\",violation:{message:\"Async functions should not call `time.sleep`\"}}]}},{id:\"ruff-b002-unary-prefix-increment-decrement\",kind:\"code\",title:\"Ruff B002: Unary prefix increment decrement\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't write a doubled plus or minus prefix to increment or decrement a value; Python has no such operators, so the value is left unchanged.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unary-prefix-increment\",violation:{message:\"Replace this `++` prefix with `+= 1`; Python reads `++x` as `x`, so nothing is incremented.\"}}]}},{id:\"ruff-b003-assignment-to-os-environ\",kind:\"code\",title:\"Ruff B003: Assignment to os environ\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't assign a new value to os.environ; it doesn't change the real process environment, so update or clear the existing mapping instead.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"assignment-to-os-environ\",violation:{message:\"Update `os.environ` in place with `.clear()` and `.update()` instead of assigning a new mapping to it.\"}}]}},{id:\"ruff-b004-unreliable-callable-check\",kind:\"code\",title:\"Ruff B004: Unreliable callable check\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use callable() instead of checking hasattr() or getattr() for __call__; the attribute check gives wrong answers for some objects.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unreliable-callable-check\",violation:{message:'Using `hasattr(x, \"__call__\")` to test if x is callable is unreliable. Use `callable(x)` for consistent results.'}}]}},{id:\"ruff-b005-strip-with-multi-characters\",kind:\"code\",title:\"Ruff B005: Strip with multi characters\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid strip, lstrip or rstrip with a multi-character string that repeats a character; the argument is a set of characters, not a substring to remove.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"strip-with-multi-characters\",violation:{message:\"List each character once in this strip argument, or use `removeprefix()`/`removesuffix()` to remove a substring.\"}}]}},{id:\"ruff-b007-unused-loop-control-variable\",kind:\"code\",title:\"Ruff B007: Unused loop control variable\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Rename for-loop variables the loop body never uses to start with an underscore; it shows the value is deliberately ignored.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-b009-get-attr-with-constant\",kind:\"code\",title:\"Ruff B009: Get attr with constant\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:2,description:\"Use plain attribute access instead of getattr() with a constant name only where the object's type declares the attribute; elsewhere getattr() keeps type checkers satisfied.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"getattr-with-constant\",violation:{message:\"If the object's type declares this attribute, use `obj.name`; if not (a marker on a function, a patched method, a mixin's host attribute), keep `getattr` rather than a read with `# type: ignore`.\"}}]}},{id:\"ruff-b010-set-attr-with-constant\",kind:\"code\",title:\"Ruff B010: Set attr with constant\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:2,description:\"Use plain attribute assignment instead of setattr() with a constant name only where the object's type declares the attribute; elsewhere setattr() keeps type checkers satisfied.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"set-attr-with-constant\",violation:{message:\"If the object's type declares this attribute, use `obj.name = value`; if not (a marker on a function, a patched method), keep `setattr` rather than an assignment with `# type: ignore`.\"}}]}},{id:\"ruff-b011-assert-false\",kind:\"code\",title:\"Ruff B011: Assert false\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Raise AssertionError instead of assert False; assertions are stripped when Python runs with optimizations enabled.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"assert-false\",violation:{message:\"Do not `assert False` (`python -O` removes these calls), raise `AssertionError()`\"}}]}},{id:\"ruff-b013-redundant-tuple-in-exception-handler\",kind:\"code\",title:\"Ruff B013: Redundant tuple in exception handler\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove the one-element tuple around a single exception type in an except clause; the parentheses and comma are redundant.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"redundant-tuple-in-exception-handler\",violation:{message:\"A length-one tuple literal is redundant in exception handlers\"}}]}},{id:\"ruff-b014-duplicate-handler-exception\",kind:\"code\",title:\"Ruff B014: Duplicate handler exception\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove duplicate exception types from an except clause's tuple; naming one twice adds nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"duplicate-handler-exception\",violation:{message:\"Exception handler with duplicate exception: `$NAME`\"}}]}},{id:\"ruff-b016-raise-literal\",kind:\"code\",title:\"Ruff B016: Raise literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Raise an exception instance instead of a literal like a string or number; raising a literal fails with a TypeError.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"raise-literal\",violation:{message:\"Cannot raise a literal. Did you intend to return it or raise an Exception?\"}}]}},{id:\"ruff-b020-loop-variable-overrides-iterator\",kind:\"code\",title:\"Ruff B020: Loop variable overrides iterator\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't name a for-loop variable after a name used in the loop's iterable; the loop overwrites the original value.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"loop-variable-overrides-iterator\",violation:{message:\"Loop control variable `$NAME` overrides iterable it iterates\"}}]}},{id:\"ruff-b021-f-string-docstring\",kind:\"code\",title:\"Ruff B021: F string docstring\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a plain string literal, not an f-string, for docstrings; Python doesn't treat an f-string as a docstring.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"f-string-docstring\",violation:{message:\"f-string used as docstring. Python will interpret this as a joined string, rather than a docstring.\"}}]}},{id:\"ruff-b022-useless-contextlib-suppress\",kind:\"code\",title:\"Ruff B022: Useless contextlib suppress\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass at least one exception type to contextlib.suppress(); with none it suppresses nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"useless-contextlib-suppress\",violation:{message:\"No arguments passed to `contextlib.suppress`. No exceptions will be suppressed and therefore this context manager is redundant\"}}]}},{id:\"ruff-b023-function-uses-loop-variable\",kind:\"code\",title:\"Ruff B023: Function uses loop variable\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass loop variables into functions and lambdas defined inside a loop as arguments or defaults; otherwise they all see the variable's last value.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"function-uses-loop-variable\",violation:{message:\"Bind `$N` as a default argument, such as `$N=$N`, so the function keeps this iteration's value.\"}}]}},{id:\"ruff-b025-duplicate-try-block-exception\",kind:\"code\",title:\"Ruff B025: Duplicate try block exception\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove exception types repeated across handlers of the same try block; only the first handler that names one can ever run.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"duplicate-try-block-exception\",violation:{message:\"try-except block with duplicate exception `$E`\"}}]}},{id:\"ruff-b026-star-arg-unpacking-after-keyword-arg\",kind:\"code\",title:\"Ruff B026: Star arg unpacking after keyword arg\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Put star-argument unpacking before keyword arguments in calls; placing it after is legal but misleading about argument order.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"star-arg-unpacking-after-keyword-arg\",violation:{message:\"Star-arg unpacking after a keyword argument is strongly discouraged\"}}]}},{id:\"ruff-b028-no-explicit-stacklevel\",kind:\"code\",title:\"Ruff B028: No explicit stacklevel\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass an explicit stacklevel to warnings.warn(); without it the warning points at the warn call instead of the caller who triggered it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"no-explicit-stacklevel\",violation:{message:\"Pass stacklevel= to this warnings.warn() call, usually 2, so the warning points at the caller.\"}}]}},{id:\"ruff-b029-except-with-empty-tuple\",kind:\"code\",title:\"Ruff B029: Except with empty tuple\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't write an except clause with an empty tuple as its type; it catches nothing, so name the exceptions to handle.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"except-with-empty-tuple\",violation:{message:\"Using `except ():` with an empty tuple does not catch anything; add exceptions to handle\"}}]}},{id:\"ruff-b030-except-with-non-exception-classes\",kind:\"code\",title:\"Ruff B030: Except with non exception classes\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Use only exception classes, or tuples of them, in except clauses; other values such as literals or expressions are not valid exception types.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"except-with-non-exception-classes\",violation:{message:\"`except` handlers should only be exception classes or tuples of exception classes\"}}]}},{id:\"ruff-b032-unintentional-type-annotation\",kind:\"code\",title:\"Ruff B032: Unintentional type annotation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use = instead of : when setting a subscript or another object's attribute without a value; a colon there makes a type annotation that assigns nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unintentional-type-annotation\",violation:{message:\"Possible unintentional type annotation (using `:`). Did you mean to assign (using `=`)?\"}}]}},{id:\"ruff-b033-duplicate-value\",kind:\"code\",title:\"Ruff B033: Duplicate value\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove duplicate literal values from Python set literals; the repeat is dropped silently and usually hides a typo, and values like True, 1 and 1.0 count as the same.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"duplicate-value\",violation:{message:\"Sets should not contain duplicate item `$V`\"}}]}},{id:\"ruff-b034-re-sub-positional-args\",kind:\"code\",title:\"Ruff B034: Re sub positional args\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass count, maxsplit and flags as keyword arguments to re.sub(), re.subn() and re.split(); their positional order is easy to get wrong.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"re-sub-positional-args\",violation:{message:\"`re.sub` should pass `count` and `flags` as keyword arguments to avoid confusion due to unintuitive argument positions\"}}]}},{id:\"ruff-b039-mutable-contextvar-default\",kind:\"code\",title:\"Ruff B039: Mutable contextvar default\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't give a ContextVar a mutable default such as a list, dict or set; the one default object is shared across every context.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-b904-raise-without-from-inside-except\",kind:\"code\",title:\"Ruff B904: Raise without from inside except\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use raise ... from err (or from None) when raising a new exception inside an except block; it keeps the cause chain clear instead of looking like a bug in the handler.\",scope:{include:[\"**/*.py\",\"**/*.pyi\"],exclude:[\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\"]},clauses:[{id:\"raise-without-from-inside-except\",violation:{message:\"Raise this exception with `from err` or `from None` so the cause chain is clear.\"}}]}},{id:\"ruff-b905-zip-without-explicit-strict\",kind:\"code\",title:\"Ruff B905: Zip without explicit strict\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:2,description:\"Pass strict= explicitly to zip() over two or more iterables on Python 3.10+; otherwise mismatched lengths are truncated silently.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"zip-without-explicit-strict\",violation:{message:\"Pass `strict=` explicitly: `strict=True` when lengths must match, `strict=False` when truncation is intended.\"}}]}},{id:\"ruff-e711-none-comparison\",kind:\"code\",title:\"Ruff E711: None comparison\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:2,description:\"Use is None or is not None instead of == or != to compare with None; equality can be overridden and gives surprising results.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"none-comparison-equal\",violation:{message:\"Use `is None` instead of `== None` for this comparison.\"}}]}},{id:\"ruff-e721-type-comparison\",kind:\"code\",title:\"Ruff E721: Type comparison\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use isinstance(), or is and is not, instead of == or != to compare types; equality on types misses subclasses and can be overridden.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"type-comparison\",violation:{message:\"Use `is` and `is not` for type comparisons, or `isinstance()` for isinstance checks\"}}]}},{id:\"ruff-e722-bare-except\",kind:\"code\",title:\"Ruff E722: Bare except\",group:\"Ruff\",on:true,mode:\"steer\",examples:{caught:{path:\"app/jobs.py\",text:\"try:\\n    run()\\nexcept:\\n    log()\\n\"},passes:{path:\"app/jobs.py\",text:\"try:\\n    run()\\nexcept ValueError:\\n    log()\\n\"}},doc:{revision:1,description:\"Name the exception types in except clauses instead of a bare except, unless the handler re-raises; a bare except also catches KeyboardInterrupt and SystemExit.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"bare-except\",violation:{message:\"Name the exception types this bare except should catch; it also catches KeyboardInterrupt and SystemExit.\"}}]}},{id:\"ruff-e742-ambiguous-class-name\",kind:\"code\",title:\"Ruff E742: Ambiguous class name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid naming classes l, I or O; in many fonts they are hard to tell apart from 1 and 0.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"ambiguous-class-name\",violation:{message:\"Rename class `$NAME` to a descriptive name; in many fonts it is easy to confuse with 1 or 0.\"}}]}},{id:\"ruff-e743-ambiguous-function-name\",kind:\"code\",title:\"Ruff E743: Ambiguous function name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid naming functions or methods l, I or O; in many fonts they are hard to tell apart from 1 and 0.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"ambiguous-function-name\",violation:{message:\"Rename function `$NAME` to a descriptive name; in many fonts it is easy to confuse with 1 or 0.\"}}]}},{id:\"ruff-f403-undefined-local-with-import-star\",kind:\"code\",title:\"Ruff F403: Undefined local with import star\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid from module import * star imports; they hide where names come from and stop undefined names from being detected.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undefined-local-with-import-star\",violation:{message:\"`from $MODULE import *` used; unable to detect undefined names\"}}]}},{id:\"ruff-f405-undefined-local-with-import-star-usage\",kind:\"code\",title:\"Ruff F405: Undefined local with import star usage\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Import names explicitly instead of relying on a star import to define them; names that may only come from a star import can't be checked.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undefined-local-with-import-star-usage\",violation:{message:\"Import `$NAME` explicitly from its module; it may only be defined by a star import.\"}}]}},{id:\"ruff-f406-undefined-local-with-nested-import-star-usage\",kind:\"code\",title:\"Ruff F406: Undefined local with nested import star usage\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Don't use from module import * inside a function or class; star imports are only allowed at module level.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undefined-local-with-nested-import-star-usage\",violation:{message:\"Import the needed names from `$MODULE` explicitly; a star import is only allowed at module level.\"}}]}},{id:\"ruff-f407-future-feature-not-defined\",kind:\"code\",title:\"Ruff F407: Future feature not defined\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Import only real feature names from __future__; an unknown feature name is a syntax error.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"future-feature-not-defined\",violation:{message:\"Future feature `$NAME` is not defined\"}}]}},{id:\"ruff-f501-percent-format-invalid-format\",kind:\"code\",title:\"Ruff F501: Percent format invalid format\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Fix malformed %-format strings, such as incomplete specifiers or unclosed %(key) names; they raise an error at run time.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-invalid-format\",violation:{message:\"Fix this malformed %-format string, such as an incomplete specifier or an unclosed %(key) name.\"}}]}},{id:\"ruff-f502-percent-format-expected-mapping\",kind:\"code\",title:\"Ruff F502: Percent format expected mapping\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a mapping, not a list, tuple or set, to a %-format string that uses %(key) placeholders; the call fails at run time.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-expected-mapping\",violation:{message:\"`%`-format string expected mapping but got sequence\"}}]}},{id:\"ruff-f503-percent-format-expected-sequence\",kind:\"code\",title:\"Ruff F503: Percent format expected sequence\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a tuple, not a dict, to a %-format string with several positional placeholders; the call fails at run time.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-expected-sequence\",violation:{message:\"`%`-format string expected sequence but got mapping\"}}]}},{id:\"ruff-f504-percent-format-extra-named-arguments\",kind:\"code\",title:\"Ruff F504: Percent format extra named arguments\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove dict keys that no %(key) placeholder in the %-format string uses; an unused key usually means a typo or a stale argument.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-extra-named-arguments\",violation:{message:\"`%`-format string has unused named argument(s)\"}}]}},{id:\"ruff-f505-percent-format-missing-argument\",kind:\"code\",title:\"Ruff F505: Percent format missing argument\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Supply a value for every %(key) placeholder in a %-format string; a missing key raises KeyError at run time.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-missing-argument\",violation:{message:\"`%`-format string is missing argument(s) for placeholder(s)\"}}]}},{id:\"ruff-f506-percent-format-mixed-positional-and-named\",kind:\"code\",title:\"Ruff F506: Percent format mixed positional and named\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't mix %(key) placeholders and positional placeholders in one %-format string; Python cannot format it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-mixed-positional-and-named\",violation:{message:\"Use only %(key) placeholders or only positional ones in this format string; Python cannot format a mix.\"}}]}},{id:\"ruff-f507-percent-format-positional-count-mismatch\",kind:\"code\",title:\"Ruff F507: Percent format positional count mismatch\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Match the number of %-format placeholders to the number of values supplied; a mismatch raises TypeError at run time.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-positional-count-mismatch\",violation:{message:\"Make the number of values match the placeholders in this %-format string; a mismatch raises TypeError.\"}}]}},{id:\"ruff-f508-percent-format-star-requires-sequence\",kind:\"code\",title:\"Ruff F508: Percent format star requires sequence\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a tuple, not a dict, to a %-format string that uses a * width or precision; the call fails at run time.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-star-requires-sequence\",violation:{message:\"Pass a tuple instead of a dict to this %-format string; its `*` width or precision takes positional values.\"}}]}},{id:\"ruff-f509-percent-format-unsupported-format-character\",kind:\"code\",title:\"Ruff F509: Percent format unsupported format character\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use only valid conversion characters in Python %-format strings; an unsupported one raises ValueError at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"percent-format-unsupported-format-character\",violation:{message:\"Replace the unsupported conversion character in this %-format string with a valid one such as `s`, `d`, `r` or `f`.\"}}]}},{id:\"ruff-f521-string-dot-format-invalid-format\",kind:\"code\",title:\"Ruff F521: String dot format invalid format\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep str.format() strings well-formed, with balanced braces and valid fields and format specs; a malformed one raises ValueError at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"string-dot-format-invalid-format\",violation:{message:\"`.format` call has invalid format string\"}}]}},{id:\"ruff-f522-string-dot-format-extra-named-arguments\",kind:\"code\",title:\"Ruff F522: String dot format extra named arguments\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove keyword arguments to str.format() that no named placeholder in the string uses; they are silently ignored.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"string-dot-format-extra-named-arguments\",violation:{message:\"Remove the keyword arguments that no named placeholder in this str.format() string uses.\"}}]}},{id:\"ruff-f523-string-dot-format-extra-positional-arguments\",kind:\"code\",title:\"Ruff F523: String dot format extra positional arguments\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove positional arguments to str.format() that no placeholder in the string uses; they are silently ignored.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"string-dot-format-extra-positional-arguments\",violation:{message:\"`.format` call has unused arguments\"}}]}},{id:\"ruff-f524-string-dot-format-missing-arguments\",kind:\"code\",title:\"Ruff F524: String dot format missing arguments\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass an argument for every placeholder in a str.format() string; a missing one raises IndexError or KeyError at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"string-dot-format-missing-arguments\",violation:{message:\"`.format` call is missing argument(s) for placeholder(s)\"}}]}},{id:\"ruff-f525-string-dot-format-mixing-automatic\",kind:\"code\",title:\"Ruff F525: String dot format mixing automatic\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't mix automatic and manually numbered fields in one str.format() string; Python raises ValueError at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"string-dot-format-mixing-automatic\",violation:{message:\"`.format` string mixes automatic and manual numbering\"}}]}},{id:\"ruff-f541-f-string-missing-placeholders\",kind:\"code\",title:\"Ruff F541: F string missing placeholders\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Remove the f prefix from Python f-strings that have no placeholders; it suggests interpolation that never happens.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"f-string-missing-placeholders\",violation:{message:\"Remove the `f` prefix and unescape doubled braces to keep this string's runtime value unchanged.\"}}]}},{id:\"ruff-f601-multi-value-repeated-key-literal\",kind:\"code\",title:\"Ruff F601: Multi value repeated key literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid repeating a literal key (or an equal one, like 1 and 1.0) in a Python dict literal; the later value silently overwrites the earlier one.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"multi-value-repeated-key-literal\",violation:{message:\"Dictionary key literal `$KEYA` repeated\"}}]}},{id:\"ruff-f602-multi-value-repeated-key-variable\",kind:\"code\",title:\"Ruff F602: Multi value repeated key variable\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid repeating the same variable as a key in a Python dict literal; the later value silently overwrites the earlier one.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"multi-value-repeated-key-variable\",violation:{message:\"Remove or merge the repeated key `$KEY` in this dict; the later value silently overwrites the earlier one.\"}}]}},{id:\"ruff-f622-multiple-starred-expressions\",kind:\"code\",title:\"Ruff F622: Multiple starred expressions\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use at most one starred element in each Python unpacking target; two in the same target is a syntax error.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"multiple-starred-expressions\",violation:{message:\"Two starred expressions in assignment\"}}]}},{id:\"ruff-f632-is-literal\",kind:\"code\",title:\"Ruff F632: Is literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Use == or != instead of is or is not to compare literal values; the identity of such values is unreliable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"is-literal-is\",violation:{message:\"Use `==` instead of `is` to compare this literal value.\"}}]}},{id:\"ruff-f633-invalid-print-syntax\",kind:\"code\",title:\"Ruff F633: Invalid print syntax\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use print()'s file argument instead of Python 2's >> redirection, which raises TypeError with the print function.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"invalid-print-syntax\",violation:{message:\"Replace `>>` with print()'s `file=` argument, as in `print(msg, file=sys.stderr)`.\"}}]}},{id:\"ruff-f701-break-outside-loop\",kind:\"code\",title:\"Ruff F701: Break outside loop\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep break inside a for or while loop body; outside one (including a loop's else block) it is a Python syntax error.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"break-outside-loop\",violation:{message:\"`break` outside loop\"}}]}},{id:\"ruff-f702-continue-outside-loop\",kind:\"code\",title:\"Ruff F702: Continue outside loop\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep continue inside a for or while loop body; outside one (including a loop's else block) it is a Python syntax error.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"continue-outside-loop\",violation:{message:\"`continue` not properly in loop\"}}]}},{id:\"ruff-f706-return-outside-function\",kind:\"code\",title:\"Ruff F706: Return outside function\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep return inside a function; at module level or directly in a class body it is a Python syntax error.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"return-outside-function\",violation:{message:\"`return` statement outside of a function/method\"}}]}},{id:\"ruff-f707-default-except-not-last\",kind:\"code\",title:\"Ruff F707: Default except not last\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Put a bare except handler last in its try statement; Python rejects any handler after it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"default-except-not-last\",violation:{message:\"Move this bare `except:` handler after all typed handlers; a bare handler must be last.\"}}]}},{id:\"ruff-f822-undefined-export\",kind:\"code\",title:\"Ruff F822: Undefined export\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"List only names the module actually defines in its __all__ (outside __init__.py); an undefined entry breaks star imports.\",scope:{include:[\"**/*\"],exclude:[\"**/__init__.py\",\"**/__init__.pyi\",\"__init__.py\",\"__init__.pyi\"]},clauses:[{id:\"undefined-export\",violation:{message:\"Undefined name $S in `__all__`\"}}]}},{id:\"ruff-f823-undefined-local\",kind:\"code\",title:\"Ruff F823: Undefined local\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't read a variable before the function assigns it, even when an outer scope has the same name; Python raises UnboundLocalError.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undefined-local\",violation:{message:\"Assign `$N` before reading it here, or declare it `global` or `nonlocal` if you meant the outer variable.\"}}]}},{id:\"ruff-f842-unused-annotation\",kind:\"code\",title:\"Ruff F842: Unused annotation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove local variables that are annotated but never assigned or read; the annotation alone does nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unused-annotation\",violation:{message:\"Local variable `$N` is annotated but never used\"}}]}},{id:\"ruff-f901-raise-not-implemented\",kind:\"code\",title:\"Ruff F901: Raise not implemented\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Raise NotImplementedError, not NotImplemented; NotImplemented is a comparison sentinel and raising it is a TypeError.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"raise-not-implemented\",violation:{message:\"`raise NotImplemented` should be `raise NotImplementedError`\"}}]}},{id:\"ruff-pie794-duplicate-class-field-definition\",kind:\"code\",title:\"Ruff PIE794: Duplicate class field definition\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Define each class field once; a later definition silently replaces the earlier one.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"duplicate-class-field-definition\",violation:{message:\"Class field `$N` is defined multiple times\"}}]}},{id:\"ruff-pie796-non-unique-enums\",kind:\"code\",title:\"Ruff PIE796: Non unique enums\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Give each Enum member a unique value; a duplicate becomes an alias of the earlier member instead of a new one.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pie800-unnecessary-spread\",kind:\"code\",title:\"Ruff PIE800: Unnecessary spread\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write the entries directly instead of spreading a dict literal into another Python dict literal.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-spread\",violation:{message:\"Unnecessary spread `**`\"}}]}},{id:\"ruff-pie804-unnecessary-dict-kwargs\",kind:\"code\",title:\"Ruff PIE804: Unnecessary dict kwargs\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Pass keyword arguments directly instead of unpacking a dict literal into a Python call.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-dict-kwargs\",violation:{message:\"Unnecessary `dict` kwargs\"}}]}},{id:\"ruff-pie807-reimplemented-container-builtin\",kind:\"code\",title:\"Ruff PIE807: Reimplemented container builtin\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use list or dict directly instead of a lambda that returns an empty list or dict, such as for a default factory.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"reimplemented-container-builtin\",violation:{message:\"Prefer `list` or `dict` over useless lambda\"}}]}},{id:\"ruff-pie810-multiple-starts-ends-with\",kind:\"code\",title:\"Ruff PIE810: Multiple starts ends with\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a tuple to one startswith() or endswith() call instead of or-ing several calls on the same string.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"multiple-starts-ends-with\",violation:{message:\"Call `$M` once with a tuple of all the prefixes or suffixes instead of or-ing several calls.\"}}]}},{id:\"ruff-ret501-unnecessary-return-none\",kind:\"code\",title:\"Ruff RET501: Unnecessary return none\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a bare return instead of return None in Python functions that never return anything else.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-return-none\",violation:{message:\"Do not explicitly `return None` in function if it is the only possible return value\"}}]}},{id:\"ruff-ret502-implicit-return-value\",kind:\"code\",title:\"Ruff RET502: Implicit return value\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use return None instead of a bare return in Python functions that also return a value; make the None result explicit.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"implicit-return-value\",violation:{message:\"Write `return None` instead of a bare `return`, since this function returns a value elsewhere.\"}}]}},{id:\"ruff-ret505-superfluous-else-return\",kind:\"code\",title:\"Ruff RET505: Superfluous else return\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove the else or elif after an if branch that returns, and dedent its code; the branch already leaves the function.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"superfluous-else-return-elif\",violation:{message:\"Unnecessary `elif` after `return` statement\"}}]}},{id:\"ruff-ret506-superfluous-else-raise\",kind:\"code\",title:\"Ruff RET506: Superfluous else raise\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove the else or elif after an if branch that raises, and dedent its code; the branch already leaves the function.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"superfluous-else-raise-elif\",violation:{message:\"Unnecessary `elif` after `raise` statement\"}}]}},{id:\"ruff-ret507-superfluous-else-continue\",kind:\"code\",title:\"Ruff RET507: Superfluous else continue\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove the else or elif after an if branch that continues the loop, and dedent its code; the branch already skips ahead.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"superfluous-else-continue-elif\",violation:{message:\"Unnecessary `elif` after `continue` statement\"}}]}},{id:\"ruff-ret508-superfluous-else-break\",kind:\"code\",title:\"Ruff RET508: Superfluous else break\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove the else or elif after an if branch that breaks out of the loop, and dedent its code; the branch already exits the loop.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"superfluous-else-break-elif\",violation:{message:\"Unnecessary `elif` after `break` statement\"}}]}},{id:\"ruff-sim101-duplicate-isinstance-call\",kind:\"code\",title:\"Ruff SIM101: Duplicate isinstance call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Merge isinstance() checks on the same object joined by or into one call with a tuple of types.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"duplicate-isinstance-call\",violation:{message:\"Multiple `isinstance` calls for `$T`, merge into a single call\"}}]}},{id:\"ruff-sim107-return-in-try-except-finally\",kind:\"code\",title:\"Ruff SIM107: Return in try except finally\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't return from a finally block when the try or except also returns; the finally return silently overrides theirs.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"return-in-try-except-finally\",violation:{message:\"Remove the `return` from the `finally` block; it silently overrides the `return` in `try` or `except`.\"}}]}},{id:\"ruff-sim109-compare-with-tuple\",kind:\"code\",title:\"Ruff SIM109: Compare with tuple\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a membership test against a tuple instead of several or-chained equality checks of the same variable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"compare-with-tuple\",violation:{message:\"Use `$N in (...)` instead of multiple equality comparisons\"}}]}},{id:\"ruff-sim112-uncapitalized-environment-variables\",kind:\"code\",title:\"Ruff SIM112: Uncapitalized environment variables\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:2,description:\"Use uppercase names when reading environment variables through os.environ or os.getenv; the lowercase proxy variables are exempt.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"uncapitalized-environment-variables\",violation:{message:\"Uppercase only if the deployment uses that name; preserve intentional lowercase keys because lookups are case-sensitive on POSIX.\"}}]}},{id:\"ruff-sim113-enumerate-for-loop\",kind:\"code\",title:\"Ruff SIM113: Enumerate for loop\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Use enumerate() instead of a counter that starts at 0 and is incremented by hand in each pass of a for loop.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"enumerate-for-loop\",violation:{message:\"Use `enumerate()` for index variable `$N` in `for` loop\"}}]}},{id:\"ruff-sim208-double-negation\",kind:\"code\",title:\"Ruff SIM208: Double negation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove double negation with not not; use the value itself, or bool() if you need a real boolean.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"double-negation\",violation:{message:\"Use the operand instead of `not (not ...)`\"}}]}},{id:\"ruff-sim210-if-expr-with-true-false\",kind:\"code\",title:\"Ruff SIM210: If expr with true false\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use bool() on the condition instead of a conditional expression that yields True when it holds and False otherwise.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"if-expr-with-true-false\",violation:{message:\"Use `bool(...)` instead of `True if ... else False`\"}}]}},{id:\"ruff-sim211-if-expr-with-false-true\",kind:\"code\",title:\"Ruff SIM211: If expr with false true\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use not on the condition instead of a conditional expression that yields False when it holds and True otherwise.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"if-expr-with-false-true\",violation:{message:\"Use `not ...` instead of `False if ... else True`\"}}]}},{id:\"ruff-sim212-if-expr-with-twisted-arms\",kind:\"code\",title:\"Ruff SIM212: If expr with twisted arms\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Swap the arms of a conditional expression that tests not x and falls back to x, so the test reads x without the negation.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"if-expr-with-twisted-arms\",violation:{message:\"Swap the arms to read `$A if $A else ...`, dropping the `not` from `... if not $A else $A`.\"}}]}},{id:\"ruff-sim300-yoda-conditions\",kind:\"code\",title:\"Ruff SIM300: Yoda conditions\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:2,description:\"Put the variable first and the constant or literal second in comparisons, avoiding Yoda conditions; it reads the way you would say it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"yoda-conditions\",violation:{message:\"Put the variable first; reverse `\u003c`/`>` and `\u003c=`/`>=` when swapping operands, and keep equality operators unchanged.\"}}]}},{id:\"ruff-sim905-split-static-string\",kind:\"code\",title:\"Ruff SIM905: Split static string\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a list literal instead of calling split() or rsplit() on a string literal; the result is known in advance.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"split-static-string\",violation:{message:\"Consider using a list literal instead of `str.split`\"}}]}},{id:\"ruff-sim910-dict-get-with-none-default\",kind:\"code\",title:\"Ruff SIM910: Dict get with none default\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Drop the redundant None default from dict.get() calls; get() already returns None for a missing key.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"dict-get-with-none-default\",violation:{message:\"Use `.get(key)` instead of `.get(key, None)`\"}}]}},{id:\"ruff-t100-debugger\",kind:\"code\",title:\"Ruff T100: Debugger\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove debugger imports and calls such as pdb.set_trace() and breakpoint() before committing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"debugger-import\",violation:{message:\"Remove this debugger import of `$D` before committing.\"}}]}},{id:\"bandit-b101-assert-used\",kind:\"code\",title:\"Bandit B101: Assert used\",group:\"Bandit\",on:true,mode:\"steer\",examples:{caught:{path:\"app/checks.py\",text:\"def check(user):\\n    assert user.is_admin\\n\"},passes:{path:\"app/checks.py\",text:\"def check(user):\\n    if not user.is_admin:\\n        raise PermissionError(user)\\n\"}},doc:{revision:2,description:\"Avoid assert statements in Python code outside tests; they are stripped when Python runs with optimization, so any check they perform silently disappears.\",scope:{include:[\"**/*\"],exclude:[\"**/tests/**\",\"**/test_*.py\",\"**/*_test.py\",\"**/conftest.py\"]},clauses:[{id:\"assert-used\",violation:{message:\"Replace this assert with an if check that raises an exception; asserts are stripped when Python runs with -O.\"}}]}},{id:\"bandit-b102-exec-used\",kind:\"code\",title:\"Bandit B102: Exec used\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid exec() calls in Python, including through import aliases; running text as code is dangerous unless that text is fully trusted.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"exec-call\",violation:{message:\"Replace this exec call with code that performs the intended operation directly, unless the executed text is fully trusted.\"}}]}},{id:\"bandit-b110-try-except-pass\",kind:\"code\",title:\"Bandit B110: Try except pass\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't write a bare or catch-all Exception handler whose only statement is pass; log or handle the error, or catch the specific exception you expect.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"try-except-pass\",violation:{message:\"This exception is silently discarded with pass. Handle or log it, or catch a specific expected exception when suppression is intentional.\"}}]}},{id:\"bandit-b112-try-except-continue\",kind:\"code\",title:\"Bandit B112: Try except continue\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't write a bare or catch-all Exception handler in a loop whose only statement is continue; log or handle the error, or catch the specific exception you expect.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"try-except-continue\",violation:{message:\"This exception is silently discarded by continuing the loop. Handle or log it, or catch a specific expected exception before continuing.\"}}]}},{id:\"bandit-b113-request-without-timeout\",kind:\"code\",title:\"Bandit B113: Request without timeout\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a timeout to requests calls, and never set it to None on requests or httpx calls; without one, a slow server can hang the program indefinitely.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"request-without-timeout\",violation:{message:\"Pass a finite timeout to this HTTP call; without one a slow server can hang the program.\"}}]}},{id:\"bandit-b301-pickle\",kind:\"code\",title:\"Bandit B301: Pickle\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid deserializing with pickle, dill, shelve, jsonpickle, or pandas.read_pickle; loading untrusted data this way can execute arbitrary code.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"unsafe-deserialization\",violation:{message:\"Load this data with json or another data-only format instead; unpickling untrusted input can run arbitrary code.\"}}]}},{id:\"bandit-b302-marshal\",kind:\"code\",title:\"Bandit B302: Marshal\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid marshal.load() and marshal.loads(); marshal is not safe against malicious or malformed data, so never use it on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B302\",violation:{message:\"Load this data with json or another data-only format instead of marshal, which is unsafe on untrusted input.\"}}]}},{id:\"bandit-b303-md5\",kind:\"code\",title:\"Bandit B303: Md5\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid MD2, MD4, MD5, and SHA1 hashes from PyCrypto, PyCryptodome, or cryptography; they are broken for security, so use SHA-256 or a password hash.\",scope:{include:[\"**/*.py\",\"**/*.pyi\"],exclude:[\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\"]},clauses:[{id:\"weak-hash\",violation:{message:\"MD5 and SHA1 are broken for security use. Use SHA-256, or a password hash for passwords.\"}}]}},{id:\"bandit-b305-cipher-modes\",kind:\"code\",title:\"Bandit B305: Cipher modes\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid the ECB cipher mode; it encrypts identical blocks to identical output and leaks patterns in the data, so use an authenticated mode such as GCM.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B305\",violation:{message:\"Replace ECB with an authenticated mode such as GCM; ECB leaks patterns in the data.\"}}]}},{id:\"bandit-b306-mktemp-q\",kind:\"code\",title:\"Bandit B306: Mktemp q\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use tempfile.mkstemp() or NamedTemporaryFile instead of tempfile.mktemp(); mktemp returns a name another process can claim before you create the file.\",scope
