h a capital letter and without underscores between words, as PEP 8 recommends.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"invalid-class-name\",violation:{message:\"Rename class `$NAME` to CapWords, such as `MyClass`, and update its references; keep the name if callers outside this code import it.\"}}]}},{id:\"ruff-n802-invalid-function-name\",kind:\"code\",title:\"Ruff N802: Invalid function name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name functions and methods in lowercase snake_case, as PEP 8 recommends, so they read differently from classes and constants.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-n803-invalid-argument-name\",kind:\"code\",title:\"Ruff N803: Invalid argument name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name function parameters in lowercase snake_case, as PEP 8 recommends, so they read differently from classes and constants.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-n804-invalid-first-argument-name-for-class-method\",kind:\"code\",title:\"Ruff N804: Invalid first argument name for class method\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name the first parameter of class methods cls, as PEP 8 recommends, so it reads as the class and not as an instance.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-n805-invalid-first-argument-name-for-method\",kind:\"code\",title:\"Ruff N805: Invalid first argument name for method\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use self as the name of the first parameter of instance methods, as PEP 8 recommends.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-n806-non-lowercase-variable-in-function\",kind:\"code\",title:\"Ruff N806: Non lowercase variable in function\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name local variables inside functions in lowercase snake_case, as PEP 8 recommends, so they read differently from classes and constants.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-n807-dunder-function-name\",kind:\"code\",title:\"Ruff N807: Dunder function name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Don't name a function with leading and trailing double underscores; that naming is reserved for Python's special methods.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"dunder-function-name\",violation:{message:\"Rename `$NAME` without the leading and trailing double underscores and update its callers; only a method of a class should use such a name.\"}}]}},{id:\"ruff-n811-constant-imported-as-non-constant\",kind:\"code\",title:\"Ruff N811: Constant imported as non constant\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Keep the alias of an imported constant in UPPER_CASE; a lowercase or CamelCase alias makes readers mistake the constant for a variable or class.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"constant-imported-as-non-constant\",violation:{message:\"Drop `as $ASNAME` or use an UPPER_CASE alias for the constant `$NAME`, and update its uses; keep the alias if `$NAME` is really a class.\"}}]}},{id:\"ruff-n812-lowercase-imported-as-non-lowercase\",kind:\"code\",title:\"Ruff N812: Lowercase imported as non lowercase\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Keep the alias of an imported lowercase name lowercase; an uppercase alias makes readers mistake a function or module for a class or constant.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"lowercase-imported-as-non-lowercase\",violation:{message:\"Use a lowercase alias instead of `$ASNAME` for `$NAME` and update its uses; leave it if `$NAME` is really a class or constant despite its lowercase name.\"}}]}},{id:\"ruff-n813-camelcase-imported-as-lowercase\",kind:\"code\",title:\"Ruff N813: Camelcase imported as lowercase\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Keep the alias of an imported CamelCase name in CamelCase; a lowercase alias makes readers mistake a class for a function or variable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"camelcase-imported-as-lowercase\",violation:{message:\"Use a CamelCase alias instead of `$ASNAME` for `$NAME` and update its uses; leave it if `$NAME` is really a function or variable despite its CamelCase name.\"}}]}},{id:\"ruff-n814-camelcase-imported-as-constant\",kind:\"code\",title:\"Ruff N814: Camelcase imported as constant\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Keep the alias of an imported CamelCase name in CamelCase; an UPPER_CASE alias makes readers mistake a class for a constant.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"camelcase-imported-as-constant\",violation:{message:\"Use a CamelCase alias instead of `$ASNAME` for `$NAME` and update its uses; leave it if `$NAME` is really a constant despite its CamelCase name.\"}}]}},{id:\"ruff-n815-mixed-case-variable-in-class-scope\",kind:\"code\",title:\"Ruff N815: Mixed case variable in class scope\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name class-level variables in snake_case instead of mixedCase, as PEP 8 recommends for variable names.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"mixed-case-variable-in-class-scope\",violation:{message:\"Rename the class variable `$NAME` to snake_case and update its uses; keep the name if outside code depends on it or it mirrors an external schema.\"}}]}},{id:\"ruff-n816-mixed-case-variable-in-global-scope\",kind:\"code\",title:\"Ruff N816: Mixed case variable in global scope\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name module-level variables in lowercase snake_case, not mixedCase, as PEP 8 recommends for variable names.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"mixed-case-variable-in-global-scope\",violation:{message:\"Rename `$NAME` to lowercase snake_case, such as `my_variable`, and update its uses; keep the name if other modules import it or it mirrors an external API.\"}}]}},{id:\"ruff-n817-camelcase-imported-as-acronym\",kind:\"code\",title:\"Ruff N817: Camelcase imported as acronym\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid aliasing a CamelCase import to an acronym of its capital letters; the alias reads like a constant and hides what the name is.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"camelcase-imported-as-acronym\",violation:{message:\"Import `$NAME` under its own name, or a descriptive CamelCase alias, instead of the acronym `$ASNAME`, and update its uses; keep the alias if your project's convention requires it.\"}}]}},{id:\"ruff-n818-error-suffix-on-exception-name\",kind:\"code\",title:\"Ruff N818: Error suffix on exception name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name custom exception classes with an Error suffix, as PEP 8 recommends, unless the exception does not signal an error.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"error-suffix-on-exception-name\",violation:{message:\"Rename the exception class `$NAME` to end in `Error`, e.g. `${NAME}Error` or swapping an `Exception` suffix for `Error`, and update references; keep it if it signals control flow, not an error.\"}}]}},{id:\"ruff-npy001-numpy-deprecated-type-alias\",kind:\"code\",title:\"Ruff NPY001: Numpy deprecated type alias\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the builtin int, float, complex, object or str instead of NumPy's removed aliases for them.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"numpy-unicode-alias\",violation:{message:\"Replace `$NAME`, NumPy's removed alias `numpy.unicode`, with the builtin `str` and drop its NumPy import.\"}}]}},{id:\"ruff-npy002-numpy-legacy-random\",kind:\"code\",title:\"Ruff NPY002: Numpy legacy random\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a NumPy random Generator instead of the legacy global-state functions in numpy.random.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-npy003-numpy-deprecated-function\",kind:\"code\",title:\"Ruff NPY003: Numpy deprecated function\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace deprecated NumPy functions with their current equivalents.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"numpy-round\",violation:{message:\"`$NAME` is deprecated; use `numpy.round` instead, which does the same.\"}}]}},{id:\"ruff-npy201-numpy2-deprecation\",kind:\"code\",title:\"Ruff NPY201: Numpy2 deprecation\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace NumPy members that NumPy 2.0 removes from the main namespace with their supported replacements.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pd002-pandas-use-of-inplace-argument\",kind:\"code\",title:\"Ruff PD002: Pandas use of inplace argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid passing True for the inplace argument of pandas methods; assign the returned object instead, which keeps chaining and avoids hidden mutation.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pd012-pandas-use-of-dot-read-table\",kind:\"code\",title:\"Ruff PD012: Pandas use of dot read table\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use pandas read_csv instead of read_table for comma-separated data; read_csv already defaults to a comma separator.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pandas-use-of-dot-read-table\",violation:{message:'Replace `read_table` with `read_csv` (import it if needed) and drop `sep=\",\"`; `read_csv` splits on commas by default and takes the same other arguments.'}}]}},{id:\"ruff-pd101-pandas-nunique-constant-series-check\",kind:\"code\",title:\"Ruff PD101: Pandas nunique constant series check\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid comparing nunique() with 1 to check whether a pandas Series is constant; compare its values with the first one instead, which stops at the first difference.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-perf101-unnecessary-list-cast\",kind:\"code\",title:\"Ruff PERF101: Unnecessary list cast\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Iterate over a list, tuple or set directly in a for loop instead of first copying it into a new list, unless the loop changes it; the copy only costs time.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-perf102-incorrect-dict-iterator\",kind:\"code\",title:\"Ruff PERF102: Incorrect dict iterator\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Iterate over a dict's keys or values instead of its items when a for loop uses only the key or only the value of each pair.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-perf203-try-except-in-loop\",kind:\"code\",title:\"Ruff PERF203: Try except in loop\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid wrapping each loop iteration in its own try-except before Python 3.11; move the loop into one try block or check the condition first.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"try-except-in-loop\",violation:{message:\"Move the whole loop into one try block, or check the failing condition before the call, so no handler is set up per iteration. Keep it if the loop must carry on after each failure.\"}}]}},{id:\"ruff-perf401-manual-list-comprehension\",kind:\"code\",title:\"Ruff PERF401: Manual list comprehension\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a list comprehension or extend instead of appending to a list inside a for loop; it is shorter and faster.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"manual-list-comprehension\",violation:{message:\"Replace this loop with a list comprehension; if `$L` is not a fresh empty list assigned just before the loop, use `$L.extend(...)` of a generator (of a list comprehension under `async for`).\"}}]}},{id:\"ruff-perf402-manual-list-copy\",kind:\"code\",title:\"Ruff PERF402: Manual list copy\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use list or extend to copy an iterable into a list instead of appending items one by one in a for loop.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"manual-list-copy\",violation:{message:\"Copy the iterable in one step: `$L.extend(\u003citerable>)`, or `$L = list(\u003citerable>)` if `$L` is a fresh empty list; keep the loop if code after it reads the loop variable.\"}}]}},{id:\"ruff-perf403-manual-dict-comprehension\",kind:\"code\",title:\"Ruff PERF403: Manual dict comprehension\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a dictionary comprehension or update instead of filling a dict key by key inside a for loop.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"manual-dict-comprehension\",violation:{message:\"Build the dict with a comprehension (`{k: v for ...}`); if `$L` is not a fresh empty dict assigned just before the loop, pass that comprehension to `$L.update(...)` instead.\"}}]}},{id:\"ruff-pgh003-blanket-type-ignore\",kind:\"code\",title:\"Ruff PGH003: Blanket type ignore\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Give type-ignore comments specific error codes instead of silencing every type error on the line; a blanket ignore hides new, unrelated problems.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"blanket-type-ignore\",violation:{message:\"Name the error in brackets after `ignore`, as in `# type: ignore[attr-defined]` or `# pyright: ignore[reportAttributeAccessIssue]`, so other errors on this line still surface.\"}}]}},{id:\"ruff-pgh004-blanket-noqa\",kind:\"code\",title:\"Ruff PGH004: Blanket noqa\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name specific rule codes in noqa comments instead of suppressing every check, and put a colon before the codes; a blanket noqa hides unrelated problems.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pgh005-invalid-mock-access\",kind:\"code\",title:\"Ruff PGH005: Invalid mock access\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Call mock assertion methods instead of only referencing them, and use their real assert-prefixed names; a bare attribute or an invented method name verifies nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"uncalled-mock-method\",violation:{message:\"Call `$METHOD(...)` with the expected arguments; written as a bare attribute it only reads the method and asserts nothing.\"}}]}},{id:\"ruff-pt001-pytest-fixture-incorrect-parentheses-style\",kind:\"code\",title:\"Ruff PT001: Pytest fixture incorrect parentheses style\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Drop the empty parentheses from an argument-free pytest fixture decorator, so fixtures follow the style of the pytest documentation.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"fixture-empty-parentheses\",violation:{message:\"Remove the empty parentheses: write the decorator as `@$F` instead of `@$F()`.\"}}]}},{id:\"ruff-pt002-pytest-fixture-positional-args\",kind:\"code\",title:\"Ruff PT002: Pytest fixture positional args\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass pytest fixture configuration such as scope or params as keyword arguments, not positionally, for clarity.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"fixture-positional-args\",violation:{message:\"Pass the arguments of `$F(...)` by keyword: positional ones map, in order, to `scope`, `params`, `autouse`, `ids` and `name`.\"}}]}},{id:\"ruff-pt003-pytest-extraneous-scope-function\",kind:\"code\",title:\"Ruff PT003: Pytest extraneous scope function\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove an explicit function scope from a pytest fixture decorator; function scope is already the default.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"extraneous-scope-function\",violation:{message:'Delete this `scope=\"function\"` argument from `$F(...)`, since function scope is the default; drop the parentheses too if no arguments remain.'}}]}},{id:\"ruff-pt006-pytest-parametrize-names-wrong-type\",kind:\"code\",title:\"Ruff PT006: Pytest parametrize names wrong type\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass pytest.mark.parametrize names as a tuple of strings, or a plain string for a single name, not a comma-separated string or a list.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pt007-pytest-parametrize-values-wrong-type\",kind:\"code\",title:\"Ruff PT007: Pytest parametrize values wrong type\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass pytest.mark.parametrize values as a list, and each row of several parameters as a tuple, not the other way round.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pt008-pytest-patch-with-lambda\",kind:\"code\",title:\"Ruff PT008: Pytest patch with lambda\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Patch with a fixed return value rather than a lambda that ignores its arguments; it states the intent and keeps call assertions available.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"patch-with-lambda\",violation:{message:\"Pass the lambda's result to `$F` as `return_value=` instead of a `lambda` that ignores its arguments; keep the lambda if its body must run on every call.\"}}]}},{id:\"ruff-pt009-pytest-unittest-assertion\",kind:\"code\",title:\"Ruff PT009: Pytest unittest assertion\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use plain assert statements instead of unittest-style assertion methods; pytest rewrites them to show detailed failure output.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unittest-assertion\",violation:{message:\"Use a plain `assert` (for example `assert a == b`) instead of `$NAME`; leave it if this is not a unittest assertion or the tests run under unittest only.\"}}]}},{id:\"ruff-pt010-pytest-raises-without-exception\",kind:\"code\",title:\"Ruff PT010: Pytest raises without exception\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Name the expected exception when using pytest.raises; a call with no exception, match or check fails at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"raises-without-exception\",violation:{message:\"Pass the exception class this block should raise as the first argument to `$F`; with no exception class, `match=` or `check=` the call fails when run.\"}}]}},{id:\"ruff-pt011-pytest-raises-too-broad\",kind:\"code\",title:\"Ruff PT011: Pytest raises too broad\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Constrain pytest.raises for broad exceptions such as ValueError or OSError with a message match or a more specific exception; otherwise unrelated errors also pass.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pt012-pytest-raises-with-multiple-statements\",kind:\"code\",title:\"Ruff PT012: Pytest raises with multiple statements\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Keep a pytest.raises block to a single simple statement; extra statements can raise the expected exception before the code under test runs, so the test passes for the wrong reason.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pt013-pytest-incorrect-pytest-import\",kind:\"code\",title:\"Ruff PT013: Pytest incorrect pytest import\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Import pytest as a plain module, without an alias or from-imports, and access its members through it; this keeps usage consistent across tests.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"import-as\",violation:{message:\"Drop the alias: write `import pytest` and use `pytest.xxx` (for example `pytest.mark`); keep the alias only if another name `pytest` in this file would clash.\"}}]}},{id:\"ruff-pt014-pytest-duplicate-parametrize-test-cases\",kind:\"code\",title:\"Ruff PT014: Pytest duplicate parametrize test cases\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove duplicate test cases from pytest parametrize values; a repeated case runs the same test twice and covers nothing new.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pytest-duplicate-parametrize-test-cases\",violation:{message:\"Remove this repeat of an earlier case in the parametrize values, or fix its values if it was meant to differ; keep it when the element is a call that yields a new object each time.\"}}]}},{id:\"ruff-pt015-pytest-assert-always-false\",kind:\"code\",title:\"Ruff PT015: Pytest assert always false\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use pytest.fail instead of an assert on a value that is always false; it states the intent to fail the test more clearly.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pytest-assert-always-false\",violation:{message:\"Replace this always-failing `assert` with `pytest.fail(...)`, passing any assertion message to it; leave it alone outside pytest tests.\"}}]}},{id:\"ruff-pt016-pytest-fail-without-message\",kind:\"code\",title:\"Ruff PT016: Pytest fail without message\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass a non-empty message to pytest.fail calls; a bare failure gives no hint why the test failed.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pt017-pytest-assert-in-except\",kind:\"code\",title:\"Ruff PT017: Pytest assert in except\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Assert on an exception with pytest.raises instead of inside an except block; the test silently passes when nothing is raised.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pytest-assert-in-except\",violation:{message:\"Move this assert out of the `except`: wrap the raising call in `with pytest.raises(...) as exc_info:` and assert on `exc_info.value` instead of `$N`; leave non-test code alone.\"}}]}},{id:\"ruff-pt018-pytest-composite-assertion\",kind:\"code\",title:\"Ruff PT018: Pytest composite assertion\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Split an assert that joins conditions with and, or negates conditions joined with or, into one assert per condition; a failure then names the one that failed.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pytest-composite-assertion\",violation:{message:\"Break this assertion into one `assert` per condition so a failure shows which one failed; for `not (a or b)`, write `assert not a` and `assert not b`.\"}}]}},{id:\"ruff-pt019-pytest-fixture-param-without-value\",kind:\"code\",title:\"Ruff PT019: Pytest fixture param without value\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Activate fixtures a test does not read with the usefixtures mark instead of declaring underscore-prefixed parameters for them.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"fixture-param-without-value\",violation:{message:'If the test never reads `$N`, remove the parameter and add `@pytest.mark.usefixtures(\"$N\")` to the test; if it reads the value, leave it as is.'}}]}},{id:\"ruff-pt020-pytest-deprecated-yield-fixture\",kind:\"code\",title:\"Ruff PT020: Pytest deprecated yield fixture\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the pytest fixture decorator instead of the deprecated yield_fixture alias; fixtures can already yield, so the rename changes nothing else.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"deprecated-yield-fixture\",violation:{message:\"Replace `yield_fixture` with `fixture` (`pytest.fixture`, or `fixture` imported from pytest); it is a deprecated alias of the same function, so nothing else changes.\"}}]}},{id:\"ruff-pt021-pytest-fixture-finalizer-callback\",kind:\"code\",title:\"Ruff PT021: Pytest fixture finalizer callback\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Prefer a yield with the cleanup after it over a finalizer callback in a pytest fixture; reserve the callback for fixtures that build resources on demand.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"fixture-finalizer-callback\",violation:{message:\"Return the fixture value with `yield` and move this cleanup, and any other registered finalizer, after it. Keep the callback if cleanup must run even when later setup code raises.\"}}]}},{id:\"ruff-pt022-pytest-useless-yield-fixture\",kind:\"code\",title:\"Ruff PT022: Pytest useless yield fixture\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use return instead of yield in a pytest fixture that has no teardown code after its only yield; a plain return is simpler.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"fixture-yield-without-teardown\",violation:{message:\"Nothing runs after this `yield`: use `return`, and annotate the value type instead of `Generator[T, ...]` or `Iterator[T]`. Keep `yield` if a local object (temp dir, open file) must stay alive.\"}}]}},{id:\"ruff-pt023-pytest-incorrect-mark-parentheses-style\",kind:\"code\",title:\"Ruff PT023: Pytest incorrect mark parentheses style\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Write pytest markers that take no arguments without empty parentheses, so every marker decorator follows one consistent style.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"mark-with-empty-parentheses\",violation:{message:\"Remove the empty `()` after this `pytest.mark` decorator; a marker without arguments is written bare. Keep any comments that sat inside the parentheses.\"}}]}},{id:\"ruff-pt024-pytest-unnecessary-asyncio-mark-on-fixture\",kind:\"code\",title:\"Ruff PT024: Pytest unnecessary asyncio mark on fixture\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Don't apply the pytest asyncio marker to a fixture; marks have no effect on fixtures.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"asyncio-mark-on-fixture\",violation:{message:\"Remove this `pytest.mark.asyncio` decorator; marks have no effect on fixtures. If an async fixture needs pytest-asyncio strict mode, use `@pytest_asyncio.fixture` instead.\"}}]}},{id:\"ruff-pt025-pytest-erroneous-use-fixtures-on-fixture\",kind:\"code\",title:\"Ruff PT025: Pytest erroneous use fixtures on fixture\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't apply a pytest usefixtures marker to a fixture function; it has no effect there, so request other fixtures as parameters instead.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"usefixtures-on-fixture\",violation:{message:\"Remove this `usefixtures` mark; it has no effect on a fixture. To make the fixture depend on other fixtures, list them as parameters of the fixture function.\"}}]}},{id:\"ruff-pt026-pytest-use-fixtures-without-parameters\",kind:\"code\",title:\"Ruff PT026: Pytest use fixtures without parameters\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove usefixtures markers that name no fixtures, or pass them the fixtures to apply; a marker without arguments does nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"usefixtures-without-fixtures\",violation:{message:\"Remove this `usefixtures` decorator, or pass it the names of the fixtures to apply; without arguments it does nothing.\"}}]}},{id:\"ruff-pt027-pytest-unittest-raises-assertion\",kind:\"code\",title:\"Ruff PT027: Pytest unittest raises assertion\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use pytest.raises instead of assertRaises-style methods such as assertRaises and assertRaisesRegex; it is the exception-testing style pytest recommends.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pytest-unittest-raises-assertion\",violation:{message:\"Use `pytest.raises` instead of `$ASSERTION`: a regex goes in `match=` and an `as` target's `.exception` becomes `.value`. Leave it in tests that don't run under pytest.\"}}]}},{id:\"ruff-pt028-pytest-parameter-with-default-argument\",kind:\"code\",title:\"Ruff PT028: Pytest parameter with default argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Don't give pytest test function parameters default values; the default always wins, so a fixture of the same name is never injected.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"test-parameter-default\",violation:{message:\"Remove this default: pytest never fills a parameter that has a default from a fixture or parametrize. Set fixed values in the test body, or keep it if pytest does not collect this function.\"}}]}},{id:\"ruff-pt030-pytest-warns-too-broad\",kind:\"code\",title:\"Ruff PT030: Pytest warns too broad\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass a match pattern to pytest.warns for Warning, UserWarning or DeprecationWarning, or expect a more specific warning; a generic warning also catches unrelated ones.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pt031-pytest-warns-with-multiple-statements\",kind:\"code\",title:\"Ruff PT031: Pytest warns with multiple statements\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep a pytest.warns block to a single simple statement; extra statements can raise the expected warning themselves and hide a failure in the call under test.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth100-os-path-abspath\",kind:\"code\",title:\"Ruff PTH100: Os path abspath\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.resolve() instead of os.path.abspath(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-abspath\",violation:{message:\"Use `Path($S).resolve()` instead of `os.path.abspath($S)`; it follows symlinks and returns a `Path`, so leave it where unresolved symlinks, a string result or a bytes path is needed.\"}}]}},{id:\"ruff-pth101-os-chmod\",kind:\"code\",title:\"Ruff PTH101: Os chmod\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.chmod() instead of os.chmod(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-chmod\",violation:{message:\"Use `Path(path).chmod(mode)` instead of `os.chmod(path, mode)`; leave it where the path is a file descriptor or bytes, or `dir_fd` comes through `**kwargs`.\"}}]}},{id:\"ruff-pth102-os-mkdir\",kind:\"code\",title:\"Ruff PTH102: Os mkdir\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.mkdir() instead of os.mkdir(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-mkdir\",violation:{message:\"Use `Path(path).mkdir(mode=mode)` instead of `os.mkdir(path, mode)`; leave it where the path is bytes or `dir_fd` comes through `**kwargs`.\"}}]}},{id:\"ruff-pth103-os-makedirs\",kind:\"code\",title:\"Ruff PTH103: Os makedirs\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.mkdir(parents=True) instead of os.makedirs(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-makedirs\",violation:{message:\"Use `Path(name).mkdir(parents=True)` instead of `os.makedirs(name)`, passing `mode`, `exist_ok` and any `parent_mode` on to `mkdir`; leave it where the path is bytes.\"}}]}},{id:\"ruff-pth104-os-rename\",kind:\"code\",title:\"Ruff PTH104: Os rename\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.rename() instead of os.rename(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-rename\",violation:{message:\"Use `Path(src).rename(dst)` instead of `os.rename(src, dst)`; leave it where the paths are bytes or `src_dir_fd`/`dst_dir_fd` come through `**kwargs`.\"}}]}},{id:\"ruff-pth105-os-replace\",kind:\"code\",title:\"Ruff PTH105: Os replace\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.replace() instead of os.replace(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-replace\",violation:{message:\"Use `Path(src).replace(dst)` instead of `os.replace(src, dst)`; leave it where the paths are bytes or `src_dir_fd`/`dst_dir_fd` come through `**kwargs`.\"}}]}},{id:\"ruff-pth106-os-rmdir\",kind:\"code\",title:\"Ruff PTH106: Os rmdir\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.rmdir() instead of os.rmdir(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-rmdir\",violation:{message:\"Use `Path($S).rmdir()` from pathlib instead of `os.rmdir($S)`; leave it where the argument is a bytes path.\"}}]}},{id:\"ruff-pth107-os-remove\",kind:\"code\",title:\"Ruff PTH107: Os remove\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.unlink() instead of os.remove(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-remove\",violation:{message:\"Use `Path($S).unlink()` from pathlib instead of `os.remove($S)`; leave it where the argument is a bytes path.\"}}]}},{id:\"ruff-pth108-os-unlink\",kind:\"code\",title:\"Ruff PTH108: Os unlink\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.unlink() instead of os.unlink(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-unlink\",violation:{message:\"Use `Path($S).unlink()` from pathlib instead of `os.unlink($S)`; leave it where the argument is a bytes path.\"}}]}},{id:\"ruff-pth109-os-getcwd\",kind:\"code\",title:\"Ruff PTH109: Os getcwd\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.cwd() instead of os.getcwd() or os.getcwdb(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-getcwd\",violation:{message:\"Use `Path.cwd()` from pathlib instead of `os.getcwd()`; it returns a `Path`, so wrap it in `str()` or adjust the code where a string is required.\"}}]}},{id:\"ruff-pth110-os-path-exists\",kind:\"code\",title:\"Ruff PTH110: Os path exists\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.exists() instead of os.path.exists(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-exists\",violation:{message:\"Use `Path($S).exists()` from pathlib instead of `os.path.exists($S)`; leave it for bytes paths, file descriptors, or a value that can be an empty string (`Path('')` is `.`).\"}}]}},{id:\"ruff-pth111-os-path-expanduser\",kind:\"code\",title:\"Ruff PTH111: Os path expanduser\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.expanduser() instead of os.path.expanduser(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-expanduser\",violation:{message:\"Use `Path($S).expanduser()` from pathlib instead of `os.path.expanduser($S)`; it returns a `Path` and raises `RuntimeError` if the home can't be resolved; leave bytes paths alone.\"}}]}},{id:\"ruff-pth112-os-path-isdir\",kind:\"code\",title:\"Ruff PTH112: Os path isdir\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.is_dir() instead of os.path.isdir(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-isdir\",violation:{message:\"Use `Path($S).is_dir()` from pathlib instead of `os.path.isdir($S)`; leave it where the argument is a bytes path or a file descriptor.\"}}]}},{id:\"ruff-pth113-os-path-isfile\",kind:\"code\",title:\"Ruff PTH113: Os path isfile\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.is_file() instead of os.path.isfile(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-isfile\",violation:{message:\"Use `Path($S).is_file()` from pathlib instead of `os.path.isfile($S)`; leave it where the argument is a bytes path or a file descriptor.\"}}]}},{id:\"ruff-pth114-os-path-islink\",kind:\"code\",title:\"Ruff PTH114: Os path islink\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.is_symlink() instead of os.path.islink(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-islink\",violation:{message:\"Use `Path($S).is_symlink()` from pathlib instead of `os.path.islink($S)`; leave it where the argument is a bytes path.\"}}]}},{id:\"ruff-pth115-os-readlink\",kind:\"code\",title:\"Ruff PTH115: Os readlink\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.readlink() instead of os.readlink(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-readlink\",violation:{message:\"Use `Path($S).readlink()` from pathlib instead of `os.readlink($S)`; it returns a `Path`, not a string, so adjust code that uses the result, and leave bytes paths alone.\"}}]}},{id:\"ruff-pth116-os-stat\",kind:\"code\",title:\"Ruff PTH116: Os stat\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.stat(), Path.owner() or Path.group() instead of os.stat(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-stat\",violation:{message:\"Use `Path($S).stat()` instead of `os.stat($S)`, keeping any `follow_symlinks` argument, or `.owner()`/`.group()` for owner or group names; leave bytes paths and file descriptors alone.\"}}]}},{id:\"ruff-pth117-os-path-isabs\",kind:\"code\",title:\"Ruff PTH117: Os path isabs\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.is_absolute() instead of os.path.isabs(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-isabs\",violation:{message:\"Use `Path($S).is_absolute()` from pathlib instead of `os.path.isabs($S)`; leave it where the argument is a bytes path.\"}}]}},{id:\"ruff-pth118-os-path-join\",kind:\"code\",title:\"Ruff PTH118: Os path join\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path objects with the slash operator or joinpath instead of os.path.join or os.sep.join; pathlib reads better than joining path strings.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-join\",violation:{message:\"Build the path with `Path(first) / second` instead of `os.path.join(first, second)`; wrap it in `str()` where a string is needed. Leave it for bytes paths, which `Path` rejects.\"}}]}},{id:\"ruff-pth119-os-path-basename\",kind:\"code\",title:\"Ruff PTH119: Os path basename\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the name property of a Path object instead of os.path.basename; pathlib reads better than string-based os.path functions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-basename\",violation:{message:\"Use `Path(...).name` instead of `os.path.basename(...)`. Path normalizes the path first (trailing slashes, `.`) and rejects bytes, so keep `basename` where the exact result matters.\"}}]}},{id:\"ruff-pth120-os-path-dirname\",kind:\"code\",title:\"Ruff PTH120: Os path dirname\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the parent property of a Path object instead of os.path.dirname; pathlib reads better than string-based os.path functions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-dirname\",violation:{message:\"Use `Path(...).parent` instead of `os.path.dirname(...)`. It returns a `Path`, not a `str`, and normalizes the path; keep `dirname` where the exact string matters or the path is bytes.\"}}]}},{id:\"ruff-pth121-os-path-samefile\",kind:\"code\",title:\"Ruff PTH121: Os path samefile\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the samefile method of a Path object instead of os.path.samefile; pathlib reads better than string-based os.path functions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-samefile\",violation:{message:\"Use `Path(first).samefile(second)` instead of `os.path.samefile(first, second)`; leave it for bytes paths, which `Path` rejects.\"}}]}},{id:\"ruff-pth122-os-path-splitext\",kind:\"code\",title:\"Ruff PTH122: Os path splitext\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the suffix, stem and parent properties of a Path object instead of os.path.splitext; pathlib reads better than string-based os.path functions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-path-splitext\",violation:{message:\"Use `Path(...)` with `.suffix`, `.stem` and `.parent` instead of `os.path.splitext(...)`: the root is `p.parent / p.stem`, the extension `p.suffix`. Leave it for bytes paths, which `Path` rejects.\"}}]}},{id:\"ruff-pth123-builtin-open\",kind:\"code\",title:\"Ruff PTH123: Builtin open\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the open method of a Path object instead of the open builtin; pathlib reads better than passing path strings around.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"builtin-open\",violation:{message:\"Use `Path(file).open(...)` instead of `open(file, ...)`; the other arguments carry over. Leave `open()` when the argument is a file descriptor, or when it needs `closefd=False` or an `opener`.\"}}]}},{id:\"ruff-pth124-py-path\",kind:\"code\",title:\"Ruff PTH124: Py path\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use pathlib instead of py.path.local; the py library's path API is in maintenance mode.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth201-path-constructor-current-directory\",kind:\"code\",title:\"Ruff PTH201: Path constructor current directory\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Call Path() without arguments instead of passing the current directory explicitly; the constructor already defaults to it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth202-os-path-getsize\",kind:\"code\",title:\"Ruff PTH202: Os path getsize\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.stat().st_size instead of os.path.getsize(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth203-os-path-getatime\",kind:\"code\",title:\"Ruff PTH203: Os path getatime\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.stat().st_atime instead of os.path.getatime(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth204-os-path-getmtime\",kind:\"code\",title:\"Ruff PTH204: Os path getmtime\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.stat().st_mtime instead of os.path.getmtime(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth205-os-path-getctime\",kind:\"code\",title:\"Ruff PTH205: Os path getctime\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.stat().st_ctime instead of os.path.getctime(); path objects read better than string-based os.path calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth206-os-sep-split\",kind:\"code\",title:\"Ruff PTH206: Os sep split\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.parts instead of splitting a path string on os.sep; path objects read better than string-based path handling.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-sep-split\",violation:{message:\"Use `Path(...).parts` instead of `.split(os.sep)` for the path components (`.name` or `.parent` for just the last or parent one); leave it where empty segments or non-path text matter.\"}}]}},{id:\"ruff-pth207-glob\",kind:\"code\",title:\"Ruff PTH207: Glob\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.glob() or Path.rglob() instead of glob.glob() and glob.iglob(); path objects read better than string-based glob calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"glob-glob\",violation:{message:\"Use `Path(root).glob(pattern)` (or `rglob`) instead of `glob.glob(...)`; it lazily yields `Path` objects and includes hidden files, so wrap it in `list(...)` where a list is needed.\"}}]}},{id:\"ruff-pth208-os-listdir\",kind:\"code\",title:\"Ruff PTH208: Os listdir\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.iterdir() instead of os.listdir(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth210-invalid-pathlib-with-suffix\",kind:\"code\",title:\"Ruff PTH210: Invalid pathlib with suffix\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a suffix that starts with a dot to Path.with_suffix(); a suffix without one raises an error at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pth211-os-symlink\",kind:\"code\",title:\"Ruff PTH211: Os symlink\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use Path.symlink_to() instead of os.symlink(); path objects read better than string-based os calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"os-symlink\",violation:{message:\"Use `Path(dst).symlink_to(src)` instead of `os.symlink(src, dst)`, passing `target_is_directory` through; leave it where the paths are bytes.\"}}]}},{id:\"ruff-pyi001-unprefixed-type-param\",kind:\"code\",title:\"Ruff PYI001: Unprefixed type param\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Start the names of TypeVar, ParamSpec and TypeVarTuple variables in stub files with an underscore, so the stub does not export them.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi002-complex-if-statement-in-stub\",kind:\"code\",title:\"Ruff PYI002: Complex if statement in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use only simple comparisons of sys.version_info or sys.platform as if tests in stub files; type checkers cannot evaluate other conditions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi003-unrecognized-version-info-check\",kind:\"code\",title:\"Ruff PYI003: Unrecognized version info check\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info in stub files only against tuples of integers, or its major version against an integer; type checkers do not understand other forms.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi004-patch-version-comparison\",kind:\"code\",title:\"Ruff PYI004: Patch version comparison\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info in a stub file against major and minor versions only; type checkers do not understand patch versions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi005-wrong-tuple-length-version-comparison\",kind:\"code\",title:\"Ruff PYI005: Wrong tuple length version comparison\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare a sys.version_info slice only with a tuple of the same length in stub files; a tuple of another length is never equal.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi006-bad-version-info-comparison\",kind:\"code\",title:\"Ruff PYI006: Bad version info comparison\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info with only the less-than or greater-than-or-equal operators; the other operators give surprising results on patch releases.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi007-unrecognized-platform-check\",kind:\"code\",title:\"Ruff PYI007: Unrecognized platform check\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.platform only by equality or inequality with a plain string literal in stub files; type checkers cannot evaluate other checks.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi008-unrecognized-platform-name\",kind:\"code\",title:\"Ruff PYI008: Unrecognized platform name\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.platform only against linux, win32, cygwin or darwin in stub files; other names are likely typos that type checkers don't recognize.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi009-pass-statement-stub-body\",kind:\"code\",title:\"Ruff PYI009: Pass statement stub body\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use an ellipsis instead of pass as the whole body of a function or class in stub files; stubs only declare types and are never executed.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pass-statement-stub-body\",violation:{message:\"Replace this `pass` with `...`; stub bodies are never executed, so the empty body is written as an ellipsis.\"}}]}},{id:\"ruff-pyi010-non-empty-stub-body\",kind:\"code\",title:\"Ruff PYI010: Non empty stub body\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use an ellipsis as the whole body of a function in stub files instead of real statements; stubs are never executed, so bodies are redundant.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi011-typed-argument-default-in-stub\",kind:\"code\",title:\"Ruff PYI011: Typed argument default in stub\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use an ellipsis for annotated parameter defaults in stub files unless the default is a simple literal; type checkers ignore the value.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"typed-argument-default-in-stub\",violation:{message:\"Replace this default with `...`; type checkers ignore defaults in stubs, and only simple literals and short containers are worth keeping.\"}}]}},{id:\"ruff-pyi012-pass-in-class-body\",kind:\"code\",title:\"Ruff PYI012: Pass in class body\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove pass statements from class bodies in stub files that already contain other statements; they do nothing there.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pass-in-class-body\",violation:{message:\"Delete this `pass`; the class body already has other statements, so it is redundant in a stub.\"}}]}},{id:\"ruff-pyi013-ellipsis-in-non-empty-class-body\",kind:\"code\",title:\"Ruff PYI013: Ellipsis in non empty class body\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove an ellipsis statement from a class body that has other statements; it is only needed when the body would otherwise be empty.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"ellipsis-in-non-empty-class-body\",violation:{message:\"Remove this `...` from the class body; it is redundant because the body has other statements.\"}}]}},{id:\"ruff-pyi014-argument-default-in-stub\",kind:\"code\",title:\"Ruff PYI014: Argument default in stub\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace complex default values of untyped parameters in stub files with an ellipsis; only simple literal defaults belong in a stub.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"argument-default-in-stub\",violation:{message:\"Replace this default value with `...`; a stub only needs to show that the parameter has a default, and keeps literal values only when they are simple.\"}}]}},{id:\"ruff-pyi015-assignment-default-in-stub\",kind:\"code\",title:\"Ruff PYI015: Assignment default in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Replace complex assigned values in stub files with an ellipsis; only simple literal values belong in a stub.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"assignment-default-in-stub\",violation:{message:\"Replace this assigned value with `...`; a stub only needs to show that the name has a value, and keeps literal values only when they are simple.\"}}]}},{id:\"ruff-pyi017-complex-assignment-in-stub\",kind:\"code\",title:\"Ruff PYI017: Complex assignment in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Declare each name in a stub file with its own simple assignment instead of chained, unpacking, attribute or item assignments; a stub only declares names.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi018-unused-private-type-var\",kind:\"code\",title:\"Ruff PYI018: Unused private type var\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove private type variables that are never used, or use them; an unused underscore-prefixed type variable is likely a mistake.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi019-custom-type-var-for-self\",kind:\"code\",title:\"Ruff PYI019: Custom type var for self\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use Self instead of a custom type variable to annotate the instance or class a method works on; Self is shorter and needs no type variable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi020-quoted-annotation-in-stub\",kind:\"code\",title:\"Ruff PYI020: Quoted annotation in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write type annotations in stub files without quotes; stubs resolve forward references natively, so quotes are never needed.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"quoted-annotation-in-stub\",violation:{message:\"Remove the quotes from this annotation and write the type directly; a stub resolves forward references, so quoting adds nothing.\"}}]}},{id:\"ruff-pyi021-docstring-in-stub\",kind:\"code\",title:\"Ruff PYI021: Docstring in stub\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove docstrings from stub files; stubs exist to carry type information, not documentation.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"docstring-in-stub\",violation:{message:\"Remove this docstring from the stub; if it is the only statement in the body, replace it with `...`. Keep it if this stub package ships docstrings on purpose.\"}}]}},{id:\"ruff-pyi024-collections-named-tuple\",kind:\"code\",title:\"Ruff PYI024: Collections named tuple\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use typing.NamedTuple instead of collections.namedtuple; it lets each field carry a type annotation that type checkers can analyze.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"collections-named-tuple\",violation:{message:\"Replace `collections.namedtuple` with a class inheriting `typing.NamedTuple` that annotates each field; keep it where field names are built at runtime or `rename=True` is needed.\"}}]}},{id:\"ruff-pyi025-unaliased-collections-abc-set-import\",kind:\"code\",title:\"Ruff PYI025: Unaliased collections abc set import\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Import Set from collections.abc under the alias AbstractSet; the bare name is easily mistaken for the builtin set.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unaliased-collections-abc-set-import\",violation:{message:\"Import `Set` as `AbstractSet` and rename its uses, so it isn't mistaken for the builtin `set`; keep the name if other modules import `Set` from this file.\"}}]}},{id:\"ruff-pyi026-type-alias-without-annotation\",kind:\"code\",title:\"Ruff PYI026: Type alias without annotation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Annotate type alias assignments in stub files with TypeAlias; it marks the line as an alias declaration instead of an ordinary variable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"type-alias-without-annotation\",violation:{message:\"Annotate `$NAME` as `$NAME: TypeAlias = ...`, importing `TypeAlias` from `typing` (`typing_extensions` before 3.10). Leave it unannotated only if it is a variable, not a type alias.\"}}]}},{id:\"ruff-pyi029-str-or-repr-defined-in-stub\",kind:\"code\",title:\"Ruff PYI029: Str or repr defined in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove redundant __str__ and __repr__ definitions from stub files; their signatures match the defaults every class inherits, so they add nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"str-or-repr-defined-in-stub\",violation:{message:\"Remove this `$NAME` definition from the stub; a `$NAME` returning `str` is inherited from `object`, so declaring it is almost always redundant.\"}}]}},{id:\"ruff-pyi030-unnecessary-literal-union\",kind:\"code\",title:\"Ruff PYI030: Unnecessary literal union\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Merge the Literal members of a union into a single Literal listing all the values; it means the same thing and is shorter.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-literal-union\",violation:{message:\"Merge the `Literal[...]` members of this union into one `Literal[...]`, keeping the other members, e.g. `Literal[1, 2] | str`; leave it alone if fewer than two members are `Literal[...]`.\"}}]}},{id:\"ruff-pyi032-any-eq-ne-annotation\",kind:\"code\",title:\"Ruff PYI032: Any eq ne annotation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use object instead of Any to annotate the other operand of equality and inequality methods; object accepts every value while keeping type checking on.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"any-eq-ne-annotation\",violation:{message:\"Annotate the other operand of this `__eq__` or `__ne__` as `object` instead of `Any`; `==` and `!=` must accept any value, and `Any` turns type checking off.\"}}]}},{id:\"ruff-pyi033-legacy-type-comment\",kind:\"code\",title:\"Ruff PYI033: Legacy type comment\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use inline annotations instead of type comments in stub files; type comments are deprecated and never needed in stubs.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"legacy-type-comment\",violation:{message:\"Replace this type comment with an inline annotation, such as `x: int = 1` or a per-parameter annotation; stubs never need type comments. Leave `type: ignore` comments alone.\"}}]}},{id:\"ruff-pyi034-non-self-return-type\",kind:\"code\",title:\"Ruff PYI034: Non self return type\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Annotate methods that return their own instance, such as in-place operators, context-manager entry and an iterator's iter method, with Self instead of the class or a broad iterator type.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi035-unassigned-special-variable-in-stub\",kind:\"code\",title:\"Ruff PYI035: Unassigned special variable in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Assign a value to the module-level exports list and the class slot and match-argument lists in stub files; they mean the same there as at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unassigned-dunder-all\",violation:{message:'Give `__all__` a value in this stub, such as `__all__: list[str] = [\"name\", ...]` listing the public names; it has the same meaning as at runtime.'}}]}},{id:\"ruff-pyi036-bad-exit-annotation\",kind:\"code\",title:\"Ruff PYI036: Bad exit annotation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Declare exit and aexit methods with the three standard arguments or star-args, annotated as object or as the exception type, exception and traceback each unioned with None.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi041-redundant-numeric-union\",kind:\"code\",title:\"Ruff PYI041: Redundant numeric union\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't combine int, float and complex in a parameter annotation union; a float parameter already accepts ints and a complex parameter accepts both.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi042-snake-case-type-alias\",kind:\"code\",title:\"Ruff PYI042: Snake case type alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Name type aliases in CamelCase so they read as types and are not mistaken for ordinary variables.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"snake-case-type-alias\",violation:{message:\"Rename type alias `$NAME` to CamelCase, e.g. `MyAlias`, and update every reference; leave it if the lowercase name mirrors a runtime name that other code imports.\"}}]}},{id:\"ruff-pyi043-t-suffixed-type-alias\",kind:\"code\",title:\"Ruff PYI043: T suffixed type alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't end a private type alias name with a T suffix; that suffix is the convention for type variables, so it misleads readers.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"t-suffixed-type-alias\",violation:{message:\"Rename private type alias `$NAME` so it no longer ends in `T` (or `T` plus a digit), e.g. by dropping the `T`, and update its references; that suffix conventionally marks a type variable.\"}}]}},{id:\"ruff-pyi044-future-annotations-in-stub\",kind:\"code\",title:\"Ruff PYI044: Future annotations in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove the future annotations import from stub files; stubs are never executed and already treat annotations as forward references.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"future-annotations-import\",violation:{message:\"Delete `annotations` from this `__future__` import (and the whole line if nothing else is imported); stubs already treat annotations as forward references.\"}}]}},{id:\"ruff-pyi045-iter-method-return-iterable\",kind:\"code\",title:\"Ruff PYI045: Iter method return iterable\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Annotate __iter__ as returning an Iterator and __aiter__ as returning an AsyncIterator, never the Iterable forms; callers must be able to advance the result.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"iter-returns-iterable\",violation:{message:\"Annotate `__iter__` as returning `Iterator` (from `collections.abc`) instead of `Iterable`; if the body returns a list or similar, return `iter(...)` of it.\"}}]}},{id:\"ruff-pyi046-unused-private-protocol\",kind:\"code\",title:\"Ruff PYI046: Unused private protocol\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use, make public or remove a private Protocol class that nothing in its file references; an unused private protocol is likely a mistake.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi047-unused-private-type-alias\",kind:\"code\",title:\"Ruff PYI047: Unused private type alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use, make public or remove a private type alias that nothing in its file references; an unused private alias is likely a mistake.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi048-stub-body-multiple-statements\",kind:\"code\",title:\"Ruff PYI048: Stub body multiple statements\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Give each function in a stub file a body of exactly one statement such as an ellipsis; stubs only declare types and are never executed.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"stub-body-multiple-statements\",violation:{message:\"Reduce this stub function's body to a single statement, normally `...`; stub files only declare types and are never executed.\"}}]}},{id:\"ruff-pyi049-unused-private-typed-dict\",kind:\"code\",title:\"Ruff PYI049: Unused private typed dict\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use, make public or remove a private TypedDict that nothing in its file references; an unused private TypedDict is likely a mistake.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi050-no-return-argument-annotation-in-stub\",kind:\"code\",title:\"Ruff PYI050: No return argument annotation in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use Never instead of NoReturn for parameter annotations in stub files; NoReturn describes a function that never returns, which makes little sense for a parameter.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"no-return-argument-annotation\",violation:{message:\"Annotate this parameter as `Never` instead of `NoReturn`, importing it from `typing_extensions` (or `typing` on Python 3.11+); the two are equivalent for type checkers.\"}}]}},{id:\"ruff-pyi051-redundant-literal-union\",kind:\"code\",title:\"Ruff PYI051: Redundant literal union\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Don't list a literal value in a union that already includes its builtin type; the broader type already covers every value of the literal.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"redundant-literal-union\",violation:{message:\"Drop `$E` from this `Literal`: the union already includes `$B`, which covers it. Remove the whole `Literal` if no values are left.\"}}]}},{id:\"ruff-pyi052-unannotated-assignment-in-stub\",kind:\"code\",title:\"Ruff PYI052: Unannotated assignment in stub\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Annotate simple assignments in stub files with their type; a stub declares types, so a bare assignment of a literal or small container should carry an explicit annotation.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unannotated-assignment-in-stub\",violation:{message:\"Add a type annotation to `$NAME` (`$NAME: \u003ctype> = ...`); stubs should declare the type rather than leave it to be inferred from the assigned value.\"}}]}},{id:\"ruff-pyi053-string-or-bytes-too-long\",kind:\"code\",title:\"Ruff PYI053: String or bytes too long\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace string and bytes literals longer than 50 characters in stub files with an ellipsis; type checkers ignore default values, so a literal that long is an implementation detail.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"string-or-bytes-too-long\",violation:{message:\"Replace this literal with `...`: it is longer than 50 characters, and a stub only needs the type, so the full value is an implementation detail.\"}}]}},{id:\"ruff-pyi054-numeric-literal-too-long\",kind:\"code\",title:\"Ruff PYI054: Numeric literal too long\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace long numeric literals in stub files with an ellipsis; a value that long is an implementation detail or varies by system.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"numeric-literal-too-long\",violation:{message:\"Replace this long numeric literal with `...` in the stub; the exact value is an implementation detail that stubs should not pin.\"}}]}},{id:\"ruff-pyi055-unnecessary-type-union\",kind:\"code\",title:\"Ruff PYI055: Unnecessary type union\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Combine several type-of-class members of a union into one type over the union of those classes; the meaning is unchanged and the annotation is shorter.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"define-union-helpers\"}]}},{id:\"ruff-pyi056-unsupported-method-call-on-all\",kind:\"code\",title:\"Ruff PYI056: Unsupported method call on all\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use += to add names to the module's export list instead of calling append, extend or remove on it; type checkers do not all support those method calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"add-to-all\",violation:{message:\"Add names with `__all__ += [...]` instead of calling `.append()` or `.extend()` on `__all__`; type checkers support `+=` reliably but not every method call.\"}}]}},{id:\"ruff-pyi057-byte-string-usage\",kind:\"code\",title:\"Ruff PYI057: Byte string usage\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid ByteString from typing and collections.abc; it is deprecated and unclear, so use Buffer or a union of bytes types instead.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"byte-string-attribute\",violation:{message:\"Use `collections.abc.Buffer` (`typing_extensions.Buffer` before Python 3.12) or `bytes | bytearray | memoryview` instead of `ByteString`; it is deprecated and has unclear semantics.\"}}]}},{id:\"ruff-pyi058-generator-return-from-iter-method\",kind:\"code\",title:\"Ruff PYI058: Generator return from iter method\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Annotate a simple iteration method as returning an iterator, not a generator; the kind of iterator it returns is an implementation detail.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi059-generic-not-last-base-class\",kind:\"code\",title:\"Ruff PYI059: Generic not last base class\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Put Generic last in a class's list of base classes; earlier in the list it can give the class an unexpected method resolution order.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"generic-not-last-base-class\",violation:{message:\"Move `Generic[...]` after the other positional base classes, keeping keyword arguments last; this changes the method resolution order, so check nothing relied on the old one.\"}}]}},{id:\"ruff-pyi061-redundant-none-literal\",kind:\"code\",title:\"Ruff PYI061: Redundant none literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write None as plain None or in a union with None, not inside a Literal type; the meaning is the same and the union reads more clearly.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi062-duplicate-literal-member\",kind:\"code\",title:\"Ruff PYI062: Duplicate literal member\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove duplicate members from a Literal type; repeating a value adds nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi063-pep484-style-positional-only-parameter\",kind:\"code\",title:\"Ruff PYI063: Pep484 style positional only parameter\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Mark positional-only parameters with a slash in the signature instead of a double-underscore name prefix; the slash is enforced at runtime, the prefix only by type checkers.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pep484-style-positional-only-parameter\",violation:{message:\"Drop the `__` prefix from `$NAME` and from the `__`-prefixed parameters right after it (renaming their uses), then add `/` after the last one; skip this if the code supports Python before 3.8.\"}}]}},{id:\"ruff-pyi064-redundant-final-literal\",kind:\"code\",title:\"Ruff PYI064: Redundant final literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a bare Final annotation for constants instead of wrapping a single literal type in Final; type checkers already infer the literal type from the value.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-pyi066-bad-version-info-order\",kind:\"code\",title:\"Ruff PYI066: Bad version info order\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Put the branch for newer Python versions first in stub files that branch on the interpreter version, testing with a greater-or-equal comparison.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-rse102-unnecessary-paren-on-raise-exception\",kind:\"code\",title:\"Ruff RSE102: Unnecessary paren on raise exception\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove the empty parentheses when raising an exception class; raise instantiates the class itself.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-paren-on-raise\",violation:{message:\"Remove the empty parentheses so the class is raised directly; keep them if the callee is a function that returns the exception.\"}}]}},{id:\"ruff-ruf001-ambiguous-unicode-character-string\",kind:\"code\",title:\"Ruff RUF001: Ambiguous unicode character string\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid look-alike Unicode characters in string literals; they read like ASCII letters or punctuation but are different characters.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf002-ambiguous-unicode-character-docstring\",kind:\"code\",title:\"Ruff RUF002: Ambiguous unicode character docstring\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid look-alike Unicode characters in docstrings; they read like ASCII letters or punctuation but are different characters.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf003-ambiguous-unicode-character-comment\",kind:\"code\",title:\"Ruff RUF003: Ambiguous unicode character comment\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid look-alike Unicode characters in comments; they read like ASCII letters or punctuation but are different characters.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf005-collection-literal-concatenation\",kind:\"code\",title:\"Ruff RUF005: Collection literal concatenation\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Prefer iterable unpacking over adding a list or tuple literal to another collection with the plus operator; it reads better and accepts any iterable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf006-asyncio-dangling-task\",kind:\"code\",title:\"Ruff RUF006: Asyncio dangling task\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Keep a reference to every asyncio task until it finishes, such as in a set or by awaiting it; the event loop holds tasks only weakly, so they can be dropped mid-run.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf007-zip-instead-of-pairwise\",kind:\"code\",title:\"Ruff RUF007: Zip instead of pairwise\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use itertools.pairwise to iterate over successive pairs instead of zipping a sequence with a copy of itself shifted by one; it is clearer and avoids slicing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"zip-instead-of-pairwise\",violation:{message:\"Replace this `zip` with `itertools.pairwise($ID1)`, or pairwise over the common slice when both arguments are slices; keep `zip` if the upper bounds differ or `$ID1` is not a plain sequence.\"}}]}},{id:\"ruff-ruf008-mutable-dataclass-default\",kind:\"code\",title:\"Ruff RUF008: Mutable dataclass default\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Give dataclass and attrs fields a default factory instead of a mutable default such as a list, dict or set; one object would be shared by every instance.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf009-function-call-in-dataclass-default-argument\",kind:\"code\",title:\"Ruff RUF009: Function call in dataclass default argument\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid function calls in dataclass field defaults; the call runs once at class definition, so every instance shares its result.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-ruf010-explicit-f-string-type-conversion\",kind:\"code\",title:\"Ruff RUF010: Explicit f string type conversion\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the f-string conversion flag instead of calling str, repr or ascii on an interpolated value; the flag is shorter and idiomatic.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf012-mutable-class-default\",kind:\"code\",title:\"Ruff RUF012: Mutable class default\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Initialize mutable class attributes such as lists, dicts and sets in the constructor, or mark them as class variables; a default in the class body is shared by every instance.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf013-implicit-optional\",kind:\"code\",title:\"Ruff RUF013: Implicit optional\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Spell out Optional or a union with None in the annotation of a parameter whose default is None; leaving None out of the type is an implicit Optional.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf015-unnecessary-iterable-allocation-for-first-element\",kind:\"code\",title:\"Ruff RUF015: Unnecessary iterable allocation for first element\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Take the first item with next and iter instead of building a whole list or tuple only to index it; the full collection is allocated for one element.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf016-invalid-index-type\",kind:\"code\",title:\"Ruff RUF016: Invalid index type\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Index list, tuple, string and bytes literals only with integers or slices; any other index type fails at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf017-quadratic-list-summation\",kind:\"code\",title:\"Ruff RUF017: Quadratic list summation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid flattening lists by summing them onto an empty list; it is quadratic, so chain them with itertools instead.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"quadratic-list-summation\",violation:{message:\"Replace `sum(lists, [])` with `list(itertools.chain.from_iterable(lists))`; summing onto a list copies it at every step (quadratic). Leave it when the input is only a few short lists.\"}}]}},{id:\"ruff-ruf018-assignment-in-assert\",kind:\"code\",title:\"Ruff RUF018: Assignment in assert\",group:
