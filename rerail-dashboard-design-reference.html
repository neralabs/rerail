  .protobar .grow{flex:1}
  .protobar .src{color:var(--bar-muted);white-space:nowrap}
  .stage{flex:1;min-height:0;display:flex}

  .notes{flex:none;width:360px;overflow:auto;padding:14px 16px 24px;background:var(--note-bg);color:var(--note-fg);border-left:1px solid var(--note-line);font-size:12.5px;line-height:1.5}

  .notes h2{margin:0 0 4px;font-size:13px}
  .notes .lede{margin:0 0 12px;color:color-mix(in srgb,var(--note-fg) 70%,transparent)}

  .notes .tag.eng{background:#ab6400}
  .notes .tag.ship{background:#646076}
  .notes h4{margin:8px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:color-mix(in srgb,var(--note-fg) 60%,transparent)}
  .notes ul{margin:0;padding-left:16px}
  .notes li{margin:2px 0}
  .notes .foot{margin:8px 0 0;font-style:italic;color:color-mix(in srgb,var(--note-fg) 70%,transparent)}
  .notes .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--note)}

oreground, since dark's --sidebar-primary is the bright brand.\n * --canvas: the page background, a radial anchored in the bottom-right corner: --accent mixed into --background\n * (45% at the corner, 26% at 45%, background at 100%); dark mixes --brand. A radial, so page height never changes it.\n * --sheet-inset: the layer between page and card (the sheet's \"On a violation\" box, stat cells, the expanded Edit\n * boxes, the session's resume box); Nera goes page then card with nothing between. --panel-box: prompt and command\n * boxes; --nested: a tool call's opened payload.\n * --log-* / --steer-* / --block-bg: the outcomes on steps Nera already has. Log is quiet (muted); Steer is\n * --warning-foreground on a 10% --warning tint, never the solid --warning for text or icons; Block is danger.\n * --fail-border / --outside-border: a failed tool call's and an outside call's border.\n * --brand-border: outline and open-state buttons, the selected row. --card-shadow / --panel-shadow / --bar-shadow:\n * cards, the sheet, the top bar once scrolled. --lift: the selected segment. --picon-bg: a pack icon's disc.\n * --switch-thumb: the switch knob has to stay light on a dark track in both themes (shadcn's own switch flips the same way).\n * --menu-rest: the repository pill's resting fill.\n * --scrim / --overlay-shadow: the veil and shadow when the sheet floats over the content (under 1100px); with\n * --lift, the only black or white alphas, as named effects.\n * --tb: the top bar's height, measured by frame/topbar.js; --sat / --sab: the host's safe-area insets.\n * --gutter: the page's side margin; --frame-max: the content column's cap; --sheet-width: the sheet column.\n */\n:root {\n  --header: color-mix(in srgb, var(--sidebar-primary) 75%, var(--brand));\n  --canvas: radial-gradient(125% 115% at 100% 100%, color-mix(in srgb, var(--accent) 45%, var(--background)) 0%, color-mix(in srgb, var(--accent) 26%, var(--background)) 45%, var(--background) 100%);\n  --sheet-inset: color-mix(in srgb, var(--background) 60%, var(--muted));\n  --panel-box: var(--secondary);\n  --nested: var(--secondary);\n  --log-fg: var(--muted-foreground);\n  --log-bg: var(--subtle);\n  --steer-fg: var(--warning-foreground);\n  --steer-bg: color-mix(in srgb, var(--warning) 10%, transparent);\n  --block-bg: var(--danger-subtle);\n  --fail-border: color-mix(in srgb, var(--danger) 45%, transparent);\n  --outside-border: color-mix(in srgb, var(--warning) 55%, transparent);\n  --brand-border: color-mix(in srgb, var(--brand) 45%, transparent);\n  --card-shadow: 0 6px 16px -4px color-mix(in srgb, var(--brand) 30%, transparent);\n  --panel-shadow: -6px 0 16px -4px color-mix(in srgb, var(--brand) 30%, transparent);\n  --bar-shadow: 0 8px 20px -12px color-mix(in srgb, var(--foreground) 22%, transparent);\n  --picon-bg: color-mix(in srgb, var(--brand) 12%, transparent);\n  --switch-thumb: var(--card);\n  --menu-rest: var(--subtle);\n  --lift: 0 1px 2px rgb(0 0 0 / .1);\n  --scrim: rgb(10 10 14 / .38);\n  --overlay-shadow: -24px 0 48px rgb(0 0 0 / .28);\n  --pill: 999px;\n  --tb: 0px;\n  --sat: env(safe-area-inset-top, 0px);\n  --sab: env(safe-area-inset-bottom, 0px);\n  --gutter: 32px;\n  --frame-max: 1440px;\n  --sheet-width: min(440px, 38vw);\n}\n@media (min-width:1100px) { :root { --gutter: 48px; } }\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --header: var(--foreground);\n    --canvas: radial-gradient(125% 115% at 100% 100%, color-mix(in srgb, var(--brand) 16%, var(--background)) 0%, color-mix(in srgb, var(--brand) 8%, var(--background)) 45%, var(--background) 100%);\n    --sheet-inset: var(--background);\n    --panel-box: var(--card);\n    --nested: var(--card);\n    --steer-bg: color-mix(in srgb, var(--warning) 14%, transparent);\n    --card-shadow: 0 6px 16px -4px rgb(0 0 0 / .55);\n    --panel-shadow: -6px 0 16px -4px rgb(0 0 0 / .55);\n    --bar-shadow: 0 8px 20px -12px rgb(0 0 0 / .6);\n    --picon-bg: color-mix(in srgb, var(--brand) 20%, transparent);\n    --switch-thumb: var(--foreground);\n  }\n}\n:root[data-theme=\"dark\"] {\n  --header: var(--foreground);\n  --canvas: radial-gradient(125% 115% at 100% 100%, color-mix(in srgb, var(--brand) 16%, var(--background)) 0%, color-mix(in srgb, var(--brand) 8%, var(--background)) 45%, var(--background) 100%);\n  --sheet-inset: var(--background);\n  --panel-box: var(--card);\n  --nested: var(--card);\n  --steer-bg: color-mix(in srgb, var(--warning) 14%, transparent);\n  --card-shadow: 0 6px 16px -4px rgb(0 0 0 / .55);\n  --panel-shadow: -6px 0 16px -4px rgb(0 0 0 / .55);\n  --bar-shadow: 0 8px 20px -12px rgb(0 0 0 / .6);\n  --picon-bg: color-mix(in srgb, var(--brand) 20%, transparent);\n  --switch-thumb: var(--foreground);\n}\n.dark {\n  --header: var(--foreground);\n  --canvas: radial-gradient(125% 115% at 100% 100%, color-mix(in srgb, var(--brand) 16%, var(--background)) 0%, color-mix(in srgb, var(--brand) 8%, var(--background)) 45%, var(--background) 100%);\n  --sheet-inset: var(--background);\n  --panel-box: var(--card);\n  --nested: var(--card);\n  --steer-bg: color-mix(in srgb, var(--warning) 14%, transparent);\n  --card-shadow: 0 6px 16px -4px rgb(0 0 0 / .55);\n  --panel-shadow: -6px 0 16px -4px rgb(0 0 0 / .55);\n  --bar-shadow: 0 8px 20px -12px rgb(0 0 0 / .6);\n  --picon-bg: color-mix(in srgb, var(--brand) 20%, transparent);\n  --switch-thumb: var(--foreground);\n}\n/* ---- end page-local tokens ------------------------------------------------------------ */\n\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml,body{height:100%}\n/* A filter can shrink the page below the viewport; the scrollbar track stays so nothing recentres. */\nhtml{background-color:var(--background);overflow-y:scroll}\n.canvas{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;background-image:var(--canvas);background-repeat:no-repeat;background-size:100% 100%}\nbody{margin:0;background:transparent;min-height:100%;color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\nbutton:disabled{cursor:default}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[role=button]:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}\n.mono{font-family:var(--font-mono);font-size:12px}\n.num{font-variant-numeric:tabular-nums}\n.dim,.muted{color:var(--muted-foreground)}\n/* Text read only by a screen reader: the menu toggle's name, and Merge Assist's \"into\", Ready / Note and side names. */\n.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\ncode{font-family:var(--font-mono);font-size:12px;background:var(--subtle);padding:1px 6px;border-radius:var(--radius-md);color:var(--foreground)}\n.ico{flex:none}\n\n/* ---- frame: the top bar spans both columns; the sheet is the frame's second column ---- */\n/* The content column is capped at 1440px. An open sheet adds its own column: on a wide window the frame grows by the\n * sheet's width, so the sheet keeps its 440px and sits at the window's edge while the content keeps its cap. */\n.frame{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-items:start;width:100%;max-width:var(--frame-max);margin:0 auto;min-height:calc(100vh - var(--sat) - var(--sab))}\nbody[data-panel=\"open\"] .frame{grid-template-columns:minmax(0,1fr) var(--sheet-width)}\n@media (min-width:1100px){ body[data-panel=\"open\"] .frame{max-width:calc(var(--frame-max) + var(--sheet-width))} }\n.shell{grid-column:1;grid-row:2;min-width:0;padding-block:0 48px;padding-inline:var(--gutter)}\n.cwrap{display:grid;grid-template-columns:228px minmax(0,1fr);gap:0 40px;align-items:start}\n.cmain{min-width:0}\n\n/* ---- top bar ---- */\n.topbar{grid-column:1 / -1;grid-row:1;position:sticky;top:var(--sat);z-index:10;display:flex;justify-content:center;padding:14px var(--gutter) 12px;background:var(--background);transition:box-shadow .15s}\nbody[data-scrolled=\"1\"] .topbar{box-shadow:var(--bar-shadow)}\n.topbar .tbin{flex:1 1 auto;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;min-width:0}\n.topbar h1{font-size:20px;font-weight:400;margin:0;color:var(--brand-foreground);letter-spacing:-.01em}\n/* The wordmark goes to Overview. */\n.topbar h1 .wm{font:inherit;color:inherit;letter-spacing:inherit;border-radius:var(--radius-md)}\n.topbar h1 .wm:hover{opacity:.8}\n/* The sidebar toggle: far left of the bar, icon only, the words in its tooltip. On desktop the gutter widens to 48px\n * and the toggle hangs in it, so the wordmark sits on the content edge like everything below it. */\n.navtoggle{display:inline-flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;margin:0 -2px 0 -8px;border-radius:50%;color:var(--muted-foreground)}\n.navtoggle:hover{background:var(--subtle);color:var(--foreground)}\n@media (min-width:1100px){ .navtoggle{margin-left:calc(8px - var(--gutter));margin-right:calc(var(--gutter) - 58px)} }\nhtml[data-nav=\"hidden\"] .cwrap{display:block}\nhtml[data-nav=\"hidden\"] #sidenav{display:none!important}\n/* The repository as a pill; a chevron and a menu only when Rerail knows another repo to switch to. */\n.repopick{position:relative;display:flex;align-items:center;margin-left:-6px}\n.repopill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--pill);background:var(--menu-rest);font-size:13px;color:var(--muted-foreground)}\nbutton.repopill{padding-right:8px}\n.repopill b{font-family:var(--font-mono);font-size:12.5px;font-weight:500;color:var(--foreground)}\nbutton.repopill:hover,.repopill[aria-expanded=\"true\"]{background:var(--subtle);color:var(--foreground)}\n.repopill .ico{opacity:.7;transition:transform .15s}\n.repopill[aria-expanded=\"true\"] .ico{transform:rotate(180deg)}\n.repopill.none b{font-family:var(--font-sans);font-weight:500;color:var(--muted-foreground)}\n.repomenu{position:fixed;z-index:30;width:max-content;min-width:min(320px,calc(100vw - 48px));max-width:calc(100vw - 48px);background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--card-shadow);padding:4px;display:grid;gap:1px}\n.repomenu [role=\"option\"]{display:grid;grid-template-columns:auto minmax(0,1fr) 16px;gap:2px 10px;align-items:center;text-align:left;padding:7px 8px 7px 10px;border-radius:var(--radius-md)}\n.repomenu [role=\"option\"]:hover{background:var(--subtle)}\n.repomenu [role=\"option\"] b{grid-column:2;font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--brand-foreground)}\n.repomenu [role=\"option\"] .rline{grid-column:2;font-size:12px;color:var(--muted-foreground)}\n.repomenu [role=\"option\"] .rcheck{grid-column:3;grid-row:1 / span 2;visibility:hidden}\n.repomenu [role=\"option\"][aria-selected=\"true\"] .rcheck{visibility:visible}\n.repomenu [role=\"option\"] .rgo{display:none}\n/* A repository choice's glyph (menu and page list): the sidebar's icon box, on the name's line, in the brand color like the name. */\n.rglyph{grid-column:1;grid-row:1;display:inline-flex;width:20px;height:20px;padding:3px;color:var(--brand-foreground)}\n.rglyph .ico,.rcheck .ico,.rgo .ico{display:block}\n.repomenu .sub{margin:3px 0 0;padding:8px 10px 6px;border-top:1px solid var(--border);font-size:12px;line-height:1.5;color:var(--muted-foreground)}\n.status{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--muted-foreground);font-size:12px;text-align:right}\n.dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none}\n.status .verwrap{display:inline-flex;align-items:center;gap:8px;margin-right:6px}\n/* The version keeps its quiet colour whatever the status beside it says (Stopped, Daemon not responding). */\n.status .ver{color:var(--muted-foreground)}\n.status .ver:hover{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}\n.status .vnew{padding:1px 8px;border-radius:var(--pill);background:var(--info-subtle);color:var(--info-foreground);font-weight:500}\n.status .vnew:hover{filter:brightness(.96)}\n.status.warn{color:var(--warning-foreground)} .status.warn .dot{background:var(--warning-foreground)}\n.status.down{color:var(--danger-foreground)} .status.down .dot{background:var(--danger-foreground)}\n\n/* ---- sidebar ---- */\n#sidenav{position:sticky;top:calc(var(--tb) + var(--sat) + 8px);max-height:calc(100vh - var(--tb) - var(--sat) - 24px);overflow:auto;overscroll-behavior:contain;padding:8px 4px 24px 0}\n.sn-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:18px 10px 6px}\n.sn-h:first-child{margin-top:0}\n/* A long pack name wraps to a second line; its icon and on-count stay on the first. */\n.sn-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:6px 10px;border-radius:var(--radius-lg);font-size:13.5px;line-height:20px;color:var(--foreground);min-width:0}\n.sn-item:hover{background:var(--subtle)}\n.sn-item[aria-current=\"page\"]{background:var(--brand-subtle);color:var(--brand-foreground);font-weight:500}\n.sn-item .t{flex:1;min-width:0;overflow-wrap:anywhere}\n.sn-item .n{flex:none;font-size:11.5px;line-height:20px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;white-space:nowrap}\n.sn-item[aria-current=\"page\"] .n{color:inherit;opacity:.8}\n/* Pack logos and icons share one 20px box, so every label starts in one column. */\n.sn-item .picon{width:20px;height:20px}\n.sn-item .picon .ltr,.sn-item .picon .ltr.l3{font-size:7.5px}\n.sn-item .ico{width:20px;height:20px;padding:3px;color:var(--muted-foreground)}\n.sn-item[aria-current=\"page\"] .ico{color:inherit}\n.sn-item.add,.sn-item.add .ico{color:var(--brand-foreground)}\n.sn-foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}\n.sn-empty{padding:4px 10px 6px;font-size:12.5px;line-height:1.45;color:var(--muted-foreground)}\n@media (max-width:900px){\n  .cwrap{display:block}\n  #sidenav{position:static;max-height:none;padding:12px 0 0;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}\n  #sidenav .sn-h{width:100%;margin:10px 10px 2px}\n  #sidenav .sn-item{width:auto}\n  #sidenav .sn-foot{margin:8px 0 0;padding:0;border:0}\n}\n\n/* ---- the sheet column: inline beside the content; under 1100px it floats over it with a scrim ---- */\n.panel{grid-column:2;grid-row:2;display:none;position:sticky;top:calc(var(--tb) + var(--sat));height:calc(100vh - var(--tb) - var(--sat) - var(--sab));background:var(--card);border-left:1px solid var(--border);box-shadow:var(--panel-shadow);flex-direction:column;overflow:hidden}\nbody[data-panel=\"open\"] .panel{display:flex}\n.scrim{display:none}\n@media (max-width:1100px){\n  body[data-panel=\"open\"] .frame{grid-template-columns:minmax(0,1fr)}\n  body[data-panel=\"open\"] .panel{position:fixed;top:var(--sat);right:0;bottom:0;height:auto;width:min(440px,90vw);z-index:40;box-shadow:var(--overlay-shadow)}\n  body[data-panel=\"open\"] .scrim{display:block;position:fixed;left:0;right:0;bottom:0;top:var(--sat);background:var(--scrim);z-index:35}\n}\n\n/* ---- buttons, segmented controls, chips, switches ---- */\n.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--pill);border:1px solid var(--brand);background:var(--card);font-size:13px;font-weight:500;color:var(--brand-foreground);white-space:nowrap}\n.btn:hover{background:var(--brand-subtle)}\n.btn.sm{padding:4px 11px;font-size:12px}\n.btn.solid{background:var(--brand);border-color:var(--brand);color:var(--primary-foreground)}\n.btn.solid:hover{background:var(--brand);opacity:.92}\n.btn.ghost{border-color:transparent;background:transparent;color:var(--muted-foreground)}\n.btn.ghost.link{color:var(--brand-foreground);padding-inline:6px}\n.btn.ghost.link:hover{text-decoration:underline;text-underline-offset:3px;background:transparent}\n.btn.danger{background:var(--danger-subtle);color:var(--danger-foreground);border-color:transparent}\n.btn.danger:hover{background:var(--danger-subtle);filter:brightness(.97)}\n/* Remove pack on its page: an outline, danger text and a 45% danger stroke, no fill until hovered. */\n.btn.danger.outline{background:transparent;color:var(--danger-foreground);border-color:var(--fail-border)}\n.btn.danger.outline:hover{background:var(--danger-subtle);filter:none}\n.rangectl{display:inline-flex;gap:2px;background:var(--subtle);border-radius:var(--pill);padding:3px}\n.rangectl button{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--pill);font-size:12px;color:var(--muted-foreground)}\n.rangectl button[aria-pressed=\"true\"]{background:var(--card);color:var(--foreground);box-shadow:var(--lift)}\n.chips{display:flex;flex-wrap:wrap;gap:6px}\n.chip{padding:5px 12px;border-radius:var(--pill);border:1px solid transparent;background:var(--subtle);font-size:12px;color:var(--foreground)}\n.chip:hover{background:var(--muted)}\n.chip[aria-pressed=\"true\"]{background:var(--brand);color:var(--primary-foreground)}\n.sortctl{display:inline-flex;align-items:center;gap:12px;font-size:12px;color:var(--muted-foreground);position:relative}\n.sortctl select{font:inherit;font-size:12px;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0 30px 0 10px;height:31px;appearance:none;-webkit-appearance:none}\n.sortctl::after{content:\"\";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted-foreground);border-bottom:1.5px solid var(--muted-foreground);transform:translateY(-70%) rotate(45deg);pointer-events:none}\n.sw{position:relative;width:34px;height:20px;border-radius:var(--pill);background:var(--muted);border:1px solid var(--border);transition:background .15s;flex:none}\n.sw::after{content:\"\";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--switch-thumb);box-shadow:var(--lift);transition:transform .15s}\n.sw[aria-checked=\"true\"]{background:var(--brand);border-color:var(--brand)}\n.sw[aria-checked=\"true\"]::after{transform:translateX(14px);background:var(--primary-foreground)}\n/* The whole-pack switch while some of its rules are on: the knob halfway, on a pale brand track. */\n.sw[aria-checked=\"mixed\"]{background:var(--brand-subtle);border-color:var(--brand)}\n.sw[aria-checked=\"mixed\"]::after{transform:translateX(7px);background:var(--brand)}\n.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:var(--radius-md);font-size:11px;font-weight:500;background:var(--subtle);color:var(--muted-foreground);white-space:nowrap}\n/* A rule pack's logo: the sidebar, the catalog and the sheet. */\n.picon{flex:none;width:36px;height:36px;border-radius:50%;background:var(--picon-bg);color:var(--brand-foreground);display:grid;place-items:center}\n.picon .ltr{font-weight:700;font-size:13px;letter-spacing:-.02em;line-height:1}\n.picon .ltr.l3{font-size:11px}\n/* The outcomes: History rows, the transcript, the sheet. Log is quiet; Steer is warning text, never the solid yellow. */\n.oc{display:inline-flex;align-items:center;gap:5px;vertical-align:-3px;margin-right:8px}\n.oc-logged{color:var(--log-fg)} .oc-steered{color:var(--steer-fg)} .oc-blocked{color:var(--danger-foreground)}\n\n/* ---- banners ---- */\n.welcome{display:flex;align-items:flex-start;gap:12px;margin:16px 0 0;padding:14px 16px;background:var(--info-subtle);border-radius:var(--radius-xl);color:var(--info-foreground)}\n.welcome .ico{margin-top:1px}\n.welcome b{font-size:14px}\n.welcome p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--info-foreground);opacity:.9}\n.welcome p.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;opacity:1}\n.welcome .x{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--info-foreground);flex:none}\n.welcome .x:hover{background:var(--subtle)}\n.welcome.warn{background:var(--warning-subtle);color:var(--warning-foreground)}\n.welcome.warn p{color:var(--warning-foreground)}\n/* One recipe for every banner: its colour stays on its surface and its icon; the title, the text, a command, a button\n * that goes somewhere and the dismiss read in the page's own colours. A button that changes something (Start Rerail,\n * Approve) keeps the solid brand colour; one that goes somewhere has a soft fill, the text colour at low strength, so\n * it darkens a light banner and lightens a dark one. */\n.welcome,.welcome.warn{color:var(--foreground)}\n.welcome p,.welcome.warn p{color:var(--foreground);opacity:1}\n.welcome > .ico{color:var(--info-foreground)}\n.welcome.warn > .ico{color:var(--warning-foreground)}\n.welcome .mono{background:var(--subtle);padding:1px 6px;border-radius:var(--radius-md);color:var(--foreground);-webkit-box-decoration-break:clone;box-decoration-break:clone}\n/* Every banner's button is the solid brand one, so the banners read as one set in both themes; a link stays a link. */\n.welcome .btn:not(.ghost):not(.danger){background:var(--brand);border-color:var(--brand);color:var(--primary-foreground)}\n.welcome .btn:not(.ghost):not(.danger):hover{background:var(--brand);opacity:.92}\n.welcome .x{color:var(--muted-foreground)}\n\n/* ---- sections and lists ---- */\nsection.group{margin-bottom:24px}\n.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:start;margin-bottom:10px}\n.ghead h2{grid-column:1;font-size:17px;letter-spacing:-.005em;color:var(--header);margin:0;font-weight:500;line-height:26px}\n.ghead p{grid-column:1;margin:0;font-size:12px;color:var(--muted-foreground);max-width:80ch}\n.ghead p .mono{font-size:.95em}\n.ghead .act{grid-column:2;grid-row:1 / span 2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 20px;align-items:center;min-width:0}\n.ghead.top{margin-top:24px}\n.ghead h2 .n2{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;line-height:16px;color:var(--muted-foreground);background:var(--subtle);padding:1px 7px;border-radius:var(--radius-md);margin-left:8px;vertical-align:2px;white-space:nowrap}\n.list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--card-shadow);overflow:hidden}\n.empty{padding:40px 20px;text-align:center;color:var(--muted-foreground)}\n.empty h3{margin:0 0 6px;color:var(--foreground);font-size:15px;font-weight:600}\n.empty p{margin:0 auto;max-width:72ch}\n.empty p + p{margin-top:6px}\n.empty p.acts{margin-top:14px}\n\n/* ---- the rule list (Overview and the pack pages): controls, rows, group bands ---- */\n.controls{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}\n.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}\n.crow .grow{flex:1}\n.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:7px 10px}\n.search input{flex:1;border:0;background:none;font:inherit;color:inherit;min-width:0}\n.search input::placeholder{color:var(--muted-foreground)}\n.row{border-top:1px solid var(--border)}\n.list > .row:first-child{border-top:0}\n.rmain{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:11px 14px}\n.rtitle{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}\n.rtitle button.t{font-size:14px;font-weight:500;text-align:left}\n.rtitle button.t:hover{text-decoration:underline;text-underline-offset:3px}\n.row.off .rtitle button.t{color:var(--muted-foreground)}\n.rmeta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted-foreground);align-items:center}\n.rmeta > .mono + span::before{content:\"·\";margin-right:10px}\n/* The count, enforcement and switch tracks; the column labels above (.colhead) declare the same ones, so a label and\n * its column share an edge: 96px count, 92px enforcement tag, 34px switch, 32px apart; under 1100px or beside a sheet\n * the count shrinks to its figure and the gaps to 14px. */\n.rside{grid-column:2;grid-row:1 / span 2;display:grid;grid-template-columns:96px 92px 34px;gap:0 32px;align-items:center;justify-self:end}\n/* A rule's enforcement, read-only (render/enforcement.js): its mode's outcome colours and icon, as History shows them;\n * faded with the row when the rule is off. */\n.enftag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--radius-md);font-size:12px;font-weight:500;white-space:nowrap;justify-self:start;cursor:default}\n.enftag.steer{background:var(--steer-bg);color:var(--steer-fg)}\n.enftag.log{background:var(--log-bg);color:var(--log-fg)}\n.enftag.none{background:var(--subtle);color:var(--muted-foreground)}\n.row.off .enftag{opacity:.5}\n.count{font-size:13px;color:var(--muted-foreground);white-space:nowrap;text-align:right}\n.count b{color:var(--foreground);font-weight:600;font-size:14px}\n.count b.zero{color:var(--muted-foreground);font-weight:500}\n.row[aria-selected=\"true\"]{background:var(--brand-subtle);box-shadow:inset 0 0 0 1px var(--brand-border)}\n.row[aria-selected=\"true\"] + .row{border-top-color:transparent}\n.caret{width:20px;height:20px;margin-left:-6px;display:grid;place-items:center;color:var(--muted-foreground);border-radius:var(--radius-md)}\n.caret:hover{background:var(--subtle)}\n.caret svg{transition:transform .15s}\n/* Column labels just above a rule table (Overview, the pack pages): the same tracks as .rside, inset by the rows'\n * padding and border, so \"Violations\" ends on the numbers' right edge and \"On/off\" centres on the switch. */\n.colhead{display:grid;grid-template-columns:minmax(0,1fr) 96px 34px;gap:0 48px;white-space:nowrap;padding:0 15px 12px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);text-align:right}\n.colhead > span:first-child{text-align:left}\n.colhead > span:last-child{display:flex;justify-content:center;width:34px}\n.colhead.enfcols{grid-template-columns:minmax(0,1fr) 96px 92px 34px;gap:0 32px}\n.colhead.enfcols > span:nth-child(3){text-align:left}\n/* Under 1100px, or beside an open sheet: the count track shrinks to its figure, the gap to 14px, and the meta line\n * clips instead of wrapping. */\nbody[data-panel=\"open\"] .rside{grid-template-columns:minmax(40px,max-content) 92px 34px;gap:0 14px}\nbody[data-panel=\"open\"] .colhead.enfcols{grid-template-columns:minmax(0,1fr) minmax(40px,max-content) 92px 34px;gap:0 14px}\nbody[data-panel=\"open\"] .rmeta{flex-wrap:nowrap;overflow:hidden;min-width:0}\nbody[data-panel=\"open\"] .rmeta > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}\n@media (max-width:1100px){\n  .rside{grid-template-columns:minmax(40px,max-content) 92px 34px;gap:0 14px}\n  .colhead.enfcols{grid-template-columns:minmax(0,1fr) minmax(40px,max-content) 92px 34px;gap:0 14px}\n}\n\n/* ---- disclosures and code ---- */\ndetails{border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:14px}\ndetails summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}\ndetails summary::-webkit-details-marker{display:none}\ndetails summary::before{content:\"\";width:6px;height:6px;border-right:1.5px solid var(--muted-foreground);border-bottom:1.5px solid var(--muted-foreground);transform:rotate(-45deg);transition:transform .15s}\ndetails[open] summary::before{transform:rotate(45deg)}\ndetails .in{padding:2px 12px 12px;border-top:1px solid var(--border)}\npre{margin:8px 0 0;padding:10px;background:var(--subtle);border-radius:var(--radius-md);font-family:var(--font-mono);font-size:11.5px;overflow:auto;white-space:pre-wrap}\n\n/* ---- toast: a success fades after a while; a failure (.error) carries a ✕ and stays until dismissed ---- */\n.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translate(-50%,20px);display:flex;align-items:center;gap:12px;background:var(--foreground);color:var(--background);padding:8px 14px;border-radius:6px;font-size:13px;line-height:1.4;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:min(640px,calc(100% - 32px))}\n.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}\n.toast.error{border-left:3px solid var(--danger-foreground);padding-right:6px}\n.toast .msg{min-width:0;overflow-wrap:anywhere}\n.toast .tact{flex:none;font-weight:600;text-decoration:underline;text-underline-offset:3px}\n.toast .tx{flex:none;width:24px;height:24px;border-radius:4px;display:grid;place-items:center;opacity:.8}\n.toast .tx:hover{opacity:1;background:color-mix(in srgb,var(--background) 18%,transparent)}\n.toast button:focus-visible{outline-color:var(--background)}\n\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n\n/* css/sheet.css */\n/*\n * The sheet's content (render/panel.js, render/pack-panel.js): a rule's or a rule pack's detail. The sheet column\n * itself (where it sits, when it floats) is in base.css. `.pbody`, `.pintro` and `.cmd` also set the Create a rule\n * page (create.css), which reads as a sheet laid on the page.\n */\n\n.pwrap{display:flex;flex-direction:column;min-height:0;height:100%}\n.phead{padding:18px 20px 20px;background:var(--card);flex:none}\n.phead .ptop{display:flex;align-items:flex-start;gap:10px}\n.phead .ptop > div{flex:1;min-width:0}\n.phead .ptop .picon{margin-top:2px}\n.phead .eyebrow{font-size:12px;letter-spacing:.02em;color:var(--muted-foreground);font-weight:600}\n/* The title clamps at two lines; the full title is its tooltip. Without an eyebrow it sits flush at the top. */\n.phead h2{margin:0;font-size:17px;line-height:1.3;font-weight:600;color:var(--header);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}\n.phead .eyebrow + h2{margin-top:4px}\n.phead .x{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted-foreground);flex:none}\n.phead .x:hover{background:var(--subtle)}\n.phead .back{display:none}\n.phead .back.show{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--brand-foreground);margin-bottom:4px}\n.pact{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px;font-size:13px}\n.pact .grow{flex:1}\n.pact .muted{font-size:12.5px}\n.pask{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--panel-box);padding:10px 12px}\n.pask .lbl{font-size:12px;font-weight:600;color:var(--muted-foreground);margin:0 0 8px}\n.pask .why{margin:12px 0 0;font-size:13px;color:var(--muted-foreground);max-width:none}\n.pask textarea{display:block;width:100%;min-height:74px;resize:vertical;font-family:var(--font-mono);font-size:12.5px;line-height:1.5;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px}\n.pask .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:10px;font-size:12px;color:var(--muted-foreground)}\n.pask .foot .btns{margin-left:auto;display:inline-flex;gap:8px}\n/* Edit with coding agent: opens under the sheet header, at the top of the body; closes with its ✕ or the header\n * button. It and the inline Edit of What the agent sees are the sheet's expanded boxes: both on the inset fill. */\n.pbody > .pask.sask{position:relative;margin:12px 0 16px;border:0;border-radius:var(--radius-xl);background:var(--sheet-inset);padding:20px 18px}\n.pask.sask > .x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted-foreground)}\n.pask.sask > .x:hover{background:var(--muted)}\n.pask.sask .lbl{font-size:14px;color:var(--foreground);margin:0 0 12px;padding-right:32px}\n.pask.sask .why.top{margin:-6px 0 12px;padding-right:32px}\n.pask.sask .chips{margin:0 0 12px}\n.pask.sask .chip[aria-pressed=\"true\"]{background:transparent;border-color:var(--foreground);color:var(--foreground)}\n.pask.sask .cmd{align-items:flex-start;margin:0;background:var(--card)}\n.pask.sask .cmd textarea{flex:1;min-height:0;border:0;padding:3px 0;background:none;resize:none;field-sizing:content}\n.btn.open{background:var(--brand-subtle);color:var(--brand-foreground);border-color:var(--brand-border)}\n.btn.open:hover{background:var(--brand-subtle)}\n.pbody{overflow:auto;padding:4px 20px 24px;flex:1;min-height:0}\n.pbody p{margin:0;max-width:52ch;font-size:14px;line-height:1.55;color:var(--foreground)}\n.pbody .mono{font-size:13px}\n.pbody .muted{color:var(--muted-foreground)}\n.psec .h3row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}\n.pbody .psec .h3row h3{margin:0}\n.psec .h3row .btn{margin:-6px 0}\n.pbody .note2{margin-top:6px;font-size:13px}\n.pask.sees-edit{margin-top:0;border:0;border-radius:var(--radius-xl);background:var(--sheet-inset);padding:16px 18px}\n.enf{margin:0 0 24px;padding:24px 18px;border-radius:var(--radius-xl);background:var(--sheet-inset)}\n.enf .lbl{font-size:14px;font-weight:600;letter-spacing:-.005em;color:var(--foreground)}\n/* \"On a violation\" with the rule's enforcement tag at the right of the same line; what it means, and how to change it,\n * close together under it. */\n.enf .enfhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}\n.pbody .enf > p{margin:0;font-size:13px;line-height:1.5;color:var(--muted-foreground)}\n.pbody .enf > p.enfhint{margin-top:2px}\n/* Three separate cards. */\n.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}\n/* Three cards of three single lines each (how many, what, over when), so numbers and words line up across them. */\n.pstats div{padding:12px;min-width:0;background:var(--sheet-inset);border-radius:var(--radius-xl)}\n.pstats b,.pstats span,.pstats small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.pstats b{font-size:18px;font-weight:600;line-height:1.2}\n.pstats span{font-size:12px;color:var(--foreground);margin-top:4px}\n.pstats small{font-size:12px;color:var(--muted-foreground)}\n.pbody .pstats-none{margin:0 0 6px;font-size:13px;color:var(--muted-foreground)}\n.psec{margin-top:38px}\n.pbody .psec h3{margin:0 0 8px;font-size:14px;font-weight:600;letter-spacing:-.005em;color:var(--foreground)}\n.desc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}\n.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}\n.kv dt{color:var(--muted-foreground);font-size:12.5px;padding-top:1px}\n.kv dd{margin:0;overflow-wrap:anywhere}\n.said2{display:block;padding:6px 10px;border-left:2px solid var(--brand);background:var(--brand-subtle);border-radius:0 var(--radius-md) var(--radius-md) 0;font-size:13.5px}\n/* Recent history: what the agent was told (when it differs), file and session, folder and when. */\n.ract{display:flex;flex-direction:column}\n.ract .rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:3px;align-items:baseline;padding:10px 0;font-size:13px}\n.ract > .rrow:first-child{padding-top:0}\n.ract > .rrow + .rrow{border-top:1px solid var(--border)}\n.ract .m{grid-column:1 / -1;font-size:13px;color:var(--foreground);line-height:1.45}\n.ract .file{font-family:var(--font-mono);font-size:12.5px;color:var(--foreground);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ract .file.muted{font-family:inherit;color:var(--muted-foreground)}\n.ract .dir{font-family:var(--font-mono);font-size:11.5px;color:var(--muted-foreground);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ract .when{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;justify-self:end}\n.ract .open{font-family:var(--font-mono);font-size:11.5px;color:var(--brand-foreground);justify-self:end;white-space:nowrap}\n/* Delete: a footer pinned to the sheet's bottom while the content runs past it, resting at the end when it does not. */\n.pbody:has(> .pfoot:not([hidden])){display:flex;flex-direction:column;padding-bottom:0}\n.pbody:has(> .pfoot:not([hidden])) > *{flex:none}\n.pbody .pfoot{position:sticky;bottom:0;z-index:2;margin:auto -20px 0;padding:12px 20px;border-top:1px solid var(--border);background:var(--card)}\n.pbody > :has(+ .pfoot:not([hidden])){margin-bottom:32px}\n.pfoot .pask{margin-top:0}\n.pdelbox{border-color:var(--fail-border)}\n.pdelbox .lbl{font-size:13px;color:var(--foreground)}\n.pdelbox ul{margin:0 0 4px;padding-left:18px;font-size:13px;line-height:1.55;color:var(--foreground)}\n.btn.danger.quiet{background:transparent;color:var(--muted-foreground)}\n.btn.danger.quiet:hover,.btn.danger.quiet:focus-visible{background:var(--danger-subtle);color:var(--danger-foreground);filter:none}\n.btn.danger.solid{background:var(--danger-subtle);color:var(--danger-foreground);border-color:var(--danger-foreground)}\n.pintro{margin:12px 0 0;font-size:13.5px;line-height:1.5}\n.pbody > .pintro:first-child{margin-top:20px}\n.pbody .pintro + .pintro{margin-top:12px}\n.cmd{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:8px 8px 8px 12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--panel-box)}\n.cmd code{flex:1;min-width:0;background:none;padding:0;font-size:13px;overflow-wrap:anywhere}\n.cmd + .pintro{margin-top:22px}\n.pgrp{border:1px solid var(--border);border-radius:var(--radius-lg);margin-top:12px;overflow:hidden}\n.prow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:8px 14px 8px 36px;border-top:1px solid var(--border);font-size:13px}\n.prow .t{flex:1;text-align:left;line-height:1.4}\nbutton.t:hover{text-decoration:underline;text-underline-offset:3px}\n.prow .mono{flex:none;font-size:11.5px;color:var(--muted-foreground);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.prow .m{flex:none;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}\n.rmask{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;font-size:12.5px;color:var(--foreground)}\n\n/* css/overview.css */\n/* Overview (views/overview.js): the banner, the range's tiles, then Most violations logged and Recent sessions, or\n * the empty block. Rule rows reuse the rule list's row (base.css). */\n\n.ov > .banners:empty{display:none}\n.rollup{margin:16px 0 20px}\n.rollup .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n.rollhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:16px}\n.rollhead h2{font-size:20px;letter-spacing:-.01em;line-height:28px;color:var(--header);margin:0;font-weight:500}\n.rollhead .rangectl{margin-left:auto}\n\n/* Each tile lands on the list that produced its number: By rule (steered), By session (with violations), By rule, the rule packs. */\n.tile{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--card-shadow);padding:14px 16px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .12s,box-shadow .12s}\n.tile:hover{border-color:var(--brand-border)}\n.tile:focus-visible{outline:2px solid var(--ring);outline-offset:2px}\n.tile .k{font-size:13px;font-weight:500;color:var(--brand-foreground)}\n.tile .v{font-size:30px;font-weight:400;line-height:1.15;margin-top:6px;color:var(--brand-foreground);letter-spacing:-.01em;font-variant-numeric:proportional-nums}\n.tile .v small{font-size:13px;font-weight:400;color:var(--muted-foreground);letter-spacing:0;margin-left:2px}\n.tile .s{font-size:12px;color:var(--muted-foreground);margin-top:4px}\n/* With the sheet open the tiles go two-up, as the rows go compact: the page reads as narrowed beside the sheet. */\nbody[data-panel=\"open\"] .rollup .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}\n@media (max-width:760px){.rollup .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\n.ov .ovempty .list{margin-top:16px}\n.ov .ovempty p.acts{display:flex;gap:8px;justify-content:center}\n.ovlists > section + section{margin-top:36px}\n.ovlists > section > .ghead{margin-bottom:12px}\n.ovlists > section > .ghead h2{font-size:20px;letter-spacing:-.01em;line-height:28px}\n\n.ovtop .row{cursor:pointer}\n.ovtop .row:hover{background:var(--subtle)}\n\n/* Recent sessions: the session, then its violations; the same shape as History by session. */\n.ov .colhead.srhead{grid-template-columns:minmax(0,1fr) 120px;gap:0 16px}\n.ov .colhead.srhead > span:last-child{display:block;width:auto;text-align:right}\n.sesrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;column-gap:16px;align-items:center;width:100%;padding:11px 14px;border-top:1px solid var(--border);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}\n.sesrow:first-child{border-top:0}\n.sesrow:hover{background:var(--subtle)}\n.sesrow .l{display:flex;flex-direction:column;gap:3px;min-width:0}\n.sesrow .t{font-size:14px;font-weight:500;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.sesrow .m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted-foreground);align-items:center}\n.sesrow .m .sid{font-family:var(--font-mono);font-size:11px;opacity:.85}\n.sesrow .m .live{display:inline-flex;align-items:center;gap:5px;color:var(--success-foreground)}\n.sesrow .m .live::before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--success)}\n.sesrow .m .stale{display:inline-flex;align-items:center;gap:5px}\n.sesrow .m .stale::before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--muted-foreground);opacity:.5}\n.sesrow .n{text-align:right;font-size:14px}\n.sesrow .n b{font-weight:600}\n.sesrow .n.zero b{color:var(--muted-foreground);font-weight:500}\n\n/* css/pack.css */\n/*\n * A rule pack's page and Created by you (views/pack.js): the heading (the name with Remove pack at its right, what\n * the pack covers, then the on-count chip and the violations share, where Remove's question opens), the controls with\n * the whole-pack switch on the On/off column, then the rule table (render/rules.js; rows and column labels in base.css).\n */\n\n.ppage{margin-top:16px}\n.ppage .ghead.pk{display:block;margin:0 0 18px}\n.ppage .ghead.pk .pkh{display:flex;align-items:center;justify-content:space-between;gap:16px}\n.ppage .ghead.pk h2{margin:0;font-size:20px;letter-spacing:-.01em;line-height:28px}\n.ppage .ghead.pk .pkh .btn{flex:none}\n/* What the pack covers, straight under the title, across the full width. */\n.ppage .ghead.pk p.pitch{margin:6px 0 0;max-width:none;font-size:13.5px;line-height:20px;color:var(--muted-foreground)}\n.ppage .ghead.pk p.sub{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;max-width:none}\n.ppage .ghead.pk p.sub .n2{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;line-height:16px;color:var(--muted-foreground);background:var(--subtle);padding:1px 7px;border-radius:var(--radius-md);white-space:nowrap}\n.ppage .ghead.pk p.sub .n2.mix{color:var(--foreground)}\n.ppage .ghead.pk p.sub .shr{font-size:12px;color:var(--muted-foreground)}\n.ppage .ghead.pk p.sub .rmslot:empty{display:none}\n/* Remove's question continues the counts line on a line of its own: \"Remove all 4 rules in Node? Remove · Cancel\". */\n.ppage .ghead.pk p.sub .rmslot{flex:1 1 100%}\n.ppage .ghead.pk p.sub .rmask{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 10px;margin:8px 0 4px;max-width:72ch;font-size:13px;line-height:1.5}\n.ppage > .list .empty p.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}\n\n/* The rarest action is the quietest: a muted link that turns red on hover; the question it asks keeps the red. */\n.btn.danger.quiet{background:transparent;color:var(--muted-foreground)}\n.btn.danger.quiet:hover,.btn.danger.quiet:focus-visible{background:var(--danger-subtle);color:var(--danger-foreground);filter:none}\n\n/* Filter tinted while it narrows the list, so the pill says so without a banner. */\n.filterctl{display:inline-flex;align-items:center;gap:6px}\n.sortctl.on select{background:var(--brand-subtle);color:var(--brand-foreground);font-weight:500}\n.sortctl.on::after{border-color:var(--brand-foreground)}\n.ctlslot{display:inline-flex}\n/* The search takes half the content width: a search box does not need the whole line. */\n.ppage .search{flex:0 1 50%;max-width:50%}\n@media (max-width:760px){.ppage .search{flex-basis:100%;max-width:none}}\n\n/* The whole-pack switch: right-aligned with the column labels' 15px inset, so it sits on the On/off column. */\n.packall{display:inline-flex;justify-content:flex-end;align-items:center;gap:12px;padding:0 15px 0 0;font-size:13px;color:var(--foreground)}\n.packall .t{color:var(--muted-foreground)}\n\n.rtable .row{cursor:pointer}\n.rtable .row:hover{background:var(--subtle-fill)}\n\n/* css/packs.css */\n/* Add rule packs, the review before starting (views/packs.js), and the pack sheet's own parts (render/pack-panel.js). */\n\n.catalog{margin-top:16px;max-width:880px}\n.catalog > .ghead h2{font-size:20px;letter-spacing:-.01em;line-height:28px}\n.catalog .list,.pcard{box-shadow:none}\n.cattools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 12px}\n.cathead{margin-bottom:10px}\n.cathead .btn{padding-inline:2px}\n\n/* One row per pack: icon, name, what it covers (three lines, always three lines of room), size; state and action end on one line. */\n.prow2{display:flex;align-items:flex-start;gap:16px;padding:16px;border-top:1px solid var(--border);cursor:pointer;text-align:left}\n.prow2:first-child{border-top:0}\n.prow2:hover{background:var(--subtle-fill)}\n.prow2 .pt2{flex:1;min-width:0;display:grid;gap:3px}\n.prow2 .pt2 b{font-size:14px;font-weight:600}\n.prow2 .pt2 .sub{font-size:13px;color:var(--foreground);line-height:1.45;max-width:72ch}\n.catalog:not(.rv) .prow2 .pt2 .sub{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:19px;min-height:57px}\n.prow2 .pt2 .meta{font-size:12.5px;color:var(--muted-foreground)}\n.prow2 .pend{flex:none;width:250px;align-self:center;display:flex;align-items:center;justify-content:flex-end;gap:22px;min-height:30px}\n.prow2 .pend .btn{white-space:nowrap}\n.prow2 .pstatus{font-size:12.5px;color:var(--muted-foreground);white-space:nowrap}\n.prow2 .pact2{flex:none;align-self:center;display:flex;justify-content:flex-end}\n.added{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--radius-md);background:var(--success-subtle);color:var(--success-foreground);font-size:11.5px;font-weight:500;white-space:nowrap}\n.added .ico{color:inherit}\n/* A pack removed during this visit: its row says so, with Undo, until the page is left. */\n.rmtag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--radius-md);background:var(--subtle);color:var(--muted-foreground);font-size:11.5px;font-weight:500;white-space:nowrap}\n/* Remove's question takes its own line under the pack's text, in rows and cards. */\n.prow2:has(> .rmline){flex-wrap:wrap;row-gap:10px}\n.prow2 > .rmline{flex:1 1 100%;padding-left:52px}\n.rmline .rmask{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 12px;max-width:72ch;font-size:13px;line-height:1.5}\n\n/* The review: why each pack was picked, and its switch with its state beside it. */\n.rv .prow2 .why{font-size:12.5px;color:var(--muted-foreground)}\n.rv .prow2 .why b{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}\n.swl{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted-foreground)}\n\n/* Narrow, or beside an open sheet: the row wraps, its text full width, the state and action under it. */\n@media (max-width:1100px){\n  .prow2{flex-wrap:wrap;row-gap:10px} .prow2 .pt2{flex:1 1 calc(100% - 52px)}\n  .prow2 .pend{width:100%;min-height:0}\n}\nbody[data-panel=\"open\"] .prow2{flex-wrap:wrap;row-gap:10px}\nbody[data-panel=\"open\"] .prow2 .pt2{flex:1 1 calc(100% - 52px)}\nbody[data-panel=\"open\"] .prow2 .pend{width:100%;min-height:0}\n\n/* Every card the same size: each row as tall as the tallest card, and a description at most three lines (the whole of\n * it in its hover and on the pack's page), so one long description does not stretch them all. */\n.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));grid-auto-rows:1fr;gap:16px}\n.pcard{display:flex;flex-direction:column;gap:12px;padding:18px;min-height:220px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);cursor:pointer;text-align:left;min-width:0}\n.pcard:hover{border-color:var(--border-strong)}\n.pcard .pc-top{display:flex;align-items:center;gap:14px}\n.pcard .pc-top .pc-name{flex:1;min-width:0}\n.pcard .pc-top .pstatus{flex:none;align-self:flex-start}\n.pcard .pc-top .picon{width:40px;height:40px}\n.pcard .pc-top b{display:block;font-size:15px;font-weight:600}\n.pcard .pc-top .kind{display:block;font-size:12px;color:var(--muted-foreground);margin-top:1px}\n.pcard .sub{font-size:13.5px;line-height:1.5;flex:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}\n.pcard .meta{font-size:12.5px;color:var(--muted-foreground)}\n.pcard .pc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;margin-top:auto;border-top:1px solid var(--border);min-height:42px}\n.pcard .pc-foot .btn{margin-left:auto;white-space:nowrap}\n\n/* The pack sheet: its rules as one list, a filter box for a large pack, and Remove pack in a footer that pins to the\n * bottom while the list runs past it and rests at the end when it does not. */\n.pwrap.pack .pbody{display:flex;flex-direction:column;padding-bottom:0}\n.pwrap.pack .pbody > *{flex:none}\n.pwrap.pack .search.pk{margin-top:16px}\n.pwrap.pack .pgrp.flat .prow{padding-left:14px}\n.pwrap.pack .pgrp.flat .prow:first-child{border-top:0}\n.pwrap.pack .pgrp.flat > .pintro{margin:12px 14px}\n.pwrap.pack .pfoot{position:sticky;bottom:0;z-index:2;margin:auto -20px 0;padding:12px 20px;border-top:1px solid var(--border);background:var(--card)}\n.pwrap.pack .pgrp.flat{margin-bottom:32px}\n.pwrap.pack .pfoot .rmask{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 10px;font-size:13px;line-height:1.5}\n\n/* css/create.css */\n/* Create a rule (views/create.js): the sheet's content (sheet.css) as one readable column on the page. */\n\n.cpage{max-width:640px;margin-top:18px}\n.cpage.pbody{overflow:visible;padding:0;flex:none}\n.cpage h1{margin:0;font-size:20px;line-height:28px;font-weight:500;color:var(--header);letter-spacing:-.01em}\n.cpage > .pintro:first-of-type{margin-top:36px}\n.cpage .cmd{margin-top:22px;max-width:52ch;font-size:14px}\n.cpage .cmd + .pintro{margin-top:22px}\n/* Places to start closes the page under one hairline; each place is a line and its buttons, 36px apart. */\n.cpage .psec{margin:32px 0 0;padding-top:32px;border-top:1px solid var(--border);max-width:52ch}\n.cpage.pbody .psec h3{margin:0 0 12px;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--foreground)}\n.cpage .place .pintro{margin-top:0}\n.cpage .place + .place{margin-top:36px}\n.cpage .place .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}\n\n/* css/history.css */\n/* History, by rule (views/history.js): the rules with violations in range, and the chosen rule's violations by day.\n * Every layout rule is History's own (class names `h…`), so History by session (sessions.css) can change apart. */\n\n/* A fixed-height page under the top bar, so the rule list and the violations scroll on their own. */\nbody[data-page=\"history\"] .shell{display:flex;flex-direction:column;height:calc(100vh - var(--tb) - var(--sat) - var(--sab));padding-bottom:12px;overflow:hidden}\nbody[data-page=\"history\"] .cwrap{flex:1;min-height:0}\nbody[data-page=\"history\"] .cmain{display:flex;flex-direction:column;min-height:0;height:100%}\nbody[data-page=\"history\"] #sidenav{position:static;align-self:stretch;height:100%;max-height:none}\nbody[data-page=\"history\"] #content,body[data-page=\"history\"] #content > .history{flex:1;min-height:0;display:flex;flex-direction:column}\n\n/* Heading over both columns; Hide / Show list and the range at its right. */\n.hh{margin:16px 0 0;flex:none}\n.hh h2{font-size:20px;letter-spacing:-.01em;line-height:28px}\n.hh p{margin-top:2px}\n.hh .act{align-self:end}\n/* Beside the rule's sheet the list is already hidden and the rule is open, so Hide list and Open rule go. The sheet\n * sits beside the page above 1100 px (base.css overlays it up to 1100); up to 1180 px that leaves a narrow column,\n * where the range sits under the heading rather than squeezing it, as on a narrow page. */\nbody[data-panel=\"open\"] .hltoggle,body[data-panel=\"open\"] .hdetail .l1 .acts{display:none}\n@media (min-width:1100px) and (max-width:1180px){\n  body[data-panel=\"open\"] .hh{grid-template-columns:minmax(0,1fr)}\n  body[data-panel=\"open\"] .hh .act{grid-column:1;grid-row:auto;justify-content:flex-start;margin-top:8px}\n}\n@media (max-width:900px){\n  .hh{grid-template-columns:minmax(0,1fr)}\n  .hh .act{grid-column:1;grid-row:auto;justify-content:space-between;margin-top:8px}\n}\n.history .rangectl[hidden]{display:none}\n.hempty{margin-top:14px}\n.hempty[hidden]{display:none}\n.hltoggle{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;color:var(--muted-foreground);font-size:12px;white-space:nowrap}\n.hltoggle:hover{background:var(--subtle);color:var(--foreground)}\n\n/* Two columns: the rule list, the chosen rule. */\n.hist{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px 24px;align-items:stretch;margin-top:16px;flex:1;min-height:0}\n.hist[hidden]{display:none}\n.hist.nolist{grid-template-columns:minmax(0,1fr)}\n.hist.nolist > aside{display:none}\n.hist > aside,.hist > section{display:flex;flex-direction:column;min-height:0;min-width:0}\n.hist > aside .hlistbox{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}\n.hist > section .list{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}\n.hscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}\nbody[data-panel=\"open\"] .hist{grid-template-columns:minmax(0,1fr)}\nbody[data-panel=\"open\"] .hist > aside{display:none}\n@media (max-width:900px){\n  body[data-page=\"history\"] .shell{height:auto;overflow:visible}\n  body[data-page=\"history\"] .cwrap{display:flex;flex-direction:column}\n  body[data-page=\"history\"] #sidenav{height:auto}\n  .hist{grid-template-columns:minmax(0,1fr)}\n  .hist > aside .hlistbox{max-height:240px}\n}\n\n/* The list column: search, then the rules. */\n.hsearch{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);color:var(--muted-foreground)}\n.hsearch input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;color:var(--foreground);outline:none}\n.hsearch input::placeholder{color:var(--muted-foreground)}\n.hsearch:focus-within{outline:2px solid var(--ring);outline-offset:1px}\n/* All · Log only · Steered · Declined: which violations the list counts. */\n.hchips{margin:0 0 10px}\n.hlhead{display:flex;justify-content x;align-items:center;gap:5px;color:var(--muted-foreground);font-size:12px}\n.sess .stale::before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--muted-foreground);opacity:.5}\n.shead{padding:16px 18px 8px}\n/* Three lines: the title and its one action; when the session ran; what Rerail saw. One muted colour below the title,\n * the state's dot its only mark. */\n/* The button stays beside the title, which takes two lines before it clamps; once the title would get less than 240px\n * (a phone), the button wraps under it instead of squeezing it. */\n.shead .l1{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px}\n.shead .l1 h2{flex:1 1 240px}\n.shead .l1 h2.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}\n.shead .l1 .acts{flex:none;display:inline-flex;gap:8px}\n.shead .l1 h2{margin:0;font-size:16px;line-height:1.35;font-weight:600;min-width:0;color:var(--header)}\n.shead .l1 h2[hidden]{display:none}\n/* List hidden: the session heading is the picker; a hidden measuring span gives the select the title's own width. */\n.shead .l1 h2.hpick{display:flex;max-width:100%}\n.hpick .sel{position:relative;display:inline-grid;grid-template-columns:minmax(0,auto);min-width:0;max-width:100%;margin:-3px 0 -3px -9px;border-radius:999px}\n.hpick .sel:hover,.hpick .sel:focus-within{background:var(--subtle)}\n.hpick .m{grid-area:1/1;visibility:hidden;white-space:nowrap;overflow:hidden;min-width:0;padding:3px 34px 3px 9px;font:inherit}\n.hpick select{grid-area:1/1;width:100%;min-width:0;appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;color:var(--header);padding:3px 34px 3px 9px;border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.hpick select:focus-visible{outline:2px solid var(--ring);outline-offset:1px}\n.hpick .sel svg{position:absolute;right:11px;top:50%;margin-top:-6px;transform:rotate(90deg);opacity:.7;pointer-events:none}\n.shead .l2{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;margin-top:4px;font-size:12.5px;color:var(--muted-foreground)}\n.shead .l2.when{margin-top:6px}\n.shead .l2 > span{white-space:nowrap}\n.shead .l2 > span + span::before{content:\"·\";margin:0 8px;opacity:.6}\n/* The state keeps the list's dot (live green, silent grey; none once ended) but not its green text. */\n.shead .when .state .dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;vertical-align:1px}\n.shead .when .state[data-state=\"live\"] .dot{background:var(--success)}\n.shead .when .state[data-state=\"stale\"] .dot{background:var(--muted-foreground);opacity:.5}\n.shead .when .state[data-state=\"ended\"] .dot{display:none}\n.pask.sresume{position:relative;margin-top:16px;border:0;border-radius:var(--radius-xl);background:var(--sheet-inset);padding:20px 18px}\n.pask.sresume .cmd{background:var(--card)}\n.pask.sresume .lbl{font-size:14px;font-weight:600;letter-spacing:-.005em;color:var(--foreground);margin:0 0 12px;padding-right:32px}\n.pask.sresume > .x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted-foreground)}\n.pask.sresume > .x:hover{background:var(--subtle);color:var(--foreground)}\n.pask textarea.one{min-height:0;height:54px}\n/* The controls row: the rule dropdown, then Show all events at the right end. */\n.tfilter{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center}\n.tfilter .srule{min-width:0;max-width:100%}\n/* The select fills its label (which draws the chevron), up to 360px and never past the row. */\n.tfilter .srule select{width:100%;max-width:360px;overflow:hidden;text-overflow:ellipsis}\n.tfilter .tall{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;white-space:nowrap}\n.tfilter .tall input{width:15px;height:15px;margin:0;accent-color:var(--brand)}\n.ssearch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px 9px;margin-bottom:8px}\n.ssearch input{flex:1;border:0;background:none;font:inherit;font-size:13px;color:inherit;min-width:0}\n.ssearch input::placeholder{color:var(--muted-foreground)}\n.daygrp{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;width:100%;padding:7px 12px;background:var(--muted);border-top:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);text-align:left}\n.daygrp:first-child{border-top:0}\n/* One line whatever the counts: the day never wraps, and a count too long for the row ends in an ellipsis (its\n * tooltip has it whole). */\n.daygrp .name{flex:none;white-space:nowrap}\n.daygrp .cnt{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:11px}\n.daygrp svg{transition:transform .15s;flex:none}\n.daygrp[aria-expanded=\"true\"] svg{transform:rotate(90deg)}\n.smore{padding:8px 12px;border-top:1px solid var(--border);text-align:center}\n\n/* ---- the transcript ---- */\n.tlwrap{display:grid;grid-template-columns:24px minmax(0,1fr);position:relative}\n.rail{grid-column:1;position:relative}\n.rail .line{position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--border)}\n.rail .tick{position:absolute;left:6px;width:12px;height:12px;border-radius:50%;background:var(--steer-fg);border:2px solid var(--card);box-shadow:0 0 0 1px var(--steer-fg);cursor:pointer;transform:translateY(-6px)}\n.rail .tick:hover{transform:translateY(-6px) scale(1.25)}\n/* A tick takes its card's outcome: yellow for steered, the quiet grey of a logged card. */\n.rail .tick[data-outcome=\"logged\"]{background:var(--log-fg);box-shadow:0 0 0 1px var(--log-fg)}\n.tl{grid-column:2;padding:6px 16px 16px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}\n.tl .turns{display:flex;flex-direction:column;gap:4px}\n.bound{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em;padding:8px 0}\n.bound::after{content:\"\";flex:1;height:1px;background:var(--border)}\n.tlplaces{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);padding:10px 14px;font-size:13px}\n.tlplaces p{margin:0 0 6px;color:var(--muted-foreground)}\n.tlplaces ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}\n.tlplaces li{overflow-wrap:anywhere}\n.tlplaces code{font-family:var(--font-mono);font-size:12px}\n.turn{display:block;padding:8px 0}\n/* \"You\" / \"Agent\" in a 40px column and an 8px gap: the 48px that calls and cards indent by. */\n.msgrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:0 8px;align-items:start;padding:3px 0}\n.msgrow .who{font-size:12px;font-weight:600;color:var(--muted-foreground);line-height:22px;white-space:nowrap}\n.msgrow .msg{font-size:14px;line-height:22px;max-width:74ch;min-width:0;overflow-wrap:break-word;white-space:pre-line}\n.msgrow.u .msg{background:var(--brand-subtle);border-radius:var(--radius-lg);padding:5px 10px;font-weight:500;margin:-1px 0}\n/* A message's time reads like a call's: the same size and colour, at the same right edge (a call's row border and\n * padding, 1px and 8px). */\n.msgrow .mt{font-size:11.5px;line-height:22px;color:var(--muted-foreground);white-space:nowrap;text-align:right;padding-right:9px}\n/* A call's or card's speaker, in the 40px column \"You\" and \"Agent\" sit in, left of its 8px gap. */\n.evt > .spk,.corr > .spk{position:absolute;right:calc(100% + 8px);width:40px;font-size:12px;font-weight:600;line-height:22px;color:var(--muted-foreground);white-space:nowrap}\n.evt > .spk{top:3px}\n/* On the card's first title line (its 13px padding, a 20px line), where the rail's tick centres too. */\n.corr > .spk{top:13px;line-height:20px}\n.corr{position:relative;margin:6px 0 6px 48px;border-radius:var(--radius-xl);background:var(--card);padding:13px 15px;scroll-margin-top:90px}\n.corr[data-outcome=\"logged\"]{background:var(--log-bg)}\n.corr[data-outcome=\"steered\"]{background:var(--steer-bg)}\n.corr.hit{animation:hit 1.2s ease-out}\n@keyframes hit{0%{box-shadow:0 0 0 6px var(--brand-subtle-hover)}100%{box-shadow:0 0 0 0 transparent}}\n/* Title, then the rule id, then the badges, each on its own line. The title opens the rule, underlined on hover. */\n.corr .ch{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:12px;color:var(--muted-foreground)}\n.corr .ch .ctitle{color:var(--foreground);font-weight:600;font-size:13px;line-height:20px;text-align:left;text-underline-offset:2px}\n.corr .ch .ctitle:not(:disabled):hover{text-decoration:underline}\n.corr .ch .ctitle:disabled{cursor:text}\n.corr .ch .mono,.corr .ch .ctitle{max-width:100%;overflow-wrap:anywhere}\n.corr .ch .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}\n.beats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:8px 0 0;font-size:13px}\n.beats dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);padding-top:2px}\n.beats dt.nera{color:var(--brand-foreground)}\n/* A card can be narrow (the rule's sheet open beside it): a long word, id or path wraps inside it, never past its edge. */\n.beats dd{margin:0;min-width:0;overflow-wrap:anywhere}\n/* A declined steer: its red badge beside the outcome's, and the agent's reasons, one per line, however long a word. */\n.corr .badge.declined{background:var(--danger-subtle);color:var(--danger-foreground)}\n.beats dt.reason{color:var(--danger-foreground)}\n.beats dd.reason{white-space:pre-line}\n/* No overflow clip, so the speaker can sit outside the row: the header and the payload round their own corners. */\n.evt{position:relative;margin-left:48px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);margin-top:4px}\n.evt .eh{border-radius:calc(var(--radius-lg) - 1px)}\n.evt[data-open=\"true\"] .eh{border-radius:calc(var(--radius-lg) - 1px) calc(var(--radius-lg) - 1px) 0 0}\n.evt .pay{border-radius:0 0 calc(var(--radius-lg) - 1px) calc(var(--radius-lg) - 1px)}\n.evt.failed{border-color:var(--fail-border)}\n.evt.lvl-outside{border-color:var(--outside-border)}\n.evt .eh{display:grid;grid-template-columns:20px minmax(0,auto) minmax(0,1fr) auto;gap:0 8px;align-items:center;width:100%;padding:5px 8px;text-align:left}\n/* The verb's badge, and an MCP call's \"server · tool\" beside it, which ellipsizes before the row overflows. */\n.evt .eh .vcell{display:flex;align-items:center;gap:6px;min-width:0}\n.evt .eh .vb{flex:none}\n.evt .eh .vtool{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11.5px;color:var(--muted-foreground)}\n.evt .eh:hover{background:var(--subtle)}\n.evt .eh svg{transition:transform .15s;color:var(--muted-foreground)}\n.evt[data-open=\"true\"] .eh svg{transform:rotate(90deg)}\n.vb{font-size:11px;font-weight:600;padding:1px 6px;border-radius:var(--radius-md);background:var(--subtle);color:var(--muted-foreground);white-space:nowrap}\n.lvl-change .vb{background:var(--brand-subtle);color:var(--brand-foreground)}\n.lvl-execute .vb{background:var(--info-subtle);color:var(--info-foreground)}\n.lvl-outside .vb{background:var(--warning-subtle);color:var(--warning-foreground)}\n.lvl-ask .vb,.lvl-delegate .vb{background:var(--success-subtle);color:var(--success-foreground)}\n.tg{font-family:var(--font-mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}\n.tg.desc{font-family:var(--font-sans);font-size:13px}\n.out{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}\n.out > span{flex:none;text-align:right}\n/* Right of a call: an outcome only when it says something (no result, failed, a read's length), then its time; the\n * description to its left takes every other pixel. */\n.out .oc{display:inline-flex;justify-content:flex-end;gap:6px}\n.out .oc:empty{display:none}\n.out .tn{display:none;width:104px;font-family:var(--font-mono);font-size:11px;opacity:.8;overflow:hidden;text-overflow:ellipsis}\n@media (min-width:1600px){.out .tn{display:inline-block}}\nbody[data-panel=\"open\"] .out .tn{display:none}\n/* Where the timeline is narrow (the sheet open beside it, or a small window), a message's time goes under it instead of\n * squeezing it, still at the right edge every time sits on. */\n@media (min-width:1100px){\n  body[data-panel=\"open\"] .msgrow{grid-template-columns:40px minmax(0,1fr)}\n  body[data-panel=\"open\"] .msgrow .mt{grid-column:2;justify-self:end;line-height:18px}\n}\n@media (max-width:760px){\n  .msgrow{grid-template-columns:40px minmax(0,1fr)}\n  .msgrow .mt{grid-column:2;justify-self:end;line-height:18px}\n}\n/* A phone: a call's outcome and time take a second line under it, at the right edge, so a long label never pushes them\n * out. */\n@media (max-width:640px){\n  .evt .eh{grid-template-columns:20px minmax(0,auto) minmax(0,1fr);row-gap:2px}\n  .evt .eh .out{grid-column:2 / -1;justify-self:end}\n}\n.ok{color:var(--success-foreground)}\n.bad{color:var(--danger-foreground);font-weight:600}\n.pay{display:none;border-top:1px solid var(--border);padding:8px 10px 10px 36px;font-size:12.5px;background:var(--nested)}\n.evt[data-open=\"true\"] .pay{display:block}\n.pay dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0}\n.pay dt{color:var(--muted-foreground);font-size:11.5px}\n.pay dd{margin:0;min-width:0;overflow-wrap:anywhere}\n.pay pre{margin:6px 0 0;max-height:220px}\n.pay .diff{margin:6px 0 0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:auto;max-height:260px;font-family:var(--font-mono);font-size:11.5px;background:var(--card)}\n.pay .diff div{padding:1px 8px;white-space:pre}\n.pay .diff .a{background:var(--success-subtle)}\n.pay .diff .d{background:var(--danger-subtle)}\n.pay details{margin-top:8px}\n.pay details summary{font-size:12px;padding:5px 10px}\n.fold{margin:4px 0 0 48px;display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 8px;align-items:center;width:calc(100% - 48px);padding:5px 8px;font-size:12.5px;color:var(--muted-foreground);border:1px dashed var(--border);border-radius:var(--radius-lg);text-align:left}\n.fold:hover{background:var(--subtle)}\n.fold svg{transition:transform .15s}\n.fold[aria-expanded=\"true\"] svg{transform:rotate(90deg)}\n\n/* css/settings.css */\n/* Settings (views/settings.js). */\n\n.settings{display:grid;gap:32px;margin-top:20px;max-width:880px;--measure:560px}\n/* The first heading is the page title; the sections below keep the section size. */\n.settings > section:first-of-type > .ghead h2{font-size:20px;letter-spacing:-.01em;line-height:28px}\n.settings .ghead p{max-width:var(--measure)}\n.srow2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 16px;border-top:1px solid var(--border)}\n.srow2:first-child{border-top:0}\n.srow2 .rt{flex:1;min-width:200px;font-size:14px}\n.srow2 .rt .sub{display:block;font-size:12.5px;color:var(--muted-foreground);margin-top:3px;max-width:var(--measure);line-height:1.5}\n.srow2 .rt .sub .mono{font-size:12px}\n.srow2 .rt .n{display:inline-flex;align-items:center;margin-left:8px;font-size:11.5px;font-weight:500;line-height:16px;color:var(--muted-foreground);background:var(--subtle);padding:1px 7px;border-radius:var(--radius-md)}\n.srow2 .val{font-size:12.5px;color:var(--muted-foreground)}\n/* About Rerail: the version at the row's right, after \"Update available\" while a newer version is out. */\n.srow2 .vrow{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px 12px}\n.srow2 .vrow > span:last-child{color:var(--foreground)}\n.srow2 .badge.info{background:var(--info-subtle);color:var(--info-foreground)}\n.srow2 .rt .sub .relline{display:block;margin-top:6px}\n.srow2 .rel{color:var(--brand-foreground);text-decoration:none;white-space:nowrap}\n.srow2 .rel:hover{text-decoration:underline;text-underline-offset:3px}\n#about{scroll-margin-top:calc(var(--tb, 56px) + 16px)}\n.srow2 .confirm{color:var(--foreground)}\n.srow2 .btns{display:inline-flex;gap:8px;align-items:center}\n/* Clear history's second step: danger text on the danger tint, with a danger stroke so it reads as the final click. */\n.srow2 .btn.danger.solid{background:var(--danger-subtle);border-color:var(--danger-foreground);color:var(--danger-foreground)}\n.srow2 .btn.danger.solid:hover{background:var(--danger-subtle);filter:brightness(.95)}\n.swl{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--muted-foreground)}\n/* Coding agents: name over its state on the left, the one command on the right; agents not on this machine dimmed. */\n.agent{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);font-size:14px}\n.agent:first-child{border-top:0}\n.agent .rt2{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}\n.agent .rt2 .st{font-size:12px;color:var(--muted-foreground)}\n.agent .rt2 .st.on{color:var(--success-foreground)}\n.agent .rt2 .st.warn{color:var(--warning-foreground)}\n.agent .rt2 .tip{font-size:12.5px;line-height:1.5;color:var(--muted-foreground);max-width:var(--measure)}\n.agent > .btn{margin-left:auto;flex:none}\n.agent.off{opacity:.55}\n\n/* css/merge.css */\n/*\n * Merge Assist (views/merge.js): the heading, then off the consent card (what turning it on does, what Rerail found,\n * the button), or on the status strip, the Settings fold and the Conflicts section (cards, then the dismissed ones\n * folded). It reuses the shared heading, list card, badge and empty block (base.css); rows and cards are this page's\n * own (class names `m…`).\n */\n\n.mpage{margin-top:16px;max-width:960px;--measure:72ch}\n.mpage > div:empty{display:none}\n\n/* ---- heading ---- */\n.mhead{display:block;margin:0 0 18px}\n.mhead h2{display:flex;align-items:center;gap:10px;font-size:20px;letter-spacing:-.01em;line-height:28px}\n.mhead .mexp{background:var(--info-subtle);color:var(--info-foreground)}\n.mhead p.pitch{margin:6px 0 0;max-width:var(--measure);font-size:13.5px;line-height:20px;color:var(--muted-foreground)}\n.mnote{margin:0 0 16px}\n.mnote > div{min-width:0}\n\n/* ---- off: the consent card ---- */\n.mconsent{padding:20px 24px 22px}\n.mconsent h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--foreground)}\n.mconsent h3 + ul{margin-top:0}\n.mconsent ul + h3{margin-top:22px}\n.mbul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:13.5px;line-height:1.5;max-width:var(--measure)}\n.mbul li::marker{color:var(--muted-foreground)}\n.mchecks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px;line-height:1.5;max-width:var(--measure)}\n.mchecks li{display:flex;align-items:flex-start;gap:10px}\n.mchecks li > .ico{margin-top:3px}\n.mchecks li.mready > .ico{color:var(--success-foreground)}\n.mchecks li.mnotready > .ico{color:var(--warning-foreground)}\n.mon{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}\n.mon .btn{min-width:196px;justify-content:center}\n.mon p{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted-foreground);flex:1 1 280px}\n\n/* ---- on: the status strip ---- */\n.mstrip{margin-bottom:28px}\n.mcells{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;padding:14px 16px}\n.mcell{display:flex;flex-direction:column;gap:3px;min-width:0}\n.mcell .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}\n.mcell .v{font-size:13px;line-height:1.45;color:var(--foreground);overflow-wrap:anywhere}\n.mcell .v .sub{display:block;font-size:12px;color:var(--muted-foreground
