\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid assignment expressions in assert statements when the name is used outside asserts; the assignment is lost when assertions are disabled.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"assignment-in-assert\",violation:{message:\"Assign `$NAME` in its own statement before the `assert` and assert on `$NAME`; under `python -O` asserts are skipped, so code outside the assert would not see this assignment.\"}}]}},{id:\"ruff-ruf019-unnecessary-key-check\",kind:\"code\",title:\"Ruff RUF019: Unnecessary key check\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use dict.get() instead of testing a key with in and then indexing the dictionary in the same condition; get() returns None for a missing key.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-key-check\",violation:{message:\"If `$D` is a dict, use `$D.get($K)` instead of testing `$K in $D` before reading `$D[$K]`; leave it if `$D` is not a mapping.\"}}]}},{id:\"ruff-ruf020-never-union\",kind:\"code\",title:\"Ruff RUF020: Never union\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove Never and NoReturn from union types; they have no values, so the union equals its other members.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf021-parenthesize-chained-operators\",kind:\"code\",title:\"Ruff RUF021: Parenthesize chained operators\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Parenthesize an and expression that is chained with or, so the operator precedence is explicit.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unparenthesized-and-in-or\",violation:{message:\"Wrap this `and` expression in parentheses, as `(a and b)`, so its precedence under `or` is explicit; the result is unchanged.\"}}]}},{id:\"ruff-ruf022-unsorted-dunder-all\",kind:\"code\",title:\"Ruff RUF022: Unsorted dunder all\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep the names in __all__ sorted: SCREAMING_CASE constants first, then CamelCase classes, then everything else, each group in natural order.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unsorted-dunder-all\",violation:{message:\"Sort `__all__`: SCREAMING_CASE constants first, then CamelCase classes, then the rest, each in natural order (digit runs by number). Leave it if other code relies on the current order.\"}}]}},{id:\"ruff-ruf023-unsorted-dunder-slots\",kind:\"code\",title:\"Ruff RUF023: Unsorted dunder slots\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep the entries of a class's __slots__ in natural sorted order, with digit runs compared by number.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unsorted-dunder-slots\",violation:{message:\"Sort the entries of this `__slots__` in natural order (digit runs by number). Reordering is safe unless other code iterates `__slots__` and relies on the order.\"}}]}},{id:\"ruff-ruf024-mutable-fromkeys-value\",kind:\"code\",title:\"Ruff RUF024: Mutable fromkeys value\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't pass a mutable object such as a list, dict or set as the value to dict.fromkeys; every key shares the same instance.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"mutable-fromkeys-value\",violation:{message:\"Build the dict with a comprehension that creates a fresh value per key, e.g. `{key: [] for key in keys}`; `dict.fromkeys` shares one mutable value across all keys. Leave it if sharing is intended.\"}}]}},{id:\"ruff-ruf026-default-factory-kwarg\",kind:\"code\",title:\"Ruff RUF026: Default factory kwarg\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass the default factory to defaultdict as the first positional argument; a default_factory keyword is stored as an ordinary dictionary entry.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"default-factory-kwarg\",violation:{message:\"Pass the factory positionally, as in `defaultdict(list)`; `default_factory=` is stored as a dict entry and leaves the dict without a default. Leave it if that entry is intended.\"}}]}},{id:\"ruff-ruf028-invalid-formatter-suppression-comment\",kind:\"code\",title:\"Ruff RUF028: Invalid formatter suppression comment\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Place formatter suppression comments between statements, not inside expressions or after decorators, keeping skip comments at a line's end and on comments on their own line.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf030-assert-with-print-message\",kind:\"code\",title:\"Ruff RUF030: Assert with print message\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass the message itself as the assert message instead of a print call; print returns None, so the assertion error is empty.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"assert-with-print-message\",violation:{message:'Replace the `print(...)` message with the text itself, as in `assert cond, \"text\"`, or drop the message when `print` has no arguments; `print` returns None.'}}]}},{id:\"ruff-ruf032-decimal-from-float-literal\",kind:\"code\",title:\"Ruff RUF032: Decimal from float literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass Decimal a string instead of a float literal; a float is already rounded, so the decimal value is not the one written.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"decimal-from-float-literal\",violation:{message:'Pass the number as a string, such as `Decimal(\"1.2345\")`, so it keeps the exact decimal value; keep the float only if its exact binary value is intended.'}}]}},{id:\"ruff-ruf033-post-init-default\",kind:\"code\",title:\"Ruff RUF033: Post init default\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Declare init-only dataclass parameters with their defaults as InitVar fields in the class body, not on the post-init method; the generated constructor ignores those defaults.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"post-init-default\",violation:{message:\"The generated `__init__` ignores `__post_init__` defaults: declare this parameter as an `InitVar` field with this default in the class body and drop the default here, unless only direct calls pass it.\"}}]}},{id:\"ruff-ruf034-useless-if-else\",kind:\"code\",title:\"Ruff RUF034: Useless if else\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid a conditional expression whose two branches are identical; use the value directly, since the condition changes nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"useless-if-else\",violation:{message:\"Both branches are identical, so the condition changes nothing: use the branch value alone, or fix the branch that should differ. Keep the test only if evaluating it has side effects.\"}}]}},{id:\"ruff-ruf037-unnecessary-empty-iterable-within-deque-call\",kind:\"code\",title:\"Ruff RUF037: Unnecessary empty iterable within deque call\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Don't pass an empty list, tuple, dict, set or string as the iterable of a deque; a deque starts empty, so drop it and keep maxlen if it is set.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf040-invalid-assert-message-literal-argument\",kind:\"code\",title:\"Ruff RUF040: Invalid assert message literal argument\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a string as the assert message; a number, boolean, None, ellipsis or bytes literal there is usually a comparison written with a comma by mistake.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"invalid-assert-message-literal\",violation:{message:\"Use a string as the assert message; if this literal was meant to be compared with the condition, write the comparison instead, as in `assert cond == value`.\"}}]}},{id:\"ruff-ruf041-unnecessary-nested-literal\",kind:\"code\",title:\"Ruff RUF041: Unnecessary nested literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Flatten a Literal that wraps another Literal into a single Literal; the nesting adds nothing but noise.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf043-pytest-raises-ambiguous-pattern\",kind:\"code\",title:\"Ruff RUF043: Pytest raises ambiguous pattern\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a raw string or re.escape for the match pattern of pytest.raises; a plain string with regex special characters hides whether a regex or literal text was meant.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"ambiguous-pattern\",violation:{message:\"This `match=` string has regex special characters: make it a raw string (writing doubled backslashes once) if it is a regex, or wrap it in `re.escape(...)` if it is literal text.\"}}]}},{id:\"ruff-ruf046-unnecessary-cast-to-int\",kind:\"code\",title:\"Ruff RUF046: Unnecessary cast to int\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove int() around a value that is already an integer, such as a length, an integer literal or arithmetic on integers.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf048-map-int-version-parsing\",kind:\"code\",title:\"Ruff RUF048: Map int version parsing\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Parse a version string with a real version parser, not by mapping int over its dot-separated parts; versions can contain non-numeric parts.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"map-int-version-parsing\",violation:{message:\"`int` fails on non-numeric version parts such as `post1`; parse with `packaging.version.parse(...)` instead, unless the version is known to be purely numeric.\"}}]}},{id:\"ruff-ruf049-dataclass-enum\",kind:\"code\",title:\"Ruff RUF049: Dataclass enum\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid decorating an enum class with the dataclass decorator; the generated methods can make distinct members compare equal.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"dataclass-enum\",violation:{message:\"Don't decorate an Enum with `@dataclass`: the generated `__eq__` can make distinct members equal. Remove it, or move the fields into a dataclass mixin listed before `Enum`.\"}}]}},{id:\"ruff-ruf051-if-key-in-dict-del\",kind:\"code\",title:\"Ruff RUF051: If key in dict del\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use dict pop with a None default instead of testing a key with in and then deleting it; it removes the key in one step.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"if-key-in-dict-del\",violation:{message:\"Use `$D.pop($K, None)` instead of checking `$K in $D` and then running `del $D[$K]`; keep any comments from the removed lines.\"}}]}},{id:\"ruff-ruf057-unnecessary-round\",kind:\"code\",title:\"Ruff RUF057: Unnecessary round\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove the round call on a value that is already an integer; rounding an integer returns it unchanged.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf058-starmap-zip\",kind:\"code\",title:\"Ruff RUF058: Starmap zip\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass the iterables straight to map instead of calling starmap on zip; zipping only to unpack each tuple again is unnecessary.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf059-unused-unpacked-variable\",kind:\"code\",title:\"Ruff RUF059: Unused unpacked variable\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Prefix unused variables from tuple or list unpacking with an underscore; unused names suggest a mistake or confuse readers.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-ruf060-in-empty-collection\",kind:\"code\",title:\"Ruff RUF060: In empty collection\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid membership tests against an empty list, tuple, set, dict, string or bytes; the result is almost always fixed, so the test hides a mistake or dead code.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf061-legacy-form-pytest-raises\",kind:\"code\",title:\"Ruff RUF061: Legacy form pytest raises\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the context-manager form of pytest raises, warns and deprecated_call instead of passing the callable as an argument; it reads better and accepts extra arguments.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf063-access-annotations-from-class-dict\",kind:\"code\",title:\"Ruff RUF063: Access annotations from class dict\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the dedicated get_annotations function instead of reading annotations from an object's __dict__; direct access is not forward-compatible with deferred annotation evaluation.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf064-non-octal-permissions\",kind:\"code\",title:\"Ruff RUF064: Non octal permissions\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Write file permission modes passed to os, dbm and pathlib functions as octal literals with a 0o prefix; a plain integer such as 644 is decimal and sets different permissions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ruf068-duplicate-entry-in-dunder-all\",kind:\"code\",title:\"Ruff RUF068: Duplicate entry in dunder all\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't list the same name twice in a module's __all__; a repeat has no effect and often hides a copy-paste mistake.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"duplicate-entry\",violation:{message:\"$DUP is already listed earlier in this `__all__` list; remove the repeat, or correct it if another name was meant.\"}}]}},{id:\"ruff-slf001-private-member-access\",kind:\"code\",title:\"Ruff SLF001: Private member access\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid accessing underscore-prefixed members of other objects; use the class's public interface, since private members can change without notice.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-slot000-no-slots-in-str-subclass\",kind:\"code\",title:\"Ruff SLOT000: No slots in str subclass\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Define __slots__ in subclasses of str (enums excepted); without it every instance carries its own attribute dict and uses more memory.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"no-slots-in-str-subclass\",violation:{message:\"Add `__slots__ = ()` to this `str` subclass so instances skip the per-instance `__dict__`; if it assigns instance attributes, list their names in `__slots__` instead.\"}}]}},{id:\"ruff-slot001-no-slots-in-tuple-subclass\",kind:\"code\",title:\"Ruff SLOT001: No slots in tuple subclass\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Define __slots__ in subclasses of tuple; without it every instance carries its own attribute dict and uses more memory.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"no-slots-in-tuple-subclass\",violation:{message:\"Add `__slots__ = ()` to this `tuple` subclass so instances skip the per-instance `__dict__`; leave it if the class assigns instance attributes, which an empty `__slots__` forbids.\"}}]}},{id:\"ruff-slot002-no-slots-in-namedtuple-subclass\",kind:\"code\",title:\"Ruff SLOT002: No slots in namedtuple subclass\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Define __slots__ in classes that subclass a namedtuple or a call-style NamedTuple; without it every instance carries its own attribute dict and uses more memory.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"no-slots-in-namedtuple-subclass\",violation:{message:\"Add `__slots__ = ()` to this named-tuple subclass so instances skip the per-instance `__dict__`; leave it if the class assigns instance attributes, which an empty `__slots__` forbids.\"}}]}},{id:\"ruff-t201-print\",kind:\"code\",title:\"Ruff T201: Print\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a logger instead of print; printed output can leak sensitive data and cannot be configured by clients.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"print-call\",violation:{message:\"Replace this `print` with a `logging` call (`logger.debug`, `logger.info`), or remove it if it was debug output; leave it where the program's job is to write to the terminal.\"}}]}},{id:\"ruff-t203-p-print\",kind:\"code\",title:\"Ruff T203: P print\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a logger instead of pprint; pretty-printed output can leak sensitive data and cannot be configured by clients.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pprint-call\",violation:{message:\"Log the value through `logging` (`pprint.pformat` keeps the layout), or remove this call if it was debug output; leave it where the program's job is to write to the terminal.\"}}]}},{id:\"ruff-tc005-empty-type-checking-block\",kind:\"code\",title:\"Ruff TC005: Empty type checking block\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove type-checking blocks that contain only a pass statement; an empty block does nothing and confuses readers.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"empty-type-checking-block\",violation:{message:\"Delete this `if TYPE_CHECKING:` block; its body is only `pass`, so it does nothing.\"}}]}},{id:\"ruff-tc006-runtime-cast-value\",kind:\"code\",title:\"Ruff TC006: Runtime cast value\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Quote the type expression passed to typing.cast; a quoted type is not evaluated at runtime and every cast call reads the same.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-tc010-runtime-string-union\",kind:\"code\",title:\"Ruff TC010: Runtime string union\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid quoted members in X | Y union types that Python evaluates at runtime; quote the whole union or remove the quotes, since a string cannot be an operand of the | operator.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-td001-invalid-todo-tag\",kind:\"code\",title:\"Ruff TD001: Invalid todo tag\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Label open-work comments with the TODO tag rather than FIXME or XXX; a single tag keeps outstanding work easy to find.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"invalid-todo-tag\",violation:{message:\"Replace the `$D` tag with `TODO` so this note is found with the other open work; leave it if the project gives this tag a separate meaning.\"}}]}},{id:\"ruff-td002-missing-todo-author\",kind:\"code\",title:\"Ruff TD002: Missing todo author\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name an author on every TODO comment so readers know who has the context for the work.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-todo-author\",violation:{message:\"Add the author after `$D`, as `$D(name): ...` or `$D @name: ...`, naming whoever owns the follow-up; if nobody is known, leave it and tell the user.\"}}]}},{id:\"ruff-td003-missing-todo-link\",kind:\"code\",title:\"Ruff TD003: Missing todo link\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Link every TODO comment to an issue or ticket, on the same line or in the comment lines right after it, so the work can be tracked.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-todo-link\",violation:{message:\"Add an issue link or ticket id for this `$D`: a URL or `#123` on the same line, or a URL or id like `PROJ-123` on the next comment line; leave it if no issue exists yet.\"}}]}},{id:\"ruff-td004-missing-todo-colon\",kind:\"code\",title:\"Ruff TD004: Missing todo colon\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Put a colon straight after the TODO tag and its author, so every TODO comment has the same shape.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-todo-colon\",violation:{message:\"Put a colon right after `$D` or its author, as in `$D(name): text`, with the description after the colon.\"}}]}},{id:\"ruff-td005-missing-todo-description\",kind:\"code\",title:\"Ruff TD005: Missing todo description\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Describe the work after a TODO, FIXME or XXX tag instead of leaving the tag bare; readers need to know what is meant to be done.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-todo-description\",violation:{message:\"Say what needs doing after `$D`, on the same comment line (for example `$D(name): what to fix`); if the work is already done, remove the comment instead.\"}}]}},{id:\"ruff-td006-invalid-todo-capitalization\",kind:\"code\",title:\"Ruff TD006: Invalid todo capitalization\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Write the TODO tag in uppercase; lowercase and mixed-case tags are easy to overlook when searching for open work.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"invalid-todo-capitalization\",violation:{message:\"Write the `$D` tag in uppercase as `TODO`.\"}}]}},{id:\"ruff-td007-missing-space-after-todo-colon\",kind:\"code\",title:\"Ruff TD007: Missing space after todo colon\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Put a space after the colon that follows a TODO, FIXME or XXX tag, so the tag and its description stay readable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-space-after-todo-colon\",violation:{message:\"Put a space between the colon after `$D` (and its author, if any) and the description.\"}}]}},{id:\"ruff-tid252-relative-imports\",kind:\"code\",title:\"Ruff TID252: Relative imports\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Prefer absolute imports over relative imports that reach into a parent package; relative imports from the same package are fine.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"parent-relative-import\",violation:{message:\"Replace the relative module `$M` in this import with its absolute dotted path; keep it relative only where the package layout makes an absolute path impractical.\"}}]}},{id:\"ruff-try002-raise-vanilla-class\",kind:\"code\",title:\"Ruff TRY002: Raise vanilla class\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Raise a specific built-in or custom exception instead of the generic base exception classes; callers can then catch it without capturing unrelated errors.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"raise-vanilla-class\",violation:{message:\"Raise a specific built-in exception such as `ValueError` or `RuntimeError`, or define a subclass, instead of `Exception`/`BaseException`, so callers can catch it precisely.\"}}]}},{id:\"ruff-try003-raise-vanilla-args\",kind:\"code\",title:\"Ruff TRY003: Raise vanilla args\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Build exception messages inside a custom exception class instead of passing message text at the raise site; the wording then stays consistent wherever it is raised.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"raise-vanilla-args\",violation:{message:\"Define an exception class that builds this message itself (for example in `__init__`) and raise it with only the varying values. Leave it if a dedicated class would not help callers.\"}}]}},{id:\"ruff-try004-type-check-without-type-error\",kind:\"code\",title:\"Ruff TRY004: Type check without type error\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Raise TypeError instead of a general-purpose built-in exception when a type check fails; callers can then tell a wrong type from a bad value.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"type-check-without-type-error\",violation:{message:\"Raise `TypeError` here: the failed type check is a wrong-type error, not a bad value. Leave it if callers already catch this exception or it is part of the public API.\"}}]}},{id:\"ruff-try201-verbose-raise\",kind:\"code\",title:\"Ruff TRY201: Verbose raise\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a bare raise to re-raise the caught exception instead of raising it again by name; the bare form is the idiomatic way to propagate it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-try203-useless-try-except\",kind:\"code\",title:\"Ruff TRY203: Useless try except\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove exception handlers that only re-raise; the try block adds nothing when every handler immediately raises the same error again.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"reraise-only-handler\",violation:{message:\"This handler only re-raises: drop the `try`/`except` so the error propagates, moving any `else` code after the body and keeping any `finally`.\"}}]}},{id:\"ruff-try300-try-consider-else\",kind:\"code\",title:\"Ruff TRY300: Try consider else\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Move the final return of a try body into an else block; code that runs only on success should not sit under the handlers' protection.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"try-consider-else\",violation:{message:\"Move this `return` into an `else` clause after the handlers so the `try` body holds only the code the handlers guard.\"}}]}},{id:\"ruff-try301-raise-within-try\",kind:\"code\",title:\"Ruff TRY301: Raise within try\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid raising an exception inside a try block that catches it; move the raise into a helper function or restructure so it needs no handler.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"raise-within-try\",violation:{message:\"Move this `raise` out of the `try` body into a helper function, or handle the condition without raising, so this `try` does not catch its own exception. Leave it if it is in a nested function.\"}}]}},{id:\"ruff-try400-error-instead-of-exception\",kind:\"code\",title:\"Ruff TRY400: Error instead of exception\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use the exception logging method instead of error when logging inside an exception handler; it records the traceback.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"error-instead-of-exception\",violation:{message:\"Call `exception(...)` instead of `error(...)` so the traceback of the handled exception is logged. Leave it if this object is not a logger or the traceback is intentionally omitted.\"}}]}},{id:\"ruff-try401-verbose-log-message\",kind:\"code\",title:\"Ruff TRY401: Verbose log message\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't include the caught exception object in an exception log message; the exception call already records it with its traceback.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"verbose-log-message\",violation:{message:\"Remove `$E` from this message: the `exception` call already logs the caught exception and its traceback. Leave it if this logger does not append the traceback.\"}}]}},{id:\"ruff-up001-useless-metaclass-type\",kind:\"code\",title:\"Ruff UP001: Useless metaclass type\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove redundant assignments of type to __metaclass__; Python 3 classes already use type as their metaclass.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"useless-metaclass-type\",violation:{message:\"Remove this `__metaclass__ = type` line; Python 3 classes already use `type` as their metaclass. Keep it only if the code must still run on Python 2.\"}}]}},{id:\"ruff-up003-type-of-primitive\",kind:\"code\",title:\"Ruff UP003: Type of primitive\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the builtin type name directly instead of calling type() on a literal; the type of a literal is known in advance.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up004-useless-object-inheritance\",kind:\"code\",title:\"Ruff UP004: Useless object inheritance\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Omit object from a class's base list; every Python 3 class already inherits from it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"useless-object-inheritance\",violation:{message:\"Remove `object` from the bases of `$NAME`; Python 3 classes inherit from it already. Keep it only if the code must still run on Python 2.\"}}]}},{id:\"ruff-up005-deprecated-unittest-alias\",kind:\"code\",title:\"Ruff UP005: Deprecated unittest alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the current unittest assertion methods instead of their deprecated aliases; the aliases were removed in Python 3.12.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"deprecated-unittest-alias\",violation:{message:\"Replace `self.$ALIAS` with `self.$TARGET`; the alias is deprecated and was removed in Python 3.12. Leave it if this class defines its own `$ALIAS`.\"}}]}},{id:\"ruff-up006-non-pep585-annotation\",kind:\"code\",title:\"Ruff UP006: Non pep585 annotation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use built-in and collections generics such as list[int] instead of typing aliases such as List[int]; the aliases are deprecated since Python 3.9.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up007-non-pep604-annotation-union\",kind:\"code\",title:\"Ruff UP007: Non pep604 annotation union\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write union types as X | Y instead of Union[X, Y]; the union operator is shorter and needs no typing import.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up008-super-call-with-parameters\",kind:\"code\",title:\"Ruff UP008: Super call with parameters\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Call super() without arguments inside methods; passing the class and instance explicitly is redundant on Python 3.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"super-with-class-and-instance\",violation:{message:\"Drop the arguments and call `super()`; inside a method it already uses the enclosing class and the method's first parameter.\"}}]}},{id:\"ruff-up009-utf8-encoding-declaration\",kind:\"code\",title:\"Ruff UP009: Utf8 encoding declaration\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove the UTF-8 encoding declaration comment at the top of a Python file; UTF-8 is already the default source encoding.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"utf8-encoding-declaration\",violation:{message:\"Delete this UTF-8 encoding declaration comment; Python 3 reads source as UTF-8 by default. Keep it only if the file must also run on Python 2.\"}}]}},{id:\"ruff-up010-unnecessary-future-import\",kind:\"code\",title:\"Ruff UP010: Unnecessary future import\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove __future__ imports of features that Python 3 always enables; they have no effect on current Python versions.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-future-import\",violation:{message:\"Remove the unused obsolete names from this `__future__` import, and the whole statement if none remain; Python 3.7 and later always enable them.\"}}]}},{id:\"ruff-up011-lru-cache-without-parameters\",kind:\"code\",title:\"Ruff UP011: Lru cache without parameters\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Drop the empty parentheses from a functools.lru_cache decorator; it works without them, with a default cache size, since Python 3.8.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"lru-cache-without-parameters\",violation:{message:\"Remove the empty parentheses after `lru_cache` in this decorator and write it bare; it defaults to the same cache size. Keep the call only if the code must support Python 3.7 or older.\"}}]}},{id:\"ruff-up012-unnecessary-encode-utf8\",kind:\"code\",title:\"Ruff UP012: Unnecessary encode utf8\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a bytes literal instead of encoding an ASCII string literal, and omit a redundant UTF-8 encoding argument; UTF-8 is already the default.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up013-convert-typed-dict-functional-to-class\",kind:\"code\",title:\"Ruff UP013: Convert typed dict functional to class\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Define typed dictionaries with class syntax instead of the functional TypedDict call; the class form is easier to read.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up014-convert-named-tuple-functional-to-class\",kind:\"code\",title:\"Ruff UP014: Convert named tuple functional to class\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Define named tuples with class syntax instead of the functional NamedTuple call; the class form is easier to read.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up015-redundant-open-modes\",kind:\"code\",title:\"Ruff UP015: Redundant open modes\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Drop redundant flags from the mode passed to open(); text reading is the default, so t, U and a bare r add nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up018-native-literals\",kind:\"code\",title:\"Ruff UP018: Native literals\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write the literal directly instead of calling str, bytes, int, float, bool or complex on a literal or with no arguments.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up019-typing-text-str-alias\",kind:\"code\",title:\"Ruff UP019: Typing text str alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use str instead of typing.Text; Text is an alias of str that only exists for Python 2 compatibility and is deprecated.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"typing-text\",violation:{message:\"Replace this `Text` alias with the builtin `str` (the same type) and drop the import if nothing else uses it; if `str` is rebound in this scope, use `builtins.str`.\"}}]}},{id:\"ruff-up020-open-alias\",kind:\"code\",title:\"Ruff UP020: Open alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the builtin open instead of io.open; in Python 3 they are the same function.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"io-open\",violation:{message:\"Call the builtin `open` instead of `io.open`; they are the same function in Python 3. If `open` is rebound in this scope, use `builtins.open`.\"}}]}},{id:\"ruff-up021-replace-universal-newlines\",kind:\"code\",title:\"Ruff UP021: Replace universal newlines\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass text instead of universal_newlines to subprocess.run; universal_newlines is the legacy name for the same option.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up022-replace-stdout-stderr\",kind:\"code\",title:\"Ruff UP022: Replace stdout stderr\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use capture_output with subprocess.run instead of setting both stdout and stderr to a pipe; it does the same thing in one argument.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up023-deprecated-c-element-tree\",kind:\"code\",title:\"Ruff UP023: Deprecated c element tree\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Import the ElementTree module instead of the deprecated cElementTree one; the C accelerator is used automatically.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"deprecated-c-element-tree\",violation:{message:\"`cElementTree` is deprecated and was removed in Python 3.9; import `xml.etree.ElementTree` instead, which uses the C accelerator automatically. Keep it only for Python 2 code.\"}}]}},{id:\"ruff-up024-os-error-alias\",kind:\"code\",title:\"Ruff UP024: Os error alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the builtin OSError instead of its legacy aliases such as IOError, EnvironmentError, WindowsError and socket.error; since Python 3.3 they are all the same class.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up025-unicode-kind-prefix\",kind:\"code\",title:\"Ruff UP025: Unicode kind prefix\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove the u prefix from string literals; all Python 3 strings are already Unicode.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up026-deprecated-mock-import\",kind:\"code\",title:\"Ruff UP026: Deprecated mock import\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Use the standard library unittest.mock instead of the separate mock package; it has been built into Python since version 3.3.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"import-mock\",violation:{message:\"Import mock from the standard library with `from unittest import mock` (add `as NAME` if it is aliased). Keep the separate package only if the code must still run on Python 2.\"}}]}},{id:\"ruff-up028-yield-in-for-loop\",kind:\"code\",title:\"Ruff UP028: Yield in for loop\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use yield from to delegate to an iterable instead of looping over it and yielding each item.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"yield-in-for-loop\",violation:{message:\"Replace this loop with `yield from $IT` (parenthesize a bare tuple). Keep the loop if its target is declared global or nonlocal, or if callers send values the iterable cannot accept.\"}}]}},{id:\"ruff-up029-unnecessary-builtin-import\",kind:\"code\",title:\"Ruff UP029: Unnecessary builtin import\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove imports of Python 3 builtins from compatibility shims such as builtins, six and io; the names are already available without importing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-builtin-import\",violation:{message:\"Remove the names Python 3 already provides as builtins from this import, and the whole statement if nothing else remains. Keep it only if the code must still run on Python 2.\"}}]}},{id:\"ruff-up030-format-literals\",kind:\"code\",title:\"Ruff UP030: Format literals\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use automatic field numbering in str.format() strings instead of explicit positional indices.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up031-printf-string-formatting\",kind:\"code\",title:\"Ruff UP031: Printf string formatting\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Prefer an f-string or str.format() over printf-style percent formatting; it is more readable and avoids tuple-versus-value surprises.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up032-f-string\",kind:\"code\",title:\"Ruff UP032: F string\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Prefer an f-string over a str.format() call on a string literal; it keeps each value next to its placeholder.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up033-lru-cache-with-maxsize-none\",kind:\"code\",title:\"Ruff UP033: Lru cache with maxsize none\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use functools.cache instead of functools.lru_cache with maxsize=None; it is the same unbounded cache without the call.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"lru-cache-maxsize-none\",violation:{message:\"Replace `lru_cache(maxsize=None)` with `functools.cache` (importing `cache` from functools if needed); it is the same unbounded cache and takes no call.\"}}]}},{id:\"ruff-up034-extraneous-parentheses\",kind:\"code\",title:\"Ruff UP034: Extraneous parentheses\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove redundant doubled parentheses around an expression; one pair is enough.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"extraneous-parentheses\",violation:{message:\"Delete the highlighted inner pair of parentheses; the enclosing parentheses already group this expression, so the meaning is unchanged.\"}}]}},{id:\"ruff-up035-deprecated-import\",kind:\"code\",title:\"Ruff UP035: Deprecated import\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Import names from the module that now provides them instead of a deprecated location, such as collections.abc rather than collections or typing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up036-outdated-version-block\",kind:\"code\",title:\"Ruff UP036: Outdated version block\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove version checks on sys.version_info that are always true or false for the minimum supported Python version; keep only the branch that runs.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up039-unnecessary-class-parentheses\",kind:\"code\",title:\"Ruff UP039: Unnecessary class parentheses\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove empty parentheses after a class name; they are unnecessary when the class has no base classes or keywords.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-class-parentheses\",violation:{message:\"Write the class header without the empty parentheses (`class Name:` instead of `class Name():`); if a comment sits inside them, keep it on its own line.\"}}]}},{id:\"ruff-up041-timeout-error-alias\",kind:\"code\",title:\"Ruff UP041: Timeout error alias\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the builtin TimeoutError instead of socket.timeout or asyncio.TimeoutError; since Python 3.10 and 3.11 they are plain aliases of it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up043-unnecessary-default-type-args\",kind:\"code\",title:\"Ruff UP043: Unnecessary default type args\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Omit the trailing None type arguments from Generator and AsyncGenerator annotations; they are the defaults since Python 3.13.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-up049-private-type-parameter\",kind:\"code\",title:\"Ruff UP049: Private type parameter\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid leading underscores in the type parameter names of generic classes and functions; each parameter is already local to its declaration, so the underscore adds nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"private-type-parameter\",violation:{message:\"Remove the leading underscores from type parameter `$NAME` here and in every use; if the bare name would shadow a variable or builtin, or is not a valid identifier, choose another name.\"}}]}},{id:\"ruff-up050-useless-class-metaclass-type\",kind:\"code\",title:\"Ruff UP050: Useless class metaclass type\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove an explicit type metaclass from a class definition; it is already the default metaclass.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"useless-class-metaclass-type\",violation:{message:\"Remove `metaclass=type` from class `$NAME`; `type` is already the default metaclass. If it is the only argument, drop the parentheses too.\"}}]}},{id:\"ruff-ytt101-sys-version-slice3\",kind:\"code\",title:\"Ruff YTT101: Sys version slice3\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use sys.version_info instead of slicing the first three characters of sys.version; the slice truncates a two-digit minor version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version-slice3\",violation:{message:\"Use `sys.version_info[:2]` (a tuple) instead of `sys.version[:3]`; the slice truncates a two-digit minor version such as 3.10 to 3.1.\"}}]}},{id:\"ruff-ytt102-sys-version2\",kind:\"code\",title:\"Ruff YTT102: Sys version2\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use sys.version_info.minor instead of indexing the third character of sys.version; the character is only the first digit of a two-digit minor version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version2\",violation:{message:'Use `sys.version_info.minor` instead of `sys.version[2]`; the character is only the first digit of the minor version once it has two digits (3.10 gives \"1\").'}}]}},{id:\"ruff-ytt103-sys-version-cmp-str3\",kind:\"code\",title:\"Ruff YTT103: Sys version cmp str3\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info to a tuple instead of comparing sys.version to a string; string order misjudges a two-digit minor version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version-cmp-str3\",violation:{message:\"Compare `sys.version_info` to a tuple such as `sys.version_info >= (3, 9)` instead of ordering `sys.version` against a string; string order misjudges 3.10 as older than 3.9.\"}}]}},{id:\"ruff-ytt201-sys-version-info0-eq3\",kind:\"code\",title:\"Ruff YTT201: Sys version info0 eq3\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info against a tuple instead of testing whether its major version equals 3; the test breaks on a future major version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version-info0-eq3\",violation:{message:\"Replace `sys.version_info[0] == 3` with `sys.version_info >= (3,)`; the equality is false on Python 4 and later.\"}}]}},{id:\"ruff-ytt202-six-py3\",kind:\"code\",title:\"Ruff YTT202: Six py3\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use not six.PY2 instead of six.PY3; six.PY3 is false on Python 4 and later.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"six-py3\",violation:{message:\"Replace `$C` with `not six.PY2` (in a `case` pattern, test `not six.PY2` in a guard instead); `six.PY3` is false on Python 4 and later.\"}}]}},{id:\"ruff-ytt203-sys-version-info1-cmp-int\",kind:\"code\",title:\"Ruff YTT203: Sys version info1 cmp int\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info to a version tuple instead of testing its minor number alone; a minor-only check misjudges a new major version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version-info1-cmp-int\",violation:{message:\"Compare `sys.version_info` to a tuple with the major and minor version, like `sys.version_info >= (3, 9)`, rather than testing `sys.version_info[1]` alone, which misjudges a new major version.\"}}]}},{id:\"ruff-ytt204-sys-version-info-minor-cmp-int\",kind:\"code\",title:\"Ruff YTT204: Sys version info minor cmp int\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info to a version tuple instead of testing its minor attribute alone; a minor-only check misjudges a new major version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version-info-minor-cmp-int\",violation:{message:\"Compare `sys.version_info` to a tuple with the major and minor version, like `sys.version_info >= (3, 9)`, rather than testing `sys.version_info.minor` alone, which misjudges a new major version.\"}}]}},{id:\"ruff-ytt301-sys-version0\",kind:\"code\",title:\"Ruff YTT301: Sys version0\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Read the major version from sys.version_info instead of indexing the first character of sys.version; the first digit is wrong for a two-digit major version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version0\",violation:{message:\"Use `sys.version_info.major` (an int, so compare it to ints, not strings) instead of `sys.version[0]`, which is only the first digit of a two-digit major version.\"}}]}},{id:\"ruff-ytt302-sys-version-cmp-str10\",kind:\"code\",title:\"Ruff YTT302: Sys version cmp str10\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Compare sys.version_info to a tuple instead of comparing sys.version to a one-character string; string order misjudges a two-digit major version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version-cmp-str10\",violation:{message:\"Compare `sys.version_info` to a tuple such as `sys.version_info >= (3,)` instead of comparing `sys.version` to a one-character string; string order misjudges a two-digit major version.\"}}]}},{id:\"ruff-ytt303-sys-version-slice1\",kind:\"code\",title:\"Ruff YTT303: Sys version slice1\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Read the major version from sys.version_info instead of slicing the first character of sys.version; the first digit is wrong for a two-digit major version.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"sys-version-slice1\",violation:{message:\"Use `sys.version_info.major` (an int, so compare it to ints, not strings) instead of `sys.version[:1]`, which is only the first digit of a two-digit major version.\"}}]}},{id:\"ruff-b015-useless-comparison\",kind:\"code\",title:\"Ruff B015: Useless comparison\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove comparisons whose result is discarded; assign, return or assert the result if it was meant to be used.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-f402-import-shadowed-by-loop-var\",kind:\"code\",title:\"Ruff F402: Import shadowed by loop var\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't reuse an imported name as a for-loop variable; the loop silently overwrites the import.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"import-shadowed-by-loop-var\",violation:{message:\"Import `$NAME` shadowed by loop variable\"}}]}},{id:\"ruff-f704-yield-outside-function\",kind:\"code\",title:\"Ruff F704: Yield outside function\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use yield and await only inside function bodies; Python rejects them at module or class level, and yield inside a comprehension.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"yield-outside-function\",violation:{message:\"`yield` or `await` outside of a function\"}}]}},{id:\"ruff-sim102-collapsible-if\",kind:\"code\",title:\"Ruff SIM102: Collapsible if\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Collapse an if whose only statement is another if without else into one if joined with and; version, platform and TYPE_CHECKING checks are exempt.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-sim103-needless-bool\",kind:\"code\",title:\"Ruff SIM103: Needless bool\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Return the condition directly instead of an if/else that returns True in one branch and False in the other.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"needless-bool\",violation:{message:\"Replace this `if`/`else` with one `return` of the condition, negated with `not` if the `if` branch returns `False`.\"}}]}},{id:\"ruff-sim117-multiple-with-statements\",kind:\"code\",title:\"Ruff SIM117: Multiple with statements\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Merge directly nested with statements into one with holding several context managers, except around asyncio, anyio or trio timeout scopes.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"multiple-with-statements\",violation:{message:\"Use a single `with` statement with multiple contexts instead of nested `with` statements\"}}]}},{id:\"ruff-sim118-in-dict-keys\",kind:\"code\",title:\"Ruff SIM118: In dict keys\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Test membership in or iterate over a dict directly instead of calling .keys() on it; the keys view adds nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"in-dict-keys\",violation:{message:\"Use `key in dict` instead of `key in dict.keys()`\"}}]}},{id:\"ruff-sim222-expr-or-true\",kind:\"code\",title:\"Ruff SIM222: Expr or true\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Simplify an or expression holding an always-truthy value such as True or a non-empty literal; the operands after it never run.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"expr-or-true\",violation:{message:\"Drop the operands after the always-truthy value in this `or`; they never run, so the result is that value.\"}}]}},{id:\"ruff-sim223-expr-and-false\",kind:\"code\",title:\"Ruff SIM223: Expr and false\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Simplify an and expression holding an always-falsy value such as False, None, zero or an empty literal; the operands after it never run.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"expr-and-false\",violation:{message:\"Drop the operands after the always-falsy value in this `and`; they never run, so the result is that value.\"}}]}}]},{id:\"react\",name:\"React\",category:\"framework\",covers:\"Linter-equivalent to eslint-plugin-react 7.37.5 and react-hooks 7.1.1, for well-built components and hooks. Also Rerail's own practice rules.\",reason:\"matches React\",version:\"0.1.10\",packageName:\"@neralabs/rerail-pack-react\",honourSuppressionComments:true,rules:[{id:\"react-button-has-type\",kind:\"code\",title:\"eslint-plugin-react button-has-type: Disallow usage of `button` elements without an explicit `type` attribute\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Toolbar.jsx\",text:\"export function Toolbar({ onSave }) {\\n  return \u003cbutton onClick={onSave}>Save\u003c/button>;\\n}\\n\"},passes:{path:\"src/Toolbar.jsx\",text:'export function Toolbar({ onSave }) {\\n  return \u003cbutton type=\"button\" onClick={onSave}>Save\u003c/button>;\\n}\\n'}},doc:{revision:1,description:\"Give every button an explicit type of button, submit or reset; a button without one submits its form by default.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-error-boundaries\",kind:\"code\",title:\"eslint-plugin-react-hooks error-boundaries: Validates usage of error boundaries instead of try/catch for errors in child components\",group:\"eslint-plugin-react-hooks\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Report.jsx\",text:'import { Chart } from \"./Chart\";\\n\\nexport function Report({ data }) {\\n  try {\\n    return \u003cChart data={data} />;\\n  } catch {\\n    return \u003cp>Failed\u003c/p>;\\n  }\\n}\\n'},passes:{path:\"src/Report.jsx\",text:'import { Chart } from \"./Chart\";\\n\\nexport function Report({ data }) {\\n  return \u003cChart data={data} />;\\n}\\n'}},doc:{revision:1,description:\"Build JSX outside try blocks in React components and hooks, and catch rendering errors with an error boundary instead; a try/catch never sees them.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-exhaustive-deps\",kind:\"code\",title:\"eslint-plugin-react-hooks exhaustive-deps: Verifies the list of dependencies for Hooks like useEffect and similar\",group:\"eslint-plugin-react-hooks\",on:true,mode:\"log\",examples:{caught:{path:\"src/Title.jsx\",text:'import { useEffect } from \"react\";\\n\\nexport function Title({ title }) {\\n  useEffect(() => {\\n    document.title = title;\\n  }, []);\\n  return \u003ch1>{title}\u003c/h1>;\\n}\\n'},passes:{path:\"src/Title.jsx\",text:'import { useEffect } from \"react\";\\n\\nexport function Title({ title }) {\\n  useEffect(() => {\\n    document.title = title;\\n  }, [title]);\\n  return \u003ch1>{title}\u003c/h1>;\\n}\\n'}},doc:{revision:1,description:\"List exactly the component values an effect, useCallback, useMemo or useImperativeHandle callback reads in its dependency array; a missing one leaves the callback reading stale values.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-globals\",kind:\"code\",title:\"eslint-plugin-react-hooks globals: Validates against assignment/mutation of globals during render\",group:\"eslint-plugin-react-hooks\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Counter.jsx\",text:\"let renders = 0;\\n\\nexport function Counter() {\\n  renders = renders + 1;\\n  return \u003cp>{renders}\u003c/p>;\\n}\\n\"},passes:{path:\"src/Counter.jsx\",text:'import { useEffect, useRef } from \"react\";\\n\\nexport function Counter() {\\n  const renders = useRef(0);\\n  useEffect(() => {\\n    renders.current += 1;\\n  });\\n  return \u003cp>Counter\u003c/p>;\\n}\\n'}},doc:{revision:1,description:\"Don't reassign variables declared outside a component or hook while it renders; React may render it any number of times, in any order.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Update `$NAME` in an effect or event handler instead of during render, or keep the value in state or a ref; it is declared outside the component or hook.\"}}]}},{id:\"react-hooks-immutability\",kind:\"code\",title:\"eslint-plugin-react-hooks immutability: Validates against mutating props, state, and other values that are immutable\",group:\"eslint-plugin-react-hooks\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Card.jsx\",text:\"export function Card({ user }) {\\n  user.name = user.name.trim();\\n  return \u003ch2>{user.name}\u003c/h2>;\\n}\\n\"},passes:{path:\"src/Card.jsx\",text:\"export function Card({ user }) {\\n  const name = user.name.trim();\\n  return \u003ch2>{name}\u003c/h2>;\\n}\\n\"}},doc:{revision:1,description:\"Avoid mutating props, state, hook results and outer values in React components and hooks, reassigning their locals after render, or reading variables before they are declared.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-purity\",kind:\"code\",title:\"eslint-plugin-react-hooks purity: Validates that components/hooks are pure by checking known-impure functions\",group:\"eslint-plugin-react-hooks\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Stamp.jsx\",text:\"export function Stamp() {\\n  const now = Date.now();\\n  return \u003ctime>{now}\u003c/time>;\\n}\\n\"},passes:{path:\"src/Stamp.jsx\",text:'import { useState } from \"react\";\\n\\nexport function Stamp() {\\n  const [now] = useState(() => Date.now());\\n  return \u003ctime>{now}\u003c/time>;\\n}\\n'}},doc:{revision:1,description:\"Don't call Date.now, Math.random or performance.now while a component or hook renders; their results change from one render to the next.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-refs\",kind:\"code\",title:\"eslint-plugin-react-hooks refs: Validates correct usage of refs, not reading/writing during render\",group:\"eslint-plugin-react-hooks\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Counter.jsx\",text:'import { useRef } from \"react\";\\n\\nexport function Counter() {\\n  const count = useRef(0);\\n  return \u003cp>{count.current}\u003c/p>;\\n}\\n'},passes:{path:\"src/Counter.jsx\",text:'import { useRef } from \"react\";\\n\\nexport function Counter() {\\n  const count = useRef(0);\\n  const onClick = () => {\\n    count.current += 1;\\n  };\\n  return \u003cbutton type=\"button\" onClick={onClick}>Count\u003c/button>;\\n}\\n'}},doc:{revision:1,description:\"Read and write refs only in effects and event handlers, never while a component or hook renders, so what it shows never depends on a value React does not track.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-rules-of-hooks\",kind:\"code\",title:\"eslint-plugin-react-hooks rules-of-hooks: Enforces the Rules of Hooks\",group:\"eslint-plugin-react-hooks\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Profile.jsx\",text:'import { useState } from \"react\";\\n\\nexport function Profile({ user }) {\\n  if (!user) return null;\\n  const [open, setOpen] = useState(false);\\n  return \u003cbutton type=\"button\" onClick={() => setOpen(!open)}>{user.name}\u003c/button>;\\n}\\n'},passes:{path:\"src/Profile.jsx\",text:'import { useState } from \"react\";\\n\\nexport function Profile({ user }) {\\n  const [open, setOpen] = useState(false);\\n  if (!user) return null;\\n  return \u003cbutton type=\"button\" onClick={() => setOpen(!open)}>{user.name}\u003c/button>;\\n}\\n'}},doc:{revision:1,description:\"Call React hooks only at the top level of components and custom hooks, never in conditions, loops, nested callbacks, async functions or after an early return.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-set-state-in-effect\",kind:\"code\",title:\"eslint-plugin-react-hooks set-state-in-effect: Validates against calling setState synchronously in an effect\",group:\"eslint-plugin-react-hooks\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Name.jsx\",text:'import { useEffect, useState } from \"react\";\\n\\nexport function Name({ first, last }) {\\n  const [full, setFull] = useState(\"\");\\n  useEffect(() => {\\n    setFull(first + \" \" + last);\\n  }, [first, last]);\\n  return \u003cp>{full}\u003c/p>;\\n}\\n'},passes:{path:\"src/Name.jsx\",text:'export function Name({ first, last }) {\\n  const full = first + \" \" + last;\\n  return \u003cp>{full}\u003c/p>;\\n}\\n'}},doc:{revision:1,description:\"Avoid setting state synchronously in the body of a useEffect, useLayoutEffect or useInsertionEffect callback; derive the value during render or set it from a subscription callback.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-set-state-in-render\",kind:\"code\",title:\"eslint-plugin-react-hooks set-state-in-render: Validates against setting state during render\",group:\"eslint-plugin-react-hooks\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Total.jsx\",text:'import { useState } from \"react\";\\n\\nexport function Total({ items }) {\\n  const [total, setTotal] = useState(0);\\n  setTotal(items.length);\\n  return \u003cp>{total}\u003c/p>;\\n}\\n'},passes:{path:\"src/Total.jsx\",text:\"export function Total({ items }) {\\n  const total = items.length;\\n  return \u003cp>{total}\u003c/p>;\\n}\\n\"}},doc:{revision:1,description:\"Don't call a state setter unconditionally while a component or hook renders, or inside a useMemo callback; each call can start an infinite render loop.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-hooks-static-components\",kind:\"code\",title:\"eslint-plugin-react-hooks static-components: Validates that components are static, not recreated every render\",group:\"eslint-plugin-react-hooks\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Badge.jsx\",text:\"export function Badge({ label }) {\\n  const Text = () => \u003cspan>{label}\u003c/span>;\\n  return \u003cText />;\\n}\\n\"},passes:{path:\"src/Badge.jsx\",text:\"function Text({ label }) {\\n  return \u003cspan>{label}\u003c/span>;\\n}\\n\\nexport function Badge({ label }) {\\n  return \u003cText label={label} />;\\n}\\n\"}},doc:{revision:1,description:\"Declare components at module level instead of creating them while a component or hook renders; a component created during render remounts and loses its state every render.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Declare $T once outside render (at module level, or a static lookup) and pass what varies as props; a component created during render remounts and loses its state each render.\"}}]}},{id:\"react-iframe-missing-sandbox\",kind:\"code\",title:\"eslint-plugin-react iframe-missing-sandbox: Enforce sandbox attribute on iframe elements\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Preview.jsx\",text:'export function Preview({ url }) {\\n  return \u003ciframe src={url} title=\"Preview\" />;\\n}\\n'},passes:{path:\"src/Preview.jsx\",text:'export function Preview({ url }) {\\n  return \u003ciframe src={url} title=\"Preview\" sandbox=\"allow-scripts\" />;\\n}\\n'}},doc:{revision:1,description:\"Give every iframe a sandbox attribute that lists only valid permissions and never pairs script access with same-origin access.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-jsx-key\",kind:\"code\",title:\"eslint-plugin-react jsx-key: Disallow missing `key` props in iterators/collection literals\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/List.jsx\",text:\"export function List({ items }) {\\n  return \u003cul>{items.map(item => \u003cli>{item.name}\u003c/li>)}\u003c/ul>;\\n}\\n\"},passes:{path:\"src/List.jsx\",text:\"export function List({ items }) {\\n  return \u003cul>{items.map(item => \u003cli key={item.id}>{item.name}\u003c/li>)}\u003c/ul>;\\n}\\n\"}},doc:{revision:1,description:\"Add a key prop to JSX elements in array literals and to those returned from map or Array.from callbacks; React needs keys to track list items between renders.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-jsx-no-comment-textnodes\",kind:\"code\",title:\"eslint-plugin-react jsx-no-comment-textnodes: Disallow comments from being inserted as text nodes\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Banner.jsx\",text:\"export function Banner() {\\n  return (\\n    \u003cdiv>\\n      // TODO: copy\\n      Welcome\\n    \u003c/div>\\n  );\\n}\\n\"},passes:{path:\"src/Banner.jsx\",text:\"export function Banner() {\\n  return (\\n    \u003cdiv>\\n      {/* TODO: copy */}\\n      Welcome\\n    \u003c/div>\\n  );\\n}\\n\"}},doc:{revision:1,description:\"Wrap comments inside JSX children in braces; otherwise the comment text renders on the page.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Comments inside children section of tag should be placed inside braces\"}}]}},{id:\"react-jsx-no-constructed-context-values\",kind:\"code\",title:\"eslint-plugin-react jsx-no-constructed-context-values: Disallows JSX context provider values from taking values that will cause needless rerenders\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/ThemeProvider.jsx\",text:'import { createContext, useState } from \"react\";\\n\\nconst Theme = createContext(null);\\n\\nexport function ThemeProvider({ children }) {\\n  const [dark, setDark] = useState(false);\\n  return \u003cTheme.Provider value={{ dark, setDark }}>{children}\u003c/Theme.Provider>;\\n}\\n'},passes:{path:\"src/ThemeProvider.jsx\",text:'import { createContext, useMemo, useState } from \"react\";\\n\\nconst Theme = createContext(null);\\n\\nexport function ThemeProvider({ children }) {\\n  const [dark, setDark] = useState(false);\\n  const value = useMemo(() => ({ dark, setDark }), [dark]);\\n  return \u003cTheme.Provider value={value}>{children}\u003c/Theme.Provider>;\\n}\\n'}},doc:{revision:1,description:\"Memoize the value passed to a React context provider; an object, array or function created during render gives every consumer a new value and rerenders it.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"constructed-context-value\",violation:{message:\"Wrap this context value in useMemo (a function in useCallback), or move it out of the component when it reads no props or state, so consumers don't rerender on every render.\"}}]}},{id:\"react-jsx-no-duplicate-props\",kind:\"code\",title:\"eslint-plugin-react jsx-no-duplicate-props: Disallow duplicate properties in JSX\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Field.jsx\",text:'export function Field() {\\n  return \u003cinput name=\"email\" type=\"email\" name=\"login\" />;\\n}\\n'},passes:{path:\"src/Field.jsx\",text:'export function Field() {\\n  return \u003cinput name=\"email\" type=\"email\" />;\\n}\\n'}},doc:{revision:1,description:\"Don't give a JSX element the same prop twice; only the last value takes effect.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Remove one of the two `$NAME` props on this element; only the last one takes effect.\"}}]}},{id:\"react-jsx-no-leaked-render\",kind:\"code\",title:\"eslint-plugin-react jsx-no-leaked-render: Disallow problematic leaked values from being rendered\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Inbox.jsx\",text:\"export function Inbox({ count }) {\\n  return \u003cdiv>{count && \u003cspan>{count} new\u003c/span>}\u003c/div>;\\n}\\n\"},passes:{path:\"src/Inbox.jsx\",text:\"export function Inbox({ count }) {\\n  return \u003cdiv>{count > 0 ? \u003cspan>{count} new\u003c/span> : null}\u003c/div>;\\n}\\n\"}},doc:{revision:1,description:\"Use a boolean condition or a ternary for && expressions rendered in JSX; a falsy number on the left, such as 0, is rendered instead of nothing.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"leaked-and\",violation:{message:\"Coerce the left side of this && to a boolean (`!!x` or a comparison such as `x > 0`) or use a ternary with `null`; a falsy number there is rendered as text.\"}}]}},{id:\"react-jsx-no-script-url\",kind:\"code\",title:\"eslint-plugin-react jsx-no-script-url: Disallow usage of `javascript:` URLs\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Menu.jsx\",text:'export function Menu() {\\n  return \u003ca href=\"javascript:void(0)\">Open\u003c/a>;\\n}\\n'},passes:{path:\"src/Menu.jsx\",text:'export function Menu({ onOpen }) {\\n  return \u003cbutton type=\"button\" onClick={onOpen}>Open\u003c/button>;\\n}\\n'}},doc:{revision:1,description:\"Avoid javascript: URLs in link href attributes; React blocks them as a security precaution, so use an event handler instead.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Replace this javascript: URL with an onClick handler (and a button, or a real href); React will block javascript: URLs as a security precaution.\"}}]}},{id:\"react-jsx-no-target-blank\",kind:\"code\",title:'eslint-plugin-react jsx-no-target-blank: Disallow `target=\"_blank\"` attribute without `rel=\"noreferrer\"`',group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Docs.jsx\",text:'export function Docs() {\\n  return \u003ca href=\"https://example.com/docs\" target=\"_blank\">Docs\u003c/a>;\\n}\\n'},passes:{path:\"src/Docs.jsx\",text:'export function Docs() {\\n  return \u003ca href=\"https://example.com/docs\" target=\"_blank\" rel=\"noreferrer\">Docs\u003c/a>;\\n}\\n'}},doc:{revision:2,description:\"Add a noreferrer rel to links that open external or dynamic URLs with target _blank; otherwise the new page can reach back through window.opener.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:'Using target=\"_blank\" without rel=\"noreferrer\" (which implies rel=\"noopener\") is a security risk in older browsers'}}]}},{id:\"react-jsx-no-undef\",kind:\"code\",title:\"eslint-plugin-react jsx-no-undef: Disallow undeclared variables in JSX\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Page.jsx\",text:'export function Page() {\\n  return \u003cHeader title=\"Home\" />;\\n}\\n'},passes:{path:\"src/Page.jsx\",text:'import { Header } from \"./Header\";\\n\\nexport function Page() {\\n  return \u003cHeader title=\"Home\" />;\\n}\\n'}},doc:{revision:1,description:\"Import or declare every component used in JSX in the same file; an undefined component name crashes at render.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"'$NAME' is not defined.\"}}]}},{id:\"react-no-access-state-in-setstate\",kind:\"code\",title:\"eslint-plugin-react no-access-state-in-setstate: Disallow when this.state is accessed within setState\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Counter.jsx\",text:'import React from \"react\";\\n\\nexport class Counter extends React.Component {\\n  increment() {\\n    this.setState({ count: this.state.count + 1 });\\n  }\\n}\\n'},passes:{path:\"src/Counter.jsx\",text:'import React from \"react\";\\n\\nexport class Counter extends React.Component {\\n  increment() {\\n    this.setState(state => ({ count: state.count + 1 }));\\n  }\\n}\\n'}},doc:{revision:1,description:\"Compute class component state updates from the updater callback's previous-state argument instead of this.state; setState batches updates, so this.state may be stale.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-no-array-index-key\",kind:\"code\",title:\"eslint-plugin-react no-array-index-key: Disallow usage of Array index in keys\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Todos.jsx\",text:\"export function Todos({ todos }) {\\n  return \u003cul>{todos.map((todo, index) => \u003cli key={index}>{todo.title}\u003c/li>)}\u003c/ul>;\\n}\\n\"},passes:{path:\"src/Todos.jsx\",text:\"export function Todos({ todos }) {\\n  return \u003cul>{todos.map(todo => \u003cli key={todo.id}>{todo.title}\u003c/li>)}\u003c/ul>;\\n}\\n\"}},doc:{revision:1,description:\"Use a stable id from the item, not the array index, as a list key; index keys mix up state and rendering when items are reordered, inserted or removed.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.d.ts\"]},clauses:[{id:\"index-key\",violation:{message:\"Key this element by a stable id from the item instead of the array index; keep the index only for a static list that is never reordered, filtered or inserted into.\"}}]}},{id:\"react-no-children-prop\",kind:\"code\",title:\"eslint-plugin-react no-children-prop: Disallow passing of children as props\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Card.jsx\",text:'import { Panel } from \"./Panel\";\\n\\nexport function Card() {\\n  return \u003cPanel children=\"Hello\" />;\\n}\\n'},passes:{path:\"src/Card.jsx\",text:'import { Panel } from \"./Panel\";\\n\\nexport function Card() {\\n  return \u003cPanel>Hello\u003c/Panel>;\\n}\\n'}},doc:{revision:1,description:\"Nest children between JSX tags, or pass them as extra createElement arguments, instead of passing a children prop.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/* d DOM, such as a tooltip's position.\"}}]}},{id:\"react-no-did-update-set-state\",kind:\"code\",title:\"eslint-plugin-react no-did-update-set-state: Disallow usage of setState in componentDidUpdate\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Search.jsx\",text:'import React from \"react\";\\n\\nexport class Search extends React.Component {\\n  componentDidUpdate() {\\n    this.setState({ query: this.props.query });\\n  }\\n}\\n'},passes:{path:\"src/Search.jsx\",text:'import React from \"react\";\\n\\nexport class Search extends React.Component {\\n  render() {\\n    return \u003cp>{this.props.query}\u003c/p>;\\n  }\\n}\\n'}},doc:{revision:1,description:\"Avoid calling setState in componentDidUpdate; it triggers a second render after every update and can loop.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Derive this value from props during render instead of calling setState in componentDidUpdate; leave it only when a prevProps or prevState check guards it.\"}}]}},{id:\"react-no-direct-mutation-state\",kind:\"code\",title:\"eslint-plugin-react no-direct-mutation-state: Disallow direct mutation of this.state\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Counter.jsx\",text:'import React from \"react\";\\n\\nexport class Counter extends React.Component {\\n  increment() {\\n    this.state.count = this.state.count + 1;\\n  }\\n}\\n'},passes:{path:\"src/Counter.jsx\",text:'import React from \"react\";\\n\\nexport class Counter extends React.Component {\\n  increment() {\\n    this.setState(state => ({ count: state.count + 1 }));\\n  }\\n}\\n'}},doc:{revision:1,description:\"Update class component state with setState() instead of assigning to this.state outside the constructor; direct mutation doesn't trigger a re-render.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",
