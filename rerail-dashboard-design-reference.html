 is deprecated, so cancel pending work when the component unmounts instead.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Remove this isMounted() check, and cancel the pending work when the component unmounts instead.\"}}]}},{id:\"react-no-object-type-as-default-prop\",kind:\"code\",title:\"eslint-plugin-react no-object-type-as-default-prop: Disallow usage of referential-type variables as default param in functional component\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Tags.jsx\",text:\"export function Tags({ items = [] }) {\\n  return \u003cul>{items.map(item => \u003cli key={item}>{item}\u003c/li>)}\u003c/ul>;\\n}\\n\"},passes:{path:\"src/Tags.jsx\",text:\"const NO_ITEMS = [];\\n\\nexport function Tags({ items = NO_ITEMS }) {\\n  return \u003cul>{items.map(item => \u003cli key={item}>{item}\u003c/li>)}\u003c/ul>;\\n}\\n\"}},doc:{revision:1,description:\"Avoid object, array, function, JSX and other newly created values as destructured prop defaults in function components; each render gets a new reference.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-no-render-return-value\",kind:\"code\",title:\"eslint-plugin-react no-render-return-value: Disallow usage of the return value of ReactDOM.render\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/main.jsx\",text:'import ReactDOM from \"react-dom\";\\nimport { App } from \"./App\";\\n\\nconst app = ReactDOM.render(\u003cApp />, document.getElementById(\"root\"));\\nexport default app;\\n'},passes:{path:\"src/main.jsx\",text:'import ReactDOM from \"react-dom\";\\nimport { App } from \"./App\";\\n\\nReactDOM.render(\u003cApp />, document.getElementById(\"root\"));\\n'}},doc:{revision:1,descrip entities or string expressions; a stray quote there is often a leftover from a string or attribute.`,scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"double-quote\",violation:{message:`Write this \" in JSX text as &quot; or wrap it in a {'\"'} string expression.`}}]}},{id:\"react-no-unknown-property\",kind:\"code\",title:\"eslint-plugin-react no-unknown-property: Disallow usage of unknown DOM property\",group:\"eslint-plugin-react\",on:true,mode:\"steer\",examples:{caught:{path:\"src/Field.jsx\",text:'export function Field() {\\n  return \u003clabel class=\"field\">Name\u003c/label>;\\n}\\n'},passes:{path:\"src/Field.jsx\",text:'export function Field() {\\n  return \u003clabel className=\"field\">Name\u003c/label>;\\n}\\n'}},doc:{revision:1,description:\"Use only attribute names React knows on DOM elements, in its spelling and on elements that support them; React ignores or warns about others.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"react-no-unsafe\",kind:\"code\",title:\"eslint-plugin-react no-unsafe: Disallow usage of unsafe lifecycle methods\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Profile.jsx\",text:'import React from \"react\";\\n\\nexport class Profile extends React.Component {\\n  UNSAFE_componentWillMount() {\\n    this.load();\\n  }\\n}\\n'},passes:{path:\"src/Profile.jsx\",text:'import React from \"react\";\\n\\nexport class Profile extends React.Component {\\n  componentDidMount() {\\n    this.load();\\n  }\\n}\\n'}},doc:{revision:1,description:\"Avoid the UNSAFE_componentWillMount, UNSAFE_componentWillReceiveProps and UNSAFE_componentWillUpdate lifecycle methods in class components; they break under async rendering.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*. hout children as self-closing tags instead of an empty opening and closing pair.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"upstream\",violation:{message:\"Empty components are self-closing\"}}]}},{id:\"react-void-dom-elements-no-children\",kind:\"code\",title:\"eslint-plugin-react void-dom-elements-no-children: Disallow void DOM elements (e.g. `\u003cimg />`, `\u003cbr />`) from receiving children\",group:\"eslint-plugin-react\",on:false,mode:\"steer\",examples:{caught:{path:\"src/Avatar.jsx\",text:\"export function Avatar({ url }) {\\n  return \u003cimg src={url}>avatar\u003c/img>;\\n}\\n\"},passes:{path:\"src/Avatar.jsx\",text:'export function Avatar({ url }) {\\n  return \u003cimg src={url} alt=\"avatar\" />;\\n}\\n'}},doc:{revision:1,description:\"Don't give void DOM elements such as img, br and input children or a dangerouslySetInnerHTML prop; React throws when they have content.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[]},clauses:[{id:\"jsx-children\",violation:{message:\"Void DOM element cannot receive children.\"}}]}},{id:\"react-practice-callback-for-dom-only\",kind:\"code\",title:\"React practice: useCallback whose result only built-in elements or direct calls use\",group:\"React practice\",on:true,mode:\"steer\",examples:{caught:{path:\"src/components/SaveButton.tsx\",text:`import { useCallback } from 'react';\n\nexport const SaveButton = ({ onSave }: { onSave: () => void }) => {\n  const handleClick = useCallback(() => {\n    onSave();\n  }, [onSave]);\n\n  return \u003cbutton type=\"button\" onClick={handleClick}>Save\u003c/button>;\n};\n`},passes:{path:\"src/components/SaveButton.tsx\",text:'export const SaveButton = ({ onSave }: { onSave: () => void }) => {\\n  const handleClick = () => {\\n    onSave();\\n  };\\n\\n  return \u003cbutton type=\"button\" onClick={handleClick}>Save\u003c/button>;\\n};\\n'}},doc:{revision:1,description:\"Don't wrap a function in useCallback when it is only called or passed to built-in elements' event props; nothing reads its identity, so the memo is wasted work.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/*.test.*\",\"**/*.spec.*\",\"**/*.cy.*\",\"**/__tests__/**\",\"**/test/**\",\"**/tests/**\",\"**/e2e/**\",\"**/__mocks__/**\",\"**/*.stories.*\",\"**/*.story.*\",\"**/__stories__/**\",\"**/__fixtures__/**\",\"**/fixtures/**\",\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.d.ts\"]},clauses:[{id:\"shared\"}]}},{id:\"react-practice-fresh-dependency\",kind:\"code\",title:\"React practice: Hook dependency rebuilt on every render\",group:\"React practice\",on:true,mode:\"steer\",examples:{caught:{path:\"src/components/TodoList.tsx\",text:\"import { useEffect, useState } from 'react';\\n\\ntype Todo = { id: string; done: boolean };\\n\\nexport function TodoList({ todos, onCount }: { todos: Todo[]; onCount: (n: number) => void }) {\\n  const [shown, setShown] = useState(0);\\n  const open = todos.filter((todo) => !todo.done);\\n  useEffect(() => {\\n    onCount(open.length);\\n  }, [open, onCount]);\\n  return \u003cp onClick={() => setShown(shown + 1)}>{open.length}\u003c/p>;\\n}\\n\"},passes:{path:\"src/components/TodoList.tsx\",text:\"import { useEffect, useMemo } from 'react';\\n\\ntype Todo = { id: string; done: boolean };\\n\\nexport function TodoList({ todos, onCount }: { todos: Todo[]; onCount: (n: number) => void }) {\\n  const open = useMemo(() => todos.filter((todo) => !todo.done), [todos]);\\n  useEffect(() => {\\n    onCount(open.length);\\n  }, [open, onCount]);\\n  return \u003cp>{open.length}\u003c/p>;\\n}\\n\"}},doc:{revision:1,description:\"Keep values rebuilt on every render, such as filter or map results and the props object, out of effect, memo and callback dependency arrays.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/*.test.*\",\"**/*.spec.*\",\"**/*.cy.*\",\"**/__tests__/**\",\"**/test/**\",\"**/tests/**\",\"**/e2e/**\",\"**/__mocks__/**\",\"**/*.stories.*\",\"**/*.story.*\",\"**/__stories__/**\",\"**/__fixtures__/**\",\"**/fixtures/**\",\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.d.ts\"]},clauses:[{id:\"shared\"}]}},{id:\"react-practice-side-effect-in-render\",kind:\"code\",title:\"React practice: Navigation, analytics or dispatch called during render\",group:\"React practice\",on:true,mode:\"steer\",examples:{caught:{path:\"app/settings/billing/page-view.tsx\",text:\"'use client';\\nimport { useRouter } from 'next/navigation';\\nimport { useSession } from '@/lib/session';\\n\\nexport default function BillingView() {\\n  const router = useRouter();\\n  const { status } = useSession();\\n  if (status === 'signed-out') {\\n    router.replace(`/login?next=${encodeURIComponent('/settings/billing')}`);\\n  }\\n  return \u003cBillingForm />;\\n}\\n\"},passes:{path:\"app/settings/billing/page-view.tsx\",text:\"'use client';\\nimport { useEffect } from 'react';\\nimport { useRouter } from 'next/navigation';\\nimport { useSession } from '@/lib/session';\\n\\nexport default function BillingView() {\\n  const router = useRouter();\\n  const { status } = useSession();\\n  useEffect(() => {\\n    if (status === 'signed-out') router.replace('/login');\\n  }, [status, router]);\\n  return \u003cBillingForm />;\\n}\\n\"}},doc:{revision:1,description:\"Don't na nimport { saveProfile } from \"../api/profile\";\\nimport { toast } from \"../ui/toast\";\\n\\nexport const ProfileForm = ({ profile, onClose }: { profile: { id: string }; onClose: () => void }) => {\\n  const queryClient = useQueryClient();\\n  const save = useMutation({\\n    mutationFn: saveProfile,\\n    onSuccess: () => queryClient.invalidateQueries({ queryKey: [\"profile\", profile.id] }),\\n  });\\n\\n  const onSubmit = (name: string) => {\\n    save.mutate(\\n      { id: profile.id, name },\\n      {\\n        onSuccess: () => {\\n          toast(\"Saved\");\\n          onClose();\\n        },\\n      },\\n    );\\n  };\\n\\n  return \u003cbutton onClick={() => onSubmit(\"Ada\")}>Save\u003c/button>;\\n};\\n'}},doc:{revision:1,description:\"Update the query cache in a mutation's own options, not in callbacks passed to mutate(); those are dropped if the component unmounts before the mutation finishes.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/*.test.*\",\"**/*.spec.*\",\"**/*.cy.*\",\"**/__tests__/**\",\"**/test/**\",\"**/tests/**\",\"**/e2e/**\",\"**/__mocks__/**\",\"**/*.stories.*\",\"**/*.story.*\",\"**/__stories__/**\",\"**/__fixtures__/**\",\"**/fixtures/**\",\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.d.ts\"]},clauses:[{id:\"shared\"}]}},{id:\"react-practice-mounted-ref-never-reset\",kind:\"code\",title:\"React practice: Mount ref set false in cleanup and never set back to true\",group:\"React practice\",on:true,mode:\"steer\",examples:{caught:{path:\"src/components/OrderPanel.tsx\",text:\"import { useEffect, useRef, useState } from 'react';\\n\\nexport const OrderPanel = ({ id }: { id: string }) => {\\n  const [order, setOrder] = useState(null);\\n  const i/teams';\\n\\nexport const TeamPicker = ({ ownerId }: { ownerId: string }) => {\\n  const owner = useQuery({ queryKey: ['owner', ownerId], queryFn: () => getOwner(ownerId) });\\n  return \u003cp>{owner.data?.name}\u003c/p>;\\n};\\n\"}},doc:{revision:1,description:\"Fetch server data with a query hook in files that already use a data-fetching library, not with a request in useEffect saved to useState; the library handles caching and races.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/*.test.*\",\"**/*.spec.*\",\"**/*.cy.*\",\"**/__tests__/**\",\"**/test/**\",\"**/tests/**\",\"**/e2e/**\",\"**/__mocks__/**\",\"**/*.stories.*\",\"**/*.story.*\",\"**/__stories__/**\",\"**/__fixtures__/**\",\"**/fixtures/**\",\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.d.ts\"]},clauses:[{id:\"shared\"}]}},{id:\"react-practice-hoist-static-value\",kind:\"code\",title:\"React practice: Value that reads nothing from the component, built every render\",group:\"React practice\",on:true,mode:\"steer\",examples:{caught:{path:\"src/settings/ShortcutTable.tsx\",text:\"import { Table } from './Table';\\n\\nexport const ShortcutTable = () => {\\n  const columns = [\\n    { title: 'Action', key: 'action' },\\n    { title: 'Keys', key: 'keys' },\\n  ];\\n  return \u003cTable columns={columns} />;\\n};\\n\"},passes:{path:\"src/settings/ShortcutTable.tsx\",text:\"import { Table } from './Table';\\n\\nconst columns = [\\n  { title: 'Action', key: 'action' },\\n  { title: 'Keys', key: 'keys' },\\n];\\n\\nexport const ShortcutTable = () => \u003cTable columns={columns} />;\\n\"}},doc:{revision:1,description:\"Move objects, arrays and functions that read nothing from a component or hook to module scope when they are passed to child components, custom hooks or dependency arrays.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/*.test.*\",\"**/*.spec.*\",\"**/*.cy.*\",\"**/__tests__/**\",\"**/test/**\",\"**/tests/**\",\"**/e2e/**\",\"**/__mocks__/**\",\"**/*.stories.*\",\"**/*.story.*\",\"**/__stories__/**\",\"**/__fixtures__/**\",\"**/fixtures/**\",\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.d.ts\"]},clauses:[{id:\"shared\"}]}},{id:\"react-practice-lifecycle-hook\",kind:\"code\",title:\"React practice: Run-once lifecycle hook reading component values\",group:\"React practice\",on:true,mode:\"steer\",examples:{caught:{path:\"src/components/InvoiceHeader.tsx\",text:\"import { useState } from 'react';\\nimport { useMount } from 'react-use';\\n\\nexport const InvoiceHeader = ({ invoiceId }: { invoiceId: string }) => {\\n  const [title, setTitle] = useState('');\\n  useMount(() => {\\n    setTitle(`Invoice ${invoiceId}`);\\n  });\\n  return \u003ch1>{title}\u003c/h1>;\\n};\\n\"},passes:{path:\"src/components/InvoiceHeader.tsx\",text:\"import { useEffect, useState } from 'react';\\n\\nexport const InvoiceHeader = ({ invoiceId }: { invoiceId: string }) => {\\n  const [title, setTitle] = useState('');\\n  useEffect(() => {\\n    setTitle(`Invoice ${invoiceId}`);\\n  }, [invoiceId]);\\n  return \u003ch1>{title}\u003c/h1>;\\n};\\n\"}},doc:{revision:1,description:\"Use useEffect instead of once-on-mount hooks from hook libraries when the callback reads props or state; those hooks hide the reads from dependency checks.\",scope:{include:[\"**/*.ts\",\"**/*.mts\",\"**/*.cts\",\"**/*.tsx\",\"**/*.js\",\"**/*.jsx\",\"**/*.mjs\",\"**/*.cjs\"],exclude:[\"**/*.test.*\",\"**/*.spec.*\",\"**/*.cy.*\",\"**/__tests__/**\",\"**/test/**\",\"**/tests/**\",\"**/e2e/**\",\"**/__mocks__/**\",\"**/*.stories.*\",\"**/*.story.*\",\"**/__stories__/**\",\"**/__fixtures__/**\",\"**/fixtures/**\",\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\",\"**/*.d.ts\"]},clauses:[{id:\"shared\"}]}}]},{id:\"rust\",name:\"Rust\",category:\"language\",covers:\"Linter-equivalent to Clippy 0.1.99 (Rust 1.99.0), for readable, idiomatic Rust.\",reason:\"matches Rust\",version:\"0.1.7\",packageName:\"@neralabs/rerail-pack-rust\",honourSuppressionComments:true,rules:[{id:\"clippy-needless-arbitrary-self-type\",kind:\"code\",title:\"Clippy needless_arbitrary_self_type: Type of `self` parameter is already by default `Self`\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write a Rust method receiver as self, &self or &mut self instead of spelling out its Self type.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"self-explicit-self\",violation:{message:\"Write this receiver as self or mut self instead of self: Self.\"}}]}},{id:\"clippy-redundant-at-rest-pattern\",kind:\"code\",title:\"Clippy redundant_at_rest_pattern: Checks for `[all @ ..]` where `all` would suffice\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:1,description:\"Bind a whole Rust slice directly instead of through a slice pattern holding only a rest binding.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"redundant-slice-rest-binding\",violation:{message:\"Bind the whole slice directly, e.g. rest instead of [rest @ ..].\"}}]}},{id:\"clippy-needless-else\",kind:\"code\",title:\"Clippy needless_else: Empty else branch\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove empty else blocks, with no code or comment, from Rust if statements.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"empty-else-block\",violation:{message:\"Remove this empty else block.\"}}]}},{id:\"clippy-octal-escapes\",kind:\"code\",title:\"Clippy octal_escapes: String escape sequences looking like octal characters\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid a null escape followed by digits in Rust string literals; Rust has no octal escapes, so it yields a NUL then digits, not the intended character.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"octal-escape\",violation:{message:\"Replace this \\\\0 escape with the intended character, e.g. \\\\x1b for \\\\033, or \\\\x00 then the digits if NUL was meant.\"}}]}},{id:\"clippy-needless-raw-string-hashes\",kind:\"code\",title:\"Clippy needless_raw_string_hashes: Suggests reducing the number of hashes around a raw string literal\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use no more hashes on a Rust raw string literal than its contents need to close it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"hashes-1\",violation:{message:\"Remove the extra # marks from this raw string, keeping only as many as its contents need to close it.\"}}]}},{id:\"clippy-single-component-path-imports\",kind:\"code\",title:\"Clippy single_component_path_imports: Imports with single component path are redundant\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove private imports of a bare crate name in Rust 2018 and later; the crate is already in scope without them.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"single-component-import\",violation:{message:\"Remove this use of a bare crate name; the crate is already in scope.\"}}]}},{id:\"clippy-many-single-char-names\",kind:\"code\",title:\"Clippy many_single_char_names: Too many single character bindings\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:1,description:\"Avoid more than four single-character variable names in scope at once in a Rust function, tests excluded; descriptive names are easier to follow.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"many-single-char-names\",violation:{message:\"Rename some of these single-letter variables to descriptive names; more than four are in scope here.\"}}]}},{id:\"clippy-builtin-type-shadow\",kind:\"code\",title:\"Clippy builtin_type_shadow: Shadowing a builtin type\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't name a Rust generic type parameter after a primitive type such as u32 or bool; it shadows the real type inside the item.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"builtin-type-shadow\",violation:{message:\"Rename this type parameter, e.g. T instead of u32, so it doesn't shadow the primitive type.\"}}]}},{id:\"clippy-inconsistent-digit-grouping\",kind:\"code\",title:\"Clippy inconsistent_digit_grouping: Integer literals with digits grouped inconsistently\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Group the digits of Rust decimal literals with underscores in equal-size groups, the same way in the integer part and the fraction.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"inconsistent\",violation:{message:\"Regroup this literal's digits with underscores into equal-size groups, e.g. 1_000_000 instead of 1_0000_00.\"}}]}},{id:\"clippy-int-plus-one\",kind:\"code\",title:\"Clippy int_plus_one: Instead of using `x >= y + 1`, use `x > y`\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Use a strict comparison in Rust instead of a non-strict one that adds or subtracts one; it states the bound directly.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"ge-adjusted\",violation:{message:\"Use > and drop the one here, e.g. x > y instead of x >= y + 1 or x - 1 >= y.\"}}]}},{id:\"clippy-large-digit-groups\",kind:\"code\",title:\"Clippy large_digit_groups: Grouping digits into groups that are too large\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Keep underscore-separated digit groups in Rust decimal literals to four digits or fewer; longer groups defeat the separators.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"large\",violation:{message:\"Split this literal into digit groups of four or fewer, e.g. 1_000_000 instead of 1_000000.\"}}]}},{id:\"clippy-mixed-case-hex-literals\",kind:\"code\",title:\"Clippy mixed_case_hex_literals: Hex literals whose letter digits are not consistently upper- or lowercased\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Use one letter case for the digits of a Rust hexadecimal literal, all upper or all lower.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"mixed-case-hex-literals\",violation:{message:\"Use one letter case for this hex literal's digits, e.g. 0xABCD or 0xabcd, not 0xAbCd.\"}}]}},{id:\"clippy-partial-pub-fields\",kind:\"code\",title:\"Clippy partial_pub_fields: Partial fields of a struct are public\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Make a Rust struct's fields either all pub or all non-pub; mixing them blurs what the type exposes.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"clippy-precedence\",kind:\"code\",title:\"Clippy precedence: Operations where precedence may be unclear\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:3,description:\"Parenthesize arithmetic used as an operand of a shift or bitwise operator in Rust; the precedence is easy to misread.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shift-with-arithmetic\",violation:{message:\"Add parentheses around the arithmetic in this shift, e.g. (a + b) \u003c\u003c c, to make the order explicit.\"}}]}},{id:\"clippy-precedence-bits\",kind:\"code\",title:\"Clippy precedence_bits: Operations mixing bit shifting with bit combining/masking\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:4,description:\"Parenthesize shifts used as operands of a bitwise AND, OR or XOR in Rust; the precedence is easy to misread.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"bitwise-with-shift\",violation:{message:\"Add parentheses around the shift in this bitwise expression, e.g. (a \u003c\u003c 4) | b.\"}}]}},{id:\"clippy-unneeded-wildcard-pattern\",kind:\"code\",title:\"Clippy unneeded_wildcard_pattern: Tuple and struct patterns with a wildcard pattern (`_`) is next to a rest pattern (`..`)\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Remove wildcard patterns next to a rest pattern in Rust; the rest pattern already ignores those elements.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"wildcards-before-rest\",violation:{message:\"Remove the _ wildcards before this ..; the rest pattern already skips them.\"}}]}},{id:\"clippy-unusual-byte-groupings\",kind:\"code\",title:\"Clippy unusual_byte_groupings: Binary or hex literals that aren't grouped by four\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Split Rust binary, octal and hexadecimal literals into equal-size digit groups; uneven groups hide the bit layout.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unusual\",violation:{message:\"Regroup this literal's digits into equal-size groups, e.g. 0xFFFF_FFFF or 0b1010_1010.\"}}]}},{id:\"clippy-zero-prefixed-literal\",kind:\"code\",title:\"Clippy zero_prefixed_literal: Integer literals starting with `0`\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid leading zeros on Rust decimal literals; Rust doesn't read them as octal, so use an explicit octal prefix or drop the zero.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"zero-prefixed-literal\",violation:{message:\"Drop the leading zero from this literal, or use the 0o prefix if you meant octal.\"}}]}},{id:\"clippy-allow-attributes-without-reason\",kind:\"code\",title:\"Clippy allow_attributes_without_reason: Ensures that all `allow` and `expect` attributes have a reason\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Give every #[allow] and #[expect] attribute in Rust a reason; it tells later readers why the lint is silenced.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"allow-without-reason\",violation:{message:'Add a reason to this attribute, e.g. #[allow(dead_code, reason = \"why\")], saying why the lint is silenced.'}}]}},{id:\"clippy-allow-attributes\",kind:\"code\",title:\"Clippy allow_attributes: `#[allow]` will not trigger if a warning isn't found. `#[expect]` triggers if there are no warnings\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use #[expect] instead of outer #[allow] attributes in Rust; an expect warns once the lint it silences stops firing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"allow-attribute\",violation:{message:\"Replace this #[allow] with #[expect] so it warns once the silenced lint stops firing.\"}}]}},{id:\"clippy-decimal-literal-representation-threshold\",kind:\"code\",title:\"Clippy decimal_literal_representation: Using decimal representation when hexadecimal would be better (literal-representation-threshold = 0xFFFFFF)\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Write Rust integer literals of 16,777,215 and up in hexadecimal when they are a power of two or a bit mask; the hex form shows the bit pattern.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"better-hex\",violation:{message:\"Write this integer literal in hexadecimal, e.g. 0x1000_0000 instead of 268435456, to show its bit pattern.\"}}]}},{id:\"clippy-decimal-literal-representation\",kind:\"code\",title:\"Clippy decimal_literal_representation: Using decimal representation when hexadecimal would be better\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Write Rust integer literals of 16384 and up in hexadecimal when they are a power of two or a bit mask; the hex form shows the bit pattern.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"better-hex\",violation:{message:\"Write this integer literal in hexadecimal, e.g. 0x1000_0000 instead of 268435456, to show its bit pattern.\"}}]}},{id:\"clippy-double-parens\",kind:\"code\",title:\"Clippy double_parens: Warn on unnecessary double parentheses\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Remove redundant double parentheses around Rust expressions and around a call's only argument.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"nested-parentheses\",violation:{message:\"Remove the redundant outer parentheses around this expression.\"}}]}},{id:\"clippy-else-if-without-else\",kind:\"code\",title:\"Clippy else_if_without_else: `if` expression with an `else if`, but without a final `else` branch\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"End every Rust if / else if chain with a final else branch; it makes the remaining case explicit.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"else-if-final-branch\",violation:{message:\"Add a final else branch to this if / else if chain to handle the remaining case.\"}}]}},{id:\"clippy-inconsistent-digit-grouping-no-fractions\",kind:\"code\",title:\"Clippy inconsistent_digit_grouping: Integer literals with digits grouped inconsistently (unreadable-literal-lint-fractions = false)\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:2,description:\"Group the integer digits of Rust decimal literals with underscores in equal-size groups; this variant leaves fractions unchecked.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"inconsistent\",violation:{message:\"Regroup this literal's digits with underscores into equal-size groups, e.g. 1_000_000 instead of 1_0000_00.\"}}]}},{id:\"clippy-needless-raw-string-hashes-one-allowed\",kind:\"code\",title:\"Clippy needless_raw_string_hashes: Suggests reducing the number of hashes around a raw string literal (allow-one-hash-in-raw-strings = true)\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use no more hashes on a Rust raw string literal than its contents need; this variant always allows a single hash.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"hashes-2\",violation:{message:\"Remove the extra # marks from this raw string, keeping one or as many as its contents need to close it.\"}}]}},{id:\"clippy-needless-raw-strings\",kind:\"code\",title:\"Clippy needless_raw_strings: Suggests using a string literal when a raw string literal is unnecessary\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a plain Rust string literal instead of a raw one when the contents hold no backslash or quote.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"needless-raw-string\",violation:{message:'Write this as a plain string literal, e.g. \"text\" instead of r\"text\"; it holds no backslash or quote.'}}]}},{id:\"clippy-redundant-field-names\",kind:\"code\",title:\"Clippy redundant_field_names: Checks for fields in struct literals where shorthands could be used\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use field init shorthand in Rust struct expressions when the value is a variable named like the field.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"redundant-field-name\",violation:{message:\"Use field init shorthand here, e.g. Point { x } instead of Point { x: x }.\"}}]}},{id:\"clippy-redundant-static-lifetimes\",kind:\"code\",title:\"Clippy redundant_static_lifetimes: Using explicit `'static` lifetime for constants or statics when elision rules would allow omitting them\",group:\"Clippy\",on:true,mode:\"steer\",doc:{revision:1,description:\"Drop explicit 'static lifetimes from the types of Rust const and static items; they are already implied there.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"redundant-static\",violation:{message:\"Remove this 'static; it is already implied in a const or static type.\"}}]}},{id:\"clippy-single-char-lifetime-names\",kind:\"code\",title:\"Clippy single_char_lifetime_names: Warns against single-character lifetime names\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:1,description:\"Give Rust lifetime parameters descriptive names instead of single letters; the name says what the borrow is tied to.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"single-char-lifetime\",violation:{message:\"Rename this lifetime to say what it borrows from, e.g. 'input instead of 'a.\"}}]}},{id:\"clippy-unnested-or-patterns\",kind:\"code\",title:\"Clippy unnested_or_patterns: Unnested or-patterns, e.g., `Foo(Bar) | Foo(Baz)` instead of `Foo(Bar | Baz)`\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Nest Rust or-patterns so the shared part is written once and only the differing part alternates.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnested-or\",violation:{message:\"Nest this or-pattern so the shared part is written once, e.g. Some(1 | 2) instead of Some(1) | Some(2).\"}}]}},{id:\"clippy-unreadable-literal-no-fractions\",kind:\"code\",title:\"Clippy unreadable_literal: Long literal without underscores (unreadable-literal-lint-fractions = false)\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Add underscore separators to Rust number literals with runs of more than five digits, fractions excepted; long digit runs are hard to read.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unreadable\",violation:{message:\"Add underscore separators to this number literal, e.g. 1_000_000 instead of 1000000.\"}}]}},{id:\"clippy-unreadable-literal\",kind:\"code\",title:\"Clippy unreadable_literal: Long literal without underscores\",group:\"Clippy\",on:false,mode:\"steer\",doc:{revision:2,description:\"Add underscore separators to Rust number literals with runs of more than five digits; long digit runs are hard to read.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unreadable\",violation:{message:\"Add underscore separators to this number literal, e.g. 1_000_000 instead of 1000000.\"}}]}}]},{id:\"sql\",name:\"SQL\",category:\"language\",covers:\"Linter-equivalent to SQLFluff 4.4.0, for correct, consistent SQL.\",reason:\"matches SQL\",version:\"0.1.7\",packageName:\"@neralabs/rerail-pack-sql\",honourSuppressionComments:true,rules:[{id:\"sqlfluff-al04-aliasing-unique-table\",kind:\"code\",title:\"SQLFluff AL04: Aliasing unique table\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Give every table in a SQL FROM clause a unique alias; a repeated alias makes column references ambiguous.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"duplicate-explicit-alias\",violation:{message:\"Give this table a different alias; '$A' already names another table in this query.\"}}]}},{id:\"sqlfluff-al05-aliasing-unused\",kind:\"code\",title:\"SQLFluff AL05: Aliasing unused\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove SQL table aliases the query never uses, unless the alias is required, as for a subquery, a VALUES list or a table joined to itself.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"unused-table-alias\",violation:{message:\"Alias '$ALIAS' is never used in SELECT statement.\"}}]}},{id:\"sqlfluff-al08-aliasing-unique-column\",kind:\"code\",title:\"SQLFluff AL08: Aliasing unique column\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Keep column names and aliases unique within a SQL SELECT list, ignoring case and quotes; duplicate output columns are ambiguous.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"duplicate-column-name\",violation:{message:\"Reuse of column alias.\"}}]}},{id:\"sqlfluff-al09-aliasing-self-alias-column\",kind:\"code\",title:\"SQLFluff AL09: Aliasing self alias column\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't alias a SQL column to its own name; if the alias is meant to change the name's case, quote it to make that explicit.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"exact-self-alias\",violation:{message:\"Column should not be self-aliased.\"}}]}},{id:\"sqlfluff-am01-ambiguous-distinct\",kind:\"code\",title:\"SQLFluff AM01: Ambiguous distinct\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid DISTINCT in a SQL SELECT that already has GROUP BY; the grouping already makes the rows unique.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"distinct-with-group-by\",violation:{message:\"Remove DISTINCT from this SELECT; its GROUP BY already makes the rows unique.\"}}]}},{id:\"sqlfluff-am05-ambiguous-join\",kind:\"code\",title:\"SQLFluff AM05: Ambiguous join\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write INNER JOIN instead of a bare JOIN in SQL so the join type is explicit.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"bare-join\",violation:{message:\"Write this join as INNER JOIN so its type is explicit.\"}}]}},{id:\"sqlfluff-am09-ambiguous-order-by-limit\",kind:\"code\",title:\"SQLFluff AM09: Ambiguous order by limit\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Add ORDER BY to any SQL query that uses LIMIT or OFFSET; without it, which rows come back is not deterministic.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"limit-without-order-by\",violation:{message:\"LIMIT and OFFSET are used without ORDER BY, which may lead to non-deterministic results.\"}}]}},{id:\"sqlfluff-cv02-convention-coalesce\",kind:\"code\",title:\"SQLFluff CV02: Convention coalesce\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use COALESCE instead of IFNULL or NVL in SQL; it is standard and works across databases.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"prefer-coalesce\",violation:{message:\"Use COALESCE instead of IFNULL or NVL.\"}}]}},{id:\"sqlfluff-cv04-convention-count-rows\",kind:\"code\",title:\"SQLFluff CV04: Convention count rows\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use COUNT(*) instead of COUNT(1) or COUNT(0) to count rows in SQL; it states the intent directly.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"count-literal\",violation:{message:\"Use COUNT(*) to count rows.\"}}]}},{id:\"sqlfluff-cv05-convention-is-null\",kind:\"code\",title:\"SQLFluff CV05: Convention is null\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use IS NULL or IS NOT NULL instead of comparing to NULL with =, != or \u003c>; such a comparison is never true.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"relational-null-comparison\",violation:{message:\"Comparisons with NULL should use IS or IS NOT.\"}}]}},{id:\"sqlfluff-cv08-convention-left-join\",kind:\"code\",title:\"SQLFluff CV08: Convention left join\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use LEFT JOIN instead of RIGHT JOIN in SQL, swapping the table order; joins that all read left to right are easier to follow.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"right-join\",violation:{message:\"Use LEFT JOIN instead of RIGHT JOIN.\"}}]}},{id:\"sqlfluff-pg01-postgres-excessive-locks\",kind:\"code\",title:\"SQLFluff PG01: Postgres excessive locks\",group:\"SQLFluff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use CONCURRENTLY on non-unique CREATE INDEX, DROP INDEX, REINDEX and REFRESH MATERIALIZED VIEW in PostgreSQL; otherwise the table is locked while it runs.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"create-index-without-concurrently\",violation:{message:\"CREATE INDEX should use CONCURRENTLY to avoid locking the table during the build.\"}}]}},{id:\"sqlfluff-pg02-postgres-not-valid-foreign-key\",kind:\"code\",title:\"SQLFluff PG02: Postgres not valid foreign key\",group:\"SQLFluff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Add PostgreSQL foreign keys with NOT VALID and validate them in a separate step; checking existing rows at once locks the table.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"foreign-key-without-not-valid\",violation:{message:\"Add this foreign key with NOT VALID and run VALIDATE CONSTRAINT as a separate step, so the table isn't locked.\"}}]}},{id:\"sqlfluff-rf01-references-from\",kind:\"code\",title:\"SQLFluff RF01: References from\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Qualify SQL columns only with a table or alias named in the FROM clause of the query or an enclosing query.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"qualifier-not-in-from\",violation:{message:\"Qualify this column with a table or alias named in the FROM clause of this query or an enclosing one.\"}}]}},{id:\"sqlfluff-rf04-references-keywords\",kind:\"code\",title:\"SQLFluff RF04: References keywords\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't use SQL keywords as unquoted table aliases, column aliases or column names; rename them so they can't be misread.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"keyword-identifier\",violation:{message:\"Keywords should not be used as identifiers.\"}}]}},{id:\"sqlfluff-rf05-references-special-chars\",kind:\"code\",title:\"SQLFluff RF05: References special chars\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use only letters, digits and underscores in SQL identifiers, quoted or not; other characters make names hard to use.\",scope:{include:[\"**/*.sql\"],exclude:[]},clauses:[{id:\"special-character-in-identifier\",violation:{message:\"Special characters should not be used in identifiers.\"}}]}},{id:\"sqlfluff-rf06-references-quoting\",kind:\"code\",title:\"SQLFluff RF06: References quoting\",group:\"SQLFluff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove double quotes from SQL identifiers that mean the same unquoted; PostgreSQL folds unquoted names to lower case anyway.\",scop ipt-eslint\",on:true,mode:\"steer\",doc:{revision:4,description:\"Remove extends any and extends unknown constraints from TypeScript type parameters; they constrain nothing.\",scope:{include:[\"**/*.ts\",\"**/*.tsx\",\"**/*.mts\",\"**/*.cts\"],exclude:[]},clauses:[{id:\"unnecessary-constraint\",violation:{message:\"Constraining the generic type `$NAME` to `$CONSTRAINT` does nothing and is unnecessary.\"}}]}},{id:\"typescript-eslint-no-unsafe-declaration-merging\",kind:\"code\",title:\"typescript-eslint no-unsafe-declaration-merging: Disallow unsafe declaration merging\",group:\"typescript-eslint\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't give a TypeScript class and an interface the same name in one scope; the merge adds the interface's members to the class without checking them.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"merged-class-and-interface\",violation:{message:\"Rename the class or the interface so they don't merge; merged, the class claims the interface's members without implementing them.\"}}]}},{id:\"typescript-eslint-no-unsafe-function-type\",kind:\"code\",title:\"typescript-eslint no-unsafe-function-type: Disallow using the unsafe built-in Function type\",group:\"typescript-eslint\",on:true,mode:\"steer\",doc:{revision:3,description:\"Avoid the global Function type in TypeScript; spell out the parameter and return types, since Function accepts any callable.\",scope:{include:[\"**/*.ts\",\"**/*.tsx\",\"**/*.mts\",\"**/*.cts\"],exclude:[]},clauses:[{id:\"function-type\",violation:{message:\"The `Function` type accepts any function-like value.\\nPrefer explicitly defining any function parameters and return type.\"}}]}},{id:\"typescript-eslint-no-unused-expressions\",kind:\"code\",title:\"typescript-eslint no-unused-expressions: Disallow unused expressions\",group:\"typescript-eslint\",on:true,mode:\"steer\",doc:{revision:6,description:\"Remove TypeScript expression statements that have no effect, such as a bare value or compar <script id="notesData" type="application/json">{"lede":"A dashed outline marks a proposed piece. Each note says what the person sees, what changed and why, what is still open, and what engineering would need. Everything without an outline is the dashboard as it is on main, on sample data. Notes tagged “Proposed: wording or small” are the ones to build now; “Proposed: needs engineering” needs data or API work first. The dark bar at the top only switches sample states, theme and before/after: it is not part of the design.","tags":{"cycle":"Proposed: wording or small","cheap":"Proposed: needs engineering","later":"Later"},"screens":{"update":{"id":"Update","title":"Part 1 · Update available: the banner and the top bar say how to update","tag":"Cycle","where":"Overview · the top bar · bar states “Update available” and “Stopped · update available”","notes":{"sees":["Already in PR 970, unmarked: “v0.1.5” and “Update available” in the top bar, About Rerail in Settings with Version, Installed and, while a newer version is out, Update to 0.2.0; the coding agents’ lines yellow only when there is a step; the solid banner buttons and the friendlier icons. The daemon now asks npm once a day for the newest Rerail and reports it on /healthz.","The top bar: “Update available” opens a small popover under it, like the repo menu, slightly see-through with a blur: “Rerail 0.2.0 is available”, the command /rerail-update in a grey box with Copy beside it, “Paste it into a session with your coding agent. Your rule packs update too.” and “Details in Settings”. It closes on a click outside, Esc, or once Copy or the link is used. “v0.1.5” still opens Settings.","Overview, with the rocket: “Rerail 0.2.0 just launched. To update, paste /rerail-update into a session with your coding agent. It updates your rule packs too, and backs up your rules and history first.” Its button, Copy update command, copies /rerail-update; beside it “Details in Settings”, which opens About Rerail; and ✕, once per version."],"changed":["From a team review on 23 Nov: the banner’s one action copies the command to paste into a coding agent’s session, instead of Open Settings. “Details in Settings” tells people where the information lives once the banner is gone. The chip says how to update too, in a popover on click, not a hover tooltip, which closes before Copy can be reached and is hard to use from the keyboard.","Design call, 23 Nov: the popover is slightly see-through with a background blur and has no outline; its title says “is available” (“is out” read as ambiguous); Copy sits outside the command’s grey box.","“Your rules and history come with you” is gone from the banner: what happens to edited rules across an update is undecided."],"open":["Whether the popover needs its outline in the dark theme, where its edge is softer (design to see).","What happens to edited rules across an update is still being decided."],"eng":["Packs updating with rerail update (team decision, 23 Nov) has to land before the banner and popover say “It updates your rule packs too.”","The popover is new: a dialog on the page layer like the repo menu (#repolayer), anchored to the chip’s right edge, closed by a click outside, Esc (focus back to the chip), or once used. backdrop-filter needs its -webkit- prefix for Safari."]},"foot":"Built by Claude, the agent, from a team review (23 Nov). The banner and popover wording is agent-authored. Versions are sample data."},"suggested":{"id":"Suggested","title":"Add rule packs: what Rerail picked for this repo, and why","tag":"Cycle","where":"Add rule packs · list and cards","notes":{"sees":["Under the page heading, the packs suggested for this repo come first, under “Suggested for acme-web”, with “Rerail picked these from what acme-web is built with.” Each says why, in set-up’s own words: “Why suggested · matches the react dependency in package.json”.","“Why suggested” is called out with a light fill in the brand’s subtle tint, its label in the brand colour with a check, so suggested packs stand apart from the others at a glance. Two versions, switched in the bar: a box inside the pack, or a band edge to edge across its foot.","Then “Other rule packs”: “Not matched to acme-web. Add any you want.”","A pack not added says how many of its rules start on when it’s added: “33 rules · 17 start on”, as an added pack says “51 rules · 32 on”.","A pack Rerail suggested and the person removed stays under Suggested, with Add pack: Rerail still thinks it fits."],"changed":["Today the review set-up opens is the only place that says which packs Rerail suggested and why. After set-up, Add rule packs lists every pack A to Z, with nothing to tell Rerail’s picks from the rest.","The two groups and the “Why suggested” line are the review’s own, so nothing new to learn. The Language and Framework filters and List or Cards work as before, inside each group.","Design call, 23 Nov: a pack not suggested shows only its rule count, “10 rules”, not “· 8 start on”: its rules would only check files they match, so the count says little here. design was unsure; engineering may know a reason to keep it."],"open":["Box or edge to edge (design to pick). The box keeps the pack’s shape and sits with its description; the band reads louder and lines up across cards. The set-up review lists the same line and would follow whichever is chosen.","Whether the suggested group should also show in Cards view with a heading, or as a tag on each card. Drawn with a heading here, the same as List."],"eng":["The page reads GET /api/rule-packs/recommendations on its first visit per repo, as the review and Create a rule already do. If that read is slow on a large repo, the page shows one list until it arrives, then splits.","Once every published pack is listed (allpacks), this is where the person sees them; without that listing, Add rule packs holds only the installed packs, so the Other group is nearly always empty."]},"foot":"A first pass by Claude, the agent, from the design brief (20 Nov). The wording is agent-authored. Names and numbers are sample data."},"sheet":{"id":"Sheet","title":"A pack’s sheet: its rules readable, in the order they start","tag":"Cycle","where":"The sheet that opens from a pack on Add rule packs","notes":{"sees":["Each rule’s title on its own line, with its id under it, as on a pack’s page. Today the title, “Steer · off” and the id share one line in the sheet, so titles wrap to four lines and ids are cut.","For a pack not added: “Start on” first, with “On as soon as the pack is added.”, then “Start off”, with “Turn any on from the pack’s page once it’s added.” Each rule has the Steer or Log only tag the pack’s page shows; rules that start off show it faded, as off rows do on the pack’s page.","For a pack Rerail suggested: “Suggested for acme-web: matches the react dependency in package.json.” under its description."],"changed":["“Steer · off” read as two settings that contradict each other. Grouping by how a rule starts says it once, and the tag is the same one the pack’s page uses.","The rules a pack starts on are the ones it recommends for most repos, so the first group is the answer to “what will this pack do here?”."],"open":["Once a pack is added, its sheet keeps the A to Z list (the switches are on its page). Grouping it by on and off there too is possible."],"eng":["Text and layout only: the sheet already has every rule’s mode and whether it starts on.","Once every published pack is listed (allpacks), this is where the person sees them; without that listing, Add rule packs holds only the installed packs, so the Other group is nearly always empty."]},"foot":"A first pass by Claude, the agent, from the design brief (20 Nov). The wording is agent-authored. Names and numbers are sample data."},"allpacks":{"id":"Allpacks","title":"Every published rule pack, not only the ones on this computer","tag":"Cheap","where":"Add rule packs · a pack’s sheet","notes":{"sees":["Add rule packs lists every rule pack Rerail publishes. A pack not on this computer carries a quiet “Not installed” tag on the line just above its description. Kept so a pack nobody here added doesn’t surprise anyone (design call, 23 Nov).","Its sheet still lists all its rules, with how each starts, and says: “Not installed on this computer. Add pack installs TypeScript 0.1.8, which every repo here can then use, and adds it to acme-web.”","Add pack does both: installs it and adds it. After that it is like any added pack.","With Proposals hidden, the page lists only the packs installed on this computer, as the product does today: after set-up, the ones some repo added."],"changed":["Today Add rule packs lists the packs installed on this computer, and set-up installs only the packs the person says yes to. So a person sees the packs they added and nothing else, and can’t look at, or add, any other pack from the dashboard (engineering confirmed, 20 Nov).","An earlier version of this prototype had every pack installed, which hid this. The sample data now has only the added packs installed."],"open":["Whether packs not installed are listed with the others (drawn here) or in a section of their own.","Whether Add pack installs from the dashboard, or gives the command rerail packs add \u003cid> as other pages do. Drawn as installing: engineering thinks it is feasible."],"eng":["A listing of every pack published on the update channel that fits this Rerail, from npm: name, version, kind, what it covers, and its rules with their titles, modes and whether each starts on (what set-up fetches into its staging folder today). Cached, since it is a network call.","Suggested for this repo needs the recommendations to consider packs not installed, as set-up does after fetching them.","Add pack for a pack not installed: install it (as rerail packs add does, which reloads the catalog), then add it to the repo."]},"foot":"A first pass by Claude, the agent, from the design brief and engineering’s answer (20 Nov). The wording is agent-authored. Names, versions and changes are sample data."},"chipspot":{"id":"Chipspot","title":"One spot for where a pack stands","tag":"Cycle","where":"Add rule packs · cards and list","notes":{"sees":["Every chip about where a pack stands sits on one line under the pack’s name, just above its description: “Added”, “Removed” (after removing it here), “Not installed”, “New” and “0.1.9 available”.","In a card the chips sit on a line of their own under the name block, left aligned with the description. In a list row they sit on the line under the name. A pack with nothing to say has no line.","The footer keeps the rule counts and the action: Add pack, Remove pack, or Undo after a removal.","List rows: the description and “Why suggested” run wider and the button sits closer (the gap halved, about 82px), so text wraps less. The rule count under the box sits as far from it as from the row’s bottom edge. The chips sit 8px from the name above and the description below.","Each pack’s version, “v0.1.8”, a quiet grey chip in the same spot: the version on this computer, or the one Add pack would install."],"changed":["Today a card shows “Added” in its top right corner, beside the name. A long name wraps into it, so it isn’t in the same place from card to card (design call, 23 Nov). In a list row it sits beside the action.","Earlier versions put these chips in the footer, a second spot. Now there is one, read before the description.","Design call, 23 Nov: the chips in this line are one height, the size of “Added”; the version replaces “0.1.11 available” for now.","Design call, 23 Nov: the version comes first in the line, then Added, Removed, New or Not installed."],"open":["List rows lose the column of statuses beside the buttons, which was quick to scan down. Drawn here to match the cards; design to confirm."],"eng":["Markup only: catalogCard and the list row in views/packs.js move the status into the name block; css/packs.css styles the line. No new data."]},"foot":"A first pass by Claude, the agent, from a design call (23 Nov). Names, versions and changes are sample data."},"columns":{"id":"Columns","title":"Rule tables: Enforcement before Violations","tag":"Cycle","where":"Overview · Most violations logged · each pack’s page · Created by you","notes":{"sees":["Every rule table reads Rule · Enforcement · Violations · On/off: the Steer or Log only tag sits right after the rule’s name area, and the count sits next to its switch."],"changed":["Team feedback, 23 Nov: Enforcement moves left of Violations. The column widths are the same, swapped; the count still ends on “Violations”’ right edge.","Design call, 23 Nov: the three column labels sit an equal 52px apart; Violations to On/off was 26px. The switch’s track is 60px, the switch at its right end."],"open":["The gap between the tag and a short count is wide, as the count stays right aligned under its label.","The counts’ figures: tabular now, so “11” reads loose; proportional figures suggested (design to pick)."],"eng":["CSS only: the row’s three tracks (.rside) and the column labels swap order; no markup changes."]},"foot":"From team feedback (23 Nov). Names and numbers are sample data."},"nosuppress":{"id":"Nosuppress","title":"A pack’s sheet: no “Ignore them” link","tag":"Cycle","where":"The sheet that opens from a pack, once the pack is added","notes":{"sees":["The sheet still says how the pack’s rules treat linter suppression comments (“Linter suppression comments, such as eslint-disable or noqa: honoured by its rules.”), with no link after it."],"changed":["Design call, 23 Nov: the “Ignore them” / “Honour them” link is removed. It switched, for this repo, whether the pack’s rules obey comments such as eslint-disable and noqa. It read as unclear, and the design doesn’t want it on the sheet."],"open":["Whether the setting should come back somewhere clearer later (a labelled switch with a line on why to turn it off), or stay out of the dashboard."],"eng":["Say plainly in the pull request that this control is removed from the dashboard. The setting itself stays: repository_settings_set (PUT /api/repository/settings) still takes suppressions per repository or checkout, so a coding agent or the API can change it; only the dashboard’s way to change it goes.","The packsuppress action in the pack sheet would be unused and can go with it."]},"foot":"From a design call (23 Nov)."},"approvals":{"id":"Approvals","title":"Approvals: one banner for what your coding agent added and edited","tag":"Cycle","where":"Overview · bar states “Rules wait for approval” (3 added, 1 edited) and “A pack rule was edited” (1 edited)","notes":{"sees":["One yellow banner for everything your coding agent wrote that waits: the rules it added and the edits it made. The shipped banner counted added rules only, and an edit had a second banner that named nothing.","Its title follows what waits. Only added rules: as shipped (“Your coding agent added 3 rules. They’re on Log only until you approve them.”). Only an edit: “Your coding agent edited a rule. The edit is on Log only until you approve it.” Both: “4 rules wait for your approval: 3 added, 1 edited. They’re on Log only until you approve them.”","Under it: what they caught in Log, as shipped; with an edit waiting, “An edited rule’s original keeps running until then.”; and for several, “Review opens the next one waiting. Each is approved on its own page.”","Its one button reads “Review next rule” (“Review rule” for one). It opens Created by you with the sheet of the next waiting rule: the one that caught the most first.","On that sheet, the yellow box starts with where the rule stands, “1 of 4 waiting”, while more than one waits. A rule set to steer offers “Approve and steer”; a rule set to Log keeps “Approve”.","Beside Approve, a quiet second button for saying no: “Delete rule” on a rule your coding agent added, “Discard edit” on an edit. It is the sheet’s own Delete rule, one click, and its toast offers Undo.","After Approve, the sheet stays on the approved rule. The box turns green: “Approved.”, then “It now steers your coding agent from its next turn.” (or “It stays on Log only, as it’s set.”) and “3 more rules wait for your approval.”, with “Review next rule”, the banner’s own label, which opens the next one (“Review last rule” for the last). After the last: “Nothing else waits for your approval.” The green box has an ✕ and is the only one that can be dismissed: it confirms something done, while the yellow boxes ask for something and stay.","The banner for rules Rerail did not write from elsewhere (a worktree’s .rerail rules, a pack Rerail did not publish) stays, without the /rerail-create command; a rule with no title reads “Review rule”.","On a rule’s sheet, the approval box and “On a violation” have a 12px gap. In any rule list, a selected row at the top or bottom follows the list’s rounded corners."],"changed":["Design call, 24 Nov, second pass: an edit by a coding agent should have a person’s approval first, like a rule it added; an agent can change a rule, and letting that through unread is a risk. This reverses the first pass, where an edited rule got no banner.","No “Approve all”: approval exists so no rule steers before a person has read it, and each Approve covers exactly what its page showed. Several rules can already be approved at once from a terminal with rerail rules approve, which prints each first.","Design chose the softer way through the queue: Approve does not move the sheet on its own; “Review next rule” does, on a click.","“Review in Created by you” became “Review next rule”: the label says what the button does and holds for added rules and edits alike.","Design call, 24 Nov: most rules will be approved, and one that turns out wrong is removed later. For the rest, saying no should be as near as saying yes, with nothing new for the API: it is the existing delete under a name that fits."],"eng":["No new API. The queue is the rules where approval.approved is false and the rule is in the library: the ones a coding agent added, plus edited copies (copiedFromRuleId set). Third parties’ packs and a worktree’s rules keep their own banner.","“Approved” on the sheet is page state: a rule this page drew as waiting that is now approved. It is gone after a reload.","In the sample, an edited copy is listed in Created by you, so Review opens it there. If the product lists an edited pack rule with its pack instead, the button should open it there."],"open":["The order of the queue: most violations caught in Log first, then by title. Confirm, or oldest first.","Wording is a first pass, agent-authored."]},"foot":"Built by Claude, the agent (24 Nov). The banner wording is agent-authored, a first pass."},"edited":{"id":"Edited","title":"Edited rule: it waits for approval like an added rule","tag":"Cycle","where":"A rule’s sheet and a pack’s page · bar state “A pack rule was edited” (Overview, Review rule; or open JavaScript, then ESLint no-debugger)","notes":{"sees":["The blue notice “This rule was edited today.”, its undo prompt and its ✕ are gone.","The edit’s own sheet (reached from Overview’s banner) has the same yellow box as an added rule, with different words: “Edited by your coding agent, on Log only.”, then “An edited copy of “ESLint no-debugger: Disallow the use of debugger”, a rule Rerail ships. What changed: What the agent sees and Where it applies.”, then “The original keeps running in acme-web until you approve this edit; approving it turns the original off there.” and Approve and steer.","Beside Approve and steer: “Discard edit”. It removes the edit; the original keeps running as it was, and its “Edited” tag goes. The toast reads “Edit discarded. The original keeps running as it was.” with Undo, which puts the edit back to wait again.","After Approve: “Approved. This edit replaced the original in acme-web.”","The original’s sheet, opened from its pack: one yellow box, “An edit of this rule waits for approval.”, “Edited today. This rule keeps running as it was until the edit is approved.” and “Review the edit”, which opens the edit’s sheet. No Approve here: approval covers what the edit’s own page shows.","The pack’s page: the original’s row keeps its “Edited” tag until the edit is approved."],"changed":["Design call, 24 Nov, second pass: edits use the approval banner and box that rules from /rerail-create have. The words differ only where the facts do: the original keeps running while an edit waits, approving replaces the original, and what to review is what changed.","“What changed” is kept from the first pass, inside the approval box: it names the sheet’s own sections, so they can be read below.","Before this, an edit’s sheet used the box for a third party’s rule: “This rule waits for approval. Rerail did not write it…”, which reads wrong for an edit the person asked for."],"open":["“Discard edit” is one click, with Undo in the toast; the sheet’s Delete rule asks first. Confirm one click is right beside Approve.","The box says “your coding agent” edited it. An edit made with rerail rules add from a terminal waits too, and the dashboard isn’t told which; the added-rule banner already makes the same assumption.","Wording is a first pass, agent-authored."],"eng":["How it works today, unchanged by this design: a coding agent’s edit of a rule Rerail ships, or of your approved rule, is saved as a copy; the copy runs on Log only until a person approves it; the original keeps running; approving the copy turns the original off in that repository.","Parts changed are the original against the copy, which the dashboard already gets: the mode (On a violation), first clause’s message (What the agent sees), description, scope (Where it applies), and the clauses apart from their message (What it checks). A coding agent changes the mode through the rule’s document, so Log to Steer is an edit that waits for the same approval.","The original finds its edit by copiedFromRuleId among the rules that wait.","In the sample, the edited copy is listed in Created by you. Please confirm where the product lists an edited pack rule.","“Discard edit” is the existing delete: one PUT /api/repository/attachments that removes the copy’s attachments, with the same Undo. Only the toast’s words are new. The copy stays in the library, as any deleted rule does; a discarded edit may be better removed from the library too."]},"foot":"Built by Claude, the agent (24 Nov). Wording agent-authored, a first pass. The edit is sample data."},"cardsfirst":{"id":"Cardsfirst","title":"Add rule packs opens on Cards","tag":"Cycle","where":"Add rule packs","notes":{"sees":["The page opens on Cards instead of List. The view toggle reads Cards, then List."],"changed":["Design call, 24 Nov: Cards is the default view. A toggle usually puts its default first, so Cards moves to the left."],"eng":["The default is ui.catView in ui/state.js; the toggle’s order is in ui/views/packs.js. The choice still lasts only the visit, as today."]},"foot":"Built by Claude, the agent (24 Nov)."}}}</script>
<script>
const STATES = [
  ["not-set-up", "Not set up · started, no rule packs chosen"],
  ["no-packs", "Set up · no rule pack suggested"],
  ["day-one", "Day one · packs added, no sessions yet"],
  ["mature", "Five weeks in"],
  ["waiting", "Rules wait for approval"],
  ["edited", "A pack rule was edited"],
  ["update", "Update available"],
  ["agents", "Claude Code's sandbox off · Codex connected"],
  ["stopped", "Stopped"],
  ["stopped-update", "Stopped · update available"],
  ["repos", "3 repos"],
  ["no-access", "This browser is not connected"],
];
const INNER = JSON.parse(document.getElementById("inner").textContent);
const NOTES = JSON.parse(document.getElementById("notesData").textContent);
const HAS_PROPOSALS = Object.keys(NOTES.screens).length > 0;
const frame = document.getElementById("dash"), panel = document.getElementById("notesPanel");
const cfg = { state: "mature", theme: "light", proposals: HAS_PROPOSALS, notes: false, route: "", why: "box" };
try {
  const q = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (STATES.some(([id]) => id === q.get("state"))) cfg.state = q.get("state");
  if (q.get("theme") === "dark") cfg.theme = "dark";
  if (q.get("proposals") === "0") cfg.proposals = false;
  if (q.get("notes") === "1" && HAS_PROPOSALS) cfg.notes = true;
  if (q.get("route")) cfg.route = q.get("route");
} catch { /* no address to read: the defaults stand */ }
function remember() {
  const q = new URLSearchParams({ state: cfg.state, theme: cfg.theme, proposals: cfg.proposals ? "1" : "0", notes: cfg.notes ? "1" : "0", route: cfg.route });
  try { history.replaceState(null, "", `#${q}`); } catch { /* a sandboxed page cannot rewrite its address */ }
}

let shown = [];
function boot() {
  shown = [];
  frame.srcdoc = INNER.replace("/*__PROTO__*/", () => `window.__PROTO=${JSON.stringify(cfg).replace(/</g, "\\u003c")};`);
  paint();
}
const send = message => frame.contentWindow?.postMessage({ rerailProtoSet: true, ...message }, "*");

function paint() {
  document.getElementById("state").value = cfg.state;
  for (const b of document.querySelectorAll("#theme button")) b.setAttribute("aria-pressed", String(b.dataset.v === cfg.theme));
  for (const b of document.querySelectorAll("#proposals button")) b.setAttribute("aria-pressed", String((b.dataset.v === "1") === cfg.proposals));
  document.querySelector("#notes button").setAttribute("aria-pressed", String(cfg.notes));
  document.getElementById("proposalsGrp").hidden = !HAS_PROPOSALS;
  document.getElementById("notesGrp").hidden = !HAS_PROPOSALS;
  panel.hidden = !cfg.notes;
  if (cfg.notes) paintNotes();
  remember();
}

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const list = (title, items) => (items && items.length ? `<h4>${title}</h4><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "");
function paintNotes() {
  const here = shown.map(id => NOTES.screens[id]).filter(Boolean);
  const cards = here.map(n => `<article><h3>${esc(n.title)} <span class="id">${esc(n.id)}</span></h3><span class="tag${n.tag === "cheap" ? " eng" : ""}">${esc(NOTES.tags[n.tag])}</span>`
    + list("What the person sees", n.notes.sees) + list("What changed", n.notes.changed) + list("Open", n.notes.open) + list("For engineering", n.notes.eng)
    + `<p class="foot">${esc(n.foot)}</p></article>`).join("");
  panel.innerHTML = `<h2>Design notes</h2>`
    + `<p class="lede">${esc(NOTES.lede)}</p>`
    + (cfg.proposals
      ? (cards || `<article><span class="tag ship">Shipped today</span><p style="margin:0">Nothing on this screen is proposed. It is the product’s dashboard as it ships, on sample data.</p></article>`)
      : `<article><span class="tag ship">Shipped today</span><p style="margin:0">The proposals are hidden, so every screen is the product’s dashboard as it ships.</p></article>`);
}

document.getElementById("state").append(...STATES.map(([id, label]) => Object.assign(document.createElement("option"), { value: id, textContent: label })));
document.getElementById("state").addEventListener("change", e => { cfg.state = e.target.value; cfg.route = ""; boot(); });
document.getElementById("theme").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cfg.theme = b.dataset.v; send({ theme: cfg.theme }); paint(); });
document.getElementById("proposals").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cfg.proposals = b.dataset.v === "1"; boot(); });
document.getElementById("notes").addEventListener("click", () => { cfg.notes = !cfg.notes; send({ notes: cfg.notes }); paint(); });

window.addEventListener("message", event => {
  const m = event.data;
  if (!m || m.rerailProto !== true || event.source !== frame.contentWindow) return;
  if (typeof m.route === "string") { cfg.route = m.route; remember(); }
  if (typeof m.theme === "string" && m.theme !== "" && m.theme !== cfg.theme) { cfg.theme = m.theme; paint(); }
  if (Array.isArray(m.proposals)) { shown = m.proposals; if (cfg.notes) paintNotes(); }
});

boot();

</script>
