:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B306\",violation:{message:\"Replace tempfile.mktemp with mkstemp or NamedTemporaryFile, which create the file atomically.\"}}]}},{id:\"bandit-b307-eval\",kind:\"code\",title:\"Bandit B307: Eval\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid eval() calls in Python, including through import aliases; use ast.literal_eval() when you only need to parse literal values.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"eval-call\",violation:{message:\"This eval call executes supplied text as Python code and may be unsafe. Use ast.literal_eval when only Python literals need to be parsed.\"}}]}},{id:\"bandit-b308-mark-safe\",kind:\"code\",title:\"Bandit B308: Mark safe\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid Django's mark_safe(); it turns off autoescaping and can expose cross-site scripting when the content isn't fully trusted.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B308\",violation:{message:\"Build this HTML with format_html() instead of mark_safe so any untrusted parts get escaped.\"}}]}},{id:\"bandit-b310-urllib-urlopen\",kind:\"code\",title:\"Bandit B310: Urllib urlopen\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Restrict URLs passed to urllib's urlopen, urlretrieve, and URLopener to expected schemes; file: and custom schemes can expose local files.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B310\",violation:{message:\"Audit URL opening for permitted schemes; file or custom schemes may be unexpected.\"}}]}},{id:\"bandit-b311-random\",kind:\"code\",title:\"Bandit B311: Random\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid the random module's generators for anything security-related; their output is predictable, so use the secrets module for tokens, passwords, and keys.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B311\",violation:{message:\"Standard pseudo-random generators are not suitable for security or cryptographic purposes.\"}}]}},{id:\"bandit-b312-telnetlib\",kind:\"code\",title:\"Bandit B312: Telnetlib\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid opening telnetlib.Telnet connections; Telnet sends credentials and data unencrypted, so use SSH or another encrypted protocol.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B312\",violation:{message:\"Telnet is insecure; use SSH or another encrypted protocol.\"}}]}},{id:\"bandit-b313-xml-bad-celementtree\",kind:\"code\",title:\"Bandit B313: Xml bad cElementTree\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use defusedxml instead of xml.etree.cElementTree to parse XML; the standard parser is open to entity-expansion and other XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B313\",violation:{message:\"Using xml.etree.cElementTree to parse untrusted XML may permit XML attacks; use defusedxml.\"}}]}},{id:\"bandit-b314-xml-bad-elementtree\",kind:\"code\",title:\"Bandit B314: Xml bad ElementTree\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use defusedxml instead of xml.etree.ElementTree to parse XML; the standard parser is open to entity-expansion and other XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B314\",violation:{message:\"Using xml.etree.ElementTree to parse untrusted XML may permit XML attacks; use defusedxml.\"}}]}},{id:\"bandit-b315-xml-bad-expatreader\",kind:\"code\",title:\"Bandit B315: Xml bad expatreader\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use defusedxml instead of creating parsers with xml.sax.expatreader; the standard parser is open to entity-expansion and other XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B315\",violation:{message:\"Using xml.sax.expatreader to parse untrusted XML may permit XML attacks; use defusedxml.\"}}]}},{id:\"bandit-b316-xml-bad-expatbuilder\",kind:\"code\",title:\"Bandit B316: Xml bad expatbuilder\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use defusedxml instead of xml.dom.expatbuilder to parse XML; the standard parser is open to entity-expansion and other XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B316\",violation:{message:\"Using xml.dom.expatbuilder to parse untrusted XML may permit XML attacks; use defusedxml.\"}}]}},{id:\"bandit-b317-xml-bad-sax\",kind:\"code\",title:\"Bandit B317: Xml bad sax\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use defusedxml instead of xml.sax to parse XML; the standard parser is open to entity-expansion and other XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B317\",violation:{message:\"Using xml.sax to parse untrusted XML may permit XML attacks; use defusedxml.\"}}]}},{id:\"bandit-b318-xml-bad-minidom\",kind:\"code\",title:\"Bandit B318: Xml bad minidom\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use defusedxml instead of xml.dom.minidom to parse XML; the standard parser is open to entity-expansion and other XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B318\",violation:{message:\"Using xml.dom.minidom to parse untrusted XML is vulnerable to XML attacks; use the defusedxml equivalent.\"}}]}},{id:\"bandit-b319-xml-bad-pulldom\",kind:\"code\",title:\"Bandit B319: Xml bad pulldom\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use defusedxml instead of xml.dom.pulldom to parse XML; the standard parser is open to entity-expansion and other XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B319\",violation:{message:\"Using xml.dom.pulldom to parse untrusted XML is vulnerable to XML attacks; use the defusedxml equivalent.\"}}]}},{id:\"bandit-b321-ftplib\",kind:\"code\",title:\"Bandit B321: Ftplib\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid opening ftplib.FTP connections; FTP sends credentials and data unencrypted, so use SFTP, SCP, or another encrypted protocol.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B321\",violation:{message:\"Replace this FTP connection with SFTP, SCP, or another encrypted protocol; FTP sends credentials in clear text.\"}}]}},{id:\"bandit-b323-unverified-context\",kind:\"code\",title:\"Bandit B323: Unverified context\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't create SSL contexts with ssl._create_unverified_context(); it turns off certificate and hostname verification and allows man-in-the-middle attacks.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B323\",violation:{message:\"Use ssl.create_default_context() instead, which verifies certificates and hostnames.\"}}]}},{id:\"bandit-b401-import-telnetlib\",kind:\"code\",title:\"Bandit B401: Import telnetlib\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Remove imports of telnetlib; Telnet sends credentials and data unencrypted, so use SSH or another encrypted protocol.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B401\",violation:{message:\"Remove this telnetlib import and use SSH or another encrypted protocol instead.\"}}]}},{id:\"bandit-b402-import-ftplib\",kind:\"code\",title:\"Bandit B402: Import ftplib\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Remove imports of ftplib; FTP sends credentials and data unencrypted, so use SFTP, SCP, or another encrypted protocol.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B402\",violation:{message:\"Remove this ftplib import and use SFTP, SCP, or another encrypted protocol instead.\"}}]}},{id:\"bandit-b405-import-xml-etree\",kind:\"code\",title:\"Bandit B405: Import xml etree\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid importing xml.etree.ElementTree or cElementTree; use defusedxml instead, since the standard parsers are open to XML attacks on untrusted input.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B405\",violation:{message:\"ElementTree XML parsing may be vulnerable to XML attacks; use defusedxml or defuse the standard library.\"}}]}},{id:\"bandit-b407-import-xml-expat\",kind:\"code\",title:\"Bandit B407: Import xml expat\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid importing xml.dom.expatbuilder to parse XML; it is open to XML attacks, so use defusedxml.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B407\",violation:{message:\"xml.dom.expatbuilder parsing may be vulnerable to XML attacks; use defusedxml or defuse the standard library.\"}}]}},{id:\"bandit-b408-import-xml-minidom\",kind:\"code\",title:\"Bandit B408: Import xml minidom\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid importing xml.dom.minidom to parse XML; it is open to XML attacks, so use defusedxml.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B408\",violation:{message:\"xml.dom.minidom parsing may be vulnerable to XML attacks; use defusedxml or defuse the standard library.\"}}]}},{id:\"bandit-b409-import-xml-pulldom\",kind:\"code\",title:\"Bandit B409: Import xml pulldom\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid importing xml.dom.pulldom to parse XML; it is open to XML attacks, so use defusedxml.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B409\",violation:{message:\"xml.dom.pulldom parsing may be vulnerable to XML attacks; use defusedxml or defuse the standard library.\"}}]}},{id:\"bandit-b411-import-xmlrpclib\",kind:\"code\",title:\"Bandit B411: Import xmlrpclib\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid importing xmlrpc unprotected; its XML parsing is open to XML attacks unless patched with defusedxml.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B411\",violation:{message:\"xmlrpc parsing may be vulnerable to XML attacks; use defusedxml.xmlrpc.monkey_patch() to mitigate XML vulnerabilities.\"}}]}},{id:\"bandit-b413-import-pycrypto\",kind:\"code\",title:\"Bandit B413: Import pycrypto\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid importing the pyCrypto package; it is unmaintained and has known vulnerabilities, so use the cryptography package instead.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B413\",violation:{message:\"The pyCrypto library is deprecated and unmaintained; consider using pyca/cryptography.\"}}]}},{id:\"bandit-b415-import-pyghmi\",kind:\"code\",title:\"Bandit B415: Import pyghmi\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Avoid importing pyghmi; IPMI is an insecure protocol, so prefer an encrypted management protocol.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B415\",violation:{message:\"Replace this pyghmi import with a client for an encrypted management protocol such as Redfish over HTTPS; IPMI is insecure.\"}}]}},{id:\"bandit-b502-ssl-with-bad-version\",kind:\"code\",title:\"Bandit B502: Ssl with bad version\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't select SSLv2, SSLv3, TLS 1.0 or TLS 1.1 when configuring ssl or pyOpenSSL connections; these protocol versions are broken.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B502\",violation:{message:\"Select TLS 1.2 or newer here (e.g. ssl.PROTOCOL_TLS_CLIENT) instead of this SSLv2, SSLv3, TLS 1.0 or TLS 1.1 protocol.\"}}]}},{id:\"bandit-b505-weak-cryptographic-key\",kind:\"code\",title:\"Bandit B505: Weak cryptographic key\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use RSA and DSA keys of at least 2048 bits and elliptic curves of at least 224 bits; smaller keys can be broken.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"weak-cryptographic-key\",violation:{message:\"Generate this key with at least 2048 bits for RSA or DSA, or a curve of at least 224 bits for EC; smaller keys can be broken.\"}}]}},{id:\"bandit-b507-ssh-no-host-key-verification\",kind:\"code\",title:\"Bandit B507: Ssh no host key verification\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:4,description:\"Don't let Paramiko auto-accept unknown SSH host keys with AutoAddPolicy or WarningPolicy; it opens the door to man-in-the-middle attacks.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"b507\",violation:{message:\"Set paramiko.RejectPolicy and load known host keys instead of auto-accepting unknown ones; that invites man-in-the-middle attacks.\"}}]}},{id:\"bandit-b606-start-process-with-no-shell\",kind:\"code\",title:\"Bandit B606: Start process with no shell\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Validate input passed to the os exec, spawn and startfile functions; they start whatever program and arguments they receive.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit-b606\",violation:{message:\"Validate any untrusted input passed to this os exec, spawn or startfile call; it starts whatever program and arguments it receives.\"}}]}},{id:\"bandit-b615-huggingface-unsafe-download\",kind:\"code\",title:\"Bandit B615: Huggingface unsafe download\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:5,description:\"Pin Hugging Face model and dataset downloads to a specific commit revision; an unpinned download can silently pull changed or tampered files.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"b615\",violation:{message:\"Pin ${API}() to a specific commit hash with revision=; an unpinned download can silently pull changed or tampered files.\"}}]}},{id:\"bandit-b103-set-bad-file-permissions\",kind:\"code\",title:\"Bandit B103: Set bad file permissions\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid chmod modes that grant group-write, group-execute, world-write, or world-execute permission; overly broad permissions let other users tamper with files.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"world-writable-chmod\",violation:{message:\"Remove world-write from this chmod mode; use 0o644 for files or 0o755 for directories.\"}}]}},{id:\"bandit-b201-flask-debug-true\",kind:\"code\",title:\"Bandit B201: Flask debug true\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't run a Flask app with debug enabled; the interactive debugger lets anyone who can reach it execute arbitrary code.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"b201\",violation:{message:\"Remove debug=True from this run call; the debugger lets anyone who reaches it run arbitrary code.\"}}]}},{id:\"bandit-b304-ciphers\",kind:\"code\",title:\"Bandit B304: Ciphers\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid weak ciphers such as DES, TripleDES, ARC2, ARC4, Blowfish, CAST5, IDEA, SEED, and XOR; use a modern cipher such as AES.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B304\",violation:{message:\"Replace this weak cipher with AES in an authenticated mode such as GCM.\"}}]}},{id:\"bandit-b406-import-xml-sax\",kind:\"code\",title:\"Bandit B406: Import xml sax\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:3,description:\"Avoid parsing XML with xml.sax (importing only its saxutils helpers is fine); it is open to XML attacks, so use defusedxml.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"B406\",violation:{message:\"xml.sax parsing may be vulnerable to XML attacks; use defusedxml or defuse the standard library.\"}}]}},{id:\"bandit-b508-snmp-insecure-version\",kind:\"code\",title:\"Bandit B508: Snmp insecure version\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use SNMPv3 instead of SNMPv1 or v2c in pysnmp CommunityData; the older versions send community strings in clear text.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B508\",violation:{message:\"Switch to SNMPv3 with UsmUserData instead of this CommunityData; mpModel 0 or 1 sends the community string in clear text.\"}}]}},{id:\"bandit-b509-snmp-weak-cryptography\",kind:\"code\",title:\"Bandit B509: Snmp weak cryptography\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass authentication and privacy keys to pysnmp UsmUserData; without them SNMPv3 runs with no authentication or encryption.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit:B509\",violation:{message:\"Pass authentication and privacy keys to this UsmUserData call; without them SNMPv3 runs with no authentication or encryption.\"}}]}},{id:\"bandit-b609-linux-commands-wildcard-injection\",kind:\"code\",title:\"Bandit B609: Linux commands wildcard injection\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid wildcards in shell commands that run chown, chmod, tar or rsync; crafted file names can inject extra options.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit-b609-shell-functions\",violation:{message:\"List the files explicitly instead of using a wildcard in this chown, chmod, tar or rsync command; crafted file names can inject options.\"}}]}},{id:\"bandit-b610-django-extra-used\",kind:\"code\",title:\"Bandit B610: Django extra used\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Pass only literal strings to the where, tables and select arguments of Django QuerySet.extra(); dynamic values open the query to SQL injection.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"django-extra-used\",violation:{message:\"Pass only literal strings to where, tables and select in this .extra() call, with values in params; dynamic SQL allows injection.\"}}]}},{id:\"bandit-b612-logging-config-insecure-listen\",kind:\"code\",title:\"Bandit B612: Logging config insecure listen\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a verify callback to logging.config.listen; otherwise anyone who can reach the port can push logging config that runs code.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit-B612\",violation:{message:\"logging.config.listen is used without a verify callback; verify or decrypt received configuration bytes.\"}}]}},{id:\"bandit-b614-pytorch-load\",kind:\"code\",title:\"Bandit B614: Pytorch load\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Load PyTorch files with weights_only=True or use safetensors; a full torch.load unpickles the file and can run arbitrary code.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit-B614\",violation:{message:\"PyTorch loading permits unsafe deserialization; pass weights_only=True or use safetensors.\"}}]}},{id:\"bandit-b702-use-of-mako-templates\",kind:\"code\",title:\"Bandit B702: Use of mako templates\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid Mako templates or escape every variable with Mako filters; Mako has no environment-wide escaping, so output is open to XSS.\",scope:{include:[\"**/*.py\"],exclude:[]},clauses:[{id:\"bandit-B702\",violation:{message:\"Mako templates do not provide environment-wide escaping; sanitize variables with the n, h, or x filters.\"}}]}},{id:\"bandit-b105-hardcoded-password-string\",kind:\"code\",title:\"Bandit B105: Hardcoded password string\",group:\"Bandit\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't assign or compare a string literal to a variable, attribute, or key named like a password, token, or secret; read credentials from the environment or a secret store.\",scope:{include:[\"**/*.py\",\"**/*.pyi\"],exclude:[\"**/node_modules/**\",\"**/dist/**\",\"**/build/**\",\"**/out/**\",\"**/.next/**\",\"**/coverage/**\",\"**/vendor/**\",\"**/.venv/**\",\"**/.yarn/**\",\"**/generated/**\",\"**/__generated__/**\",\"**/*.generated.*\",\"**/*.gen.*\",\"**/*.min.js\"]},clauses:[{id:\"shared\"}]}},{id:\"ruff-air001-airflow-variable-name-task-id-mismatch\",kind:\"code\",title:\"Ruff AIR001: Airflow variable name task id mismatch\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name each Airflow operator variable after the task id it creates, so the Dag code reads the same as the task graph it builds.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"task-variable-name-mismatch\",violation:{message:\"Rename this task variable to `$TV` so it matches its `task_id`, or change the `task_id` if this variable name is the one you want.\"}}]}},{id:\"ruff-air002-airflow-dag-no-schedule-argument\",kind:\"code\",title:\"Ruff AIR002: Airflow dag no schedule argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Give every Airflow Dag an explicit schedule; the implicit default changed from daily to none in Airflow 3, silently stopping Dags that relied on it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"dag-without-schedule\",violation:{message:\"Pass an explicit `schedule=` to this Dag (`schedule=None` if it should only run when triggered); relying on the default changes behaviour between Airflow 2 and 3.\"}}]}},{id:\"ruff-air301-airflow3-removal\",kind:\"code\",title:\"Ruff AIR301: Airflow3 removal\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace or remove the APIs, arguments and context keys that Airflow 3 removed, so the code keeps working after the upgrade.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-air302-airflow3-moved-to-provider\",kind:\"code\",title:\"Ruff AIR302: Airflow3 moved to provider\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:3,description:\"Import Airflow hooks, operators and other names that moved into provider packages in Airflow 3.0 from their provider modules; the old core import paths are gone.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-air303-airflow3-incompatible-function-signature\",kind:\"code\",title:\"Ruff AIR303: Airflow3 incompatible function signature\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Update calls and methods whose Airflow 3 signature changed: pass lineage asset arguments and dataset extras by keyword, and give get_link a ti_key parameter.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"create-asset\",violation:{message:\"Pass the arguments to `$M` by keyword, e.g. `$M(uri=...)`; Airflow 3 no longer accepts positional arguments here.\"}}]}},{id:\"ruff-air311-airflow3-suggested-update\",kind:\"code\",title:\"Ruff AIR311: Airflow3 suggested update\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:3,description:\"Replace Airflow APIs that Airflow 3 deprecated but still supports with their newer equivalents, and stop passing the sla arguments; the old ones are expected to be removed.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-air312-airflow3-suggested-to-move-to-provider\",kind:\"code\",title:\"Ruff AIR312: Airflow3 suggested to move to provider\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:3,description:\"Import Airflow operators, sensors, hooks and triggers from the standard provider package instead of their deprecated core modules; the core paths are due for removal after Airflow 3.0.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"airflow3-suggested-to-move-to-provider\",violation:{message:\"`$ATTR` moved to apache-airflow-providers-standard in Airflow 3.0; import it from its `airflow.providers.standard` module, keeping the old import only as an `except ImportError` fallback.\"}}]}},{id:\"ruff-ann001-missing-type-function-argument\",kind:\"code\",title:\"Ruff ANN001: Missing type function argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Annotate every function parameter with a type so type checkers can verify calls and readers know what the function accepts.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-type-function-argument\",violation:{message:\"Add a type annotation to parameter `$NAME`.\"}}]}},{id:\"ruff-ann002-missing-type-args\",kind:\"code\",title:\"Ruff ANN002: Missing type args\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Annotate variadic positional parameters with the type of each extra argument so type checkers can verify calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-type-args\",violation:{message:\"Add a type annotation to `*$NAME` giving the type of each extra positional argument.\"}}]}},{id:\"ruff-ann003-missing-type-kwargs\",kind:\"code\",title:\"Ruff ANN003: Missing type kwargs\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Annotate variadic keyword parameters with the type of each extra keyword argument so type checkers can verify calls.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-type-kwargs\",violation:{message:\"Add a type annotation to `**$NAME` giving the type of each extra keyword argument's value.\"}}]}},{id:\"ruff-ann201-missing-return-type-undocumented-public-function\",kind:\"code\",title:\"Ruff ANN201: Missing return type undocumented public function\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Add a return type annotation to public functions and methods so callers and type checkers know what they return.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-return-type-undocumented-public-function\",violation:{message:\"Add a return type annotation to `$FN` (for example `-> None` if it returns nothing).\"}}]}},{id:\"ruff-ann202-missing-return-type-private-function\",kind:\"code\",title:\"Ruff ANN202: Missing return type private function\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Add a return type annotation to private and nested functions so type checkers can verify what they return.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-ann204-missing-return-type-special-method\",kind:\"code\",title:\"Ruff ANN204: Missing return type special method\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Annotate the return type of special dunder methods; the annotation documents what they return and lets a type checker verify it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-return-type-special-method\",violation:{message:\"Add a return type annotation to `$N`, such as `-> None` for `__init__` or `-> str` for `__str__`.\"}}]}},{id:\"ruff-ann205-missing-return-type-static-method\",kind:\"code\",title:\"Ruff ANN205: Missing return type static method\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Annotate the return type of static methods; the annotation documents what they return and lets a type checker verify it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-return-type-static-method\",violation:{message:\"Add a return type annotation to static method `$N`, such as `-> int`, naming the type it returns.\"}}]}},{id:\"ruff-ann206-missing-return-type-class-method\",kind:\"code\",title:\"Ruff ANN206: Missing return type class method\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Annotate the return type of class methods; the annotation documents what they return and lets a type checker verify it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-return-type-class-method\",violation:{message:\"Add a return type annotation to class method `$N`, such as `-> Self` for an alternate constructor, naming the type it returns.\"}}]}},{id:\"ruff-ann401-any-type\",kind:\"code\",title:\"Ruff ANN401: Any type\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use a specific type instead of Any in function signatures; Any switches off type checking for every value that passes through it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"any-type\",violation:{message:\"This annotation amounts to `Any`; replace it with the type the code actually accepts or returns (a union, a TypeVar or a Protocol), keeping `Any` only where every type is truly allowed.\"}}]}},{id:\"ruff-arg002-unused-method-argument\",kind:\"code\",title:\"Ruff ARG002: Unused method argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove method parameters the body never reads, or prefix them with an underscore when the signature must stay and no caller passes them by keyword.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-arg003-unused-class-method-argument\",kind:\"code\",title:\"Ruff ARG003: Unused class method argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove class method parameters the body never reads, or prefix them with an underscore when the signature must stay and no caller passes them by keyword.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-arg004-unused-static-method-argument\",kind:\"code\",title:\"Ruff ARG004: Unused static method argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove static method parameters the body never reads, or prefix them with an underscore when the signature must stay and no caller passes them by keyword.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-arg005-unused-lambda-argument\",kind:\"code\",title:\"Ruff ARG005: Unused lambda argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove lambda parameters the body never reads, or prefix them with an underscore when the caller passes them anyway.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-c400-unnecessary-generator-list\",kind:\"code\",title:\"Ruff C400: Unnecessary generator list\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a list comprehension instead of passing a generator expression to list, or pass the iterable itself when the generator yields its items unchanged.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-c401-unnecessary-generator-set\",kind:\"code\",title:\"Ruff C401: Unnecessary generator set\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a set comprehension instead of passing a generator expression to set, or pass the iterable itself when the generator yields its items unchanged.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-c402-unnecessary-generator-dict\",kind:\"code\",title:\"Ruff C402: Unnecessary generator dict\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a dict comprehension instead of passing a generator of key-value pairs to dict; it reads more directly and skips building a tuple per item.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"generator-dict\",violation:{message:\"Rewrite `dict((k, v) for ...)` as a dict comprehension `{k: v for ...}`; leave it if `dict` here is not the builtin.\"}}]}},{id:\"ruff-c403-unnecessary-list-comprehension-set\",kind:\"code\",title:\"Ruff C403: Unnecessary list comprehension set\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a set comprehension instead of passing a list comprehension to set; it skips building a throwaway list.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"list-comprehension-set\",violation:{message:\"Rewrite `set([expr for ...])` as a set comprehension `{expr for ...}`; the intermediate list is not needed.\"}}]}},{id:\"ruff-c404-unnecessary-list-comprehension-dict\",kind:\"code\",title:\"Ruff C404: Unnecessary list comprehension dict\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write a dict comprehension instead of passing a list comprehension of pairs to dict(); it skips building a throwaway list.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-list-comprehension-dict\",violation:{message:\"Rewrite `dict([(k, v) for ...])` as the dict comprehension `{k: v for ...}`; leave it when the pair unpacks with `*`, as in `(k, *v)`.\"}}]}},{id:\"ruff-c405-unnecessary-literal-set\",kind:\"code\",title:\"Ruff C405: Unnecessary literal set\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write a set literal instead of passing a list or tuple literal to set(); the call builds a throwaway sequence first.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-literal-set\",violation:{message:\"Replace `set([...])` or `set((...))` with the set literal `{...}`; an empty sequence becomes `set()`.\"}}]}},{id:\"ruff-c406-unnecessary-literal-dict\",kind:\"code\",title:\"Ruff C406: Unnecessary literal dict\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write a dict literal instead of passing a list or tuple of pairs to dict(); the call builds a throwaway sequence first.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-literal-dict\",violation:{message:\"Rewrite `dict([(k, v), ...])` as the dict literal `{k: v, ...}` and `dict([])` as `{}`; leave it when a pair unpacks with `*`, as in `(k, *v)`.\"}}]}},{id:\"ruff-c408-unnecessary-collection-call\",kind:\"code\",title:\"Ruff C408: Unnecessary collection call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a literal instead of calling dict(), list() or tuple() with no arguments, or dict() with only named keyword arguments; the literal is clearer and skips a call.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-collection-call\",violation:{message:'Replace the call with a literal: `{}` for `dict()`, `{\"a\": 1}` for `dict(a=1)`, `[]` for `list()`, `()` for `tuple()`.'}}]}},{id:\"ruff-c409-unnecessary-literal-within-tuple-call\",kind:\"code\",title:\"Ruff C409: Unnecessary literal within tuple call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write a tuple literal instead of passing a list or tuple literal to the tuple constructor; the extra call only adds work.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"list-literal-within-tuple-call\",violation:{message:\"Write the elements as a tuple literal `(...)` instead of `tuple([...])`; a single element needs a trailing comma, as in `(x,)`.\"}}]}},{id:\"ruff-c410-unnecessary-literal-within-list-call\",kind:\"code\",title:\"Ruff C410: Unnecessary literal within list call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write a list literal instead of passing a list or tuple literal to the list constructor; the call only copies the literal.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"list-literal-within-list-call\",violation:{message:\"Remove the outer `list()` call and keep the list literal it wraps; the call only copies a list that nothing else references.\"}}]}},{id:\"ruff-c411-unnecessary-list-call\",kind:\"code\",title:\"Ruff C411: Unnecessary list call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove the list call around a list comprehension; the comprehension already builds a new list.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-list-call\",violation:{message:\"Remove the outer `list()` call and keep the list comprehension; it already builds a new list.\"}}]}},{id:\"ruff-c413-unnecessary-call-around-sorted\",kind:\"code\",title:\"Ruff C413: Unnecessary call around sorted\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove a list or reversed call wrapped around sorted; sorted already returns a new list and can sort in reverse order itself.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"list-call-around-sorted\",violation:{message:\"Remove the `list()` call around `sorted()`; `sorted()` already returns a new list.\"}}]}},{id:\"ruff-c414-unnecessary-double-cast-or-process\",kind:\"code\",title:\"Ruff C414: Unnecessary double cast or process\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove a list, tuple, set, sorted or reversed call nested directly inside a list, tuple, set or sorted call; the outer call already accepts any iterable.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-c415-unnecessary-subscript-reversal\",kind:\"code\",title:\"Ruff C415: Unnecessary subscript reversal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Don't reverse an iterable with a slice before passing it to set, sorted or reversed; each of them reorders or reverses it again anyway.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-c416-unnecessary-comprehension\",kind:\"code\",title:\"Ruff C416: Unnecessary comprehension\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass the iterable to list, set or dict directly instead of a comprehension that rebuilds it unchanged.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-c417-unnecessary-map\",kind:\"code\",title:\"Ruff C417: Unnecessary map\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a comprehension or generator expression instead of map with a lambda; it avoids a function call for each item.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-c418-unnecessary-literal-within-dict-call\",kind:\"code\",title:\"Ruff C418: Unnecessary literal within dict call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove dict() calls wrapped around a dict literal or dict comprehension; the inner expression already builds a dictionary.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-literal-within-dict-call\",violation:{message:\"Drop the outer `dict()` call and keep the inner dict literal or comprehension; it already builds a new dictionary.\"}}]}},{id:\"ruff-c419-unnecessary-comprehension-in-call\",kind:\"code\",title:\"Ruff C419: Unnecessary comprehension in call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a generator expression to any() and all() instead of a list or set comprehension; it saves memory and lets them stop early.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-comprehension-in-call\",violation:{message:\"Drop the comprehension's brackets or braces to pass a generator expression so the call can stop early; keep the comprehension only if every element must be evaluated for its side effects.\"}}]}},{id:\"ruff-c420-unnecessary-dict-comprehension-for-iterable\",kind:\"code\",title:\"Ruff C420: Unnecessary dict comprehension for iterable\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use dict.fromkeys(iterable, value) instead of a dict comprehension that maps each item to the same constant value; it is clearer and faster.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-dict-comprehension-for-iterable\",violation:{message:\"Replace this comprehension with `dict.fromkeys(iterable, value)`, omitting the value when it is None; if the loop unpacks its items, do this only when they are already tuples.\"}}]}},{id:\"ruff-c901-complex-structure\",kind:\"code\",title:\"Ruff C901: Complex structure\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Split Python functions with many branches, loops, exception handlers and nested functions into smaller ones; heavily branching code is hard to read, test and change.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-com818-trailing-comma-on-bare-tuple\",kind:\"code\",title:\"Ruff COM818: Trailing comma on bare tuple\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove a stray comma at the end of a statement, or parenthesize the tuple; a trailing comma silently turns the value into a tuple.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"trailing-comma-on-bare-tuple\",violation:{message:\"Remove the trailing comma if a single value was meant; if a tuple is intended, parenthesize it as `(value,)`.\"}}]}},{id:\"ruff-d101-undocumented-public-class\",kind:\"code\",title:\"Ruff D101: Undocumented public class\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Give each public Python class a docstring that explains what it represents and how to use it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undocumented-public-class\",violation:{message:\"Add a docstring as the first statement of class `$N`, explaining what it represents and how to use it.\"}}]}},{id:\"ruff-d102-undocumented-public-method\",kind:\"code\",title:\"Ruff D102: Undocumented public method\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Document each public Python method with a docstring describing its behavior, arguments and return value.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undocumented-public-method\",violation:{message:\"Add a docstring as the first statement of method `$N` describing what it does, its arguments and return value; if it overrides a documented base method, decorate it with `@override` instead.\"}}]}},{id:\"ruff-d103-undocumented-public-function\",kind:\"code\",title:\"Ruff D103: Undocumented public function\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Document each public Python function with a docstring describing its behavior, arguments and return value.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undocumented-public-function\",violation:{message:\"Add a docstring as the first statement of function `$N`, describing what it does, its arguments and its return value.\"}}]}},{id:\"ruff-d104-undocumented-public-package\",kind:\"code\",title:\"Ruff D104: Undocumented public package\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Give each public Python package a docstring at the top of its init module that describes what the package provides.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undocumented-public-package\",violation:{message:\"Add a docstring as the first statement of this package's `__init__.py`, summarizing what the package provides.\"}}]}},{id:\"ruff-d105-undocumented-magic-method\",kind:\"code\",title:\"Ruff D105: Undocumented magic method\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Add a docstring to each magic method of a public class, describing what the operation does and returns.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-d106-undocumented-public-nested-class\",kind:\"code\",title:\"Ruff D106: Undocumented public nested class\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Add a docstring to each public nested class; it does not inherit the docstring of the class that encloses it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-d107-undocumented-public-init\",kind:\"code\",title:\"Ruff D107: Undocumented public init\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Add a docstring to the __init__ method of each public class, describing its arguments and side effects.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-d200-unnecessary-multiline-docstring\",kind:\"code\",title:\"Ruff D200: Unnecessary multiline docstring\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Write a docstring with a single line of text on one line, with the quotes beside the text, not on lines of their own.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unnecessary-multiline-docstring\",violation:{message:'Put this docstring\\'s only line of text on one line with its quotes: `\"\"\"Text.\"\"\"`; escape a quote or backslash that would then touch the closing quotes.'}}]}},{id:\"ruff-d205-missing-blank-line-after-summary\",kind:\"code\",title:\"Ruff D205: Missing blank line after summary\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Separate a multi-line docstring's summary line from the description below it with exactly one blank line.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"missing-blank-line-after-summary\",violation:{message:\"Leave exactly one blank line between this docstring's summary line and the description; if the summary wraps onto a second line, shorten it to fit on one line instead.\"}}]}},{id:\"ruff-d209-new-line-after-last-paragraph\",kind:\"code\",title:\"Ruff D209: New line after last paragraph\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Put the closing quotes of a multi-line docstring on their own line.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"new-line-after-last-paragraph\",violation:{message:\"Move this docstring's closing quotes onto a new line after its last line of text.\"}}]}},{id:\"ruff-d212-multi-line-summary-first-line\",kind:\"code\",title:\"Ruff D212: Multi line summary first line\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Start a multi-line docstring's summary right after the opening quotes, on the first line.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"multi-line-summary-first-line\",violation:{message:\"Move this docstring's summary onto the line with the opening quotes, removing the line break after them.\"}}]}},{id:\"ruff-d215-overindented-section-underline\",kind:\"code\",title:\"Ruff D215: Overindented section underline\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Align a docstring section's dashed underline with the docstring's own indentation, not deeper than it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-d300-triple-single-quotes\",kind:\"code\",title:\"Ruff D300: Triple single quotes\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use triple double quotes for docstrings, or triple single quotes when the text itself contains triple double quotes.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-d301-escape-sequence-in-docstring\",kind:\"code\",title:\"Ruff D301: Escape sequence in docstring\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Make docstrings that contain backslashes raw strings; a backslash in a plain string starts an escape sequence and can change the text.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"escape-sequence-in-docstring\",violation:{message:\"Add an `r` prefix (replacing any `u`) so backslashes stay literal, writing each `\\\\\\\\` as one `\\\\`; keep the plain string if an escape like `\\\\t` or `\\\\x41` must take effect.\"}}]}},{id:\"ruff-d402-signature-in-docstring\",kind:\"code\",title:\"Ruff D402: Signature in docstring\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Describe what a function does in its docstring's first line instead of repeating its signature.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"signature-in-docstring\",violation:{message:\"Reword this docstring's first line so it no longer spells `$NAME(...)`; say what the function does, since the signature already shows its parameters.\"}}]}},{id:\"ruff-d403-first-word-uncapitalized\",kind:\"code\",title:\"Ruff D403: First word uncapitalized\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Capitalize the first word of every function docstring.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"first-word-uncapitalized\",violation:{message:\"Capitalize the first word of this docstring, for example `Return the total.` instead of `return the total.`\"}}]}},{id:\"ruff-d404-docstring-starts-with-this\",kind:\"code\",title:\"Ruff D404: Docstring starts with this\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Start a docstring with an imperative verb rather than the word This; a summary phrased as a command reads consistently.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"docstring-starts-with-this\",violation:{message:\"Reword this docstring's summary so it does not open with \\\"This\\\": start a function's with an imperative verb (`Return the total.`), a class's or module's with what it is.\"}}]}},{id:\"ruff-d406-missing-new-line-after-section-name\",kind:\"code\",title:\"Ruff D406: Missing new line after section name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"End a NumPy-style section name at the end of its line, with no colon or trailing whitespace after it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"section-name-suffix\",violation:{message:\"Remove the colon or trailing whitespace after the section name `$NAME` so the line holds only the name.\"}}]}},{id:\"ruff-d408-missing-section-underline-after-name\",kind:\"code\",title:\"Ruff D408: Missing section underline after name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Put a section underline on the line directly below the section name, with no blank line between them.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"underline-after-blank-shared\",violation:{message:\"Move this underline up to the line directly below the section name, removing the blank lines between them.\"}}]}},{id:\"ruff-d409-mismatched-section-underline-length\",kind:\"code\",title:\"Ruff D409: Mismatched section underline length\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Make a section underline exactly as long as the section name above it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"underline-length-shared\",violation:{message:\"Make this underline exactly as many dashes as the section name above it has characters.\"}}]}},{id:\"ruff-d411-no-blank-line-before-section\",kind:\"code\",title:\"Ruff D411: No blank line before section\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Put a blank line before each docstring section header, such as Args or Returns, to separate it from the text above.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-d412-blank-lines-between-header-and-content\",kind:\"code\",title:\"Ruff D412: Blank lines between header and content\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Start each docstring section's content on the line right after its header, without blank lines in between, for a consistent docstring layout.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-d418-overload-with-docstring\",kind:\"code\",title:\"Ruff D418: Overload with docstring\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Document an overloaded Python function on its implementation instead of its overload signatures, which the implementation replaces at runtime.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"overload-with-docstring\",violation:{message:\"Remove the docstring from this `@overload` signature and document the function on its implementation instead.\"}}]}},{id:\"ruff-d419-empty-docstring\",kind:\"code\",title:\"Ruff D419: Empty docstring\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Write a summary in every Python docstring or remove it; an empty docstring documents nothing.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"empty-docstring\",violation:{message:\"Write a one-line summary of what this module, class or function does in the docstring, or delete the empty docstring.\"}}]}},{id:\"ruff-dtz001-call-datetime-without-tzinfo\",kind:\"code\",title:\"Ruff DTZ001: Call datetime without tzinfo\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a real timezone when constructing a datetime; a naive datetime carries no zone information and causes subtle bugs.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-dtz002-call-datetime-today\",kind:\"code\",title:\"Ruff DTZ002: Call datetime today\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use datetime.now with a timezone instead of datetime.today; today returns a naive local time with no zone information.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"call-datetime-today\",violation:{message:\"Replace `today()` with `now(tz=...)`, passing the zone you mean (`datetime.timezone.utc` for UTC) so the result is aware. Keep `today()` only where a naive local time is required.\"}}]}},{id:\"ruff-dtz003-call-datetime-utcnow\",kind:\"code\",title:\"Ruff DTZ003: Call datetime utcnow\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use datetime.now with a timezone instead of datetime.utcnow; utcnow returns a naive datetime that carries no zone information.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"call-datetime-utcnow\",violation:{message:\"Replace `utcnow()` with `now(tz=datetime.timezone.utc)` for an aware UTC datetime. Keep `utcnow()` only where the value is mixed with naive datetimes that cannot change too.\"}}]}},{id:\"ruff-dtz004-call-datetime-utcfromtimestamp\",kind:\"code\",title:\"Ruff DTZ004: Call datetime utcfromtimestamp\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use datetime.fromtimestamp with a timezone instead of utcfromtimestamp; utcfromtimestamp returns a naive datetime with no zone information.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"call-datetime-utcfromtimestamp\",violation:{message:\"Replace `utcfromtimestamp(ts)` with `fromtimestamp(ts, tz=datetime.timezone.utc)` for an aware UTC datetime. Keep it only where the value is mixed with naive datetimes that cannot change too.\"}}]}},{id:\"ruff-dtz005-call-datetime-now-without-tzinfo\",kind:\"code\",title:\"Ruff DTZ005: Call datetime now without tzinfo\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a real timezone to datetime.now; without one, or with None, it returns a naive local time with no zone information.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-dtz006-call-datetime-fromtimestamp\",kind:\"code\",title:\"Ruff DTZ006: Call datetime fromtimestamp\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a timezone when building a datetime from a timestamp; without one you get a naive local time that can't be safely compared with aware datetimes.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-dtz007-call-datetime-strptime-without-zone\",kind:\"code\",title:\"Ruff DTZ007: Call datetime strptime without zone\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Make datetimes parsed from text timezone-aware, by parsing a UTC offset or attaching a timezone afterwards; naive datetimes can't be safely compared with aware ones.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-dtz011-call-date-today\",kind:\"code\",title:\"Ruff DTZ011: Call date today\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Derive today's date from a timezone-aware current datetime instead of the naive local date; the local date depends on the machine's timezone.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"call-date-today\",violation:{message:\"Use `datetime.datetime.now(tz=...).date()` with the timezone whose calendar date you need; `date.today()` is the naive local date, so keep it only if that is intended.\"}}]}},{id:\"ruff-dtz012-call-date-fromtimestamp\",kind:\"code\",title:\"Ruff DTZ012: Call date fromtimestamp\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Derive a date from a timestamp through a timezone-aware datetime instead of the naive local date; the local date depends on the machine's timezone.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"call-date-fromtimestamp\",violation:{message:\"Use `datetime.datetime.fromtimestamp(\u003ctimestamp>, tz=...).date()` with the timezone whose date you need; `date.fromtimestamp` gives the naive local date, so keep it only if intended.\"}}]}},{id:\"ruff-dtz901-datetime-min-max\",kind:\"code\",title:\"Ruff DTZ901: Datetime min max\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Attach a timezone to the minimum and maximum datetime constants; the bare values are naive and fail when ordered against aware datetimes.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"datetime-min-max\",violation:{message:\"Use `datetime.datetime.$M.replace(tzinfo=...)` so the value is aware; the bare naive value raises TypeError when ordered against aware datetimes. Keep it only when the other values are naive.\"}}]}},{id:\"ruff-e401-multiple-imports-on-one-line\",kind:\"code\",title:\"Ruff E401: Multiple imports on one line\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Give each module its own import statement instead of comma-separating several in one; from-imports may still list several names.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"multiple-imports-on-one-line\",violation:{message:\"Split this into one `import` statement per module, each on its own line (or separated by `;` on a line that already holds other statements).\"}}]}},{id:\"ruff-em101-raw-string-in-exception\",kind:\"code\",title:\"Ruff EM101: Raw string in exception\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Assign an exception message to a variable before raising instead of passing a string literal; the traceback otherwise shows the message twice.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"raw-string-in-exception\",violation:{message:\"Assign this string literal to a new variable such as `msg` before the `raise`, then pass that variable to the exception instead.\"}}]}},{id:\"ruff-em102-f-string-in-exception\",kind:\"code\",title:\"Ruff EM102: F string in exception\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Assign an f-string exception message to a variable before raising instead of building it inline; the traceback otherwise shows the message twice.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"f-string-in-exception\",violation:{message:\"Assign this f-string to a new variable such as `msg` before the `raise`, then pass that variable to the exception instead.\"}}]}},{id:\"ruff-em103-dot-format-in-exception\",kind:\"code\",title:\"Ruff EM103: Dot format in exception\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Assign a formatted exception message to a variable before raising instead of calling format on a literal inline; the traceback otherwise shows the message twice.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"dot-format-in-exception\",violation:{message:\"Assign the result of this `.format()` call to a new variable such as `msg` before the `raise`, then pass that variable to the exception instead.\"}}]}},{id:\"ruff-era001-commented-out-code\",kind:\"code\",title:\"Ruff ERA001: Commented out code\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove commented-out code; version control keeps the history, and dead code left in comments goes stale.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"commented-out-code\",violation:{message:\"Delete this commented-out code; version control keeps the history. Leave it only if the comment is prose or an example that merely looks like code.\"}}]}},{id:\"ruff-f631-assert-tuple\",kind:\"code\",title:\"Ruff F631: Assert tuple\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't use a tuple as an assert's condition; a non-empty tuple is always true, so the assert never fails.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"assert-tuple\",violation:{message:\"Assert test is a non-empty tuple, which is always `True`\"}}]}},{id:\"ruff-f634-if-tuple\",kind:\"code\",title:\"Ruff F634: If tuple\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:2,description:\"Don't use a tuple as an if or elif condition; a non-empty tuple is always true, so the branch always runs.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"if-tuple\",violation:{message:\"Replace this tuple condition with the intended boolean expression; a non-empty tuple is always true.\"}}]}},{id:\"ruff-f722-forward-annotation-syntax-error\",kind:\"code\",title:\"Ruff F722: Forward annotation syntax error\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:2,description:\"Keep string type annotations and other forward references valid Python expressions; a syntax error there breaks type checking and runtime evaluation.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"forward-annotation-syntax-error\",violation:{message:\"Syntax error in forward annotation\"}}]}},{id:\"ruff-fast001-fast-api-redundant-response-model\",kind:\"code\",title:\"Ruff FAST001: Fast api redundant response model\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Remove a FastAPI route's response_model argument when it repeats the return annotation; FastAPI already infers the response model from it.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"redundant-response-model\",violation:{message:\"Remove `response_model=$RM`: FastAPI 0.89 and newer already use the route's return annotation, which names the same type. Keep it on older versions.\"}}]}},{id:\"ruff-fast002-fast-api-non-annotated-dependency\",kind:\"code\",title:\"Ruff FAST002: Fast api non annotated dependency\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Declare FastAPI route dependencies and parameter markers inside Annotated type hints instead of as default values, so the function keeps ordinary defaults when called directly.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-fast003-fast-api-unused-path-parameter\",kind:\"code\",title:\"Ruff FAST003: Fast api unused path parameter\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Declare each path parameter of a FastAPI route as a function parameter, so the route can read the value its path captures.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"unused-path-parameter\",violation:{message:\"Declare `$K` as a non-positional-only parameter of `$FN` so FastAPI passes the `{$K}` path value. Leave it if the handler reads `request.path_params`; else drop `{$K}` from the path.\"}}]}},{id:\"ruff-fbt001-boolean-type-hint-positional-argument\",kind:\"code\",title:\"Ruff FBT001: Boolean type hint positional argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Make Python function parameters annotated as bool keyword-only; a bare True or False passed by position hides what it switches.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"boolean-type-hint-positional-argument\",violation:{message:\"Make the boolean parameter `$NAME` keyword-only by moving it after `*` and update positional callers; keep it positional only when a parent signature or callback protocol requires it.\"}}]}},{id:\"ruff-fbt002-boolean-default-value-positional-argument\",kind:\"code\",title:\"Ruff FBT002: Boolean default value positional argument\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Make Python function parameters that default to True or False keyword-only; a positional boolean flag makes calls hard to read.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"boolean-default-value-positional-argument\",violation:{message:\"Make `$NAME` keyword-only by moving it after `*` and update positional callers; keep it positional only when a parent signature or callback protocol requires it.\"}}]}},{id:\"ruff-fbt003-boolean-positional-value-in-call\",kind:\"code\",title:\"Ruff FBT003: Boolean positional value in call\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass True and False to Python calls as keyword arguments rather than positionally; a bare boolean does not say what it switches.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"options\"}]}},{id:\"ruff-fix001-line-contains-fixme\",kind:\"code\",title:\"Ruff FIX001: Line contains fixme\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Resolve the bug or unexpected behavior a FIXME comment marks before shipping, then remove the comment.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"line-contains-fixme\",violation:{message:\"Fix the bug this `$D` comment describes, then remove the `$D` note; if the fix belongs in a separate change, leave the note until that change lands.\"}}]}},{id:\"ruff-fix002-line-contains-todo\",kind:\"code\",title:\"Ruff FIX002: Line contains todo\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Resolve the missing feature, optimization or refactoring a TODO comment marks before shipping, then remove the comment.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"line-contains-todo\",violation:{message:\"Do the work this `$D` comment describes, then remove the `$D` note; if the work belongs in a separate change or the note documents planned work on purpose, leave it.\"}}]}},{id:\"ruff-fix003-line-contains-xxx\",kind:\"code\",title:\"Ruff FIX003: Line contains xxx\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Resolve the issue an XXX comment marks before shipping, or at least replace it with a more descriptive tag such as TODO.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"line-contains-xxx\",violation:{message:\"Fix the issue this `$D` comment flags, then remove the `$D` note; if the fix belongs in a separate change, replace `$D` with a more descriptive tag such as `TODO`.\"}}]}},{id:\"ruff-fix004-line-contains-hack\",kind:\"code\",title:\"Ruff FIX004: Line contains hack\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Replace the workaround a HACK comment marks with a proper solution before shipping, then remove the comment.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"line-contains-hack\",violation:{message:\"Replace the workaround this `$D` comment describes with a proper solution, then remove the `$D` note; if no better solution exists yet, leave it.\"}}]}},{id:\"ruff-fly002-static-join-to-f-string\",kind:\"code\",title:\"Ruff FLY002: Static join to f string\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use an f-string or a single string literal instead of joining a fixed list of values with a literal separator; it reads more clearly.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"shared\"}]}},{id:\"ruff-g001-logging-string-format\",kind:\"code\",title:\"Ruff G001: Logging string format\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass values to a logging call as arguments instead of formatting its message with str.format; the logger then formats only records it emits.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-string-format\",violation:{message:'Pass the values as logger arguments with `%s` placeholders, e.g. `logger.info(\"x=%s\", x)`, instead of `.format()`, doubling any literal `%`; leave it if the logger is not from `logging`.'}}]}},{id:\"ruff-g002-logging-percent-format\",kind:\"code\",title:\"Ruff G002: Logging percent format\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass values to a logging call as arguments instead of formatting its message with the percent operator; the logger then formats only records it emits.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-percent-format\",violation:{message:'Pass the values after `%` as logger arguments, e.g. `logger.info(\"x=%s\", x)` not `logger.info(\"x=%s\" % x)`; leave it if `%` is arithmetic or the logger is not from `logging`.'}}]}},{id:\"ruff-g003-logging-string-concat\",kind:\"code\",title:\"Ruff G003: Logging string concat\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass values to a logging call as arguments instead of building its message by string concatenation; the logger then formats only records it emits.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-string-concat\",violation:{message:'Use a `%s` format string and pass the values as logger arguments, e.g. `logger.info(\"x=%s\", x)`, doubling any literal `%`; leave it if `+` adds numbers or the logger is not from `logging`.'}}]}},{id:\"ruff-g004-logging-f-string\",kind:\"code\",title:\"Ruff G004: Logging f string\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Pass values to a logging call as arguments instead of interpolating them into an f-string message; the logger then formats only records it emits.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-f-string\",violation:{message:'Replace the f-string with a `%s` format string and pass its values as logger arguments, e.g. `logger.info(\"x=%s\", x)`, doubling any literal `%`; leave it if the logger is not from `logging`.'}}]}},{id:\"ruff-g010-logging-warn\",kind:\"code\",title:\"Ruff G010: Logging warn\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Call the warning logging method instead of warn; warn is a deprecated alias of warning.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-warn\",violation:{message:\"Replace the deprecated `warn` logging call with `warning`, which takes the same arguments; leave it if this object is not a standard logger and has no `warning` method.\"}}]}},{id:\"ruff-g101-logging-extra-attr-clash\",kind:\"code\",title:\"Ruff G101: Logging extra attr clash\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Avoid extra keys that clash with built-in LogRecord attributes in logging calls; the logging call raises KeyError when they collide.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-extra-attr-clash\",violation:{message:\"Rename the `extra` key $K: it clashes with a built-in LogRecord attribute, so a standard-library logger raises KeyError when it builds the record.\"}}]}},{id:\"ruff-g201-logging-exc-info\",kind:\"code\",title:\"Ruff G201: Logging exc info\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use the exception logging method instead of error with exc_info inside exception handlers; it logs the same traceback at ERROR level.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-exc-info\",violation:{message:\"Call `exception(...)` instead and drop `exc_info`: in an except block it logs the same traceback at ERROR level. Leave it if this object is not a standard logger.\"}}]}},{id:\"ruff-g202-logging-redundant-exc-info\",kind:\"code\",title:\"Ruff G202: Logging redundant exc info\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove exc_info from exception logging calls inside exception handlers; the exception method already logs the traceback.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"logging-redundant-exc-info\",violation:{message:\"Remove this redundant `exc_info` argument: `exception(...)` already logs the active exception's traceback.\"}}]}},{id:\"ruff-icn001-unconventional-import-alias\",kind:\"code\",title:\"Ruff ICN001: Unconventional import alias\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Import well-known libraries under their community aliases, such as pandas as pd, numpy as np and matplotlib.pyplot as plt, so readers recognize them at a glance.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"import-statement\",violation:{message:\"Write `import $MOD as $E` and rename its uses to match; keep the current name only if `$E` already means something else in this module.\"}}]}},{id:\"ruff-int001-f-string-in-get-text-func-call\",kind:\"code\",title:\"Ruff INT001: F string in get text func call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a constant template to a gettext call and format the translated result; an f-string is evaluated before the catalog lookup.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"f-string-in-gettext-call\",violation:{message:'Translate a constant template, then format the result: `_(\"Hello, %s!\") % name`, not `_(f\"Hello, {name}!\")`. Leave it if the callee is not a translation function or the text is a computed catalog key.'}}]}},{id:\"ruff-int002-format-in-get-text-func-call\",kind:\"code\",title:\"Ruff INT002: Format in get text func call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a constant template to a gettext call and format the translated result; a format method call is evaluated before the catalog lookup.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"format-in-gettext-call\",violation:{message:'Translate the template, then format it: `_(\"Hello, {}!\").format(name)`, not `_(\"Hello, {}!\".format(name))`. Leave it if the callee is not a translation function or the text is a computed catalog key.'}}]}},{id:\"ruff-int003-printf-in-get-text-func-call\",kind:\"code\",title:\"Ruff INT003: Printf in get text func call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass a constant template to a gettext call and format the translated result; a printf-style formatted string is evaluated before the catalog lookup.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"printf-in-gettext-call\",violation:{message:'Translate the template, then format the result: `_(\"Hello, %s!\") % name`, not `_(\"Hello, %s!\" % name)`. Leave it if the callee is not a translation function or the text is a computed catalog key.'}}]}},{id:\"ruff-isc001-single-line-implicit-string-concatenation\",kind:\"code\",title:\"Ruff ISC001: Single line implicit string concatenation\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Join string literals that are implicitly concatenated on one line into a single literal; the split adds nothing and may hide a forgotten comma.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"pairs-from-first-literal\",violation:{message:\"Merge these adjacent literals into one string, escaping any braces or quotes the merge exposes; if they were meant as separate items, add the missing comma instead.\"}}]}},{id:\"ruff-isc003-explicit-string-concatenation\",kind:\"code\",title:\"Ruff ISC003: Explicit string concatenation\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Join string literals split across lines by implicit concatenation inside parentheses instead of the + operator, which adds noise without changing the result.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"explicit-string-concatenation\",violation:{message:\"Drop the `+` so the string literals concatenate implicitly inside parentheses; unwrap parenthesized operands first, and keep `+` if the result would become a docstring.\"}}]}},{id:\"ruff-isc004-implicit-string-concatenation-in-collection-literal\",kind:\"code\",title:\"Ruff ISC004: Implicit string concatenation in collection literal\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Add the missing comma, or wrap the strings in parentheses, where adjacent strings concatenate inside a list, tuple or set literal; the merge usually hides a forgotten comma.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"implicit-string-concatenation-in-collection-literal\",violation:{message:\"Add the missing comma if these strings are separate items; if joining them is intended, wrap the concatenation in parentheses.\"}}]}},{id:\"ruff-log001-direct-logger-instantiation\",kind:\"code\",title:\"Ruff LOG001: Direct logger instantiation\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use logging.getLogger() instead of instantiating Logger directly; a directly created logger is not part of the logger tree and bypasses logging configuration.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"direct-logger-instantiation\",violation:{message:\"Use `logging.getLogger(name)` instead of `Logger(...)`; a direct instance skips the logger tree and its configuration. Keep it only if a detached logger is intended.\"}}]}},{id:\"ruff-log002-invalid-get-logger-argument\",kind:\"code\",title:\"Ruff LOG002: Invalid get logger argument\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Pass __name__ to logging.getLogger() instead of __file__ or __cached__; logger names should be dotted module names, not file paths.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"invalid-get-logger-argument\",violation:{message:\"Pass `__name__` to `logging.getLogger()` instead of `__file__` or `__cached__`; logger names should be dotted module names, not paths. Keep it only if existing config targets the path-named logger.\"}}]}},{id:\"ruff-log004-log-exception-outside-except-handler\",kind:\"code\",title:\"Ruff LOG004: Log exception outside except handler\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use error instead of exception for logging calls made outside an except handler; there is no active exception to record there.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"log-exception-outside-except-handler\",violation:{message:\"Call `error` instead of `exception` here: outside an except block there is no exception to attach. Leave it if this code only ever runs while an exception is being handled.\"}}]}},{id:\"ruff-log007-exception-without-exc-info\",kind:\"code\",title:\"Ruff LOG007: Exception without exc info\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Use error instead of exception when a logging call sets exc_info to a falsy value; it logs the same message and states the intent plainly.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"exception-without-exc-info\",violation:{message:\"Call `error` instead of `exception` and drop the falsy `exc_info` argument: the log output is the same and the intent is clearer.\"}}]}},{id:\"ruff-log009-undocumented-warn\",kind:\"code\",title:\"Ruff LOG009: Undocumented warn\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use logging.WARNING instead of logging.WARN; WARN is an undocumented alias that the logging documentation does not mention.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"undocumented-warn\",violation:{message:\"Replace this use of the undocumented `WARN` alias with `logging.WARNING` (or `WARNING` imported from `logging`); the value is identical.\"}}]}},{id:\"ruff-log014-exc-info-outside-except-handler\",kind:\"code\",title:\"Ruff LOG014: Exc info outside except handler\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Remove exc_info from logging calls made outside an except handler; with no active exception it only logs a meaningless None traceback.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"exc-info-outside-except-handler\",violation:{message:\"Remove this `exc_info` argument: outside an except block there is no exception to attach. Leave it if this code only ever runs while an exception is being handled.\"}}]}},{id:\"ruff-log015-root-logger-call\",kind:\"code\",title:\"Ruff LOG015: Root logger call\",group:\"Ruff\",on:true,mode:\"steer\",doc:{revision:1,description:\"Use a logger from logging.getLogger(__name__) instead of the logging module's root logger functions; root logger messages carry no source information.\",scope:{include:[\"**/*\"],exclude:[]},clauses:[{id:\"root-logger-call\",violation:{message:\"Replace this root logger `$M()` call with the same call on a module-level `logger = logging.getLogger(__name__)`; root logger messages carry no source information. Leave it in a one-off script.\"}}]}},{id:\"ruff-n801-invalid-class-name\",kind:\"code\",title:\"Ruff N801: Invalid class name\",group:\"Ruff\",on:false,mode:\"steer\",doc:{revision:1,description:\"Name classes in CapWords style, starting wit
