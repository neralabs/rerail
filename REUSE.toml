version = 1

# Everything in this repository is Rerail's own work unless a more specific annotation below,
# or an SPDX header in the file itself, says otherwise. Copied or adapted third-party material
# gets its own [[annotations]] entry and an entry in THIRD_PARTY_NOTICES.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Nera Software Inc."
SPDX-License-Identifier = "Apache-2.0"

# Third-party material, one entry per THIRD_PARTY_NOTICES entry, which carries the upstream source,
# revision and notice. The licence texts are in LICENSES/.

# minishlab/potion-base-8M (manifest.json is Rerail's record of it).
[[annotations]]
path = ["model/config.json", "model/model.safetensors", "model/tokenizer.json"]
precedence = "override"
SPDX-FileCopyrightText = "Minish Lab contributors"
SPDX-License-Identifier = "MIT"

# palantir/tslint core rules, re-implemented as policy documents: the opt-in pack and the
# conformance harness's option variants.
[[annotations]]
path = ["policies/executable-policy-dsl/rules/opt-in/tslint/**", "conformance/tslint/rules/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2013 Palantir Technologies, Inc.", "2026 Nera Software Inc."]
SPDX-License-Identifier = "Apache-2.0"

# Unicode Character Database 15.1.0 names, as written by generate.py.
[[annotations]]
path = "native/src/policy_dsl/value/names/names.bin"
precedence = "override"
SPDX-FileCopyrightText = "1991-2023 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

# ESLint 10.11.0 globals, as written by generate_es_globals.mjs.
[[annotations]]
path = "native/src/policy_dsl/scope/data/es_globals.json"
precedence = "override"
SPDX-FileCopyrightText = "OpenJS Foundation and other contributors, <www.openjsf.org>"
SPDX-License-Identifier = "MIT"

# Ruff 0.16.9 builtins, as written by generate_python_builtins.py.
[[annotations]]
path = "native/src/policy_dsl/scope/data/python_builtins.json"
precedence = "override"
SPDX-FileCopyrightText = "2022 Charles Marsh"
SPDX-License-Identifier = "MIT"

# typescript-eslint 8.70.1 lib globals, generated by typescript-eslint from TypeScript's lib files,
# as written by generate_ts_lib_globals.mjs.
[[annotations]]
path = "native/src/policy_dsl/scope/data/ts_lib_globals.json"
precedence = "override"
SPDX-FileCopyrightText = ["2019 typescript-eslint and other contributors", "Microsoft Corporation"]
SPDX-License-Identifier = "MIT AND Apache-2.0"

# ast-grep-config 0.45.3 string case conversions, ported.
[[annotations]]
path = "native/src/policy_dsl/matcher/transform/string_case.rs"
precedence = "override"
SPDX-FileCopyrightText = ["2022 Herrington Darkholme", "2026 Nera Software Inc."]
SPDX-License-Identifier = "MIT"

# typescript-estree 8.70.1 JSX entities, as written by generate_entities.mjs.
[[annotations]]
path = "native/src/policy_dsl/value/ecma/entities.rs"
precedence = "override"
SPDX-FileCopyrightText = ["2019 typescript-eslint and other contributors", "2026 Nera Software Inc."]
SPDX-License-Identifier = "MIT"

# eslint-utils 4.10.1 getStaticValue allowlists, as written by generate_builtins.mjs.
[[annotations]]
path = "native/src/policy_dsl/value/ecma/builtins.rs"
precedence = "override"
SPDX-FileCopyrightText = ["2018 Toru Nagashima", "2026 Nera Software Inc."]
SPDX-License-Identifier = "MIT"

# EmranMR/tree-sitter-blade 0.12.2, vendored byte-identical. Its LICENSE sits beside it.
[[annotations]]
path = "native/grammars/tree-sitter-blade/**"
precedence = "override"
SPDX-FileCopyrightText = "2023 Emran Mashhadi Ramezan"
SPDX-License-Identifier = "MIT"

# Upstream's scanner and tag table, derived from tree-sitter-html.
[[annotations]]
path = ["native/grammars/tree-sitter-blade/src/scanner.c", "native/grammars/tree-sitter-blade/src/tag.h"]
precedence = "override"
SPDX-FileCopyrightText = ["2023 Emran Mashhadi Ramezan", "2014 Max Brunsfeld"]
SPDX-License-Identifier = "MIT"
