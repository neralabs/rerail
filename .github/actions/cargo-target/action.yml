name: Cargo target
description: >-
  Carries an engine build's cargo target directory between CI runs as an artifact, so a build starts from main's last
  one instead of cold. `restore` downloads the newest unexpired artifact of that name a push to main uploaded (none
  found, or a failed download, leaves a cold build, never a failure), unpacks it with the cargo registry it was built
  against, and runs `scripts/build/target-sources.mjs apply`: a fresh checkout dates every file now, which made cargo
  rebuild every workspace crate, so the files that build saw unchanged are dated before its outputs and cargo rebuilds
  only the crates a change reaches. `save`, after the build, records the sources the target was built from and
  uploads the target for later runs; ci.yml saves on pushes to main only. The job needs `actions: read`.

inputs:
  name:
    description: The artifact's name, one per OS and build (cargo-target-<target triple>).
    required: true
  mode:
    description: '"restore" before the build, "save" after it.'
    required: true

runs:
  using: composite
  steps:
    - id: find
      name: Find main's last cargo target
      if: inputs.mode == 'restore'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
      run: |
        run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=50" --jq '
          [.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main"
            and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty' || true)"
        if [ -z "$run_id" ]; then echo "No $NAME from main: a cold build"; fi
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

    - id: download
      name: Download main's last cargo target
      if: inputs.mode == 'restore' && steps.find.outputs.run-id != ''
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/cargo-target-in
        run-id: ${{ steps.find.outputs.run-id }}
        github-token: ${{ github.token }}

    # A failed unpack leaves a cold build: the target and the registry are removed, not half restored.
    - name: Unpack the cargo target
      if: inputs.mode == 'restore' && steps.download.outcome == 'success'
      shell: bash
      run: |
        set -uo pipefail
        in="$RUNNER_TEMP/cargo-target-in"
        unpack() { case "$1" in *.zst) zstd -dc "$1" ;; *) gzip -dc "$1" ;; esac; }
        mkdir -p "$HOME"
        if unpack "$(ls "$in"/target.tar.*)" | tar -xf - \
          && unpack "$(ls "$in"/cargo-home.tar.*)" | tar -xf - -C "$HOME"; then
          node scripts/build/target-sources.mjs apply target
        else
          echo "::warning::cargo-target: main's target did not unpack; building cold."
          rm -rf target "$HOME/.cargo/registry/index" "$HOME/.cargo/registry/cache" "$HOME/.cargo/git/db"
        fi
        rm -rf "$in"

    - name: Pack the cargo target
      if: inputs.mode == 'save'
      shell: bash
      run: |
        set -euo pipefail
        node scripts/build/target-sources.mjs record target
        out="$RUNNER_TEMP/cargo-target-out"
        rm -rf "$out" && mkdir -p "$out"
        if command -v zstd >/dev/null; then ext=zst; pack() { zstd -T0 -3 -c; }; else ext=gz; pack() { gzip -1 -c; }; fi
        tar -cf - target | pack > "$out/target.tar.$ext"
        # The crates' downloads and the index, so the next build reads nothing from crates.io; cargo unpacks their
        # sources again, and judges crates.io crates by version, not by time.
        paths=()
        for path in .cargo/registry/index .cargo/registry/cache .cargo/git/db; do
          if [ -d "$HOME/$path" ]; then paths+=("$path"); fi
        done
        tar -cf - -C "$HOME" "${paths[@]}" | pack > "$out/cargo-home.tar.$ext"
        ls -l "$out"

    # About 0.6 GB per OS (zstd), kept a week: a run on any branch restores the newest one main uploaded.
    - name: Upload the cargo target
      if: inputs.mode == 'save'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/cargo-target-out/
        if-no-files-found: error
        overwrite: true
        retention-days: 7
        compression-level: 0
