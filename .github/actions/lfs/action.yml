name: Git LFS objects
description: >-
  Replaces the checkout's Git LFS pointers (the embedding model, the engine's Unicode names table) with their content.
  The objects come from a cache keyed on their ids (`git lfs ls-files -l`), so a run downloads them from LFS only
  when one of them changes. Use it right after `actions/checkout`, which leaves the pointers when `lfs` is false. The
  cache is saved by an explicit step straight after the pull, never in the post-job step: by the end of a port
  readiness job the recorder may have run upstream's code, which could have rewritten .git/lfs.

inputs:
  save:
    description: >-
      Save the objects to the cache on a miss. A job that runs a pull request's code under pull_request_target sets it
      to false: it would save into the base branch's scope, which every workflow on main restores.
    default: "true"

runs:
  using: composite
  steps:
    - id: objects
      name: List the LFS objects
      shell: bash
      run: echo "digest=$(git lfs ls-files -l | sort | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    # Restore only. actions/cache would save in its post-job step, after whatever the job ran.
    - id: restored
      name: Restore the LFS objects
      uses: actions/cache/restore@v6
      with:
        path: .git/lfs
        key: lfs-${{ steps.objects.outputs.digest }}

    # The checkout keeps no credentials (`persist-credentials: false`); the token is passed for this
    # command only, as actions/checkout passes it, and fetches nothing the cache already holds.
    - name: Check out the LFS objects
      shell: bash
      env:
        TOKEN: ${{ github.token }}
      run: |
        auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
        git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" lfs pull

    # Saved here, before any later step of the job runs, so what lands in the cache is what LFS served.
    - name: Save the LFS objects
      if: steps.restored.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: .git/lfs
        key: lfs-${{ steps.objects.outputs.digest }}
