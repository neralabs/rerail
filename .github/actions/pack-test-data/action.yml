name: Pack test data
description: >-
  Puts the packs' test data (every file PACK_FIXTURE_PATTERNS in scripts/s3/pack-fixtures.mjs matches under
  packs/<pack>/upstream/<tool>/) into the checkout: for each selected tool-pack, the archive its test-data.lock names by
  sha256 (CONTRIBUTING.md, "Pack test data"), verified against the lock and extracted, with a pull request's publish/
  laid over it (`fixtures:pull`), and the real-code samples archive its samples.lock names, when it has one, verified
  and extracted under .rerail/pack-data/samples/. The archives come from s3://nera-test-fixtures/rerail/archives/ under
  the repository's OIDC read role and travel between the jobs of one workflow run as an artifact named by the locks.
  Nothing is derived here: a pin change reaches CI only as the archives and locks the upstream bump's pull request
  commits. Use it right after `actions/checkout`, once per tool-pack or once for all of them, in one of two kinds of
  job. The fetching job (`fetch: "true"`) pulls the archives from S3 and uploads them as the run's artifact; it needs
  `id-token: write` and `contents: read` (a reusable workflow's caller must grant them too), downloads no artifact and
  runs nothing but this commit's scripts/s3/pack-fixtures.mjs, and runs only for pushes and same-repository pull
  requests, since GitHub gives a fork's or Dependabot's pull request no OIDC token. The AWS credentials reach the pull
  step alone, never the job's environment. The consuming job (`fetch: "false"`) downloads the artifact the fetching job
  of the same workflow run uploaded, verifies each archive against its lock and extracts it; it holds no `id-token`,
  never assumes a role and never uploads, and a missing artifact fails. So a job with `id-token: write` never extracts
  what another job wrote, and a job that extracts it, or runs upstream's code (the generators), holds no token to mint.
  Consumers verify what they download. A consuming job may run on Windows: an artifact is the same on every OS.

inputs:
  pack:
    description: The pack id (packs/<id>/); empty for every pack.
    required: false
    default: ""
  tool:
    description: The tool (packs/<pack>/upstream/<tool>/), with `pack`; empty for every tool of the selected packs.
    required: false
    default: ""
  fetch:
    description: >-
      "true": the fetching job. Download the archives from S3 under the read role (the job needs `id-token: write`) and
      upload them as this run's artifact. "false": the consuming job. Download the artifact a job of the same workflow
      run uploaded with "true", verify and extract it; a missing artifact fails, and the job needs no `id-token`.
    required: false
    default: "true"

outputs:
  archives:
    description: >-
      One line per archive this run used, `<pack> <tool> <kind> <sha256>` (kind test-data or samples). Replay a run from
      it (docs/upstream.md, "Replay a commit").
    value: ${{ steps.pull.outputs.archives }}

runs:
  using: composite
  steps:
    # The script needs Node 22.15 or newer (zlib's zstd) and no npm packages.
    - name: Set up Node.js v24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false

    # The name names the locked sha256s alone, so it changes exactly when an archive does, and a consuming job finds the
    # artifact of the fetching call with the same pack and tool.
    - id: entry
      name: Name the archives by the test-data locks
      shell: bash
      env:
        PACK: ${{ inputs.pack }}
        TOOL: ${{ inputs.tool }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$PACK" ]; then args+=(--pack "$PACK"); fi
        if [ -n "$TOOL" ]; then args+=(--tool "$TOOL"); fi
        node scripts/s3/pack-fixtures.mjs cache "${args[@]}" | node -e '
          const { appendFileSync, readFileSync } = require("node:fs");
          const { key, paths } = JSON.parse(readFileSync(0, "utf8"));
          appendFileSync(process.env.GITHUB_OUTPUT, `key=${key}\npaths<<EOF\n${paths.join("\n")}\nEOF\n`);
        '

    # The paths are checkout-relative under .rerail/pack-data/archives/, so the artifact extracts at the checkout's root
    # on either OS. A missing artifact fails the step: the fetching job of this run must have uploaded it.
    - name: Download the archives a fetching job uploaded
      if: inputs.fetch != 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ steps.entry.outputs.key }}
        path: .

    # The role reads the bucket; it is assumed with the job's OIDC token, so no AWS secret is stored here. The
    # credentials are this step's outputs, not exported, so only the pull step below holds them.
    - id: credentials
      name: Assume the test data read role
      if: inputs.fetch == 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::696860996542:role/github-actions-test-fixtures-read
        aws-region: us-east-2
        output-credentials: true
        output-env-credentials: false

    # Consuming: every archive was downloaded into the archive directory and verifies against its lock, so the pull
    # reads no S3 (and has no credentials to). Fetching: the pull downloads each archive from S3 (or reads the copy an
    # earlier pull of this job downloaded) and verifies it before anything is extracted.
    - id: pull
      name: Verify and extract the archives (fetching, from S3)
      shell: bash
      env:
        PACK: ${{ inputs.pack }}
        TOOL: ${{ inputs.tool }}
        AWS_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.credentials.outputs.aws-session-token }}
        AWS_REGION: us-east-2
      run: |
        set -euo pipefail
        args=()
        if [ -n "$PACK" ]; then args+=(--pack "$PACK"); fi
        if [ -n "$TOOL" ]; then args+=(--tool "$TOOL"); fi
        node scripts/s3/pack-fixtures.mjs pull "${args[@]}"

    # Only this call's archives, at their checkout-relative paths, so each artifact holds what its name says even when
    # an earlier call of the job left others in the archive directory.
    - name: Stage the archives
      if: inputs.fetch == 'true'
      shell: bash
      env:
        KEY: ${{ steps.entry.outputs.key }}
        PATHS: ${{ steps.entry.outputs.paths }}
      run: |
        set -euo pipefail
        stage="$RUNNER_TEMP/pack-test-data/$KEY"
        rm -rf "$stage"
        while IFS= read -r path; do
          [ -n "$path" ] || continue
          mkdir -p "$stage/$(dirname "$path")"
          cp "$path" "$stage/$path"
        done <<< "$PATHS"

    - name: Upload the archives
      if: inputs.fetch == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.entry.outputs.key }}
        path: ${{ runner.temp }}/pack-test-data/${{ steps.entry.outputs.key }}/
        include-hidden-files: true
        if-no-files-found: error
        overwrite: true
        retention-days: 3
        # The archives are zstd already.
        compression-level: 0
