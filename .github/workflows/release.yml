name: Release

# Builds the @neralabs/rerail package with package.yml (native rules engines for every supported target, the
# TypeScript runtime, and the bundled UI, packed into one cross-platform tarball), installs it on Windows, Linux and
# macOS, and publishes it.
#
# A `v*` tag publishes that tarball to npmjs under the dist-tag derived from the tag (releaseChannel in
# scripts/release/dist-tags.mjs): `v1.2.3` -> next, `v1.2.3-next.N` -> next, `v1.2.3-beta.N` -> beta. Nothing a tag
# publishes reaches `latest` by itself: a plain version's run ends with the promote job, which waits for a person to
# approve the `release` environment once the version is tested on `next` (docs/release.md, "Promoting"). The tag must
# equal package.json's version, and the version must not be older
# than core's `latest`. Merging the Release pull request makes the tag: release-pr.yml tags the version it set
# (docs/distribution-model.md, "Release channels"). After publishing, the dist-tags job lists core's dist-tags in the
# run summary and fails if the channel's dist-tag is not the version just published, or, for a `next` release, `next`
# is older than `latest`.
#
# `workflow_dispatch` with no inputs builds and uploads the tarball as a run artifact without publishing, so a build
# can be installed and checked by hand. With `latest`, for a put-back or a promotion whose approval GitHub failed after
# 30 days, it builds nothing and points core's `latest` dist-tag at that released plain version: a newer one promotes
# it, an older one puts core back. It raises `next` to it as well, should
# `next` be older, so `next` never trails `latest`. It runs behind the same `release`
# environment approval and with trusted publishing, so no npm login is needed. With `publish`, run from main, it retries
# a release that failed before publishing: it builds main, checks and publishes it as that version behind the same
# approval, leaving the version's tag where it is. It is refused unless the version is the one main's package.json
# names, its tag exists and nothing core ships has changed since the tag (scripts/release/core-retry-check.mjs), so core's
# own code is the tag's. How the package is built and its changelog can differ, and the run summary lists every path
# changed since the tag for whoever approves. A release tag can't move, so without this a failed version is lost.
#
# package.yml's builds start from the compile cache store release-cache.yml saves on main, and save none.
#
# Once the tarball passes the shrinkwrap check and the managed installs, the github-release job makes the tag's GitHub
# Release, with the version's CHANGELOG.md section as its notes, beside the npm publish rather than after it: the
# Release is this repository's, and npm being slow to publish or to serve the version can neither hold it back nor skip
# it. A version published under `next` gets a pre-release; after a promotion or a put-back, the promoted-release job
# makes the version the repository's latest release.

on:
  workflow_dispatch:
    inputs:
      latest:
        description: A released plain core version (its v<version> tag exists) to point latest at, a newer one to promote it or an older one to put core back; empty to build without publishing
        required: false
        default: ""
        type: string
      publish:
        description: The version to publish from main, retrying a tagged release that failed before publishing; nothing core ships may have changed since its tag. Leave latest empty
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One group per release: a tag's run, or a publish retry of that tag's version from main, which ends with the same
# promotion waiting for its approval. Runs by hand with `latest` (put-backs) share main's group, which nothing waits in.
concurrency:
  group: release-${{ inputs.publish && format('refs/tags/v{0}', inputs.publish) || github.ref }}
  cancel-in-progress: false

jobs:
  # Rejects a malformed tag, one that disagrees with package.json, a preview older than core's `latest` (published, it
  # would leave its channel behind the stable one), or a tree Windows cannot check out, before any engine is built. A
  # tag can name a commit PR CI never ran on.
  metadata:
    name: Release metadata
    if: ${{ !inputs.latest || inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.release-channel.outputs.channel }}
      version: ${{ steps.release-channel.outputs.version }}
      promotable: ${{ steps.release-channel.outputs.promotable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check every tracked path checks out on Windows
        run: node scripts/check/check-windows-paths.mjs

      - name: Refuse a retry of anything but what main holds
        if: ${{ inputs.publish }}
        env:
          VERSION: ${{ inputs.publish }}
          LATEST: ${{ inputs.latest }}
        run: node scripts/release/core-retry-check.mjs

      - id: release-channel
        name: Derive npm dist-tag
        env:
          PUBLISHES: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish != '' && github.ref == 'refs/heads/main') }}
          RELEASE_TAG: ${{ inputs.publish && format('v{0}', inputs.publish) || github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";
          import { publishRefusal, readPublicDistTags, releaseChannel } from "./scripts/release/dist-tags.mjs";
          if (process.env.PUBLISHES !== "true") {
            console.log("Not a release tag push: the build is uploaded as an artifact and not published.");
            appendFileSync(process.env.GITHUB_OUTPUT, "channel=\n");
            process.exit(0);
          }
          const { version, channel } = releaseChannel(process.env.RELEASE_TAG, JSON.parse(readFileSync("package.json", "utf8")).version);
          const refusal = publishRefusal(version, channel, await readPublicDistTags("@neralabs/rerail"));
          if (refusal !== null) throw new Error(refusal);
          console.log(`Publishing ${version} to the ${channel} channel.`);
          // A plain version waits on next for its promotion (the promote job); a preview stays on its channel.
          const promotable = channel === "next" && /^\d+\.\d+\.\d+$/u.test(version);
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\nversion=${version}\npromotable=${promotable}\n`);
          EOF

  package:
    name: Package
    needs: metadata
    uses: ./.github/workflows/package.yml
    # package.yml's native builds read main's compile cache store from its runs' artifacts.
    permissions:
      contents: read
      actions: read

  # The tarball must ship the npm-shrinkwrap.json the tag's package-lock.json gives (docs/release.md, "Shrinkwrap"):
  # npm installs core's dependencies from it. A missing or stale one fails the release before anything is published.
  shrinkwrap:
    name: Packed shrinkwrap
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Check the tarball's npm-shrinkwrap.json against package-lock.json
        env:
          TARBALL: release/${{ needs.package.outputs.tarball }}
        run: node scripts/release/shrinkwrap-pack.mjs check "$TARBALL"

  # The managed install renames a staged version into place, runs the native engine, and starts the
  # daemon: behavior the Linux package smoke cannot see. Every release installs on native Windows, Linux
  # and macOS before it ships.
  windows-install:
    name: Windows x64 managed install
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # Windows refuses paths over 260 characters unless Git is told to use long paths; see the native job.
      - name: Allow long paths in Git on Windows
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Install the release with npx @neralabs/rerail setup
        shell: pwsh
        run: ./scripts/host/windows-install-smoke.ps1 -Tarball "release/${{ needs.package.outputs.tarball }}"

  # Linux and macOS the way a user meets them, by the environment matrix's own guest
  # (scripts/host/azure/guest.sh): Node from nodejs.org, `npx @neralabs/rerail setup` answered in its
  # JSON lane, then the launcher, daemon and engine, PATH in a new shell (zsh on the Mac), the Claude
  # Code and Codex hooks, daemon restart, and removal. `matrix.mjs local` runs it on the runner itself.
  unix-install:
    name: ${{ matrix.name }} managed install
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: macOS arm64
            runner: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Runs the driver only; the guest installs its own Node from nodejs.org.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Install the release with npx @neralabs/rerail setup
        env:
          TARBALL: release/${{ needs.package.outputs.tarball }}
        run: node scripts/host/azure/matrix.mjs local --tarball "$TARBALL" --out results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.runner }}
          path: results
          if-no-files-found: ignore

  # npm trusted publishing: the registry exchanges this job's GitHub OIDC token for a short-lived
  # publish credential, so no npm token exists anywhere. npmjs must list this repository,
  # `release.yml`, and the `release` environment as the package's trusted publisher, allowing `npm dist-tag` as well
  # as `npm publish` (a promotion or a put-back moves `latest`, and `next` up to it).
  # `--provenance` makes npm attach a provenance attestation and fail the publish when it cannot generate one (for
  # example, if this repository is ever made private again), so no release reaches npm without one. The job can be run
  # again after a failure: a version npm already has is not published again (npm refuses to publish over it, which
  # the step reads, as packs-publish.mjs does, since `npm view` can lag a publish by minutes), and a version older than
  # the channel's (publishRefusal) is refused, so a re-run of an older release never moves `next` back.
  publish:
    name: Publish to npmjs
    needs: [metadata, package, shrinkwrap, windows-install, unix-install]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or newer; the promote job, which moves dist-tags over it, needs 11.21.0.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Publish
        env:
          PACKAGE_TARBALL: release/${{ needs.package.outputs.tarball }}
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CHANNEL" || { echo "::error::No release channel was derived for ${GITHUB_REF_NAME}" >&2; exit 1; }
          # Checked again here, not only in metadata, whose outputs a re-run reuses: an older run re-run after a newer
          # version shipped must not move the channel back.
          node --input-type=module -e 'import { publishRefusal, readPublicDistTags } from "./scripts/release/dist-tags.mjs"; const refusal = publishRefusal(process.env.RELEASE_VERSION, process.env.RELEASE_CHANNEL, await readPublicDistTags("@neralabs/rerail")); if (refusal !== null) { console.log(`::error::${refusal}`); process.exit(1); }'
          errors="$RUNNER_TEMP/npm-publish.err"
          if npm publish "./$PACKAGE_TARBALL" --registry https://registry.npmjs.org --access public --tag "$RELEASE_CHANNEL" --provenance 2> "$errors"; then
            cat "$errors" >&2
          else
            cat "$errors" >&2
            node --input-type=module -e 'import { readFileSync } from "node:fs"; import { alreadyOnRegistry } from "./scripts/release/packs.mjs"; process.exit(alreadyOnRegistry(readFileSync(process.argv[1], "utf8")) ? 0 : 1);' "$errors" \
              || { echo "::error::npm publish @neralabs/rerail@${RELEASE_VERSION} failed" >&2; exit 1; }
            echo "::notice::@neralabs/rerail@${RELEASE_VERSION} is already on npm (a re-run): not published again"
          fi

  # Reads core's dist-tags back from npm with `npm dist-tag ls`; core is public, so no token is needed.
  dist-tags:
    name: Published dist-tags
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check core's dist-tag
        env:
          RELEASED: "@neralabs/rerail@${{ needs.metadata.outputs.version }}:${{ needs.metadata.outputs.channel }}"
        run: node scripts/release/dist-tags-check.mjs

  # Promotes core to `latest`, or puts it back. A release run of a plain version ends here: once the release is tested
  # on `next`, a person approves the `release` environment and this job points `latest` at it (docs/release.md,
  # "Promoting"). The run waits for that approval, up to GitHub's 30 days; its group is its tag's (a publish retry's
  # too), so the wait holds back no other release and no put-back. Run by hand with `latest`, it points `latest` at a released plain version, newer to promote
  # it or older to put core back. It moves only a plain version this repository released (its tag exists) and npm has,
  # and `next` there too should `next` be older, so it never trails `latest`. A release run's promotion approved after a
  # newer version reached `latest` is refused, so it never moves `latest` back. It reads `latest` and then moves it,
  # beside other releases' promotions and put-backs, so two approved at once can undo each other: approve one at a time
  # and let it finish (docs/release.md, "Promoting"). Trusted publishing, as for publish:
  # core's trusted publisher on npmjs must allow `npm dist-tag` as well as `npm publish`.
  promote:
    name: Point latest at ${{ inputs.latest || needs.metadata.outputs.version }}
    needs: [metadata, publish]
    if: >-
      ${{
        !cancelled() && (
          (github.event_name == 'workflow_dispatch' && inputs.latest && !inputs.publish && github.ref == 'refs/heads/main') ||
          (needs.metadata.outputs.promotable == 'true' && needs.publish.result == 'success')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.latest || needs.metadata.outputs.version }}
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing over dist-tags needs npm 11.21.0 or newer.
      - name: Install npm with trusted publishing dist-tag support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require a released version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::latest takes a released plain version, not ${VERSION}: previews stay on their channel"
            exit 1
          fi
          if ! gh api "repos/{owner}/{repo}/git/ref/tags/v${VERSION}" --silent; then
            echo "::error::${VERSION} was never released from this repository (no v${VERSION} tag)"
            exit 1
          fi

      # Read once approved, which can be days after the release: a newer release promoted meanwhile supersedes this one.
      - name: Refuse a release a newer one superseded on latest
        if: ${{ !inputs.latest }}
        run: |
          node --input-type=module -e 'import { compareVersions, readPublicDistTags } from "./scripts/release/dist-tags.mjs"; const { latest } = await readPublicDistTags("@neralabs/rerail"); if (latest !== undefined && compareVersions(process.env.VERSION, latest) < 0) { console.log(`::error::latest is ${latest}, newer than ${process.env.VERSION}, so this release is superseded: it stays on next`); process.exit(1); }'

      - name: Point latest at ${{ env.VERSION }}
        run: npm dist-tag add "@neralabs/rerail@${VERSION}" latest --registry https://registry.npmjs.org

      - name: Keep next from trailing latest
        run: node scripts/release/raise-next.mjs "@neralabs/rerail@${VERSION}"

      # Core is public, so `npm dist-tag ls` reads it back with no token.
      - name: Check core's dist-tag
        env:
          RELEASED: "@neralabs/rerail@${{ env.VERSION }}:latest"
        run: node scripts/release/dist-tags-check.mjs

  # The GitHub Release of the tag, once the tarball has passed the checks every publish needs: its notes are the
  # version's section of the tagged CHANGELOG.md (scripts/release/github-release.mjs), so release notes are written
  # once, in the changelog. It runs beside the publish and waits on nothing npm does, so a slow publish or a dist-tag
  # read-back that fails cannot leave the tag without its Release; should the publish fail, the Release stands and a
  # retry (the `publish` input) runs this job again. Every release a tag publishes, on `next` or `beta`, is a
  # pre-release. Run again, it rewrites the notes and flags of the Release it made. It waits on nothing the promotion
  # does: the promoted-release job rewrites the Release once `latest` moves. It and promoted-release are the jobs that
  # write to the repository, so they alone hold `contents: write`.
  github-release:
    name: GitHub Release
    needs: [metadata, shrinkwrap, windows-install, unix-install]
    if: >-
      ${{
        !cancelled() &&
        needs.metadata.outputs.channel != '' &&
        needs.shrinkwrap.result == 'success' &&
        needs.windows-install.result == 'success' &&
        needs.unix-install.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - name: Create the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASED: "@neralabs/rerail@${{ needs.metadata.outputs.version }}:${{ needs.metadata.outputs.channel }}"
        run: node scripts/release/github-release.mjs

  # After a promotion or a put-back, the version's GitHub Release, which exists already, is rewritten as the
  # repository's latest release, with its notes from main's CHANGELOG.md, not the tag's: main keeps every released
  # version's section, and a note or lead corrected there while the release was tested on `next` is what stable users
  # read. Promoted over a release candidate that never reached `latest`, its notes run from the last version on
  # `latest` (previousStable in scripts/release/github-release.mjs).
  promoted-release:
    name: Promoted GitHub Release
    needs: [metadata, promote]
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - name: Make the GitHub Release the repository's latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASED: "@neralabs/rerail@${{ inputs.latest || needs.metadata.outputs.version }}:latest"
        run: node scripts/release/github-release.mjs
