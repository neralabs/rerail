name: Release

# Builds the @neralabs/rerail package with package.yml (native rules engines for every supported target, the
# TypeScript runtime, and the bundled UI, packed into one cross-platform tarball), installs it on Windows, Linux and
# macOS, and publishes it.
#
# A `v*` tag publishes that tarball to npmjs under the dist-tag derived from the tag: `v1.2.3` -> latest,
# `v1.2.3-beta.N` -> beta, `v1.2.3-next.N` -> next. The tag must equal package.json's version. Merging the Release
# pull request makes the tag: release-pr.yml tags the version it set (docs/distribution-model.md, "Release
# channels"). After publishing, the dist-tags job lists core's dist-tags in the run summary and fails if the channel's
# dist-tag is not the version just published.
#
# `workflow_dispatch` with no inputs builds and uploads the tarball as a run artifact without publishing, so a build
# can be installed and checked by hand. With `latest`, it builds nothing and points core's `latest` dist-tag at that
# released version, to put core back, behind the same `release` environment approval and with trusted publishing,
# so no npm login is needed.
#
# package.yml restores the cargo cache and never saves it: release-cache.yml builds and saves it on main.

on:
  workflow_dispatch:
    inputs:
      latest:
        description: A released core version (its v<version> tag exists) to point latest at, to put core back; empty to build without publishing
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Rejects a malformed tag, one that disagrees with package.json, or a tree Windows cannot check out, before any
  # engine is built. A tag can name a commit PR CI never ran on.
  metadata:
    name: Release metadata
    if: ${{ !inputs.latest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.release-channel.outputs.channel }}
      version: ${{ steps.release-channel.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check every tracked path checks out on Windows
        run: node scripts/check/check-windows-paths.mjs

      - id: release-channel
        name: Derive npm dist-tag
        env:
          TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from "node:fs";
          if (process.env.TAG_PUSH !== "true") {
            console.log("Not a release tag push: the build is uploaded as an artifact and not published.");
            appendFileSync(process.env.GITHUB_OUTPUT, "channel=\n");
            process.exit(0);
          }
          const tag = process.env.RELEASE_TAG;
          const match = /^v(\d+\.\d+\.\d+)(?:-(beta|next)\.\d+)?$/u.exec(tag);
          if (match === null) throw new Error(`Release tag ${tag} is not vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-next.N`);
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          if (version !== tag.slice(1)) throw new Error(`package.json version ${version} does not match ${tag}`);
          const channel = match[2] ?? "latest";
          console.log(`Publishing ${version} to the ${channel} channel.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\nversion=${version}\n`);
          EOF

  package:
    name: Package
    needs: metadata
    uses: ./.github/workflows/package.yml

  # The tarball must ship the npm-shrinkwrap.json the tag's package-lock.json gives (docs/release.md, "Shrinkwrap"):
  # npm installs core's dependencies from it. A missing or stale one fails the release before anything is published.
  shrinkwrap:
    name: Packed shrinkwrap
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Check the tarball's npm-shrinkwrap.json against package-lock.json
        env:
          TARBALL: release/${{ needs.package.outputs.tarball }}
        run: node scripts/release/shrinkwrap-pack.mjs check "$TARBALL"

  # The managed install renames a staged version into place, runs the native engine, and starts the
  # daemon: behavior the Linux package smoke cannot see. Every release installs on native Windows, Linux
  # and macOS before it ships.
  windows-install:
    name: Windows x64 managed install
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # Windows refuses paths over 260 characters unless Git is told to use long paths; see the native job.
      - name: Allow long paths in Git on Windows
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Install the release with npx @neralabs/rerail setup
        shell: pwsh
        run: ./scripts/host/windows-install-smoke.ps1 -Tarball "release/${{ needs.package.outputs.tarball }}"

  # Linux and macOS the way a user meets them, by the environment matrix's own guest
  # (scripts/host/azure/guest.sh): Node from nodejs.org, `npx @neralabs/rerail setup` answered in its
  # JSON lane, then the launcher, daemon and engine, PATH in a new shell (zsh on the Mac), the Claude
  # Code and Codex hooks, daemon restart, and removal. `matrix.mjs local` runs it on the runner itself.
  unix-install:
    name: ${{ matrix.name }} managed install
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: macOS arm64
            runner: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Runs the driver only; the guest installs its own Node from nodejs.org.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Install the release with npx @neralabs/rerail setup
        env:
          TARBALL: release/${{ needs.package.outputs.tarball }}
        run: node scripts/host/azure/matrix.mjs local --tarball "$TARBALL" --out results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.runner }}
          path: results
          if-no-files-found: ignore

  # npm trusted publishing: the registry exchanges this job's GitHub OIDC token for a short-lived
  # publish credential, so no npm token exists anywhere. npmjs must list this repository,
  # `release.yml`, and the `release` environment as the package's trusted publisher.
  # `--provenance` makes npm attach a provenance attestation and fail the publish when it cannot generate one (for
  # example, if this repository is ever made private again), so no release reaches npm without one.
  publish:
    name: Publish to npmjs
    needs: [metadata, package, shrinkwrap, windows-install, unix-install]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing needs npm CLI 11.5.1 or newer.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global "npm@^11.5.1"
          npm --version

      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rerail-package
          path: release

      - name: Publish
        env:
          PACKAGE_TARBALL: release/${{ needs.package.outputs.tarball }}
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CHANNEL" || { echo "::error::No release channel was derived for ${GITHUB_REF_NAME}" >&2; exit 1; }
          npm publish "./$PACKAGE_TARBALL" --registry https://registry.npmjs.org --access public --tag "$RELEASE_CHANNEL" --provenance

  # Reads core's dist-tags back from npm, which for this restricted package needs a read token: the read-only
  # NPM_PACKS_READ_TOKEN, which must cover @neralabs/rerail as well as the packs.
  dist-tags:
    name: Published dist-tags
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The file names the variable, not the token: npm reads NODE_AUTH_TOKEN from the step that runs it.
      - name: Authenticate npm to read core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted @neralabs/rerail needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - name: Check core's dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
          RELEASED: "@neralabs/rerail@${{ needs.metadata.outputs.version }}:${{ needs.metadata.outputs.channel }}"
        run: node scripts/release/dist-tags-check.mjs

  # Puts core back: points `latest` at a version this repository released (its tag exists) and npm has. Trusted
  # publishing, as for publish: core's trusted publisher on npmjs must allow `npm dist-tag` as well as `npm publish`.
  put-back:
    name: Point latest at ${{ inputs.latest }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.latest && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing over dist-tags needs npm 11.21.0 or newer.
      - name: Install npm with trusted publishing dist-tag support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require a released version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          if ! gh api "repos/{owner}/{repo}/git/ref/tags/v${VERSION}" --silent; then
            echo "::error::${VERSION} was never released from this repository (no v${VERSION} tag)"
            exit 1
          fi

      - name: Point latest at ${{ inputs.latest }}
        env:
          VERSION: ${{ inputs.latest }}
        run: npm dist-tag add "@neralabs/rerail@${VERSION}" latest --registry https://registry.npmjs.org

      - name: Authenticate npm to read core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted @neralabs/rerail needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - name: Check core's dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
          RELEASED: "@neralabs/rerail@${{ inputs.latest }}:latest"
        run: node scripts/release/dist-tags-check.mjs
