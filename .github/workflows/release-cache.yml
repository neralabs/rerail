name: Release cache

# Builds each native engine on main the way package.yml does and saves its Rust compile cache store
# (.github/actions/rust-compile-cache) as an artifact of the run, which package.yml's builds (release.yml, env-matrix.yml)
# start from: a tag's run compiles only what changed since, where without a store every release compiled each engine
# from scratch (40 minutes on Windows x64). The Actions cache is not used.
#
# On main, after a change to the build's inputs and nightly (an artifact expires after 7 days), each target starts
# from the newest store, builds, and saves the store again. Targets, store names and build command match package.yml's
# native job; change them together.

on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - native/Cargo.toml
      - .cargo/config.toml
      - rust-toolchain.toml
      - .github/workflows/release-cache.yml
      - .github/actions/rust-compile-cache/**
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled: a cancelled build saves no store.
concurrency:
  group: release-cache
  cancel-in-progress: false

jobs:
  cargo:
    name: Cargo ${{ matrix.target }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    # The compile cache reads main's newest store from its runs' artifacts.
    permissions:
      contents: read
      actions: read
    # The same build as package.yml's native job, under the same cap: 45 minutes cut the Intel Mac and Windows x64
    # engines off cold after the rule engine grew.
    timeout-minutes: 120
    steps:
      - name: Allow long paths in Git on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - id: cc
        uses: ./.github/actions/rust-compile-cache
        with:
          name: release-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Build native engine
        run: node scripts/build/release-engine.mjs ${{ matrix.target }}

      - uses: ./.github/actions/rust-compile-cache/save
        with:
          artifact: ${{ steps.cc.outputs.artifact }}
          dir: ${{ steps.cc.outputs.dir }}
