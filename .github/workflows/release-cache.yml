name: Release cache

# Builds and saves the cargo cache package.yml restores (for release.yml and env-matrix.yml). A tag's run can restore
# caches saved on main, never those another tag's run saved, so without this every release compiled each native
# engine from scratch (40 minutes on Windows x64).
#
# On main, after a change to what the key hashes and nightly (GitHub evicts caches unused for a week), each target
# looks its key up and, only when no cache holds it, builds from scratch and saves. A cold build means a saved
# cache holds only what that build compiled from main, never artifacts carried forward. Targets, build command,
# key, and paths match package.yml's native job; change them together. After such a change, let this finish
# before pushing a release tag, or that release builds cold.

on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - native/Cargo.toml
      - .cargo/config.toml
      - rust-toolchain.toml
      - .github/workflows/release-cache.yml
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Queued, not cancelled: a cancelled cold build loses its cache, and the queued run's lookup then hits cheaply.
concurrency:
  group: release-cache
  cancel-in-progress: false

jobs:
  cargo:
    name: Cargo ${{ matrix.target }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Allow long paths in Git on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - id: lookup
        name: Look up the cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'native/Cargo.toml', '.cargo/config.toml') }}
          lookup-only: true

      - if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/lfs

      - name: Set up Node.js v24
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned Rust toolchain
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install dependencies
        if: steps.lookup.outputs.cache-hit != 'true'
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Build native engine
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/napi build --platform --release --target ${{ matrix.target }} --manifest-path native/Cargo.toml --output-dir native

      - name: Save the cargo cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'native/Cargo.toml', '.cargo/config.toml') }}
