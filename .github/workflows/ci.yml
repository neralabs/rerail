name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Real-session jobs call hosted models with repository secrets. GitHub withholds secrets from fork and
# Dependabot pull requests, so those jobs run on pushes and same-repository pull requests only; there a
# missing secret or variable is a configuration error and fails the job.
#
# The Version packs pull request (changeset-release/main, from version-packs.yml) changes only pack versions,
# changelogs and package-lock.json, and is rewritten on every push to main. It runs the licence and lint jobs only:
# release-packs.yml validates and packs every pack on it, and main runs everything once it is merged.

jobs:
  licenses:
    name: Licences (REUSE and copyleft gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Every file carries licence information and every licence it names has its text in LICENSES/.
      - name: REUSE lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

      # Only allowlisted (permissive) licences in LICENSES/, and no copyleft production dependency.
      - name: Licence allowlist and copyleft gate
        run: node scripts/check/check-licenses.mjs

  # Type checks and generated-reference checks need neither Rust nor a build.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.57.0"

      - name: Check the Justfile
        run: just --fmt --check --unstable

      - uses: ./.github/actions/node-deps

      # `npm run check` type-checks and runs the structure gate (docs/repository-structure.md); then the UI
      # token reference check and the policy DSL reference grammar check.
      - name: Type-check, structure gate, and generated references
        run: |
          npm run check
          npm run check:ui-tokens
          npm run check:reference

  # Pull requests that touch none of the engine's inputs skip the Rust jobs. The engine's tests also
  # read conformance/, fixtures/, the packs' rules and the language registry (languages/ and its
  # generated TS module); package.json holds the cargo commands, .gitattributes the LFS objects the
  # engine embeds. Pushes to main run everything (the filter step is skipped and the output is empty).
  changes:
    name: Detect engine changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'native/**'
              - 'conformance/**'
              - 'scripts/dsl/**'
              - 'test/conformance/data-layer/**'
              - 'fixtures/**'
              - 'packs/**'
              - 'languages/**'
              - 'src/engine/code-rule/code-rule-language-registry.generated.ts'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'scripts/profiling/reachability/**'
              - 'scripts/profiling/preparation/**'
              - 'scripts/profiling/composition.py'
              - 'test/scripts/test_sql_composition.py'
              - 'scripts/profiling/reachability_*.py'
              - 'scripts/profiling/native_*_*.py'
              - 'test/scripts/test_reachability.py'
              - 'test/scripts/test_native_relations.py'
              - 'test/scripts/test_native_sql_plan.py'
              - 'scripts/profiling/producer-shape.mjs'
              - 'scripts/profiling/sql-budget.mjs'
              - 'fixtures/host/data-layer-port/profiling/sql-execution-opportunities-20261024.json'
              - 'scripts/profiling/sql-report.mjs'
              - 'benchmark/sql-profile/**'
              - 'test/scripts/sql-execution-budget.test.mjs'
              - 'test/engine/native/relational-batch.test.ts'
              - 'test/engine/native/relational-completed.test.ts'
              - 'test/engine/native/recovery/anchor-planning.test.ts'
              - 'test/engine/native/candidate-admission.test.ts'
              - 'test/engine/native/candidate-publication.test.ts'
              - 'test/engine/native/compiler-schema.test.ts'
              - 'test/engine/native/shared-producers.test.ts'
              - 'test/engine/native/frontier-determinism.test.ts'
              - 'test/engine/native/recovery/child-demand.test.ts'
              - 'test/engine/native/recovery/relational-storage.test.ts'
              - 'test/engine/native/recovery/execution-owner.test.ts'
              - 'test/engine/native/recovery/input-admission.test.ts'
              - 'test/engine/native/recovery/eponymous-sources.test.ts'
              - 'test/engine/native/recovery/state-syntax-domain.test.ts'
              - 'test/engine/native/recovery/selector-materialization.test.ts'
              - 'scripts/profiling/frontier-audit.mjs'
              - 'scripts/profiling/post_c_spikes/**'
              - 'test/scripts/test_post_c_spikes.py'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - '.github/actions/lfs/**'

  # rustfmt and clippy, and the engine's own tests, side by side; nothing downstream waits for them.
  # Each keeps its own cache: clippy's check metadata and the test binaries share no artifacts.
  rust:
    name: Rust engine (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust != 'false' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: clippy
            name: fmt, clippy
            run: npm run check:native
          - task: test
            name: tests
            run: npm run test:native
    # Line tables keep file:line in panics at a fraction of full debuginfo; incremental state only
    # bloats the cache, since dependencies never build incrementally.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - name: Set up canonical Python
        if: matrix.task == 'test'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.12"

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

      - name: Check isolated reachability spike
        if: matrix.task == 'clippy'
        run: |
          cargo fmt --manifest-path scripts/profiling/reachability/Cargo.toml -- --check
          cargo clippy --manifest-path scripts/profiling/reachability/Cargo.toml --locked --target-dir target/reachability-spike -- -D warnings

      - name: Build isolated reachability extension
        if: matrix.task == 'test'
        run: cargo build --manifest-path scripts/profiling/reachability/Cargo.toml --release --locked --target-dir target/reachability-spike

      - name: Test SQL and Rust reachability adapters
        if: matrix.task == 'test'
        env:
          RERAIL_REACH_EXTENSION: ${{ github.workspace }}/target/reachability-spike/release/librerail_reachability_spike.so
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 test/scripts/test_reachability.py
          python3 test/scripts/test_native_relations.py
          python3 test/scripts/test_native_sql_plan.py

      # The shape gate requires profiling spans and must never silently skip on a production addon.
      # Keep this debug addon separate from the package's release artifact.
      - uses: ./.github/actions/node-deps
        if: matrix.task == 'test'

      - name: Build profiling addon for the producer shape gate
        if: matrix.task == 'test'
        run: |
          cargo build --manifest-path native/Cargo.toml --features code-rule-profile
          cp target/debug/librerail_engine.so "$RUNNER_TEMP/rerail-producer-shape.node"

      - name: Enforce broad producer execution shape
        if: matrix.task == 'test'
        env:
          RERAIL_ENGINE_PATH: ${{ runner.temp }}/rerail-producer-shape.node
        run: npm run test:producer-shape

      - name: Validate complete SQL accounting and parity; report submission counts
        if: matrix.task == 'test'
        env:
          RERAIL_ENGINE_PATH: ${{ runner.temp }}/rerail-producer-shape.node
        run: npm run test:sql-execution-budget -- "$RUNNER_TEMP/rerail-sql-budget"

      - name: Preserve SQL execution accounting evidence
        if: always() && matrix.task == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: sql-execution-budget
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/rerail-sql-budget/provenance.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-a-budget.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-b-budget.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-c-budget.json
            ${{ runner.temp }}/rerail-sql-budget/capture/profile.json
            ${{ runner.temp }}/rerail-sql-budget/capture/parity.json
            ${{ runner.temp }}/rerail-sql-budget/capture/summary.txt
            ${{ runner.temp }}/rerail-sql-budget/capture/sql/summary.md
            ${{ runner.temp }}/rerail-sql-budget/capture/sql/execution-budget.json

      - name: Test SQL statement capture and deferred explanations
        if: matrix.task == 'test'
        run: cargo test --manifest-path scripts/profiling/reachability/Cargo.toml --no-default-features --locked code_rule_dsl::tests

      - name: Check and test captured SQL replay and composition kernels
        if: matrix.task == 'test'
        run: |
          cargo fmt --manifest-path scripts/profiling/preparation/Cargo.toml -- --check
          cargo clippy --manifest-path scripts/profiling/preparation/Cargo.toml --locked --all-targets --target-dir target/sql-preparation-lab -- -D warnings
          cargo test --manifest-path scripts/profiling/preparation/Cargo.toml --locked --target-dir target/sql-preparation-lab

  # Builds the package once: dist/ and the release native engine, handed to every test job.
  build:
    name: Build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release engine depends only on the engine's sources, the language registry (build.rs generates
      # its tables from languages/), the lockfile, the workspace profile, the toolchain and the napi CLI.
      # Most pull requests change none of them and reuse main's build.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.12"

      - name: Unit tests
        run: npm test -- --shard=${{ matrix.shard }}/2

  data-layer-parity:
    name: Data-layer upstream assertions (${{ matrix.mode }})
    needs: build
    if: >-
      ${{ github.head_ref != 'changeset-release/main' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [snapshot, workspace]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/lfs
      - uses: ./.github/actions/node-deps
        with:
          built: "true"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.12"
      - uses: astral-sh/setup-uv@v7
      - name: Get read-only upstream access
        id: upstream-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: neralabs
          repositories: nera-data-layer
          permission-contents: read
      - name: Checkout unchanged upstream tests
        uses: actions/checkout@v7
        with:
          repository: neralabs/nera-data-layer
          ref: 2b1504adc4291daaf080b2e932962b134da1a69a
          path: .rerail/data-layer-upstream
          token: ${{ steps.upstream-token.outputs.token }}
          persist-credentials: false
      - name: Install upstream assertion dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/batch-eight-venv
        run: >-
          uv sync --directory .rerail/data-layer-upstream --python 3.13.12 --frozen
          --no-default-groups --no-install-workspace --no-install-package nera-usearch-native
          --extra sqlite --group ci-conformance
      - name: Compare all original assertions and complete results
        env:
          PYTHONHASHSEED: "0"
          RERAIL_NATIVE_CONTRACTS: ${{ github.workspace }}/.rerail/batch-eight-contracts.json
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          unset RERAIL_ENGINE_PATH GIT_PAGER
          python scripts/dsl/data_layer_audit/native_contracts.py --source .rerail/data-layer-upstream --output "$RERAIL_NATIVE_CONTRACTS"
          reports="$RUNNER_TEMP/batch-eight-reports"
          mkdir -p "$reports"
          py="$RUNNER_TEMP/batch-eight-venv/bin/python"
          for part in 0 1 2 3; do
            timeout 115s "$py" scripts/dsl/data_layer_audit/api_parity.py compare               --source .rerail/data-layer-upstream --repo .rerail/data-layer-upstream               --oracle fixtures/host/data-layer-port/batch-08-complete-api.json               --part "$part" --parts 4 --mode "$MODE" --output "$reports/api-$MODE-$part.json"
          done
          python scripts/dsl/data_layer_audit/collect.py --reports "$reports" --mode "$MODE"
          timeout 115s "$py" scripts/dsl/data_layer_audit/facts_parity.py compare             --source .rerail/data-layer-upstream --repo .rerail/data-layer-upstream             --input fixtures/host/data-layer-port/batch-08-complete-facts.json             --mode "$MODE" --output "$reports/complete-facts-final-$MODE.json"
          timeout 115s "$py" scripts/dsl/data_layer_audit/graph_api.py compare             --source .rerail/data-layer-upstream --input fixtures/host/data-layer-port/batch-08-graph-api.json             --mode "$MODE" --output "$reports/graph-$MODE.json"
      - name: Require original positives to reject disabled detectors
        if: matrix.mode == 'snapshot'
        env:
          PYTHONHASHSEED: "0"
          RERAIL_NATIVE_CONTRACTS: ${{ github.workspace }}/.rerail/batch-eight-contracts.json
        run: |
          set -euo pipefail
          unset RERAIL_ENGINE_PATH GIT_PAGER
          reports="$RUNNER_TEMP/batch-eight-reports"
          python scripts/dsl/data_layer_audit/native_mutation.py --output "$RUNNER_TEMP/batch-eight-mutants"
          for part in 0 1 2 3; do
            status=0
            timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" scripts/dsl/data_layer_audit/native_suite.py               --source .rerail/data-layer-upstream --repo .rerail/data-layer-upstream --mode snapshot               --policies "$RUNNER_TEMP/batch-eight-mutants/rules" --part "$part" --parts 4               --output "$reports/controls-$part.json" || status=$?
            if [ "$status" -ne 1 ]; then echo "Expected assertion failures, got $status"; exit 1; fi
          done
          python scripts/dsl/data_layer_audit/collect.py --reports "$reports" --mode snapshot --controls
      - name: Reproduce configured batch-nine plugin contracts
        if: matrix.mode == 'snapshot'
        run: |
          timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" scripts/dsl/data_layer_nine/source_contracts.py \
            --source .rerail/data-layer-upstream --repo .rerail/data-layer-upstream \
            --output "$RUNNER_TEMP/batch-nine-public-contracts"
          diff fixtures/host/data-layer-port/batch-09-public-scope-oracle.json "$RUNNER_TEMP/batch-nine-public-contracts/batch-09-public-scope-oracle.json"
          diff fixtures/host/data-layer-port/batch-09-configured-defaults.json "$RUNNER_TEMP/batch-nine-public-contracts/batch-09-configured-defaults.json"
          timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" scripts/dsl/data_layer_nine/audit/record.py \
            --source .rerail/data-layer-upstream --repo .rerail/data-layer-upstream \
            --output "$RUNNER_TEMP/batch-nine-public-contracts/batch-09-shape-audit.json"
          diff fixtures/host/data-layer-port/batch-09-shape-audit.json "$RUNNER_TEMP/batch-nine-public-contracts/batch-09-shape-audit.json"
      - name: Verify shipped data-layer defaults and the live production boundary
        if: matrix.mode == 'snapshot'
        run: >-
          timeout 115s npx vitest run
          test/conformance/data-layer/batch-nine-production-regressions.test.ts
          test/conformance/data-layer/batch-nine-public-contract.test.ts
          test/conformance/data-layer/batch-nine-shape-audit.test.ts
          test/conformance/data-layer/production-runtime.test.ts
          test/engine/native/data-layer-nine/parser-source.test.ts
      - name: Compare all batch-nine assertions and complete results
        env:
          PYTHONHASHSEED: "0"
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          unset RERAIL_ENGINE_PATH GIT_PAGER RERAIL_NATIVE_CONTRACTS
          reports="$RUNNER_TEMP/batch-nine-reports"
          mkdir -p "$reports"
          for part in 0 1 2 3; do
            timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" scripts/dsl/data_layer_nine/suite.py \
              --source .rerail/data-layer-upstream --repo .rerail/data-layer-upstream \
              --baseline fixtures/host/data-layer-port/batch-09-complete-api.json \
              --part "$part" --parts 4 --mode "$MODE" --output "$reports/api-$MODE-$part.json"
          done
          python scripts/dsl/data_layer_nine/evidence.py \
            --oracle fixtures/host/data-layer-port/batch-09-complete-api.json \
            --reports "$reports/api-$MODE-0.json" "$reports/api-$MODE-1.json" "$reports/api-$MODE-2.json" "$reports/api-$MODE-3.json" \
            --output "$reports/summary-$MODE.json"
      - name: Require batch-nine positives to reject disabled detectors
        if: matrix.mode == 'snapshot'
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          unset RERAIL_ENGINE_PATH GIT_PAGER RERAIL_NATIVE_CONTRACTS
          reports="$RUNNER_TEMP/batch-nine-reports"
          python scripts/dsl/data_layer_nine/evidence.py --mutants packs/data-layer/rules --output "$RUNNER_TEMP/batch-nine-mutants/rules"
          for part in 0 1 2 3; do
            status=0
            timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" scripts/dsl/data_layer_nine/suite.py \
              --source .rerail/data-layer-upstream --repo .rerail/data-layer-upstream \
              --baseline fixtures/host/data-layer-port/batch-09-complete-api.json --mutant \
              --policies "$RUNNER_TEMP/batch-nine-mutants/rules" --mode snapshot \
              --part "$part" --parts 4 --output "$reports/controls-$part.json" || status=$?
            if [ "$status" -ne 1 ]; then echo "Expected assertion failures, got $status"; exit 1; fi
          done
          python scripts/dsl/data_layer_nine/evidence.py \
            --oracle fixtures/host/data-layer-port/batch-09-complete-api.json --controls \
            --reports "$reports/controls-0.json" "$reports/controls-1.json" "$reports/controls-2.json" "$reports/controls-3.json" --output "$reports/controls-summary.json"
      - name: Compare batch-ten positives, negatives and complete results
        env:
          PYTHONHASHSEED: "0"
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          unset RERAIL_ENGINE_PATH GIT_PAGER RERAIL_NATIVE_CONTRACTS
          reports="$RUNNER_TEMP/batch-ten-reports"
          mkdir -p "$reports"
          PYTHONPATH=scripts/dsl timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" -m data_layer_ten.assertions.programs \
            --source .rerail/data-layer-upstream --output "$reports/helper-contracts.json"
          cmp fixtures/host/data-layer-port/batch-10-helper-contracts.json "$reports/helper-contracts.json"
          PYTHONPATH=scripts/dsl timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" -m data_layer_ten.assertions.transfer \
            --source .rerail/data-layer-upstream --output "$reports/transferred-original.json"
          cmp fixtures/host/data-layer-port/batch-10-transferable-assertions.json "$reports/transferred-original.json"
          PYTHONPATH=scripts/dsl timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" -m data_layer_ten.contracts.reaudit \
            --source .rerail/data-layer-upstream --output "$reports/reaudit-original.json"
          cmp fixtures/host/data-layer-port/batch-10-reaudit.json "$reports/reaudit-original.json"
          for part in 0 1 2 3 4 5 6 7; do
