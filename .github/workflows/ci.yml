          timeout 115s npx vitest run --dir test test/conformance/data-layer/batch-ten.test.ts -t '^(?!matches complete )'
          for check in graph_lazy_sql_plan bounded_composed_graph_paths graphql_plan_ownership plan_optimizer_v2 conditional_architecture schema_introspection_data_paths matching_architecture hnsw_architecture embedding_vector_orchestration generated_index_sources; do
