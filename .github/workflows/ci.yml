name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Real-session jobs call hosted models with repository secrets. GitHub withholds secrets from fork and
# Dependabot pull requests, so those jobs run on pushes and same-repository pull requests only; there a
# missing secret or variable is a configuration error and fails the job.

jobs:
  licenses:
    name: Licences (REUSE and copyleft gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Every file carries licence information and every licence it names has its text in LICENSES/.
      - name: REUSE lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

      # Only allowlisted (permissive) licences in LICENSES/, and no copyleft production dependency.
      - name: Licence allowlist and copyleft gate
        run: node scripts/check/check-licenses.mjs

  # Type checks and generated-reference checks need neither Rust nor a build.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.57.0"

      - name: Check the Justfile
        run: just --fmt --check --unstable

      - uses: ./.github/actions/node-deps

      # `npm run check` type-checks and runs the structure gate (docs/repository-structure.md); then the UI
      # token reference check and the policy DSL reference grammar check.
      - name: Type-check, structure gate, and generated references
        run: |
          npm run check
          npm run check:ui-tokens
          npm run check:reference

  # Pull requests that touch none of the engine's inputs skip the Rust jobs. The engine's tests also
  # read conformance/, fixtures/, the packs' rules and the language registry (languages/ and its
  # generated TS module); package.json holds the cargo commands, .gitattributes the LFS objects the
  # engine embeds. Pushes to main run everything (the filter step is skipped and the output is empty).
  changes:
    name: Detect engine changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      gates: ${{ steps.filter.outputs.gates }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.3
        with:
          filters: |
            rust:
              - 'native/**'
              - 'conformance/**'
              - 'fixtures/**'
              - 'packs/**'
              - 'languages/**'
              - 'src/engine/code-rule/code-rule-language-registry.generated.ts'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - '.github/actions/lfs/**'
            # A rule's verdict depends on its document, the pack's recordings, the gate code and the engine.
            gates:
              - 'packs/**'
              - 'conformance/**'
              - 'native/**'
              - 'languages/**'
              - 'src/engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/rule-gates.yml'
              - '.github/actions/**'

  # rustfmt and clippy, and the engine's own tests, side by side; nothing downstream waits for them.
  # Each keeps its own cache: clippy's check metadata and the test binaries share no artifacts.
  rust:
    name: Rust engine (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: clippy
            name: fmt, clippy
            run: npm run check:native
          - task: test
            name: tests
            run: npm run test:native
    # Line tables keep file:line in panics at a fraction of full debuginfo; incremental state only
    # bloats the cache, since dependencies never build incrementally.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  # Builds the package once: dist/ and the release native engine, handed to every test job.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release engine depends only on the engine's sources, the language registry (build.rs generates
      # its tables from languages/), the lockfile, the workspace profile, the toolchain and the napi CLI.
      # Most pull requests change none of them and reuse main's build.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  # Every rule a pack ships must pass the rule gates; candidates are only reported (docs/rule-gates.md). Pushes to main
  # run them always (the filter step is skipped and the output is empty).
  rule-gates:
    name: Rule gates
    needs: [changes, build]
    if: needs.changes.outputs.gates != 'false'
    # The report job posts the results as a pull request comment.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/rule-gates.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before }}

  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Unit tests
        run: npm test -- --shard=${{ matrix.shard }}/2

  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration:built

  tools:
    name: Scripts, reference examples, conformance, and rule playground
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Script tests and reference examples
        run: |
          npm run test:scripts
          npm run test:reference

      # Offline: conformance:languages:check scores every pack's ported rules against its recordings. The
      # identifier-rename gate (test/conformance/) runs with the unit tests.
      - name: Conformance harnesses
        run: npm run test:conformance

      # The rule playground is a development tool with its own lockfile; it type-checks against dist/.
      - name: Check, build, and test the rule playground
        run: |
          npm ci --prefix playground # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required
          npm --prefix playground run check
          npm --prefix playground run build
          npm --prefix playground test
          npm --prefix playground run test:ui
          npm --prefix playground run test:integration

  real-sessions:
    name: OMP and Pi real-session runtime paths
    needs: build
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      RERAIL_SMOKE_OMP_MODEL: ${{ vars.RERAIL_SMOKE_OMP_MODEL }}
      RERAIL_SMOKE_PI_MODEL: ${{ vars.RERAIL_SMOKE_PI_MODEL }}
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL RERAIL_SMOKE_OMP_MODEL RERAIL_SMOKE_PI_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Real-session smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Exercise OMP and Pi real-session runtime paths
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          results="$RUNNER_TEMP/rerail-harness-smoke"
          mkdir -p "$results"
          node --import tsx scripts/host/host-lifecycle.ts omp -- \
            --provider azure --model "$RERAIL_SMOKE_OMP_MODEL" > "$results/omp.log" 2>&1 &
          omp_pid=$!
          node --import tsx scripts/host/host-lifecycle.ts pi -- \
            --provider azure-openai-responses --model "$RERAIL_SMOKE_PI_MODEL" > "$results/pi.log" 2>&1 &
          pi_pid=$!
          status=0
          if ! wait "$omp_pid"; then status=1; fi
          if ! wait "$pi_pid"; then status=1; fi
          cat "$results/omp.log"
          cat "$results/pi.log"
          exit "$status"

  provider-smoke:
    name: Real Claude Code, Codex, and Cursor sessions
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        )
      }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # One Azure AI key serves both the Foundry Anthropic endpoint and the Azure OpenAI endpoint.
      ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      ANTHROPIC_FOUNDRY_BASE_URL: ${{ vars.ANTHROPIC_FOUNDRY_BASE_URL }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      RERAIL_CODEX_MODEL: ${{ vars.RERAIL_CODEX_MODEL }}
      RERAIL_CLAUDE_MODEL: ${{ vars.RERAIL_CLAUDE_MODEL }}
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in ANTHROPIC_FOUNDRY_API_KEY ANTHROPIC_FOUNDRY_BASE_URL AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL CURSOR_API_KEY RERAIL_CODEX_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Provider smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - name: Set up Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # As in the build job: reuse main's release engine when its inputs are unchanged.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Install real provider CLIs
        run: |
          npm install --global --ignore-scripts @anthropic-ai/claude-code-darwin-arm64@2.1.266 @openai/codex@0.153.4
          curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
            https://downloads.cursor.com/lab/2026.09.08-6caf4ff/darwin/arm64/agent-cli-package.tar.gz \
            --output "$RUNNER_TEMP/cursor-agent.tar.gz"
          echo "9c456cc432adc476202a2b09c21a10944fdf484b3ca55dcbf939bbc8ce30dcbe  $RUNNER_TEMP/cursor-agent.tar.gz" \
            | shasum -a 256 --check
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/cursor-agent"
          ln -s "$(npm root --global)/@anthropic-ai/claude-code-darwin-arm64/claude" "$HOME/.local/bin/claude"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/cursor-agent.tar.gz" -C "$HOME/.local/share/cursor-agent"
          ln -s "$HOME/.local/share/cursor-agent/cursor-agent" "$HOME/.local/bin/agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build host assets
        run: |
          npm run build:ts
          npm run build:claude
          npm run build:codex
          npm run build:cursor

      - name: Exercise real Claude Code, Codex, and Cursor sessions
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/rerail-provider-smoke"
          mkdir -p "$results"
          node --import tsx scripts/host/host-smoke.ts --host claude-code > "$results/claude-code.log" 2>&1 &
          claude_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport RERAIL_SMOKE_TIMEOUT_MS=300000 node --import tsx scripts/host/host-smoke.ts --host codex > "$results/codex.log" 2>&1 &
          codex_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport node --import tsx scripts/host/host-smoke.ts --host cursor > "$results/cursor.log" 2>&1 &
          cursor_pid=$!
          status=0
          if ! wait "$claude_pid"; then status=1; fi
          if ! wait "$codex_pid"; then status=1; fi
          if ! wait "$cursor_pid"; then status=1; fi
          cat "$results/claude-code.log"
          cat "$results/codex.log"
          cat "$results/cursor.log"
          exit "$status"
