name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # dependabot-automerge.yml dispatches CI on an approved Dependabot branch as the neralabs-ci app. Dependabot's own
  # pull_request run skips every job that needs a secret or the OIDC token; this run is not Dependabot's, so it runs
  # everything, like a push, and its CI result on the same commit is what arms auto-merge. Without a pull request it
  # has no base, so the conformance check runs without comparing its lists to the base.
  # A manual run may also name the branch whose warm-start artifacts it reads, and save its own, to prove a change to
  # the warm starts before main has saved any (the `env` below).
  workflow_dispatch:
    inputs:
      warm-ref:
        description: The branch whose saved cargo targets, compile caches and engines this run starts from (a run on main starts from main's).
        default: main
      save-warm:
        description: Save this run's cargo targets and compile caches, as a push to main does.
        type: boolean
        default: false

permissions:
  contents: read

# Warm starts: the engine builds and Rust jobs start from the cargo targets and compile caches the latest push to main
# saved as artifacts (.github/actions/cargo-target, .github/actions/rust-compile-cache), and every engine build reuses
# an engine built from the same inputs (.github/actions/engine-artifact). Only pushes to main save the targets and
# caches, unless a manual run on a branch asks to (`save-warm`); a run on a tag never saves. A run on a ref named main
# (the branch, or a tag) starts from main's own whatever `warm-ref` says: what it uploads reads as main's for every
# later run (scripts/check/ci/trusted-artifact.mjs takes main's runs by name, event and history), so another branch's
# never become main's. A tag named main on an older commit of main runs that commit's ci.yml, which saved only on a
# push to the branch; main takes squash merges alone (its ruleset), so no commit with a weaker version of this file
# joins main's history.
env:
  WARM_REF: ${{ github.ref_name == 'main' && 'main' || inputs.warm-ref || 'main' }}
  SAVE_WARM: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.save-warm) }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Real-session jobs call hosted models with repository secrets, and the installed-packs job reads the restricted
# rule packs from npm with one. GitHub withholds secrets from fork and Dependabot pull requests, so those jobs run on
# pushes and same-repository pull requests only; there a missing secret or variable is a configuration error and
# fails the job. The jobs that read the packs' test data (the Rust tests, unit tests and the conformance check) are
# guarded the same way: the archives the tool-packs' test-data.lock files name come from S3 under an OIDC token, which
# GitHub does not give those pull requests either. A test-data job holds that token and only fetches them, uploading
# them as the run's artifacts (.github/actions/pack-test-data, `fetch: "true"`); the jobs that read the data hold none,
# and download, verify and extract what it uploaded (`fetch: "false"`). The data reaches CI only as the archives the
# locks name, each verified by its sha256 (CONTRIBUTING.md, "Pack test data"), and S3 must hold every archive the locks
# name (test-data-in-s3, so nothing merges that main cannot read).
#
# CI does not derive pack test data again, on purpose: the data is a point-in-time artifact. What a pull request
# publishes is checked by the code owner who approves its upload, reading the publish workflow's prep summary (what each
# archive adds, changes and drops) against the pull request's pin, generator and recipe changes, and by the conformance
# check on the new data (REVIEW.md, "Approving a pack data upload"). A reviewer re-derives it locally with
# `npm run fixtures:derive` and compares the result with the pull request's publish/ (docs/upstream.md, "Derive in a
# sandbox").
#
# GitHub reports a job skipped because a job it needs failed as skipped, and a skipped required check passes. So the
# one required check is ci-result ("CI result"), which needs every job and fails when any failed or was cancelled; a
# job skipped by its own condition (forks, Dependabot, the Release pull request, the path filters) does not fail it.
#
# On a pull request, the jobs that cost the most run only when it changes what they read: the Rust jobs, the
# conformance shards with the tools job's conformance steps and the comment, the dashboard browser tests, the
# integration tests with the rule packs from npm, and the real sessions (hosted models, paid per run). The changes job
# decides, from the pull request's whole diff against its base, so a pull request that ever touched an input runs the
# job on every later push; a push to main, and any other event, runs everything. A job may be skipped only when nothing
# it reads changed: each filter is derived from its jobs' imports and runtime reads, and
# scripts/check/check-ci-paths.mjs keeps the imports inside it (the changes job). The licence, lint, audit, test data
# and build jobs, and the tools job's script tests and reference examples, run on every pull request. The unit jobs (on
# Linux and on Windows) run the test files the change can affect (the select-tests job), and Windows' none for a change
# of prose alone (scripts/check/ci/prose.mjs: changesets, changelog entries, the root's and docs/'s Markdown), which
# changes no code and reads the same on Windows.
#
# The Release pull request (changeset-release/main, from release-pr.yml) changes only versions (the packs', and
# core's in package.json), changelogs and package-lock.json, and is rewritten on every push to main. It runs the
# licence and lint jobs only: release-packs.yml validates and packs every pack on it, main runs everything once it is
# merged, and release.yml builds and smokes core again on its tag.
# The changes job decides that once (`release-pr`); every job that skips it reads that output.

jobs:
  licenses:
    name: Licences (REUSE and copyleft gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Its cache is saved by a push to main alone; any other run restores main's.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Every file carries licence information and every licence it names has its text in LICENSES/.
      - name: REUSE lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

      # Only allowlisted (permissive) licences in LICENSES/, and no copyleft production dependency.
      - name: Licence allowlist and copyleft gate
        run: node scripts/check/check-licenses.mjs

  # Type checks and generated-reference checks need neither Rust nor a build. scripts/check/pre-commit.sh runs the same
  # checks before each commit: keep the two in step.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.57.0"

      - name: Check the Justfile
        run: just --fmt --check --unstable

      - uses: ./.github/actions/node-deps

      # Core's release notes, on a pull request: every entry pending in .changelog/ names its change type, each it adds
      # or changes stays at a sentence or two and names no ticket, pull request or commit, none is written into
      # CHANGELOG.md by hand, and on the Release pull request the dated section leads with a paragraph for the people
      # who upgrade (scripts/release/core-changelog-check.mjs). The base branch's tip is fetched alone, so the entries the pull
      # request adds can be told from the ones main has; the event's base.sha is the base as it was when the pull
      # request was last updated, which would count main's newer entries as the pull request's.
      - name: Fetch the base branch's tip
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --depth=1 origin "$BASE_REF"

      - name: Check core's release notes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/release/core-changelog-check.mjs "$BASE"

      # `npm run check` type-checks and runs the structure gate (docs/repository-structure.md); then the UI
      # token reference check and the policy DSL reference grammar check.
      - name: Type-check, structure gate, and generated references
        run: |
          npm run check
          npm run check:ui-tokens
          npm run check:reference

  # Known vulnerabilities in the dependencies the package ships: npm's advisories for the root package's production
  # dependencies (moderate and up; development dependencies are Dependabot alerts' to report, not a gate), and RustSec's
  # for the engine's crates (vulnerabilities; unmaintained and unsound advisories are the warnings cargo-audit allows).
  # Both read the lockfiles alone and install nothing from them: `npm audit` sends the lockfile's names and versions to
  # the registry, and cargo-audit is a prebuilt binary run directly, so rustup never installs the pinned toolchain here.
  # The fix is `npm audit fix --omit=dev` and `cargo update -p <crate>`; both tools print the advisory with the fix.
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: npm audit (root package, production dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: cargo audit (engine crates)
        run: cargo-audit audit --file Cargo.lock

  # Which inputs a pull request changes, so it skips the jobs that read none of them (the note at the top). Each output
  # is a filter's answer on a pull request, and 'true' for every other event, for a pull request of 3000 files or more
  # (the API lists no more, so a file past them could go unseen), and when the filter step left it empty: whatever goes
  # wrong runs the jobs. A filter step that fails fails this job, which skips the jobs that need it and fails CI result.
  #
  # paths-filter lists the pull request's files against its base, the whole pull request, not the latest push: once a
  # pull request touched a job's input, the job runs on every push to it.
  #
  # The filters other than rust are derived from what their jobs read: each job's TypeScript import closure, the files
  # its suites and scripts read at runtime, the native engine. scripts/check/check-ci-paths.mjs (npm run check, so the
  # lint job) recomputes the closures from the jobs' entry points and fails when a file of one matches no glob of its
  # filter; it cannot see runtime reads, which its `reads` lists hold as far as they are known. Where in doubt a filter
  # takes the broader glob: too broad only costs runner minutes.
  #
  # The Rust jobs: the engine's tests also read conformance/, fixtures/, the packs' rules and the language registry
  # (languages/ and its generated TS module); package.json holds the cargo commands, .gitattributes the LFS objects the
  # engine embeds.
  changes:
    name: Detect changed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release-pr: ${{ github.head_ref == 'changeset-release/main' }}
      rust: ${{ github.event_name == 'pull_request' && steps.filter.outputs.rust || 'true' }}
      conformance: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.conformance || 'true' }}
      e2e: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.e2e || 'true' }}
      integration: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.integration || 'true' }}
      sessions: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.sessions || 'true' }}
      translations: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.translations || 'true' }}
      # Which Rust packages' tests the change can affect (scripts/check/ci/rust-selection.mjs): the changed crates and every
      # crate that depends on one. Everything off pull requests, past 3000 files, and when the step fails: rust-all
      # 'true', rust-packages every package (or ["all"] when even the package list could not be read), rust-cargo-args
      # `--workspace`, rust-nextest-filter `all()`, rust-engine 'true'. rust-packages '[]': no crate's tests to run.
      rust-all: ${{ steps.select.outputs.rust-all || 'true' }}
      rust-packages: ${{ steps.select.outputs.rust-packages || '["all"]' }}
      rust-cargo-args: ${{ steps.select.outputs.rust-all == 'false' && steps.select.outputs.rust-cargo-args || '--workspace' }}
      rust-nextest-filter: ${{ steps.select.outputs.rust-nextest-filter || 'all()' }}
      rust-engine: ${{ steps.select.outputs.rust-engine || 'true' }}
    steps:
      # paths-filter lists a pull request's files through the API; the Rust selection reads the crates' manifests and
      # module trees from a checkout.
      # `common`, `engine` and `package` are only shared by the filters below (YAML anchors); nothing reads their outputs.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'native/**'
              - 'accel/**'
              - 'forest/**'
              - 'tools/bitlex/**'
              - 'conformance/**'
              - 'fixtures/**'
              - 'packs/**'
              - 'languages/**'
              - 'docs/rule-syntax/**'
              - 'gate/data-layer/**'
              - 'src/engine/code-rule/code-rule-language-registry.generated.ts'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'scripts/check/check-rustfmt.mjs'
              - 'scripts/check/check-rustfmt/files.txt'
              - 'scripts/check/ci/native-test-legs.mjs'
              - 'scripts/check/ci/path-free-builds.mjs'
              - 'scripts/profiling/reachability/**'
              - 'scripts/profiling/preparation/**'
              - 'scripts/profiling/composition.py'
              - 'test/scripts/test_sql_composition.py'
              - 'scripts/profiling/reachability_*.py'
              - 'scripts/profiling/native_*_*.py'
              - 'test/scripts/test_reachability.py'
              - 'test/scripts/test_native_relations.py'
              - 'test/scripts/test_native_sql_plan.py'
              - 'scripts/profiling/producer-shape.mjs'
              - 'scripts/profiling/sql-budget.mjs'
              - 'fixtures/host/data-layer-port/sql-budget-recording.json'
              - 'fixtures/host/data-layer-port/profiling/sql-execution-opportunities-20261024.json'
              - 'scripts/profiling/sql-report.mjs'
              - 'scripts/profiling/sql-session.mjs'
              - 'benchmark/sql-profile/**'
              - 'test/scripts/sql-execution-budget.test.mjs'
              - 'test/scripts/sql-profile.test.mjs'
              - 'test/scripts/sql-profile/**'
              - 'test/engine/native/relational-batch.test.ts'
              - 'test/engine/native/relational-completed.test.ts'
              - 'test/engine/native/candidate-admission.test.ts'
              - 'test/engine/native/candidate-publication.test.ts'
              - 'test/engine/native/compiler-schema.test.ts'
              - 'test/engine/native/shared-producers.test.ts'
              - 'test/engine/native/frontier-determinism.test.ts'
              - 'test/engine/native/recovery/child-demand.test.ts'
              - 'test/engine/native/recovery/relational-storage.test.ts'
              - 'test/engine/native/recovery/input-admission.test.ts'
              - 'test/engine/native/recovery/eponymous-sources.test.ts'
              - 'test/engine/native/recovery/state-syntax-domain.test.ts'
              - 'test/engine/native/recovery/selector-materialization.test.ts'
              - 'scripts/profiling/frontier-audit.mjs'
              - 'scripts/profiling/post_c_spikes/**'
              - 'test/scripts/test_post_c_spikes.py'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - '.github/actions/lfs/**'
              - '.github/actions/pack-test-data/**'
              - 'scripts/s3/**'
              - 'scripts/samples/**'
              - '.github/actions/rust-compile-cache/**'
              - 'scripts/check/ci/rust-selection.mjs'
            # What every job installs, builds or runs with: this workflow and its actions, the dependencies, the Rust
            # toolchain and the engine's crates, the LFS attributes.
            common: &common
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.gitattributes'
            # The native engine the build job makes: its crates (native/crates/, and the accel/, forest/ and
            # tools/bitlex/ it depends on: engine-inputs.mjs reads them from the manifests), and the language registry
            # its build.rs reads.
            engine: &engine
              - 'native/**'
              - 'accel/**'
              - 'forest/**'
              - 'tools/bitlex/**'
              - 'languages/**'
            # The package the build job makes and the daemon runs from source: every source file (tsc compiles all of
            # src/), the page, the bundled model, the hosts' hooks, skills and plugin manifests, the build scripts.
            package: &package
              - *engine
              - 'src/**'
              - 'ui/**'
              - 'model/**'
              - 'hooks/**'
              - 'skills/**'
              - 'plugins/**'
              - '.claude-plugin/**'
              - '.codex-plugin/**'
              - '.cursor-plugin/**'
              - 'scripts/build/**'
              - 'tsconfig.json'
              - 'tsconfig.build.json'
            # The conformance shards, the tools job's conformance steps and the comment: the runner's import closure
            # (conformance/, the engine's TypeScript side, the test data and samples readers, the release scripts'
            # private-pack predicate), the packs with their rules, gates and the locks naming their test data, and the
            # native engine. tsx reads tsconfig.json.
            conformance:
              - *common
              - *engine
              - 'conformance/**'
              - 'packs/**'
              - 'src/engine/**'
              - 'scripts/s3/**'
              - 'scripts/samples/**'
              - 'scripts/release/packs.mjs'
              - 'scripts/release/dist-tags.mjs'
              - 'scripts/release/release-notes.mjs'
              - 'scripts/check/check-internal-refs.mjs'
              - 'tsconfig.json'
            # The dashboard browser tests: the specs and their scenario seeding, the daemon from source, and the packs
            # the scenarios install from this checkout (INSTALLED_PACKS in e2e/support/scenarios.ts).
            e2e:
              - *common
              - *package
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'packs/complexity/**'
              - 'packs/javascript/**'
              - 'packs/next/**'
              - 'packs/python/**'
              - 'packs/typescript/**'
            # The integration tests and the rule packs from npm: the suites, the test support they import, the vitest
            # config, the OMP host they provision, the built package, the scripts updater-cli.test.ts packs this checkout
            # and its engine package with. The packs come from the registry, not packs/, except the complexity pack
            # claude-hook-rules.test.ts adds from this checkout.
            integration:
              - *common
              - *package
              - 'integration/**'
              - 'test/support/**'
              - 'vitest.config.ts'
              - 'packs/complexity/**'
              - 'scripts/host/**'
              - 'scripts/release/engine/**'
              - 'scripts/release/shrinkwrap*.mjs'
            # The real-session runs: the host scripts and the built package, loaded by each host as its plugin. They set
            # repositories up with library rules only, so no pack.
            sessions:
              - *common
              - *package
              - 'scripts/host/**'
            # The translation suite: the pack's translations and the libraries they include, the pack's rules, the
            # engine both sides run, the product's runner, the suite and the corpora it pins. tsx reads tsconfig.json.
            translations:
              - *common
              - *engine
              - 'docs/rule-syntax/**'
              - 'packs/rerail/**'
              - 'conformance/**'
              - 'src/engine/**'
              - 'scripts/s3/**'
              - 'scripts/samples/**'
              - 'scripts/ship/translations*'
              - 'scripts/ship/product-run.ts'
              - 'scripts/ship/engine-json.ts'
              - 'scripts/ship/corpus-tree.ts'
              - 'scripts/ship/metric.ts'
              - 'scripts/ship/verdict.ts'
              - 'scripts/ship/corpora.json'
              - 'tsconfig.json'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The pull request's files (a rename lists both names) against the crates; any other event, or a pull request the
      # API cannot list whole, selects everything (Cargo.lock reaches every package). The runner's stable cargo reads the
      # manifests (`cargo metadata --no-deps`); rust-toolchain.toml's channel would be a download for nothing.
      - id: select
        name: Select the Rust packages to test
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FILES: ${{ github.event.pull_request.changed_files || 0 }}
          RUSTUP_TOOLCHAIN: stable
        # The base's package.json, when the pull request changes it: only the scripts that run cargo reach the crates.
        run: |
          base=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$FILES" -lt 3000 ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
            if grep -qx package.json "$RUNNER_TEMP/changed.txt" \
              && gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$BASE" -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/base-package.json"; then
              base=(--base-package-json "$RUNNER_TEMP/base-package.json")
            fi
          else
            echo Cargo.lock > "$RUNNER_TEMP/changed.txt"
          fi
          node scripts/check/ci/rust-selection.mjs "$RUNNER_TEMP/changed.txt" "${base[@]}" --github >> "$GITHUB_OUTPUT"

  # Which unit test files a pull request can affect (scripts/check/ci/test-selection.mjs): those whose import closure, or
  # the paths its files name, hold a changed file. The unit jobs run only those, on as many shards as their share needs
  # (`unit-shards`, `windows-shards`), or none ('[]': their jobs and the Windows engine's build skip). Everything off pull
  # requests, past 3000 files, and when the step fails: `unit` 'all', `unit-tests` empty, every shard. A change of prose
  # alone (scripts/check/ci/prose.mjs) gets no Windows shard: Linux's run what it selects. Its own job, so the `npm ci`
  # it needs is off the path of the jobs that need `changes` alone.
  select-tests:
    name: Select the unit tests
    needs: changes
    if: needs.changes.outputs.release-pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unit: ${{ steps.select.outputs.unit || 'all' }}
      unit-tests: ${{ steps.select.outputs.unit == 'some' && steps.select.outputs.unit-tests || '' }}
      unit-shards: ${{ steps.select.outputs.unit-shards || '[1, 2, 3]' }}
      windows-shards: ${{ steps.select.outputs.windows-shards || '[1, 2, 3, 4, 5]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - id: select
        name: Select the unit tests to run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FILES: ${{ github.event.pull_request.changed_files || 0 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$FILES" -lt 3000 ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          else
            echo package-lock.json > "$RUNNER_TEMP/changed.txt"
          fi
          node scripts/check/ci/test-selection.mjs "$RUNNER_TEMP/changed.txt" --github >> "$GITHUB_OUTPUT"

  # Uploads, as this run's artifacts, every set of archives the jobs below download (.github/actions/pack-test-data,
  # `fetch: "true"`): every tool-pack's archives for the unit jobs (Linux and Windows) and the conformance jobs, and the
  # four tool-packs the Rust tests read, each its own artifact. It holds the OIDC token, runs nothing but the pull
  # (scripts/s3/pack-fixtures.mjs, this commit's code), and never downloads an artifact; the jobs that read the data
  # download it holding no token. Artifacts rather than the Actions cache: the cache's 10 GB evicted the entry between
  # this job and its readers. The Release pull request reads none.
  test-data:
    name: Pack test data
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token: the archives from S3, with credentials only the action's pull step holds.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Every tool-pack first: the single tool-packs below then read the archives it downloaded, not S3.
      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "true"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: python
          tool: ruff
          fetch: "true"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: sql
          tool: sqlfluff
          fetch: "true"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: vue
          tool: eslint-plugin-vue
          fetch: "true"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: data-layer
          tool: lint
          fetch: "true"

  # S3 holds every archive each test-data.lock names and every samples archive each samples.lock names
  # (scripts/s3/pack-fixtures.mjs `check`, head-object only, downloading nothing). A pull request that changes a lock
  # fails here until the publish workflow (pack-data-publish.yml) has put what it names, so it cannot merge with data
  # that only its own cache scope holds: main's runs read S3. Nothing needs this job, so the others still report.
  # It runs this commit's script alone, under the read role, where the test-data job does.
  test-data-in-s3:
    name: Pack test data is in S3
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token: the read role, whose credentials only the check step holds.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The script needs no npm packages.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # As in .github/actions/pack-test-data: the credentials are this step's outputs, not exported.
      - id: credentials
        name: Assume the test data read role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::696860996542:role/github-actions-test-fixtures-read
          aws-region: us-east-2
          output-credentials: true
          output-env-credentials: false

      - name: Check S3 holds every locked archive
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.credentials.outputs.aws-session-token }}
          AWS_REGION: us-east-2
        run: node scripts/s3/pack-fixtures.mjs check

  # rustfmt (on the files scripts/check/check-rustfmt/files.txt lists) and clippy, the engine's own tests, and the
  # profiling labs' checks, side by side; nothing downstream waits for them. They keep no Actions cache (the
  # repository's 10 GB hold the other jobs' entries): clippy and the test build start from main's compile cache (an
  # artifact), and the tests' compile happens once per run (rust-tests-build).
  rust-clippy:
    name: Rust engine (fmt, clippy)
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust != 'false' && needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: main's compile cache, an artifact of another run.
    permissions:
      contents: read
      actions: read
    # Line tables keep file:line in panics at a fraction of full debuginfo; nothing here builds twice incrementally.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      # sccache, starting from main's newest clippy store (an artifact): the dependencies' check builds are fetched.
      - id: compile-cache
        uses: ./.github/actions/rust-compile-cache
        with:
          name: clippy
          ref: ${{ env.WARM_REF }}

      - name: Run fmt, clippy
        run: npm run check:native

      - name: Save the compile cache for later runs
        if: env.SAVE_WARM == 'true'
        uses: ./.github/actions/rust-compile-cache/save
        with:
          artifact: ${{ steps.compile-cache.outputs.artifact }}
          dir: ${{ steps.compile-cache.outputs.dir }}

  # The engine's browser build (native/wasm/README.md): no other job builds the engine for wasm32-wasip1, so a change
  # that broke it failed no check. Checks, not builds: the library with its default features, then the shape a page
  # ships, the rule explorer's (the binary and its library, `headless` and one language, without `tape-cache` or
  # `dump-cli`), since code gated on those features compiles only there. wasi-sdk brings the clang, llvm-ar, wasi-libc
  # and libc++ that native/wasm/env.sh takes from Homebrew on macOS. Gated as rust-windows is, when the change reaches
  # the engine (`rust-engine`). A job of its own with no compile cache: its failure, or a failed download for it, leaves
  # what rust-clippy saves as it was. Cold, at 4 jobs, the check takes 2.5 to 7 minutes.
  rust-wasm:
    name: Rust engine (browser build)
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust != 'false' && needs.changes.outputs.rust-engine != 'false' &&
        needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The grammars' parsers, which the build scripts compile for the target, are LFS objects.
      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Check the engine's browser build (wasm32-wasip1)
        env:
          RUST_CHANNEL: ${{ steps.rust-toolchain.outputs.channel }}
          WASI_SDK: wasi-sdk-34.0-x86_64-linux
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          rustup target add wasm32-wasip1 --toolchain "$RUST_CHANNEL"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$WASI_SDK.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$WASI_SDK.tar.gz"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/$WASI_SDK.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$WASI_SDK.tar.gz" -C "$RUNNER_TEMP"
          export WASI_SDK_PATH="$RUNNER_TEMP/$WASI_SDK"
          . native/wasm/env.sh
          cargo check -p rerail-engine --lib --target wasm32-wasip1
          cargo check -p rerail-engine --bin rerail-engine --target wasm32-wasip1 --no-default-features --features headless,lang-python

  # The engine's test binaries, compiled once for the legs of the rust job (scripts/check/ci/native-test-legs.mjs): it runs
  # `cargo test --workspace` with that script as cargo's target runner, which records each test binary with the
  # working directory and environment cargo gives it instead of running it, and runs the doc tests. It then lists every
  # binary's tests whole and under each leg's filters, fails unless each test is in exactly one leg, and hands the
  # binaries on as an artifact (0.8 GB). It reads no pack test data, so it starts with the test-data job. A cold compile
  # takes 13 to 17 minutes on the 4-vCPU runner; from main's compile cache (.github/actions/rust-compile-cache, an
  # artifact a push to main saves) about 5. Without one it compiles cold: never a failure.
  rust-tests-build:
    name: Rust engine (test build)
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust-packages != '[]' &&
        needs.changes.outputs.rust != 'false' && needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: main's compile cache, an artifact of another run.
    permissions:
      contents: read
      actions: read
    outputs:
      legs: ${{ steps.build.outputs.legs }}
    # Line tables keep file:line in panics at a fraction of full debuginfo; nothing here builds twice incrementally.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      # sccache, starting from main's newest store (an artifact): what main compiled the same way is fetched.
      - id: compile-cache
        uses: ./.github/actions/rust-compile-cache
        with:
          name: test
          ref: ${{ env.WARM_REF }}

      # The crates a pull request's changes reach (the changes job): `--workspace`, or `-p <package>` for each.
      - id: build
        name: Build the test binaries, run the doc tests and check the legs
        env:
          NATIVE_TESTS_CARGO_ARGS: ${{ needs.changes.outputs.rust-cargo-args }}
        run: node scripts/check/ci/native-test-legs.mjs build "$RUNNER_TEMP/native-tests"

      # No crate writes its checkout's path into its build, so a cache shared by checkouts reuses it (decision 0224).
      - name: Check the builds name no checkout
        run: node scripts/check/ci/path-free-builds.mjs

      - name: Hand the test binaries to the legs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests
          path: ${{ runner.temp }}/native-tests/native-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Save the compile cache for later runs
        if: env.SAVE_WARM == 'true'
        uses: ./.github/actions/rust-compile-cache/save
        with:
          artifact: ${{ steps.compile-cache.outputs.artifact }}
          dir: ${{ steps.compile-cache.outputs.dir }}

  # The engine's tests, in the legs scripts/check/ci/native-test-legs.mjs names, each running the binaries the
  # rust-tests-build job compiled with its libtest filters, as `cargo test --workspace -- <filters>` would. Four read pack
  # test data (native/src/code_rule_dsl/test_support.rs's callers): Ruff's fixtures, SQLFluff's expected findings and
  # fixtures, eslint-plugin-vue's fixtures, and the data-layer port's recordings and rule corpus (the converter, census,
  # replay and text tests), restored from what the test-data job saved, so the job runs where that job does (the note
  # at the top). Each leg runs 3 to 8 minutes of tests; taking the binaries took 16 s to 4.4 minutes in 44383070532, so
  # the artifact holds only binaries with tests, packed with a long window (1.46 to 0.79 GB). The slowest leg, the
  # waves', is bounded by its two 8-minute tests. The test watchdog stops a hung test at 10 minutes (native/src/test_watchdog.rs):
  # the timeout leaves room for that.
  rust:
    name: Rust engine (${{ matrix.name }})
    needs: [changes, test-data, rust-tests-build]
    if: >-
      ${{
        needs.rust-tests-build.outputs.legs != '[]' &&
        needs.changes.outputs.rust != 'false' && needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rust-tests-build.outputs.legs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          pack: python
          tool: ruff
          fetch: "false"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: sql
          tool: sqlfluff
          fetch: "false"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: vue
          tool: eslint-plugin-vue
          fetch: "false"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: data-layer
          tool: lint
          fetch: "false"

      # The canonical Python AST facts (`value::python_ast`) run CPython 3.13 as `python3.13`; the runner has 3.12.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Put CPython 3.13 on PATH
        run: |
          uv python install 3.13
          dirname "$(uv python find 3.13)" >> "$GITHUB_PATH"

      - name: Take the test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests
          path: ${{ runner.temp }}/native-tests

      - name: Run ${{ matrix.name }}
        run: node scripts/check/ci/native-test-legs.mjs run "${{ matrix.leg }}" "$RUNNER_TEMP/native-tests"

  # The profiling labs: the reachability spike and the SQL preparation lab, each its own manifest and target directory,
  # checked, built and tested apart from the engine's tests. Their builds are small (the job takes 2 minutes cold), so
  # they keep no cache.
  rust-profiling:
    name: Rust engine (profiling labs)
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust != 'false' && needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # Line tables keep file:line in panics at a fraction of full debuginfo; nothing here builds twice incrementally.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Check isolated reachability spike
        run: |
          cargo fmt --manifest-path scripts/profiling/reachability/Cargo.toml -- --check
          cargo clippy --manifest-path scripts/profiling/reachability/Cargo.toml --locked --target-dir target/reachability-spike -- -D warnings

      - name: Build isolated reachability extension
        run: cargo build --manifest-path scripts/profiling/reachability/Cargo.toml --release --locked --target-dir target/reachability-spike

      # The extension is bound to the bundled SQLite's API (modern_sqlite) and refuses an older host. The runner's
      # Python links the system SQLite 3.45.1 (the CPython 3.13 put on PATH above links its own, older one, statically):
      # build the amalgamation the lock resolves and load it into the runner's Python for the tests.
      - name: Build the SQLite the reachability extension is bound to
        run: |
          sys=$(cargo metadata --manifest-path scripts/profiling/reachability/Cargo.toml --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "libsqlite3-sys") | .manifest_path')
          mkdir -p "$RUNNER_TEMP/sqlite"
          gcc -O2 -shared -fPIC -DSQLITE_THREADSAFE=1 -DSQLITE_ENABLE_LOAD_EXTENSION=1 -DSQLITE_ENABLE_MATH_FUNCTIONS \
            -o "$RUNNER_TEMP/sqlite/libsqlite3.so.0" "$(dirname "$sys")/sqlite3/sqlite3.c" -lm -lpthread -ldl

      - name: Test SQL and Rust reachability adapters
        env:
          RERAIL_REACH_EXTENSION: ${{ github.workspace }}/target/reachability-spike/release/librerail_reachability_spike.so
          PYTHONDONTWRITEBYTECODE: "1"
          LD_LIBRARY_PATH: ${{ runner.temp }}/sqlite
        run: |
          /usr/bin/python3 test/scripts/test_reachability.py
          /usr/bin/python3 test/scripts/test_native_relations.py
          /usr/bin/python3 test/scripts/test_native_sql_plan.py

      # P's producer-shape and SQL-budget gates measure P's SQL anchor engine, which this engine places test-only
      # (docs/final-shape/open-items.md O20; P's tests that need P's addon, O84). On this addon they find no anchor
      # batches or producer plans, and the 100-submission budget "remains an expected acceptance failure"
      # (docs/sql-performance-recovery-workplan.md, removed; at 7efcac9c67). As vitest.config.ts does for P's relational suites, they run only
      # with RERAIL_RELATIONAL_TESTS=1 (set it in this job's env) until O20 picks one anchor engine. By hand,
      # `npm run test:producer-shape` and `npm run test:sql-execution-budget -- <directory>` run as they are.
      # The shape gate requires profiling spans and must never silently skip on a production addon.
      # Keep this debug addon separate from the package's release artifact.
      - uses: ./.github/actions/node-deps
        if: env.RERAIL_RELATIONAL_TESTS == '1'

      - name: Build profiling addon for the producer shape gate
        if: env.RERAIL_RELATIONAL_TESTS == '1'
        run: |
          cargo build --manifest-path native/Cargo.toml --features code-rule-profile
          cp target/debug/librerail_engine.so "$RUNNER_TEMP/rerail-producer-shape.node"

      - name: Enforce broad producer execution shape
        if: env.RERAIL_RELATIONAL_TESTS == '1'
        env:
          RERAIL_ENGINE_PATH: ${{ runner.temp }}/rerail-producer-shape.node
        run: npm run test:producer-shape

      - name: Enforce 100 engine SQL submissions for the complete cold job
        if: env.RERAIL_RELATIONAL_TESTS == '1'
        env:
          RERAIL_ENGINE_PATH: ${{ runner.temp }}/rerail-producer-shape.node
        run: npm run test:sql-execution-budget -- "$RUNNER_TEMP/rerail-sql-budget"

      - name: Preserve SQL execution budget evidence
        if: always() && env.RERAIL_RELATIONAL_TESTS == '1'
        uses: actions/upload-artifact@v7
        with:
          name: sql-execution-budget
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/rerail-sql-budget/provenance.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-a-budget.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-b-budget.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-c-budget.json
            ${{ runner.temp }}/rerail-sql-budget/capture/profile.json
            ${{ runner.temp }}/rerail-sql-budget/capture/parity.json
            ${{ runner.temp }}/rerail-sql-budget/capture/summary.txt
            ${{ runner.temp }}/rerail-sql-budget/capture/sql/summary.md
            ${{ runner.temp }}/rerail-sql-budget/capture/sql/execution-budget.json

      - name: Test SQL statement capture and deferred explanations
        run: cargo test --manifest-path scripts/profiling/reachability/Cargo.toml --no-default-features --locked code_rule_dsl::sql::tests

      - name: Check and test captured SQL replay and composition kernels
        run: |
          cargo fmt --manifest-path scripts/profiling/preparation/Cargo.toml -- --check
          cargo clippy --manifest-path scripts/profiling/preparation/Cargo.toml --locked --all-targets --target-dir target/sql-preparation-lab -- -D warnings
          cargo test --manifest-path scripts/profiling/preparation/Cargo.toml --locked --target-dir target/sql-preparation-lab

  # The tree watch's FSEvents adapter (native/src/tree_watch/fsevents.rs) is compiled out everywhere but macOS, so its
  # tests and the tree watch's shared tests run here, when the change reaches its crate (rerail-tree-watch, which builds
  # without the engine: a minute or two cold, where the engine's test target took 16). They read no pack test data. A
  # debug build, as in the rust job.
  rust-macos:
    name: Rust engine (macOS tree watch)
    needs: changes
    if: >-
      ${{
        (needs.changes.outputs.rust-all != 'false' || contains(fromJSON(needs.changes.outputs.rust-packages), 'rerail-tree-watch')) &&
        needs.changes.outputs.rust != 'false' && needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}


      - name: Tree watch tests
        run: cargo test --manifest-path Cargo.toml -p rerail-tree-watch --lib

  # Builds the package once: dist/ and the release native engine, handed to every test job as an artifact. An engine an
  # earlier run built from the same inputs is downloaded, not built (.github/actions/engine-artifact); otherwise the
  # engine builds incrementally from the cargo target main's last run uploaded (.github/actions/cargo-target), and
  # pushes to main upload theirs.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.release-pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # actions: read finds and downloads an earlier engine and main's cargo target.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # An engine an earlier run built from the same inputs (main's, or this branch's last push): then no cargo at all.
      - id: engine
        uses: ./.github/actions/engine-artifact
        with:
          target: x86_64-unknown-linux-gnu
          mode: find
          ref: ${{ env.WARM_REF }}

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        if: steps.engine.outputs.hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/cargo-target
        with:
          name: cargo-target-x86_64-unknown-linux-gnu
          mode: restore
          ref: ${{ env.WARM_REF }}

      - uses: ./.github/actions/node-deps

      # As package.yml builds it for a release: through napi-rs's cross toolchain, against glibc 2.17. A host build
      # links against the runner's glibc and C++ runtime, so only this form shows a pull request whose engine a
      # release could not link, or one that needs more than the oldest supported Linux has.
      - name: Build the native engine
        if: steps.engine.outputs.hit != 'true'
        run: node scripts/build/release-engine.mjs x86_64-unknown-linux-gnu

      # Straight after the build, so a later step's failure keeps it.
      - name: Upload the engine for later runs
        if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/engine-artifact
        with:
          target: x86_64-unknown-linux-gnu
          mode: upload

      - name: Save the cargo target
        if: env.SAVE_WARM == 'true' && steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/cargo-target
        with:
          name: cargo-target-x86_64-unknown-linux-gnu
          mode: save

      - name: Check the native engine loads on glibc 2.28
        run: node scripts/check/check-linux-engine.mjs native/rerail_engine.*.node

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  # Every shard reads every pack's test data (packs.test.ts, complexity-rules.test.ts and the native tests share them),
  # restored from what the test-data job saved. Runs the test files select-tests chose (all of them, or `unit-tests`),
  # on its `unit-shards`; none when it chose none. The shards split the files by how long each takes in CI, not by their
  # count (test/support/shards/time-balanced-sequencer.ts, from the times in unit-test-times.generated.ts beside it,
  # which `node scripts/generate/tests/unit-test-times.mjs` rewrites from CI's logs: scripts/generate/README.md). With
  # vitest's split by a hash of each path, one of two shards held 57% of the test time; three even ones end with the
  # Windows shards. The count is the matrix's alone: the name and `--shard` read it as `strategy.job-total`.
  unit:
    name: Unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build, test-data, select-tests]
    if: >-
      ${{
        needs.select-tests.outputs.unit != 'none' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select-tests.outputs.unit-shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The pack validation's check 4 leaves scoring the fixtures to the conformance check (the conformance and tools jobs
      # below), which scores the same fixtures through the same runner and fails on the same failures, so they are scored
      # once (test/engine/catalog/packs.test.ts). The pack publish gate (release-packs.yml) still scores them itself.
      # TESTS: the selected files' paths, read into words (none holds a space); empty runs every file. A shard may find
      # none of a few selected files (--passWithNoTests); a run of every file that finds none fails.
      - name: Unit tests
        env:
          RERAIL_PACK_FIXTURES_IN_CONFORMANCE: "1"
          TESTS: ${{ needs.select-tests.outputs.unit-tests }}
          UNIT: ${{ needs.select-tests.outputs.unit }}
        run: |
          read -ra tests <<< "$TESTS"
          some=(); if [ "$UNIT" = some ]; then some=(--passWithNoTests); fi
          npm test -- "${some[@]}" --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${tests[@]}"

      # Every statement, branch and function of reading a repository's own lint config is run by its tests, file by
      # file (package.json `test:coverage:lint-config`). Once, on the first shard, which the split gives that much less
      # of the suite (`firstShardExtraMs` in the times).
      - name: Lint config coverage gate
        if: matrix.shard == 1
        run: npm run test:coverage:lint-config

  # The Windows engine the Windows unit shards load, built once per run and handed to them as an artifact, as the build
  # job hands Linux's to the Linux jobs: the release form package.yml builds, downloaded or built as in the build job.
  # Gated as the shards are.
  build-windows:
    name: Build (Windows)
    needs: [changes, select-tests]
    if: >-
      ${{
        needs.changes.outputs.release-pr != 'true' && needs.select-tests.outputs.windows-shards != '[]' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: windows-2025
    # A cold release build took 27 minutes on windows-2025 (44363497802, with rerail-logic and rerail-engine split).
    timeout-minutes: 45
    # actions: read finds and downloads an earlier engine and main's cargo target.
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # Windows refuses paths over 260 characters unless Git is told to use long paths (as in package.yml). Line ends
      # stay as Git for Windows sets them (core.autocrlf true), as in the unit shards.
      - name: Allow long paths in Git on Windows
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # An engine an earlier run built from the same inputs (main's, or this branch's last push): then no cargo at all.
      - id: engine
        uses: ./.github/actions/engine-artifact
        with:
          target: x86_64-pc-windows-msvc
          mode: find
          ref: ${{ env.WARM_REF }}

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        if: steps.engine.outputs.hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/cargo-target
        with:
          name: cargo-target-x86_64-pc-windows-msvc
          mode: restore
          ref: ${{ env.WARM_REF }}

      - if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/node-deps

      # build:native's checks, then the release build as package.yml runs it.
      - name: Build the native engine
        if: steps.engine.outputs.hit != 'true'
        run: |
          node scripts/build/require-cargo.mjs
          node scripts/build/require-lfs.mjs
          node scripts/build/release-engine.mjs x86_64-pc-windows-msvc

      - name: Upload the Windows engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-windows
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

      - name: Upload the engine for later runs
        if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/engine-artifact
        with:
          target: x86_64-pc-windows-msvc
          mode: upload

      - name: Save the cargo target
        if: env.SAVE_WARM == 'true' && steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/cargo-target
        with:
          name: cargo-target-x86_64-pc-windows-msvc
          mode: save

  # The engine's #[cfg(windows)] tests (process starts, Windows import roots, the tree watch's oplock watch, the path
  # owner read, the named pipe lookup's open, a restore's and the server graph's walk's reading of NTFS's change time)
  # are compiled out on Linux, where the rust job runs every other test; these filters select them and the
  # Windows-neutral tests beside them: the process, path owner and pipe lookup tests are the engine's, the tree watch's
  # rerail-tree-watch's, the import roots' rerail-lang-ecma's, which mounts `import_target`. The restore's
  # (`git_workspace::`) are rerail-store's, the walk's (`code_rule_dsl::module_graph::`) the engine's and, for its
  # folder listing, rerail-lang-ecma's, and the warm index's four the engine's.
  # `discovers_current_repository_without_a_git_process` stays out: it fails on Windows on `main` as well. So does
  # `a_folder_git_does_not_ignore_that_this_account_may_not_list_still_stops_discovery`: it denies a folder's listing,
  # which a token with the Backup privilege on, as this runner's administrator holds it, lists all the same (run on
  # Windows 11 with that privilege kept, it fails, and the restore's, the walk's and the warm index's cases pass). The
  # `.rerail` library's canonical path is joined with `/` by `bootstrap.rerail`, which only Windows' verbatim paths
  # broke: its test runs here too. The main instance's lock tests run here as well: the wait for a held lock is Windows
  # code (an overlapped LockFileEx cancelled at its bound) that the same tests run as Unix code on Linux. A debug
  # build, as in the rust job, through its own compile cache. Its own job, beside build-windows and the shards rather
  # than on one of them. Gated as the rust job is, and only when the change selects the engine's tests (`rust-engine`).
  rust-windows:
    name: Rust engine (Windows)
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.rust != 'false' && needs.changes.outputs.rust-engine != 'false' &&
        needs.changes.outputs.release-pr != 'true' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: windows-2025
    # A cold build of the two crates' tests took 20 to 21 minutes on windows-2025 (44351818975, 44363497802), the tests
    # seconds.
    timeout-minutes: 30
    # actions: read finds and downloads main's compile cache.
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Allow long paths in Git on Windows
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - id: compile-cache
        uses: ./.github/actions/rust-compile-cache
        with:
          name: test-windows-engine
          ref: ${{ env.WARM_REF }}

      - name: Engine Windows tests
        run: >-
          cargo test --manifest-path Cargo.toml -p rerail-engine -p rerail-lang-ecma -p rerail-tree-watch -p rerail-store
          --lib -- process:: code_rule_dsl::import_target:: tree_watch:: path_owner:: main_instance:: pipe_server::
          code_rule_dsl::logic::rr::tests::the_canonical_library_joins_with_a_slash_as_bootstrap_joins_it
          git_workspace:: code_rule_dsl::module_graph::
          code_rule_dsl::workspace::context_tests::a_warm_index_reads_a_same_size_edit_that_keeps_its_mtime_before_discovery
          code_rule_dsl::workspace::context_tests::a_warm_index_restores_a_clean_file_whose_read_is_denied
          code_rule_dsl::workspace::context_tests::a_warm_index_reads_a_file_whose_change_time_moved_at_every_index
          code_rule_dsl::workspace::context_tests::a_warm_index_restores_a_file_whose_data_is_offline_with_no_read
          --skip git_workspace::tests::discovers_current_repository_without_a_git_process
          --skip git_workspace::tests::a_folder_git_does_not_ignore_that_this_account_may_not_list_still_stops_discovery

      - name: Save the compile cache
        if: ${{ !cancelled() && env.SAVE_WARM == 'true' }}
        uses: ./.github/actions/rust-compile-cache/save
        with:
          artifact: ${{ steps.compile-cache.outputs.artifact }}
          dir: ${{ steps.compile-cache.outputs.dir }}

  # The unit suite on Windows, the one job that runs it there: paths, shells, process starts and file locks behave
  # differently on Windows, and every other test job runs on Linux or macOS. Five shards where Linux has three: the
  # suite runs more than twice as slowly here. The shards split the files by how long each takes on Windows in CI, as
  # the unit job's do; with vitest's split by a hash of each path the slowest of the five held nearly twice the
  # fastest's test time. The count is the matrix's alone: the name and `--shard` read it as `strategy.job-total`. Gated
  # as the unit job is, and reads the same test data: the test-data job's artifact, downloaded and verified against the
  # locks as on Linux. The engine is build-windows' artifact; the package (dist/) is the build job's, as every Linux job
  # takes it, rather than `npm run build:js` in each shard (about 20 s): tsc and esbuild emit the same JavaScript for Node
  # on any OS, from sources checked out with LF line ends (.gitattributes), and dist/ names no build machine's path.
  unit-windows:
    name: Unit tests (Windows, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [test-data, build, build-windows, select-tests]
    if: >-
      ${{
        needs.select-tests.outputs.windows-shards != '[]' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: windows-2025
    # A shard took 4 to 9 minutes with the engine downloaded (44363497802).
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select-tests.outputs.windows-shards) }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows refuses paths over 260 characters unless Git is told to use long paths (as in package.yml). Line ends
      # stay as Git for Windows sets them (core.autocrlf true), so the job checks out as a contributor does and fails
      # when .gitattributes stops keeping the rules, locks, fixtures and model as committed.
      - name: Allow long paths in Git on Windows
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - uses: ./.github/actions/node-deps

      - name: Download the Windows engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-windows
          path: native

      # dist/ alone: the artifact's Linux engine stays out of native/.
      - name: Download the built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: ${{ runner.temp }}/built

      - name: Take dist/ from the built package
        run: mv "$RUNNER_TEMP/built/dist" dist

      # A runner's first Python start reads the interpreter and its standard library cold: about a second here, but
      # 0.5 to 11 s once the tests run beside it, and up to 87 s, past the 30 s a test may take, in the test of
      # write_provenance (test/scripts/pack-data/provenance.test.ts). Later starts take about 0.1 s, so the tests that
      # start Python time their own work.
      - name: Read Python in
        run: python3 -B -c "import json, os, pathlib, shutil, subprocess, sys"

      # As in the unit job, with TEMP and TMP at runner.temp, a long path. The runner's TEMP is an 8.3 short path
      # (C:\Users\RUNNER~1\...), and Rerail's tests compare long paths: Rerail records a checkout by its long path, and
      # the tests expect the temporary folder's path as given, so 42 of them fail on the spelling alone.
      # The test files select-tests chose (TESTS: their paths, read into words; empty runs every file), or none when it
      # chose only the hook test below. vitest's own shim, from bash, starts node directly: npm's cmd.exe would cut the list
      # at 8,191 characters, CreateProcess takes 32,767. As on Linux, only a shard of a few selected files may find none.
      - name: Unit tests
        if: needs.select-tests.outputs.unit != 'none'
        env:
          RERAIL_PACK_FIXTURES_IN_CONFORMANCE: "1"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TESTS: ${{ needs.select-tests.outputs.unit-tests }}
          UNIT: ${{ needs.select-tests.outputs.unit }}
        run: |
          read -ra tests <<< "$TESTS"
          some=(); if [ "$UNIT" = some ]; then some=(--passWithNoTests); fi
          node_modules/.bin/vitest run --dir test "${some[@]}" --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${tests[@]}"

      # The integration job runs on Linux only. This file replays a Claude Code session through the built hook as
      # Claude Code runs it on Windows (dist/harness/hook-launcher.js), against a daemon of this build, including a
      # session VS Code opens with a lower-case `c:`; it needs the engine and dist/ the steps above took, and takes
      # about a minute, so one shard runs it, which the split gives that much less of the suite (`firstShardExtraMs`
      # in the times).
      - name: Claude Code hook integration test
        if: matrix.shard == 1
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npx vitest run integration/claude-hook-rules.test.ts

  # The dashboard in Chromium over seeded scenario databases (e2e/README.md). Each worker runs the daemon from source
  # (`--dev` serves ui/ as committed), which needs the build's native engine. Runs when the e2e filter matches.
  ui-e2e:
    name: Dashboard browser tests
    needs: [build, changes]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Dashboard browser tests
        run: npm run test:ui:e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-report
          path: .rerail/e2e/
          retention-days: 7

  # Runs when the integration filter matches.
  integration:
    name: Integration tests
    needs: [build, changes]
    if: needs.changes.outputs.integration != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration:built

  # Rule packs installed from npm, against the registry: set-up on a project outside this repository, and
  # `rerail packs` upgrading, downgrading and removing a published pack (integration/installed-packs.test.ts).
  # NPM_PACKS_READ_TOKEN is a read-only granular token for the restricted @neralabs packs. Only the steps that check it
  # and read the packs get it; `npm ci` and the build run without it. Runs when the integration filter matches.
  installed-packs:
    name: Rule packs installed from npm
    needs: [build, changes]
    if: >-
      ${{
        needs.changes.outputs.integration != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            needs.changes.outputs.release-pr != 'true'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the npm read token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted rule packs needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The file names the variable, not the token: npm reads NODE_AUTH_TOKEN from the step that runs it.
      - name: Authenticate npm to read the packs
        run: |
          # shellcheck disable=SC2016 # npm expands ${NODE_AUTH_TOKEN} itself; the file must not hold the token.
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - name: Rule packs from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
          RERAIL_INSTALLED_PACKS_NPM: "1"
        run: npx vitest run integration/installed-packs.test.ts

  # The conformance check scores every pack's ported rules on its test data and samples, restored from what the test-data
  # job saved, and judges every rule of each gated tool-pack (conformance/languages/gates.ts); the conformance-report job
  # posts its summary on the pull request. The scoring is spread over the shards of this job, each a share of every
  # pack's evaluations on a runner of its own (conformance/languages/shards.ts); the tools job makes the reports from
  # all their results, as one run evaluating everything would, and judges them. The shards, the tools job's conformance
  # steps and the comment run when the conformance filter matches.
  conformance:
    name: Conformance (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build, test-data, changes]
    if: >-
      ${{
        needs.changes.outputs.conformance != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Eight shards of three workers each (the runner's 16 GB hold three; conformance/languages/shards.ts): the scoring
    # takes one to two and a half minutes on each, by the runner's CPU. The matrix alone says how many there are.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Score shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: npm run conformance:languages:check -- --shard "$SHARD/$SHARDS" --results-out "$RUNNER_TEMP/conformance-results"

      - name: Upload the shard's results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/conformance-results/
          if-no-files-found: error
          retention-days: 1

  # Runs when a shard failed too, so the conformance check fails on the missing results and the comment says the run
  # produced no summary. The script tests and reference examples run on every pull request; the conformance steps when
  # the conformance filter matches, so a pull request that skips the shards skips them too, and passes here.
  tools:
    name: Scripts, reference examples, and conformance
    needs: [build, test-data, changes, conformance]
    if: >-
      ${{
        !cancelled() && needs.build.result == 'success' && needs.test-data.result == 'success' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Script tests and reference examples
        run: |
          npm run test:scripts
          npm run test:profiling
          npm run test:reference

      # The not-gated and pending lists may only shrink against the base: the pull request's base, or the push's previous
      # head. The checkout keeps no credentials, so the base commit is fetched with the token; when it cannot be, the
      # check fails closed.
      - name: Fetch the base commit
        if: needs.changes.outputs.conformance != 'false' && (github.event.pull_request.base.sha || github.event.before) != '' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$BASE" || true

      - name: Download the shards' results
        if: needs.changes.outputs.conformance != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/conformance-results

      # Offline: every pack's report from the shards' results, then every rule of each gated tool-pack through loads,
      # compact and the conformance checks, spread over worker processes. A shipped rule that fails, fails the job;
      # candidates are only reported. The fixtures scored here are the pack validation's check 4 too, which the unit tests
      # leave to this job. The summary and the pull request comment go to the conformance-summary artifact.
      - name: Conformance
        if: needs.changes.outputs.conformance != 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CONFORMANCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CONFORMANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A push that creates a branch has no previous head.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=""; fi
          npm run conformance:languages:check -- --results "$RUNNER_TEMP/conformance-results" ${BASE:+--base "$BASE"} --out "$RUNNER_TEMP/conformance"

      - name: Upload the conformance summary
        if: always() && needs.changes.outputs.conformance != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-summary
          path: ${{ runner.temp }}/conformance/
          if-no-files-found: warn
          retention-days: 14

  # The one sticky pull request comment of the conformance check: the comment that starts with the marker is edited in
  # place, or posted when there is none. It runs nothing from the checkout. Fork pull requests get a read-only token and
  # no tools run, so they get no comment. A pull request the conformance filter skips gets none either, rather than one
  # saying the run produced no summary; a comment an earlier run posted stays as it was, naming the commit it judged.
  conformance-report:
    name: Conformance comment
    needs: [changes, tools]
    if: >-
      ${{
        always() && needs.changes.outputs.conformance != 'false' &&
        needs.tools.result != 'skipped' && needs.tools.result != 'cancelled' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download the conformance summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-summary
          path: ${{ runner.temp }}/conformance

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- rerail-conformance -->'
          body="$RUNNER_TEMP/conformance/comment.md"
          if [ ! -s "$body" ]; then
            mkdir -p "$RUNNER_TEMP/conformance"
            printf '%s\n## Conformance: the run produced no summary\n\nSee the [workflow run](%s).\n' "$marker" "$RUN_URL" > "$body"
          fi
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .id] | first // empty" | sed -n '1p')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi

  # The rerail pack's `.rerail` translations against its JSON rules (scripts/ship/translations.ts): each rule's findings
  # through both, on the pack's examples and on an export of this repository at the commit scripts/ship/corpora.json
  # pins (`rerail-translations`, checked against its pin), must be what docs/rule-syntax/packs/rerail/equivalence.json
  # declares. The originals run through the product's path on the build job's engine; the translations through the
  # release `rerail-engine` binary built here, from its own compile cache.
  translations:
    name: Rule translations against their originals
    needs: [changes, build]
    if: needs.changes.outputs.translations != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # actions: main's compile cache, an artifact of another run.
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # build.rs refuses the Unicode names table's LFS pointer.
      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - id: compile-cache
        uses: ./.github/actions/rust-compile-cache
        with:
          name: translations-engine

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Build the rerail-engine binary
        run: cargo build --release --manifest-path native/Cargo.toml --bin rerail-engine

      # Straight after the build, so a later step's failure keeps it.
      - name: Save the compile cache for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/rust-compile-cache/save
        with:
          artifact: ${{ steps.compile-cache.outputs.artifact }}
          dir: ${{ steps.compile-cache.outputs.dir }}

      # The checkout keeps no credentials, so the pinned commit is fetched alone with the token; the suite exports the
      # corpus from it and fails when it does not match the pin.
      - name: Fetch the corpus's pinned commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          commit="$(node -p 'require("./scripts/ship/corpora.json").corpora["rerail-translations"].commit')"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$commit"

      - name: Check the rerail pack's translations
        run: npm run translations:check -- --pack rerail --engine target/release/rerail-engine --corpora "$RUNNER_TEMP/translations/corpora" --out "$RUNNER_TEMP/translations/out"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translations
          path: ${{ runner.temp }}/translations/out/*.json
          if-no-files-found: warn
          retention-days: 14

  # Real sessions call hosted models, which costs money on every run: they and provider-smoke run when the sessions
  # filter matches.
  real-sessions:
    name: OMP and Pi real-session runtime paths
    needs: [build, changes]
    if: >-
      ${{
        needs.changes.outputs.sessions != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            needs.changes.outputs.release-pr != 'true'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      RERAIL_SMOKE_OMP_MODEL: ${{ vars.RERAIL_SMOKE_OMP_MODEL }}
      RERAIL_SMOKE_PI_MODEL: ${{ vars.RERAIL_SMOKE_PI_MODEL }}
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL RERAIL_SMOKE_OMP_MODEL RERAIL_SMOKE_PI_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Real-session smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Exercise OMP and Pi real-session runtime paths
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          results="$RUNNER_TEMP/rerail-harness-smoke"
          mkdir -p "$results"
          # The proof is Rerail's steer path, not the model's reasoning: at OMP's default thinking level gpt-5 spends two
          # to three minutes of the 180 s budget on a one-file write, and the runs that go over it fail on every branch.
          node --import tsx scripts/host/host-lifecycle.ts omp -- \
            --provider azure --model "$RERAIL_SMOKE_OMP_MODEL" --thinking low > "$results/omp.log" 2>&1 &
          omp_pid=$!
          node --import tsx scripts/host/host-lifecycle.ts pi -- \
            --provider azure --model "$RERAIL_SMOKE_PI_MODEL" > "$results/pi.log" 2>&1 &
          pi_pid=$!
          status=0
          if ! wait "$omp_pid"; then status=1; fi
          if ! wait "$pi_pid"; then status=1; fi
          cat "$results/omp.log"
          cat "$results/pi.log"
          exit "$status"

  # The macOS engine the real-session smoke loads (it runs the hosts under sandbox-exec, so on macOS only), built as
  # build-windows builds Windows' (downloaded when an earlier run built it from the same inputs) and handed over as an
  # artifact, in its own job so a smoke that times out or is re-run never costs a build. Gated as the smoke is.
  build-macos:
    name: Build (macOS)
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.sessions != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            needs.changes.outputs.release-pr != 'true'
          )
        )
      }}
    runs-on: macos-15
    # A cold release build took 20 minutes on macos-15 (44363497802, with rerail-logic and rerail-engine split).
    timeout-minutes: 35
    # actions: read finds and downloads an earlier engine and main's cargo target.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # An engine an earlier run built from the same inputs (main's, or this branch's last push): then no cargo at all.
      - id: engine
        uses: ./.github/actions/engine-artifact
        with:
          target: aarch64-apple-darwin
          mode: find
          ref: ${{ env.WARM_REF }}

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        if: steps.engine.outputs.hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/cargo-target
        with:
          name: cargo-target-aarch64-apple-darwin
          mode: restore
          ref: ${{ env.WARM_REF }}

      - if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/node-deps

      # build:native's checks, then the release build as package.yml runs it.
      - name: Build the native engine
        if: steps.engine.outputs.hit != 'true'
        run: |
          node scripts/build/require-cargo.mjs
          node scripts/build/require-lfs.mjs
          node scripts/build/release-engine.mjs aarch64-apple-darwin

      - name: Upload the macOS engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-macos
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

      - name: Upload the engine for later runs
        if: steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/engine-artifact
        with:
          target: aarch64-apple-darwin
          mode: upload

      - name: Save the cargo target
        if: env.SAVE_WARM == 'true' && steps.engine.outputs.hit != 'true'
        uses: ./.github/actions/cargo-target
        with:
          name: cargo-target-aarch64-apple-darwin
          mode: save

  provider-smoke:
    name: Real Claude Code, Codex, and Cursor sessions
    needs: [changes, build, build-macos]
    if: >-
      ${{
        needs.changes.outputs.sessions != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            needs.changes.outputs.release-pr != 'true'
          )
        )
      }}
    runs-on: macos-15
    # Three provider attempts of up to 3 minutes each, side by side, after about 2 minutes of set-up; the host assets
    # are the build job's package (dist/ is the same on every OS), the engine build-macos'.
    timeout-minutes: 20
    env:
      # One Azure AI key serves both the Foundry Anthropic endpoint and the Azure OpenAI endpoint.
      ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      ANTHROPIC_FOUNDRY_BASE_URL: ${{ vars.ANTHROPIC_FOUNDRY_BASE_URL }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      RERAIL_CODEX_MODEL: ${{ vars.RERAIL_CODEX_MODEL }}
      RERAIL_CLAUDE_MODEL: ${{ vars.RERAIL_CLAUDE_MODEL }}
      # A session where the model never lands the violation (or the provider stalls) is inconclusive, not red.
      RERAIL_SMOKE_ATTEMPTS: "3"
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in ANTHROPIC_FOUNDRY_API_KEY ANTHROPIC_FOUNDRY_BASE_URL AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL CURSOR_API_KEY RERAIL_CODEX_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Provider smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Install real provider CLIs
        run: |
          npm install --global --ignore-scripts @anthropic-ai/claude-code-darwin-arm64@2.1.266 @openai/codex@0.153.4
          curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
            https://downloads.cursor.com/lab/2026.09.08-6caf4ff/darwin/arm64/agent-cli-package.tar.gz \
            --output "$RUNNER_TEMP/cursor-agent.tar.gz"
          echo "9c456cc432adc476202a2b09c21a10944fdf484b3ca55dcbf939bbc8ce30dcbe  $RUNNER_TEMP/cursor-agent.tar.gz" \
            | shasum -a 256 --check
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/cursor-agent"
          ln -s "$(npm root --global)/@anthropic-ai/claude-code-darwin-arm64/claude" "$HOME/.local/bin/claude"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/cursor-agent.tar.gz" -C "$HOME/.local/share/cursor-agent"
          ln -s "$HOME/.local/share/cursor-agent/cursor-agent" "$HOME/.local/bin/agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # After the built package, whose native/ holds Linux's engine and loader: the loader is the same, and the macOS
      # engine joins it.
      - name: Download the macOS engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-macos
          path: native

      - name: Exercise real Claude Code, Codex, and Cursor sessions
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/rerail-provider-smoke"
          mkdir -p "$results"
          node --import tsx scripts/host/host-smoke.ts --host claude-code > "$results/claude-code.log" 2>&1 &
          claude_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport node --import tsx scripts/host/host-smoke.ts --host codex > "$results/codex.log" 2>&1 &
          codex_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport node --import tsx scripts/host/host-smoke.ts --host cursor > "$results/cursor.log" 2>&1 &
          cursor_pid=$!
          status=0
          if ! wait "$claude_pid"; then status=1; fi
          if ! wait "$codex_pid"; then status=1; fi
          if ! wait "$cursor_pid"; then status=1; fi
          cat "$results/claude-code.log"
          cat "$results/codex.log"
          cat "$results/cursor.log"
          exit "$status"

  # The one required check (the note at the top). It needs every other job, runs whatever happened to them, and fails
  # when any of them failed or was cancelled. A job skipped by its own condition passes: forks and Dependabot get no
  # secrets or OIDC token, the Release pull request runs only the licence and lint jobs, and the path filters (the
  # changes job) skip what a pull request's files cannot affect. scripts/check/check-ci-paths.mjs fails when a job is
  # missing here.
  ci-result:
    name: CI result
    needs:
      - licenses
      - lint
      - audit
      - changes
      - select-tests
      - test-data
      - test-data-in-s3
      - rust-clippy
      - rust-tests-build
      - rust
      - rust-profiling
      - rust-macos
      - build
      - build-windows
      - build-macos
      - rust-windows
      - rust-wasm
      - unit
      - unit-windows
      - ui-e2e
      - integration
      - installed-packs
      - conformance
      - tools
      - conformance-report
      - translations
      - real-sessions
      - provider-smoke
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key) | .[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | sort | join(", ")' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
