            contract_index=$((contract_index + 1))
          done
          timeout 115s npx vitest run --dir test test/conformance/data-layer/batch-ten-repair.test.ts test/engine/native/data-layer-ten/
          report_index=0
          for pattern in 'configured (graph_lazy_sql_plan|bounded_composed_graph_paths|graphql_plan_ownership) ' 'configured (plan_optimizer_v2|conditional_architecture) ' 'matching_architecture' 'configured (schema_introspection_data_paths|hnsw_architecture|embedding_vector_orchestration|generated_index_sources) '; do
            timeout 115s npx vitest run --dir test test/conformance/data-layer/batch-ten-defaults.test.ts -t "$pattern" \
              --reporter=json --outputFile="$RUNNER_TEMP/batch-ten-reports/configured-$report_index.json"
            report_index=$((report_index + 1))
          done
          timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" -m pytest -q -p no:cacheprovider -c /dev/null scripts/dsl/data_layer_ten/evidence_cases.py
          timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" -m pytest -q -p no:cacheprovider -c /dev/null scripts/dsl/data_layer_ten/assertions/evidence_cases.py
          timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" -m pytest -q -p no:cacheprovider -c /dev/null scripts/dsl/data_layer_ten/contracts/completion_cases.py
          python3 test/scripts/data_layer/test_complete_measurement.py
          for mode in snapshot workspace; do
            timeout 115s npx vitest run --dir test test/conformance/data-layer/batch-ten-configured-repository.test.ts \
              -t "configured repository $mode" --reporter=json --outputFile="$RUNNER_TEMP/batch-ten-reports/configured-repository-$mode.json"
          done
          PYTHONPATH=scripts/dsl timeout 115s "$RUNNER_TEMP/batch-eight-venv/bin/python" - <<'PY'
          import json,os
          from pathlib import Path
          from data_layer_ten.evidence import read_report,verify_configured,verify_contracts
          from data_layer_ten.assertions.evidence import verify_replay
          from data_layer_ten.assertions.transferred import verify_transfer
          reports=Path(os.environ['RUNNER_TEMP'])/'batch-ten-reports'
          paths=[reports/f'configured-{i}.json' for i in range(4)]+[reports/f'configured-repository-{mode}.json' for mode in ['snapshot','workspace']]
          summary=verify_configured(read_report(Path('fixtures/host/data-layer-port/batch-10-configured-defaults.json.gz')),[read_report(p) for p in paths])
          (reports/'configured-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          focused=verify_contracts(read_report(Path('fixtures/host/data-layer-port/batch-10-file-contract-regressions.json')),[read_report(reports/f'contracts-{i}.json') for i in range(3)])
          (reports/'contracts-summary.json').write_text(json.dumps(focused,indent=2)+'\n')
          helpers=verify_replay(read_report(Path('fixtures/host/data-layer-port/batch-10-helper-assertions.json')),[read_report(reports/'helpers-replay.json')])
          (reports/'helpers-replay-summary.json').write_text(json.dumps(helpers,indent=2)+'\n')
          transferred=verify_transfer(read_report(Path('fixtures/host/data-layer-port/batch-10-assertion-ledger.json'))['cases'],read_report(Path('fixtures/host/data-layer-port/batch-10-transferable-assertions.json')),[read_report(reports/f'transferred-{i}.json') for i in range(6)])
          (reports/'transferred-summary.json').write_text(json.dumps(transferred,indent=2)+'\n')
          PY
      - name: Upload batch-ten assertion receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
