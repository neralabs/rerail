name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Real-session jobs call hosted models with repository secrets, and the installed-packs job reads the restricted
# rule packs from npm with one. GitHub withholds secrets from fork and Dependabot pull requests, so those jobs run on
# pushes and same-repository pull requests only; there a missing secret or variable is a configuration error and
# fails the job.
#
# The Version packs pull request (changeset-release/main, from version-packs.yml) changes only pack versions,
# changelogs and package-lock.json, and is rewritten on every push to main. It runs the licence and lint jobs only:
# release-packs.yml validates and packs every pack on it, and main runs everything once it is merged.

jobs:
  licenses:
    name: Licences (REUSE and copyleft gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Every file carries licence information and every licence it names has its text in LICENSES/.
      - name: REUSE lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

      # Only allowlisted (permissive) licences in LICENSES/, and no copyleft production dependency.
      - name: Licence allowlist and copyleft gate
        run: node scripts/check/check-licenses.mjs

  # Type checks and generated-reference checks need neither Rust nor a build.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.57.0"

      - name: Check the Justfile
        run: just --fmt --check --unstable

      - uses: ./.github/actions/node-deps

      # `npm run check` type-checks and runs the structure gate (docs/repository-structure.md); then the UI
      # token reference check and the policy DSL reference grammar check.
      - name: Type-check, structure gate, and generated references
        run: |
          npm run check
          npm run check:ui-tokens
          npm run check:reference

  # Pull requests that touch none of the engine's inputs skip the Rust jobs. The engine's tests also
  # read conformance/, fixtures/, the packs' rules and the language registry (languages/ and its
  # generated TS module); package.json holds the cargo commands, .gitattributes the LFS objects the
  # engine embeds. Pushes to main always run the Rust jobs.
  #
  # Port readiness is filtered on pushes to main as well, against the push's previous head (main takes squash merges
  # only and no force pushes, so a push is one commit), but only when CI finished green on that head. Otherwise (it
  # failed, so a shipped rule may still be failing; it was cancelled while queued, so its change was never judged; or
  # nothing can be found) the push runs port readiness whatever it touches, so main cannot read green past either. A
  # checkout, lookup or filter that fails on a push runs everything too.
  changes:
    name: Detect engine changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      rust: ${{ github.event_name == 'pull_request' && steps.filter.outputs.rust || 'true' }}
      port-readiness: ${{ (github.event_name != 'push' || steps.previous.outputs.green == 'true') && steps.filter.outcome == 'success' && steps.filter.outputs.port-readiness || 'true' }}
    steps:
      # The concurrency group lets a push run start only once the previous one finished or was replaced while queued,
      # so the previous head's run has its conclusion by now.
      - id: previous
        name: Check CI finished green on the previous head
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          conclusion="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$BEFORE&event=push&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
          echo "CI on $BEFORE: ${conclusion:-no finished run}"
          if [ "$conclusion" = "success" ]; then echo "green=true" >> "$GITHUB_OUTPUT"; else echo "green=false" >> "$GITHUB_OUTPUT"; fi

      # paths-filter lists a pull request's files through the API but diffs a push with git, which needs a checkout;
      # depth 2 holds the push's previous head. A failed checkout fails the filter below, which then runs everything.
      - name: Checkout repository
        if: github.event_name == 'push'
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # No `base`: on a push to the default branch paths-filter compares with the payload's `before` (an all-zeros
      # `before` lists every file as added).
      - id: filter
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'native/**'
              - 'conformance/**'
              - 'fixtures/**'
              - 'packs/**'
              - 'languages/**'
              - 'src/engine/code-rule/code-rule-language-registry.generated.ts'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - '.github/actions/lfs/**'
            # A rule's verdict depends on its document, the tool-pack's expected answers (keyed by everything the
            # generator reads, all under these paths), the gate code and the engine.
            port-readiness:
              - 'packs/**'
              - 'conformance/**'
              - 'native/**'
              - 'languages/**'
              - 'src/engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/port-readiness.yml'
              - '.github/actions/**'

  # rustfmt and clippy, and the engine's own tests, side by side; nothing downstream waits for them.
  # Each keeps its own cache: clippy's check metadata and the test binaries share no artifacts.
  rust:
    name: Rust engine (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust != 'false' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: clippy
            name: fmt, clippy
            run: npm run check:native
          - task: test
            name: tests
            run: npm run test:native
    # Line tables keep file:line in panics at a fraction of full debuginfo; incremental state only
    # bloats the cache, since dependencies never build incrementally.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  # Builds the package once: dist/ and the release native engine, handed to every test job.
  build:
    name: Build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release engine depends only on the engine's sources, the language registry (build.rs generates
      # its tables from languages/), the lockfile, the workspace profile, the toolchain and the napi CLI.
      # Most pull requests change none of them and reuse main's build.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  # A push to main promotes every gated tool-pack's expected answers (docs/port-readiness.md) to main's container in
  # Azure Blob Storage, under its generator key, before the gates read them there: main's container already holds the
  # key, or the merged pull request's answers job uploaded them under its number and they are copied (checked against
  # their sha256 and key), or they are generated here. No job holding the main identity runs the generator, which runs
  # upstream's code and the Composer packages it resolves, unlocked: promote finds what is missing, promote-generate
  # generates it with no Azure token, and promote-upload uploads what it generated.
  promote:
    name: Promote the port readiness answers
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.port-readiness != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # pull-requests: the merged pull request's number. id-token: azure/login's OIDC exchange for the main identity
    # (writes main's container, reads the -pr container).
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      missing: ${{ steps.promote.outputs.missing }}
      pr: ${{ steps.pr.outputs.number }}
    env:
      RERAIL_EXPECTED_ACCOUNT: ${{ vars.RERAIL_EXPECTED_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The generator key hashes the tree as the answers jobs check it out, LFS objects included.
      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps

      # A push that no pull request merged (none is associated with it) has no pull request's answers to copy.
      - id: pr
        name: Find the pull request this push merged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')"
          echo "$SHA merged ${number:+pull request #}${number:-no pull request}"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - id: plan
        name: List the gated tool-packs
        run: node conformance/port-readiness/plan.mjs

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_MAIN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --no-generate exits 3 when neither container holds the key: those tool-packs go to promote-generate.
      - id: promote
        name: Promote what main's container or the pull request's holds
        env:
          PR: ${{ steps.pr.outputs.number }}
          TOOL_PACKS: ${{ steps.plan.outputs.tool-packs }}
        run: |
          set -euo pipefail
          missing=()
          failed=()
          while IFS= read -r toolpack; do
            set +e
            npm run generate -- --promote --no-generate --pack "${toolpack%%/*}" --tool "${toolpack#*/}" ${PR:+--pr "$PR"}
            status=$?
            set -e
            case "$status" in
              0) ;;
              3) missing+=("$toolpack") ;;
              *) failed+=("$toolpack") ;;
            esac
          done < <(jq -r '.[]' <<< "$TOOL_PACKS")
          echo "missing=$(printf '%s\n' "${missing[@]}" | jq -cR 'select(. != "")' | jq -cs .)" >> "$GITHUB_OUTPUT"
          if [ "${#missing[@]}" -gt 0 ]; then echo "::notice::no container holds these tool-packs' answers, so they are generated: ${missing[*]}"; fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::could not promote ${failed[*]} (the log above says why)"
            exit 1
          fi

  promote-generate:
    name: Generate the port readiness answers (${{ matrix.tool-pack }})
    needs: [promote, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.promote.outputs.missing != '' && needs.promote.outputs.missing != '[]' }}
    runs-on: ubuntu-24.04
    # Generating javascript/eslint's answers runs upstream on 11,368 test cases.
    timeout-minutes: 120
    # No id-token: this job runs upstream's code.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool-pack: ${{ fromJSON(needs.promote.outputs.missing) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - id: tool-pack
        name: Split the tool-pack
        env:
          TOOL_PACK: ${{ matrix.tool-pack }}
        run: |
          echo "pack=${TOOL_PACK%%/*}" >> "$GITHUB_OUTPUT"
          echo "tool=${TOOL_PACK#*/}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/generator-runtimes
        with:
          pack: ${{ steps.tool-pack.outputs.pack }}
          tool: ${{ steps.tool-pack.outputs.tool }}

      # No RERAIL_EXPECTED_ACCOUNT: the generator touches no container and writes only the local cache.
      - name: Generate the answers
        env:
          PACK: ${{ steps.tool-pack.outputs.pack }}
          TOOL: ${{ steps.tool-pack.outputs.tool }}
        run: npm run generate -- --pack "$PACK" --tool "$TOOL"

      - name: Hand the answers to promote-upload
        uses: actions/upload-artifact@v7
        with:
          name: promote-expected-${{ steps.tool-pack.outputs.pack }}-${{ steps.tool-pack.outputs.tool }}
          path: .rerail/port-readiness/expected/
          if-no-files-found: error
          retention-days: 1

  # --no-generate again: the answers come from promote-generate's artifacts through the local cache, and a tool-pack
  # whose generation failed exits 3 here rather than generating under the main identity.
  promote-upload:
    name: Upload the generated port readiness answers
    needs: [promote, promote-generate]
    if: ${{ !cancelled() && needs.promote-generate.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RERAIL_EXPECTED_ACCOUNT: ${{ vars.RERAIL_EXPECTED_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps

      - name: Download the generated answers
        uses: actions/download-artifact@v8
        with:
          pattern: promote-expected-*
          path: .rerail/port-readiness/expected
          merge-multiple: true

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_MAIN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Promote the generated answers
        env:
          PR: ${{ needs.promote.outputs.pr }}
          MISSING: ${{ needs.promote.outputs.missing }}
        run: |
          set -euo pipefail
          failed=()
          while IFS= read -r toolpack; do
            npm run generate -- --promote --no-generate --pack "${toolpack%%/*}" --tool "${toolpack#*/}" ${PR:+--pr "$PR"} || failed+=("$toolpack")
          done < <(jq -r '.[]' <<< "$MISSING")
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::could not promote ${failed[*]}: promote-generate failed for them, or the upload did (the log above says why)"
            exit 1
          fi

  # Every rule a pack ships must pass the port readiness gates; candidates are only reported (docs/port-readiness.md).
  # They run when a pull request or a push to main touches a gate input (the changes job's port-readiness filter, and
  # its accepted gaps); the nightly judges every rule regardless. On a push they wait for the promote jobs, since they
  # read the answers from main's container; they run whether or not promotion succeeded, and a tool-pack whose answers
  # main's container lacks fails its leg.
  port-readiness:
    name: Port readiness
    needs: [changes, build, promote, promote-upload]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build.result == 'success' && needs.changes.outputs.port-readiness != 'false' }}
    # The report job posts pull request comments; the answers jobs log in to Azure with OIDC.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/port-readiness.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before }}
      # A pull request judges only the tool-packs of the packs it touches; a push to main judges every one.
      select: ${{ github.event_name == 'pull_request' }}

  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Unit tests
        run: npm test -- --shard=${{ matrix.shard }}/2

  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration:built

  # Rule packs installed from npm, against the registry: set-up on a project outside this repository, and
  # `rerail packs` upgrading, downgrading and removing a published pack (integration/installed-packs.test.ts).
  # NPM_PACKS_READ_TOKEN is a read-only granular token for the restricted @neralabs packs. Only the steps that check it
  # and read the packs get it; `npm ci` and the build run without it.
  installed-packs:
    name: Rule packs installed from npm
    needs: build
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          github.head_ref != 'changeset-release/main'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the npm read token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted rule packs needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The file names the variable, not the token: npm reads NODE_AUTH_TOKEN from the step that runs it.
      - name: Authenticate npm to read the packs
        run: printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - name: Rule packs from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
          RERAIL_INSTALLED_PACKS_NPM: "1"
        run: npx vitest run integration/installed-packs.test.ts

  tools:
    name: Scripts, reference examples, conformance, and rule playground
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Script tests and reference examples
        run: |
          npm run test:scripts
          npm run test:reference

      # Offline: conformance:languages:check scores every pack's ported rules against its recordings. The
      # identifier-rename gate (test/conformance/) runs with the unit tests.
      - name: Conformance harnesses
        run: npm run test:conformance

      # The rule playground is a development tool with its own lockfile; it type-checks against dist/.
      - name: Check, build, and test the rule playground
        run: |
          npm ci --prefix playground # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required
          npm --prefix playground run check
          npm --prefix playground run build
          npm --prefix playground test
          npm --prefix playground run test:ui
          npm --prefix playground run test:integration

  real-sessions:
    name: OMP and Pi real-session runtime paths
    needs: build
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          github.head_ref != 'changeset-release/main'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      RERAIL_SMOKE_OMP_MODEL: ${{ vars.RERAIL_SMOKE_OMP_MODEL }}
      RERAIL_SMOKE_PI_MODEL: ${{ vars.RERAIL_SMOKE_PI_MODEL }}
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL RERAIL_SMOKE_OMP_MODEL RERAIL_SMOKE_PI_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Real-session smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Exercise OMP and Pi real-session runtime paths
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          results="$RUNNER_TEMP/rerail-harness-smoke"
          mkdir -p "$results"
          # The proof is Rerail's steer path, not the model's reasoning: at OMP's default thinking level gpt-5 spends two
          # to three minutes of the 180 s budget on a one-file write, and the runs that go over it fail on every branch.
          node --import tsx scripts/host/host-lifecycle.ts omp -- \
            --provider azure --model "$RERAIL_SMOKE_OMP_MODEL" --thinking low > "$results/omp.log" 2>&1 &
          omp_pid=$!
          node --import tsx scripts/host/host-lifecycle.ts pi -- \
            --provider azure --model "$RERAIL_SMOKE_PI_MODEL" > "$results/pi.log" 2>&1 &
          pi_pid=$!
          status=0
          if ! wait "$omp_pid"; then status=1; fi
          if ! wait "$pi_pid"; then status=1; fi
          cat "$results/omp.log"
          cat "$results/pi.log"
          exit "$status"

  provider-smoke:
    name: Real Claude Code, Codex, and Cursor sessions
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          github.head_ref != 'changeset-release/main'
        )
      }}
    runs-on: macos-15
    # Three provider attempts of up to 3 minutes each, on top of a cold native build.
    timeout-minutes: 25
    env:
      # One Azure AI key serves both the Foundry Anthropic endpoint and the Azure OpenAI endpoint.
      ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      ANTHROPIC_FOUNDRY_BASE_URL: ${{ vars.ANTHROPIC_FOUNDRY_BASE_URL }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      RERAIL_CODEX_MODEL: ${{ vars.RERAIL_CODEX_MODEL }}
      RERAIL_CLAUDE_MODEL: ${{ vars.RERAIL_CLAUDE_MODEL }}
      # A session where the model never lands the violation (or the provider stalls) is inconclusive, not red.
      RERAIL_SMOKE_ATTEMPTS: "3"
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in ANTHROPIC_FOUNDRY_API_KEY ANTHROPIC_FOUNDRY_BASE_URL AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL CURSOR_API_KEY RERAIL_CODEX_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Provider smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # As in the build job: reuse main's release engine when its inputs are unchanged.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Install real provider CLIs
        run: |
          npm install --global --ignore-scripts @anthropic-ai/claude-code-darwin-arm64@2.1.266 @openai/codex@0.153.4
          curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
            https://downloads.cursor.com/lab/2026.09.08-6caf4ff/darwin/arm64/agent-cli-package.tar.gz \
            --output "$RUNNER_TEMP/cursor-agent.tar.gz"
          echo "9c456cc432adc476202a2b09c21a10944fdf484b3ca55dcbf939bbc8ce30dcbe  $RUNNER_TEMP/cursor-agent.tar.gz" \
            | shasum -a 256 --check
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/cursor-agent"
          ln -s "$(npm root --global)/@anthropic-ai/claude-code-darwin-arm64/claude" "$HOME/.local/bin/claude"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/cursor-agent.tar.gz" -C "$HOME/.local/share/cursor-agent"
          ln -s "$HOME/.local/share/cursor-agent/cursor-agent" "$HOME/.local/bin/agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build host assets
        run: |
          npm run build:ts
          npm run build:claude
          npm run build:codex
          npm run build:cursor

      - name: Exercise real Claude Code, Codex, and Cursor sessions
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/rerail-provider-smoke"
          mkdir -p "$results"
          node --import tsx scripts/host/host-smoke.ts --host claude-code > "$results/claude-code.log" 2>&1 &
          claude_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport node --import tsx scripts/host/host-smoke.ts --host codex > "$results/codex.log" 2>&1 &
          codex_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport node --import tsx scripts/host/host-smoke.ts --host cursor > "$results/cursor.log" 2>&1 &
          cursor_pid=$!
          status=0
          if ! wait "$claude_pid"; then status=1; fi
          if ! wait "$codex_pid"; then status=1; fi
          if ! wait "$cursor_pid"; then status=1; fi
          cat "$results/claude-code.log"
          cat "$results/codex.log"
          cat "$results/cursor.log"
          exit "$status"
