          timeout 115s npx vitest run --dir test test/conformance/data-layer/batch-ten-transfer.test.ts -t '^requires native evidence'
          contract_index=0
          for pattern in '^(?!.*(?:collector|structural)).*' 'structural' 'collector'; do
            timeout 115s npx vitest run --dir test test/conformance/data-layer/batch-ten-file-contracts.test.ts -t "$pattern" \
