name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # dependabot-automerge.yml dispatches CI on an approved Dependabot branch as the neralabs-ci app. Dependabot's own
  # pull_request run skips every job that needs a secret or the OIDC token; this run is not Dependabot's, so it runs
  # everything, like a push, and its CI result on the same commit is what arms auto-merge. Without a pull request it
  # has no base, so the conformance check runs without comparing its lists to the base.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Real-session jobs call hosted models with repository secrets, and the installed-packs job reads the restricted
# rule packs from npm with one. GitHub withholds secrets from fork and Dependabot pull requests, so those jobs run on
# pushes and same-repository pull requests only; there a missing secret or variable is a configuration error and
# fails the job. The jobs that read the packs' test data (the Rust tests, unit tests and the conformance check) are
# guarded the same way: the archives the tool-packs' test-data.lock files name reach the Actions cache from S3 under an
# OIDC token, which GitHub does not give those pull requests either. A test-data job holds that token and only fills
# the cache (.github/actions/pack-test-data, `fetch: "true"`); the jobs that read the data hold none, and restore,
# verify and extract what it saved (`fetch: "false"`). The data reaches CI only as the archives the locks name, each
# verified by its sha256 (CONTRIBUTING.md, "Pack test data"), and S3 must hold every archive the locks name
# (test-data-in-s3, so nothing merges that main cannot read).
#
# CI does not derive pack test data again, on purpose: the data is a point-in-time artifact. What a pull request
# publishes is checked by the code owner who approves its upload, reading the publish workflow's prep summary (what each
# archive adds, changes and drops) against the pull request's pin, generator and recipe changes, and by the conformance
# check on the new data (REVIEW.md, "Approving a pack data upload"). A reviewer re-derives it locally with
# `npm run fixtures:derive` and compares the result with the pull request's publish/ (docs/upstream.md, "Derive in a
# sandbox").
#
# GitHub reports a job skipped because a job it needs failed as skipped, and a skipped required check passes. So the
# one required check is ci-result ("CI result"), which needs every job and fails when any failed or was cancelled; a
# job skipped by its own condition (forks, Dependabot, the Release pull request, the path filters) does not fail it.
#
# On a pull request, the jobs that cost the most run only when it changes what they read: the Rust jobs, the
# conformance shards with the tools job's conformance steps and the comment, the dashboard browser tests, the
# integration tests with the rule packs from npm, and the real sessions (hosted models, paid per run). The changes job
# decides, from the pull request's whole diff against its base, so a pull request that ever touched an input runs the
# job on every later push; a push to main, and any other event, runs everything. A job may be skipped only when nothing
# it reads changed: each filter is derived from its jobs' imports and runtime reads, and
# scripts/check/check-ci-paths.mjs keeps the imports inside it (the changes job). The licence, lint, audit, test data,
# build and unit jobs, and the tools job's script tests and reference examples, run on every pull request: the unit
# tests read nearly the whole tree, docs included.
#
# The Release pull request (changeset-release/main, from release-pr.yml) changes only versions (the packs', and
# core's in package.json), changelogs and package-lock.json, and is rewritten on every push to main. It runs the
# licence and lint jobs only: release-packs.yml validates and packs every pack on it, main runs everything once it is
# merged, and release.yml builds and smokes core again on its tag.

jobs:
  licenses:
    name: Licences (REUSE and copyleft gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Every file carries licence information and every licence it names has its text in LICENSES/.
      - name: REUSE lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

      # Only allowlisted (permissive) licences in LICENSES/, and no copyleft production dependency.
      - name: Licence allowlist and copyleft gate
        run: node scripts/check/check-licenses.mjs

  # Type checks and generated-reference checks need neither Rust nor a build.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.57.0"

      - name: Check the Justfile
        run: just --fmt --check --unstable

      - uses: ./.github/actions/node-deps

      # Core's release notes, on a pull request: every entry pending in .changelog/ names its change type, each it adds
      # or changes stays at a sentence or two and names no ticket, pull request or commit, none is written into
      # CHANGELOG.md by hand, and on the Release pull request the dated section leads with a paragraph for the people
      # who upgrade (scripts/release/core-changelog-check.mjs). The base branch's tip is fetched alone, so the entries the pull
      # request adds can be told from the ones main has; the event's base.sha is the base as it was when the pull
      # request was last updated, which would count main's newer entries as the pull request's.
      - name: Fetch the base branch's tip
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --depth=1 origin "$BASE_REF"

      - name: Check core's release notes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/release/core-changelog-check.mjs "$BASE"

      # `npm run check` type-checks and runs the structure gate (docs/repository-structure.md); then the UI
      # token reference check and the policy DSL reference grammar check.
      - name: Type-check, structure gate, and generated references
        run: |
          npm run check
          npm run check:ui-tokens
          npm run check:reference

  # Known vulnerabilities in the dependencies the package ships: npm's advisories for the root package's production
  # dependencies (moderate and up; development dependencies are Dependabot alerts' to report, not a gate), and RustSec's
  # for the engine's crates (vulnerabilities; unmaintained and unsound advisories are the warnings cargo-audit allows).
  # Both read the lockfiles alone and install nothing from them: `npm audit` sends the lockfile's names and versions to
  # the registry, and cargo-audit is a prebuilt binary run directly, so rustup never installs the pinned toolchain here.
  # The fix is `npm audit fix --omit=dev` and `cargo update -p <crate>`; both tools print the advisory with the fix.
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: npm audit (root package, production dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit

      - name: cargo audit (engine crates)
        run: cargo-audit audit --file Cargo.lock

  # Which inputs a pull request changes, so it skips the jobs that read none of them (the note at the top). Each output
  # is a filter's answer on a pull request, and 'true' for every other event, for a pull request of 3000 files or more
  # (the API lists no more, so a file past them could go unseen), and when the filter step left it empty: whatever goes
  # wrong runs the jobs. A filter step that fails fails this job, which skips the jobs that need it and fails CI result.
  #
  # paths-filter lists the pull request's files against its base, the whole pull request, not the latest push: once a
  # pull request touched a job's input, the job runs on every push to it.
  #
  # The filters other than rust are derived from what their jobs read: each job's TypeScript import closure, the files
  # its suites and scripts read at runtime, the native engine. scripts/check/check-ci-paths.mjs (npm run check, so the
  # lint job) recomputes the closures from the jobs' entry points and fails when a file of one matches no glob of its
  # filter; it cannot see runtime reads, which its `reads` lists hold as far as they are known. Where in doubt a filter
  # takes the broader glob: too broad only costs runner minutes.
  #
  # The Rust jobs: the engine's tests also read conformance/, fixtures/, the packs' rules and the language registry
  # (languages/ and its generated TS module); package.json holds the cargo commands, .gitattributes the LFS objects the
  # engine embeds.
  changes:
    name: Detect changed inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'pull_request' && steps.filter.outputs.rust || 'true' }}
      conformance: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.conformance || 'true' }}
      e2e: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.e2e || 'true' }}
      integration: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.integration || 'true' }}
      sessions: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 && steps.filter.outputs.sessions || 'true' }}
    steps:
      # Pull requests only: paths-filter lists a pull request's files through the API, so no checkout is needed.
      # `common`, `engine` and `package` are only shared by the filters below (YAML anchors); nothing reads their outputs.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'native/**'
              - 'conformance/**'
              - 'fixtures/**'
              - 'packs/**'
              - 'languages/**'
              - 'src/engine/code-rule/code-rule-language-registry.generated.ts'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'scripts/profiling/reachability/**'
              - 'scripts/profiling/preparation/**'
              - 'scripts/profiling/composition.py'
              - 'test/scripts/test_sql_composition.py'
              - 'scripts/profiling/reachability_*.py'
              - 'scripts/profiling/native_*_*.py'
              - 'test/scripts/test_reachability.py'
              - 'test/scripts/test_native_relations.py'
              - 'test/scripts/test_native_sql_plan.py'
              - 'scripts/profiling/producer-shape.mjs'
              - 'scripts/profiling/sql-budget.mjs'
              - 'fixtures/host/data-layer-port/sql-budget-recording.json'
              - 'fixtures/host/data-layer-port/profiling/sql-execution-opportunities-20261024.json'
              - 'scripts/profiling/sql-report.mjs'
              - 'benchmark/sql-profile/**'
              - 'test/scripts/sql-execution-budget.test.mjs'
              - 'test/engine/native/relational-batch.test.ts'
              - 'test/engine/native/relational-completed.test.ts'
              - 'test/engine/native/candidate-admission.test.ts'
              - 'test/engine/native/candidate-publication.test.ts'
              - 'test/engine/native/compiler-schema.test.ts'
              - 'test/engine/native/shared-producers.test.ts'
              - 'test/engine/native/frontier-determinism.test.ts'
              - 'test/engine/native/recovery/child-demand.test.ts'
              - 'test/engine/native/recovery/relational-storage.test.ts'
              - 'test/engine/native/recovery/input-admission.test.ts'
              - 'test/engine/native/recovery/eponymous-sources.test.ts'
              - 'test/engine/native/recovery/state-syntax-domain.test.ts'
              - 'test/engine/native/recovery/selector-materialization.test.ts'
              - 'scripts/profiling/frontier-audit.mjs'
              - 'scripts/profiling/post_c_spikes/**'
              - 'test/scripts/test_post_c_spikes.py'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - '.github/actions/lfs/**'
              - '.github/actions/pack-test-data/**'
              - 'scripts/s3/**'
              - 'scripts/samples/**'
            # What every job installs, builds or runs with: this workflow and its actions, the dependencies, the Rust
            # toolchain and the engine's crates, the LFS attributes.
            common: &common
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.gitattributes'
            # The native engine the build job makes: its crate, and the language registry its build.rs reads.
            engine: &engine
              - 'native/**'
              - 'languages/**'
            # The package the build job makes and the daemon runs from source: every source file (tsc compiles all of
            # src/), the page, the bundled model, the hosts' hooks, skills and plugin manifests, the build scripts.
            package: &package
              - *engine
              - 'src/**'
              - 'ui/**'
              - 'model/**'
              - 'hooks/**'
              - 'skills/**'
              - 'plugins/**'
              - '.claude-plugin/**'
              - '.codex-plugin/**'
              - '.cursor-plugin/**'
              - 'scripts/build/**'
              - 'tsconfig.json'
              - 'tsconfig.build.json'
            # The conformance shards, the tools job's conformance steps and the comment: the runner's import closure
            # (conformance/, the engine's TypeScript side, the test data and samples readers, the release scripts'
            # private-pack predicate), the packs with their rules, gates and the locks naming their test data, and the
            # native engine. tsx reads tsconfig.json.
            conformance:
              - *common
              - *engine
              - 'conformance/**'
              - 'packs/**'
              - 'src/engine/**'
              - 'scripts/s3/**'
              - 'scripts/samples/**'
              - 'scripts/release/packs.mjs'
              - 'scripts/release/dist-tags.mjs'
              - 'scripts/release/release-notes.mjs'
              - 'scripts/check/check-internal-refs.mjs'
              - 'tsconfig.json'
            # The dashboard browser tests: the specs and their scenario seeding, the daemon from source, and the packs
            # the scenarios install from this checkout (INSTALLED_PACKS in e2e/support/scenarios.ts).
            e2e:
              - *common
              - *package
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'packs/complexity/**'
              - 'packs/javascript/**'
              - 'packs/next/**'
              - 'packs/python/**'
              - 'packs/typescript/**'
            # The integration tests and the rule packs from npm: the suites, the test support they import, the vitest
            # config, the OMP host they provision, the built package. The packs come from the registry, not packs/.
            integration:
              - *common
              - *package
              - 'integration/**'
              - 'test/support/**'
              - 'vitest.config.ts'
              - 'scripts/host/**'
            # The real-session runs: the host scripts and the built package, loaded by each host as its plugin. They set
            # repositories up with library rules only, so no pack.
            sessions:
              - *common
              - *package
              - 'scripts/host/**'

  # Fills the Actions cache with every key the jobs below restore (.github/actions/pack-test-data, `fetch: "true"`): every
  # tool-pack's archives for the unit and conformance jobs, and the three tool-packs the Rust tests read, each its own
  # key. It holds the OIDC token, which only a miss uses, runs nothing but the pull (scripts/s3/pack-fixtures.mjs, this
  # commit's code), and never extracts a cache entry; the jobs that read the data restore it holding no token. The
  # Release pull request reads none.
  test-data:
    name: Pack test data
    if: >-
      ${{
        github.head_ref != 'changeset-release/main' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token: the archives from S3 on a cache miss, with credentials only the action's pull step holds.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Every tool-pack first: on a miss the single tool-packs below then read the archives it downloaded, not S3.
      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "true"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: python
          tool: ruff
          fetch: "true"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: sql
          tool: sqlfluff
          fetch: "true"

      - uses: ./.github/actions/pack-test-data
        with:
          pack: vue
          tool: eslint-plugin-vue
          fetch: "true"

  # S3 holds every archive each test-data.lock names and every samples archive each samples.lock names
  # (scripts/s3/pack-fixtures.mjs `check`, head-object only, downloading nothing). A pull request that changes a lock
  # fails here until the publish workflow (pack-data-publish.yml) has put what it names, so it cannot merge with data
  # that only its own cache scope holds: main's runs read S3. Nothing needs this job, so the others still report.
  # It runs this commit's script alone, under the read role, where the test-data job does.
  test-data-in-s3:
    name: Pack test data is in S3
    if: >-
      ${{
        github.head_ref != 'changeset-release/main' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token: the read role, whose credentials only the check step holds.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The script needs no npm packages.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # As in .github/actions/pack-test-data: the credentials are this step's outputs, not exported.
      - id: credentials
        name: Assume the test data read role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::696860996542:role/github-actions-test-fixtures-read
          aws-region: us-east-2
          output-credentials: true
          output-env-credentials: false

      - name: Check S3 holds every locked archive
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.credentials.outputs.aws-session-token }}
          AWS_REGION: us-east-2
        run: node scripts/s3/pack-fixtures.mjs check

  # rustfmt and clippy, and the engine's own tests, side by side; nothing downstream waits for them.
  # Each keeps its own cache: clippy's check metadata and the test binaries share no artifacts. The tests read three
  # tool-packs' test data (native/src/code_rule_dsl/test_support.rs's callers), restored from what the test-data job
  # saved, so the job runs where that job does (the note at the top). The tests run in two legs of about equal time on
  # a runner: the workspace's (much of it waiting out the store's busy timeouts) and the anchor index's, then every other,
  # the second skipping exactly what the first runs.
  rust:
    name: Rust engine (${{ matrix.name }})
    needs: [changes, test-data]
    if: >-
      ${{
        needs.changes.outputs.rust != 'false' && github.head_ref != 'changeset-release/main' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: clippy
            name: fmt, clippy
            run: npm run check:native
          - task: test
            name: tests, workspace and anchors
            run: "npm run test:native -- -- code_rule_dsl::workspace:: code_rule_dsl::matcher::anchors::"
          - task: test
            name: tests, the rest
            run: "npm run test:native -- -- --skip code_rule_dsl::workspace:: --skip code_rule_dsl::matcher::anchors::"
    # Line tables keep file:line in panics at a fraction of full debuginfo; incremental state only
    # bloats the cache, since dependencies never build incrementally.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # The clippy leg only compiles the tests; the tests leg runs them, and three read pack test data: Ruff's fixtures,
      # SQLFluff's expected findings and fixtures, and eslint-plugin-vue's fixtures.
      - if: matrix.task == 'test'
        uses: ./.github/actions/pack-test-data
        with:
          pack: python
          tool: ruff
          fetch: "false"

      - if: matrix.task == 'test'
        uses: ./.github/actions/pack-test-data
        with:
          pack: sql
          tool: sqlfluff
          fetch: "false"

      - if: matrix.task == 'test'
        uses: ./.github/actions/pack-test-data
        with:
          pack: vue
          tool: eslint-plugin-vue
          fetch: "false"

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-${{ matrix.task }}-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

      - name: Check isolated reachability spike
        if: matrix.task == 'clippy'
        run: |
          cargo fmt --manifest-path scripts/profiling/reachability/Cargo.toml -- --check
          cargo clippy --manifest-path scripts/profiling/reachability/Cargo.toml --locked --target-dir target/reachability-spike -- -D warnings

      - name: Build isolated reachability extension
        if: matrix.task == 'test'
        run: cargo build --manifest-path scripts/profiling/reachability/Cargo.toml --release --locked --target-dir target/reachability-spike

      - name: Test SQL and Rust reachability adapters
        if: matrix.task == 'test'
        env:
          RERAIL_REACH_EXTENSION: ${{ github.workspace }}/target/reachability-spike/release/librerail_reachability_spike.so
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 test/scripts/test_reachability.py
          python3 test/scripts/test_native_relations.py
          python3 test/scripts/test_native_sql_plan.py

      # The shape gate requires profiling spans and must never silently skip on a production addon.
      # Keep this debug addon separate from the package's release artifact.
      - uses: ./.github/actions/node-deps
        if: matrix.task == 'test'

      - name: Build profiling addon for the producer shape gate
        if: matrix.task == 'test'
        run: |
          cargo build --manifest-path native/Cargo.toml --features code-rule-profile
          cp target/debug/librerail_engine.so "$RUNNER_TEMP/rerail-producer-shape.node"

      - name: Enforce broad producer execution shape
        if: matrix.task == 'test'
        env:
          RERAIL_ENGINE_PATH: ${{ runner.temp }}/rerail-producer-shape.node
        run: npm run test:producer-shape

      - name: Enforce 100 engine SQL submissions for the complete cold job
        if: matrix.task == 'test'
        env:
          RERAIL_ENGINE_PATH: ${{ runner.temp }}/rerail-producer-shape.node
        run: npm run test:sql-execution-budget -- "$RUNNER_TEMP/rerail-sql-budget"

      - name: Preserve SQL execution budget evidence
        if: always() && matrix.task == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: sql-execution-budget
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/rerail-sql-budget/provenance.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-a-budget.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-b-budget.json
            ${{ runner.temp }}/rerail-sql-budget/chunk-c-budget.json
            ${{ runner.temp }}/rerail-sql-budget/capture/profile.json
            ${{ runner.temp }}/rerail-sql-budget/capture/parity.json
            ${{ runner.temp }}/rerail-sql-budget/capture/summary.txt
            ${{ runner.temp }}/rerail-sql-budget/capture/sql/summary.md
            ${{ runner.temp }}/rerail-sql-budget/capture/sql/execution-budget.json

      - name: Test SQL statement capture and deferred explanations
        if: matrix.task == 'test'
        run: cargo test --manifest-path scripts/profiling/reachability/Cargo.toml --no-default-features --locked code_rule_dsl::tests

      - name: Check and test captured SQL replay and composition kernels
        if: matrix.task == 'test'
        run: |
          cargo fmt --manifest-path scripts/profiling/preparation/Cargo.toml -- --check
          cargo clippy --manifest-path scripts/profiling/preparation/Cargo.toml --locked --all-targets --target-dir target/sql-preparation-lab -- -D warnings
          cargo test --manifest-path scripts/profiling/preparation/Cargo.toml --locked --target-dir target/sql-preparation-lab

  # Builds the package once: dist/ and the release native engine, handed to every test job.
  build:
    name: Build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release engine depends only on the engine's sources, the language registry (build.rs generates
      # its tables from languages/), the lockfile, the workspace profile, the toolchain and the napi CLI.
      # Most pull requests change none of them and reuse main's build.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  # Both shards read every pack's test data (packs.test.ts, complexity-rules.test.ts and the native tests share them),
  # restored from what the test-data job saved.
  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: [build, test-data]
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The pack validation's check 4 leaves scoring the fixtures to the conformance check (the conformance and tools jobs
      # below), which scores the same fixtures through the same runner and fails on the same failures, so they are scored
      # once (test/engine/catalog/packs.test.ts). The pack publish gate (release-packs.yml) still scores them itself.
      - name: Unit tests
        env:
          RERAIL_PACK_FIXTURES_IN_CONFORMANCE: "1"
        run: npm test -- --shard=${{ matrix.shard }}/2

  # The dashboard in Chromium over seeded scenario databases (e2e/README.md). Each worker runs the daemon from source
  # (`--dev` serves ui/ as committed), which needs the build's native engine. Runs when the e2e filter matches.
  ui-e2e:
    name: Dashboard browser tests
    needs: [build, changes]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Dashboard browser tests
        run: npm run test:ui:e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-report
          path: .rerail/e2e/
          retention-days: 7

  # Runs when the integration filter matches.
  integration:
    name: Integration tests
    needs: [build, changes]
    if: needs.changes.outputs.integration != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration:built

  # Rule packs installed from npm, against the registry: set-up on a project outside this repository, and
  # `rerail packs` upgrading, downgrading and removing a published pack (integration/installed-packs.test.ts).
  # NPM_PACKS_READ_TOKEN is a read-only granular token for the restricted @neralabs packs. Only the steps that check it
  # and read the packs get it; `npm ci` and the build run without it. Runs when the integration filter matches.
  installed-packs:
    name: Rule packs installed from npm
    needs: [build, changes]
    if: >-
      ${{
        needs.changes.outputs.integration != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            github.head_ref != 'changeset-release/main'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the npm read token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted rule packs needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The file names the variable, not the token: npm reads NODE_AUTH_TOKEN from the step that runs it.
      - name: Authenticate npm to read the packs
        run: |
          # shellcheck disable=SC2016 # npm expands ${NODE_AUTH_TOKEN} itself; the file must not hold the token.
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - name: Rule packs from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
          RERAIL_INSTALLED_PACKS_NPM: "1"
        run: npx vitest run integration/installed-packs.test.ts

  # The conformance check scores every pack's ported rules on its test data and samples, restored from what the test-data
  # job saved, and judges every rule of each gated tool-pack (conformance/languages/gates.ts); the conformance-report job
  # posts its summary on the pull request. The scoring is spread over the shards of this job, each a share of every
  # pack's evaluations on a runner of its own (conformance/languages/shards.ts); the tools job makes the reports from
  # all their results, as one run evaluating everything would, and judges them. The shards, the tools job's conformance
  # steps and the comment run when the conformance filter matches.
  conformance:
    name: Conformance (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build, test-data, changes]
    if: >-
      ${{
        needs.changes.outputs.conformance != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Eight shards of three workers each (the runner's 16 GB hold three; conformance/languages/shards.ts): the scoring
    # takes one to two and a half minutes on each, by the runner's CPU. The matrix alone says how many there are.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Score shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: npm run conformance:languages:check -- --shard "$SHARD/$SHARDS" --results-out "$RUNNER_TEMP/conformance-results"

      - name: Upload the shard's results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/conformance-results/
          if-no-files-found: error
          retention-days: 1

  # Runs when a shard failed too, so the conformance check fails on the missing results and the comment says the run
  # produced no summary. The script tests and reference examples run on every pull request; the conformance steps when
  # the conformance filter matches, so a pull request that skips the shards skips them too, and passes here.
  tools:
    name: Scripts, reference examples, and conformance
    needs: [build, test-data, changes, conformance]
    if: >-
      ${{
        !cancelled() && needs.build.result == 'success' && needs.test-data.result == 'success' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Script tests and reference examples
        run: |
          npm run test:scripts
          npm run test:profiling
          npm run test:reference

      # The not-gated and pending lists may only shrink against the base: the pull request's base, or the push's previous
      # head. The checkout keeps no credentials, so the base commit is fetched with the token; when it cannot be, the
      # check fails closed.
      - name: Fetch the base commit
        if: needs.changes.outputs.conformance != 'false' && (github.event.pull_request.base.sha || github.event.before) != '' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$BASE" || true

      - name: Download the shards' results
        if: needs.changes.outputs.conformance != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/conformance-results

      # Offline: every pack's report from the shards' results, then every rule of each gated tool-pack through loads,
      # compact and the conformance checks, spread over worker processes. A shipped rule that fails, fails the job;
      # candidates are only reported. The fixtures scored here are the pack validation's check 4 too, which the unit tests
      # leave to this job. The summary and the pull request comment go to the conformance-summary artifact.
      - name: Conformance
        if: needs.changes.outputs.conformance != 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CONFORMANCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CONFORMANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A push that creates a branch has no previous head.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=""; fi
          npm run conformance:languages:check -- --results "$RUNNER_TEMP/conformance-results" ${BASE:+--base "$BASE"} --out "$RUNNER_TEMP/conformance"

      - name: Upload the conformance summary
        if: always() && needs.changes.outputs.conformance != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-summary
          path: ${{ runner.temp }}/conformance/
          if-no-files-found: warn
          retention-days: 14

  # The one sticky pull request comment of the conformance check: the comment that starts with the marker is edited in
  # place, or posted when there is none. It runs nothing from the checkout. Fork pull requests get a read-only token and
  # no tools run, so they get no comment. A pull request the conformance filter skips gets none either, rather than one
  # saying the run produced no summary; a comment an earlier run posted stays as it was, naming the commit it judged.
  conformance-report:
    name: Conformance comment
    needs: [changes, tools]
    if: >-
      ${{
        always() && needs.changes.outputs.conformance != 'false' &&
        needs.tools.result != 'skipped' && needs.tools.result != 'cancelled' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download the conformance summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-summary
          path: ${{ runner.temp }}/conformance

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- rerail-conformance -->'
          body="$RUNNER_TEMP/conformance/comment.md"
          if [ ! -s "$body" ]; then
            mkdir -p "$RUNNER_TEMP/conformance"
            printf '%s\n## Conformance: the run produced no summary\n\nSee the [workflow run](%s).\n' "$marker" "$RUN_URL" > "$body"
          fi
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .id] | first // empty" | sed -n '1p')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi

  # Real sessions call hosted models, which costs money on every run: they and provider-smoke run when the sessions
  # filter matches.
  real-sessions:
    name: OMP and Pi real-session runtime paths
    needs: [build, changes]
    if: >-
      ${{
        needs.changes.outputs.sessions != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            github.head_ref != 'changeset-release/main'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      RERAIL_SMOKE_OMP_MODEL: ${{ vars.RERAIL_SMOKE_OMP_MODEL }}
      RERAIL_SMOKE_PI_MODEL: ${{ vars.RERAIL_SMOKE_PI_MODEL }}
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL RERAIL_SMOKE_OMP_MODEL RERAIL_SMOKE_PI_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Real-session smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - name: Provision pinned standalone OMP host
        run: |
          host="$(node scripts/host/install-omp-host.mjs)"
          printf 'RERAIL_OMP_EXECUTABLE=%s\n' "$host" >> "$GITHUB_ENV"

      - name: Exercise OMP and Pi real-session runtime paths
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          results="$RUNNER_TEMP/rerail-harness-smoke"
          mkdir -p "$results"
          # The proof is Rerail's steer path, not the model's reasoning: at OMP's default thinking level gpt-5 spends two
          # to three minutes of the 180 s budget on a one-file write, and the runs that go over it fail on every branch.
          node --import tsx scripts/host/host-lifecycle.ts omp -- \
            --provider azure --model "$RERAIL_SMOKE_OMP_MODEL" --thinking low > "$results/omp.log" 2>&1 &
          omp_pid=$!
          node --import tsx scripts/host/host-lifecycle.ts pi -- \
            --provider azure --model "$RERAIL_SMOKE_PI_MODEL" > "$results/pi.log" 2>&1 &
          pi_pid=$!
          status=0
          if ! wait "$omp_pid"; then status=1; fi
          if ! wait "$pi_pid"; then status=1; fi
          cat "$results/omp.log"
          cat "$results/pi.log"
          exit "$status"

  provider-smoke:
    name: Real Claude Code, Codex, and Cursor sessions
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.sessions != 'false' &&
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            github.head_ref != 'changeset-release/main'
          )
        )
      }}
    runs-on: macos-15
    # Three provider attempts of up to 3 minutes each, on top of a cold native build.
    timeout-minutes: 25
    env:
      # One Azure AI key serves both the Foundry Anthropic endpoint and the Azure OpenAI endpoint.
      ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      ANTHROPIC_FOUNDRY_BASE_URL: ${{ vars.ANTHROPIC_FOUNDRY_BASE_URL }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      RERAIL_CODEX_MODEL: ${{ vars.RERAIL_CODEX_MODEL }}
      RERAIL_CLAUDE_MODEL: ${{ vars.RERAIL_CLAUDE_MODEL }}
      # A session where the model never lands the violation (or the provider stalls) is inconclusive, not red.
      RERAIL_SMOKE_ATTEMPTS: "3"
    steps:
      - name: Require provider credentials and endpoints
        run: |
          set -euo pipefail
          missing=()
          for name in ANTHROPIC_FOUNDRY_API_KEY ANTHROPIC_FOUNDRY_BASE_URL AZURE_OPENAI_API_KEY AZURE_OPENAI_BASE_URL CURSOR_API_KEY RERAIL_CODEX_MODEL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Provider smoke needs repository secret/variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # As in the build job: reuse main's release engine when its inputs are unchanged.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Install real provider CLIs
        run: |
          npm install --global --ignore-scripts @anthropic-ai/claude-code-darwin-arm64@2.1.266 @openai/codex@0.153.4
          curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error \
            https://downloads.cursor.com/lab/2026.09.08-6caf4ff/darwin/arm64/agent-cli-package.tar.gz \
            --output "$RUNNER_TEMP/cursor-agent.tar.gz"
          echo "9c456cc432adc476202a2b09c21a10944fdf484b3ca55dcbf939bbc8ce30dcbe  $RUNNER_TEMP/cursor-agent.tar.gz" \
            | shasum -a 256 --check
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/cursor-agent"
          ln -s "$(npm root --global)/@anthropic-ai/claude-code-darwin-arm64/claude" "$HOME/.local/bin/claude"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/cursor-agent.tar.gz" -C "$HOME/.local/share/cursor-agent"
          ln -s "$HOME/.local/share/cursor-agent/cursor-agent" "$HOME/.local/bin/agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build host assets
        run: |
          npm run build:ts
          npm run build:claude
          npm run build:codex
          npm run build:cursor

      - name: Exercise real Claude Code, Codex, and Cursor sessions
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/rerail-provider-smoke"
          mkdir -p "$results"
          node --import tsx scripts/host/host-smoke.ts --host claude-code > "$results/claude-code.log" 2>&1 &
          claude_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport node --import tsx scripts/host/host-smoke.ts --host codex > "$results/codex.log" 2>&1 &
          codex_pid=$!
          RERAIL_SMOKE_ACCEPTANCE=transport node --import tsx scripts/host/host-smoke.ts --host cursor > "$results/cursor.log" 2>&1 &
          cursor_pid=$!
          status=0
          if ! wait "$claude_pid"; then status=1; fi
          if ! wait "$codex_pid"; then status=1; fi
          if ! wait "$cursor_pid"; then status=1; fi
          cat "$results/claude-code.log"
          cat "$results/codex.log"
          cat "$results/cursor.log"
          exit "$status"

  # The one required check (the note at the top). It needs every other job, runs whatever happened to them, and fails
  # when any of them failed or was cancelled. A job skipped by its own condition passes: forks and Dependabot get no
  # secrets or OIDC token, the Release pull request runs only the licence and lint jobs, and the path filters (the
  # changes job) skip what a pull request's files cannot affect. scripts/check/check-ci-paths.mjs fails when a job is
  # missing here.
  ci-result:
    name: CI result
    needs:
      - licenses
      - lint
      - audit
      - changes
      - test-data
      - test-data-in-s3
      - rust
      - build
      - unit
      - ui-e2e
      - integration
      - installed-packs
      - conformance
      - tools
      - conformance-report
      - real-sessions
      - provider-smoke
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries | sort_by(.key) | .[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | sort | join(", ")' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::failed or cancelled: $failed"
            exit 1
          fi
