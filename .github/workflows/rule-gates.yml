name: Rule gates

# The rule gates (docs/rule-gates.md): every rule a pack ships must pass them; candidates run through them and are
# only reported. Called by ci.yml after its build job (the gates read the `built` artifact's engine), and by
# rule-gates-nightly.yml with the result cache off. The gates read each pack's recordings
# (packs/<id>/upstream/<tool>/gates*.json), so no upstream linter runs here; only the pinned real-code corpora and
# upstream's pinned test files are fetched, and they are cached by their pins.

on:
  workflow_call:
    inputs:
      base:
        description: The commit the change is judged against (the pull request's base, or the push's previous head); the not-gated list may only shrink against it.
        type: string
        default: ""
      no-cache:
        description: Judge every rule again instead of reusing the results of unchanged rules.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates:
    name: Rule gates (${{ matrix.pack }} · ${{ matrix.tool }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One leg per gated tool-pack: a pack's upstream tool with packs/<pack>/upstream/<tool>/gates.yaml.
        include:
          - pack: python
            tool: ruff
          - pack: python
            tool: bandit
          - pack: next
            tool: eslint-plugin-next
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The real-code corpus and upstream's pinned test files are keyed by their pins; a partial match is reused, since
      # every checkout in them is keyed by commit.
      - name: Restore the real-code corpus and upstream's test files
        uses: actions/cache/restore@v6
        with:
          path: |
            .rerail/gates/corpus
            .rerail/gates/upstream
          key: rule-gates-corpus-${{ matrix.pack }}-${{ hashFiles('conformance/gates/corpus-tasks.json', format('packs/{0}/conformance.json', matrix.pack), format('packs/{0}/upstream/*/gates.yaml', matrix.pack)) }}
          restore-keys: |
            rule-gates-corpus-${{ matrix.pack }}-

      # Each result is keyed by everything the rule's verdict depends on, so a stale entry is never read.
      - name: Restore earlier rule results
        if: ${{ !inputs.no-cache }}
        uses: actions/cache/restore@v6
        with:
          path: .rerail/gates/results
          key: rule-gates-results-${{ matrix.pack }}-${{ matrix.tool }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rule-gates-results-${{ matrix.pack }}-${{ matrix.tool }}-

      - id: gates
        name: Run the gates
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          NO_CACHE: ${{ inputs.no-cache && '--no-cache' || '' }}
        run: |
          set +e
          npm run gates -- --pack "$PACK" --tool "$TOOL" --out "$RUNNER_TEMP/gates" $NO_CACHE
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Save the corpus and upstream's test files
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .rerail/gates/corpus
            .rerail/gates/upstream
          key: rule-gates-corpus-${{ matrix.pack }}-${{ hashFiles('conformance/gates/corpus-tasks.json', format('packs/{0}/conformance.json', matrix.pack), format('packs/{0}/upstream/*/gates.yaml', matrix.pack)) }}
        continue-on-error: true

      - name: Save the rule results
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .rerail/gates/results
          key: rule-gates-results-${{ matrix.pack }}-${{ matrix.tool }}-${{ github.run_id }}-${{ github.run_attempt }}
        continue-on-error: true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rule-gates-${{ matrix.pack }}-${{ matrix.tool }}
          path: ${{ runner.temp }}/gates/
          if-no-files-found: warn
          retention-days: 14

      # 1: a shipped rule failed a gate (the report job says which and why). 2: the run itself failed.
      - name: Fail when a shipped rule failed
        if: steps.gates.outputs.status != '0'
        env:
          STATUS: ${{ steps.gates.outputs.status }}
        run: exit "$STATUS"

  report:
    name: Rule gates report
    needs: gates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writing pull request comments: the results comment below. The callers grant the same.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - name: Download the reports
        uses: actions/download-artifact@v8
        with:
          pattern: rule-gates-*
          path: ${{ runner.temp }}/gates
          merge-multiple: true

      # The not-gated list may only shrink against the base. The checkout keeps no credentials, so the base commit is
      # fetched here with the token, as the lfs action fetches; if it is still missing the summary fails closed.
      - name: Fetch the base commit
        if: inputs.base != '' && inputs.base != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ inputs.base }}
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$BASE" || true

      - id: summary
        name: Summarize, and check the packs without an upstream adapter
        env:
          BASE: ${{ inputs.base }}
          RULE_GATES_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RULE_GATES_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          # A push that creates a branch has no previous head.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=""; fi
          npm run gates -- summary "$RUNNER_TEMP/gates" ${BASE:+--base "$BASE"}
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # One results comment per run: the earlier ones are minimized as outdated (collapsed, still there to compare), and
      # the new one goes last. Fork pull requests get a read-only token, so they read the job summary instead.
      - name: Post the results on the pull request
        if: >-
          ${{
            always() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- rerail-rule-gates -->'
          body="$RUNNER_TEMP/gates/comment.md"
          if [ ! -s "$body" ]; then
            printf '%s\n## Rule gates: the run produced no summary\n\nSee the [workflow run](%s).\n' "$marker" "$RUN_URL" > "$body"
          fi
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | startswith(\"$marker\")) | .node_id" |
            while read -r id; do
              gh api graphql -f id="$id" \
                -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
                > /dev/null || echo "::warning::could not collapse the earlier rule gates comment $id"
            done
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rule-gates-summary
          path: |
            ${{ runner.temp }}/gates/summary.md
            ${{ runner.temp }}/gates/summary.json
            ${{ runner.temp }}/gates/comment.md
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when anything blocking failed
        if: steps.summary.outputs.status != '0' || needs.gates.result != 'success'
        env:
          STATUS: ${{ steps.summary.outputs.status }}
          GATES: ${{ needs.gates.result }}
        run: |
          echo "::error::Rule gates failed (summary exit ${STATUS}, gate jobs ${GATES}). The job summary lists each rule, the gate it stopped at and why."
          exit 1
