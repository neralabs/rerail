name: Pack data publish request

# Keeps one sticky comment on a pull request that has pack data to publish: it tracks a
# packs/<pack>/upstream/<tool>/publish/ directory, or it removes authored rows (rows naming files under
# upstream/<tool>/, the rows pack-fixtures.mjs's listedAuthored reads) from a tool's UPSTREAM.md, which an overlay
# publish of that tool-pack turns into the file's removal from the archive. The comment is the "waiting" state
# (scripts/s3/pack-data-publish.mjs comment waiting), with how to run the publish workflow (pack-data-publish.yml) by
# hand and with the gh CLI, and which `replace` value the counts recommend. The publish workflow writes the comment's
# other states (published, action needed, failed) over the same marker; this workflow deletes only a comment still in
# the waiting state, once the pull request has nothing left to publish.
#
# pull_request_target, so it also runs for forks, with the base branch's workflow: it checks out the base branch's code
# alone (never the pull request's), runs nothing of the pull request, and holds only a GITHUB_TOKEN that can write pull
# request comments. A fork's pull request is a proposal, published only once a maintainer ports it, so its comment lists
# the data without the publish steps. File names and patches are untrusted: only the validated pack/tool directories,
# their counts and the `files` counts of their locks (read through the API as data) are rendered, never a name, and
# nothing reaches a shell but through env. Structure metric #3, not this comment, is what blocks the merge.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: pack-data-publish-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Publish request comment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # GET environments/test-data-upload needs Actions read
      contents: read # the checkout of the base branch
      pull-requests: write
    steps:
      # The base branch's code (on pull_request_target, github.sha is its head), for the comment script. Nothing of
      # the pull request is fetched.
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pack-data-publish.mjs needs Node 22.15 or newer (zlib's zstd, through pack-fixtures.mjs) and no npm packages.
      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The pull request files endpoint lists at most 3,000 files; past that, absence cannot be proved. It omits
          # the patch of a very large diff, whose removed rows then go unseen.
          files_cap=3000
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the pull request's head is no commit"
            exit 1
          fi
          # TOOL_ID in scripts/s3/pack-fixtures.mjs: a pack or tool directory name.
          id_class='[a-z0-9][a-z0-9._-]*'
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
            --jq '.[] | {filename, status, patch} | @json' > "$RUNNER_TEMP/files.jsonl"
          # One object per tool-pack with anything to publish (requestedToolPacks in scripts/s3/pack-data-publish.mjs):
          # its files in publish/ (how many are test data, how many samples, whether provenance.json is one of them)
          # and its authored rows removed. Counts and flags alone, never a file name.
          # shellcheck disable=SC2016 # literal backticks: a jq regex, not a shell expansion
          toolpacks="$(jq -cs --arg id "$id_class" '
            def authored($sign; $tool):
              [(.patch // "") | split("\n")[] | select(startswith($sign)) | .[1:]
                | capture("^\\|\\s*`(?<file>[^`]+)`").file | select(startswith("upstream/\($tool)/"))] | unique;
            ([.[] | select(.status != "removed")
                | .filename | capture("^packs/(?<pack>" + $id + ")/upstream/(?<tool>" + $id + ")/publish/(?<path>.+)$")
                | (.path | startswith("samples/")) as $sample
                | {pack, tool, files: 1, testData: (if $sample then 0 else 1 end), samples: (if $sample and .path != "samples/REUSE.toml" then 1 else 0 end), provenance: (.path == "provenance.json"), lost: 0}]) as $publish
            | ([.[] | . as $file
                | .filename | capture("^packs/(?<pack>" + $id + ")/upstream/(?<tool>" + $id + ")/UPSTREAM\\.md$")
                | . as $record
                | ($file | (authored("-"; $record.tool) - authored("+"; $record.tool)) | length) as $lost
                | select($lost > 0) | {pack: $record.pack, tool: $record.tool, files: 0, testData: 0, samples: 0, provenance: false, lost: $lost}]) as $removed
            | [$publish + $removed | group_by(.pack + "/" + .tool)[]
                | {pack: .[0].pack, tool: .[0].tool, files: (map(.files) | add), testData: (map(.testData) | add), samples: (map(.samples) | add), provenance: (map(.provenance) | any), lost: (map(.lost) | add)}]
          ' "$RUNNER_TEMP/files.jsonl")"
          # A lock's `files` count at the pull request's head, read through the API as data (the ids in the path were
          # validated by the capture above); null without a lock there, or with one that is not a lock.
          lock_files() {
            local count
            count="$(gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=$HEAD_SHA" --jq .content 2> /dev/null | base64 -d 2> /dev/null \
              | jq 'if type == "object" and (.files | type) == "number" and .files == (.files | floor) and .files >= 0 then .files else null end' 2> /dev/null)" || count=null
            echo "${count:-null}"
          }
          if [ "$toolpacks" != "[]" ]; then
            toolpacks="$(jq -c '.[]' <<< "$toolpacks" | while read -r toolpack; do
              pack="$(jq -r .pack <<< "$toolpack")"
              tool="$(jq -r .tool <<< "$toolpack")"
              test_data=null
              samples=null
              if [ "$(jq -r .testData <<< "$toolpack")" -gt 0 ]; then test_data="$(lock_files "packs/$pack/upstream/$tool/test-data.lock")"; fi
              if [ "$(jq -r .samples <<< "$toolpack")" -gt 0 ]; then samples="$(lock_files "packs/$pack/upstream/$tool/samples.lock")"; fi
              jq -c --argjson testData "$test_data" --argjson samples "$samples" '. + {locked: {testData: $testData, samples: $samples}}' <<< "$toolpack"
            done | jq -cs .)"
          fi
          comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- rerail-pack-data-publish"))) | {id, waiting: (.body | startswith("<!-- rerail-pack-data-publish state=waiting"))} | @json] | first // empty' | sed -n '1p')"
          id="$(jq -r '.id // empty' <<< "${comment:-null}")"
          waiting="$(jq -r '.waiting // false' <<< "${comment:-null}")"

          if [ "$toolpacks" = "[]" ] && [ "$CHANGED" -le "$files_cap" ]; then
            if [ -n "$id" ] && [ "$waiting" = "true" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" > /dev/null
            fi
            exit 0
          fi

          fork=false
          bump=false
          environment=""
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            # A fork's pull request is a proposal (CONTRIBUTING.md, "Proposing a change from your fork"): its data is
            # published from the pull request that ports it to a branch here, never from the fork.
            fork=true
          else
            # An upstream bump or re-snapshot pull request (upstream-bump-publish.yml, from this repository's
            # auto/bump-upstream or auto/resnapshot-upstream) stages each tool-pack's whole derived set: it publishes
            # with replace.
            if [ "$HEAD_REF" = "auto/bump-upstream" ] || [ "$HEAD_REF" = "auto/resnapshot-upstream" ]; then bump=true; fi
            environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/test-data-upload" --jq .id)"
          fi
          body="$(REPOSITORY="$GITHUB_REPOSITORY" TOOL_PACKS="$toolpacks" FORK="$fork" BUMP="$bump" ENVIRONMENT="$environment" FILES_CAP="$files_cap" \
            node scripts/s3/pack-data-publish.mjs comment waiting)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
