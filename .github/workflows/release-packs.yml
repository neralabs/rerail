name: Release packs

# Releases the rule packs under packs/, each its own npm package @neralabs/rerail-pack-<id> (docs/pack-format.md,
# "Versioning and release"). Core's release is release.yml, on `v*` tags; this workflow never touches core.
#
# The "Version packs" pull request (each pack's version and CHANGELOG.md, written by changesets) is opened by
# version-packs.yml; merging it is the release. On a push to main this workflow publishes:
#   Every pack whose package.json version has no `<name>@<version>` git tag is validated (the whole pack
#   validation of test/engine/catalog/packs.test.ts), packed, checked to hold only what its `files` allows, published
#   under `next` with trusted publishing, and tagged. A pack never published at all needs its first publish by hand;
#   the run reports it and fails after publishing the others.
# A pull request touching packs runs the validation and packing as a dry run and publishes nothing.
# `workflow_dispatch` promotes one released pack version from `next` to `latest`.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "packs/**"
      - ".changeset/**"
      - "conformance/pack-validation.ts"
      - "scripts/release/**"
      - ".github/workflows/release-packs.yml"
  workflow_dispatch:
    inputs:
      pack:
        description: Pack id to promote to `latest` (the directory name under packs/)
        required: true
        type: string
      version:
        description: Version to promote; empty for the version in packs/<id>/package.json on this branch
        required: false
        type: string

permissions:
  contents: read

# GitHub keeps one pending run per group and cancels the older one, so a promotion gets its own group per pack: it
# can neither cancel a publish queued behind a release run nor be cancelled by one.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-packs-promote-{0}', inputs.pack) || format('release-packs-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Packs to publish
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      first: ${{ steps.plan.outputs.first }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: plan
        name: List unpublished pack versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/packs-plan.mjs ${{ github.event_name == 'pull_request' && '--all' || '' }}

  # The publish gate and the tarballs. The pack tests need the release native engine; as in ci.yml's build job, main's
  # cached build is reused when the engine's inputs are unchanged.
  pack:
    name: Validate and pack
    needs: plan
    if: needs.plan.outputs.publish != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Validate and pack ${{ needs.plan.outputs.publish }}
        env:
          PACKS: ${{ needs.plan.outputs.publish }}
        run: |
          read -ra packs <<< "$PACKS"
          node --import tsx scripts/release/packs-pack.ts --out "$RUNNER_TEMP/rule-packs" "${packs[@]}"

      - name: Upload the pack tarballs
        uses: actions/upload-artifact@v7
        with:
          name: rule-packs
          path: ${{ runner.temp }}/rule-packs
          if-no-files-found: error

  # npm trusted publishing: npmjs lists this repository, `release-packs.yml` and the `release` environment as each
  # pack's trusted publisher, so no npm token exists anywhere. Provenance needs a public repository; until this one
  # is public, packs publish without it.
  publish:
    name: Publish to npmjs
    needs: [plan, pack]
    if: github.event_name == 'push' && needs.plan.outputs.publish != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or newer; dist-tags over it (promotion) 11.21.0.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the pack tarballs
        uses: actions/download-artifact@v7
        with:
          name: rule-packs
          path: ${{ runner.temp }}/rule-packs

      - name: Publish under next and tag each release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/packs-publish.mjs "$RUNNER_TEMP/rule-packs"

  first-publish:
    name: First publish needed
    needs: [plan, publish]
    if: always() && github.event_name == 'push' && needs.plan.outputs.first != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the packs that need their first publish by hand
        env:
          FIRST: ${{ needs.plan.outputs.first }}
        run: |
          echo "::error::Never published, so not published by this run: ${FIRST}. Publish each by hand and configure its trusted publisher (docs/pack-format.md, \"Publishing a new pack\")."
          exit 1

  promote:
    name: Promote ${{ inputs.pack }} to latest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install npm with trusted publishing dist-tag support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Point latest at the version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACK: ${{ inputs.pack }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release/packs-promote.mjs "$PACK" "$VERSION"
