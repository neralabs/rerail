name: Release packs

# Releases the published rule packs under packs/, each its own npm package @neralabs/rerail-pack-<id> (docs/pack-format.md,
# "Versioning and release"); a pack with `"private": true` is never published. Core's release is release.yml, on `v*`
# tags; this workflow never touches core.
#
# The "Release" pull request (each pack's version and CHANGELOG.md, from its changesets, beside core's bump) is
# opened by release-pr.yml; merging it is the release. On a push to main this workflow releases:
#   Every pack whose package.json version has no `<name>@<version>` git tag is validated (the whole pack
#   validation of test/engine/catalog/packs.test.ts), packed, checked to hold only what its `files` allows, and
#   tagged. The release never waits on npm: the tag comes first, then the version's GitHub Release and its publish
#   under `next` with trusted publishing, side by side. Nothing a push publishes reaches `latest` until a person
#   approves it: the request-promotion job starts a run of this workflow that promotes exactly what was published,
#   and waits for that approval once the release is tested on `next` (docs/release.md, "Promoting"). A version tagged
#   but not on npm (a failed or unapproved publish) is planned again by every later run, so re-running the run or the
#   next push publishes it. The dist-tags job then lists each published pack's dist-tags in the run summary and fails
#   if one's `next` is not the version just published, or is older than its `latest`. A pack never published at all needs its first
#   publish by hand; the run reports it and fails after publishing the others.
# A pull request touching packs runs the validation and packing as a dry run and publishes nothing, and fails if it
# changes what a published pack publishes without a changeset naming that pack, or if a changeset names a private pack
# (the Release pull request is not checked). One of prose alone (scripts/check/ci/prose.mjs: changesets, changelog
# entries, the root's and docs/'s Markdown) runs that check and no dry run, which reads none of them. Its
# paths see only the git diff, not the packs' test data: a change to that data is a change to a tool-pack's
# test-data.lock, under packs/**, and a pull request that checks data in adds it there too (CONTRIBUTING.md).
# `workflow_dispatch` points `latest` at released pack versions. With `released`, as a release run starts it, it
# promotes those versions. By hand with no inputs, every pack whose released version is not `latest` yet, less any held. Naming a pack and an older version puts it back and holds it there
# (`held`), and naming the pack alone, at its package.json version, promotes it again and releases the hold.
# The promote-plan job lists them in the run summary before the promote job, which needs the `release` environment's
# approval, moves them all, moves each one's `next` up to it unless `next` is at a newer version, and then fails if a
# promoted pack's `latest` is not the version or its `next` is older (docs/pack-format.md, "Release"). Once approved,
# the promote job refuses a pack whose `latest` is already newer or whose core range leaves out the core on `latest`,
# and the promoted-releases job makes each promoted version's GitHub Release a full release.
# Each pack version a push tags gets its GitHub Release on its tag, with the version's CHANGELOG.md section as its
# notes (the github-releases job), a pre-release until it is promoted.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "packs/**"
      - ".changeset/**"
      - "conformance/pack-validation.ts"
      - "scripts/release/**"
      - ".github/workflows/release-packs.yml"
      - ".github/actions/pack-test-data/**"
      - "scripts/s3/**"
  workflow_dispatch:
    inputs:
      pack:
        description: Pack id to point latest at alone (the directory name under packs/); empty for every pack whose released version is not latest yet, less any held
        required: false
        default: ""
        type: string
      version:
        description: Version of that pack to point latest at; empty for the one in packs/<id>/package.json on this branch, which releases a hold. An older version puts the pack back and holds it there until it is promoted by name again
        required: false
        default: ""
        type: string
      released:
        description: "The versions a release published, to promote exactly those: <name>@<version>:next, space-separated. A release run sets it; copy it from an expired run to promote by hand. Leave pack and version empty"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# GitHub keeps one pending run per group and cancels the older one. Promotions run by hand share one group, so two never
# move the same pack's `latest` at once, while a promotion can neither cancel a publish queued behind a release run
# nor be cancelled by one. A release run's promotion waits for its approval, for days if testing takes that long, so
# it is a group of its own: it holds back neither the next release nor a put-back, and none of them cancels it. It
# therefore runs beside them once approved: each reads the dist-tags and then moves them, so two approved at once can
# undo each other. Approve one promotion or put-back at a time and let it finish (docs/release.md, "Promoting").
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.released != '' && format('release-packs-promote-{0}', github.run_id) || 'release-packs-promote') || format('release-packs-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change to what a pack publishes is released only through a changeset (docs/pack-format.md, "Versioning and
  # release"). The Release pull request writes versions and changelogs from the changesets and is not checked.
  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The full history, so the diff can reach the merge base with the pull request's base.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The base branch's tip, not the event's base.sha: that is the base as it was when the pull request was last
      # updated, so after a push to main a merge-commit checkout would read main's own changesets as the pull request's.
      - name: Every pack whose published files changed has a changeset
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/release/packs-changesets.mjs "$BASE"

  # A pull request of prose alone (scripts/check/ci/prose.mjs: changesets, changelog entries, the root's and docs/'s
  # Markdown) plans nothing, so it runs no dry run: no pack is validated or packed from prose, and the changesets job
  # checks its changesets. The listing runs the dry run when it fails or cannot list the pull request whole.
  plan:
    name: Packs to publish
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      first: ${{ steps.plan.outputs.first }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: prose
        name: Whether the pull request changes prose alone
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          node scripts/check/ci/prose.mjs "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"

      - name: Skip the dry run for prose alone
        if: steps.prose.outputs.prose == 'true'
        run: echo "This pull request changes prose alone (scripts/check/ci/prose.mjs), so no pack is validated or packed." >> "$GITHUB_STEP_SUMMARY"

      # On a push, the plan reads from npm whether each tagged version is published, with the read-only
      # NPM_PACKS_READ_TOKEN, as the promote-plan job does. A pack it cannot read fails the
      # plan, so a version npm lacks is never taken as released. The file names the variable, not the token.
      - name: Authenticate npm to read the packs
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted rule packs needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - id: plan
        name: List unpublished pack versions
        if: steps.prose.outputs.prose != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.NPM_PACKS_READ_TOKEN || '' }}
        run: node scripts/release/packs-plan.mjs ${{ github.event_name == 'pull_request' && '--all' || '' }}

  # Uploads every pack's test data as this run's artifact for the pack job (.github/actions/pack-test-data,
  # `fetch: "true"`): from S3 under an OIDC token, which GitHub gives no fork's or Dependabot's pull request (those run
  # no dry run). It runs nothing but the pull and never downloads an artifact.
  test-data:
    name: Pack test data
    needs: plan
    if: >-
      ${{
        needs.plan.outputs.publish != '' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token: the archives from S3 on a cache miss, with credentials only the action's pull step holds.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "true"

  # The publish gate and the tarballs. The pack tests need the release native engine; as in ci.yml's build job, main's
  # cached build is reused when the engine's inputs are unchanged. The pack validation reads every pack's test data,
  # downloaded from what the test-data job uploaded; this job restores caches, so it holds no OIDC token.
  pack:
    name: Validate and pack
    needs: [plan, test-data]
    if: >-
      ${{
        needs.plan.outputs.publish != '' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data
        with:
          fetch: "false"

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Validate and pack ${{ needs.plan.outputs.publish }}
        env:
          PACKS: ${{ needs.plan.outputs.publish }}
        run: |
          read -ra packs <<< "$PACKS"
          node --import tsx scripts/release/packs-pack.ts --out "$RUNNER_TEMP/rule-packs" "${packs[@]}"

      - name: Upload the pack tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rule-packs
          path: ${{ runner.temp }}/rule-packs
          if-no-files-found: error

  # A pack's release is its tag and GitHub Release, and never waits on npm: once the publish gate passes, this job tags
  # the released commit `<name>@<version>` for each pack the plan names (packs-tag.mjs), before anything is published.
  # A version already tagged is skipped, so the job can be run again. The GitHub Releases and the npm publish both
  # follow the tags, and neither waits on the other.
  tag:
    name: Tag each release
    needs: [plan, pack]
    if: github.event_name == 'push' && needs.plan.outputs.publish != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      released: ${{ steps.tag.outputs.released }}
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the pack tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rule-packs
          path: ${{ runner.temp }}/rule-packs

      - id: tag
        name: Tag each release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/packs-tag.mjs "$RUNNER_TEMP/rule-packs"

  # The GitHub Release of each pack version the tag job tagged, beside the npm publish rather than after it: its notes
  # are the version's section of the pack's CHANGELOG.md (scripts/release/github-release.mjs), so release notes are
  # written once, in the changelog. A pack's Release is never the repository's latest release (core's is), and is a
  # pre-release while the version is on `next`; the promote makes it a full release. Run again, it rewrites the notes
  # and flags of the Releases it made.
  github-releases:
    name: GitHub Releases
    needs: tag
    if: needs.tag.outputs.released != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - name: Create each GitHub Release from the pack's CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASED: ${{ needs.tag.outputs.released }}
        run: node scripts/release/github-release.mjs

  # npm trusted publishing: npmjs lists this repository, `release-packs.yml` and the `release` environment as each
  # pack's trusted publisher, so no npm token exists anywhere. packs-publish.mjs passes `--provenance` here, so a pack
  # that npm cannot attach a provenance attestation to fails to publish instead of going out without one. It publishes
  # the tagged versions and waits on nothing npm does after a publish. Should it fail, the tags and Releases stand:
  # every later plan publishes again a version tagged but not on npm, so re-running the run (all jobs or failed jobs)
  # or the next push recovers it, and a version npm already has counts as published.
  publish:
    name: Publish to npmjs
    needs: [plan, pack, tag]
    if: github.event_name == 'push' && needs.plan.outputs.publish != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or newer; the promote job, which moves dist-tags over it, needs 11.21.0.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the pack tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rule-packs
          path: ${{ runner.temp }}/rule-packs

      - id: publish
        name: Publish under next
        run: node scripts/release/packs-publish.mjs "$RUNNER_TEMP/rule-packs"

  # Reads back what the publish job released, with no npm login, so it also proves each pack public: each pack's
  # dist-tags in the run summary, failing if one cannot be read anonymously, if one's `next` is not the version just
  # published, or if its `next` is older than its `latest`. It gates nothing: the tags and
  # Releases are made already.
  dist-tags:
    name: Published dist-tags
    needs: publish
    if: needs.publish.outputs.released != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check each published pack's dist-tag
        env:
          RELEASED: ${{ needs.publish.outputs.released }}
        run: node scripts/release/dist-tags-check.mjs

  first-publish:
    name: First publish needed
    needs: [plan, publish]
    if: always() && github.event_name == 'push' && needs.plan.outputs.first != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the packs that need their first publish by hand
        env:
          FIRST: ${{ needs.plan.outputs.first }}
        run: |
          echo "::error::Never published, so not published by this run: ${FIRST}. Publish each by hand and configure its trusted publisher (docs/publishing-a-new-pack.md)."
          exit 1

  # Starts this workflow's promotion of exactly what the publish job released: a run of its own, whose promote job waits
  # for a person to approve it once the release is tested on `next` (docs/release.md, "Promoting"). A run of its own,
  # in a group of its own, so the wait holds back no later release. GITHUB_TOKEN can start a workflow_dispatch run.
  request-promotion:
    name: Start the promotion to latest
    needs: publish
    if: ${{ !cancelled() && github.event_name == 'push' && needs.publish.outputs.released != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start a promotion of what this run published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASED: ${{ needs.publish.outputs.released }}
        run: gh workflow run release-packs.yml --ref main -f released="$RELEASED"

  # Reads each pack's dist-tags from npm, which for these restricted packs needs the read-only NPM_PACKS_READ_TOKEN
  # (as ci.yml's installed-packs job does), and lists what the promote job will move. A pack it cannot read fails
  # this job but is only left out: the promote job still moves the others.
  promote-plan:
    name: Packs to promote
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - name: Require the npm read token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted rule packs needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The file names the variable, not the token: npm reads NODE_AUTH_TOKEN from the step that runs it.
      - name: Authenticate npm to read the packs
        run: |
          # shellcheck disable=SC2016 # npm expands ${NODE_AUTH_TOKEN} itself; the file must not hold the token.
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - id: plan
        name: List released pack versions to promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
          PACK: ${{ inputs.pack }}
          VERSION: ${{ inputs.version }}
          RELEASED: ${{ inputs.released }}
        run: node scripts/release/packs-promote-plan.mjs "$PACK" "$VERSION"

  promote:
    name: Promote to latest
    needs: promote-plan
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.promote-plan.outputs.promote != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install npm with trusted publishing dist-tag support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # PROMOTE is the plan's JSON list of `{ id, version, hold, release }`.
      - id: promote
        name: Point latest at each version and raise next
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROMOTE: ${{ needs.promote-plan.outputs.promote }}
        run: node scripts/release/packs-promote.mjs

      # The packs are public, so `npm dist-tag ls` reads them back with no token. Runs for the packs that moved even when
      # another failed.
      - name: Check each promoted pack's dist-tags
        if: ${{ !cancelled() && steps.promote.outputs.promoted != '' }}
        env:
          RELEASED: ${{ steps.promote.outputs.promoted }}
        run: node scripts/release/dist-tags-check.mjs

  # The GitHub Release of each version the promote job moved to `latest`, rewritten as a full release: published under
  # `next`, it was a pre-release. A pack's Release is never the repository's latest release (core's is). Its notes are
  # from the pack's CHANGELOG.md on main, which keeps every released version's section: everything since the pack's
  # last version on `latest`, a version that never reached `latest` included (previousStable in github-release.mjs).
  # It checks out main as it is now, not the commit this run was started on, which can be days before the approval: a
  # note or lead corrected on main while the release was tested is what stable users read.
  promoted-releases:
    name: Promoted GitHub Releases
    needs: promote
    if: ${{ !cancelled() && needs.promote.outputs.promoted != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - name: Make each promoted version's GitHub Release a full release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASED: ${{ needs.promote.outputs.promoted }}
        run: node scripts/release/github-release.mjs
