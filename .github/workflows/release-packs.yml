name: Release packs

# Releases the rule packs under packs/, each its own npm package @neralabs/rerail-pack-<id> (docs/pack-format.md,
# "Versioning and release"). Core's release is release.yml, on `v*` tags; this workflow never touches core.
#
# The "Version packs" pull request (each pack's version and CHANGELOG.md, written by changesets) is opened by
# version-packs.yml; merging it is the release. On a push to main this workflow publishes:
#   Every pack whose package.json version has no `<name>@<version>` git tag is validated (the whole pack
#   validation of test/engine/catalog/packs.test.ts), packed, checked to hold only what its `files` allows, published
#   under `next` with trusted publishing, and tagged. A pack never published at all needs its first publish by hand;
#   the run reports it and fails after publishing the others.
# A pull request touching packs runs the validation and packing as a dry run and publishes nothing. Its paths see only
# the git diff, not the packs' test data: the derived part is made from what the diff holds (the pins and generators),
# and a pull request that changes the authored part checks it in, and its maintainer deletes it from git in the same
# pull request before merging (CONTRIBUTING.md), so packs/** still matches.
# `workflow_dispatch` promotes released pack versions from `next` to `latest`: with no inputs, every pack whose
# released version is not `latest` yet, less any pack held where someone put it back. The promote-plan job lists them
# in the run summary before the promote job, which needs the `release` environment's approval, moves them all. Naming
# a pack promotes it alone; naming an older version puts it back and holds it there (docs/pack-format.md, "Release").

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "packs/**"
      - ".changeset/**"
      - "conformance/pack-validation.ts"
      - "scripts/release/**"
      - ".github/workflows/release-packs.yml"
      - ".github/actions/pack-fixtures/**"
      - ".github/actions/pack-test-data/**"
      - ".github/workflows/pack-test-data.yml"
      - "scripts/s3/**"
      - "scripts/pack-data/**"
  workflow_dispatch:
    inputs:
      pack:
        description: Pack id to promote alone (the directory name under packs/); empty for every pack whose released version is not latest yet
        required: false
        default: ""
        type: string
      version:
        description: Version of that pack to promote; empty for the one in packs/<id>/package.json on this branch. An older version puts the pack back and holds it there until it is promoted by name again
        required: false
        default: ""
        type: string

permissions:
  contents: read

# GitHub keeps one pending run per group and cancels the older one. Every promotion shares one group, so two never
# move the same pack's `latest` at once, while a promotion can neither cancel a publish queued behind a release run
# nor be cancelled by one.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-packs-promote' || format('release-packs-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Packs to publish
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      first: ${{ steps.plan.outputs.first }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: plan
        name: List unpublished pack versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/packs-plan.mjs ${{ github.event_name == 'pull_request' && '--all' || '' }}

  # The packs' test data (.github/workflows/pack-test-data.yml): the authored part from S3 under an OIDC token, which
  # GitHub gives no fork's or Dependabot's pull request (those run no dry run), and the derived part from the cache or
  # the pins.
  pack-test-data:
    name: Pack test data
    needs: plan
    if: >-
      ${{
        needs.plan.outputs.publish != '' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pack-test-data.yml

  # The publish gate and the tarballs. The pack tests need the release native engine; as in ci.yml's build job, main's
  # cached build is reused when the engine's inputs are unchanged. The pack validation reads the packs' test data, the
  # pack-test-data job's artifact.
  pack:
    name: Validate and pack
    needs: [plan, pack-test-data]
    if: >-
      ${{
        needs.plan.outputs.publish != '' &&
        (
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Validate and pack ${{ needs.plan.outputs.publish }}
        env:
          PACKS: ${{ needs.plan.outputs.publish }}
        run: |
          read -ra packs <<< "$PACKS"
          node --import tsx scripts/release/packs-pack.ts --out "$RUNNER_TEMP/rule-packs" "${packs[@]}"

      - name: Upload the pack tarballs
        uses: actions/upload-artifact@v7
        with:
          name: rule-packs
          path: ${{ runner.temp }}/rule-packs
          if-no-files-found: error

  # npm trusted publishing: npmjs lists this repository, `release-packs.yml` and the `release` environment as each
  # pack's trusted publisher, so no npm token exists anywhere. Provenance needs a public repository; until this one
  # is public, packs publish without it.
  publish:
    name: Publish to npmjs
    needs: [plan, pack]
    if: github.event_name == 'push' && needs.plan.outputs.publish != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or newer; dist-tags over it (promotion) 11.21.0.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the pack tarballs
        uses: actions/download-artifact@v8
        with:
          name: rule-packs
          path: ${{ runner.temp }}/rule-packs

      - name: Publish under next and tag each release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/packs-publish.mjs "$RUNNER_TEMP/rule-packs"

  first-publish:
    name: First publish needed
    needs: [plan, publish]
    if: always() && github.event_name == 'push' && needs.plan.outputs.first != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the packs that need their first publish by hand
        env:
          FIRST: ${{ needs.plan.outputs.first }}
        run: |
          echo "::error::Never published, so not published by this run: ${FIRST}. Publish each by hand and configure its trusted publisher (docs/publishing-a-new-pack.md)."
          exit 1

  # Reads each pack's dist-tags from npm, which for these restricted packs needs the read-only NPM_PACKS_READ_TOKEN
  # (as ci.yml's installed-packs job does), and lists what the promote job will move. A pack it cannot read fails
  # this job but is only left out: the promote job still moves the others.
  promote-plan:
    name: Packs to promote
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - name: Require the npm read token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Reading the restricted rule packs needs the repository secret NPM_PACKS_READ_TOKEN"
            exit 1
          fi

      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The file names the variable, not the token: npm reads NODE_AUTH_TOKEN from the step that runs it.
      - name: Authenticate npm to read the packs
        run: |
          # shellcheck disable=SC2016 # npm expands ${NODE_AUTH_TOKEN} itself; the file must not hold the token.
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"

      - id: plan
        name: List released pack versions to promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKS_READ_TOKEN }}
          PACK: ${{ inputs.pack }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release/packs-promote-plan.mjs "$PACK" "$VERSION"

  promote:
    name: Promote to latest
    needs: promote-plan
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.promote-plan.outputs.promote != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install npm with trusted publishing dist-tag support
        run: |
          npm install --global "npm@^11.21.0"
          npm --version

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # PROMOTE is the plan's JSON list of `{ id, version, hold, release }`.
      - name: Point latest at each version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROMOTE: ${{ needs.promote-plan.outputs.promote }}
        run: node scripts/release/packs-promote.mjs
