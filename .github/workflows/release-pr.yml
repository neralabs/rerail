name: Release pull request

# On every push to main: releases core if main's package.json names a version not released yet, then opens or updates
# the "Release" pull request with everything releasable (scripts/release/release-version.mjs):
#   - packs: with changesets pending, `npm run version:packs` for each pack's version, and each CHANGELOG.md's section
#     for it, written from pack.json and the changesets (docs/pack-format.md, "Release");
#   - core: when anything core ships has changed since its last `v*` tag, the next patch version in package.json and
#     package-lock.json, and CHANGELOG.md's section for that version, its unreleased lead and the entries pending in
#     .changelog/ by change type, whose files it deletes (docs/release.md, "Release notes").
# Merging it is the release: release-packs.yml publishes the packs, and this workflow's tag job tags core's version
# `v<version>`, whose push starts release.yml, which builds and publishes core. With nothing releasable, an open
# Release pull request is closed.
#
# Its own workflow, so it never waits behind a publish run, and only the latest push to main matters: each run
# rewrites the whole pull request from main, so a newer push cancels an older run. A cancelled tag job loses nothing:
# the next run tags the same commit.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: true

env:
  RELEASE_BRANCH: changeset-release/main

jobs:
  # The tag is created with the neralabs-ci app's token, not GITHUB_TOKEN: a tag GITHUB_TOKEN pushes starts no
  # workflow, and release.yml must start on it.
  tag-core:
    name: Tag core's release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: app-token
        name: Get the neralabs-ci app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - name: Tag core's version if it is not released
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/core-tag.mjs

  # What each core version npm has from 0.1.5 refuses of the packs' rules, as that core's own validateCodeRule checks
  # them (releasedCoreRefusals in scripts/release/core.mjs), for the floors the Release pull request raises ranges to.
  # A released core is code this workflow did not build, so it runs here, in a job with a read-only token and no
  # secret, installed fresh from npm (which checks each tarball's integrity) and never from a cache. Only the JSON
  # result goes on to the pull-request job.
  core-refusals:
    name: Check the packs' rules with each released core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      refusals: ${{ steps.check.outputs.refusals }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - id: check
        name: Check every published pack's rules with each released core
        env:
          RERAIL_RELEASE_CORES: ${{ runner.temp }}/release-cores
        run: |
          node --input-type=module --eval '
            import { appendFileSync } from "node:fs";
            import { publishedPackDocuments, releasedCoreRefusals } from "./scripts/release/core.mjs";
            import { listPacks, ROOT } from "./scripts/release/packs.mjs";
            const refusals = releasedCoreRefusals(publishedPackDocuments(listPacks(), ROOT));
            for (const [version, packs] of Object.entries(refusals)) {
              for (const [pack, rules] of Object.entries(packs)) if (rules.length > 0) console.log(`core ${version} refuses ${rules.length} of ${pack}: ${rules.join(", ")}`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `refusals=${JSON.stringify(refusals)}\n`);
          '

  # After tag-core, so a version it just tagged counts as released and core is bumped only for later changes. The
  # pull request is opened with the app's token, not GITHUB_TOKEN, so CI runs on it. It runs even when tag-core fails, so
  # a core tag that can't be created never stops the packs' releases: an untagged core version is left alone.
  pull-request:
    name: Release pull request
    needs: [tag-core, core-refusals]
    if: ${{ !cancelled() && needs.core-refusals.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: app-token
        name: Get the neralabs-ci app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      # tag-core's tag was created after the checkout.
      - name: Fetch the release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: git fetch --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*:refs/tags/v*'

      # The packs' floors take what each released core refuses from the core-refusals job, as JSON, through the
      # environment: no released core runs in this job, beside the app's token.
      - id: version
        name: Version every releasable package
        env:
          RELEASE_CORE_REFUSALS: ${{ needs.core-refusals.outputs.refusals }}
        run: node scripts/release/release-version.mjs "$RUNNER_TEMP/release-pr.md"

      # The commit is the app's bot user's, as GitHub attributes it.
      - name: Open or update the Release pull request
        if: steps.version.outputs.releasable == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          git config user.name "$BOT"
          id="$(gh api "/users/${BOT}" --jq .id)"
          git config user.email "${id}+${BOT}@users.noreply.github.com"
          git switch --force-create "$RELEASE_BRANCH"
          git add --all
          git commit --quiet --message "Release"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${RELEASE_BRANCH}"
          number="$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Release" --body-file "$RUNNER_TEMP/release-pr.md"
          else
            gh pr create --head "$RELEASE_BRANCH" --base main --title "Release" --body-file "$RUNNER_TEMP/release-pr.md"
          fi

      - name: Close the Release pull request, with nothing to release
        if: steps.version.outputs.releasable != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch --comment "Nothing on main is releasable any more."
          fi
