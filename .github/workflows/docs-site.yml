name: Docs site

# Publishes docs/ to GitHub Pages (https://neralabs.github.io/rerail/) after every push to main that changes it, so
# every doc reads in a browser, the DSL reference above all, which GitHub's file view shows as source.
# scripts/build/docs-site.mjs renders each Markdown doc to a page, copies the HTML and images as they are, and fails on a
# relative link to a file that does not exist. For agents it also writes each page's Markdown twin, llms.txt,
# llms-full.txt and the code rule's JSON Schema, generated from src/engine/code-rule/. The repository's Pages source
# must be set to GitHub Actions (Settings, Pages); until it is, configure-pages fails the build job. Run it by hand to
# publish again without a change.
#
# The build checks out the whole tree: the link check reads the files docs/ links to outside it, and the schema is
# generated from the code-rule sources. `npm ci` runs no lifecycle scripts, since the build needs no native code.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/build/docs-site.mjs"
      - "src/engine/code-rule/**"
      - "ui/tokens.generated.css"
      - ".github/workflows/docs-site.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: github.repository == 'neralabs/rerail'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the site
        run: npm run build:docs-site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-docs-site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
