name: Port readiness

# The port readiness gates (docs/port-readiness.md): every rule a pack ships must pass them; candidates run through them and are
# only reported. Called by ci.yml after its build job (the gates read the `built` artifact's engine) when a pull request
# or a push to main touches a gate input, and by port-readiness-nightly.yml, which judges every rule again and refreshes
# the result cache. Both callers run it only for pushes and same-repository pull requests, and grant `id-token: write`,
# which only the test-data job holds: it pulls each planned tool-pack's test data (upstream's copied tests, the case
# sources, the recorded answers) with .github/actions/pack-test-data, the archive its test-data.lock names, into the
# Actions cache, from S3 on a miss under an OIDC token GitHub gives no fork's or Dependabot's pull request, and does the
# same for the tool-pack's recording (one archive, recording.tar.zst, by its tar's sha256, which
# packs/<id>/upstream/<tool>/recording.lock names; s3://nera-test-fixtures/rerail/recordings/<pack>/<tool>/<sha256>.tar.zst);
# it runs nothing else. A gate leg can run upstream's code (the recorder, below), and any of its steps could mint a token
# and assume the read role, so the legs hold none: they restore the archives (`fetch: "false"`) and the recording
# archive the test-data job saved, and extract the recording tree the gates read.
#
# Only a pull request's leg records its tool-pack. It records when neither the cache nor S3 holds the recording the
# lock names, and always when the pull request changes the tool-pack's recording.lock against its base: then the
# test-data job does not fetch the recording the new lock names and the leg does not restore it, so the rules are
# judged against what this commit's recorder made from the pinned upstream, never against bytes the pull request (or the
# bump run that produced it) put in S3. The leg asks upstream for every answer the goldens need (`port-readiness:record
# --check`), and the commit's lock must be what a record of them makes: incrementally over the base's archive, or with
# --full or --prune. Its per-rule summary of what
# upstream answers differently from the base's recording (recording-<pack>--<tool>.md, against the recording the
# test-data job fetched for the base's lock) goes into the pull request comment. The tool-pack's legs upload the
# recording archive as the artifact recordings-<pack>--<tool>, which a maintainer pushes to S3 before the pull request
# merges: ci.yml's "Pack test data is in S3" check fails until it is there. A push to main or a nightly never records: its
# leg fails when neither the cache nor S3 holds the recording. No rule runs over the real-code corpus (that is NRV's
# real-code gate): only the pinned corpus files the goldens name and upstream's pinned test files are fetched, and they
# are cached by their pins.
#
# The plan job builds the legs (conformance/port-readiness/plan.mjs, which also holds the shard counts), lists their
# tool-packs once each for the test-data job, and marks the tool-packs whose recording.lock a pull request changes
# (`rerecord`). A pull request (`select`) judges only the tool-packs of the packs it touches, and every one when it
# touches the engine, the gate code, the package files or the workflows; a tool-pack it leaves out keeps main's
# verdict. Pushes to main and the nightly judge every tool-pack.
#
# Every run saves its results, pull requests included, except a leg that recorded its tool-pack itself: the recorder
# ran upstream's code and unlocked Composer packages, so that leg saves only the recording archive (none when it recorded
# because the pull request changed the lock: no run restores those), which every read checks against the sha256 its key
# names. GitHub scopes a pull request's cache to that pull request, so main never reads one: a push to main reads only
# what main's own pushes and the nightly saved, and the nightly judges every rule uncached. A pull request can therefore
# hand itself verdicts its own code computed, but it can edit the gate code that decides them just as easily, so this
# opens no route it did not already have.

on:
  workflow_call:
    inputs:
      base:
        description: The commit the change is judged against (the pull request's base, or the push's previous head); the not-gated list may only shrink against it.
        type: string
        default: ""
      no-cache:
        description: Judge every rule again instead of reusing the results of unchanged rules; the fresh results are saved.
        type: boolean
        default: false
      select:
        description: Judge only the tool-packs of the packs the change touches (pull requests). False judges every tool-pack (pushes to main, the nightly).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The gates' legs, as JSON for their matrix, and the tool-packs they judge, once each, for the test-data job's. A pull
  # request's checkout is its merge commit, whose first parent is the base tip, so depth 2 holds both sides of the diff;
  # anything else plans every leg. Each leg and tool-pack carries `rerecord`: true when the pull request changes its
  # recording.lock against the merge commit's first parent or the event's base commit (the same commit unless the base
  # moved), false on every other event.
  plan:
    name: Plan the port readiness legs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.recordings.outputs.legs }}
      tool-packs: ${{ steps.plan.outputs.tool-packs }}
      # `{pack, tool, rerecord}` of each planned tool-pack once, however many shards its legs split it into.
      test-data: ${{ steps.recordings.outputs.test-data }}
      # The commit a pull request's recording is compared with (its merge commit's first parent); empty otherwise.
      base: ${{ steps.recordings.outputs.base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # plan.mjs imports only node: builtins, so no npm ci.
      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - id: plan
        name: Plan the legs
        env:
          SELECT: ${{ inputs.select }}
        run: |
          if [ "$SELECT" = "true" ] && git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            node conformance/port-readiness/plan.mjs --diff 'HEAD^1' HEAD
          else
            node conformance/port-readiness/plan.mjs
          fi

      # The checkout keeps no credentials, so the event's base commit is fetched with the token, as the report job
      # fetches. A pull request without either commit to compare with fails here rather than reading the recordings it
      # names.
      - id: recordings
        name: Mark the tool-packs whose recording.lock the pull request changes
        env:
          EVENT: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          LEGS: ${{ steps.plan.outputs.legs }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=""
          refs=()
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git rev-parse -q --verify 'HEAD^1' || true)"
            if [ -n "$base" ]; then refs+=("$base"); fi
            if [ -n "$EVENT_BASE" ] && [ "$EVENT_BASE" != "$base" ]; then
              auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
              if git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$EVENT_BASE"; then
                refs+=("$EVENT_BASE")
              else
                echo "::warning::could not fetch the pull request's base $EVENT_BASE: comparing the locks with ${base:-nothing} only"
              fi
            fi
            if [ "${#refs[@]}" -eq 0 ]; then
              echo "::error::the pull request has no base commit to compare its recording.lock files with"
              exit 1
            fi
          fi
          changed='[]'
          for ref in "${refs[@]}"; do
            changed="$(git diff --name-only --no-renames "$ref" HEAD -- 'packs/*/upstream/*/recording.lock' |
              jq -R -s -c --argjson changed "$changed" '$changed + (split("\n") | map(select(test("^packs/[^/]+/upstream/[^/]+/recording\\.lock$")) | split("/") | "\(.[1])/\(.[3])")) | unique')"
          done
          legs="$(jq -c --argjson changed "$changed" 'map(. + { rerecord: ("\(.pack)/\(.tool)" as $id | $changed | any(.[]; . == $id)) })' <<< "$LEGS")"
          {
            echo "base=$base"
            echo "legs=$legs"
            echo "test-data=$(jq -c 'map({ pack, tool, rerecord }) | unique' <<< "$legs")"
          } >> "$GITHUB_OUTPUT"
          echo "recording.lock changed against the base: $(jq -r 'if length == 0 then "none" else join(", ") end' <<< "$changed")"

  # Each planned tool-pack's archive and recordings, into this run's cache before any leg starts. This job holds the
  # OIDC token and runs only this commit's scripts/s3/pack-fixtures.mjs (the pull and the recordings), never upstream's.
  # For a tool-pack whose recording.lock the pull request changes (`rerecord`), the recordings are the ones the base's
  # lock names, which its legs compare their own recording with; the ones the new lock names are never fetched.
  test-data:
    name: Pack test data (${{ matrix.pack }} · ${{ matrix.tool }})
    needs: plan
    if: needs.plan.outputs.legs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # id-token: the archive and the recordings from S3 on a cache miss, with credentials only the steps that download
    # them hold.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test-data) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/pack-test-data
        with:
          pack: ${{ matrix.pack }}
          tool: ${{ matrix.tool }}

      # The recording archive the gate legs restore, under the key they restore (below), from S3 when the cache lacks it,
      # so a leg records only what neither holds. A tool-pack without a recording.lock is left to its legs, which fail on
      # it. A `rerecord` tool-pack's legs restore none of the new lock's: this job keys the base's lock instead, written
      # over this commit's so the recordings command below reads it (nothing else in this job reads the lock), and a base
      # without a lock, or one that cannot be fetched, leaves nothing to warm.
      - id: recording-lock
        name: Key the recording the legs read
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          RERECORD: ${{ matrix.rerecord }}
          BASE: ${{ needs.plan.outputs.base }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock="packs/$PACK/upstream/$TOOL/recording.lock"
          if [ "$RERECORD" = "true" ]; then
            rm -f "$lock"
            [ -n "$BASE" ] || exit 0
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            if ! git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$BASE"; then
              echo "::warning::could not fetch $BASE: the legs' recording summary is not compared with its recording"
              exit 0
            fi
            if ! git show "$BASE:$lock" > "$lock" 2> /dev/null; then
              rm -f "$lock"
              echo "$BASE has no $lock: the legs record $PACK/$TOOL for the first time"
              exit 0
            fi
            if [ -z "$(jq -r '.files["recording.tar.zst"].sha256 // empty' "$lock")" ]; then
              rm -f "$lock"
              echo "$BASE's $lock is from before the one recording archive: the legs record $PACK/$TOOL from none"
              exit 0
            fi
          fi
          [ -f "$lock" ] || exit 0
          archive="$(jq -r '.files["recording.tar.zst"].sha256' "$lock")"
          {
            echo "key=port-readiness-recording-$PACK-$TOOL-$archive"
            echo "paths=.rerail/port-readiness/recordings/$archive.tar.zst"
          } >> "$GITHUB_OUTPUT"

      - id: recordings
        name: Look up the recording the legs read
        if: steps.recording-lock.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.recording-lock.outputs.paths }}
          key: ${{ steps.recording-lock.outputs.key }}
          lookup-only: true

      # As in .github/actions/pack-test-data: the role reads the bucket, and the credentials are this step's outputs, not
      # exported, so only the download step below holds them.
      - id: recordings-credentials
        name: Assume the test data read role for the recording
        if: steps.recording-lock.outputs.key != '' && steps.recordings.outputs.cache-hit != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::696860996542:role/github-actions-test-fixtures-read
          aws-region: us-east-2
          output-credentials: true
          output-env-credentials: false

      - name: Set up Node.js v24 for the recording
        if: steps.recording-lock.outputs.key != '' && steps.recordings.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # The recording archive the lock names, from s3://nera-test-fixtures/rerail/recordings/<pack>/<tool>/<sha256>.tar.zst,
      # verified against the lock. S3 lacks it only before a maintainer pushed it; the script says so, and a pull request's
      # legs record it while a push's or a nightly's fail. Saved only when it is here.
      - id: recordings-download
        name: Download the recording from S3
        if: steps.recording-lock.outputs.key != '' && steps.recordings.outputs.cache-hit != 'true'
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          PATHS: ${{ steps.recording-lock.outputs.paths }}
          AWS_ACCESS_KEY_ID: ${{ steps.recordings-credentials.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.recordings-credentials.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.recordings-credentials.outputs.aws-session-token }}
          AWS_REGION: us-east-2
        run: |
          set -euo pipefail
          node scripts/s3/pack-fixtures.mjs recordings --pack "$PACK" --tool "$TOOL"
          [ -f "$PATHS" ] || exit 0
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Save the recording
        if: steps.recordings-download.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.recording-lock.outputs.paths }}
          key: ${{ steps.recording-lock.outputs.key }}

  gates:
    name: Port readiness (${{ matrix.pack }} · ${{ matrix.tool }}${{ matrix.shards && format(' · {0}/{1}', matrix.shard, matrix.shards) || '' }})
    # A leg whose tool-pack's test data job failed fails at its restore; the others still run.
    needs: [plan, test-data]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.legs != '[]' }}
    runs-on: ubuntu-24.04
    # An uncached leg judges every rule again: javascript/eslint (121 rules, 11,368 upstream cases) takes 35 min on a
    # laptop, as nera-rule-validation does, and Ruff took 4.5 times longer on a cold CI runner than on a laptop.
    timeout-minutes: 180
    # No id-token: the recorder below runs upstream's code, so the test data comes from the test-data job's cache entry.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One leg per gated tool-pack the plan selects, or one per shard of a tool-pack in plan.mjs's SHARDS: `shard`
      # (1 to `shards`) judges the rules whose sha256(id) mod shards is shard - 1, and the report job merges them
      # (docs/port-readiness.md, "Sharding"). A rule keys on the shared engine and its own language family's alone
      # (conformance/port-readiness/engine.ts), so a change to one language's support judges only its legs cold, plus
      # any leg holding a rule of no language family.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # Before anything reads a case source or fixtures.expected.json, and before the recorder below compares what it
      # writes with what the tool-pack has. Only from the cache: the test-data job put it there.
      - uses: ./.github/actions/pack-test-data
        with:
          pack: ${{ matrix.pack }}
          tool: ${{ matrix.tool }}
          fetch: "false"

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The recording is not in the tree (docs/port-readiness.md): the lock names its one archive by its tar's sha256,
      # and the cache holds it at .rerail/port-readiness/recordings/<sha256>.tar.zst under a key naming that digest,
      # saved by the test-data job from S3 or by an earlier leg of the same pull request that recorded it.
      - id: lock
        name: Read the recording this commit's lock names
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          lock="packs/$PACK/upstream/$TOOL/recording.lock"
          [ -f "$lock" ] || { echo "::error::$lock is missing: run npm run port-readiness:record -- --pack $PACK --tool $TOOL and commit it"; exit 1; }
          archive="$(jq -r '.files["recording.tar.zst"].sha256 // empty' "$lock")"
          [ -n "$archive" ] || { echo "::error::$lock names no recording.tar.zst (a lock from before the one recording archive): run npm run port-readiness:record -- --pack $PACK --tool $TOOL and commit it"; exit 1; }
          {
            echo "key=port-readiness-recording-$PACK-$TOOL-$archive"
            echo "paths=.rerail/port-readiness/recordings/$archive.tar.zst"
          } >> "$GITHUB_OUTPUT"

      # A hit is the archive the test-data job downloaded from S3 or an earlier run recorded, checked against this lock.
      # Every read checks it again (the tree is extracted only from an archive whose tar is the locked one), so bytes
      # that are not the ones the lock names are never judged against. A `rerecord` leg (the pull request changes this
      # lock) restores nothing: it records below, so the archive the new lock names is what this commit's recorder makes.
      - id: recordings
        name: Restore the recording this commit names
        if: ${{ !matrix.rerecord }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.lock.outputs.paths }}
          key: ${{ steps.lock.outputs.key }}

      # A push to main or a nightly never records: the recording a lock on main names must be in S3 (a pull request's
      # check "Pack test data is in S3" holds it until it is), and recording there would run upstream's code in main's
      # cache scope. A pull request records on a miss, and always for a `rerecord` leg.
      - id: source
        name: Decide whether this leg records its tool-pack
        if: steps.recordings.outputs.cache-hit != 'true'
        env:
          EVENT: ${{ github.event_name }}
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          RERECORD: ${{ matrix.rerecord }}
        run: |
          set -euo pipefail
          lock="packs/$PACK/upstream/$TOOL/recording.lock"
          if [ "$EVENT" != "pull_request" ]; then
            echo "::error::neither the Actions cache nor S3 holds the recording $lock names, and a $EVENT run never records it. It must be pushed to S3 before the pull request that changed the lock merges: download it with gh run download <the pull request's run> -n recordings-$PACK--$TOOL -D .rerail/port-readiness/recordings, then push it (CONTRIBUTING.md, \"Pack test data\")"
            exit 1
          fi
          if [ "$RERECORD" = "true" ]; then
            echo "::notice::this pull request changes $lock: recording $PACK/$TOOL from this commit instead of reading the recording the lock names"
          else
            echo "::notice::neither the cache nor S3 holds the recording $lock names: recording it from this commit"
          fi
          echo "record=true" >> "$GITHUB_OUTPUT"

      # What the check builds on and its summary compares with: the pull request's base (its merge commit's first
      # parent, from the plan). The checkout keeps no credentials, so it is fetched with the token, as the report job
      # fetches; the check goes without a base, and the summary without the comparison, when it cannot be fetched. The
      # base lock's recording archive is restored from the cache, where the test-data job put it from S3 for a
      # `rerecord` leg. A base from before the one recording archive names none, and is no base to check against.
      - id: base
        name: Fetch the commit to record against
        if: steps.source.outputs.record == 'true'
        env:
          BASE: ${{ needs.plan.outputs.base }}
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$BASE"
          if [ -n "$base" ]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            if ! git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$base"; then
              echo "::warning::could not fetch $base: the recording summary is not compared with its recording"
              base=""
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          lock="packs/$PACK/upstream/$TOOL/recording.lock"
          if [ -n "$base" ] && git show "$base:$lock" > "$RUNNER_TEMP/base-recording.lock" 2> /dev/null; then
            # A base from before the one recording archive names none; nothing is restored for it.
            archive="$(jq -r '.files["recording.tar.zst"].sha256 // empty' "$RUNNER_TEMP/base-recording.lock")"
            if [ -n "$archive" ]; then
              {
                echo "key=port-readiness-recording-$PACK-$TOOL-$archive"
                echo "paths=.rerail/port-readiness/recordings/$archive.tar.zst"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Restore the recording the base's lock names
        if: steps.source.outputs.record == 'true' && steps.base.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.base.outputs.paths }}
          key: ${{ steps.base.outputs.key }}

      # Without a cached recording the leg runs the pinned upstream itself, with the recorder and runtimes of this
      # commit, so what records a pull request's rules is in its diff like the gate code that judges them. uv installs the
      # Python runtimes, the php action the PHP and Composer the php and blade runtimes need, and rustup the toolchain
      # Clippy's runtime pins. The runtimes are installed afresh, not restored from a cache: a Bladestan runtime restored
      # from the previous run's cache recorded other answers than the same runtime installed fresh, which is what the lock
      # was recorded with.
      - name: Set up uv to record this tool-pack
        if: steps.source.outputs.record == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up the pinned PHP and Composer to record this tool-pack
        if: steps.source.outputs.record == 'true' && (matrix.pack == 'php' || matrix.pack == 'blade')
        uses: ./.github/actions/php

      - id: clippy-toolchain
        name: Read the Rust toolchain Clippy's runtime pins
        if: steps.source.outputs.record == 'true' && matrix.tool == 'clippy'
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          runtime="$(sed -n 's/^  runtime: *\([a-z0-9._-]*\) *$/\1/p' "packs/$PACK/upstream/$TOOL/gates.yaml")"
          [ -n "$runtime" ] || { echo "::error::packs/$PACK/upstream/$TOOL/gates.yaml has no upstream.runtime line this step reads"; exit 1; }
          toolchain="conformance/recorders/port-readiness/runtimes/$runtime/rust-toolchain.toml"
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$toolchain")"
          [ -n "$channel" ] || { echo "::error::$toolchain has no channel line this step reads"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain with clippy to record this tool-pack
        if: steps.source.outputs.record == 'true' && matrix.tool == 'clippy'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.clippy-toolchain.outputs.channel }}
          components: clippy

      # The recorder asks upstream for every answer the goldens need and holds the commit's lock to them (`--check`),
      # writing nothing into the tree. The lock holds when its archive is one a record of those answers makes, which
      # needs none of its bytes: a `--full` or `--prune` record's, or an incremental record's over the archive the base's
      # lock names (`--base`, restored above); or else when the archive, from the cache, holds each of them identically,
      # so answers no golden names never fail it. The case sources must be what it made. A check that holds puts the
      # recording archive the lock names into the cache the gates read below. No maintainer's recording run posts a
      # per-rule summary for this commit, so the leg writes one into its job summary and its report artifact, from which
      # the report job puts it in the pull request comment: against the recording the base's lock names, or as a first
      # recording when the base has no lock. A check that fails leaves the lock and the recording archive a record makes
      # in the report artifact (`--recorded`), for a maintainer who cannot make them locally (rust/clippy off Linux). The
      # recorder runs upstream's code and the Composer packages it resolves, so the step gets no token.
      - id: record
        name: Record this tool-pack
        if: steps.source.outputs.record == 'true'
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          lock="packs/$PACK/upstream/$TOOL/recording.lock"
          changes="$RUNNER_TEMP/gates/recording-$PACK--$TOOL.md"
          args=(--pack "$PACK" --tool "$TOOL" --check --changes "$changes" --recorded "$RUNNER_TEMP/gates/recorded-$PACK--$TOOL")
          # The base's lock, when the base was fetched: no file is a base without one, and a lock from before the one
          # recording archive is none to build on or compare with.
          base_lock="$RUNNER_TEMP/base-recording.lock"
          if [ -n "$BASE_SHA" ]; then
            [ -s "$base_lock" ] || rm -f "$base_lock"
            if [ -f "$base_lock" ] && [ -z "$(jq -r '.files["recording.tar.zst"].sha256 // empty' "$base_lock")" ]; then
              echo "::notice::$BASE_SHA's $lock is from before the one recording archive: $PACK/$TOOL is checked without a base"
            else
              args+=(--base "$base_lock")
            fi
          fi
          status=0
          npm run port-readiness:record -- "${args[@]}" || status=$?
          if [ -f "$changes" ]; then cat "$changes" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$status" -ne 0 ]; then
            echo "::error::this commit's $lock is not what a record of upstream's answers makes (above): record $PACK/$TOOL again as the check says and commit the lock, or take the lock and the recording archive it made from the report artifact (recorded-$PACK--$TOOL/). A case source it lacks comes from the tool-pack's test data archive (test-data.lock): a maintainer derives it again and pushes it with npm run fixtures:push -- --from <ref> (CONTRIBUTING.md, \"Pack test data\"), and the pull request commits the lock"
            exit "$status"
          fi

      # Only the recording archive (not the tree it extracts to), and only once the check held, so it is the one this
      # commit's lock names: what upstream's code left anywhere else under .rerail/ is not saved (the corpus and results
      # saves below skip this leg too). A `rerecord` leg saves nothing: no run restores the recording of a lock its pull
      # request changes.
      - name: Save the recording
        if: steps.source.outputs.record == 'true' && !matrix.rerecord
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.lock.outputs.paths }}
          key: ${{ steps.lock.outputs.key }}

      # The recording archive the lock names, restored or recorded here, for the maintainer who pushes a pull request's
      # recording.lock to S3 (gh run download <run-id> -n recordings-<pack>--<tool> -D .rerail/port-readiness/recordings,
      # then node scripts/s3/pack-fixtures.mjs recordings push --pack <pack> --tool <tool>;
      # CONTRIBUTING.md, "Pack test data"). The first shard of a sharded tool-pack uploads it, since every shard has the
      # same one. A leg whose recorder failed has none.
      - name: Upload the recording
        if: ${{ always() && (!matrix.shards || matrix.shard == 1) && (steps.recordings.outputs.cache-hit == 'true' || steps.record.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: recordings-${{ matrix.pack }}--${{ matrix.tool }}
          path: ${{ steps.lock.outputs.paths }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The corpus files the goldens name and upstream's pinned test files are keyed by their pins; a partial
      # match is reused, since every checkout in them is keyed by commit.
      - name: Restore the goldens' corpus files and upstream's test files
        uses: actions/cache/restore@v6
        with:
          path: |
            .rerail/port-readiness/corpus
            .rerail/port-readiness/upstream
          key: port-readiness-corpus-${{ matrix.pack }}-${{ hashFiles('conformance/port-readiness/corpus-tasks.json', format('packs/{0}/conformance.json', matrix.pack), format('packs/{0}/upstream/*/gates.yaml', matrix.pack)) }}
          restore-keys: |
            port-readiness-corpus-${{ matrix.pack }}-

      # Each result is keyed by everything the rule's verdict depends on, so a stale entry is never read. The `-run-`
      # after the tool and shard keeps eslint-plugin-react's prefix from matching eslint-plugin-react-hooks' entries.
      - name: Restore earlier rule results
        if: ${{ !inputs.no-cache }}
        uses: actions/cache/restore@v6
        with:
          path: .rerail/port-readiness/results
          key: port-readiness-results-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            port-readiness-results-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}-run-

      # The gates read the recording from the tree its archive extracts to (.rerail/port-readiness/recordings/tree/
      # <sha256>/), which no cache holds: the archive restored or recorded above is verified against the lock and
      # extracted here, with no credentials, since it is already local.
      - name: Extract the recording
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: node scripts/s3/pack-fixtures.mjs recordings --pack "$PACK" --tool "$TOOL"

      - id: gates
        name: Run the gates
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          SHARD: ${{ matrix.shards && format('{0}/{1}', matrix.shard, matrix.shards) || '' }}
          REFRESH: ${{ inputs.no-cache && '--refresh-cache' || '' }}
        run: |
          set +e
          npm run port-readiness -- --pack "$PACK" --tool "$TOOL" ${SHARD:+--shard "$SHARD"} --out "$RUNNER_TEMP/gates" ${REFRESH:+"$REFRESH"}
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # Pull requests restore main's corpus (by exact key, or by prefix when the pull request changes a pin) and never
      # save their own: it would duplicate main's unchanged corpora (hundreds of MB) into the pull request's own cache
      # scope, where only its own later runs could use it. A leg that recorded its tool-pack saves no cache at all,
      # whatever the event: the recorder ran upstream's code and the Composer packages it resolved, unlocked, which could
      # have rewritten anything under .rerail/, and on main the save would land where every pull request restores from.
      - name: Save the corpus and upstream's test files
        if: ${{ always() && github.event_name != 'pull_request' && steps.recordings.outputs.cache-hit == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .rerail/port-readiness/corpus
            .rerail/port-readiness/upstream
          key: port-readiness-corpus-${{ matrix.pack }}-${{ hashFiles('conformance/port-readiness/corpus-tasks.json', format('packs/{0}/conformance.json', matrix.pack), format('packs/{0}/upstream/*/gates.yaml', matrix.pack)) }}
        continue-on-error: true

      # Pull request runs save theirs too: GitHub keeps them in the pull request's own cache scope, which main and
      # every other branch cannot read, so a second push reuses only the rules this pull request has not touched. Not
      # after the leg recorded its tool-pack, as above.
      - name: Save the rule results
        if: ${{ always() && steps.recordings.outputs.cache-hit == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .rerail/port-readiness/results
          key: port-readiness-results-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        continue-on-error: true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-readiness-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}
          path: ${{ runner.temp }}/gates/
          if-no-files-found: warn
          retention-days: 14

      # 1: a shipped rule failed a gate (the report job says which and why). 2: the run itself failed.
      - name: Fail when a shipped rule failed
        if: steps.gates.outputs.status != '0'
        env:
          STATUS: ${{ steps.gates.outputs.status }}
        run: exit "$STATUS"

  report:
    name: Port readiness report
    needs: [plan, gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writing pull request comments: the results comment below. The callers grant the same.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      # No leg ran when the plan selected none (or failed), so there is nothing to download.
      - name: Download the reports
        if: needs.gates.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          pattern: port-readiness-*
          path: ${{ runner.temp }}/gates
          merge-multiple: true

      # The not-gated list may only shrink against the base. The checkout keeps no credentials, so the base commit is
      # fetched here with the token, as the lfs action fetches; if it is still missing the summary fails closed.
      - name: Fetch the base commit
        if: inputs.base != '' && inputs.base != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ inputs.base }}
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$BASE" || true

      - id: summary
        name: Summarize, and check the packs without an upstream adapter
        env:
          BASE: ${{ inputs.base }}
          # The tool-packs the plan judged; the rest are listed as not judged. Without a plan the summary expects every
          # gated tool-pack's report, so a failed plan fails closed.
          PLANNED: ${{ needs.plan.result == 'success' && needs.plan.outputs.tool-packs || '' }}
          PORT_READINESS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PORT_READINESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          # A push that creates a branch has no previous head.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=""; fi
          # No report was downloaded when no leg ran.
          mkdir -p "$RUNNER_TEMP/gates"
          # A sharded tool-pack's legs each wrote shard-<i>of<n>/<pack>--<tool>.json: merge them into its report first.
          # Shards that are missing or disagree leave the tool-pack without a report, which the summary fails.
          npm run port-readiness -- merge "$RUNNER_TEMP/gates"
          if [ "$?" = 2 ]; then echo "::error::A sharded tool-pack's shards are missing or disagree (gates merge says which); it has no report."; fi
          npm run port-readiness -- summary "$RUNNER_TEMP/gates" ${BASE:+--base "$BASE"} ${PLANNED:+--planned "$PLANNED"}
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # One results comment per run: the earlier ones are minimized as outdated (collapsed, still there to compare), and
      # the new one goes last. Fork pull requests get a read-only token, so they read the job summary instead. A pull
      # request that judged no tool-pack gets a new comment only when a not-gated check fails, but its earlier comments
      # are still collapsed, so an earlier push's verdict does not read as this run's.
      - name: Post the results on the pull request
        if: >-
          ${{
            always() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          POST: ${{ needs.plan.outputs.legs != '[]' || steps.summary.outputs.status != '0' }}
        run: |
          set -euo pipefail
          marker='<!-- rerail-port-readiness -->'
          # Comments posted while this was called the rule gates carry the old marker; collapse those too.
          legacy='<!-- rerail-rule-gates -->'
          # shellcheck disable=SC2016 # the GraphQL query's $id is GraphQL's variable, not the shell's.
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select((.body | startswith(\"$marker\")) or (.body | startswith(\"$legacy\"))) | .node_id" |
            while read -r id; do
              gh api graphql -f id="$id" \
                -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
                > /dev/null || echo "::warning::could not collapse the earlier port readiness gates comment $id"
            done
          if [ "$POST" = "true" ]; then
            body="$RUNNER_TEMP/gates/comment.md"
            if [ ! -s "$body" ]; then
              printf '%s\n## Port readiness: the run produced no summary\n\nSee the [workflow run](%s).\n' "$marker" "$RUN_URL" > "$body"
            fi
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-readiness-summary
          path: |
            ${{ runner.temp }}/gates/summary.md
            ${{ runner.temp }}/gates/summary.json
            ${{ runner.temp }}/gates/comment.md
          if-no-files-found: warn
          retention-days: 14

      # The gate jobs are skipped, not failed, when the plan selected no leg.
      - name: Fail when anything blocking failed
        if: >-
          steps.summary.outputs.status != '0' || needs.plan.result != 'success' ||
          (needs.gates.result != 'success' && needs.gates.result != 'skipped')
        env:
          STATUS: ${{ steps.summary.outputs.status }}
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gates.result }}
        run: |
          echo "::error::Port readiness failed (summary exit ${STATUS}, plan ${PLAN}, gate jobs ${GATES}). The job summary lists each rule, the gate it stopped at and why."
          exit 1
