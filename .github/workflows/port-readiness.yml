name: Port readiness

# The port readiness gates (docs/port-readiness.md): every rule a pack ships must pass them; candidates run through them and are
# only reported. Called by ci.yml after its build job (the gates read the `built` artifact's engine) when a pull request
# or a push to main touches a gate input, and by port-readiness-nightly.yml, which judges every rule again and refreshes
# the result cache. No rule runs over the real-code corpus (that is NRV's real-code gate): only the pinned corpus files
# the goldens name and upstream's pinned test files are fetched, and they are cached by their pins.
#
# The gates read each tool-pack's expected answers, which `npm run generate` makes by running the pinned upstream and
# which are not in the tree: they live in Azure Blob Storage under the generator key (the upstream version and a digest
# of everything the generator reads). The answers job resolves them once per tool-pack, whatever its shards: from the
# Actions cache, main's container, or this pull request's; a pull request whose change moved the key generates them from
# its own generator and uploads them under its number, and ci.yml's promote jobs copy them to main once it is merged. A
# push to main or the nightly never generates here: main's container must already hold the answers, since the job that
# runs upstream's code must not hold the main identity. A fork's pull request gets no Azure token, so it generates
# whatever the cache does not hold and uploads nothing.
#
# The plan job builds the legs (conformance/port-readiness/plan.mjs, which also holds the shard counts). A pull request
# (`select`) judges only the tool-packs of the packs it touches, and every one when it touches the engine, the gate
# code, the generator, the package files or the workflows; a tool-pack it leaves out keeps main's verdict. Pushes to
# main and the nightly judge every tool-pack.
#
# Every run saves its results, pull requests included. No gate leg runs upstream's code (the answers job does), so the
# legs save their caches by the event alone; an answers job that generated saves no cache: the generator ran upstream's
# code and the Composer packages it resolved, unlocked, which could have rewritten anything under .rerail/. GitHub
# scopes a pull request's cache to that pull request, so main never reads one: a push to main reads only what main's own
# pushes and the nightly saved, and the nightly judges every rule uncached. A pull request can therefore hand itself
# verdicts its own code computed, but it can edit the gate code that decides them just as easily, so this opens no
# route it did not already have.

on:
  workflow_call:
    inputs:
      base:
        description: The commit the change is judged against (the pull request's base, or the push's previous head); the not-gated list may only shrink against it.
        type: string
        default: ""
      no-cache:
        description: Judge every rule again instead of reusing the results of unchanged rules; the fresh results are saved.
        type: boolean
        default: false
      select:
        description: Judge only the tool-packs of the packs the change touches (pull requests). False judges every tool-pack (pushes to main, the nightly).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The gates' legs, as JSON for their matrix. A pull request's checkout is its merge commit, whose first parent is the
  # base tip, so depth 2 holds both sides of the diff; anything else plans every leg.
  plan:
    name: Plan the port readiness legs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.plan.outputs.legs }}
      tool-packs: ${{ steps.plan.outputs.tool-packs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # plan.mjs imports only node: builtins, so no npm ci.
      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - id: plan
        name: Plan the legs
        env:
          SELECT: ${{ inputs.select }}
        run: |
          if [ "$SELECT" = "true" ] && git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            node conformance/port-readiness/plan.mjs --diff 'HEAD^1' HEAD
          else
            node conformance/port-readiness/plan.mjs
          fi

  # Each planned tool-pack's expected answers, resolved once and handed to its gate legs as an artifact. The key is the
  # generator's (`npm run generate -- --key`); the Actions cache holds the answers by it, saved only when they were
  # downloaded from a container, whose blob the generator checks against its sha256 and key. `--no-generate` exits 3
  # when no cache or container holds them: a pull request then installs the runtimes and generates, anything else fails.
  answers:
    name: Port readiness answers (${{ matrix.tool-pack }})
    needs: plan
    if: needs.plan.outputs.tool-packs != '[]'
    runs-on: ubuntu-24.04
    # Generating javascript/eslint's answers runs upstream on 11,368 test cases.
    timeout-minutes: 120
    # id-token: azure/login's OIDC exchange for the PR identity (pull requests: read main's container, write this pull
    # request's prefix of the -pr container) or the main identity (pushes to main and the nightly, which only read
    # here). The callers grant the same. GitHub gives a fork's or Dependabot's pull request no token, so those log in
    # to nothing and the generator works from the Actions cache alone.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        tool-pack: ${{ fromJSON(needs.plan.outputs.tool-packs) }}
    env:
      AZURE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      # Unset, the generator touches no container at all (the fork case above).
      RERAIL_EXPECTED_ACCOUNT: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && vars.RERAIL_EXPECTED_ACCOUNT || '' }}
      # A pull request's own answers go under its number; the before/after against main's answers goes in its comment.
      UPLOAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && format('pr:{0}', github.event.pull_request.number) || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - id: key
        name: Compute the generator key
        env:
          TOOL_PACK: ${{ matrix.tool-pack }}
        run: |
          set -euo pipefail
          pack="${TOOL_PACK%%/*}"
          tool="${TOOL_PACK#*/}"
          key="$(npm run -s generate -- --key --pack "$pack" --tool "$tool" | jq -r .key)"
          echo "$TOOL_PACK: generator key $key"
          {
            echo "pack=$pack"
            echo "tool=$tool"
            echo "key=$key"
            echo "cache-key=port-readiness-expected-${key//\//-}"
            echo "changes=$RUNNER_TEMP/changes/$pack--$tool.md"
          } >> "$GITHUB_OUTPUT"

      - id: expected-cache
        name: Restore the answers this key names
        uses: actions/cache/restore@v6
        with:
          path: .rerail/port-readiness/expected/${{ steps.key.outputs.key }}
          key: ${{ steps.key.outputs.cache-key }}

      - name: Log in to Azure
        if: env.AZURE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID_PR || vars.AZURE_CLIENT_ID_MAIN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Exit 3: no cache or container holds this key's answers. With --upload, answers found anywhere are also put in
      # this pull request's prefix unless a container already holds them, and the before/after against main's latest
      # answers is written when the key is not main's.
      - id: resolve
        name: Find the answers
        env:
          PACK: ${{ steps.key.outputs.pack }}
          TOOL: ${{ steps.key.outputs.tool }}
          CHANGES: ${{ steps.key.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          npm run generate -- --pack "$PACK" --tool "$TOOL" --no-generate ${UPLOAD:+--upload "$UPLOAD" --changes "$CHANGES"}
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 3 ] && [ "$EVENT" = "pull_request" ]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 3 ]; then
            echo "::error::main's container holds no answers for $PACK/$TOOL's generator key: ci.yml's promote jobs put them there on the push that moved it; run them again (or npm run generate -- --promote --pack $PACK --tool $TOOL with the main identity)"
            exit 1
          else
            exit "$status"
          fi

      # Only for a generation: the runtimes are installed afresh, never restored, as the generator expects.
      - name: Set up the runtimes this tool-pack's upstream runs on
        if: steps.resolve.outputs.generate == 'true'
        uses: ./.github/actions/generator-runtimes
        with:
          pack: ${{ steps.key.outputs.pack }}
          tool: ${{ steps.key.outputs.tool }}

      # The generator runs upstream's code and the Composer packages it resolves; on a same-repository pull request it
      # holds the PR identity, which can write nothing the pull request's own workflow could not.
      - name: Generate the answers
        if: steps.resolve.outputs.generate == 'true'
        env:
          PACK: ${{ steps.key.outputs.pack }}
          TOOL: ${{ steps.key.outputs.tool }}
          CHANGES: ${{ steps.key.outputs.changes }}
        run: |
          echo "::notice::no cache or container holds $PACK/$TOOL's answers for this generator key: generating them from this commit"
          npm run generate -- --pack "$PACK" --tool "$TOOL" ${UPLOAD:+--upload "$UPLOAD" --changes "$CHANGES"}

      - name: Save the downloaded answers
        if: steps.resolve.outputs.generate == 'false' && steps.expected-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .rerail/port-readiness/expected/${{ steps.key.outputs.key }}
          key: ${{ steps.key.outputs.cache-key }}
        continue-on-error: true

      # The whole cache directory, so the legs find the answers under the key they compute themselves.
      - name: Hand the answers to the gate legs
        uses: actions/upload-artifact@v7
        with:
          name: expected-${{ steps.key.outputs.pack }}-${{ steps.key.outputs.tool }}
          path: .rerail/port-readiness/expected/
          if-no-files-found: error
          retention-days: 1

      - name: Show what moved in upstream's answers
        if: always()
        env:
          CHANGES: ${{ steps.key.outputs.changes }}
        run: if [ -s "$CHANGES" ]; then cat "$CHANGES" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload what moved in upstream's answers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: answer-changes-${{ steps.key.outputs.pack }}-${{ steps.key.outputs.tool }}
          path: ${{ steps.key.outputs.changes }}
          if-no-files-found: ignore
          retention-days: 14

  gates:
    name: Port readiness (${{ matrix.pack }} · ${{ matrix.tool }}${{ matrix.shards && format(' · {0}/{1}', matrix.shard, matrix.shards) || '' }})
    needs: [plan, answers]
    # A tool-pack whose answers job failed fails its own legs only (its artifact is missing), not every other's.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.legs != '[]' }}
    runs-on: ubuntu-24.04
    # An uncached leg judges every rule again: javascript/eslint (121 rules, 11,368 upstream cases) takes 35 min on a
    # laptop, as nera-rule-validation does, and Ruff took 4.5 times longer on a cold CI runner than on a laptop.
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One leg per gated tool-pack the plan selects, or one per shard of a tool-pack in plan.mjs's SHARDS: `shard`
      # (1 to `shards`) judges the rules whose sha256(id) mod shards is shard - 1, and the report job merges them
      # (docs/port-readiness.md, "Sharding"). A rule keys on the shared engine and its own language family's alone
      # (conformance/port-readiness/engine.ts), so a change to one language's support judges only its legs cold, plus
      # any leg holding a rule of no language family.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      # The gates compute the generator key themselves and read the answers under it.
      - name: Download this tool-pack's answers
        uses: actions/download-artifact@v8
        with:
          name: expected-${{ matrix.pack }}-${{ matrix.tool }}
          path: .rerail/port-readiness/expected

      # The corpus files the goldens name and upstream's pinned test files are keyed by their pins; a partial
      # match is reused, since every checkout in them is keyed by commit.
      - name: Restore the goldens' corpus files and upstream's test files
        uses: actions/cache/restore@v6
        with:
          path: |
            .rerail/port-readiness/corpus
            .rerail/port-readiness/upstream
          key: port-readiness-corpus-${{ matrix.pack }}-${{ hashFiles('conformance/port-readiness/corpus-tasks.json', format('packs/{0}/conformance.json', matrix.pack), format('packs/{0}/upstream/*/gates.yaml', matrix.pack)) }}
          restore-keys: |
            port-readiness-corpus-${{ matrix.pack }}-

      # Each result is keyed by everything the rule's verdict depends on, so a stale entry is never read. The `-run-`
      # after the tool and shard keeps eslint-plugin-react's prefix from matching eslint-plugin-react-hooks' entries.
      - name: Restore earlier rule results
        if: ${{ !inputs.no-cache }}
        uses: actions/cache/restore@v6
        with:
          path: .rerail/port-readiness/results
          key: port-readiness-results-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            port-readiness-results-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}-run-

      - id: gates
        name: Run the gates
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          SHARD: ${{ matrix.shards && format('{0}/{1}', matrix.shard, matrix.shards) || '' }}
          REFRESH: ${{ inputs.no-cache && '--refresh-cache' || '' }}
        run: |
          set +e
          npm run port-readiness -- --pack "$PACK" --tool "$TOOL" ${SHARD:+--shard "$SHARD"} --out "$RUNNER_TEMP/gates" $REFRESH
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # Pull requests restore main's corpus (by exact key, or by prefix when the pull request changes a pin) and never
      # save their own: it would duplicate main's unchanged corpora (hundreds of MB) into the pull request's own cache
      # scope, where only its own later runs could use it.
      - name: Save the corpus and upstream's test files
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .rerail/port-readiness/corpus
            .rerail/port-readiness/upstream
          key: port-readiness-corpus-${{ matrix.pack }}-${{ hashFiles('conformance/port-readiness/corpus-tasks.json', format('packs/{0}/conformance.json', matrix.pack), format('packs/{0}/upstream/*/gates.yaml', matrix.pack)) }}
        continue-on-error: true

      # Pull request runs save theirs too: GitHub keeps them in the pull request's own cache scope, which main and
      # every other branch cannot read, so a second push reuses only the rules this pull request has not touched.
      - name: Save the rule results
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: .rerail/port-readiness/results
          key: port-readiness-results-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        continue-on-error: true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-readiness-${{ matrix.pack }}-${{ matrix.tool }}${{ matrix.shards && format('-shard-{0}of{1}', matrix.shard, matrix.shards) || '' }}
          path: ${{ runner.temp }}/gates/
          if-no-files-found: warn
          retention-days: 14

      # 1: a shipped rule failed a gate (the report job says which and why). 2: the run itself failed.
      - name: Fail when a shipped rule failed
        if: steps.gates.outputs.status != '0'
        env:
          STATUS: ${{ steps.gates.outputs.status }}
        run: exit "$STATUS"

  report:
    name: Port readiness report
    needs: [plan, answers, gates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Writing pull request comments: the before/after of upstream's answers and the results comment below. The callers
    # grant the same.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      # No leg ran when the plan selected none (or failed), so there is nothing to download.
      - name: Download the reports
        if: needs.gates.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          pattern: port-readiness-*
          path: ${{ runner.temp }}/gates
          merge-multiple: true

      # What moved in upstream's answers, per tool-pack whose generator key is not main's latest (the answers job).
      - name: Download what moved in upstream's answers
        if: needs.answers.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: answer-changes-*
          path: ${{ runner.temp }}/changes
          merge-multiple: true

      # The not-gated list may only shrink against the base. The checkout keeps no credentials, so the base commit is
      # fetched here with the token, as the lfs action fetches; if it is still missing the summary fails closed.
      - name: Fetch the base commit
        if: inputs.base != '' && inputs.base != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ inputs.base }}
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$BASE" || true

      - id: summary
        name: Summarize, and check the packs without an upstream adapter
        env:
          BASE: ${{ inputs.base }}
          # The tool-packs the plan judged; the rest are listed as not judged. Without a plan the summary expects every
          # gated tool-pack's report, so a failed plan fails closed.
          PLANNED: ${{ needs.plan.result == 'success' && needs.plan.outputs.tool-packs || '' }}
          PORT_READINESS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PORT_READINESS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          # A push that creates a branch has no previous head.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=""; fi
          # No report was downloaded when no leg ran.
          mkdir -p "$RUNNER_TEMP/gates"
          # A sharded tool-pack's legs each wrote shard-<i>of<n>/<pack>--<tool>.json: merge them into its report first.
          # Shards that are missing or disagree leave the tool-pack without a report, which the summary fails.
          npm run port-readiness -- merge "$RUNNER_TEMP/gates"
          if [ "$?" = 2 ]; then echo "::error::A sharded tool-pack's shards are missing or disagree (gates merge says which); it has no report."; fi
          npm run port-readiness -- summary "$RUNNER_TEMP/gates" ${BASE:+--base "$BASE"} ${PLANNED:+--planned "$PLANNED"}
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # What moved, per rule: a comment of its own per tool-pack, since one can run long. Before a tool-pack's new one is
      # posted, its earlier ones are collapsed as outdated: they start with recording/diff.ts's RECORDING_COMMENT_MARKER
      # and carry the heading that names the tool-pack. Every planned tool-pack's are collapsed, so one whose key went
      # back to main's keeps no stale summary open; a tool-pack this run did not plan keeps its own. Posted before the
      # results comment, which goes last.
      - name: Post what moved in upstream's answers on the pull request
        if: >-
          ${{
            always() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.plan.result == 'success'
          }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TOOL_PACKS: ${{ needs.plan.outputs.tool-packs }}
        run: |
          set -euo pipefail
          marker='<!-- rerail-port-readiness-recording -->'
          # Summaries posted while the answers were recordings named for the gates carry the old marker; collapse those too.
          legacy='<!-- rerail-gate-recording -->'
          while IFS= read -r toolpack; do
            heading="### \`$toolpack\`"
            gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select((.body | startswith(\"$marker\")) or (.body | startswith(\"$legacy\"))) | select(.body | contains(\"\n$heading\")) | .node_id" |
              while read -r id; do
                gh api graphql -f id="$id" \
                  -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
                  > /dev/null || echo "::warning::could not collapse the earlier answers summary $id"
              done || echo "::warning::could not list $toolpack's earlier answers summaries"
            changes="$RUNNER_TEMP/changes/${toolpack%%/*}--${toolpack#*/}.md"
            if [ -s "$changes" ] && [ ! -L "$changes" ]; then
              gh api "repos/$REPO/issues/$PR/comments" -F body=@"$changes" > /dev/null || echo "::warning::could not post $toolpack's summary"
            fi
          done < <(jq -r '.[]' <<< "$TOOL_PACKS")

      # One results comment per run: the earlier ones are minimized as outdated (collapsed, still there to compare), and
      # the new one goes last. Fork pull requests get a read-only token, so they read the job summary instead. A pull
      # request that judged no tool-pack gets a new comment only when a not-gated check fails, but its earlier comments
      # are still collapsed, so an earlier push's verdict does not read as this run's.
      - name: Post the results on the pull request
        if: >-
          ${{
            always() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          POST: ${{ needs.plan.outputs.legs != '[]' || steps.summary.outputs.status != '0' }}
        run: |
          set -euo pipefail
          marker='<!-- rerail-port-readiness -->'
          # Comments posted while this was called the rule gates carry the old marker; collapse those too.
          legacy='<!-- rerail-rule-gates -->'
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\") | select((.body | startswith(\"$marker\")) or (.body | startswith(\"$legacy\"))) | .node_id" |
            while read -r id; do
              gh api graphql -f id="$id" \
                -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
                > /dev/null || echo "::warning::could not collapse the earlier port readiness gates comment $id"
            done
          if [ "$POST" = "true" ]; then
            body="$RUNNER_TEMP/gates/comment.md"
            if [ ! -s "$body" ]; then
              printf '%s\n## Port readiness: the run produced no summary\n\nSee the [workflow run](%s).\n' "$marker" "$RUN_URL" > "$body"
            fi
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-readiness-summary
          path: |
            ${{ runner.temp }}/gates/summary.md
            ${{ runner.temp }}/gates/summary.json
            ${{ runner.temp }}/gates/comment.md
          if-no-files-found: warn
          retention-days: 14

      # The gate jobs are skipped, not failed, when the plan selected no leg.
      - name: Fail when anything blocking failed
        if: >-
          steps.summary.outputs.status != '0' || needs.plan.result != 'success' ||
          (needs.gates.result != 'success' && needs.gates.result != 'skipped')
        env:
          STATUS: ${{ steps.summary.outputs.status }}
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gates.result }}
        run: |
          echo "::error::Port readiness failed (summary exit ${STATUS}, plan ${PLAN}, gate jobs ${GATES}). The job summary lists each rule, the gate it stopped at and why."
          exit 1
