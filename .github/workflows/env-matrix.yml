name: Environment matrix

# Installs the package main would release in each environment of scripts/host/azure/environments.json, the way a user
# meets it: `npx @neralabs/rerail setup`, then the managed runtime, PATH in new shells, the coding-agent hooks, daemon
# restart, and removal. Linux distributions on x64 and arm64 and Windows 11 on x64 and arm64 run on throwaway Azure
# VMs; macOS runs on GitHub-hosted runners, since Azure has no Macs. scripts/host/azure/matrix.mjs drives each
# environment; docs/environment-matrix.md explains it.
#
# Runs after a push to main that changes what core ships, by the rule the Release pull request uses
# (scripts/release/core-paths.mjs), or changes the matrix itself; a pack, test, docs or other CI change leaves the
# package as the last run tested it. Also on demand (`environments` picks some ids). The package comes from
# package.yml, the same build release.yml publishes. Environments expected to refuse set-up
# (`"expect": "setup-fails"`) pass when set-up fails there and fail when it starts succeeding, so environments.json is
# updated as support changes.
#
# Azure access is OIDC, no secret: scripts/host/azure/bootstrap.sh trusts pushes to main of this repository and gives
# that identity Contributor on one resource group, and writes the repository variables read below.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environments:
        description: Comma-separated ids from scripts/host/azure/environments.json; empty for all
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One run at a time per ref, queued rather than cancelled: a cancelled job still deletes its VMs, but a queued run
# costs nothing, and GitHub keeps only the newest one waiting.
concurrency:
  group: env-matrix-${{ github.ref }}
  cancel-in-progress: false

env:
  RERAIL_AZURE_RESOURCE_GROUP: ${{ vars.RERAIL_AZURE_RESOURCE_GROUP }}
  # One id for the whole run, re-run attempts included, so a re-run of failed environments finds the staged bundle.
  RUN_ID: gh${{ github.run_id }}

jobs:
  # Main takes squash merges only and no force pushes, so a push is one commit and `before` its parent. A dispatch,
  # a first push, or a lookup that fails runs the matrix.
  changes:
    name: Decide whether to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.affected.outputs.run }}
      azure: ${{ steps.list.outputs.azure }}
      github: ${{ steps.list.outputs.github }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - id: affected
        name: Does this push change what core ships, or the matrix?
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" != push ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! run="$(node scripts/host/azure/matrix.mjs affected --base "$BEFORE" --head "$AFTER")"; then
            echo "::warning::Could not tell what this push changed; running the matrix"
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - id: list
        name: List environments
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          echo "azure=$(node scripts/host/azure/matrix.mjs list --on azure --env "$ENVIRONMENTS")" >> "$GITHUB_OUTPUT"
          echo "github=$(node scripts/host/azure/matrix.mjs list --on github --env "$ENVIRONMENTS")" >> "$GITHUB_OUTPUT"

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/package.yml

  # Bundles the package with this checkout's rule packs once and puts it where every environment's VM fetches it.
  stage:
    name: Stage the package
    needs: [changes, package]
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.azure != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # A missing variable is a configuration error (run scripts/host/azure/bootstrap.sh --github), not a skip.
      - name: Require the Azure variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RERAIL_AZURE_RESOURCE_GROUP; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The environment matrix needs repository variable(s) ${missing[*]}: run scripts/host/azure/bootstrap.sh --github"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: rerail-package
          path: release

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stage the package and rule packs
        env:
          TARBALL: release/${{ needs.package.outputs.tarball }}
        run: node scripts/host/azure/matrix.mjs stage --tarball "$TARBALL" --run-id "$RUN_ID"

  install:
    name: Install on ${{ matrix.environment }}
    needs: [changes, stage]
    runs-on: ubuntu-24.04
    # A Windows VM: ~2 min to create, ~5 to install Node and Git, ~10 to sign in and check; the driver gives up at 60.
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.changes.outputs.azure) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install and check on ${{ matrix.environment }}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: node scripts/host/azure/matrix.mjs run --staged --run-id "$RUN_ID" --env "$ENVIRONMENT" --out results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: env-matrix-${{ matrix.environment }}
          path: results
          if-no-files-found: ignore

  # macOS on a fresh GitHub-hosted runner, which the job throws away: the guest makes the account's shell zsh, installs
  # Node from nodejs.org system-wide and writes to the account's home, as on a Mac a developer sets up. No Azure.
  macos:
    name: Install on ${{ matrix.environment.id }}
    needs: [changes, package]
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.github != '[]'
    runs-on: ${{ matrix.environment.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.changes.outputs.github) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Runs the driver only; the guest's own Node comes from nodejs.org's installer.
      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: rerail-package
          path: release

      - name: Install and check on ${{ matrix.environment.id }}
        env:
          ENVIRONMENT: ${{ matrix.environment.id }}
          TARBALL: release/${{ needs.package.outputs.tarball }}
        run: node scripts/host/azure/matrix.mjs local --tarball "$TARBALL" --env "$ENVIRONMENT" --out results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: env-matrix-${{ matrix.environment.id }}
          path: results
          if-no-files-found: ignore

  # Deletes what a cancelled or crashed run left behind (each environment deletes its own VM when it finishes), and the
  # storage containers of earlier runs.
  sweep:
    name: Sweep leftovers
    needs: [changes, install]
    if: always() && needs.changes.outputs.run == 'true' && needs.changes.outputs.azure != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Sign in to Azure
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete resources and containers older than 3 hours
        run: node scripts/host/azure/matrix.mjs sweep --older-than-hours 3
