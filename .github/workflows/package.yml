name: Package

# Builds the @neralabs/rerail package: native rules engines for every supported target, the TypeScript runtime,
# and the bundled UI. Each engine is packed into an npm package of its own, with the tray icon program built for the
# same system, and core (the runtime and the UI) into a tarball that pins those six by version and integrity
# (scripts/release/engine/packages.mjs): npm's registry refuses one tarball holding every engine. The seven tarballs
# and the engine packages' manifest (engine-packages.json) are uploaded as the `rerail-package` artifact of the calling
# run. release.yml publishes what this builds; env-matrix.yml installs it on Azure VMs. One build, so the environment
# matrix tests exactly what a release would ship.
#
# Each native build compiles through the Rust compile cache (.github/actions/rust-compile-cache): it starts from the
# newest store release-cache.yml saved on main as an artifact for that target, and compiles cold without one. Nothing
# here saves a store, and the Actions cache is not used.

on:
  workflow_call:
    outputs:
      tarball:
        description: File name of core's tarball inside the rerail-package artifact, which holds the engine packages' tarballs and their manifest beside it
        value: ${{ jobs.package.outputs.tarball }}

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          # Linux engines link against the glibc 2.17 sysroot of napi-rs's cross toolchain: built on the runner's
          # own glibc (2.39 on Ubuntu 24.04), they failed to load on every older distribution. The toolchain's
          # linker also drops the symbol tables (`--strip`), which nothing loads at runtime
          # (scripts/build/release-engine.mjs).
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            windows_runtime_smoke: true
          # Cross-compiled on x64; no hosted Windows arm64 runner is used, so this engine is checked
          # by import inspection only here (env-matrix.yml runs it on a Windows 11 arm64 VM).
          - runner: windows-2025
            target: aarch64-pc-windows-msvc
            windows_runtime_smoke: false
    runs-on: ${{ matrix.runner }}
    # The compile cache's store: main's, read from its runs' artifacts.
    permissions:
      contents: read
      actions: read
    # A cold build (no store from main) took 37 minutes for Apple Silicon and 42 for Windows x64 after the rule engine
    # grew, and an Intel Mac was still compiling at 44: 45 cut the last two off. Keep this and release-cache.yml's the
    # same.
    timeout-minutes: 120
    steps:
      # Windows refuses paths over 260 characters unless Git is told to use long paths. `npm run check` keeps
      # tracked paths well under that (scripts/check/check-windows-paths.mjs), so this is the backstop.
      - name: Allow long paths in Git on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # No npm cache: on a tag, setup-node's cache misses on every runner but macOS arm64, and it saves on a miss.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      # Compiles through sccache, starting from the store release-cache.yml saved on main for this target.
      - id: cc
        uses: ./.github/actions/rust-compile-cache
        with:
          name: release-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Build TypeScript
        run: npm run build:ts

      - name: Build native engine
        run: node scripts/build/release-engine.mjs ${{ matrix.target }}

      # The tray icon program, which the engine package carries beside the engine. A Linux one is built for musl, a
      # static binary that runs on every Linux whatever its C library (scripts/build/release-tray.mjs). Its crates are
      # pure Rust, so the runner's own linker links it with the C runtime the musl target ships, and no musl C
      # toolchain (musl-tools) is installed, as in ci.yml's rust-tray job.
      - name: Build tray program
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == *-unknown-linux-gnu ]]; then rustup target add "${TARGET%-gnu}-musl"; fi
          node scripts/build/release-tray.mjs "$TARGET"

      # Node 24's own Linux binaries need glibc 2.28, the floor docs/installation.md states. The runner's glibc is
      # newer, so the smokes below cannot catch an engine that needs more, or one that leaves a symbol for the
      # loading machine to define.
      - name: Check Linux engine loads on glibc 2.28
        if: runner.os == 'Linux'
        run: node scripts/check/check-linux-engine.mjs native/rerail_engine.*.node

      # The tray program runs on musl and glibc Linux alike only while it needs no loader or shared library. Rust links
      # a musl binary static-pie, which `file` calls "static-pie linked" rather than "statically linked".
      - name: Check Linux tray program is static
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          described="$(file native/rerail-tray.*)"
          echo "$described"
          grep -Eq "statically linked|static-pie linked" <<< "$described"

      # Runners ship the Visual C++ runtime, so the load smokes below cannot catch an engine or a tray program that
      # needs it; a clean Windows install does not have it.
      - name: Check Windows engine and tray program have no Visual C++ runtime dependency
        if: endsWith(matrix.target, '-windows-msvc')
        shell: bash
        run: node scripts/check/check-windows-runtime.mjs native/rerail_engine.*.node native/rerail-tray.*.exe

      - name: Smoke Windows rerail CLI install planning
        if: matrix.windows_runtime_smoke
        run: node dist/cli/cli.js install --root . --agents omp,pi,claude-code,codex,cursor --dry-run

      - name: Provision Linux Secret Service
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools

      - name: Smoke macOS Keychain device storage
        if: startsWith(matrix.runner, 'macos')
        run: ./node_modules/.bin/vitest run integration/signed-profile-cli.test.ts

      - name: Smoke Linux Secret Service device storage
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          dbus-run-session -- bash <<'EOF'
          set -euo pipefail
          # --unlock reads the login keyring password from stdin and creates the
          # keyring when it does not exist; --start never creates it, which left
          # secret-tool with no default collection. The password only guards this
          # ephemeral session bus, so any non-empty throwaway value works.
          eval "$(gnome-keyring-daemon --unlock --components=secrets <<< 'rerail-ci')"
          if ! printf 'x' | secret-tool store --label=probe rerail-probe 1 \
            || [ "$(secret-tool lookup rerail-probe 1)" != 'x' ]; then
            echo '::error::Secret Service default collection is not writable after gnome-keyring-daemon --unlock' >&2
            exit 1
          fi
          secret-tool clear rerail-probe 1
          ./node_modules/.bin/vitest run integration/signed-profile-cli.test.ts
          EOF

      - name: Smoke Windows Credential Manager device storage
        if: matrix.windows_runtime_smoke
        run: ./node_modules/.bin/vitest run integration/signed-profile-cli.test.ts

      - name: Smoke native engine
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: ./node_modules/.bin/vitest run test/engine/native/native-health.test.ts

      - name: Smoke Windows junction lifecycle
        if: matrix.windows_runtime_smoke
        run: ./node_modules/.bin/vitest run test/setup/updater.test.ts test/setup/harness-registration.test.ts -t "Windows.*junction"

      - name: Smoke Windows daemon launch handle isolation
        if: matrix.windows_runtime_smoke
        run: ./node_modules/.bin/vitest run test/runtime/windows-daemon-launch.test.ts

      # An artifact keeps no file mode: packing the engine package makes the tray program executable again.
      - name: Upload native engine and tray program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rerail-native-${{ matrix.target }}
          path: |
            native/*.node
            native/rerail-tray.*
          if-no-files-found: error

  package:
    name: Package
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tarball: ${{ steps.packed-package.outputs.tarball }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # No npm cache, as in the native job.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Assemble release package
        run: |
          npm run build:clean
          npm run build:ts
          npm run build:omp
          npm run build:events
          npm run build:cursor
          npm run build:claude
          npm run build:codex
          npm run build:ui

      - name: Download native engines and tray programs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rerail-native-*
          path: native
          merge-multiple: true

      - name: Verify every supported native target is present
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc; do
            test -f "native/rerail_engine.${target}.node" || { echo "missing native/rerail_engine.${target}.node" >&2; exit 1; }
            tray="native/rerail-tray.${target}"
            if [[ "$target" == win32-* ]]; then tray="$tray.exe"; fi
            test -f "$tray" || { echo "missing $tray" >&2; exit 1; }
          done

      # One npm package per engine, each at core's version and carrying its tray program, and their manifest. --all
      # fails unless native/ holds all six engines and tray programs: a core packed against fewer engines installs with
      # no engine on the platforms left out.
      - name: Pack the engine packages
        run: node scripts/release/engine/packages.mjs pack --all --out "$RUNNER_TEMP/rerail-package"

      # prepack reads RERAIL_ENGINE_PACKAGES and pins the six engine packages in core's package.json and
      # npm-shrinkwrap.json, each at the integrity of the tarball just packed (scripts/release/shrinkwrap-pack.mjs).
      - id: packed-package
        name: Pack release package
        env:
          RERAIL_ENGINE_PACKAGES: ${{ runner.temp }}/rerail-package
        run: |
          npm pack --json --pack-destination "$RERAIL_ENGINE_PACKAGES" > "$RUNNER_TEMP/packed-package.json"
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from "node:fs";
          const [{ filename }] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/packed-package.json`, "utf8"));
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${filename}\n`);
          EOF

      # The check release.yml makes again before it publishes (its shrinkwrap job), made here too so the environment
      # matrix never installs a core that pins fewer than six engine packages, or other tarballs than these.
      - name: Check the tarball pins the six engine packages
        env:
          RERAIL_ENGINE_PACKAGES: ${{ runner.temp }}/rerail-package
          PACKAGE_TARBALL: ${{ steps.packed-package.outputs.tarball }}
        run: node scripts/release/shrinkwrap-pack.mjs check "$RERAIL_ENGINE_PACKAGES/$PACKAGE_TARBALL"

      - name: Smoke installed release package
        env:
          RERAIL_ENGINE_PACKAGES: ${{ runner.temp }}/rerail-package
          PACKAGE_TARBALL: ${{ steps.packed-package.outputs.tarball }}
        run: |
          set -euo pipefail
          smoke_directory="$(mktemp -d)"
          installed="$smoke_directory/node_modules/@neralabs/rerail"
          # npm reads no shrinkwrap from a tarball it is handed as a file, and the engine packages are on no registry
          # yet: core's tarball alone installs with no engine, exit code 0. The runner's engine package is installed
          # with it, from its own tarball, and lands beside core, where the managed install puts it.
          engine_tarball="$(node --input-type=module -e 'import { readEngineManifest } from "./scripts/release/engine/packages.mjs"; import { enginePackageFor } from "./scripts/release/engine/release.mjs"; console.log(readEngineManifest(process.argv[1]).packages.find(({ name }) => name === enginePackageFor().name).file);' "$RERAIL_ENGINE_PACKAGES")"
          npm install --prefix "$smoke_directory" "$RERAIL_ENGINE_PACKAGES/$PACKAGE_TARBALL" "$RERAIL_ENGINE_PACKAGES/$engine_tarball"
          "$smoke_directory/node_modules/.bin/rerail" --help
          # Core ships no engine of its own, so the health check below loads the engine package's.
          if compgen -G "$installed/native/*.node" > /dev/null; then echo "core's tarball ships a native engine" >&2; exit 1; fi
          # Every file the package runs by path (src/engine/package-root.ts ENTRY_POINTS: CLI, daemon, hooks, status
          # line, event stream), read from the installed package itself so a layout change cannot leave this stale.
          # shellcheck disable=SC2016 # the script is JavaScript; its template literals are not the shell's.
          node --input-type=module --eval '
            import { existsSync } from "node:fs";
            import { join } from "node:path";
            import { pathToFileURL } from "node:url";
            const root = process.argv[1];
            const { ENTRY_POINTS } = await import(pathToFileURL(join(root, "dist", "engine", "package-root.js")).href);
            const missing = Object.values(ENTRY_POINTS).filter((path) => !existsSync(join(root, path)));
            if (missing.length > 0) { console.error(`missing ${missing.join(", ")}`); process.exit(1); }
            console.log(`entry points present: ${Object.keys(ENTRY_POINTS).join(", ")}`);
          ' "$installed"
          test -f "$installed/dist/ui/index.html"
          # The runtime finds the tray program in the installed engine package, executable after the artifact, the
          # pack and the install.
          # shellcheck disable=SC2016 # the script is JavaScript; its template literals are not the shell's.
          node --input-type=module --eval '
            import { accessSync, constants } from "node:fs";
            import { join } from "node:path";
            import { pathToFileURL } from "node:url";
            const root = process.argv[1];
            const { resolveNativeTrayPath } = await import(pathToFileURL(join(root, "dist", "engine", "native", "native.js")).href);
            const tray = resolveNativeTrayPath({ packageRoot: root });
            if (tray === undefined) { console.error(`the Rerail at ${root} finds no tray program`); process.exit(1); }
            accessSync(tray, constants.X_OK);
            console.log(`tray program: ${tray}`);
          ' "$installed"
          for notice in LICENSE NOTICE; do
            test -f "$installed/$notice" || { echo "missing $notice" >&2; exit 1; }
          done
          # prepack stamps package.json's version into the host plugin manifests.
          for host in claude codex cursor; do
            node -e 'const [pkg, manifest] = process.argv.slice(1).map((path) => require(path)); if (manifest.version !== pkg.version) { console.error(process.argv[2] + " version " + manifest.version + " is not " + pkg.version); process.exit(1); }' \
              "$installed/package.json" "$installed/.$host-plugin/plugin.json"
          done
          (
            cd "$smoke_directory"
            node --input-type=module --eval 'import { nativeHealth } from "@neralabs/rerail"; if (!nativeHealth().ok) process.exit(1);'
          )
          # The installed package runs a .rerail rule file's tests from what it ships alone: the engine's typing programs
          # and the .rerail rule library.
          node scripts/check/ci/installed-rr-tests.mjs "$installed"

      # Core's tarball, the six engine packages' and engine-packages.json, side by side: what the install gates
      # serve from a registry and release.yml publishes.
      - name: Upload release tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rerail-package
          path: ${{ runner.temp }}/rerail-package
          if-no-files-found: error
