name: Package

# Builds the @neralabs/rerail package: native rules engines for every supported target, the TypeScript runtime,
# and the bundled UI, packed into one cross-platform tarball, uploaded as the `rerail-package` artifact of the
# calling run. release.yml publishes what this builds; env-matrix.yml installs it on Azure VMs. One build, so the
# environment matrix tests exactly what a release would ship.
#
# Each native build compiles through the Rust compile cache (.github/actions/rust-compile-cache): it starts from the
# newest store release-cache.yml saved on main as an artifact for that target, and compiles cold without one. Nothing
# here saves a store, and the Actions cache is not used.

on:
  workflow_call:
    outputs:
      tarball:
        description: File name of the packed tarball inside the rerail-package artifact
        value: ${{ jobs.package.outputs.tarball }}

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          # Linux engines link against the glibc 2.17 sysroot of napi-rs's cross toolchain: built on the runner's
          # own glibc (2.39 on Ubuntu 24.04), they failed to load on every older distribution. The toolchain's
          # linker also drops the symbol tables (`--strip`), which nothing loads at runtime
          # (scripts/build/release-engine.mjs).
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            windows_runtime_smoke: true
          # Cross-compiled on x64; no hosted Windows arm64 runner is used, so this engine is checked
          # by import inspection only here (env-matrix.yml runs it on a Windows 11 arm64 VM).
          - runner: windows-2025
            target: aarch64-pc-windows-msvc
            windows_runtime_smoke: false
    runs-on: ${{ matrix.runner }}
    # The compile cache's store: main's, read from its runs' artifacts.
    permissions:
      contents: read
      actions: read
    # A cold build (no store from main) took 37 minutes for Apple Silicon and 42 for Windows x64 after the rule engine
    # grew, and an Intel Mac was still compiling at 44: 45 cut the last two off. Keep this and release-cache.yml's the
    # same.
    timeout-minutes: 120
    steps:
      # Windows refuses paths over 260 characters unless Git is told to use long paths. `npm run check` keeps
      # tracked paths well under that (scripts/check/check-windows-paths.mjs), so this is the backstop.
      - name: Allow long paths in Git on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # No npm cache: on a tag, setup-node's cache misses on every runner but macOS arm64, and it saves on a miss.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # rust-toolchain.toml is the single pin: rustup reads it whenever cargo runs in this repository,
      # so the toolchain installed here must be the same channel.
      - id: rust-toolchain
        name: Read pinned Rust toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      # Compiles through sccache, starting from the store release-cache.yml saved on main for this target.
      - id: cc
        uses: ./.github/actions/rust-compile-cache
        with:
          name: release-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Build TypeScript
        run: npm run build:ts

      - name: Build native engine
        run: node scripts/build/release-engine.mjs ${{ matrix.target }}

      # Node 24's own Linux binaries need glibc 2.28, the floor docs/installation.md states. The runner's glibc is
      # newer, so the smokes below cannot catch an engine that needs more, or one that leaves a symbol for the
      # loading machine to define.
      - name: Check Linux engine loads on glibc 2.28
        if: runner.os == 'Linux'
        run: node scripts/check/check-linux-engine.mjs native/rerail_engine.*.node

      # Runners ship the Visual C++ runtime, so the load smokes below cannot catch an engine
      # that needs it; a clean Windows install does not have it.
      - name: Check Windows engine has no Visual C++ runtime dependency
        if: endsWith(matrix.target, '-windows-msvc')
        shell: bash
        run: node scripts/check/check-windows-runtime.mjs native/rerail_engine.*.node

      - name: Smoke Windows rerail CLI install planning
        if: matrix.windows_runtime_smoke
        run: node dist/cli/cli.js install --root . --agents omp,pi,claude-code,codex,cursor --dry-run

      - name: Provision Linux Secret Service
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools

      - name: Smoke macOS Keychain device storage
        if: startsWith(matrix.runner, 'macos')
        run: ./node_modules/.bin/vitest run integration/signed-profile-cli.test.ts

      - name: Smoke Linux Secret Service device storage
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          dbus-run-session -- bash <<'EOF'
          set -euo pipefail
          # --unlock reads the login keyring password from stdin and creates the
          # keyring when it does not exist; --start never creates it, which left
          # secret-tool with no default collection. The password only guards this
          # ephemeral session bus, so any non-empty throwaway value works.
          eval "$(gnome-keyring-daemon --unlock --components=secrets <<< 'rerail-ci')"
          if ! printf 'x' | secret-tool store --label=probe rerail-probe 1 \
            || [ "$(secret-tool lookup rerail-probe 1)" != 'x' ]; then
            echo '::error::Secret Service default collection is not writable after gnome-keyring-daemon --unlock' >&2
            exit 1
          fi
          secret-tool clear rerail-probe 1
          ./node_modules/.bin/vitest run integration/signed-profile-cli.test.ts
          EOF

      - name: Smoke Windows Credential Manager device storage
        if: matrix.windows_runtime_smoke
        run: ./node_modules/.bin/vitest run integration/signed-profile-cli.test.ts

      - name: Smoke native engine
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: ./node_modules/.bin/vitest run test/engine/native/native-health.test.ts

      - name: Compare native message selectors with Git
        if: matrix.target != 'aarch64-pc-windows-msvc'
        run: |
          git version --build-options
          node -p "process.platform + ' ' + process.arch + ' ' + process.version"
          ./node_modules/.bin/vitest run test/cli/headless-scan.test.ts -t "compares Git message selectors" --reporter=verbose

      - name: Check Git object invalidation, source reads, and path spelling on Windows
        if: matrix.windows_runtime_smoke
        shell: pwsh
        run: |
          $drive = [System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath())
          $format = [System.IO.DriveInfo]::new($drive).DriveFormat
          Write-Output "Temporary directory filesystem: $format"
          if ($format -ne 'NTFS') { throw "This object-invalidation check requires NTFS." }
          ./node_modules/.bin/vitest run test/cli/headless-scan.test.ts -t "same-size rewrite|distinguishes a missing source path|uses the filesystem spelling" --reporter=verbose

      - name: Check directory scope identity and concurrent Git evaluations on Linux
        if: runner.os == 'Linux'
        env:
          RERAIL_THREADS: "2"
        run: ./node_modules/.bin/vitest run test/cli/headless-scan.test.ts -t "two symlink targets differ in raw bytes|isolates concurrent evaluations" --reporter=verbose

      - name: Smoke Windows junction lifecycle
        if: matrix.windows_runtime_smoke
        run: ./node_modules/.bin/vitest run test/setup/updater.test.ts test/setup/harness-registration.test.ts -t "Windows.*junction"

      - name: Smoke Windows daemon launch handle isolation
        if: matrix.windows_runtime_smoke
        run: ./node_modules/.bin/vitest run test/runtime/windows-daemon-launch.test.ts

      - name: Upload native engine
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rerail-native-${{ matrix.target }}
          path: native/*.node
          if-no-files-found: error

  # The fixed GPU kernels compiled ahead of time for each target a release ships (decision 0645): Metal's tiers on
  # macOS (Xcode 26's Metal 4 compiler), CUDA's from the V100 on and AMD's on Linux, CUDA's on Windows, whose text
  # differs (LLP64). The compilers run without a GPU: the engine runs on its CPU device, and the text a kernel is
  # prepared from is the device's (measured on a GB10: every program a CUDA device asked for loaded from kernels a
  # CPU device shipped). NVRTC from NVIDIA's wheels (13 and 12: CUDA 13 compiles no sm_70), hiprtc from ROCm's
  # packages. The user installs their own compiler to run generated kernels (0645 §6); these only spare the fixed
  # kernels' first compile. AMD's kernels on Windows are compiled where they run (the HIP SDK's installer is not
  # automated here).
  kernels:
    name: GPU kernels ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: Metal
            targets: metal
          - runner: ubuntu-24.04
            name: CUDA and AMD on Linux
            targets: cuda,amd
          - runner: windows-2025
            name: CUDA on Windows
            targets: cuda
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ROCM_VERSION: "7.2"
    steps:
      - name: Allow long paths in Git on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      # Metal 4 (`apple10`, the M5's matrix unit) needs Xcode 26's compiler, and Xcode 26 ships it as a component.
      - name: Select Xcode 26 and its Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      # NVRTC alone, from NVIDIA's wheels: 13 for sm_75 on, 12 for sm_70 (the V100). Each directory holding a
      # library is a toolkit for the build (RERAIL_SHIP_CUDA_HOMES); each target takes the newest that compiles for it.
      - name: Install NVRTC 13 and 12
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --target "$RUNNER_TEMP/nvrtc13" "nvidia-cuda-nvrtc==13.*"
          python3 -m pip install --quiet --target "$RUNNER_TEMP/nvrtc12" "nvidia-cuda-nvrtc-cu12==12.9.*"
          if [ "$RUNNER_OS" = Windows ]; then lib='nvrtc64_*.dll'; sep=';'; else lib='libnvrtc.so*'; sep=':'; fi
          homes=$(find "$RUNNER_TEMP/nvrtc13" "$RUNNER_TEMP/nvrtc12" -name "$lib" ! -name '*builtins*' -exec dirname {} \; | sort -u | tr '\n' "$sep")
          test -n "$homes"
          if [ "$RUNNER_OS" = Windows ]; then homes=$(cygpath -w -p "${homes%"$sep"}"); fi
          echo "RERAIL_SHIP_CUDA_HOMES=$homes" >> "$GITHUB_ENV"

      # hiprtc and what it compiles with (comgr, the device libraries), from ROCm's packages.
      - name: Install ROCm's hiprtc
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends hip-runtime-amd comgr rocm-device-libs
          ls /opt/rocm/lib/libhiprtc.so*

      # The engine's tool (`rerail-engine kernels ship`), a debug build: the kernels' text does not depend on it.
      - name: Build the engine's tool
        working-directory: native
        run: cargo build --bin rerail-engine

      - name: Ship the kernels
        working-directory: native
        shell: bash
        env:
          RERAIL_GPU: cpu
          RERAIL_GPU_KERNELS: ${{ runner.temp }}/gpu-kernels-store
          RERAIL_SHIPPED_KERNELS: "off"
        run: ../target/debug/rerail-engine kernels ship ../rerail-kernels --targets ${{ matrix.targets }}

      - name: Upload the kernels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rerail-kernels-${{ runner.os }}
          path: rerail-kernels/gpu
          if-no-files-found: error

  package:
    name: Package
    needs: [native, kernels]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tarball: ${{ steps.packed-package.outputs.tarball }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      # No npm cache, as in the native job.
      - name: Set up Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci # NOSONAR githubactions:S6505 -- trusted native dependency lifecycle scripts are required

      - name: Assemble release package
        run: |
          npm run build:clean
          npm run build:ts
          npm run build:omp
          npm run build:events
          npm run build:cursor
          npm run build:claude
          npm run build:codex
          npm run build:ui

      - name: Download native engines
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rerail-native-*
          path: native
          merge-multiple: true

      # Beside the engines, where the engine looks for them (`rerail-kernels/` beside the library it was loaded from).
      - name: Download GPU kernels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rerail-kernels-*
          path: native/rerail-kernels/gpu
          merge-multiple: true

      - name: Verify every shipped GPU target is present
        run: |
          set -euo pipefail
          for target in apple7 apple10 sm_70 sm_80 sm_121 compute_70 compute_80 gfx1030 gfx1100 gfx942; do
            ls native/rerail-kernels/gpu/${target}/* >/dev/null 2>&1 || { echo "no kernels for ${target}" >&2; exit 1; }
          done
          du -sh native/rerail-kernels

      - name: Verify every supported native target is present
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc; do
            test -f "native/rerail_engine.${target}.node" || { echo "missing native/rerail_engine.${target}.node" >&2; exit 1; }
          done

      - id: packed-package
        name: Pack release package
        run: |
          npm pack --json > "$RUNNER_TEMP/packed-package.json"
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from "node:fs";
          const [{ filename }] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/packed-package.json`, "utf8"));
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${filename}\n`);
          EOF

      - name: Smoke installed release package
        env:
          PACKAGE_TARBALL: ${{ steps.packed-package.outputs.tarball }}
        run: |
          set -euo pipefail
          smoke_directory="$(mktemp -d)"
          installed="$smoke_directory/node_modules/@neralabs/rerail"
          npm install --prefix "$smoke_directory" "$PWD/$PACKAGE_TARBALL"
          "$smoke_directory/node_modules/.bin/rerail" --help
          # Every file the package runs by path (src/engine/package-root.ts ENTRY_POINTS: CLI, daemon, hooks, status
          # line, event stream), read from the installed package itself so a layout change cannot leave this stale.
          # shellcheck disable=SC2016 # the script is JavaScript; its template literals are not the shell's.
          node --input-type=module --eval '
            import { existsSync } from "node:fs";
            import { join } from "node:path";
            import { pathToFileURL } from "node:url";
            const root = process.argv[1];
            const { ENTRY_POINTS } = await import(pathToFileURL(join(root, "dist", "engine", "package-root.js")).href);
            const missing = Object.values(ENTRY_POINTS).filter((path) => !existsSync(join(root, path)));
            if (missing.length > 0) { console.error(`missing ${missing.join(", ")}`); process.exit(1); }
            console.log(`entry points present: ${Object.keys(ENTRY_POINTS).join(", ")}`);
          ' "$installed"
          test -f "$installed/dist/ui/index.html"
          for notice in LICENSE NOTICE; do
            test -f "$installed/$notice" || { echo "missing $notice" >&2; exit 1; }
          done
          # prepack stamps package.json's version into the host plugin manifests.
          for host in claude codex cursor; do
            node -e 'const [pkg, manifest] = process.argv.slice(1).map((path) => require(path)); if (manifest.version !== pkg.version) { console.error(process.argv[2] + " version " + manifest.version + " is not " + pkg.version); process.exit(1); }' \
              "$installed/package.json" "$installed/.$host-plugin/plugin.json"
          done
          (
            cd "$smoke_directory"
            node --input-type=module --eval 'import { nativeHealth } from "@neralabs/rerail"; if (!nativeHealth().ok) process.exit(1);'
          )

      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rerail-package
          path: ${{ steps.packed-package.outputs.tarball }}
          if-no-files-found: error
