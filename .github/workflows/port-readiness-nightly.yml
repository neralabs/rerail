name: Port readiness (nightly)

# Once a day, and on demand: generates every gated tool-pack's expected answers again from the pinned upstream and fails
# when they differ from the answers main's container in Azure Blob Storage holds under the same generator key (a
# transitive release that changes upstream's answers shows up here), then judges every rule again and saves the fresh
# results for pull requests to read. Pull requests judge rules against the stored answers (port-readiness.yml); this
# workflow keeps them honest.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-readiness-nightly
  cancel-in-progress: false

jobs:
  # As in ci.yml: dist/ and the release native engine, reused from main's build when its inputs are unchanged.
  build:
    name: Build
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release engine depends only on the engine's sources, the language registry (build.rs generates
      # its tables from languages/), the lockfile, the workspace profile, the toolchain and the napi CLI.
      # Most pull requests change none of them and reuse main's build.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  plan:
    name: List the gated tool-packs
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tool-packs: ${{ steps.plan.outputs.tool-packs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # plan.mjs imports only node: builtins, so no npm ci.
      - name: Set up Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - id: plan
        name: Plan every leg
        run: node conformance/port-readiness/plan.mjs

  # The drift check generates each tool-pack's answers afresh (--force: upstream on its own tests and on the corpus
  # files the goldens name, never the rest of the corpus) with no Azure token and no container, then the drift job
  # compares them with main's. It reports when upstream moved and uploads nothing, so the night tells main without
  # quietly regenerating main behind the maintainers. The two are split because no job holding the main identity, which
  # can write main's container, runs upstream's code.
  drift-generate:
    name: Generate the answers again (${{ matrix.tool-pack }})
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool-pack: ${{ fromJSON(needs.plan.outputs.tool-packs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps
        with:
          built: "true"

      - id: tool-pack
        name: Split the tool-pack
        env:
          TOOL_PACK: ${{ matrix.tool-pack }}
        run: |
          echo "pack=${TOOL_PACK%%/*}" >> "$GITHUB_OUTPUT"
          echo "tool=${TOOL_PACK#*/}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/generator-runtimes
        with:
          pack: ${{ steps.tool-pack.outputs.pack }}
          tool: ${{ steps.tool-pack.outputs.tool }}

      # No RERAIL_EXPECTED_ACCOUNT: the generator touches no container and writes only the local cache.
      - name: Generate the answers
        env:
          PACK: ${{ steps.tool-pack.outputs.pack }}
          TOOL: ${{ steps.tool-pack.outputs.tool }}
        run: npm run generate -- --pack "$PACK" --tool "$TOOL" --force

      - name: Hand the answers to the drift check
        uses: actions/upload-artifact@v7
        with:
          name: drift-expected-${{ steps.tool-pack.outputs.pack }}-${{ steps.tool-pack.outputs.tool }}
          path: .rerail/port-readiness/expected/
          if-no-files-found: error
          retention-days: 3

  # `npm run generate -- --drift` runs no generator: it compares the answers in the local cache (drift-generate's) with
  # the blob main's container holds under the same key, and exits 1 when they differ or main holds none, 2 when the
  # local answers are missing (their generation failed).
  drift:
    name: Answers match upstream
    needs: [plan, drift-generate]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token: azure/login's OIDC exchange for the main identity, which reads main's container here.
    permissions:
      contents: read
      id-token: write
    env:
      RERAIL_EXPECTED_ACCOUNT: ${{ vars.RERAIL_EXPECTED_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # The generator key hashes the tree as drift-generate checked it out, LFS objects included.
      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps

      - name: Download the regenerated answers
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: drift-expected-*
          path: .rerail/port-readiness/expected
          merge-multiple: true

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_MAIN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compare with main's answers
        env:
          TOOL_PACKS: ${{ needs.plan.outputs.tool-packs }}
        run: |
          set -euo pipefail
          drifted=()
          failed=()
          mkdir -p "$RUNNER_TEMP/drift"
          while IFS= read -r toolpack; do
            changes="$RUNNER_TEMP/drift/${toolpack%%/*}--${toolpack#*/}.md"
            set +e
            npm run generate -- --drift --pack "${toolpack%%/*}" --tool "${toolpack#*/}" --changes "$changes"
            status=$?
            set -e
            case "$status" in
              0) ;;
              1) drifted+=("$toolpack"); if [ -s "$changes" ]; then cat "$changes" >> "$GITHUB_STEP_SUMMARY"; fi ;;
              *) failed+=("$toolpack") ;;
            esac
          done < <(jq -r '.[]' <<< "$TOOL_PACKS")
          {
            echo "## Port readiness answers against the pinned upstream"
            echo
            if [ "${#drifted[@]}" -eq 0 ] && [ "${#failed[@]}" -eq 0 ]; then
              echo "Every tool-pack's regenerated answers are the ones main's container holds."
            fi
            if [ "${#drifted[@]}" -gt 0 ]; then
              echo "Upstream answers differently from main's stored answers for: ${drifted[*]}. Find what moved (a transitive release, a runtime left unpinned) and pin it: the pin moves the generator key, and the pull request that lands it carries the new answers."
            fi
            if [ "${#failed[@]}" -gt 0 ]; then
              echo "Not compared (the generation or the comparison failed; the logs say why): ${failed[*]}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#drifted[@]}" -gt 0 ] || [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::answers drifted from main's: ${drifted[*]:-none}; not compared: ${failed[*]:-none}"
            exit 1
          fi

  gates:
    name: Port readiness, uncached
    needs: build
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    # The called report job asks for issues and pull-requests to post on pull requests; a scheduled run posts nothing.
    # The called answers jobs log in to Azure with OIDC, as the main identity, and read main's container.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/port-readiness.yml
    with:
      no-cache: true
