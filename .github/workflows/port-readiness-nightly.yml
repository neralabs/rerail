name: Port readiness (nightly)

# Once a day, and on demand: re-records every gated tool-pack's upstream answers and fails when a committed recording
# no longer matches the pinned upstream (port-readiness:record --check), then judges every rule again, fails when a fresh
# verdict differs from the cached one under the same key (the key left out something the verdict depends on), and saves
# the fresh results for pull requests to read. Pull requests judge rules against the committed recordings
# (port-readiness.yml); this job keeps them honest.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-readiness-nightly
  cancel-in-progress: false

jobs:
  # As in ci.yml: dist/ and the release native engine, reused from main's build when its inputs are unchanged.
  build:
    name: Build
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release engine depends only on the engine's sources, the language registry (build.rs generates
      # its tables from languages/), the lockfile, the workspace profile, the toolchain and the napi CLI.
      # Most pull requests change none of them and reuse main's build.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  # The drift check runs the recorder as port-readiness-record.yml does, with --check: upstream on its own tests and on
  # the corpus files the goldens name, never the rest of the corpus. It reports when upstream moved and uploads nothing,
  # so the night tells main without quietly re-recording main behind the maintainers. It is its own job rather than a
  # call to that workflow because a called workflow's jobs may not ask for more than the caller grants, and the
  # recorder's authorize and publish jobs ask for write: GitHub would refuse the whole nightly run at startup, and
  # granting write here would hand the scheduled run a write token while upstream linters run.
  record-check:
    name: Recordings match upstream (${{ matrix.pack }} · ${{ matrix.tool }})
    needs: build
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # attestations: read is for the fetch, which checks each recording's attestation (recording/fetch.ts).
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      # port-readiness-record.yml's matrix: every gated tool-pack.
      matrix:
        include:
          - pack: python
            tool: ruff
          - pack: python
            tool: bandit
          - pack: react
            tool: eslint-plugin-react
          - pack: react
            tool: eslint-plugin-react-hooks
          - pack: javascript
            tool: eslint
          - pack: javascript
            tool: eslint-plugin-unicorn
          - pack: typescript
            tool: typescript-eslint
          - pack: typescript
            tool: eslint-plugin-vitest
          - pack: next
            tool: eslint-plugin-next
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/node-deps

      - name: Build the package
        run: npm run build:js

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # The recorder's own cache, so a run on main warms what the next maintainer recording reads. The paths are
      # port-readiness-record.yml's exactly, which GitHub requires for one to restore what the other saved. `recordings/*`
      # rather than `recordings`, so the negation drops upload/: the cache archives each path the glob lists, recursively.
      - name: Restore the upstream runtimes, checkouts, corpus and recordings
        uses: actions/cache@v6
        with:
          path: |
            .rerail/port-readiness/runtimes
            .rerail/port-readiness/upstream
            .rerail/port-readiness/corpus
            .rerail/port-readiness/recordings/*
            !.rerail/port-readiness/recordings/upload
          key: port-readiness-record-${{ matrix.pack }}-${{ matrix.tool }}-${{ hashFiles('conformance/recorders/port-readiness/runtimes/**', format('packs/{0}/upstream/{1}/gates.yaml', matrix.pack, matrix.tool), 'conformance/port-readiness/corpus-tasks.json') }}
          restore-keys: |
            port-readiness-record-${{ matrix.pack }}-${{ matrix.tool }}-

      - name: Fetch the recording the manifest names
        continue-on-error: true
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run port-readiness -- fetch --pack "$PACK" --tool "$TOOL"

      - name: Report drift against the committed manifest
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: npm run port-readiness:record -- --pack "$PACK" --tool "$TOOL" --check

  gates:
    name: Port readiness, re-judged
    needs: build
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    # The called report job asks for these to post on pull requests; a scheduled run posts nothing. The called gates
    # job reads the recordings' attestations.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      attestations: read
    uses: ./.github/workflows/port-readiness.yml
    with:
      no-cache: true
