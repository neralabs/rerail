name: Port readiness (nightly)

# Once a day, and on demand: re-records every gated tool-pack's upstream answers and fails when a committed recording
# no longer matches the pinned upstream (port-readiness:record --check), then judges every rule again and saves the fresh
# results for pull requests to read, and fails when an upstream tool has published a stable release newer than the one
# its tool-pack pins (port-readiness:upstream-releases). Pull requests judge rules against the committed recordings
# (port-readiness.yml); this job keeps them honest.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-readiness-nightly
  cancel-in-progress: false

jobs:
  # As in ci.yml: dist/ and the release native engine, reused from main's build when its inputs are unchanged.
  build:
    name: Build
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - id: rust-toolchain
        name: Read pinned Rust toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The release engine depends only on the engine's sources, the language registry (build.rs generates
      # its tables from languages/), the lockfile, the workspace profile, the toolchain and the napi CLI.
      # Most pull requests change none of them and reuse main's build.
      - id: napi
        name: Read the napi CLI version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@napi-rs/cli']")" >> "$GITHUB_OUTPUT"

      - id: native-cache
        name: Restore the release native engine
        uses: actions/cache@v6
        with:
          path: |
            native/*.node
            native/index.js
            native/index.d.ts
          key: rerail-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.channel }}-napi${{ steps.napi.outputs.version }}-${{ hashFiles('native/**', '!native/*.node', '!native/index.js', '!native/index.d.ts', 'languages/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache cargo artifacts
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rerail-release-${{ runner.os }}-${{ steps.rust-toolchain.outputs.channel }}-

      - uses: ./.github/actions/node-deps

      - name: Build the native engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npm run build:native

      - name: Build the package
        run: npm run build:js

      - name: Upload the built package
        uses: actions/upload-artifact@v7
        with:
          name: built
          path: |
            dist/
            native/*.node
            native/index.js
            native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  # Every tool-pack's derived data derived again from its pins, failing where it differs from what the cache holds for
  # the same inputs, beside the authored data from S3 (.github/workflows/pack-test-data.yml): the record check and the
  # gates below read its artifact. id-token: its legs read the authored data from S3.
  pack-test-data:
    name: Pack test data, derived again
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pack-test-data.yml
    with:
      rederive: true

  # The drift check runs the recorder with --check: upstream on its own tests and on the corpus files the goldens name,
  # never the rest of the corpus. It reports when upstream moved and writes nothing, so the night tells main without
  # quietly re-recording main behind the maintainers. Read-only, and saving no cache: the recorder runs upstream's code
  # and unlocked Composer packages, and a save after that would hand main's scope whatever that code wrote. --check
  # compares upstream's case sources with the derived ones, from the pack-test-data artifact.
  record-check:
    name: Recordings match upstream (${{ matrix.pack }} · ${{ matrix.tool }})
    needs: [build, pack-test-data]
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Every gated tool-pack.
      matrix:
        include:
          - pack: python
            tool: ruff
          - pack: python
            tool: bandit
          - pack: react
            tool: eslint-plugin-react
          - pack: react
            tool: eslint-plugin-react-hooks
          - pack: javascript
            tool: eslint
          - pack: javascript
            tool: eslint-plugin-unicorn
          - pack: typescript
            tool: typescript-eslint
          - pack: typescript
            tool: eslint-plugin-vitest
          - pack: next
            tool: eslint-plugin-next
          - pack: php
            tool: phpcs
          - pack: php
            tool: phpstan
          - pack: php
            tool: psalm
          - pack: blade
            tool: tlint
          - pack: blade
            tool: blade-parser
          - pack: blade
            tool: bladestan
          - pack: sql
            tool: sqlfluff
          - pack: rust
            tool: clippy
          - pack: vue
            tool: eslint-plugin-vue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/lfs

      - uses: ./.github/actions/pack-test-data

      - uses: ./.github/actions/node-deps

      - name: Build the package
        run: npm run build:js

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # The php and blade tool-packs run their upstream under the exact PHP their runtime pins, and Composer installs it.
      - name: Set up the pinned PHP and Composer
        if: matrix.pack == 'php' || matrix.pack == 'blade'
        uses: ./.github/actions/php

      # Clippy's recorder runs the rustup toolchain its runtime pins (runtimes/<runtime>/rust-toolchain.toml: an exact
      # release with clippy), and refuses any other build; no other leg needs Rust.
      - id: clippy-toolchain
        name: Read the Rust toolchain Clippy's runtime pins
        if: matrix.tool == 'clippy'
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          runtime="$(sed -n 's/^  runtime: *\([a-z0-9._-]*\) *$/\1/p' "packs/$PACK/upstream/$TOOL/gates.yaml")"
          [ -n "$runtime" ] || { echo "::error::packs/$PACK/upstream/$TOOL/gates.yaml has no upstream.runtime line this step reads"; exit 1; }
          toolchain="conformance/recorders/port-readiness/runtimes/$runtime/rust-toolchain.toml"
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$toolchain")"
          [ -n "$channel" ] || { echo "::error::$toolchain has no channel line this step reads"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain with clippy
        if: matrix.tool == 'clippy'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.clippy-toolchain.outputs.channel }}
          components: clippy

      # The recordings the lock names, from the cache the gate legs save into (port-readiness.yml, the same key): when
      # a fresh corpus.json differs from the locked one, --check compares the two, and without it says it could not.
      - id: lock
        name: Read the recordings the lock names
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          lock="packs/$PACK/upstream/$TOOL/recording.lock"
          recording="$(jq -r '.files["recording.json"].sha256' "$lock")"
          corpus="$(jq -r '.files["corpus.json"].sha256' "$lock")"
          {
            echo "key=port-readiness-recording-$PACK-$TOOL-$recording-$corpus"
            echo "paths<<EOF"
            echo ".rerail/port-readiness/recordings/$recording.json"
            echo ".rerail/port-readiness/recordings/$corpus.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the recordings the lock names
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.lock.outputs.paths }}
          key: ${{ steps.lock.outputs.key }}

      - name: Report drift against the committed manifest
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: npm run port-readiness:record -- --pack "$PACK" --tool "$TOOL" --check

  gates:
    name: Port readiness, uncached
    needs: [build, pack-test-data]
    # Forks that turn scheduled workflows back on skip it; change the owner if the repository moves.
    if: github.repository_owner == 'neralabs'
    # The called report job asks for these to post on pull requests; a scheduled run posts nothing. The called gates
    # job reads the pack-test-data artifact.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/port-readiness.yml
    with:
      no-cache: true

  # Red when an upstream tool has published a stable release newer than its tool-pack's pin: gates.yaml's version and
  # the runtime's pin under conformance/recorders/port-readiness/runtimes/, against npm, PyPI, Packagist and the Rust
  # channel (Clippy, pinned by rust-toolchain.toml). The job summary lists every tool-pack. Bumping a pin means
  # recording the tool-pack again (docs/port-readiness.md, "Upstream releases").
  upstream-releases:
    name: Upstream releases are not newer than the pins
    # Main's pins; forks that turn scheduled workflows back on skip it.
    if: github.repository_owner == 'neralabs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/node-deps

      - name: Check the upstream releases
        run: npm run port-readiness:upstream-releases
