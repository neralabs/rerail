# Automated PR review by neralabs/reviewer, posted as the neralabs-reviewer app. See
# https://github.com/neralabs/reviewer (docs/configuration.md for every input).
#
# The bot reviews only when asked: request the @neralabs/reviewer team as a reviewer (it clears the request
# after each review, so request it again for another), or comment "@neralabs-reviewer review"
# ("@neralabs-reviewer help" lists the commands). Only people with write access can trigger it. Pushes do
# nothing. The review reads the PR and its CI results; it never builds, runs or pushes anything. It never
# approves (allow_approve: false): a PR's text is the model's input, so its verdict is a comment review and
# never counts toward this repo's required review. It reviews only pull requests whose head branch is in this
# repo: a fork PR is never reviewed by the bot, whoever asks.
name: reviewer

on:
  # pull_request_target, not pull_request: GitHub runs this file from main, so a PR can't rewrite its own
  # reviewer configuration (approvals, which reviewer version runs). Safe because nothing from the PR is
  # executed: the reviewer checks the PR out as data and never runs it. Fork PRs never get the model key or
  # the app key, on any trigger: the `same-repo` job below holds neither key and calls the reviewer only when the
  # PR's head repo is this repo. An issue comment's event carries no head repo, so the job asks the API, the same
  # way for every trigger. (The called workflow's own `gate` job checks review requests and finding-thread replies,
  # but not a top-level comment command, which would otherwise review a fork PR with both keys.)
  pull_request_target:
    types: [review_requested]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Read-only. Writes go through a neralabs-reviewer token the reviewer mints per job, scoped to pull requests.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  # No secrets and a read-only token: decides whether the reviewer, which gets both keys, runs at all.
  same-repo:
    name: Same-repository pull request
    # A comment on an issue that is not a pull request has nothing to review.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      same_repo: ${{ steps.head.outputs.same_repo }}
    steps:
      - id: head
        name: Resolve the pull request's head repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::the $GITHUB_EVENT_NAME event names no pull request"
            exit 1
          fi
          # A deleted fork leaves head.repo null: that is not this repo either.
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.repo.full_name // ""')"
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then same_repo=true; else same_repo=false; fi
          echo "same_repo=$same_repo" >> "$GITHUB_OUTPUT"
          echo "pull request #$PR: head repository ${head_repo:-(deleted)}, same_repo=$same_repo"

  reviewer:
    needs: same-repo
    if: needs.same-repo.outputs.same_repo == 'true'
    # Pinned to a release commit. `reviewer_ref` is where the called workflow loads the reviewer's own code
    # from, so it is the same commit: Dependabot moves `uses:` alone, and `npm run check:pins` fails until
    # `npm run deps:sync` brings `reviewer_ref` along (scripts/deps/sync-pins.mjs).
    uses: neralabs/reviewer/.github/workflows/review.yml@a5661b2d02971b4e51667c230eb7664c699d643a # v0.1.0
    with:
      app_client_id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
      reviewer_ref: a5661b2d02971b4e51667c230eb7664c699d643a
      allow_approve: false
      handle: "@neralabs-reviewer"
      bot_login: neralabs-reviewer[bot]
      # Claude Opus 5.5 on Amazon Bedrock. The repo variable REVIEWER_MODEL holds the pinned model id or
      # inference profile, so no AWS account id sits in this public file. Until AWS credits cover the dedicated
      # reviewer account (from 1 November) it is the main account's tagged profile, with the main account's
      # key below; then set REVIEWER_MODEL to us.anthropic.claude-opus-5-5 and pass
      # secrets.REVIEWER_BEDROCK_API_KEY instead.
      provider: bedrock
      model: ${{ vars.REVIEWER_MODEL }}
      aws_region: us-east-1
    # Named, not `secrets: inherit`: the reviewer gets these and nothing else this repo can see.
    secrets:
      REVIEWER_APP_PRIVATE_KEY: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
      REVIEWER_BEDROCK_API_KEY: ${{ secrets.REVIEWER_BEDROCK_API_KEY_MAIN }}
