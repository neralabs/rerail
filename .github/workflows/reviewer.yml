# Automated PR review by neralabs/reviewer, posted as neralabs-ci. See neralabs/reviewer SPEC.md.
#
# The bot reviews only when asked: request the @neralabs/reviewer team as a reviewer (it clears the request
# after each review, so request it again for another), or comment "@neralabs-ci review" ("@neralabs-ci help"
# lists the commands). Only people with write access can trigger it. Pushes do nothing. The review reads the
# PR and its CI results; it never builds, runs or pushes anything. It approves only PRs that pass every
# low-risk rule (neralabs/reviewer SPEC.md: no blockers, CI green, no high-risk paths, not from a fork or a
# bot), and its approval counts toward this repo's required review. Like a human approval, it stays through
# later pushes; "@neralabs-ci stop" withdraws it.
name: reviewer

on:
  # pull_request_target, not pull_request: GitHub runs this file from main, so a PR can't rewrite its own
  # reviewer configuration (approvals, which reviewer version runs). Safe because nothing from the PR is
  # executed: the reviewer checks the PR out as data, and fork PRs are skipped.
  pull_request_target:
    types: [review_requested]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Read-only. Writes go through a neralabs-ci token the reviewer mints per job, scoped to pull requests.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  reviewer:
    uses: neralabs/reviewer/.github/workflows/review.yml@main
    with:
      app_client_id: ${{ vars.REVIEWER_APP_CLIENT_ID }}
      reviewer_ref: main # keep equal to the @ref above
      allow_approve: true
    secrets: inherit
