name: Port readiness (record)

# The only workflow that writes a port readiness recording. Pull request CI never runs an upstream linter, so it cannot
# tell a recording that is what upstream says from one a contributor wrote to make their own rule pass; in a public
# repository that would be a way to walk a rule past the gates. So recordings are made here, in a run a maintainer
# starts, with the recorder and the runtimes from the base branch. A pull request that supplies its own recording fails
# in port-readiness.yml, where the fetch finds no such asset.
#
# Started two ways, both by someone who can write here:
#   * the `record-port-readiness` label on a pull request (removed again when the run starts, so a second label re-runs
#     it), which records the head commit the label was put on;
#   * workflow_dispatch from main, with a pack and a tool (empty for every one), and either a pull request and the head
#     sha you reviewed, or neither, to record main itself.
# Only a run from main, for main or a pull request into main, records: port-readiness.yml takes a recording only with the
# attestation publish makes, which the fetch checks was made by this workflow run from refs/heads/main
# (recording/fetch.ts). authorize refuses any other run before a leg records — one dispatched from another branch, and
# a stacked pull request, which is recorded once it targets main.
# port-readiness-nightly.yml checks for drift in a read-only job of its own and does not call this workflow.
#
# Three jobs, so that nothing a pull request chose runs where a write token is:
#   authorize  checks who started the run and fixes what it records: the pull request's head commit, the base
#              commit the recorder comes from, the tool-packs, and the release the recordings go to;
#   record     one read-only leg per tool-pack: it runs the recorder over the pull request's packs/ at that head and
#              uploads what the recorder wrote (the lock, the case sources it copied, the rows it added to UPSTREAM.md,
#              the two recordings) as an artifact;
#   publish    the only job with a write token. It runs no recorder, node or npm, and reads every leg's artifact as
#              data: it checks each path and digest, attests the recordings, uploads them, and commits every leg's
#              files as one commit on the recorded head, pushed once.
#
# Where that commit goes: a pull request from a branch here gets it on that branch, as a fast-forward. A fork's goes to
# `port-readiness-recordings/pr-<n>` here, with a comment saying to merge it: the default token cannot write to a fork,
# and a token that could would hand a fork pull request write access to its own base. A run with no pull request pushes
# `port-readiness-recordings/run-<id>` and opens no pull request from it; a person does, from the link the run's summary
# gives, so a recording never reaches a protected branch without review. The summary also holds what moved, per rule.
# A push made with the workflow token starts no workflow, so CI runs on a recording commit pushed to a pull request's
# branch once someone pushes to it again or closes and reopens the pull request; a pull request a person opens from
# `run-<id>` runs CI as any other does.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: The pack to record, or empty for every gated tool-pack.
        type: string
        default: ""
      tool:
        description: The upstream tool to record, or empty for every one of the pack's.
        type: string
        default: ""
      pr:
        description: The pull request into main to record for; empty records main, on a branch to open a pull request from by hand. Run it from main.
        type: string
        default: ""
      sha:
        description: With a pull request, the head commit you reviewed; the run records that commit and no other.
        type: string
        default: ""
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: port-readiness-record-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: false

env:
  # GitHub holds at most 1,000 assets in a release. authorize moves on to the next `port-readiness-recordings-<n>` once
  # the newest holds RELEASE_ROLL_AT (a run adds at most two per tool-pack), and publish refuses an upload that would
  # pass the cap.
  RELEASE_ROLL_AT: 900
  RELEASE_CAP: 1000

jobs:
  # The label trigger runs on `pull_request_target`, which is the base branch's workflow, so it only starts for a
  # maintainer's label and only after this gate: `record-port-readiness` from someone who can write here.
  authorize:
    name: Authorize
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'record-port-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr: ${{ steps.target.outputs.pr }}
      head: ${{ steps.target.outputs.head }}
      fork: ${{ steps.target.outputs.fork }}
      branch: ${{ steps.target.outputs.branch }}
      base: ${{ steps.target.outputs.base }}
      base-sha: ${{ steps.target.outputs.base-sha }}
      legs: ${{ steps.legs.outputs.legs }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - id: target
        name: Read who started the run and what it records
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          LABEL_PR: ${{ github.event.pull_request.number }}
          LABEL_HEAD: ${{ github.event.pull_request.head.sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [ "$EVENT" = "pull_request_target" ]; then
            permission="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)"
            case "$permission" in
              admin|write|maintain) ;;
              *) fail "$ACTOR cannot start a recording (permission $permission)" ;;
            esac
            pr="$LABEL_PR"
            # The commit the maintainer labelled, from the event: the head as it is later may be a newer push.
            head="$LABEL_HEAD"
            # Removed again so a maintainer can re-label to record once more.
            gh api -X DELETE "repos/$REPO/issues/$pr/labels/record-port-readiness" > /dev/null || true
          else
            pr="$INPUT_PR"
            head="$INPUT_SHA"
          fi
          if [ -n "$pr" ]; then
            printf '%s' "$pr" | grep -Eqx '[1-9][0-9]*' || fail "pr must be a pull request number"
            printf '%s' "$head" | grep -Eqx '[0-9a-f]{40}' || fail "recording for a pull request needs sha: the full head commit you reviewed"
            gh api "repos/$REPO/pulls/$pr" > "$RUNNER_TEMP/pull.json"
            base="$(jq -r .base.ref "$RUNNER_TEMP/pull.json")"
            branch="$(jq -r .head.ref "$RUNNER_TEMP/pull.json")"
            if [ "$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/pull.json")" = "$REPO" ]; then fork=false; else fork=true; fi
            git check-ref-format "refs/heads/$branch" || fail "pull request #$pr's branch name is not one git accepts"
            base_sha="$(gh api "repos/$REPO/git/ref/heads/$base" --jq .object.sha)"
          else
            [ -z "$head" ] || fail "sha goes with pr: name the pull request it is the head of"
            case "$GITHUB_REF" in
              refs/heads/*) ;;
              *) fail "a run with no pull request records the branch it is started on, and $GITHUB_REF is not a branch" ;;
            esac
            base="$GITHUB_REF_NAME"
            base_sha="$GITHUB_SHA"
            branch=""
            fork=false
          fi
          git check-ref-format "refs/heads/$base" || fail "the base branch name is not one git accepts"
          # The gates' fetch takes a recording only with this workflow's attestation from refs/heads/main, the ref the
          # run itself started from (under the label, the pull request's base); the base is the recorder that runs.
          # Anything else would be uploaded and committed only for every gate leg to refuse it.
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$base" != "main" ]; then
            fail "this run is from $GITHUB_REF for base $base: only a run from refs/heads/main, for main or a pull request into main, is attested, and the gates refuse an unattested recording"
          fi
          # Every leg records against this one base commit, so they all run the same recorder whatever lands meanwhile.
          {
            echo "pr=$pr"
            echo "head=$head"
            echo "fork=$fork"
            echo "branch=$branch"
            echo "base=$base"
            echo "base-sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - id: legs
        name: Choose the tool-packs to record
        env:
          WANT_PACK: ${{ inputs.pack }}
          WANT_TOOL: ${{ inputs.tool }}
          # Every gated tool-pack, as conformance/port-readiness/plan.mjs finds them but without its shards, since
          # recording a tool-pack is one run of the live adapter; plan.test.ts fails when the two lists differ.
          TOOL_PACKS: |
            [
              {"pack": "python", "tool": "ruff"},
              {"pack": "python", "tool": "bandit"},
              {"pack": "react", "tool": "eslint-plugin-react"},
              {"pack": "react", "tool": "eslint-plugin-react-hooks"},
              {"pack": "javascript", "tool": "eslint"},
              {"pack": "javascript", "tool": "eslint-plugin-unicorn"},
              {"pack": "typescript", "tool": "typescript-eslint"},
              {"pack": "typescript", "tool": "eslint-plugin-vitest"},
              {"pack": "next", "tool": "eslint-plugin-next"}
            ]
        run: |
          set -euo pipefail
          legs="$(jq -c --arg pack "$WANT_PACK" --arg tool "$WANT_TOOL" \
            '[.[] | select(($pack == "" or .pack == $pack) and ($tool == "" or .tool == $tool))]' <<< "$TOOL_PACKS")"
          if [ "$legs" = "[]" ]; then
            echo "::error::no gated tool-pack is pack '$WANT_PACK', tool '$WANT_TOOL'"
            exit 1
          fi
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

      # The recorder writes this release into every lock, and publish uploads to it and nowhere else. It is the newest
      # `port-readiness-recordings[-<n>]`, or the next one once the newest holds RELEASE_ROLL_AT assets; a lock keeps
      # naming the release that holds its recordings, so an older commit keeps fetching from the older one.
      - id: release
        name: Choose the release the recordings go to
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          named() { if [ "$1" -eq 1 ]; then echo port-readiness-recordings; else echo "port-readiness-recordings-$1"; fi; }
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/releases.txt"
          newest="$(sed -nE 's/^port-readiness-recordings(-([2-9]|[1-9][0-9]+))?$/\2/p' "$RUNNER_TEMP/releases.txt" | sed 's/^$/1/' | sort -n | tail -n 1)"
          if [ -z "$newest" ]; then
            release="$(named 1)"
          else
            release="$(named "$newest")"
            id="$(gh api "repos/$REPO/releases/tags/$release" --jq .id)"
            count="$(gh api --paginate "repos/$REPO/releases/$id/assets?per_page=100" --jq '.[].name' | wc -l)"
            if [ "$count" -ge "$RELEASE_ROLL_AT" ]; then
              echo "$release holds $count assets: this run starts $(named $((newest + 1)))"
              release="$(named $((newest + 1)))"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  record:
    name: Record (${{ matrix.pack }} · ${{ matrix.tool }})
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Read-only: this job runs upstream's code and reads the pull request's packs/, so the write token is publish's.
    # attestations: read is for the fetch of the recording the committed lock names, which checks its attestation.
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.authorize.outputs.legs) }}
    steps:
      # The recorder, the runtimes and the workflow come from the base branch, never from the pull request: a fork
      # must not be able to change what records its own rules. Only the pull request's packs/ and rule list are read
      # from its head, below, after everything that installs or builds has run.
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false

      # Every cache in this job is restored, never saved, by a run that takes a pull request's packs/: under
      # pull_request_target a save lands in the base branch's scope, which ci.yml, release.yml and every other workflow
      # on main restore, and the recorder runs code a pull request's gates.yaml names before the post-job saves.
      - uses: ./.github/actions/lfs
        with:
          save: ${{ needs.authorize.outputs.pr == '' }}

      # Before the pull request's packs/ are taken: they are npm workspaces, and `npm ci` runs their scripts.
      - uses: ./.github/actions/node-deps
        with:
          npm-cache: ${{ needs.authorize.outputs.pr == '' }}

      - name: Build the package
        run: npm run build:js

      # Exactly the commit that was authorized: a push after the label or the dispatch fails here rather than being
      # recorded. packs/ is replaced, not laid over the base branch's, so it is the pull request's exactly — no file only
      # the base branch has, none the pull request deleted — and what the recorder changes is all that differs from it.
      - name: Take the pull request's packs and rule list
        if: needs.authorize.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "refs/pull/$PR/head:refs/remotes/pr/head"
          moved="$(git rev-parse refs/remotes/pr/head)"
          if [ "$moved" != "$HEAD_SHA" ]; then
            echo "::error::pull request #$PR moved from $HEAD_SHA to $moved after it was authorized: review it and record again"
            exit 1
          fi
          git rm -r -q -f -- packs conformance/port-readiness/corpus-tasks.json
          git checkout "$HEAD_SHA" -- packs conformance/port-readiness/corpus-tasks.json
          echo "recording for pull request #$PR at $HEAD_SHA"

      # A fork records against the upstream the base branch's gates.yaml names. Its repository, commit, runtime and test
      # paths decide which code the recorder runs and whose tests it records, so a fork that changed them would record
      # answers of its own. Only `popularity`, `known_gaps`, `real_code_gaps` and comments may differ; a branch here is not
      # checked, since whoever can push one can already run any workflow with this repository's token.
      - name: Refuse a fork's change to the upstream it is recorded against
        if: needs.authorize.outputs.fork == 'true'
        env:
          PR: ${{ needs.authorize.outputs.pr }}
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          manifest="packs/$PACK/upstream/$TOOL/gates.yaml"
          git show "HEAD:$manifest" > "$RUNNER_TEMP/base-gates.yaml" 2> /dev/null || : > "$RUNNER_TEMP/base-gates.yaml"
          if ! node -e '
            const { parse } = require("yaml");
            const { readFileSync } = require("node:fs");
            const pinned = (file) => {
              const { popularity, known_gaps, real_code_gaps, ...rest } = parse(readFileSync(file, "utf8")) ?? {};
              return JSON.stringify(rest);
            };
            process.exit(pinned(process.argv[1]) === pinned(process.argv[2]) ? 0 : 1);
          ' "$RUNNER_TEMP/base-gates.yaml" "$manifest"; then
            echo "::error::pull request #$PR comes from a fork and changes $manifest beyond popularity, known_gaps and real_code_gaps: land that change on the base branch first, then record"
            exit 1
          fi

      # The recorder runs the pinned upstream linters: uv installs their Python runtimes from the committed pins. No
      # lockfile is committed, so a transitive release that changes upstream's answers shows up as drift here.
      # uv's cache holds what the runtimes install from, and the runtimes cache trusts a runtime on the `.tree.sha256`
      # written beside it after the install, so it is saved under the same rule as the caches above. A Python runtime's
      # .venv/bin/python links to uv's interpreter under UV_PYTHON_INSTALL_DIR ($RUNNER_TEMP), which no cache keeps, so
      # the recorder installs a restored Python runtime again when that link no longer resolves (in CI, on every
      # restored run).
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          save-cache: ${{ needs.authorize.outputs.pr == '' }}

      # Restored only here; saved below only by a run that took nothing from a pull request. A cached runtime is trusted
      # on the `.tree.sha256` stored beside it in the same cache, and a cached Python runtime only while its interpreter
      # resolves. upload/ is left out — `recordings/*` lists the directory's children, so the negation drops upload/ (a
      # bare `recordings` would archive all of it, upload/ included) — and publish takes only the two recordings the
      # lock names, whatever an earlier run left there.
      - name: Restore the upstream runtimes, checkouts, corpus and recordings
        uses: actions/cache/restore@v6
        with:
          path: |
            .rerail/port-readiness/runtimes
            .rerail/port-readiness/upstream
            .rerail/port-readiness/corpus
            .rerail/port-readiness/recordings/*
            !.rerail/port-readiness/recordings/upload
          key: port-readiness-record-${{ matrix.pack }}-${{ matrix.tool }}-${{ hashFiles('conformance/recorders/port-readiness/runtimes/**', format('packs/{0}/upstream/{1}/gates.yaml', matrix.pack, matrix.tool), 'conformance/port-readiness/corpus-tasks.json') }}
          restore-keys: |
            port-readiness-record-${{ matrix.pack }}-${{ matrix.tool }}-

      # The recording the committed manifest names, so the per-rule summary has something to compare against. It is
      # not an error for it to be missing: without a lock the summary calls it a first recording, and with a lock whose
      # recording could not be fetched it warns that it was not compared.
      - name: Fetch the recording the manifest names
        continue-on-error: true
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run port-readiness -- fetch --pack "$PACK" --tool "$TOOL"

      - name: Record
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          RELEASE: ${{ needs.authorize.outputs.release }}
        run: npm run port-readiness:record -- --pack "$PACK" --tool "$TOOL" --release "$RELEASE" --changes "$RUNNER_TEMP/recording-changes.md"

      # Saved only by a run that took nothing from a pull request: a dispatch that records a branch here.
      - name: Save the upstream runtimes, checkouts, corpus and recordings
        if: always() && needs.authorize.outputs.pr == ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            .rerail/port-readiness/runtimes
            .rerail/port-readiness/upstream
            .rerail/port-readiness/corpus
            .rerail/port-readiness/recordings/*
            !.rerail/port-readiness/recordings/upload
          key: port-readiness-record-${{ matrix.pack }}-${{ matrix.tool }}-${{ hashFiles('conformance/recorders/port-readiness/runtimes/**', format('packs/{0}/upstream/{1}/gates.yaml', matrix.pack, matrix.tool), 'conformance/port-readiness/corpus-tasks.json') }}

      # What publish uploads and commits, as data: the lock, the two recordings it names (not the rest of upload/), the
      # per-rule summary, and every file the recorder wrote into the tree — the lock, the case sources it copied, and
      # UPSTREAM.md with their rows — listed NUL-separated and in a tar, since case sources are named like `$foo.js`.
      - name: Collect what the recorder wrote
        env:
          PACK: ${{ matrix.pack }}
          TOOL: ${{ matrix.tool }}
          PR: ${{ needs.authorize.outputs.pr }}
          HEAD_SHA: ${{ needs.authorize.outputs.head }}
          BASE_SHA: ${{ needs.authorize.outputs.base-sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/leg"
          mkdir -p "$out/assets"
          lock="packs/$PACK/upstream/$TOOL/recording.lock"
          cp "$lock" "$out/recording.lock"
          mapfile -t assets < <(jq -r '.files[].asset' "$lock")
          [ "${#assets[@]}" -eq 2 ] || { echo "::error::$lock does not name two recordings"; exit 1; }
          for name in "${assets[@]}"; do cp ".rerail/port-readiness/recordings/upload/$name" "$out/assets/"; done
          if [ -s "$RUNNER_TEMP/recording-changes.md" ]; then cp "$RUNNER_TEMP/recording-changes.md" "$out/changes.md"; fi
          # The index holds the recorded commit's packs/ (the pull request's, taken whole above, or the branch's), so
          # its difference from that commit is the recorder's. --force: .gitignore does not decide what the gates read.
          if [ -n "$PR" ]; then parent="$HEAD_SHA"; else parent="$BASE_SHA"; fi
          where=("packs/$PACK/upstream/$TOOL" "packs/$PACK/licenses")
          git add -A --force -- "${where[@]}"
          removed="$(git diff --cached --name-only --no-renames --diff-filter=DT "$parent" -- "${where[@]}")"
          if [ -n "$removed" ]; then
            echo "::error::the recorder removed or retyped files it only ever adds or edits: $removed"
            exit 1
          fi
          git diff --cached --name-only --no-renames -z "$parent" -- "${where[@]}" > "$out/changed.list"
          if [ -s "$out/changed.list" ]; then tar --null --files-from="$out/changed.list" -cf "$out/changed.tar"; fi
          tr '\0' '\n' < "$out/changed.list" | sed -n '1,20p'
          echo "$(tr -cd '\0' < "$out/changed.list" | wc -c) file(s) to commit"

      - name: Upload the recording
        uses: actions/upload-artifact@v7
        with:
          name: port-readiness-recording-${{ matrix.pack }}-${{ matrix.tool }}
          path: ${{ runner.temp }}/leg/
          if-no-files-found: error
          retention-days: 14

  # The only job with a write token, and it runs nothing the pull request or the record legs chose: no recorder, node
  # or npm, and git only as plumbing on the base branch's checkout, building the commit in an index of its own from
  # files that were checked first. It runs once every leg has recorded, so a run lands all its tool-packs or none.
  publish:
    name: Publish
    needs: [authorize, record]
    if: ${{ !cancelled() && needs.record.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token and attestations: write sign the recordings' attestation, which the gates' fetch requires of every asset.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ needs.authorize.outputs.pr }}
      HEAD_SHA: ${{ needs.authorize.outputs.head }}
      FORK: ${{ needs.authorize.outputs.fork }}
      BRANCH: ${{ needs.authorize.outputs.branch }}
      BASE: ${{ needs.authorize.outputs.base }}
      BASE_SHA: ${{ needs.authorize.outputs.base-sha }}
      LEGS: ${{ needs.authorize.outputs.legs }}
      RELEASE: ${{ needs.authorize.outputs.release }}
    steps:
      # Whole histories, here and in the fetch of the recorded head below, so the push sends only the new commit.
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.base-sha }}
          fetch-depth: 0

      # Outside the checkout, each leg in a directory of its own named for its artifact.
      - name: Take every leg's recording
        uses: actions/download-artifact@v8
        with:
          pattern: port-readiness-recording-*
          path: ${{ runner.temp }}/legs

      # Every leg's lock must be the recorder's, for its tool-pack, naming the release authorize chose and two assets
      # named for their own sha256, which the files must decompress to. Every file to commit must be the lock, a new
      # case source under the tool-pack's fixtures/, or an UPSTREAM.md the tree already has; nothing else is taken.
      # Each checked recording's sha256 and asset name go to subjects.txt, for the attestation below.
      - name: Check the recordings and build the commit
        id: commit
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [ -n "$PR" ]; then
            git fetch --no-tags origin "$HEAD_SHA" ||
              fail "pull request #$PR no longer has $HEAD_SHA, the commit that was recorded: review it and record again"
            parent="$HEAD_SHA"
          else
            parent="$BASE_SHA"
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/recording.index"
          git read-tree "$parent"
          : > "$RUNNER_TEMP/assets.txt"
          : > "$RUNNER_TEMP/subjects.txt"
          declare -A staged=()
          recorded=()
          while IFS=' ' read -r pack tool; do
            label="$pack/$tool"
            dir="$RUNNER_TEMP/legs/port-readiness-recording-$pack-$tool"
            lock="$dir/recording.lock"
            [ -f "$lock" ] && [ ! -L "$lock" ] || fail "$label: its record leg left no recording.lock"
            jq -e --arg tool "$tool" --arg release "$RELEASE" --arg prefix "$pack-$tool-" '
              .format == "rerail.port-readiness-recording-lock/v1" and .tool == $tool and .release == $release
              and (.files | keys) == ["corpus.json", "recording.json"]
              and all(.files | to_entries[];
                (.value.sha256 | type == "string" and test("^[0-9a-f]{64}$"))
                and .value.asset == $prefix + (.key | rtrimstr(".json")) + "-" + .value.sha256 + ".json.gz")
            ' "$lock" > /dev/null || fail "$label: recording.lock is not the recorder's lock for $label in $RELEASE"
            while IFS=' ' read -r asset digest; do
              file="$dir/assets/$asset"
              [ -f "$file" ] && [ ! -L "$file" ] || fail "$label: $asset is missing"
              [ "$(gzip -dc -- "$file" | sha256sum | cut -d ' ' -f 1)" = "$digest" ] ||
                fail "$label: $asset does not decompress to the sha256 its name gives"
              printf '%s\n' "$file" >> "$RUNNER_TEMP/assets.txt"
              printf '%s  %s\n' "$digest" "$asset" >> "$RUNNER_TEMP/subjects.txt"
            done < <(jq -r '.files[] | "\(.asset) \(.sha256)"' "$lock")

            [ -f "$dir/changed.list" ] || fail "$label: its record leg left no list of the files it wrote"
            mapfile -d '' paths < "$dir/changed.list"
            for path in "${paths[@]}"; do
              case "/$path/" in */../*|*/./*|*//*|*$'\n'*) fail "$label: '$path' is not a plain path" ;; esac
              case "$path" in
                "packs/$pack/upstream/$tool/recording.lock") ;;
                "packs/$pack/upstream/$tool/fixtures/"?*)
                  ! git cat-file -e "$parent:$path" 2> /dev/null ||
                    fail "$label: $path is already in the tree, and the recorder only adds case sources" ;;
                "packs/$pack/licenses/"*/UPSTREAM.md)
                  project="${path#"packs/$pack/licenses/"}"
                  if [[ "${project%/UPSTREAM.md}" == */* ]] || ! git cat-file -e "$parent:$path" 2> /dev/null; then
                    fail "$label: $path is not an UPSTREAM.md the tree has"
                  fi ;;
                *) fail "$label: the recorder does not write $path" ;;
              esac
              [ -z "${staged[$path]:-}" ] || fail "$path is written by both ${staged[$path]} and $label: record them one at a time"
              staged[$path]="$label"
            done
            if [ "${#paths[@]}" -gt 0 ]; then
              stage="$RUNNER_TEMP/stage/$pack-$tool"
              mkdir -p "$stage"
              tar -xf "$dir/changed.tar" -C "$stage" --no-same-owner --no-same-permissions --null --files-from="$dir/changed.list"
              [ -z "$(find "$stage" -mindepth 1 ! -type f ! -type d -print -quit)" ] || fail "$label: its files include something that is not a file"
              [ "$(find "$stage" -type f | wc -l)" -eq "${#paths[@]}" ] || fail "$label: its files are not the ones it lists"
              written="$stage/packs/$pack/upstream/$tool/recording.lock"
              [ ! -e "$written" ] || cmp -s "$written" "$lock" || fail "$label: it lists a different lock from the one it uploads"
              # Hashed as bytes (--no-filters: no .gitattributes is read) and added by path, never through a working tree.
              mapfile -t blobs < <(printf '%s\n' "${paths[@]/#/$stage/}" | git hash-object -w --no-filters --stdin-paths)
              [ "${#blobs[@]}" -eq "${#paths[@]}" ] || fail "$label: could not hash its files"
              for i in "${!paths[@]}"; do printf '100644 %s\t%s\0' "${blobs[$i]}" "${paths[$i]}"; done | git update-index -z --index-info
            fi
            recorded+=("$label")
          done < <(jq -r '.[] | "\(.pack) \(.tool)"' <<< "$LEGS")

          printf -v legs '%s, ' "${recorded[@]}"
          legs="${legs%, }"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          tree="$(git write-tree)"
          if [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            echo "every lock already names what was recorded: nothing to commit"
            echo "commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit="$(git commit-tree "$tree" -p "$parent" -m "Port readiness: record $legs" \
            -m "Recorded by port-readiness-record.yml (run $GITHUB_RUN_ID). The recordings are assets of the $RELEASE release; this commit holds the locks that name them, the case sources the recorder copied, and their UPSTREAM.md rows.")"
          git diff --stat "$parent" "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The gates' fetch takes an asset only with this attestation (recording/fetch.ts): anyone who can write here, and
      # any workflow with a write token, can upload to the release, so a digest alone does not say the recorder made it.
      # The subjects are the recordings' own sha256s, of the JSON the lock names, so an asset already in the release is
      # covered too, and the signer is this workflow at the run's ref, which authorize required to be refs/heads/main.
      # Made before the upload and the push, so a failed attestation leaves no lock naming an asset the gates refuse.
      - name: Attest the recordings
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

      # Content-addressed, so an upload is write-once: an asset whose name is already in the release holds exactly
      # these bytes and is left alone. Uploaded before the commit is pushed, so no lock names an asset that is not there.
      - name: Upload the recordings to the release
        run: |
          set -euo pipefail
          if ! id="$(gh api "repos/$REPO/releases/tags/$RELEASE" --jq .id 2> /dev/null)"; then
            gh release create "$RELEASE" --repo "$REPO" --prerelease --title "Port readiness recordings" \
              --notes "Upstream linters' recorded answers for the port readiness gates (docs/port-readiness.md). Each asset is named for the sha256 of the JSON it holds, and a commit's packs/<pack>/upstream/<tool>/recording.lock names the ones its rules are judged against. Each recording holds excerpts of its upstream's tests under that upstream's licence, whose text it carries as licenseText; see also that upstream's packs/<pack>/licenses/<project>/UPSTREAM.md and the LICENSE beside it."
            id="$(gh api "repos/$REPO/releases/tags/$RELEASE" --jq .id)"
          fi
          gh api --paginate "repos/$REPO/releases/$id/assets?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/have.txt"
          new=()
          while IFS= read -r file; do
            name="$(basename "$file")"
            if grep -Fqx -- "$name" "$RUNNER_TEMP/have.txt"; then
              echo "$name is already in $RELEASE: the same digest is the same bytes, so it is left alone"
            else
              new+=("$file")
            fi
          done < <(sort -u "$RUNNER_TEMP/assets.txt")
          count="$(wc -l < "$RUNNER_TEMP/have.txt")"
          if [ $((count + ${#new[@]})) -gt "$RELEASE_CAP" ]; then
            echo "::error::$RELEASE holds $count assets, and ${#new[@]} more would pass GitHub's cap of $RELEASE_CAP: record again, and the next run moves on to the next release"
            exit 1
          fi
          for file in "${new[@]}"; do
            gh release upload "$RELEASE" "$file" --repo "$REPO"
          done

      # Pushed once, whatever the number of legs. The commit's parent is the recorded head, so for a branch here it
      # is a fast-forward, and a branch that moved since refuses it; nothing is ever pushed to the base branch.
      - name: Push the commit
        id: push
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
          LEGS_RECORDED: ${{ steps.commit.outputs.legs }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/comment.md"
          if [ -z "$COMMIT" ]; then
            echo "Recorded $LEGS_RECORDED. Every lock already names what was recorded, so there is nothing to commit. If port readiness still fails on this commit, recording it again changes nothing: the failing check says what to do instead." > "$body"
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR" ]; then
            # A run with no pull request opens none from the branch it pushes; a person does, from the page the run's
            # summary links to, which fills in a title and a body pointing back at this run attempt, the one that pushed
            # the branch (its name carries the attempt too). The summary is written before the push, so a failure here
            # leaves no branch pushed without it.
            branch="port-readiness-recordings/run-$RUN"
            compare="$GITHUB_SERVER_URL/$REPO/compare/$BASE...$branch?expand=1"
            attempt="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            title="Port readiness: record $LEGS_RECORDED"
            text="Recorded $LEGS_RECORDED on \`$BASE\` at $BASE_SHA by port-readiness-record.yml; what moved, per rule, is in the summary of $attempt. The recordings are assets of the \`$RELEASE\` release; this pull request commits the locks that name them, the case sources the recorder copied, and their UPSTREAM.md rows."
            prefilled="$compare&title=$(jq -rn --arg v "$title" '$v|@uri')&body=$(jq -rn --arg v "$text" '$v|@uri')"
            {
              echo "Recorded $LEGS_RECORDED on \`$BASE\` at $BASE_SHA and pushed $COMMIT to \`$branch\`: the locks, the case sources the recorder copied, and their UPSTREAM.md rows. The recordings are assets of the \`$RELEASE\` release."
              echo
              echo "This run opens no pull request: [open one from \`$branch\` into \`$BASE\`]($prefilled)."
            } > "$body"
            git push origin "$COMMIT:refs/heads/$branch"
            echo "::notice::pushed $branch and opened no pull request: open one into $BASE from $compare"
            echo "pr=" >> "$GITHUB_OUTPUT"
          elif [ "$FORK" = "false" ]; then
            if ! git push origin "$COMMIT:refs/heads/$BRANCH"; then
              now="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f 1)"
              if [ "$now" != "$HEAD_SHA" ]; then
                echo "::error::$BRANCH moved from $HEAD_SHA to ${now:-nothing} since it was authorized: review it and record again"
              else
                echo "::error::the push to $BRANCH was refused for the reason above"
              fi
              exit 1
            fi
            echo "Recorded $LEGS_RECORDED at $HEAD_SHA and pushed $COMMIT to this branch: the locks, the case sources the recorder copied, and their UPSTREAM.md rows. The recordings are assets of the \`$RELEASE\` release. A push with the workflow token starts no workflow: push again, or close and reopen this pull request, to run the gates on it." > "$body"
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
          else
            git push --force origin "$COMMIT:refs/heads/port-readiness-recordings/pr-$PR"
            echo "Recorded $LEGS_RECORDED at $HEAD_SHA. The commit, $COMMIT, is on \`port-readiness-recordings/pr-$PR\` in this repository, on top of that head: the default token cannot push to a fork, so merge it into your branch (\`git pull --ff-only https://github.com/$REPO port-readiness-recordings/pr-$PR\`), or ask a maintainer to push it. The recordings are assets of the \`$RELEASE\` release." > "$body"
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
          fi

      # A run with no pull request has none to comment on, and opens none: what it recorded, the link to open the pull
      # request by hand, and what moved per rule go to the run's summary instead.
      - name: Write the per-rule change summaries to the run's summary
        if: steps.push.outputs.pr == ''
        continue-on-error: true
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          while IFS=' ' read -r pack tool; do
            changes="$RUNNER_TEMP/legs/port-readiness-recording-$pack-$tool/changes.md"
            [ -s "$changes" ] && [ ! -L "$changes" ] || continue
            { echo; cat "$changes"; } >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | "\(.pack) \(.tool)"' <<< "$LEGS")

      # What moved, per rule: a comment of its own per tool-pack, since one can run long, and in the run's summary.
      # Before a tool-pack's new summary is posted, its earlier ones are collapsed as outdated: they start with
      # recording/diff.ts's RECORDING_COMMENT_MARKER and carry the heading that names the tool-pack. Another tool-pack's
      # are left alone, since this run did not record it again.
      - name: Post the per-rule change summaries
        if: steps.push.outputs.pr != ''
        continue-on-error: true
        env:
          TARGET: ${{ steps.push.outputs.pr }}
        run: |
          set -euo pipefail
          marker='<!-- rerail-port-readiness-recording -->'
          # Summaries posted while the recordings were named for the gates carry the old marker; collapse those too.
          legacy='<!-- rerail-gate-recording -->'
          gh api "repos/$REPO/issues/$TARGET/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          while IFS=' ' read -r pack tool; do
            changes="$RUNNER_TEMP/legs/port-readiness-recording-$pack-$tool/changes.md"
            [ -s "$changes" ] && [ ! -L "$changes" ] || continue
            cat "$changes" >> "$GITHUB_STEP_SUMMARY"
            heading="### \`$pack/$tool\`"
            gh api --paginate "repos/$REPO/issues/$TARGET/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select((.body | startswith(\"$marker\")) or (.body | startswith(\"$legacy\"))) | select(.body | contains(\"\n$heading\")) | .node_id" |
              while read -r id; do
                gh api graphql -f id="$id" \
                  -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
                  > /dev/null || echo "::warning::could not collapse the earlier recording summary $id"
              done || echo "::warning::could not list $pack/$tool's earlier recording summaries"
            gh api "repos/$REPO/issues/$TARGET/comments" -F body=@"$changes" > /dev/null || echo "::warning::could not post $pack/$tool's summary"
          done < <(jq -r '.[] | "\(.pack) \(.tool)"' <<< "$LEGS")
