name: Pull request labels

# Labels a pull request from the paths it changes, by the map in .github/labeler.yml, and removes a mapped label once the
# pull request no longer changes those paths.
#
# pull_request_target, so it also runs for forks, with the base branch's workflow and map: a pull request can't rewrite
# its own labelling, and a change to either takes effect once merged. It checks out nothing, runs nothing of the pull
# request, and holds only a GITHUB_TOKEN that can write pull request labels.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply the labels
        uses: actions/labeler@v7
        with:
          sync-labels: true
