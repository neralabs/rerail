version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Not Rerail's dependencies: test data (sample apps and packs the rule tests read) and the upstream tools' runtimes,
    # which pin upstream's own versions on purpose (docs/upstream.md); a bump there changes upstream's recorded answers.
    exclude-paths:
      - "fixtures/**"
      - "packs/*/candidates/**/fixtures/**"
      - "scripts/pack-data/runtimes/**"
      - "conformance/recorders/*/runtimes/**"
    groups:
      # First match wins, so these come before npm-minor-patch. Each lands in a pull request of its own, so one that
      # breaks holds back none of the others. Files that pin a version in step with these (the OMP host and its digests,
      # the ast-grep reference version) are brought along by .github/workflows/dependabot-pins.yml.
      omp-sdk:
        patterns: ["@oh-my-pi/*"]
      ast-grep-cli:
        patterns: ["@ast-grep/cli"]
      # @vitest/* peer-pins vitest exactly, so they must move together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # @babel/parser's AST is typed by @babel/types: one major of each is read with the other's types.
      babel:
        patterns: ["@babel/parser", "@babel/types"]
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # The Rust crates under fixtures/ are test data, not Rerail's dependencies.
    exclude-paths:
      - "fixtures/**"
    groups:
      # ast-grep-language implements ast-grep-core's traits, so a version of one does not build against another
      # version of the other: they must move together.
      ast-grep:
        patterns: ["ast-grep-*"]
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
