name: Feature request
description: Something Rerail doesn't do yet.
labels: [enhancement, needs-triage]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        We reply within 10 business days: accepted, declined, or "not now" with a reason ([response times](https://github.com/neralabs/rerail/blob/main/CONTRIBUTING.md#response-times)).
        A large change starts with a short design in the issue ([large changes](https://github.com/neralabs/rerail/blob/main/CONTRIBUTING.md#large-changes)).
  - type: dropdown
    id: feature-status
    attributes:
      label: Which feature is it about?
      description: The README's [Internal testing](https://github.com/neralabs/rerail/blob/main/README.md#internal-testing) table lists the features still in internal testing.
      options:
        - A documented feature
        - A feature in internal testing
        - Something Rerail doesn't have
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: context
    attributes:
      label: Your context
      description: Your coding agent, your language, and the kind of repository.
  - type: input
    id: fork
    attributes:
      label: A change in your fork
      description: Optional. A branch or pull request in your fork with the change ([how it works](https://github.com/neralabs/rerail/blob/main/CONTRIBUTING.md#proposing-a-change-from-your-fork)).
      placeholder: https://github.com/you/rerail/tree/your-branch
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched open and closed issues, including ones labelled `known-issue`, and this isn't one of them.
          required: true
