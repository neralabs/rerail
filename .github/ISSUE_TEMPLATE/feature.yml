name: Feature request
description: Something Rerail doesn't do yet.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        We reply within 10 business days: accepted, declined, or "not now" with a reason ([response times](https://github.com/neralabs/rerail/blob/main/CONTRIBUTING.md#response-times)).
        A large change starts with a short design in the issue ([large changes](https://github.com/neralabs/rerail/blob/main/CONTRIBUTING.md#large-changes)).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: context
    attributes:
      label: Your context
      description: Your coding agent, your language, and the kind of repository.
  - type: checkboxes
    id: contribute
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself ([becoming a trusted contributor](https://github.com/neralabs/rerail/blob/main/CONTRIBUTING.md#becoming-a-trusted-contributor)).
