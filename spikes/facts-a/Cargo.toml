[package]
name = "facts-a"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 1 Spike A: facts once per content + in-memory relational evaluation of batch 6 (throwaway)."

[[bin]]
name = "facts-a"
path = "src/main.rs"

[dependencies]
rerail-engine = { path = "../../native" }
rerail-facts = { path = "../../facts" }
ast-grep-core = "=0.50.0"
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "=1.13.1"
fancy-regex = "=0.17.0"
rustc-hash = "=2.1.3"
memchr = "=2.8.3"
libc = "0.2"
parking_lot = "0.12"
sqlparser = "0.58"
globset = "=0.4.20"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }

[features]
# The gate's seeded mutants (src/mutant.rs, FACTS_MUTANT); off in every normal build.
mutants = []
