[package]
name = "facts-a"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 1 Spike A: facts once per content + in-memory relational evaluation of batch 6 (throwaway)."

[[bin]]
name = "facts-a"
path = "src/main.rs"

[dependencies]
rerail-engine = { path = "../../native" }
rerail-facts = { path = "../../facts" }
ast-grep-core = "=0.50.0"
blake3 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "=1.13.1"
fancy-regex = "=0.17.0"
rustc-hash = "=2.1.3"
memchr = "=2.8.3"
libc = "0.2"
parking_lot = "0.12"
sqlparser = "0.58"
globset = "=0.4.20"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
zstd = "=0.14.2"
# The daemon's bulk sync reads trees and blobs from the Git object database (the version and
# features rerail-engine builds, so nothing builds twice).
gix = { version = "=0.84.0", default-features = false, features = ["sha1"] }
# Live and peak heap bytes for FACTS_MEMTRACE (the process allocator is the engine's jemalloc).
tikv-jemalloc-ctl = { version = "=0.6.1", features = ["stats"] }
tikv-jemalloc-sys = { version = "=0.6.1", default-features = false }

[features]
# The gate's seeded mutants (src/mutant.rs, FACTS_MUTANT); off in every normal build. Turns on
# rerail-facts' mutants too, so its rewrite mutants (11..) reach the corpus runs of `facts-a repo`.
mutants = ["rerail-facts/mutants"]
