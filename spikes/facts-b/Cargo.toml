[package]
name = "facts-b"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase 1 Spike B: base + per-worktree delta dataflow for cross-file rules (throwaway)."

[dependencies]
tree-sitter = "=0.27.1"
tree-sitter-language = "=0.1.9"
blake3 = "1"
differential-dataflow = "0.25.1"
timely = "0.31.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2.1"
parking_lot = "0.12"
libc = "0.2"
rerail-facts = { path = "../../facts" }
regex = "=1.13.1"
# Y1's maintained reference graph (src/ygraph): one interner table, parallel export loading.
hashbrown = "0.16"
foldhash = "0.2"
rayon = "1.12"
memchr = "2"

[features]
# Seeded mutants for the gate (src/mutant.rs); off in normal builds.
mutants = []

[build-dependencies]
cc = "=1.8.0"
tree-sitter-generate = { version = "=0.27.1", default-features = false }
