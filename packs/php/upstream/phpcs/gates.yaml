adapter: phpcs
# PHP_CodeSniffer's documents in rerail's php pack.
rerail:
  pack: php
  project: php_codesniffer
  # PHP_CodeSniffer checks .php and .inc files (Config's default extensions). Rerail routes `.php` to PHP and has no
  # dialect for `.inc`, so the ports cover `.php` alone; upstream's own `.inc` unit test files are read as PHP at
  # `<file>.inc.php`, as PHP_CodeSniffer reads them.
  in_scope:
    - .php
upstream:
  name: PHPCSStandards/PHP_CodeSniffer
  repository: https://github.com/PHPCSStandards/PHP_CodeSniffer
  # The release rerail's php pack ports (packs/php/licenses/php_codesniffer/UPSTREAM.md: PHP_CodeSniffer 4.0.4, the
  # conformance.json tools entry); tag 4.0.4.
  commit: bbdc3d0532623e21838b7041a4364383a8126f96
  version: 4.0.4
  license: BSD-3-Clause
  # The Composer package, run on PHP 8.5.11 (runtimes/phpcs-4.0.4/.php-version, the interpreter the pack's expected
  # findings were derived with): DeprecatedFunctions reads the running interpreter's deprecations, and the unit tests'
  # expectations depend on its version.
  runtime: phpcs-4.0.4
  # PHP_CodeSniffer has no recommended configuration; it ships coding standards, and the one bare `phpcs` runs (no
  # --standard, no config file) is PSR12 at the pin (src/Config.php's restoreDefaults; README: "The default coding
  # standard used by PHP_CodeSniffer is the PSR12 coding standard"), the same reading as Bandit's and Ruff's `default`.
  # The other standards are not recommendations: Generic "is not designed to be used to check code" (its ruleset's
  # description) and is where most ported sniffs live, Squiz, PEAR and Zend are their authors' house styles (Zend's
  # says it is out of date), and PSR1 and PSR2 are what PSR12 extends and replaces. Only Generic.PHP.LowerCaseConstant
  # is in PSR12, with its default properties, so the other seven documents are not `recommended` and start off once
  # shipped.
  #
  # How the expected findings are made (the configuration, options and parser upstream runs with) is the
  # generator's own header: packs/php/upstream/phpcs/generate.py.
  recommended_configs:
    - PSR12
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".inc", ".php"]
popularity:
  observed_on: 2026-10-20
  evidence:
    - "Packagist: 416,475,636 installs of squizlabs/php_codesniffer in total, 10,544,655 in the last 30 days (packagist.org/packages/squizlabs/php_codesniffer/stats.json)"
    - "GitHub: PHPCSStandards/PHP_CodeSniffer has 1,562 stars and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "Generic.CodeAnalysis.EmptyStatement":
    deprecated: null
    recommended: null
  "Generic.PHP.BacktickOperator":
    deprecated: null
    recommended: null
  "Generic.PHP.DeprecatedFunctions":
    deprecated: null
    recommended: null
  "Generic.PHP.ForbiddenFunctions":
    deprecated: null
    recommended: null
  "Generic.PHP.LowerCaseConstant":
    deprecated: null
    recommended: { config: "PSR12", options: [] }
  "Generic.PHP.NoSilencedErrors":
    deprecated: null
    recommended: null
  "Squiz.PHP.DisallowSizeFunctionsInLoops":
    deprecated: null
    recommended: null
  "Squiz.PHP.Eval":
    deprecated: null
    recommended: null
