adapter: psalm
# Psalm's documents in rerail's php pack.
rerail:
  pack: php
  project: psalm
  # Psalm analyses .php files (Config's file_extensions), which Rerail routes to PHP; a Blade template (`.blade.php`)
  # is the blade pack's.
  in_scope:
    - .php
upstream:
  name: vimeo/psalm
  repository: https://github.com/vimeo/psalm
  # The release rerail's php pack ports (packs/php/licenses/psalm/UPSTREAM.md: Psalm 6.19.1, the conformance.json
  # tools entry); tag 6.19.1.
  commit: e2ca44251c1f1aa2e35452d426895746b47de64e
  version: 6.19.1
  license: MIT
  # The Composer package, with the parsers its analysis reads source and docblocks with pinned too (nikic/php-parser,
  # phpdocumentor's reflection-docblock and type-resolver, phpstan/phpdoc-parser), run on PHP 8.5.11
  # (runtimes/psalm-6.19.1/.php-version, the interpreter the pack's expected findings were derived with).
  runtime: psalm-6.19.1
  # Psalm's recommended configuration is the psalm.xml its installation guide has every project generate,
  # `./vendor/bin/psalm --init` ("Psalm will scan your project and figure out an appropriate error level"):
  # Config\Creator's template, with findUnusedCode="true" and findUnusedBaselineEntry="true", at the level --init
  # detects. A project in which Psalm finds no issue gets level 1 (Psalm::autoGenerateConfig), which is also the
  # template's own level and the level of Psalm's own tests (tests/TestConfig.php), so `init` is that file, read from
  # the pinned Creator by the adapter's driver. Without errorLevel Psalm runs at level 2 (docs/running_psalm/
  # error_levels.md); the two levels report both ported issues alike.
  # - ForbiddenCode (ERROR_LEVEL 4) is an error at levels 1 to 4 and info above (docs: "Errors ignored at level 5 and
  #   higher"): `init` reports it, with no forbiddenFunctions, so var_dump and shell_exec (and backticks) alone.
  # - UnusedVariable (ERROR_LEVEL -2) is a feature-specific issue, reported at every level once unused variables are
  #   sought. findUnusedCode="true" seeks them (Config::loadFromXML sets find_unused_variables from findUnusedCode;
  #   docs/running_psalm/configuration.md: "including unused variables"), so `init` needs no
  #   findUnusedVariablesAndParams. Both documents are `recommended` and start on once shipped.
  #
  # How the expected findings are made (the configuration, options and parser upstream runs with) is the
  # generator's own header: packs/php/upstream/psalm/generate.py.
  recommended_configs:
    - init
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".php"]
popularity:
  observed_on: 2026-10-20
  evidence:
    - "Packagist: 89,304,062 installs of vimeo/psalm in total, 2,309,491 in the last 30 days (packagist.org/packages/vimeo/psalm/stats.json)"
    - "GitHub: vimeo/psalm has 5,897 stars and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "ForbiddenCode":
    deprecated: null
    recommended: { config: "init", options: [] }
  "UnusedVariable":
    deprecated: null
    recommended: { config: "init", options: [] }
