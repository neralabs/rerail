adapter: clippy
# Clippy's documents in rerail's rust pack.
rerail:
  pack: rust
  project: clippy
upstream:
  name: rust-lang/rust-clippy
  repository: https://github.com/rust-lang/rust-clippy
  # The clippy Rust 1.99.0 ships (packs/rust/licenses/clippy/UPSTREAM.md): tag rust-1.99.0, `clippy 0.1.99
  # (b940084d7e 2026-09-28)`.
  commit: 49e2f89a2605a9a340e04955fdbefa9803e6027a
  version: 0.1.99
  license: MIT OR Apache-2.0
  # The rustup toolchain 1.99.0 with its clippy component (runtimes/clippy-1.99.0/rust-toolchain.toml); the recorder
  # refuses a toolchain whose rustc is not release 1.99.0 or whose clippy-driver is not that rustc's build.
  runtime: clippy-1.99.0
  # Clippy has no named configuration; `default` is its default lint levels: a lint of the correctness, suspicious,
  # style, complexity or perf group (`declare_clippy_lint!`) is on, and a pedantic, restriction, nursery or cargo lint
  # is off, so its document ships off.
  #
  # How the adapter applies it (decisions for the team):
  # - Every ported lint is recorded with `-W clippy::<lint>`, as packs/rust/upstream/clippy/generate.py does, so a lint
  #   the default levels leave off is judged on its own tests too; in-source `allow`/`expect` still apply.
  # - A lint's upstream tests are the UI tests its `//~` annotations name, and the one named after it (the longest
  #   lint name a file's stem starts with). Every ported lint is judged on every ported lint's tests, as
  #   fixtures.expected.json records them.
  # - The gates judge every case of an upstream lint for each document, with no per-document fixture scope, so cases
  #   run under Clippy's default test configuration only: tests/ui with tests/clippy.toml. A tests/ui-toml test whose
  #   clippy.toml is another is skipped, and the four documents that port a non-default clippy.toml
  #   (clippy-decimal-literal-representation-threshold, clippy-inconsistent-digit-grouping-no-fractions,
  #   clippy-needless-raw-string-hashes-one-allowed, clippy-unreadable-literal-no-fractions) are judged against the
  #   defaults they deliberately differ from.
  # - Positions are each diagnostic's primary span, start and end, in rustc's 1-based lines and character columns.
  recommended_configs:
    - default
  # The file types upstream lints with its approved configuration at the pins (seeded from the recording's in-scope samples).
  lints: [".rs"]
popularity:
  observed_on: 2026-10-19
  evidence:
    - "GitHub: rust-lang/rust-clippy has 13,586 stars and 2,214 forks, and is not archived (gh api repos/rust-lang/rust-clippy)"
    - "rustup: clippy is a component of rustup's default profile, which every `rustup` install of Rust uses unless told otherwise (rust-lang.github.io/rustup/concepts/profiles.html)"
    - "crates.io: 497,230,628,220 crate downloads across 356,135 crates, the ecosystem Clippy lints (crates.io/api/v1/summary)"
