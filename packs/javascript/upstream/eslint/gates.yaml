# Decisions for the team to confirm (the eslint adapter's literal readings):
# - Gate 5 lints every RuleTester case of tests/lib/rules/<rule>.js as eslint:recommended configures a project: with
#   the rule at the options of its first approved configuration, not the case's own options (the TSLint precedent),
#   and without the globals the case or its RuleTester declares (languageOptions.globals), since eslint:recommended
#   declares none and a port cannot see them; globals the code declares in a comment (`/* globals a:off */`) stay.
#   The settings the case or its RuleTester declares (`settings`) are left out the same way; no ESLint core rule
#   reads them. The case's parser, parserOptions, ecmaVersion and sourceType stay, since they define the language
#   its code is in (no-implied-eval still differs on `globalThis.setTimeout('foo')`, which upstream's tests lint as
#   ECMAScript 5). A case that declares globals or settings is not compared with its written expectation. Keeping
#   the case's globals instead fails Gate 5 for use-isnan, no-setter-return (both in eslint:recommended), radix and
#   no-new-wrappers, and changes the counts of no-implied-eval (79 expected findings instead of 21), no-eval (64,
#   not 49), no-undef (12 extra, not 1), no-redeclare, no-obj-calls, accessor-pairs, no-array-constructor and
#   no-object-constructor, which fail or pass either way.
# - A rule's end positions are compared only when every finding upstream reports on its own tests carries one.
# - Gate 3's upstream code for a rule is its file; the modules it imports by relative path, followed transitively (other
#   rules aside); the module that defines each name it imports from one of the `helpers` packages below, and of what
#   that module imports from another `helpers` package only JSON data (is-builtin-module's builtin-modules list), not
#   that package's code (@typescript-eslint/utils re-exports token predicates from @eslint-community/eslint-utils, a
#   single-file bundle holding the whole library's strings) nor its own package's internals; the ESLint rule a
#   typescript-eslint rule extends, read the same way; and the
#   helper modules the approved configurations' parser calls, since every rule reads the scopes that parser builds.
#   Every word of their strings counts except in `meta`'s documentation (docs, schema): `meta.messages` and
#   `meta.defaultOptions` count, and so do object literal keys (lookup tables such as conf/globals.js and
#   ReferenceTracker trace maps).
# - Gate 3's comment vocabulary, which explains words only in regexes that read comment text, is TypeScript's JSDoc tags
#   and pragmas, ESLint's directive names, and the values ESLint's directives take, read from the pinned eslint: a
#   global's setting (normalizeConfigGlobal's off, readonly, readable, writable, writeable, true, false) and a rule's
#   severity (shared/severity.js's off, warn, error).
# - Gate 3's test words are, for every RuleTester case of every upstream test file: its code and the code it expects
#   after fixes (output and each suggestion's output), read with the scanner; its options, settings and the names of the
#   globals it declares; and what it expects reported (each error's message and data values, each suggestion's
#   description and data values). ESLint's tests/fixtures/parsers modules are not read: each holds a frozen tree of code
#   that the case quotes in its own `code`, or of code the case ignores. The test modules' RuleTester scaffolding
#   (valid, invalid, errors, messageId) is not read: it is the test framework's vocabulary, not upstream's test code.
# - File types: eslint:recommended sets no `files`, so ESLint lints its defaults .js, .mjs and .cjs; those are Gate 2's
#   in-scope samples.
# - Upstream's tests run in validation/upstream/eslint-10.11.0 with the test-time packages its package.json asks for:
#   @typescript-eslint/parser 8.70.1 (^8.58.2), typescript 6.0.3 (^6.0.3), globals 16.5.0 (^16.2.0), fs-teardown 0.1.3.
eslint:
  release:
    tag: v10.11.0
    installed: eslint/lib
