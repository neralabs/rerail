adapter: eslint
# ESLint core's documents in rerail's javascript pack.
rerail:
  pack: javascript
  project: eslint
upstream:
  name: eslint/eslint core rules
  repository: https://github.com/eslint/eslint
  # The release rerail's javascript pack records (packs/javascript/licenses/eslint/UPSTREAM.md: ESLint 10.11.0 at this
  # commit); tag v10.11.0.
  commit: 3c0b7c6e1fe2dec778b97a996018126f22d437ae
  version: 10.11.0
  license: MIT
  runtime: eslint-10.11.0
  # eslint:recommended as the pinned @eslint/js publishes it (`configs.recommended`); it turns rules on without options.
  recommended_configs:
    - recommended
  # The file types upstream lints with its approved configuration at the pins (seeded from the recording's in-scope samples).
  lints: [".cjs", ".js", ".mjs"]
popularity:
  observed_on: 2026-10-06
  evidence:
    - "npm: 198,218,333 downloads of eslint in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "npm: 176,459,385 downloads of @eslint/js in the same week"
    - "GitHub: eslint/eslint has 27,629 stars and is not archived"
