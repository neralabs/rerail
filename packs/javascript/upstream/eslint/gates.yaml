# How the expected findings are made (the configuration, options and parser upstream runs with) is the
# generator's own header: packs/javascript/upstream/generate.mjs.
# - File types (`lints`): eslint:recommended sets no `files`, so ESLint lints its defaults .js, .mjs and .cjs.
# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). The generator reads tests/lib/rules/<rule>.js for each ported rule (generate.mjs).
watch:
  tests:
    - "tests/lib/rules/{rule}.js"
  code:
    - "lib/rules/{rule}.js"
  shared:
    - "lib/languages/js/source-code/**"
    - "lib/linter/**"
    - "lib/rules/utils/**"
    - "lib/shared/ast-utils.js"
    - "package.json"
eslint:
  release:
    tag: v10.11.0
    installed: eslint/lib
