adapter: eslint
# eslint-plugin-unicorn's documents in rerail's javascript pack.
rerail:
  pack: javascript
  project: eslint-plugin-unicorn
upstream:
  name: sindresorhus/eslint-plugin-unicorn plugin rules
  repository: https://github.com/sindresorhus/eslint-plugin-unicorn
  # The release rerail's javascript pack ports (packs/javascript/licenses/eslint-plugin-unicorn/UPSTREAM.md:
  # eslint-plugin-unicorn 76.0.0 at this commit), the V1 pack's pin (76.0.0 @ f70155eb); tag v76.0.0.
  commit: f70155ebe24dbb35b9814c3dbb3ab3620e09c3e1
  version: 76.0.0
  license: MIT
  runtime: eslint-plugin-unicorn-76.0.0
  # The plugin's own `recommended` configuration (`configs.recommended`; `flat/recommended` is the same rules under a
  # legacy name). It turns rules on without options, so each runs with its defaultOptions. `unopinionated` turns on a
  # subset of it and `all` every rule; neither is approved.
  recommended_configs:
    - recommended
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".cjs", ".js", ".mjs"]
popularity:
  observed_on: 2026-10-07
  evidence:
    - "npm: 9,015,434 downloads of eslint-plugin-unicorn in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "GitHub: sindresorhus/eslint-plugin-unicorn has 5,263 stars, is MIT and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "unicorn/filename-case":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "unicorn/no-null":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "unicorn/prefer-node-protocol":
    deprecated: null
    recommended: { config: "recommended", options: [] }
# How the expected findings are made (the configuration, options and parser upstream runs with) is the
# generator's own header: packs/javascript/upstream/eslint-plugin-unicorn/generate.mjs.
# - unicorn:no-array-for-each is not a rule of the pinned upstream: v66.0.0 renamed it no-for-each (#3216) and 76.0.0
#   keeps no deprecated alias, so it starts off. Registered as no-for-each, none of upstream's 309 findings on its own
#   tests is reproduced (upstream reports the forEach member, the port the whole call), and it reports on valid cases.
#   conformance.json maps no upstream rule to unicorn-no-array-for-each, so the report lists the candidate among the
#   documents not mapped to an upstream rule.
# - File types (`lints`): recommended sets no `files`, so ESLint lints its defaults .js, .mjs and .cjs.
# - Message text: no port copies upstream's documentation. unicorn:no-null and
#   unicorn:no-array-for-each paraphrase the messages in the rule code ("Use `undefined` instead of `null`.",
#   "Use `for…of` instead of `.forEach(…)`."); the other messages and every description are the port's own words.
eslint:
  release:
    tag: v76.0.0
    installed: eslint-plugin-unicorn/rules
