adapter: eslint
# eslint-plugin-unicorn's documents in rerail's javascript pack.
rerail:
  pack: javascript
  project: eslint-plugin-unicorn
upstream:
  name: sindresorhus/eslint-plugin-unicorn plugin rules
  repository: https://github.com/sindresorhus/eslint-plugin-unicorn
  # The release rerail's javascript pack records (packs/javascript/licenses/eslint-plugin-unicorn/UPSTREAM.md:
  # eslint-plugin-unicorn 76.0.0 at this commit), the V1 pack's pin (76.0.0 @ f70155eb); tag v76.0.0.
  commit: f70155ebe24dbb35b9814c3dbb3ab3620e09c3e1
  version: 76.0.0
  license: MIT
  runtime: eslint-plugin-unicorn-76.0.0
  # The plugin's own `recommended` configuration (`configs.recommended`; `flat/recommended` is the same rules under a
  # legacy name). It turns rules on without options, so each runs with its defaultOptions. `unopinionated` turns on a
  # subset of it and `all` every rule; neither is approved.
  recommended_configs:
    - recommended
popularity:
  observed_on: 2026-10-07
  evidence:
    - "npm: 9,015,434 downloads of eslint-plugin-unicorn in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "GitHub: sindresorhus/eslint-plugin-unicorn has 5,263 stars, is MIT and is not archived"
known_gaps: []
# Decisions for the team to confirm (the eslint adapter's literal readings, as for ESLint's own rules, and what this
# plugin adds):
# - unicorn:no-array-for-each is not a rule of the pinned upstream: v66.0.0 renamed it no-for-each (#3216) and 76.0.0
#   keeps no deprecated alias, so it starts off and Gates 3, 5 and 6 do not run. The document's id and its
#   suppress.eslint.rules both name no-array-for-each, so `documents` registers it under that name. Registered as
#   no-for-each instead, it passes Gate 3 and still fails Gate 5: none of upstream's 309 findings on its own tests is
#   reproduced (upstream reports the forEach member, the port the whole call), and it reports on valid cases.
#   In rerail, conformance.json maps no upstream rule to unicorn-no-array-for-each, so the report lists the candidate
#   among the documents not mapped to an upstream rule and no gate judges it.
# - Gate 5 lints every case of test/*.js through upstream's own test helpers (test/utils/test.js): test() and
#   test.typescript() run ESLint's RuleTester (eslint-ava-rule-tester's subclass), and test.snapshot() runs upstream's
#   SnapshotRuleTester, named below as a case tester. AVA itself does not run: a stand-in registers its tests and each
#   case is linted once. The rule copies test/utils/test.js builds (it imports ../index.js, which wraps rules/ again)
#   are replaced by the installed plugin's rule of the same name and metadata. Each case is linted with the rule at the
#   options of its first approved configuration (recommended sets none, so the rule's defaultOptions), not the case's
#   own, and without the globals and settings its tester declares (builtin, node and browser globals; no case of
#   these rules declares settings); the case's parser, parserOptions, ecmaVersion and sourceType stay. The recommended
#   configuration itself declares globals.builtin; linting every case with those globals instead changes no count
#   here.
# - A rule's end positions are compared only when every finding upstream reports on its own tests carries one:
#   filename-case reports the file at line 1, column 0 with no end.
# - The engine evaluates each case at the file name upstream lints it as, directories kept (ADR 0006), so
#   filename-case's directory findings (checkDirectories is on by default) can appear there; the port checks only the
#   base name, so the 9 cases whose only finding is a directory's are missing. Upstream's tests run at the repository
#   root, as AVA runs them, so the file name filename-case's tests build from that directory is evaluated at its path
#   in the checkout (src/FooBar/file.js). The one they build above it (../Src/fooBar.js, whose directories upstream
#   does not check) keeps only its base name, since its directories are this machine's. Evaluated at the base name
#   alone, every count here is the same.
# - Gate 3's upstream code is read as for ESLint's own rules, with the helpers below. Its test words are every case's
#   code, outputs, options and expected reports, and test/fixtures. test/snapshots/*.md, AVA's record of the
#   snapshot cases' reports and fixes as code frames, is not read: it is upstream's output, not test input. Every
#   word the ports' code spells is explained by upstream's code except punycode, which the cases' own code holds, so
#   reading the snapshots changes no verdict.
# - File types: recommended sets no `files`, so ESLint lints its defaults .js, .mjs and .cjs; those are Gate 2's
#   in-scope samples.
# - Message text: no port copies upstream's documentation. unicorn:no-null and
#   unicorn:no-array-for-each paraphrase the messages in the rule code ("Use `undefined` instead of `null`.",
#   "Use `for…of` instead of `.forEach(…)`."); the other messages and every description are the port's own words.
# - Upstream's tests run in validation/upstream/eslint-plugin-unicorn-76.0.0. Upstream commits no lockfile, so the
#   runtime holds the versions npm resolved for its package.json ranges on 76.0.0's publish date (eslint 10.11.0,
#   @typescript-eslint/parser 8.70.0, typescript 6.0.3 and the parsers and language plugins its test utilities load).
eslint:
  plugin:
    package: eslint-plugin-unicorn
    namespace: unicorn
  # The plugin publishes rules/ as it is (with index.js and configs/); its tests import ../index.js, whose rules/ imports
  # run from the installed package.
  release:
    tag: v76.0.0
    path: rules
    installed: eslint-plugin-unicorn/rules
    verbatim: true
  implementation: rules/{rule}.js
  # AVA's test files (package.json ava.files also names test/unit/*.js, which tests utilities, not rules).
  tests: ["test/*.js"]
  # AVA runs the tests at the repository root, and filename-case's build file names from that directory.
  test_cwd: "."
  # Files the rules read from disk while upstream's cases run (no-missing-local-resource's resources and the like).
  test_fixtures: ["test/fixtures/**"]
  # The helper libraries the ported rules are written with: ESLint's, and the Node.js built-in module list
  # prefer-node-protocol checks names against (is-builtin-module reads builtin-modules' builtin-modules.json; the rule's
  # own comment says it uses that static list rather than node:module's isBuiltin). Parsers (regjsparser,
  # @eslint/css-tree, yaml) and general libraries (change-case, pluralize, semver and the rest of its dependencies) are
  # not rule helpers and are not read, as for ESLint's own rules.
  helpers:
    - "@eslint-community/eslint-utils"
    - "builtin-modules"
    - "is-builtin-module"
  checkout: ["/index.js", "/configs/", "/rules/", "/scripts/", "/test/", "/license", "/package.json"]
  # test.snapshot() cases run through upstream's own SnapshotRuleTester rather than ESLint's RuleTester.
  case_testers: ["test/utils/snapshot-rule-tester.js"]
