adapter: eslint
# eslint-plugin-react's documents in rerail's react pack.
rerail:
  pack: react
  project: eslint-plugin-react
upstream:
  name: jsx-eslint/eslint-plugin-react plugin rules
  repository: https://github.com/jsx-eslint/eslint-plugin-react
  # The annotated tag v7.37.5 (tag object 6fb2e467) points at this commit, which is also npm's gitHead for 7.37.5.
  commit: 2c98b83c451a4297edf1787d9a616e50687e27e8
  version: 7.37.5
  license: MIT
  runtime: eslint-plugin-react-7.37.5
  # The plugin's flat recommended configuration, `configs.flat.recommended` (the flat form of configs.recommended): 22
  # rules, 21 on without options and react/no-unsafe off, with parserOptions.ecmaFeatures.jsx. Team decision, in the
  # form of tslint:latest: `configs.flat['jsx-runtime']` is the overlay a project on React 17's JSX transform spreads
  # after it. It turns react-in-jsx-scope and jsx-uses-react off and turns nothing on, so listed second it would change
  # no result (a rule takes the first approved configuration that turns it on); applied as an overlay it would start
  # react-react-in-jsx-scope off. `configs.flat.all` turns every rule on and is not a recommendation.
  recommended_configs:
    - flat.recommended
popularity:
  observed_on: 2026-10-06
  evidence:
    - "npm: 76,020,341 downloads of eslint-plugin-react in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "GitHub: jsx-eslint/eslint-plugin-react has 9,290 stars and is not archived"
known_gaps: []
# Decisions for the team to confirm (the eslint adapter's literal readings for this plugin):
# - Gate 5 lints every case of tests/lib/rules/<rule>.js as upstream's own helpers build it: tests/helpers/ruleTester.js
#   (on ESLint 9 it converts each case to flat config and defaults ecmaVersion 5 and sourceType script) and
#   tests/helpers/parsers.js, whose parsers.all() copies each case once per parser the pinned ESLint and the case's
#   features allow and appends `// features: [...], parser: ...` to its code. On ESLint 9 that is espree,
#   typescript-eslint-parser and @typescript-eslint/parser; parsers.js itself skips the Babel copies. Each copy is
#   linted with the rule as configs.flat.recommended sets it, without the options and settings (react.version, pragma,
#   fragment) the case or its RuleTester declares, in eslint-config-next's environment (the `environment` below): its
#   parsers, browser and Node globals and ESLint's default ECMAScript version take the place of the language options the
#   copy sets. A copy is named by the file type its own parser reads (.jsx or .js for espree, .tsx or .ts for the
#   TypeScript parsers; typescript-eslint-parser declares no meta.name, `parsers` names it), and the environment then
#   reads that file as a project in it would. With no settings the plugin assumes the latest React and the React pragma
#   (lib/util/version.js, pragma.js). A case that declares settings or globals is not compared with its written
#   expectation.
# - TypeScript is 5.7.3, the latest @typescript-eslint/parser 8.17 (what upstream's CI installs for ESLint 9) supports
#   (>=4.8.4 <5.8.0). Upstream's own devDependency, typescript ^3.9.9, cannot run it: in the tree upstream's CI builds
#   for ESLint 9 (npm install, then npm install --no-save eslint@9 @typescript-eslint/parser@8.17 babel-eslint@10,
#   reproduced on 2026-10-07) TypeScript stays 3.9.10, requiring @typescript-eslint/parser throws ("Cannot read
#   properties of undefined (reading 'Cjs')") when ruleTester.js converts a parsers.js copy, and 101 of the 103 rule
#   test files do not load. On 5.7.3 every file loads.
# - A rule's end positions are compared only when every finding upstream reports on its own tests carries one
#   (no-unescaped-entities reports a point).
# - self-closing-comp's regex `^[\s&&[^\xA0]]*\n[\s&&[^\xA0]]*$` uses Rust's class intersection, which Gate 3 runs in
#   JavaScript's unicodeSets (`v`) mode, where it means the same.
# - Gate 3's upstream code for a rule is lib/rules/<rule>.js, the modules it requires by relative path (lib/util/),
#   followed transitively, and the modules of jsx-ast-utils it requires, a helper library of JSX attribute lookups as
#   @eslint-community/eslint-utils is for ESLint. The es-shims, doctrine, estraverse, minimatch, semver, resolve and
#   prop-types are general libraries and are not read. Its comment vocabulary is TypeScript's JSDoc tags and pragmas
#   and ESLint's directives and their values, read from the pinned eslint.
# - Gate 3's test words are every case copy's code (with the comment parsers.js appends), outputs, options, settings,
#   globals and expected reports, over all of tests/lib/rules/*.js.
# - File types: eslint-config-next lints **/*.{js,jsx,mjs,ts,tsx,mts,cts}, and ESLint's defaults add .cjs; those are Gate
#   2's in-scope samples and the files Gate 6 reads, in the catalog's task solutions and the rerail pack's corpora.
# - Upstream's tests run in validation/upstream/eslint-plugin-react-7.37.5 on eslint 9.39.5, the latest release
#   upstream's eslint range admits (^9.7; 7.37.5 does not admit ESLint 10), @typescript-eslint/parser 8.17.0 (its CI's
#   8.17 for ESLint 9) on typescript 5.7.3, typescript-eslint-parser 20.1.1, babel-eslint 10.1.0 and
#   @babel/eslint-parser 7.29.9 with @babel/core 7.29.7 (parsers.js require.resolves all four), and semver,
#   object.entries and array.prototype.flatmap for the helpers, each the latest its devDependency range admits.
#   Upstream commits no lockfile.
# - The published lib/ is the checkout's lib/ plus the type declarations prepack builds (lib/**/*.d.ts, .d.ts.map);
#   every .js file is byte-identical, so `verbatim` is false and the tag and version tie the package to the commit.
# - No port's message is copied from upstream's rule docs (docs/rules/*.md; no-render-return-value.md quotes the legacy
#   reactjs.org ReactDOM documentation).
eslint:
  # The environment the pack is linted in, decided by the team on 2026-10-09 (docs/decisions/eslint-test-globals.md):
  # eslint-config-next, the shareable configuration Next.js tells projects to use. Its file globs
  # (**/*.{js,jsx,mjs,ts,tsx,mts,cts}), its parsers (Next.js's compiled Babel parser with next/babel, and
  # typescript-eslint's for .ts and .tsx) and its browser and Node globals come before the approved configuration, for
  # upstream's test cases and the corpus; its plugins, rules and settings are not the pack's. A test case's own parser
  # and globals give way to them.
  environment:
    package: eslint-config-next
    version: 16.3.8
    runtime: eslint-config-next-16.3.8
    source:
      repository: https://github.com/vercel/next.js
      commit: b0fad0d45eb4c4430fda5eeeb442e8a5af08a5f6
      path: packages/eslint-config-next
  plugin:
    package: eslint-plugin-react
    namespace: react
  # Upstream's tests require ../../../lib/rules/<rule>, which run from the installed package.
  release:
    tag: v7.37.5
    path: lib
    installed: eslint-plugin-react/lib
    verbatim: false
  implementation: lib/rules/{rule}.js
  tests: ["tests/lib/rules/*.js"]
  helpers: ["jsx-ast-utils"]
  checkout: ["/lib/", "/tests/lib/rules/", "/tests/helpers/", "/index.js", "/configs/", "/LICENSE", "/package.json"]
  parsers:
    eslint-config-next: javascript
    typescript-eslint-parser: typescript
