adapter: eslint
# eslint-plugin-react's documents in rerail's react pack.
rerail:
  pack: react
  project: eslint-plugin-react
upstream:
  name: jsx-eslint/eslint-plugin-react plugin rules
  repository: https://github.com/jsx-eslint/eslint-plugin-react
  # The annotated tag v7.37.5 (tag object 6fb2e467) points at this commit, which is also npm's gitHead for 7.37.5.
  commit: 2c98b83c451a4297edf1787d9a616e50687e27e8
  version: 7.37.5
  license: MIT
  runtime: eslint-plugin-react-7.37.5
  # The plugin's flat recommended configuration, `configs.flat.recommended` (the flat form of configs.recommended): 22
  # rules, 21 on without options and react/no-unsafe off, with parserOptions.ecmaFeatures.jsx. Team decision, in the
  # form of tslint:latest: `configs.flat['jsx-runtime']` is the overlay a project on React 17's JSX transform spreads
  # after it. It turns react-in-jsx-scope and jsx-uses-react off and turns nothing on, so listed second it would change
  # no result (a rule takes the first approved configuration that turns it on); applied as an overlay it would start
  # react-react-in-jsx-scope off. `configs.flat.all` turns every rule on and is not a recommendation.
  recommended_configs:
    - flat.recommended
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".cjs", ".cts", ".js", ".jsx", ".mjs", ".mts", ".ts", ".tsx"]
popularity:
  observed_on: 2026-10-06
  evidence:
    - "npm: 76,020,341 downloads of eslint-plugin-react in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "GitHub: jsx-eslint/eslint-plugin-react has 9,290 stars and is not archived"
