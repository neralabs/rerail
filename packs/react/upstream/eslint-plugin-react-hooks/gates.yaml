adapter: eslint
# eslint-plugin-react-hooks' documents in rerail's react pack.
rerail:
  pack: react
  project: react
upstream:
  name: facebook/react eslint-plugin-react-hooks rules
  repository: https://github.com/facebook/react
  # The tag eslint-plugin-react-hooks@7.1.1 (lightweight) is this commit. npm's gitHead for 7.1.1 is the next commit,
  # 1ddff43c41147b880c22eb363e07aade5a71c5d9, which rerail's react pack ports (packs/react/licenses/react/UPSTREAM.md);
  # both hold the same packages/eslint-plugin-react-hooks tree (e2449dd2) and LICENSE.
  commit: d1727fbf987392749b374f3afe62227d2c70fc41
  version: 7.1.1
  license: MIT
  runtime: eslint-plugin-react-hooks-7.1.1
  # The plugin's flat recommended configuration, `configs.flat.recommended`: rules-of-hooks (error), exhaustive-deps
  # (warn) and 14 React Compiler rules, none with options. Team decision, in the form of tslint:latest:
  # `configs.flat['recommended-latest']` adds void-use-memo; it changes neither ported rule, so listing it second would
  # change no result.
  recommended_configs:
    - flat.recommended
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".cjs", ".cts", ".js", ".jsx", ".mjs", ".mts", ".ts", ".tsx"]
popularity:
  observed_on: 2026-10-06
  evidence:
    - "npm: 121,229,108 downloads of eslint-plugin-react-hooks in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "GitHub: facebook/react (now reported as react/react) has 250,912 stars and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "react-hooks/error-boundaries":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/exhaustive-deps":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/globals":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/immutability":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/purity":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/refs":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/rules-of-hooks":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/set-state-in-effect":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/set-state-in-render":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
  "react-hooks/static-components":
    deprecated: null
    recommended: { config: "flat.recommended", options: [] }
# How the expected findings are made (the configuration, options and parser upstream runs with) is the
# generator's own header: packs/react/upstream/eslint-plugin-react-hooks/generate.mjs.
# - src/code-path-analysis/, which RulesOfHooks imports, is vendored ESLint code under its own MIT LICENSE (OpenJS
#   Foundation) that the published bundle does not carry: a notice question.
# - File types (`lints`): eslint-config-next lints **/*.{js,jsx,mjs,ts,tsx,mts,cts}, and ESLint's defaults add .cjs.
# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). The generator's TESTS names each rule's test, and each rule's code is its own file; __tests__/ holds tests it
# does not read (the React Compiler's).
watch:
  rule-prefix: "react-hooks/"
  tests: []
  code: []
  shared:
    - "packages/eslint-plugin-react-hooks/package.json"
    - "packages/eslint-plugin-react-hooks/src/code-path-analysis/**"
    - "packages/eslint-plugin-react-hooks/src/index.ts"
    - "packages/eslint-plugin-react-hooks/src/shared/Utils.ts"
  new-tests:
    - "packages/eslint-plugin-react-hooks/__tests__/**"
  rules:
    "exhaustive-deps": { tests: ["packages/eslint-plugin-react-hooks/__tests__/ESLintRuleExhaustiveDeps-test.js"], code: ["packages/eslint-plugin-react-hooks/src/rules/ExhaustiveDeps.ts"] }
    "rules-of-hooks": { tests: ["packages/eslint-plugin-react-hooks/__tests__/ESLintRulesOfHooks-test.js"], code: ["packages/eslint-plugin-react-hooks/src/rules/RulesOfHooks.ts"] }
eslint:
  release:
    tag: eslint-plugin-react-hooks@7.1.1
    installed: eslint-plugin-react-hooks
