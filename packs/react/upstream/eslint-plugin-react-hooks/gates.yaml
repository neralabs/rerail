adapter: eslint
# eslint-plugin-react-hooks' documents in rerail's react pack (NER-1740).
rerail:
  pack: react
  project: react
upstream:
  name: facebook/react eslint-plugin-react-hooks rules
  repository: https://github.com/facebook/react
  # The tag eslint-plugin-react-hooks@7.1.1 (lightweight) is this commit. npm's gitHead for 7.1.1 is the next commit,
  # 1ddff43c41147b880c22eb363e07aade5a71c5d9, which rerail's react pack records (packs/react/licenses/react/UPSTREAM.md);
  # both hold the same packages/eslint-plugin-react-hooks tree (e2449dd2) and LICENSE.
  commit: d1727fbf987392749b374f3afe62227d2c70fc41
  version: 7.1.1
  license: MIT
  runtime: eslint-plugin-react-hooks-7.1.1
  # The plugin's flat recommended configuration, `configs.flat.recommended`: rules-of-hooks (error), exhaustive-deps
  # (warn) and 14 React Compiler rules, none with options. Team decision, in the form of tslint:latest:
  # `configs.flat['recommended-latest']` adds void-use-memo; it changes neither ported rule, so listing it second would
  # change no result.
  recommended_configs:
    - flat.recommended
popularity:
  observed_on: 2026-10-06
  evidence:
    - "npm: 121,229,108 downloads of eslint-plugin-react-hooks in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "GitHub: facebook/react (now reported as react/react) has 250,912 stars and is not archived"
known_gaps: []
# Candidates that differ from upstream on real code (docs/port-readiness.md, "Goldens"): one entry per rule in place of
# a golden per differing file. differing_files counts the goldens of NRV's validation/goldens/react-react-hooks.tsv (NRV
# e8727c7) the rule differed on, engine gaps included, in rerail CI run 38969340726. A listed rule fails
# no-real-code-gap; once it agrees there, import its NRV goldens into goldens.tsv in place of its entry.
real_code_gaps:
  - rule: react-hooks-exhaustive-deps
    differing_files: 23
# Decisions for the team to confirm (the eslint adapter's literal readings for this plugin):
# - Pack precondition: packages/eslint-plugin-react-hooks/package.json at the pinned tag says 7.0.0, because React stamps each
#   package's published version from ReactVersions.js ('eslint-plugin-react-hooks': '7.1.1') when it builds.
#   release.version_file makes the pack check runtime-version read the version there, so the check ties the installed
#   package (7.1.1), the version the source at the pinned commit declares (7.1.1) and the pin; package.json's 7.0.0
#   stays in its detail. Read from package.json, the check could never pass on React's monorepo, and the pack
#   precondition would fail with rerail's licence layout in place. src/code-path-analysis/,
#   which RulesOfHooks imports, is vendored ESLint code under its own MIT LICENSE (OpenJS Foundation) that the
#   published bundle does not carry: a notice question.
# - Gate 5: the two test files (__tests__/ESLintRulesOfHooks-test.js, ESLintRuleExhaustiveDeps-test.js) run each case
#   list through an eslint-v7 and an eslint-v9 RuleTester, once per parser. The six ESLint 9 runs are linted, on the
#   ESLint the gates run; the ESLint 7 runs repeat the same cases on ESLint 7 and are not read. Their parsers are
#   @babel/eslint-parser (JavaScript with JSX and Flow, by React's Babel configuration), hermes-eslint (Flow), and
#   @typescript-eslint/parser 2.x, 3.x, 4.x and 5.x; none declares meta.name, so `parsers` gives Babel's copies .jsx
#   and the TypeScript parsers' .tsx (each of those runs sets JSX), and hermes-eslint's copies .js. Each case is linted
#   with the rule as configs.flat.recommended sets it, without the options (additionalHooks) and settings
#   (react-hooks.additionalEffectHooks) the case declares, in eslint-config-next's environment (the `environment`
#   below): a copy is named by the file type its own parser reads, and the environment's parsers, browser and Node
#   globals and ECMAScript version then read it as a project in it would, in place of the copy's own language options.
#   A Flow-only copy the environment's Babel parser rejects has no answer from upstream and is not scored.
# - The tests load the plugin as React's workspace builds it from source, an ES module
#   (`require('eslint-plugin-react-hooks').default`); the published CommonJS build exports the plugin without a
#   default, so release.default_export gives the tests the installed build as that module.
# - The tests run in packages/eslint-plugin-react-hooks, where its own `yarn test` runs jest: @babel/eslint-parser
#   finds babel.config.js there, which extends ../../babel.config-ts.js.
# - A rule's end positions are compared only when every finding upstream reports on its own tests carries one.
# - Gate 3's upstream code for a rule is src/rules/<Rule>.ts (RulesOfHooks.ts, ExhaustiveDeps.ts; src/index.ts maps the
#   names) and the modules it imports by relative path, followed transitively (src/code-path-analysis/,
#   src/shared/Utils.ts). Its comment vocabulary is TypeScript's JSDoc tags and pragmas and ESLint's directives and
#   their values, read from the pinned eslint-v9.
# - Gate 3's test words are every case's code, outputs, options, settings, globals and expected reports in the ESLint 9
#   runs of both test files. __tests__/ReactCompilerRule{Flow,Typescript}-test.ts (18 cases of the React Compiler
#   rules, on eslint-v8) import src/shared/ReactCompiler.ts, which needs babel-plugin-react-compiler built from
#   compiler/ in React's monorepo; they are not loaded, and their words are not test words.
# - File types: eslint-config-next lints **/*.{js,jsx,mjs,ts,tsx,mts,cts}, and ESLint's defaults add .cjs; those are Gate
#   2's in-scope samples and the files Gate 6 reads, in the catalog's task solutions and the rerail pack's corpora.
# - Upstream's tests run in validation/upstream/eslint-plugin-react-hooks-7.1.1, in the layout of React's own
#   node_modules at the tag (eslint 7.32.0 at the root, whose CLIEngine @typescript-eslint/parser 3.x's
#   experimental-utils extends as it loads, and the eslint-v7 and eslint-v9 aliases the tests require), with the
#   parsers and the Babel packages of babel.config-ts.js at the
#   versions React's yarn.lock resolves; npm's override accepts @typescript-eslint/parser 2.34.0 on eslint 7, as yarn
#   does. eslint-v9 is 9.39.5, the latest React's range (npm:eslint@^9.0.0) admits, not the 9.0.0 its yarn.lock
#   resolves: the adapter assembles each case as ESLint 9.37 and later's RuleTester does (defaultRuleTesterConfig and
#   the languages of its @ plugin), which 9.0.0's does not; the inventory's probe found byte-identical expected answers
#   on 9.0.0 and 9.39.5.
eslint:
  # The environment the pack is linted in, decided by the team on 2026-10-09 (docs/decisions/eslint-test-globals.md):
  # eslint-config-next, the shareable configuration Next.js tells projects to use. Its file globs
  # (**/*.{js,jsx,mjs,ts,tsx,mts,cts}), its parsers (Next.js's compiled Babel parser with next/babel, and
  # typescript-eslint's for .ts and .tsx) and its browser and Node globals come before the approved configuration, for
  # upstream's test cases and the corpus; its plugins, rules and settings are not the pack's. A test case's own parser
  # and globals give way to them.
  environment:
    package: eslint-config-next
    version: 16.3.8
    runtime: eslint-config-next-16.3.8
    source:
      repository: https://github.com/vercel/next.js
      commit: b0fad0d45eb4c4430fda5eeeb442e8a5af08a5f6
      path: packages/eslint-config-next
  plugin:
    package: eslint-plugin-react-hooks
    namespace: react-hooks
  eslint_package: eslint-v9
  # React publishes a Rollup bundle (cjs/eslint-plugin-react-hooks.*.js) of src/ and the React Compiler.
  release:
    tag: eslint-plugin-react-hooks@7.1.1
    path: packages/eslint-plugin-react-hooks/src
    installed: eslint-plugin-react-hooks
    verbatim: false
    default_export: true
    version_file: ReactVersions.js
  implementation: packages/eslint-plugin-react-hooks/src/rules/{Rule}.ts
  tests: ["packages/eslint-plugin-react-hooks/__tests__/ESLint*-test.js"]
  test_cwd: packages/eslint-plugin-react-hooks
  helpers: []
  checkout:
    - "/packages/eslint-plugin-react-hooks/"
    - "/babel.config.js"
    - "/babel.config-ts.js"
    - "/ReactVersions.js"
    - "/LICENSE"
    - "/package.json"
  parsers:
    eslint-config-next: javascript
    "@babel/eslint-parser": javascript
    hermes-eslint: javascript
    "@typescript-eslint/parser-v2": typescript
    "@typescript-eslint/parser-v3": typescript
    "@typescript-eslint/parser-v4": typescript
    "@typescript-eslint/parser-v5": typescript
