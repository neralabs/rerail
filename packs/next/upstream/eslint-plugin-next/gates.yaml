adapter: eslint
# @next/eslint-plugin-next's documents in rerail's next pack.
rerail:
  pack: next
  project: next.js
upstream:
  name: vercel/next.js @next/eslint-plugin-next rules
  repository: https://github.com/vercel/next.js
  # Tag v16.3.8 (lightweight) is this commit; packages/eslint-plugin-next/package.json there says 16.3.8. npm records no
  # gitHead for the published 16.3.8, which ships only dist/ (the swc build of src/), so the tag is the only link from
  # the tarball to the commit.
  commit: b0fad0d45eb4c4430fda5eeeb442e8a5af08a5f6
  version: 16.3.8
  license: MIT
  runtime: eslint-plugin-next-16.3.8
  # The plugin's own flat configuration, `configs.recommended` (name next/recommended): all 22 rules, none with
  # options. Team decision, in the form of tslint:latest: `configs['core-web-vitals']` is the same set with
  # no-html-link-for-pages and no-sync-scripts raised from warn to error. It turns no other rule on and sets no
  # options, so listing it second would change no result; it is one line to add. recommended-legacy and
  # core-web-vitals-legacy are the eslintrc forms of the same two.
  recommended_configs:
    - recommended
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".cjs", ".cts", ".js", ".jsx", ".mjs", ".mts", ".ts", ".tsx"]
popularity:
  observed_on: 2026-10-06
  evidence:
    - "npm: 47,739,164 downloads of @next/eslint-plugin-next in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "GitHub: vercel/next.js has 143,240 stars and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "@next/next/google-font-display":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/google-font-preconnect":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/inline-script-id":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/next-script-for-ga":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-assign-module-variable":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-async-client-component":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-before-interactive-script-outside-document":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-css-tags":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-document-import-in-page":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-duplicate-head":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-head-element":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-head-import-in-document":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-img-element":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-location-assign-relative-destination":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-page-custom-font":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-script-component-in-head":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-styled-jsx-in-document":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-sync-scripts":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-title-in-document-head":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "@next/next/no-typos":
    deprecated: null
    recommended: { config: "recommended", options: [] }
    # The rule reports an exported name one edit away from getStaticProps, getStaticPaths or getServerSideProps; its
    # findings are those names, so every rename variant loses them (NER-2148).
    rename_exempt: "reports exported names one edit away from Next's data-fetching function names"
  "@next/next/no-unwanted-polyfillio":
    deprecated: null
    recommended: { config: "recommended", options: [] }
# How the expected findings are made (the configuration, options and parser upstream runs with) is the
# generator's own header: packs/next/upstream/eslint-plugin-next/generate.mjs.
# - File types (`lints`): eslint-config-next lints **/*.{js,jsx,mjs,ts,tsx,mts,cts}, and ESLint's defaults add .cjs.
# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). The generator reads test/unit/eslint-plugin-next/<rule>.test.ts for each ported rule (generate.mjs).
watch:
  rule-prefix: "@next/next/"
  tests:
    - "test/unit/eslint-plugin-next/{rule}.test.ts"
  code:
    - "packages/eslint-plugin-next/src/rules/{rule}.ts"
  shared:
    - "packages/eslint-plugin-next/package.json"
    - "packages/eslint-plugin-next/src/index.ts"
    - "packages/eslint-plugin-next/src/utils/**"
eslint:
  release:
    tag: v16.3.8
    installed: "@next/eslint-plugin-next/dist"
