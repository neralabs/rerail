name: Deploy
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
    steps:
      - run: npx prisma migrate reset --force
      - run: pnpm test
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: npx prisma migrate dev  # caught
      - run: npx prisma migrate deploy
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - run: npx prisma migrate reset --force
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - run: npx prisma db push --accept-data-loss  # caught
