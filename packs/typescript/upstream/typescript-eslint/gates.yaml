# How the expected findings are made (the configuration, options and parser upstream runs with) is the
# generator's own header: packs/typescript/upstream/generate.mjs.
# - File types (`lints`): of the approved configurations' entries only typescript-eslint/eslint-recommended sets `files`
#   (**/*.ts, **/*.tsx, **/*.mts, **/*.cts); base and recommended set none, so the plugin's rules also run on ESLint's
#   defaults .js, .mjs and .cjs.
eslint:
  release:
    tag: v8.70.1
    installed: "@typescript-eslint/eslint-plugin/dist"
