adapter: eslint
# @vitest/eslint-plugin's documents in rerail's typescript pack.
rerail:
  pack: typescript
  project: eslint-plugin-vitest
upstream:
  name: vitest-dev/eslint-plugin-vitest plugin rules
  repository: https://github.com/vitest-dev/eslint-plugin-vitest
  # Rerail's typescript pack records no release of this plugin (it keeps no licenses/eslint-plugin-vitest/). The
  # repository published as eslint-plugin-vitest before it moved to vitest-dev and became @vitest/eslint-plugin. This is
  # the V1 pack's pin (@vitest/eslint-plugin 1.6.27 @ aad57d12), the commit tag v1.6.27 points to.
  commit: aad57d121647efe764463c37414a8cd67ec9cf92
  version: 1.6.27
  license: MIT
  runtime: vitest-eslint-plugin-1.6.27
  # The plugin's own `recommended` configuration (`configs.recommended`): expect-expect and no-focused-tests at error,
  # no-disabled-tests at warn, each without options. `legacy-recommended` is the same rules for eslintrc, `all` turns on
  # every rule, and `env` only declares Vitest's globals; none of them is approved.
  recommended_configs:
    - recommended
popularity:
  observed_on: 2026-10-07
  evidence:
    - "npm: 4,552,292 downloads of @vitest/eslint-plugin in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "npm: 739,731 downloads of eslint-plugin-vitest, its earlier name, in the same week"
    - "GitHub: vitest-dev/eslint-plugin-vitest has 513 stars, is MIT and is not archived"
known_gaps: []
# Decisions for the team to confirm (the eslint adapter's literal readings, as for typescript-eslint's rules, and what
# this plugin adds):
# - Gate 5 runs every case of tests/*.test.ts through upstream's own RuleTester (typescript-eslint's, built in
#   tests/ruleTester.ts), with the rule at the options of its first approved configuration (recommended sets none, so
#   the rule's defaultOptions) in place of the case's own, and without the globals and settings the case declares (no
#   case of these rules declares settings). Vitest itself does not run: a stand-in registers its tests. Upstream's
#   tests import the rules' sources (src/rules/<rule>.ts, loaded through tsx), which the package ships only bundled,
#   so the installed bundle's rule of the same name and metadata runs in place of each source copy.
# - That RuleTester lints every case as file.ts, its default file name. The ports apply only to test files
#   (**/*.test.ts, **/*.spec.ts, __tests__/ and the like), so no upstream test file is in their scope: every upstream
#   finding is a difference, and all three rules fail Gate 5 on scope alone. Measured with each case's file named
#   file.test.ts instead (not the file upstream lints, so not the gate), they would still fail: upstream reports part
#   of the callee (`only` at 1:4-1:8 of `it.only("test", () => {});`, `it` at 1:1-1:3 of a test without an expect)
#   where the ports report the whole call, so expect-expect matches 0 of 17 upstream findings, no-disabled-tests 4 of
#   11 and no-focused-tests 0 of 20.
# - A rule's end positions are compared only when every finding upstream reports on its own tests carries one.
# - Gate 3's upstream code and test words are read as for typescript-eslint's rules, with the helpers below and the
#   files type-checked cases compile against (tests/fixture).
# - File types: recommended sets neither `files` nor a parser, so ESLint lints its defaults .js, .mjs and .cjs; those
#   are Gate 2's in-scope samples, and the ports, which cover TypeScript test files only, fail Gate 2's in-scope
#   check. The Gate 6 corpus has no such file, so Gate 6 has no case for any rule here, by construction. The plugin's README
#   has users spread its rules into a configuration of their own with `files`; no such overlay is approved.
# - Message text: no port copies upstream's documentation or rule messages; every
#   message and description is the port's own words.
# - Upstream's tests run in validation/upstream/vitest-eslint-plugin-1.6.27 on the eslint (10.0.0), @typescript-eslint
#   (8.58.0), typescript (5.9.3) and tsx (4.21.0) versions upstream's own v1.6.27 pnpm-lock.yaml resolves, with every
#   transitive package at the version that lockfile resolves for its dependent.
eslint:
  plugin:
    package: "@vitest/eslint-plugin"
    namespace: vitest
  # The plugin publishes one bundle, dist/index.mjs and dist/index.cjs, built from src/ with tsdown; its tests import
  # ../src/rules/<rule>, whose copies the installed bundle's rules of the same name and metadata replace.
  release:
    tag: v1.6.27
    path: src
    installed: "@vitest/eslint-plugin/dist"
    verbatim: false
  implementation: src/rules/{rule}.ts
  tests: ["tests/*.test.ts"]
  # The project type-checked cases compile against (tests/fixture/tsconfig.json and its files).
  test_fixtures: ["tests/fixture/**"]
  # The plugin's runtime dependencies, the typescript-eslint libraries its rules are written with.
  helpers:
    - "@typescript-eslint/scope-manager"
    - "@typescript-eslint/utils"
  checkout: ["/src/", "/tests/", "/LICENSE", "/package.json"]
