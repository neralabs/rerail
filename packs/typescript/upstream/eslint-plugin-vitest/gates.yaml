adapter: eslint
# @vitest/eslint-plugin's documents in rerail's typescript pack.
rerail:
  pack: typescript
  project: eslint-plugin-vitest
upstream:
  name: vitest-dev/eslint-plugin-vitest plugin rules
  repository: https://github.com/vitest-dev/eslint-plugin-vitest
  # Rerail's typescript pack names no release of this plugin (it keeps no licenses/eslint-plugin-vitest/). The
  # repository published as eslint-plugin-vitest before it moved to vitest-dev and became @vitest/eslint-plugin. This is
  # the V1 pack's pin (@vitest/eslint-plugin 1.6.27 @ aad57d12), the commit tag v1.6.27 points to.
  commit: aad57d121647efe764463c37414a8cd67ec9cf92
  version: 1.6.27
  license: MIT
  runtime: vitest-eslint-plugin-1.6.27
  # The plugin's own `recommended` configuration (`configs.recommended`): expect-expect and no-focused-tests at error,
  # no-disabled-tests at warn, each without options. `legacy-recommended` is the same rules for eslintrc, `all` turns on
  # every rule, and `env` only declares Vitest's globals; none of them is approved.
  recommended_configs:
    - recommended
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".cjs", ".js", ".mjs"]
popularity:
  observed_on: 2026-10-07
  evidence:
    - "npm: 4,552,292 downloads of @vitest/eslint-plugin in the week 2026-09-28 to 2026-10-04 (api.npmjs.org)"
    - "npm: 739,731 downloads of eslint-plugin-vitest, its earlier name, in the same week"
    - "GitHub: vitest-dev/eslint-plugin-vitest has 513 stars, is MIT and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "vitest/expect-expect":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "vitest/no-disabled-tests":
    deprecated: null
    recommended: { config: "recommended", options: [] }
  "vitest/no-focused-tests":
    deprecated: null
    recommended: { config: "recommended", options: [] }
# How the expected findings are made (the configuration, options and parser upstream runs with) is the
# generator's own header: packs/typescript/upstream/eslint-plugin-vitest/generate.mjs.
# - File types (`lints`): recommended sets neither `files` nor a parser, so ESLint lints its defaults .js, .mjs and .cjs,
#   and the ports, which cover TypeScript test files only, fail the in-scope check. The plugin's README has users spread
#   its rules into a configuration of their own with `files`; no such overlay is approved.
# - Message text: no port copies upstream's documentation or rule messages; every
#   message and description is the port's own words.
eslint:
  release:
    tag: v1.6.27
    installed: "@vitest/eslint-plugin/dist"
