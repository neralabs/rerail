adapter: sqlfluff
# SQLFluff's documents in rerail's sql pack.
rerail:
  pack: sql
  project: sqlfluff
upstream:
  name: sqlfluff/sqlfluff
  repository: https://github.com/sqlfluff/sqlfluff
  # The release rerail's sql pack ports for every SQLFluff document (packs/sql/licenses/sqlfluff/UPSTREAM.md:
  # SQLFluff 4.4.0); tag 4.4.0.
  commit: 0348222a3bcdb0226563f7349c5a39beb0641955
  version: 4.4.0
  license: MIT
  # The PyPI package on CPython 3.12.13 (uv-managed, the interpreter fixtures/sql/common.py pins), with pyyaml for the
  # YAML test cases and pglast 8.5 (libpg_query, PostgreSQL 18) as the independent parser.
  runtime: sqlfluff-4.4.0
  # SQLFluff has no named configuration; `default` is its default configuration at the pin (`rules = all`), read from
  # the rule registry for the postgres dialect. A rule with `force_enable` that reports nothing with it at its
  # default (False) on its own cases where `force_enable = True` reports something is held off by default: PG01 and
  # PG02, which are not `recommended` and ship off.
  #
  # The dialect: the engine reads every .sql file as PostgreSQL. upstream/sqlfluff/generate.py lints each fixture in
  # its own dialect and each ANSI one again with `--dialect postgres` (fixtures.cases.json), and where a port follows
  # PostgreSQL and the fixture's dialect reads otherwise, the case is a `not-comparable` divergence.
  recommended_configs:
    - default
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".sql"]
popularity:
  observed_on: 2026-10-19
  evidence:
    - "PyPI: 2,391,178 downloads of sqlfluff in the last week and 9,355,581 in the last month, without mirrors (pypistats.org/api/packages/sqlfluff/recent, 2026-10-19)"
    - "GitHub: sqlfluff/sqlfluff has 9,984 stars and 1,238 forks and is not archived (gh api repos/sqlfluff/sqlfluff, 2026-10-19)"
