adapter: eslint
# eslint-plugin-vue's documents in rerail's vue pack (NER-1939).
# goldens.tsv is not imported from NRV, which pins no Vue tool: it is the files where a rule and eslint-plugin-vue
# differed when rerail still ran Gate 6 itself (#141, before #85 moved Gate 6 to NRV). Finding new ones needs an NRV pin.
rerail:
  pack: vue
  project: eslint-plugin-vue
  # The vue pack ports eslint-plugin-vue to Vue single-file components only. Upstream's recommended configuration also
  # lints .js, .mjs and .cjs files (its rule entries set no `files`, so they reach ESLint's default file types too, where
  # rules such as no-dupe-keys check `Vue.component(...)` objects); those are the javascript pack's file types.
  in_scope: [".vue"]
upstream:
  name: vuejs/eslint-plugin-vue plugin rules
  repository: https://github.com/vuejs/eslint-plugin-vue
  # The annotated tag v10.11.1 (tag object aba1607d) points at this commit, which is also npm's gitHead for 10.11.1.
  commit: ec9c53a6fbed637d7b0fbcd6893b0206ae32839f
  version: 10.11.1
  license: MIT
  runtime: eslint-plugin-vue-10.11.1
  # The plugin's flat recommended configuration for Vue 3, `configs['flat/recommended']`: flat/base (vue-eslint-parser
  # and the vue/vue processor for *.vue, comment-directive and jsx-uses-vars) followed by the rules of the essential,
  # strongly-recommended and recommended tiers. The tiers are cumulative (`flat/strongly-recommended` is flat/essential
  # plus its own, and `flat/recommended` all three), so the one configuration holds every tier; a rule's first
  # approved configuration names no tier. `flat/recommended-error` is the same with warnings raised to errors, the
  # vue2-* configurations are for Vue 2, and `flat/base` turns no ported rule on; none of them is approved.
  recommended_configs:
    - flat/recommended
popularity:
  observed_on: 2026-10-19
  evidence:
    - "npm: 3,736,783 downloads of eslint-plugin-vue in the week 2026-10-12 to 2026-10-18 (api.npmjs.org/downloads/point/last-week/eslint-plugin-vue)"
    - "GitHub: vuejs/eslint-plugin-vue has 4,591 stars, is MIT and is not archived (gh api repos/vuejs/eslint-plugin-vue)"
known_gaps: []
# Decisions for the team to confirm (the eslint adapter's literal readings for this plugin):
# - Gate 5 lints every case of tests/lib/rules/**/*.test.ts with ESLint's RuleTester, which upstream's
#   tests/eslint-compat.ts returns on ESLint 10, with the rule at the options of flat/recommended (its own when it sets
#   none) in place of the case's, and without the globals and settings the case declares. Vitest itself does not run:
#   a stand-in registers its tests. Upstream's tests load lib/ (`release.sources`), as vitest does: tsdown compiles each
#   CommonJS source to a dist/ module that exports it only as `default`, so the build cannot stand in for lib/ file for
#   file. The installed rule of each name, whose metadata equals its lib/ copy's, runs in that copy's place. Two test
#   files (block-order, comment-directive) import the built plugin as ../../../dist, which gets the installed build.
# - A case vue-eslint-parser reads as a component (a .vue name, or code that starts with `<` when the case names no
#   file) is read at a .vue path. vue-eslint-parser reads any other case as one script, with the parser its
#   parserOptions.parser picks for the file's extension (espree when none); that case is read in that script's file
#   type, and a script case at a .vue name (a script-rule case linted by espree as test.vue, which the plugin's rules
#   take for a component's script by that name) is read at its own path in that file type (`parsedAs`). The vue pack's
#   ports cover .vue components (`rerail.in_scope`), so matches-upstream-tests does not score a script case: it is
#   reported as outside the tool-pack's rerail.in_scope, as loads holds the ports to .vue alone.
# - Independent parsers: @vue/compiler-sfc 3.5.43 (runtimes/vue-parsers) splits a .vue file; its parse errors are
#   syntax errors, its checks of the component grammar errors, and TypeScript and Babel read its script blocks in their
#   lang. Other files are read by TypeScript and Babel alone.
# - Corpus files are linted with flat/recommended and every named rule at its approved setting, plus comment-directive
#   (`vue.directive_rules`), so `<!-- eslint-disable -->` in a template works as it does for the plugin's users, and
#   @typescript-eslint/parser for `<script lang="ts">` and `lang="tsx"` (`vue.script_parsers`), as the user guide's
#   TypeScript setup sets parserOptions.parser; other scripts are read by espree, as flat/recommended reads them.
# - A rule's end positions are compared only when every finding upstream reports on its own tests carries one.
# - Gate 3's upstream code for a rule is lib/rules/<rule>.js or .ts, the modules it imports by relative path (lib/utils/),
#   followed transitively, and the modules of @eslint-community/eslint-utils it imports, the helper library of scope
#   lookups the rules are written with. Its test words are every case's code, outputs, options, settings and expected
#   reports over all of tests/lib/rules, and the fixture files the indent and type-aware rule tests load.
# - Upstream's tests run in runtimes/eslint-plugin-vue-10.11.1 on the parser stack the vue pack pins (eslint 10.11.0,
#   vue-eslint-parser 10.4.1, @typescript-eslint/parser 8.70.1, typescript 6.0.3), with eslint-compat-utils 0.6.5 and
#   semver 7.8.5, the latest its v10.11.1 devDependency ranges admit. Upstream commits no lockfile.
# - The published dist/ is lib/ compiled to CommonJS by tsdown (unbundled, file for file), so `verbatim` is false and
#   the tag and version tie the package to the commit.
eslint:
  plugin:
    package: eslint-plugin-vue
    namespace: vue
  release:
    tag: v10.11.1
    path: lib
    installed: eslint-plugin-vue/dist
    verbatim: false
    sources: true
  # eslint-plugin-vue writes its rules in .js and .ts: the pattern resolves as a module path does.
  implementation: lib/rules/{rule}
  tests: ["tests/lib/rules/**/*.test.ts"]
  # The files the indent rules' tests read their cases from, and the project the type-aware cases compile against.
  test_fixtures: ["tests/fixtures/html-indent/**", "tests/fixtures/script-indent/**", "tests/fixtures/typescript/**"]
  # Vitest runs upstream's tests at the repository's root, and cases name files and modules from process.cwd().
  test_cwd: "."
  # Upstream's tests are ES modules vitest imports as Node does: `import tsParser from '@typescript-eslint/parser'` is
  # that package's exports, though its CommonJS build is marked __esModule without a default.
  esm_tests: true
  helpers: ["@eslint-community/eslint-utils"]
  checkout: ["/lib/", "/tests/", "/LICENSE", "/package.json"]
  vue:
    runtime: vue-parsers
    script_parsers:
      ts: "@typescript-eslint/parser"
      tsx: "@typescript-eslint/parser"
    directive_rules: ["vue/comment-directive"]
