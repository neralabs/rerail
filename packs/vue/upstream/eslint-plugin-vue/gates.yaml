adapter: eslint
# eslint-plugin-vue's documents in rerail's vue pack.
rerail:
  pack: vue
  project: eslint-plugin-vue
  # The vue pack ports eslint-plugin-vue to Vue single-file components only. Upstream's recommended configuration also
  # lints .js, .mjs and .cjs files (its rule entries set no `files`, so they reach ESLint's default file types too, where
  # rules such as no-dupe-keys check `Vue.component(...)` objects); those are the javascript pack's file types.
  in_scope: [".vue"]
upstream:
  name: vuejs/eslint-plugin-vue plugin rules
  repository: https://github.com/vuejs/eslint-plugin-vue
  # The annotated tag v10.11.1 (tag object aba1607d) points at this commit, which is also npm's gitHead for 10.11.1.
  commit: ec9c53a6fbed637d7b0fbcd6893b0206ae32839f
  version: 10.11.1
  license: MIT
  runtime: eslint-plugin-vue-10.11.1
  # The plugin's flat recommended configuration for Vue 3, `configs['flat/recommended']`: flat/base (vue-eslint-parser
  # and the vue/vue processor for *.vue, comment-directive and jsx-uses-vars) followed by the rules of the essential,
  # strongly-recommended and recommended tiers. The tiers are cumulative (`flat/strongly-recommended` is flat/essential
  # plus its own, and `flat/recommended` all three), so the one configuration holds every tier; a rule's first
  # approved configuration names no tier. `flat/recommended-error` is the same with warnings raised to errors, the
  # vue2-* configurations are for Vue 2, and `flat/base` turns no ported rule on; none of them is approved.
  recommended_configs:
    - flat/recommended
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".cjs", ".js", ".mjs", ".vue"]
popularity:
  observed_on: 2026-10-19
  evidence:
    - "npm: 3,736,783 downloads of eslint-plugin-vue in the week 2026-10-12 to 2026-10-18 (api.npmjs.org/downloads/point/last-week/eslint-plugin-vue)"
    - "GitHub: vuejs/eslint-plugin-vue has 4,591 stars, is MIT and is not archived (gh api repos/vuejs/eslint-plugin-vue)"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "vue/attribute-hyphenation":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-async-in-computed-properties":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-child-content":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-deprecated-v-on-native-modifier":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-dupe-keys":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-dupe-v-else-if":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-duplicate-attributes":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-export-in-script-setup":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-mutating-props":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-ref-as-operand":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-setup-props-reactivity-loss":
    deprecated: null
    recommended: null
  "vue/no-side-effects-in-computed-properties":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-template-shadow":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-unused-refs":
    deprecated: null
    recommended: null
  "vue/no-unused-vars":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-use-v-if-with-v-for":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-v-html":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-v-text-v-html-on-component":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/no-watch-after-await":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/require-v-for-key":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/require-valid-default-prop":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/return-in-computed-property":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "vue/v-on-event-hyphenation":
    deprecated: null
    recommended: { config: "flat/recommended", options: ["always",{"autofix":true}] }
  "vue/valid-v-for":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
# How the expected findings are made (the configuration, options and parser upstream runs with) is the
# generator's own header: packs/vue/upstream/eslint-plugin-vue/generate.mjs.
# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). Upstream is moving rule files from .js to .ts (5 of the ported rules are .ts at the pins), so both are watched.
watch:
  rule-prefix: "vue/"
  tests:
    - "tests/lib/rules/{rule}.test.ts"
  code:
    - "lib/rules/{rule}.js"
    - "lib/rules/{rule}.ts"
  shared:
    - "lib/utils/**"
    - "package.json"
eslint:
  release:
    tag: v10.11.1
    installed: eslint-plugin-vue/dist
