adapter: eslint
# eslint-plugin-n's documents in rerail's node pack.
rerail:
  pack: node
  project: eslint-plugin-n
upstream:
  name: eslint-community/eslint-plugin-n plugin rules
  repository: https://github.com/eslint-community/eslint-plugin-n
  # Tag v18.4.1 (lightweight) is this commit, which is also npm's gitHead for 18.4.1 (packs/node/licenses/eslint-plugin-n/
  # UPSTREAM.md; the generator's UPSTREAM_COMMIT).
  commit: f1d47aff402b9e009578f4b3155b84f7d8beef9b
  version: 18.4.1
  license: MIT
  runtime: eslint-plugin-n-18.4.1
  # The plugin's flat recommended configuration, `configs["flat/recommended"]`: flat/recommended-script or
  # flat/recommended-module by the type of the package.json ESLint runs in, with the same 14 rules on without options
  # (only no-unsupported-features/es-syntax's `ignores` differs, a rule the pack does not port). `flat/mixed-esm-and-cjs`,
  # which the generator follows to give each file its own module system, is the same two configurations by file type,
  # so listing it second would change no result. `flat/all` turns every rule that is not deprecated on and is not a
  # recommendation; the legacy `recommended*` keys are the eslintrc forms of the same configurations.
  recommended_configs:
    - flat/recommended
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".cjs", ".js", ".mjs"]
popularity:
  observed_on: 2026-10-28
  evidence:
    - "npm: 4,547,256 downloads of eslint-plugin-n in the week 2026-10-19 to 2026-10-25 (api.npmjs.org)"
    - "GitHub: eslint-community/eslint-plugin-n has 348 stars and is not archived; it is the maintained fork of mysticatea/eslint-plugin-node (956 stars)"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
