    deprecated: null
    recommended: null
  "n/exports-style":
    deprecated: null
    recommended: null
  "n/global-require":
    deprecated: null
    recommended: null
  "n/handle-callback-err":
    deprecated: null
    recommended: null
  "n/hashbang":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "n/no-callback-literal":
    deprecated: null
    recommended: null
  "n/no-deprecated-api":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "n/no-exports-assign":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "n/no-mixed-requires":
    deprecated: null
    recommended: null
  "n/no-new-require":
    deprecated: null
    recommended: null
  "n/no-path-concat":
    deprecated: null
    recommended: null
  "n/no-process-env":
    deprecated: null
    recommended: null
  "n/no-process-exit":
    deprecated: null
    recommended: { config: "flat/recommended", options: [] }
  "n/no-sync":
    deprecated: null
    recommended: null
  "n/prefer-global/buffer":
    deprecated: null
    recommended: null
  "n/prefer-global/console":
    deprecated: null
    recommended: null
  "n/prefer-global/process":
    deprecated: null
    recommended: null
  "n/prefer-global/text-decoder":
    deprecated: null
    recommended: null
  "n/prefer-global/text-encoder":
    deprecated: null
    recommended: null
  "n/prefer-global/url":
    deprecated: null
    recommended: null
  "n/prefer-global/url-search-params":
    deprecated: null
    recommended: null
  "n/prefer-node-protocol":
    deprecated: null
    recommended: null
  "n/prefer-promises/dns":
    deprecated: null
    recommended: null
  "n/prefer-promises/fs":
