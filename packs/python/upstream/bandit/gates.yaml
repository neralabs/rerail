  - rule: bandit-b324-hashlib-insecure-functions
    differing_files: 6
  # Not in NRV's goldens yet: rerail's real-code run found it differing on rerail:django's django/utils/xmlutils.py,
  # where divergences.json declares Bandit wrong (NER-1936).
  - rule: bandit-b406-import-xml-sax
    differing_files: 1
  - rule: bandit-b504-ssl-with-no-version
    differing_files: 1
  - rule: bandit-b506-yaml-load
    differing_files: 1
