# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). The generator reads fixtures.json's examples/ files; a file added to examples/ may fire a ported test. Each
# test's code is the plugin that declares its id (B3xx and B4xx: the blacklists).
watch:
  tests:
    - { file: "fixtures.json" }
  code: []
  shared:
    - "bandit/core/**"
  new-tests:
    - "examples/**"
  rules:
    "B101": { code: ["bandit/plugins/asserts.py"] }
