  - rule: bandit-b607-start-process-with-partial-path
    differing_files: 19
  - rule: bandit-b608-hardcoded-sql-expressions
    differing_files: 8
  - rule: bandit-b611-django-rawsql-used
    differing_files: 2
  - rule: bandit-b613-trojansource
