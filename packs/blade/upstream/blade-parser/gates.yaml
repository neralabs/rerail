adapter: blade-parser
# stillat/blade-parser's documents in rerail's blade pack.
rerail:
  pack: blade
  project: blade-parser
upstream:
  name: stillat/blade-parser
  repository: https://github.com/stillat/blade-parser
  # The release rerail's blade pack ports (packs/blade/licenses/blade-parser/UPSTREAM.md: stillat/blade-parser 2.1.0,
  # the conformance.json tools entry); tag v2.1.0.
  commit: 23a962f99bca451f8738ed2475a70129fb33f07c
  version: 2.1.0
  license: MIT
  # The Composer package with the laravel/framework it runs on, run on PHP 8.5.11 (runtimes/blade/.php-version, the
  # interpreter the pack's expected findings were derived with). It is the runtime the Blade toolkit reads templates
  # with (laravel/framework 13.34.0 and stillat/blade-parser 2.1.0, each pinned exactly), reused rather than copied:
  # one install.
  runtime: blade
  # stillat/blade-parser's validators run by default as its package configuration lists them: config/validation.php's
  # `core_validators`, which ValidatorServiceProvider merges under `blade.validation` and adds to every BladeValidator
  # (`php artisan blade:validate`, Document::withCoreValidators), each loaded with that file's `options` for it ("The
  # validators in this list will be added to BladeValidator instances automatically"). That is the only configuration
  # upstream ships, and all four ported validators are in the list, so each is `recommended` with it and starts on once
  # shipped.
  #
  # The expected findings are upstream/blade-parser/generate.py's: its docstring says how it runs each ported validator
  # over the templates the validators' tests hand the parser, and holds a validator's findings on its own templates to
  # the count and messages its test expects.
  recommended_configs:
    - blade.validation
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".blade.php"]
popularity:
  observed_on: 2026-10-20
  evidence:
    - "Packagist: 2,355,299 installs of stillat/blade-parser in total, 269,991 in the last 30 days (packagist.org/packages/stillat/blade-parser/stats.json)"
    - "GitHub: stillat/blade-parser has 148 stars and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "ComponentShorthandVariableParameterValidator":
    deprecated: null
    recommended: { config: "blade.validation", options: [] }
  "DebugDirectiveValidator":
    deprecated: null
    recommended: { config: "blade.validation", options: [{"custom_directives":[],"ignore_directives":["livewire"]}] }
  "DuplicateConditionExpressionsValidator":
    deprecated: null
    recommended: { config: "blade.validation", options: [{"ignore_directives":["livewire"]}] }
  "ForElseStructureValidator":
    deprecated: null
    recommended: { config: "blade.validation", options: [] }
# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). The generator also reads NoArgumentsTest.php and RequiredArgumentsTest.php, which conformance.json does not
# map; DebugDirectiveTest's cases come from the Compiler's directives, so src/Compiler is its test input too.
watch:
  extra-rules: ["NoArgumentsValidator", "RequiredArgumentsValidator"]
  tests: []
  code:
    - "src/Validation/Validators/{rule}.php"
  shared:
    - "config/validation.php"
    - "src/Document/**"
    - "src/Nodes/**"
    - "src/Parser/**"
    - "src/Validation/AbstractNodeValidator.php"
    - "src/Validation/Validators/Concerns/**"
  rules:
    "ComponentShorthandVariableParameterValidator": { tests: ["tests/Validation/ComponentShorthandVariableParameterTest.php"] }
    "DebugDirectiveValidator": { tests: ["tests/Validation/DebugDirectiveTest.php", "src/Compiler/**"] }
    "DuplicateConditionExpressionsValidator": { tests: ["tests/Validation/DuplicateConditionExpressionsTest.php"] }
    "ForElseStructureValidator": { tests: ["tests/Validation/ForElseStructureTest.php"] }
    "NoArgumentsValidator": { tests: ["tests/Validation/NoArgumentsTest.php"] }
    "RequiredArgumentsValidator": { tests: ["tests/Validation/RequiredArgumentsTest.php"] }
