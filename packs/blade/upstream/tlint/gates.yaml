adapter: tlint
# tlint's documents in rerail's blade pack.
rerail:
  pack: blade
  project: tlint
upstream:
  name: tighten/tlint
  repository: https://github.com/tighten/tlint
  # The release rerail's blade pack records (packs/blade/licenses/tlint/UPSTREAM.md: tlint 9.7.0, the conformance.json
  # tools entry); tag v9.7.0.
  commit: e768bedce2bd84930712f9412ecbf2d4c586735c
  version: 9.7.0
  license: MIT
  # The Composer package, run on PHP 8.5.11 (runtimes/tlint-9.7.0/.php-version, the interpreter the pack's conformance
  # recordings were made with), with the nikic/php-parser its preset's PHP linters parse every file with.
  runtime: tlint-9.7.0
  # tlint ships two presets and no other configuration: "TLint Ships with 2 \"preset\" styles: Laravel & Tighten ... The
  # default configuration is \"tighten\" flavored" (readme, Linting Configuration; src/Config.php falls back to
  # TightenPreset when tlint.json names none). Both are recommendations, the default first: the Laravel preset is
  # "intended to match the conventions agreed upon by the Laravel framework contributors". The Tighten preset turns on
  # all five ported lints, so each is `recommended` with it and ships on; none takes an option.
  #
  # How the adapter applies it (decisions for the team; they hold for every tlint pack):
  # - Gate 5 runs each lint with that preset as `tlint lint <file>` runs a file (LintCommand::lintFile: every linter of
  #   the preset that applies to the path, in the preset's order). A file one of the preset's PHP linters cannot parse
  #   gets tlint's parse error as its only lint, so tlint gives no answer on it for the ported lints: the case is
  #   skipped and the corpus file excluded, with tlint's message.
  # - The cases are the templates the tests of tlint's Blade linters (tests/Linting/Linters/<Lint>Test.php, every
  #   linter that uses LintsBladeTemplates) hand the linter, one per test method, captured as the linter receives them:
  #   tlint's tests are inline Blade strings, so each case is its own source (`<test file>#<test method>`), committed as
  #   packs/blade/upstream/tlint/fixtures/<Lint>Test/<n>.blade.php, the copies upstream/tlint/generate.py wrote. A
  #   lint's cases are every Blade linter's templates, not its own alone: they are Blade templates any Blade lint reads,
  #   so another lint's template is upstream's answer on code the rule must stay silent on.
  # - The tests assert the lines of the lints they index (`$lints[0]->getNode()->getLine()`) and `assertEmpty`: the
  #   `upstream-tests-agree` tool-pack check runs every test method of every Blade linter against the installed tlint
  #   and holds each assertion as PHPUnit checks it, and tlint's output is the positional answer.
  # - Positions are tlint's line, lines split at \r\n, \r and \n, with no column and no end (span-units/tlint.ts).
  recommended_configs:
    - tighten
    - laravel
popularity:
  observed_on: 2026-10-20
  evidence:
    - "Packagist: 1,374,160 installs of tightenco/tlint in total, 28,025 in the last 30 days (packagist.org/packages/tightenco/tlint/stats.json)"
    - "GitHub: tighten/tlint has 530 stars and is not archived"
known_gaps: []
