adapter: tlint
# tlint's documents in rerail's blade pack.
rerail:
  pack: blade
  project: tlint
upstream:
  name: tighten/tlint
  repository: https://github.com/tighten/tlint
  # The release rerail's blade pack ports (packs/blade/licenses/tlint/UPSTREAM.md: tlint 9.7.0, the conformance.json
  # tools entry); tag v9.7.0.
  commit: e768bedce2bd84930712f9412ecbf2d4c586735c
  version: 9.7.0
  license: MIT
  # The Composer package, run on PHP 8.5.11 (runtimes/tlint-9.7.0/.php-version, the interpreter the pack's expected
  # findings were derived with), with the nikic/php-parser its preset's PHP linters parse every file with.
  runtime: tlint-9.7.0
  # tlint ships two presets and no other configuration: "TLint Ships with 2 \"preset\" styles: Laravel & Tighten ... The
  # default configuration is \"tighten\" flavored" (readme, Linting Configuration; src/Config.php falls back to
  # TightenPreset when tlint.json names none). Both are recommendations, the default first: the Laravel preset is
  # "intended to match the conventions agreed upon by the Laravel framework contributors". The Tighten preset turns on
  # all five ported lints, so each is `recommended` with it and starts on once shipped; none takes an option.
  #
  # How the expected findings are made (the configuration, options and parser upstream runs with) is the
  # generator's own header: packs/blade/upstream/tlint/generate.py.
  recommended_configs:
    - tighten
    - laravel
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".blade.php"]
popularity:
  observed_on: 2026-10-20
  evidence:
    - "Packagist: 1,374,160 installs of tightenco/tlint in total, 28,025 in the last 30 days (packagist.org/packages/tightenco/tlint/stats.json)"
    - "GitHub: tighten/tlint has 530 stars and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "NoDumpDirectives":
    deprecated: null
    recommended: { config: "tighten", options: [] }
  "NoJsonDirective":
    deprecated: null
    recommended: { config: "tighten", options: [] }
  "NoRayDirective":
    deprecated: null
    recommended: { config: "tighten", options: [] }
  "SpaceAfterBladeDirectives":
    deprecated: null
    recommended: { config: "tighten", options: [] }
  "SpacesAroundBladeRenderContent":
    deprecated: null
    recommended: { config: "tighten", options: [] }
# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). The generator also reads NoSpaceAfterBladeDirectivesTest.php, which conformance.json does not map.
watch:
  extra-rules: ["NoSpaceAfterBladeDirectives"]
  tests:
    - "tests/Linting/Linters/{rule}Test.php"
  code:
    - "src/Linters/{rule}.php"
  shared:
    - "src/BaseLinter.php"
    - "src/Commands/LintCommand.php"
    - "src/Linters/Concerns/LintsBladeTemplates.php"
    - "src/Presets/LaravelPreset.php"
    - "src/Presets/TightenPreset.php"
    - "src/TLint.php"
