adapter: bladestan
# Bladestan's documents in rerail's blade pack.
rerail:
  pack: blade
  project: bladestan
upstream:
  name: TomasVotruba/bladestan
  # The repository packs/blade/licenses/bladestan/UPSTREAM.md names; GitHub now serves it as bladestan/bladestan.
  repository: https://github.com/TomasVotruba/bladestan
  # The release rerail's blade pack ports (packs/blade/licenses/bladestan/UPSTREAM.md: Bladestan 0.11.7, the
  # conformance.json tools entry); tag 0.11.7.
  commit: ceb0823cd4b4f400b64a008cace0d91e786a2859
  version: 0.11.7
  license: MIT
  # The Composer package with the PHPStan it runs (phpstan/phpstan 2.2.16, the PHPStan the ported rules name) and the
  # development dependencies its own rule test runs with (laravel/framework 13.34.0, larastan 3.12.3, livewire 4.4.7,
  # orchestra/testbench 11.3.0 and its core 11.5.0, phpunit 12.5.38; nikic/php-parser 5.9.0, which Bladestan compiles
  # templates with), on PHP 8.5.11 (runtimes/bladestan-0.11.7/.php-version, the interpreter the pack's expected
  # findings were derived with).
  runtime: bladestan-0.11.7
  # Bladestan has no configuration of its own besides the PHPStan extension it ships (config/extension.neon, which
  # PHPStan's extension installer includes; README "Configure"): which rules run over a compiled template is the
  # PHPStan level the project runs at. PHPStan recommends none of its levels over the others, and the one it runs
  # without one is level 0 (phpstan.org/user-guide/rule-levels, "The default level is 0"), as php/phpstan reads it.
  # Level 0 registers DefinedVariableRule (variable.undefined), PrintfParametersRule (argument.sprintf) and
  # DuplicateKeysInLiteralArraysRule (array.duplicateKey): those three documents are `recommended` and start on once
  # shipped. The other five start off once shipped: IfConstantConditionRule (if.alwaysTrue, if.alwaysFalse) and
  # StrictComparisonOfDifferentTypesRule (identical.alwaysTrue) are level 4's, RandomIntParametersRule (argument.type)
  # level 5's and MissingFunctionReturnTypehintRule (missingType.return) level 6's.
  #
  # How the expected findings are made (the configuration, options and parser upstream runs with) is the
  # generator's own header: packs/blade/upstream/bladestan/generate.py.
  recommended_configs:
    - level0
  # The file types upstream lints with its approved configuration at the pins (declared; reviewed at each bump).
  lints: [".blade.php"]
popularity:
  observed_on: 2026-10-20
  evidence:
    - "Packagist: 1,000,586 installs of tomasvotruba/bladestan in total, 111,681 in the last 30 days (packagist.org/packages/tomasvotruba/bladestan/stats.json)"
    - "GitHub: bladestan/bladestan (formerly TomasVotruba/bladestan) has 377 stars and is not archived"
# Every rule of the pinned upstream the pack ports or may port, with upstream's deprecation and the first approved
# configuration that turns it on (declared; reviewed at each bump).
rules:
  "argument.sprintf":
    deprecated: null
    recommended: { config: "level0", options: [] }
  "argument.type":
    deprecated: null
    recommended: null
  "array.duplicateKey":
    deprecated: null
    recommended: { config: "level0", options: [] }
  "identical.alwaysTrue":
    deprecated: null
    recommended: null
  "if.alwaysFalse":
    deprecated: null
    recommended: null
  "if.alwaysTrue":
    deprecated: null
    recommended: null
  "missingType.return":
    deprecated: null
    recommended: null
  "variable.undefined":
    deprecated: null
    recommended: { config: "level0", options: [] }
# What the nightly upstream report compares between the pins and upstream's latest release (docs/pack-format.md,
# "watch"). The generator copies tests/skeleton/ and runs tests/Rules/. The ported identifiers are PHPStan's rules run over
# the compiled templates, so only Bladestan's compiler and error mapping are watched, as shared code.
watch:
  tests:
    - "tests/Rules/**"
    - "tests/skeleton/**"
  # No rule code here: the ported identifiers' rules are phpstan/phpstan-src's, which packs/php/upstream/phpstan watches.
  code: []
  shared:
    - "composer.json"
    - "config/extension.neon"
    - "src/Blade/PhpLineToTemplateLineResolver.php"
    - "src/Compiler/BladeToPHPCompiler.php"
    - "src/ErrorReporting/Blade/TemplateErrorsFactory.php"
    - "src/PhpParser/NodeVisitor/**"
    - "src/TemplateCompiler/ErrorFilter.php"
