# cargo-nextest (docs/final-shape/notes/t37, §2): each test in a process of its own, with its time.
#
#   cargo nextest run --lib                    the quick tier: everything but the slow tests
#   cargo nextest run --lib --profile gate     everything, the slow tier too (a phase gate)
#
# A filter on the command line narrows the profile's tier; `--ignore-default-filter` drops it
# (`cargo nextest run --lib --ignore-default-filter some_slow_test`).

# The slow tier: the tests that took 20 s or more each in a full run (2026-11-15, an M3 Max at
# -j 16, debug): 45 of 2,639 tests (the per-pack families whole), 2,151 of the run's 3,460 test-seconds. Most read every pack's
# programs, or every authored rule file, end to end. A test that grows past 20 s joins here.
[profile.default]
default-filter = """not (
    binary(=git_revision_cli)
  | test(/^code_rule_dsl::logic::convert::tests::(a_sample_of_the_replay_gives_the_recorded_findings|the_pack_holds_the_converters_run_over_every_authored_file|reference_tests::reference_edge_is_ws_reference_graph_on_the_fixtures)$/)
  | test(/^code_rule_dsl::logic::rr::tests::(dropping_unreached_clauses_prunes_to_the_same_program|lowering_is_idempotent|library_modules_link_to_the_lowering_of_them_together)/)
  | test(=code_rule_dsl::logic::rr::tests::rule_syntax_files_pass_check_rr)
  | test(=code_rule_dsl::logic::rr::tests::library_modules_link_to_the_lowering_of_them_together)
  | test(/^code_rule_dsl::logic::program_image::tests::(pack_programs_read_back_from_their_images|the_passes_over_a_version_are_the_tree_passes|the_planners_reading_of_a_rule_is_the_trees|the_analyses_over_a_version_say_what_the_tree_says|views_and_overlays_are_the_programs_they_say)$/)
  | test(=code_rule_dsl::logic::program_text::tests::pack_programs_read_back_from_their_text)
  | test(=code_rule_dsl::transducer::packed::metal_program_backend::tape_tests::the_label_kernels_compile_for_every_format)
  | test(=code_rule_dsl::logic::json_rules::tests::json_rules_pack_is_current)
  | test(=code_rule_dsl::slice::tests::an_edit_reruns_its_file_and_a_whitespace_edit_cuts_off)
  | test(=code_rule_dsl::slice::napi_tests::the_napi_slice_audits_and_applies_as_the_slice_does)
  | test(/^code_rule_dsl::transducer::packed::compile_matcher_tests::(spilled_walks_find_the_cpus_roots|micro_walks_are_the_interpreters_label_outputs|lowered_python_clauses_match_where_ws_matcher_does|the_gate_catches_a_widened_walk|a_misplanned_label_sweep_runs_again_and_finds_the_full_budgets_roots|on_metal_an_unfinished_pass_goes_to_w_where_w_costs_less_and_runs_again_where_it_does_not|replan_finds_the_full_budgets_roots_on_the_pack|on_metal_replan_finds_the_full_budgets_roots_on_the_pack|lowered_clauses_find_the_same_roots_on_metal|root_walks_with_text_are_the_interpreters_roots|anchor_rows_per_answer|formula_rows_are_the_sets_members|anchored_walks_find_the_unanchored_roots|on_metal_anchored_walks_find_the_unanchored_roots)$/)
  | test(=code_rule_dsl::transducer::packed::tests::all_backends_execute_every_verified_instruction_and_mode)
  | test(=code_rule_dsl::transducer::packed::metal_semantic_conformance::phase_four::capture_operators::ordinary_capture_operators_apply_the_complete_truth_table_at_the_assertion)
  | test(=code_rule_dsl::sql_executor::tests::recovery::original_cpython_programs_use_private_projections_and_bounded_join_work)
  | test(=code_rule_dsl::sql_executor::tests::recursive::partitioned_recursive_lattices_remove_cycles_with_bounded_work_and_match_fresh)
  | test(=code_rule_dsl::sql_executor::tests::reductions::dependent_aggregate_keys_follow_old_and_new_dependencies_without_scanning_contexts)
  | test(/^code_rule_dsl::waves::matches::tests::the_wave_/)
  | test(=class_pack::tests::random_needs_are_answered)
  | package(rerail-c-directives)
  | (package(rerail-kotlin-parser) & test(/^tests::(walk_lemmas_keep_the_tapes|a_cold_compile_makes_the_shipped_answers_program)$/))
)"""
# A test past this is reported as slow; past four periods it is stopped.
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "final"

# rerail-c-directives: each test compiles a C grammar through Cranelift in its own process
# (70–80 s in a debug build on an M3 Max), and the token tests two (C's and C++'s).
[[profile.default.overrides]]
filter = "package(rerail-c-directives)"
slow-timeout = { period = "60s", terminate-after = 8 }

# The FSEvents tests (the store's journal and observer, the engine's tree watch): each waits on the journal's cookies,
# which `fseventsd` tells every stream of the machine in turn. Run at once, they push one another's notices past their
# waits (Q320: 11 of 51 failed together on an M3, none alone): one at a time, beside everything else.
[test-groups]
fsevents = { max-threads = 1 }

[[profile.default.overrides]]
platform = "cfg(target_os = \"macos\")"
filter = "test(/^(content_store::(observe|journal)|tree_watch)::/)"
test-group = "fsevents"

# Kotlin's grammar compiled cold (no shipped answers, 0414: 41 s on a Linux Spark): without the walk lemmas,
# and twice to compare programs. The rest of the crate's tests compile with the answers, in 1.5 s (Q371).
[[profile.default.overrides]]
filter = "package(rerail-kotlin-parser) & test(/^tests::(walk_lemmas_keep_the_tapes|a_cold_compile_makes_the_shipped_answers_program)$/)"
slow-timeout = { period = "60s", terminate-after = 8 }

[profile.default.junit]
path = "junit.xml"

# The warm tier (Q332): what a run over a kept store does to the files that did not change, by count, in seconds
# (`cargo nextest run -p rerail-tests-logic --lib --profile warm`). A warm run that parses, builds or
# makes an unchanged file, writes again, hashes or binds an input whole, or counts a kept statistic again fails here.
[profile.warm]
default-filter = "test(/::warm_tests::|::the_run_after_a_cold_one|maintain_tests::r2_|made_batch_tests::|cross_views_tests::a_session_holds_its_corpus_batch|base_tests::a_copy_of_any_inputs_columns_is_held_in_place/)"
slow-timeout = { period = "30s", terminate-after = 2 }
failure-output = "immediate"

# Everything. The longest test (convert's replay sample, ~230 s on an M3 Max) bounds its wall time.
[profile.gate]
default-filter = "all()"

[profile.gate.junit]
path = "junit.xml"

# The preprocessor's evaluation tests, each stopped at 1 s and failed (the user, 2026-11-20: "you
# may not run tests over 1 second; none of these cases should take more than a few milliseconds").
#   cargo nextest run -p rerail-c-directives --lib --profile second
[profile.second]
default-filter = "package(rerail-c-directives) & test(/^eval::tests::/)"
slow-timeout = { period = "1s", terminate-after = 1 }
failure-output = "final"
# Past the default profile's override for the package (which every profile takes), the second's.
[[profile.second.overrides]]
filter = "package(rerail-c-directives)"
slow-timeout = { period = "1s", terminate-after = 1 }
