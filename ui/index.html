<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rerail</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/tokens.generated.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/sheet.css" />
    <link rel="stylesheet" href="/css/overview.css" />
    <link rel="stylesheet" href="/css/pack.css" />
    <link rel="stylesheet" href="/css/packs.css" />
    <link rel="stylesheet" href="/css/create.css" />
    <link rel="stylesheet" href="/css/history.css" />
    <link rel="stylesheet" href="/css/sessions.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="stylesheet" href="/css/no-repo.css" />
    <link rel="stylesheet" href="/css/missing.css" />
    <link rel="stylesheet" href="/css/not-set-up.css" />
    <script>
      // Apply the persisted theme and sidebar before first paint so the page never flashes.
      try {
        const t = localStorage.getItem("rerail-ui-theme");
        if (t) document.documentElement.dataset.theme = t;
        if (localStorage.getItem("rerail-nav-hidden") === "1") document.documentElement.dataset.nav = "hidden";
      } catch {}
    </script>
  </head>
  <body data-view="overview">
    <div class="canvas" aria-hidden="true"></div>
    <div class="frame">
      <header class="topbar">
        <div class="tbin">
          <button class="navtoggle" id="navToggle" data-act="navtoggle" aria-controls="sidenav" aria-pressed="true" title="Hide the menu">
            <svg class="ico" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M216,36H40A20,20,0,0,0,20,56V200a20,20,0,0,0,20,20H216a20,20,0,0,0,20-20V56A20,20,0,0,0,216,36ZM44,60H92V196H44Zm168,136H116V60h96Z"/></svg>
            <span class="lbl">Hide menu</span>
          </button>
          <h1>Rerail</h1>
          <div class="repopick" id="repopick"></div>
          <div class="status" id="status" role="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="statusText">Connecting…</span>
          </div>
        </div>
      </header>
      <div class="shell">
        <div class="cwrap">
          <nav class="sidenav" id="sidenav" aria-label="Navigator"></nav>
          <main class="cmain">
            <div id="content"></div>
          </main>
        </div>
      </div>
      <div class="scrim" id="scrim" data-act="close" aria-hidden="true"></div>
      <aside class="panel" id="panel" aria-label="Detail"></aside>
    </div>
    <div id="repolayer"></div>
    <output class="toast" id="toast"></output>
    <script type="module" src="/app.js"></script>
  </body>
</html>
