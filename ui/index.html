<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rerail</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/tokens.generated.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/sheet.css" />
    <link rel="stylesheet" href="/css/overview.css" />
    <link rel="stylesheet" href="/css/pack.css" />
    <link rel="stylesheet" href="/css/packs.css" />
    <link rel="stylesheet" href="/css/create.css" />
    <link rel="stylesheet" href="/css/history.css" />
    <link rel="stylesheet" href="/css/sessions.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="stylesheet" href="/css/no-repo.css" />
    <link rel="stylesheet" href="/css/missing.css" />
    <link rel="stylesheet" href="/css/not-set-up.css" />
    <script>
      // Apply the persisted theme before first paint so the page never flashes.
      try {
        const t = localStorage.getItem("rerail-ui-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body data-view="overview">
    <div class="canvas" aria-hidden="true"></div>
    <div class="frame">
      <header class="topbar">
        <div class="tbin">
          <h1>Rerail</h1>
          <div class="repopick" id="repopick"></div>
          <span class="ownerctl" id="ownerCtl" hidden>
            <span>Changes apply to</span>
            <span class="seg2" role="group" aria-label="Changes apply to">
              <button data-act="owner" data-i="checkout" aria-pressed="true">This worktree</button>
              <button data-act="owner" data-i="repository" aria-pressed="false">Repository</button>
            </span>
          </span>
          <div class="status" id="status" role="status" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="statusText">Connecting…</span>
          </div>
          <button class="themebtn" id="themeBtn" data-act="theme" data-i="light" aria-label="Theme">
            <svg class="ico" viewBox="0 0 256 256" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M128,20A108,108,0,1,0,236,128,108.12,108.12,0,0,0,128,20Zm0,192a84,84,0,0,1,0-168Z"/></svg>
          </button>
        </div>
      </header>
      <div class="shell">
        <div class="cwrap">
          <nav class="sidenav" id="sidenav" aria-label="Navigator"></nav>
          <main class="cmain">
            <div id="content"></div>
          </main>
        </div>
      </div>
      <div class="scrim" id="scrim" data-act="close" aria-hidden="true"></div>
      <aside class="panel" id="panel" aria-label="Detail"></aside>
    </div>
    <div id="repolayer"></div>
    <output class="toast" id="toast"></output>
    <script type="module" src="/app.js"></script>
  </body>
</html>
